            {"data":{"leading":false,"html":"&lt;p&gt;This section presents a collection of answers to user questions arising when getting to know or using the YTsaurus system.&lt;/p&gt;\n&lt;p&gt;If you do not find an answer to your question in this section, please review &lt;a href=\"user-guide/problems/howtoreport.html\"&gt;Reporting an issue&lt;/a&gt;.&lt;/p&gt;\n&lt;h2 id=\"common\"&gt;&lt;a href=\"en/faq/index.html#common\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;General questions&lt;/span&gt;&lt;/a&gt;General questions&lt;/h2&gt;\n&lt;h4 id=\"add-column-to-table\"&gt;&lt;a href=\"en/faq/index.html#add-column-to-table\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q: How do I add a column to a YTsaurus table?&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;Q: How do I add a column to a YTsaurus table?&lt;/strong&gt;&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;A:&lt;/strong&gt; You need to retrieve the current table schema:&lt;/p&gt;\n&lt;p&gt;&lt;code&gt;yt get //home/maps-nmaps/production/pedestrian/address_tasks/@schema --format '&amp;lt;format=text&amp;gt;yson'&lt;/code&gt;&lt;/p&gt;\n&lt;p&gt;And replace it with a new one:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;yt alter-table //home/maps-nmaps/testing/pedestrian/address_tasks --schema &lt;span class=\"hljs-string\"&gt;'&amp;lt;\"unique_keys\"=%false;\"strict\"=%true;&amp;gt;[{\"name\"=\"timestamp\";\"required\"=%false;\"type\"=\"uint64\";\"sort_order\"=\"ascending\";};{\"name\"=\"lon\";\"required\"=%false;\"type\"=\"double\";};{\"name\"=\"lat\";\"required\"=%false;\"type\"=\"double\";};{\"name\"=\"buildingId\";\"required\"=%false;\"type\"=\"string\";};{\"name\"=\"taskId\";\"required\"=%false;\"type\"=\"string\";};{\"name\"=\"pedestrianType\";\"required\"=%false;\"type\"=\"string\";};{\"name\"=\"buildingPerimeter\";\"required\"=%false;\"type\"=\"double\";};{\"name\"=\"buildingShape\";\"required\"=%false;\"type\"=\"string\";};]'&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"21\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-21\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-21\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-21.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;hr /&gt;\n&lt;h4 id=\"change-schema-strict-error\"&gt;&lt;a href=\"en/faq/index.html#change-schema-strict-error\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q: I get the following error when I attempt to change a table schema: Changing \"strict\" from \"false\" to \"true\" is not allowed. What should I do?&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;Q: I get the following error when I attempt to change a table schema: Changing \"strict\" from \"false\" to \"true\" is not allowed. What should I do?&lt;/strong&gt;&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;A:&lt;/strong&gt; You cannot change the schema of a non-empty table from weak to strict since the entire table must be read to validate this action to make sure that the data match the new schema. It is easiest to create a new table and copy data from the old one via a read+write or by launching a &lt;a href=\"user-guide/data-processing/operations/merge.html\"&gt;Merge&lt;/a&gt; transaction.&lt;/p&gt;\n&lt;hr /&gt;\n&lt;h4 id=\"yt-console-authorization\"&gt;&lt;a href=\"en/faq/index.html#yt-console-authorization\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q: How do I authorize when communicating with YT through the console?&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;Q: How do I authorize when communicating with YT through the console?&lt;/strong&gt;&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;A:&lt;/strong&gt; You have to save the required user's token to a file called &lt;code&gt;~/.yt/token&lt;/code&gt;.&lt;/p&gt;\n&lt;hr /&gt;\n&lt;h4 id=\"reduce-replication-factor\"&gt;&lt;a href=\"en/faq/index.html#reduce-replication-factor\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q: Can I reduce the replication factor for temporary tables in the native C++ wrapper?&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;Q: Can I reduce the replication factor for temporary tables in the native C++ wrapper?&lt;/strong&gt;&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;A:&lt;/strong&gt; No, the wrapper does not include this capability.&lt;/p&gt;\n&lt;hr /&gt;\n&lt;h4 id=\"bad-magic-number\"&gt;&lt;a href=\"en/faq/index.html#bad-magic-number\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q: The python wrapper produces error \"ImportError: Bad magic number in ./modules/yt/init.pyc\". What should I do?&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;Q: The python wrapper produces error \"ImportError: Bad magic number in ./modules/yt/&lt;strong&gt;init&lt;/strong&gt;.pyc\". What should I do?&lt;/strong&gt;&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;A:&lt;/strong&gt; This error results from a python version mismatch between the client running the script and your cluster. To run, use the same python version as on the cluster. You can retrieve the current version as follows:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;yt vanilla --tasks &lt;span class=\"hljs-string\"&gt;'{master = {job_count = 1; command = \"python --version &amp;gt;&amp;amp;2\"}}'&lt;/span&gt;\nPython 2.7.3\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"50\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-50\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-50\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-50.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Python versions on different cluster nodes may differ. It is better to use your own proto layer to run jobs.&lt;/p&gt;\n&lt;hr /&gt;\n&lt;h4 id=\"reading-small-ranges-overhead\"&gt;&lt;a href=\"en/faq/index.html#reading-small-ranges-overhead\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q: What is the overhead for reading small table ranges and small tables?&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;Q: What is the overhead for reading small table ranges and small tables?&lt;/strong&gt;&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;A:&lt;/strong&gt; Small ranges do not create overhead since only the relevant blocks are read from disk. At the same time, all static table reads require requests for metadata to the master server. In this case, communication with the master server is the bottleneck. Therefore, we recommend using a smaller number of queries (larger parts) to read static tables minimizing master server load. Or restructuring your process to read from dynamic tables.&lt;/p&gt;\n&lt;hr /&gt;\n&lt;h4 id=\"store-hex-numbers-keys\"&gt;&lt;a href=\"en/faq/index.html#store-hex-numbers-keys\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q: Can hex numbers be stored efficiently in keys instead of strings?&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;Q: Can hex numbers be stored efficiently in keys instead of strings?&lt;/strong&gt;&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;A:&lt;/strong&gt; They can using the &lt;a href=\"user-guide/storage/formats.html#yson\"&gt;YSON&lt;/a&gt; or the &lt;a href=\"user-guide/storage/formats.html#json\"&gt;JSON&lt;/a&gt; format.&lt;/p&gt;\n&lt;hr /&gt;\n&lt;h4 id=\"logging-levels-console-client\"&gt;&lt;a href=\"en/faq/index.html#logging-levels-console-client\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q: What are the logging levels in the console client and how can I select them?&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;Q: What are the logging levels in the console client and how can I select them?&lt;/strong&gt;&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;A:&lt;/strong&gt; You can select logging levels via the &lt;code&gt;YT_LOG_LEVEL&lt;/code&gt; environment variable with &lt;code&gt;INFO&lt;/code&gt; being the default. You can change the logging level using the &lt;code&gt;export YT_LOG_LEVEL=WARNING&lt;/code&gt; command. The following logging levels are available:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;INFO&lt;/code&gt;: to display transaction execution progress and other useful information.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;WARNING&lt;/code&gt;: to display warnings. For instance, a query could not be run and is being resubmitted, or a transaction input table is empty. Errors of these types are not critical, and the client can continue running.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;ERROR&lt;/code&gt;: all errors that cause the client to fail. Errors of this type result in an exception. The exception is handled, and the client exits returning a non-zero code.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;hr /&gt;\n&lt;h4 id=\"client-hangs-requeries\"&gt;&lt;a href=\"en/faq/index.html#client-hangs-requeries\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q: When reading a small table using the read command, the client freezes up in a repeat query. What could be the reason?&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;Q: When reading a small table using the read command, the client freezes up in a repeat query. What could be the reason?&lt;/strong&gt;&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;A:&lt;/strong&gt; One of the possible common reasons is too many (small) chunks in a table. We recommend running the &lt;a href=\"user-guide/data-processing/operations/merge.html\"&gt;Merge&lt;/a&gt; operation with the &lt;code&gt;--spec '{force_transform=true}'&lt;/code&gt; option. When such tables come up in operation output, the console client issues a warning containing, among other things, the command you can run to increase the size of the table's chunks. You can also specify the &lt;code&gt;auto_merge_output={action=merge}&lt;/code&gt; option to have a merge occur automatically.&lt;/p&gt;\n&lt;hr /&gt;\n&lt;h4 id=\"account-tmp-over-limit\"&gt;&lt;a href=\"en/faq/index.html#account-tmp-over-limit\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q: An operation returns error \"Account \"tmp\" is over disk space (or chunk) limit\". What is going on?&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;Q: An operation returns error \"Account \"tmp\" is over disk space (or chunk) limit\". What is going on?&lt;/strong&gt;&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;A:&lt;/strong&gt; Your cluster has run out of storage space for temporary data (tmp account), or the account has too many chunks. This account is accessed by all the cluster users which may cause it to become full. You have to keep this in mind, and if using up the tmp quota is critical to your processes, we recommend using a different directory in your own account for temporary data. Some APIs use &lt;code&gt;//tmp&lt;/code&gt; as the default path for storing temporary data. If that is the case, you must reconfigure these to use subdirectories in your project's directory tree.&lt;/p&gt;\n&lt;hr /&gt;\n&lt;h4 id=\"account-intermediate-over-limit\"&gt;&lt;a href=\"en/faq/index.html#account-intermediate-over-limit\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q: An operation fails with error \"Account \"intermediate\" is over disk space (or chunk) limit\". What is going on?&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;Q: An operation fails with error \"Account \"intermediate\" is over disk space (or chunk) limit\". What is going on?&lt;/strong&gt;&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;A&lt;/strong&gt;: Your cluster has run out of storage space for intermediate data (&lt;code&gt;intermediate&lt;/code&gt; account), or the account has too many chunks.&lt;br /&gt;\nUnless you specified &lt;code&gt;intermediate_data_account&lt;/code&gt; (see &lt;a href=\"user-guide/data-processing/operations/operations-options.html\"&gt;Operation settings&lt;/a&gt;, &lt;a href=\"user-guide/data-processing/operations/sort.html\"&gt;Sort&lt;/a&gt;, &lt;a href=\"user-guide/data-processing/operations/mapreduce.html\"&gt;MapReduce&lt;/a&gt;), you are sharing this account with everybody else. To preempt this problem, set &lt;code&gt;intermediate_data_account&lt;/code&gt;.&lt;/p&gt;\n&lt;hr /&gt;\n&lt;h4 id=\"consistent-read-operation\"&gt;&lt;a href=\"en/faq/index.html#consistent-read-operation\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q: Is reading a table (or file) a consistent operation in YTsaurus? What will happen if I am reading a table while deleting it at the same time?&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;Q: Is reading a table (or file) a consistent operation in YTsaurus? What will happen if I am reading a table while deleting it at the same time?&lt;/strong&gt;&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;A:&lt;/strong&gt; On the one hand it is. That is to say that if a read successfully completes, the read will return exactly the data contained in the table or file at the start of the operation. On the other hand, the read may terminate if you delete the table at that time. To avoid this, you need to create a transaction and have it take out a snapshot lock on the table or file. When you are using the python API, including the python CLI, with retry activated for reads, this lock is taken out automatically.&lt;/p&gt;\n&lt;hr /&gt;\n&lt;h4 id=\"backend-type-determination\"&gt;&lt;a href=\"en/faq/index.html#backend-type-determination\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q: When I start a client, I get \"Cannot determine backend type: either driver config or proxy url should be specified\". What should I do?&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;Q: When I start a client, I get \"Cannot determine backend type: either driver config or proxy url should be specified\". What should I do?&lt;/strong&gt;&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;A:&lt;/strong&gt; Check to see whether the &lt;code&gt;YT_PROXY=&amp;lt;cluster-name&amp;gt;&lt;/code&gt; environment variable is set.&lt;/p&gt;\n&lt;hr /&gt;\n&lt;h4 id=\"account-disk-space-limit\"&gt;&lt;a href=\"en/faq/index.html#account-disk-space-limit\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q: What do I do if I get error \"Account \"...\" is over disk space limit (node count limit, etc)\"?&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;Q: What do I do if I get error \"Account \"...\" is over disk space limit (node count limit, etc)\"?&lt;/strong&gt;&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;A:&lt;/strong&gt; This message is an indication that the account is out of one of its quotas. The system has quotas for all kinds of resources. For more information on the types of quotas and for forms to change quotas, see the &lt;a href=\"user-guide/storage/quotas.html\"&gt;Quotas&lt;/a&gt; section.&lt;/p&gt;\n&lt;hr /&gt;\n&lt;h4 id=\"find-account-usage\"&gt;&lt;a href=\"en/faq/index.html#find-account-usage\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q: How do I discover who is taking up space in an account or all the nodes with a specific account?&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;Q: How do I discover who is taking up space in an account or all the nodes with a specific account?&lt;/strong&gt;&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;A:&lt;/strong&gt; Try using one of the following methods to find the relevant data:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;Look in the recycle bin (&lt;code&gt;//tmp/trash/by-account/&amp;lt;account_name&amp;gt;&lt;/code&gt;). To do this, follow the specified path in the web interface's &lt;strong&gt;Navigation&lt;/strong&gt; section.&lt;/li&gt;\n&lt;li&gt;Use &lt;code&gt;yt find &amp;lt;path&amp;gt; --name \"*\" --account &amp;lt;account_name&amp;gt;&lt;/code&gt; to look for your account's tables in &lt;code&gt;//tmp&lt;/code&gt; and in your associated project directories. Please note that &lt;code&gt;yt find&lt;/code&gt; does not look in directories to which you do not have access.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;hr /&gt;\n&lt;h4 id=\"change-table-account\"&gt;&lt;a href=\"en/faq/index.html#change-table-account\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q: How do I change a table's account?&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;Q: How do I change a table's account?&lt;/strong&gt;&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;A:&lt;/strong&gt; &lt;code&gt;yt set //path/to/table/@account my-account&lt;/code&gt;&lt;/p&gt;\n&lt;hr /&gt;\n&lt;h4 id=\"directory-resource-usage\"&gt;&lt;a href=\"en/faq/index.html#directory-resource-usage\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q: How do I find out the total resource usage of a directory, including  all contained tables, files, and so on?&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;Q: How do I find out the total resource usage of a directory, including  all contained tables, files, and so on?&lt;/strong&gt;&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;A:&lt;/strong&gt; &lt;code&gt;yt get //path/to/dir/@recursive_resource_usage&lt;/code&gt; or select &lt;strong&gt;Show all resources&lt;/strong&gt; in the &lt;strong&gt;Navigation&lt;/strong&gt; tab in the web interface.&lt;/p&gt;\n&lt;hr /&gt;\n&lt;h4 id=\"transaction-expired-aborted\"&gt;&lt;a href=\"en/faq/index.html#transaction-expired-aborted\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q: While working with the system, I am getting \"Transaction has expired or was aborted\". What does it mean and how should I deal with it?&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;Q: While working with the system, I am getting \"Transaction has expired or was aborted\". What does it mean and how should I deal with it?&lt;/strong&gt;&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;A:&lt;/strong&gt; When you create a master transaction, you specify a &lt;strong&gt;timeout&lt;/strong&gt;, and a user undertakes to ping the transaction at least once during the specified time interval. If the interval between the moment of creation or the most recent ping is greater than the timeout, the system will terminate the transaction.  There may be several things causing this behavior:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;Network connection issues between client machine and cluster.&lt;/li&gt;\n&lt;li&gt;Client-side issues, such as failure to ping. Pings are either not being sent from the code, or the pinging code is not being called. When using python for instance, this might happen, if there is a long-term GIL lock taken out inside a program to work with some native libraries.&lt;/li&gt;\n&lt;li&gt;There is some maintenance underway on the cluster.&lt;/li&gt;\n&lt;li&gt;There are known access issues.&lt;/li&gt;\n&lt;li&gt;The transaction was explicitly aborted by the client which you can ascertain by reviewing server logs.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;Otherwise, client debug logs are required for a review of the issue. The server side only knows that there are no pings; therefore, you must make sure to activate debug logging and collect the logs. By setting &lt;code&gt;YT_LOG_LEVEL=debug&lt;/code&gt;, for instance, which is suitable for most supported APIs.&lt;/p&gt;\n&lt;hr /&gt;\n&lt;h4 id=\"ownersinspecignored\"&gt;&lt;a href=\"en/faq/index.html#ownersinspecignored\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q: The operation page displays \"owners\" field in spec ignored as it was specified simultaneously with \"acl\"\". What does it mean?&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;Q: The operation page displays \"owners\" field in spec ignored as it was specified simultaneously with \"acl\"\". What does it mean?&lt;/strong&gt;&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;A:&lt;/strong&gt; This message means that the operation spec includes both the deprecated \"owners\" field and the \"acl\" field with preference given to the latter, which means that \"owners\" was ignored.&lt;/p&gt;\n&lt;hr /&gt;\n&lt;h4 id=\"rotate-nodes-expiration\"&gt;&lt;a href=\"en/faq/index.html#rotate-nodes-expiration\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q: How do I automatically rotate nodes deleting those that are older than a certain age?&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;Q: How do I automatically rotate nodes deleting those that are older than a certain age?&lt;/strong&gt;&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;A:&lt;/strong&gt; You should use the &lt;code&gt;expiration_time&lt;/code&gt; attribute. For more information, see &lt;a href=\"user-guide/storage/cypress.html#TTL\"&gt;Metainformation tree.&lt;/a&gt;&lt;/p&gt;\n&lt;hr /&gt;\n&lt;h4 id=\"delete-unused-nodes\"&gt;&lt;a href=\"en/faq/index.html#delete-unused-nodes\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q: How do I automatically delete nodes that have not been in use longer than a specified period of time?&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;Q: How do I automatically delete nodes that have not been in use longer than a specified period of time?&lt;/strong&gt;&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;A:&lt;/strong&gt; You should use the &lt;code&gt;expiration_timeout&lt;/code&gt; attribute. For more information, see &lt;a href=\"user-guide/storage/cypress.html#TTL\"&gt;Metainformation tree.&lt;/a&gt;&lt;/p&gt;\n&lt;hr /&gt;\n&lt;h4 id=\"excessivediskusage\"&gt;&lt;a href=\"en/faq/index.html#excessivediskusage\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q: A running operation displays warning \"Detected excessive disk IO in &amp;lt;job_type&amp;gt; jobs. IO throttling was activated». What does it mean?&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;Q: A running operation displays warning \"Detected excessive disk IO in &amp;lt;job_type&amp;gt; jobs. IO throttling was activated». What does it mean?&lt;/strong&gt;&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;A:&lt;/strong&gt; The operation's jobs are performing many input/output transactions against the local drive. To minimize the negative impact of such behavior on the cluster, jobs were restricted via the &lt;a href=\"https://www.kernel.org/doc/Documentation/cgroup-v1/blkio-controller.txt\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;blkio cgroup throttling&lt;/a&gt; mechanism. For possible reasons of such behavior, please see the examples in the &lt;a href=\"user-guide/problems/jobstatistics.html#excessive_io\"&gt;Job statistics&lt;/a&gt; section.&lt;/p&gt;\n&lt;hr /&gt;\n&lt;h4 id=\"enablepathautocorrection\"&gt;&lt;a href=\"en/faq/index.html#enablepathautocorrection\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q: Which paths does the web interface correct automatically with the Enable path autocorrection setting enabled?&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;Q: Which paths does the web interface correct automatically with the Enable path autocorrection setting enabled?&lt;/strong&gt;&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;A:&lt;/strong&gt; The web interface does not specify which path errors have been corrected.&lt;br /&gt;\nFor instance, a path looking like &lt;code&gt;//home/user/tables/&lt;/code&gt; is always invalid. When the path is displayed in the web interface, the unescaped slash at the end of the path will be stripped.&lt;/p&gt;\n&lt;hr /&gt;\n&lt;h4 id=\"web_interface_table_download\"&gt;&lt;a href=\"en/faq/index.html#web_interface_table_download\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q: How do I find out whether a table from the web interface has successfully downloaded, and if not, look at the error?&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;Q: How do I find out whether a table from the web interface has successfully downloaded, and if not, look at the error?&lt;/strong&gt;&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;A:&lt;/strong&gt; If there is an error, it will be written to the file being downloaded. An error may occur at any time during a download. You need to check the end of the file. Example error:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs json\"&gt;==================================================================&lt;span class=\"hljs-string\"&gt;\" \"&lt;/span&gt;# &lt;span class=\"hljs-string\"&gt;\"\"&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;\"\"&lt;/span&gt;#\n&lt;span class=\"hljs-punctuation\"&gt;{&lt;/span&gt;\n    &lt;span class=\"hljs-string\"&gt;\"code\"&lt;/span&gt; = &lt;span class=\"hljs-number\"&gt;1&lt;/span&gt;;\n    &lt;span class=\"hljs-string\"&gt;\"message\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"Missing key column \\\"key\\\" in record\"&lt;/span&gt;;\n    &lt;span class=\"hljs-string\"&gt;\"attributes\"&lt;/span&gt; = &lt;span class=\"hljs-punctuation\"&gt;{&lt;/span&gt;\n        &lt;span class=\"hljs-string\"&gt;\"fid\"&lt;/span&gt; = &lt;span class=\"hljs-number\"&gt;18446479488923730601&lt;/span&gt;u;\n        &lt;span class=\"hljs-string\"&gt;\"tid\"&lt;/span&gt; = &lt;span class=\"hljs-number\"&gt;9489286656218008974&lt;/span&gt;u;\n        &lt;span class=\"hljs-string\"&gt;\"datetime\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"2017-08-30T15:49:38.645508Z\"&lt;/span&gt;;\n        &lt;span class=\"hljs-string\"&gt;\"pid\"&lt;/span&gt; = &lt;span class=\"hljs-number\"&gt;864684&lt;/span&gt;;\n        &lt;span class=\"hljs-string\"&gt;\"host\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"&amp;lt;cluster_name&amp;gt;\"&lt;/span&gt;;\n    &lt;span class=\"hljs-punctuation\"&gt;}&lt;/span&gt;;\n&lt;span class=\"hljs-punctuation\"&gt;}&lt;/span&gt;\n==================================================================&lt;span class=\"hljs-string\"&gt;\" \"&lt;/span&gt;# &lt;span class=\"hljs-string\"&gt;\"\"&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;\"\"&lt;/span&gt;#\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"246\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-246\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-246\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-246.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;hr /&gt;\n&lt;h4 id=\"domain-name-not-found\"&gt;&lt;a href=\"en/faq/index.html#domain-name-not-found\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q: You are attempting locally to run a program that communicates via RPC in YTsaurus and get back \"Domain name not found»&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;Q: You are attempting locally to run a program that communicates via RPC in YTsaurus and get back \"Domain name not found»&lt;/strong&gt;&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;A:&lt;/strong&gt; In a log, you may also encounter &lt;code&gt;W Dns DNS resolve failed (HostName: your-local-host-name)&lt;/code&gt;. The error occurs when resolving the name of the local host that is not listed in global DNS. The thing is that the YTsaurus RPC client uses IPv6 by default and disables IPv4. That is why the line  &lt;code&gt;127.0.1.1  your-local-host-name&lt;/code&gt; in the local &lt;code&gt;/etc/hosts&lt;/code&gt; file does not work. If you add &lt;code&gt;::1  your-local-host-name&lt;/code&gt; to the above file, it should solve your problem.&lt;/p&gt;\n&lt;hr /&gt;\n&lt;h4 id=\"copy-table-range\"&gt;&lt;a href=\"en/faq/index.html#copy-table-range\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q: How do I copy a specified range of rows rather than the entire table?&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;Q: How do I copy a specified range of rows rather than the entire table?&lt;/strong&gt;&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;A:&lt;/strong&gt; In the current implementation, the &lt;code&gt;Copy&lt;/code&gt; operation does not support the copying of ranges but you can use the &lt;a href=\"user-guide/data-processing/operations/merge.html\"&gt;Merge&lt;/a&gt; command which will run quickly. Using the &lt;code&gt;ordered&lt;/code&gt; mode will keep the data sorted in simple situations (when there is a single range, for instance). Example command:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;yt merge --src &lt;span class=\"hljs-string\"&gt;'_path/to/src/table[#100:#500]'&lt;/span&gt; --dst _path/to/dst/table --mode ordered\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"261\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-261\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-261\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-261.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;hr /&gt;\n&lt;h4 id=\"who-access-tables\"&gt;&lt;a href=\"en/faq/index.html#who-access-tables\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q: How do I find out who is processing my tables?&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;Q: How do I find out who is processing my tables?&lt;/strong&gt;&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;A:&lt;/strong&gt; To accomplish this, you can analyze the master server access log.&lt;/p&gt;\n&lt;hr /&gt;\n&lt;h4 id=\"restore-deleted-data\"&gt;&lt;a href=\"en/faq/index.html#restore-deleted-data\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q: How do I recover deleted data?&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;Q: How do I recover deleted data?&lt;/strong&gt;&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;A:&lt;/strong&gt; If the delete used the UI, and the &lt;code&gt;Delete permanently&lt;/code&gt; option was not selected, you can look for the tables in the recycle bin under the relevant account folder.&lt;br /&gt;\nIf the delete used &lt;code&gt;yt remove&lt;/code&gt; or similar API calls, recovery is &lt;strong&gt;not possible&lt;/strong&gt;.&lt;/p&gt;\n&lt;hr /&gt;\n&lt;h4 id=\"remote-copy-resource-limits\"&gt;&lt;a href=\"en/faq/index.html#remote-copy-resource-limits\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q: Error \"Operations of type \"remote-copy\" must have small enough specified resource limits in some of ancestor pools\"&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;Q: Error \"Operations of type \"remote-copy\" must have small enough specified resource limits in some of ancestor pools\"&lt;/strong&gt;&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;A:&lt;/strong&gt; &lt;a href=\"user-guide/data-processing/operations/remote-copy.html\"&gt;RemoteCopy&lt;/a&gt; operations create load in the cross DC network.&lt;br /&gt;\nTo limit the load, we introduced artificial load limiting: RemoteCopy operations must run within a pool that enforces a &lt;code&gt;user_slots&lt;/code&gt; limit. This limit is indicated in the error message and is typically set to &lt;code&gt;2000&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;If the plan is only to run RemoteCopy in the pool, it is sufficient to set this limit for the pool&lt;br /&gt;\n&lt;code&gt;yt set //sys/pools/..../your_pool/@resource_limits '{user_slots=2000}'&lt;/code&gt;.&lt;/p&gt;\n&lt;hr /&gt;\n&lt;h4 id=\"access-denied-full-read\"&gt;&lt;a href=\"en/faq/index.html#access-denied-full-read\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q: When attempting to read or copy a table, I get the error 'Access denied for user \"some_user\": \"full_read\" permission for node //home/some_table is not allowed by any matching ACE'&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;Q: When attempting to read or copy a table, I get the error 'Access denied for user \"some_user\": \"full_read\" permission for node //home/some_table is not allowed by any matching ACE'&lt;/strong&gt;&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;A:&lt;/strong&gt; One or more table columns are locked by the ACL, and you do not have access to them. To accomplish whatever you need to, you first need to obtain the necessary access. For more information, see &lt;a href=\"user-guide/storage/columnar-acl.html\"&gt;Managing access to table columns&lt;/a&gt;.&lt;/p&gt;\n&lt;h2 id=\"storage\"&gt;&lt;a href=\"en/faq/index.html#storage\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Data storage questions&lt;/span&gt;&lt;/a&gt;Data storage questions&lt;/h2&gt;\n&lt;h4 id=\"structure-in-cell\"&gt;&lt;a href=\"en/faq/index.html#structure-in-cell\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q: Can I put an arbitrary YSON structure in a table cell?&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;Q: Can I put an arbitrary YSON structure in a table cell?&lt;/strong&gt;&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;A:&lt;/strong&gt; Yes. You can use columns of type &lt;code&gt;any&lt;/code&gt;.&lt;/p&gt;\n&lt;hr /&gt;\n&lt;h4 id=\"change-table-schema\"&gt;&lt;a href=\"en/faq/index.html#change-table-schema\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q: Can I modify a table's schema?&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;Q: Can I modify a table's schema?&lt;/strong&gt;&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;A:&lt;/strong&gt; Yes. You can find examples and limits in the &lt;a href=\"user-guide/storage/static-schema.html#create\"&gt;Table schema&lt;/a&gt; section.&lt;/p&gt;\n&lt;hr /&gt;\n&lt;h4 id=\"file-size-limit\"&gt;&lt;a href=\"en/faq/index.html#file-size-limit\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q: How large are the files the system supports?&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;Q: How large are the files the system supports?&lt;/strong&gt;&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;A:&lt;/strong&gt; The formal limit on file length is just a 64-bit integer. In actual fact, it is the amount of free space on the cluster's nodes. Since a file is broken down into chunks, it does not have to be stored on a single node. Therefore, it can be larger than the size of a single hard drive. A single job cannot process files this large; therefore, the relevant activity will boil down to using the read_file command and reading by ranges.&lt;/p&gt;\n&lt;hr /&gt;\n&lt;h4 id=\"move-table\"&gt;&lt;a href=\"en/faq/index.html#move-table\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q: How do I move a table from an HDD to an SSD?&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;Q: How do I move a table from an HDD to an SSD?&lt;/strong&gt;&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;A:&lt;/strong&gt; You can change medium type for a table or a file by editing the table's primary medium via the &lt;code&gt;primary_medium&lt;/code&gt; attribute. Before modifying this attribute, you need to unmount your table (and remount it when done to return things to the way they were). For example:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;yt unmount-table --&lt;span class=\"hljs-built_in\"&gt;sync&lt;/span&gt; //home/path/to/table\nyt &lt;span class=\"hljs-built_in\"&gt;set&lt;/span&gt; //home/path/to/table/@primary_medium ssd_blobs\nyt mount-table --&lt;span class=\"hljs-built_in\"&gt;sync&lt;/span&gt; //home/path/to/table\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"323\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-323\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-323\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-323.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Immediately after you set the attribute, new data will start writing to an SSD while old data will be moved in the background. For more information about controlling this process and tracking its progress, please see the section on &lt;a href=\"user-guide/storage/static-tables.html#medium\"&gt;static tables&lt;/a&gt;.&lt;/p&gt;\n&lt;hr /&gt;\n&lt;h4 id=\"slow-table-read\"&gt;&lt;a href=\"en/faq/index.html#slow-table-read\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q: What do I do if table reads are slow?&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;Q: What do I do if table reads are slow?&lt;/strong&gt;&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;A:&lt;/strong&gt; There is a &lt;a href=\"user-guide/problems/slow-read.html\"&gt;dedicated page&lt;/a&gt; about this.&lt;/p&gt;\n&lt;hr /&gt;\n&lt;h4 id=\"reduce-chunk-usage\"&gt;&lt;a href=\"en/faq/index.html#reduce-chunk-usage\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q: How do I reduce the number of chunks I am using in my quota?&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;Q: How do I reduce the number of chunks I am using in my quota?&lt;/strong&gt;&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;A&lt;/strong&gt;: If these chunks are taken up by tables (which is the most common scenario), you need to run a &lt;a href=\"user-guide/data-processing/operations/merge.html\"&gt;Merge&lt;/a&gt; with &lt;code&gt;combine_chunks = %true&lt;/code&gt;.&lt;br /&gt;\nThis will rebuild your table from larger chunks, thereby reducing the use of chunks within your quota. You can use a command-line command to run the operation replacing &lt;code&gt;src table&lt;/code&gt; and &lt;code&gt;dst table&lt;/code&gt;:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;yt merge --src table --dst table --spec \"{combine_chunks=true}\"\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"341\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-341\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-341\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-341.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;There is also a way of monitoring chunk usage without running a separate operation. For more information, see Merging chunks automatically on operation exit.&lt;/p&gt;\n&lt;p&gt;Also, files may use many chunks in certain situations. For instance, when small fragments are being continuously appended to existing files. At the moment, there no ready-made method similar to Merge to combine file chunks. You can run &lt;code&gt;yt read-file //path/to/file | yt write-file //path/to/file&lt;/code&gt; in combination.  This will make the entire data stream go through the client.&lt;/p&gt;\n&lt;hr /&gt;\n&lt;h4 id=\"yamreddsv-disabled\"&gt;&lt;a href=\"en/faq/index.html#yamreddsv-disabled\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q: I am getting the Format \"YamredDsv\" is disabled error. What should I do?&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;Q: I am getting the Format \"YamredDsv\" is disabled error. What should I do?&lt;/strong&gt;&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;A:&lt;/strong&gt; The &lt;code&gt;YAMRED_DSV&lt;/code&gt; format is no longer supported. Use a different &lt;a href=\"user-guide/storage/formats.html#formaty-predstavleniya-tablichnyh-dannyh\"&gt;format&lt;/a&gt;.&lt;/p&gt;\n&lt;h2 id=\"map_reduce\"&gt;&lt;a href=\"en/faq/index.html#map_reduce\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;MapReduce questions&lt;/span&gt;&lt;/a&gt;MapReduce questions&lt;/h2&gt;\n&lt;p&gt;&lt;strong&gt;A:&lt;/strong&gt; We recommend reviewing the Trial section as well as reading about working with YTsaurus from the console.&lt;/p&gt;\n&lt;hr /&gt;\n&lt;h4 id=\"table-numbers-availability\"&gt;&lt;a href=\"en/faq/index.html#table-numbers-availability\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q: Are table numbers/names always available in transactions?&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;Q: Are table numbers/names always available in transactions?&lt;/strong&gt;&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;A:&lt;/strong&gt; Table numbers are available at all stages except the &lt;a href=\"user-guide/data-processing/operations/mapreduce.html\"&gt;MapReduce&lt;/a&gt; reduce phase. Table numbers are also available in the native C++ wrapper.&lt;/p&gt;\n&lt;hr /&gt;\n&lt;h4 id=\"slot-distribution-parallel-tasks\"&gt;&lt;a href=\"en/faq/index.html#slot-distribution-parallel-tasks\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q: If a cluster is running several tasks concurrently, how do they get assigned slots?&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;Q: If a cluster is running several tasks concurrently, how do they get assigned slots?&lt;/strong&gt;&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;A:&lt;/strong&gt; YTsaurus assigns slots based on the fair share algorithm with the number of slots recomputed dynamically while the task is running. For more information, see &lt;a href=\"user-guide/data-processing/scheduler/scheduler-and-pools.html\"&gt;Scheduler and pools&lt;/a&gt;.&lt;/p&gt;\n&lt;hr /&gt;\n&lt;h4 id=\"merge-overhead-small-delta\"&gt;&lt;a href=\"en/faq/index.html#merge-overhead-small-delta\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q: What are the factors that go into the overhead of merging a table with a small delta of the same table?&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;Q: What are the factors that go into the overhead of merging a table with a small delta of the same table?&lt;/strong&gt;&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;A:&lt;/strong&gt; Overhead depends on the number of affected chunks that rows from the delta will be written to.&lt;/p&gt;\n&lt;hr /&gt;\n&lt;h4 id=\"mappers-interactive-shell\"&gt;&lt;a href=\"en/faq/index.html#mappers-interactive-shell\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q: Can I start mappers from the python interactive shell?&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;Q: Can I start mappers from the python interactive shell?&lt;/strong&gt;&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;A:&lt;/strong&gt; No, this functionality is not supported.&lt;/p&gt;\n&lt;hr /&gt;\n&lt;h4 id=\"unavailable-chunk-error\"&gt;&lt;a href=\"en/faq/index.html#unavailable-chunk-error\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q: Reading a table or a file produces the following message: \"Chunk ... is unavailable.\" What should I do?&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;Q: Reading a table or a file produces the following message: \"Chunk ... is unavailable.\" What should I do?&lt;/strong&gt;&lt;/h4&gt;\n&lt;p&gt;See the answer to this question &lt;a href=\"en/faq/index.html#lostintermediatechunks\"&gt;below&lt;/a&gt;.&lt;/p&gt;\n&lt;hr /&gt;\n&lt;h4 id=\"lostinputchunks\"&gt;&lt;a href=\"en/faq/index.html#lostinputchunks\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q: The operation running on the cluster has slowed or stopped. The following message is displayed: \"Some input chunks are not available.\" What should I do?&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;Q: The operation running on the cluster has slowed or stopped. The following message is displayed: \"Some input chunks are not available.\" What should I do?&lt;/strong&gt;&lt;/h4&gt;\n&lt;p&gt;See the answer to this question &lt;a href=\"en/faq/index.html#lostintermediatechunks\"&gt;below&lt;/a&gt;.&lt;/p&gt;\n&lt;hr /&gt;\n&lt;h4 id=\"lostintermediatechunks\"&gt;&lt;a href=\"en/faq/index.html#lostintermediatechunks\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q: The operation running on the cluster has slowed or stopped. The following message is displayed: \"Some intermediate outputs were lost and will be regenerated.\" What should I do?&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;Q: The operation running on the cluster has slowed or stopped. The following message is displayed: \"Some intermediate outputs were lost and will be regenerated.\" What should I do?&lt;/strong&gt;&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;A:&lt;/strong&gt; This means that some input table chunks used by the operation are unavailable. It may be caused by the disappearance of a data replica (with erasure coding) or the complete disappearance of all replicas (without erasure coding) due to cluster node failure or overloading. By default, the operation waits until the chunks are available again. You can:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;\n&lt;p&gt;Wait for the data to be recovered or the failed cluster nodes to be repaired. Monitor cluster status via the web interface's &lt;strong&gt;System&lt;/strong&gt; tab (Lost Chunks, Lost Vital Chunks, Data Missing Chunks, Parity Missing Chunks parameters).&lt;/p&gt;\n&lt;p&gt;Or:&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;Terminate an operation waiting on missing data early and get some intermediate output. To do this, use the &lt;code&gt;complete-op&lt;/code&gt; command in the CLI or the &lt;strong&gt;Complete&lt;/strong&gt; button on the operation page in the web interface.&lt;/p&gt;\n&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;To change the system behavior when chunks are unavailable, set the &lt;code&gt;unavailable_chunk_tactics&lt;/code&gt; and &lt;code&gt;unavailable_chunk_strategy&lt;/code&gt; options in the &lt;a href=\"user-guide/data-processing/operations/overview.html#chunk_strategy\"&gt;operation specification&lt;/a&gt;. You cannot change options \"on the fly\", because they are set before an operation starts.&lt;/p&gt;\n&lt;p&gt;If erasure chunks are unavailable, you can configure the system behavior using the &lt;code&gt;chunk_availability_policy&lt;/code&gt; option. For more information, see &lt;a href=\"user-guide/data-processing/operations/overview.html#chunk_erasure_strategy\"&gt;Operation types&lt;/a&gt;.&lt;/p&gt;\n&lt;hr /&gt;\n&lt;h4 id=\"large-table-row-error\"&gt;&lt;a href=\"en/faq/index.html#large-table-row-error\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q: I am getting the following error: \"Table row is too large: current weight ..., max weight ... or Row weight is too large.\" What is this and what do I do about it?&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;Q: I am getting the following error: \"Table row is too large: current weight ..., max weight ... or Row weight is too large.\" What is this and what do I do about it?&lt;/strong&gt;&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;A:&lt;/strong&gt; A table row weight is computed as the sum of the lengths of all the row's column values. The system has a limitation on row weight which helps control the size of the buffers used for table writes. The default limit is 16 MB. To increase this value, you need to set the &lt;code&gt;max_row_weight&lt;/code&gt; option in the table_writer configuration.&lt;/p&gt;\n&lt;p&gt;Value lengths are a function of type:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;int64&lt;/code&gt;, &lt;code&gt;uint64&lt;/code&gt;, &lt;code&gt;double&lt;/code&gt;: 8 bytes.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;boolean&lt;/code&gt;: 1 byte.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;string&lt;/code&gt;: String length.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;any&lt;/code&gt;: Length of structure serialized as binary yson, bytes.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;null&lt;/code&gt;: 0 bytes.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;If you are getting this error when you start a MapReduce, you need to configure the specific table_writer servicing the relevant step in the operation: &lt;code&gt;--spec '{JOB_IO={table_writer={max_row_weight=...}}}'&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;The name of the &lt;code&gt;JOB_IO&lt;/code&gt; section is selected as follows:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;For operations with a single job type (&lt;a href=\"user-guide/data-processing/operations/map.html\"&gt;Map&lt;/a&gt;, &lt;a href=\"user-guide/data-processing/operations/reduce.html\"&gt;Reduce&lt;/a&gt;, &lt;a href=\"user-guide/data-processing/operations/merge.html\"&gt;Merge&lt;/a&gt;, and so on), &lt;code&gt;JOB_IO = job_io&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;For Sort operations, &lt;code&gt;JOB_IO = partition_job_io | sort_job_io | merge_job_io&lt;/code&gt;, and we recommend doubling all limits until you find the right ones.&lt;/li&gt;\n&lt;li&gt;For &lt;a href=\"user-guide/data-processing/operations/mapreduce.html\"&gt;MapReduce&lt;/a&gt; operations, &lt;code&gt;JOB_IO = map_job_io | sort_job_io | reduce_job_io&lt;/code&gt;. You can increase certain limits if you are sure where exactly large rows occur.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;The maximum value is &lt;code&gt;max_row_weight&lt;/code&gt; equal to 128 MB.&lt;/p&gt;\n&lt;hr /&gt;\n&lt;h4 id=\"key-weight-too-large\"&gt;&lt;a href=\"en/faq/index.html#key-weight-too-large\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q: I am getting error \"Key weight is too large.\" What is this and what do I do about it?&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;Q: I am getting error \"Key weight is too large.\" What is this and what do I do about it?&lt;/strong&gt;&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;A:&lt;/strong&gt; A row key weight is computed as the sum of the lengths of all the row's key columns. There are limits of row key weights. The default limit is 16 K. You can increase the limit via the &lt;code&gt;max_key_weight&lt;/code&gt; option.&lt;/p&gt;\n&lt;p&gt;Value lengths are a function of type:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;int64&lt;/code&gt;, &lt;code&gt;uint64&lt;/code&gt;, &lt;code&gt;double&lt;/code&gt;: 8 bytes.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;boolean&lt;/code&gt;: 1 byte.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;string&lt;/code&gt;: String length.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;any&lt;/code&gt;: Length of structure serialized as binary yson, bytes.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;null&lt;/code&gt;: 0 bytes.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;If you are getting this error when you start a MapReduce, you need to configure the table_writer serving the relevant step in the operation:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;--spec &lt;span class=\"hljs-string\"&gt;'{JOB_IO={table_writer={max_key_weight=...}}}'&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"534\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-534\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-534\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-534.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;The name of the &lt;code&gt;JOB_IO&lt;/code&gt; section is selected as follows:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;For operations with a single job type (&lt;a href=\"user-guide/data-processing/operations/map.html\"&gt;Map&lt;/a&gt;, &lt;a href=\"user-guide/data-processing/operations/reduce.html\"&gt;Reduce&lt;/a&gt;, &lt;a href=\"user-guide/data-processing/operations/merge.html\"&gt;Merge&lt;/a&gt;, etc), &lt;code&gt;JOB_IO = job_io&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;For sort operations, &lt;code&gt;JOB_IO = partition_job_io | sort_job_io | merge_job_io&lt;/code&gt;, we recommend increasing all the limits right away.&lt;/li&gt;\n&lt;li&gt;For &lt;a href=\"user-guide/data-processing/operations/mapreduce.html\"&gt;MapReduce&lt;/a&gt; operations, &lt;code&gt;JOB_IO = map_job_io | sort_job_io | reduce_job_io&lt;/code&gt;. You can raise individual limits if you are certain where exactly large rows occur but it is better to increase all limits as well.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;The maximum value of &lt;code&gt;max_key_weight&lt;/code&gt; is 256 KB.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Attention&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Chunk boundary keys are stored on master servers; therefore, raising limits is prohibited except when repairing the production version. Prior to increasing a limit, you must write the system administrator and advise that a limit is about to be increased providing rationale.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;hr /&gt;\n&lt;h4 id=\"reduce-combiner-slow\"&gt;&lt;a href=\"en/faq/index.html#reduce-combiner-slow\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q: Why is reduce_combiner taking a long time? What should I do?&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;Q: Why is reduce_combiner taking a long time? What should I do?&lt;/strong&gt;&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;A:&lt;/strong&gt; Possibly, the job code is fairly slow, and it would make sense to reduce job size. &lt;code&gt;reduce_combiner&lt;/code&gt; is triggered if partition size exceeds &lt;code&gt;data_weight_per_sort_job&lt;/code&gt;. The amount of data in &lt;code&gt;reduce_combiner&lt;/code&gt; equals &lt;code&gt;data_weight_per_sort_job&lt;/code&gt;. The default value for &lt;code&gt;data_weight_per_sort_job&lt;/code&gt; is specified in the YTsaurus scheduler configuration, but can be overridden in the operation specification (in bytes).&lt;br /&gt;\n&lt;code&gt;yt map_reduce ... --spec '{data_weight_per_sort_job = N}'&lt;/code&gt;&lt;/p&gt;\n&lt;hr /&gt;\n&lt;h4 id=\"missing-input-table-indexes\"&gt;&lt;a href=\"en/faq/index.html#missing-input-table-indexes\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q: I feed several input tables to MapReduce without specifying a mapper. At the same time, I am unable to get input table indexes in the reducer. What seems to be the problem?&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;Q: I feed several input tables to MapReduce without specifying a mapper. At the same time, I am unable to get input table indexes in the reducer. What seems to be the problem?&lt;/strong&gt;&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;A:&lt;/strong&gt; Input table indexes are available to mappers only. If you fail to specify a mapper, it will automatically be replaced with a trivial one. Since a table index is an input row attribute rather than part of the data, a trivial mapper will not retain table index information. To resolve the problem, you need to write a custom mapper where you would save the table index in some field.&lt;/p&gt;\n&lt;hr /&gt;\n&lt;h4 id=\"abort-jobs-without-failure\"&gt;&lt;a href=\"en/faq/index.html#abort-jobs-without-failure\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q: How do I terminate pending jobs without crashing the operation?&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;Q: How do I terminate pending jobs without crashing the operation?&lt;/strong&gt;&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;A:&lt;/strong&gt; You can terminate jobs individually via the web interface.&lt;br /&gt;\nYou can terminate the entire operation using the CLI's &lt;code&gt;yt complete-op &amp;lt;id&amp;gt;&lt;/code&gt;&lt;/p&gt;\n&lt;hr /&gt;\n&lt;h4 id=\"ipython-operations-failure\"&gt;&lt;a href=\"en/faq/index.html#ipython-operations-failure\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q: What do I do if am unable to start operations from IPython Notebook?&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;Q: What do I do if am unable to start operations from IPython Notebook?&lt;/strong&gt;&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;A:&lt;/strong&gt; If your error message looks like this:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs python\"&gt;Traceback (most recent call last):\n  File &lt;span class=\"hljs-string\"&gt;\"_py_runner.py\"&lt;/span&gt;, line &lt;span class=\"hljs-number\"&gt;113&lt;/span&gt;, &lt;span class=\"hljs-keyword\"&gt;in&lt;/span&gt; &amp;lt;module&amp;gt;\n    main()\n  File &lt;span class=\"hljs-string\"&gt;\"_py_runner.py\"&lt;/span&gt;, line &lt;span class=\"hljs-number\"&gt;40&lt;/span&gt;, &lt;span class=\"hljs-keyword\"&gt;in&lt;/span&gt; main\n    (&lt;span class=\"hljs-string\"&gt;''&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;'rb'&lt;/span&gt;, imp.__dict__[__main_module_type]))\n  File &lt;span class=\"hljs-string\"&gt;\"_main_module_9_vpP.py\"&lt;/span&gt;, line &lt;span class=\"hljs-number\"&gt;1&lt;/span&gt;\n    PK\n      ^\nSyntaxError: invalid syntax\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"596\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-596\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-596\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-596.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;You need to do the following prior to starting all operations:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs python\"&gt;&lt;span class=\"hljs-keyword\"&gt;def&lt;/span&gt; &lt;span class=\"hljs-title function_\"&gt;custom_md5sum&lt;/span&gt;(&lt;span class=\"hljs-params\"&gt;filename&lt;/span&gt;):\n    &lt;span class=\"hljs-keyword\"&gt;with&lt;/span&gt; &lt;span class=\"hljs-built_in\"&gt;open&lt;/span&gt;(filename, mode=&lt;span class=\"hljs-string\"&gt;\"rb\"&lt;/span&gt;) &lt;span class=\"hljs-keyword\"&gt;as&lt;/span&gt; fin:\n        h = hashlib.md5()\n        h.update(&lt;span class=\"hljs-string\"&gt;\"salt\"&lt;/span&gt;)\n        &lt;span class=\"hljs-keyword\"&gt;for&lt;/span&gt; buf &lt;span class=\"hljs-keyword\"&gt;in&lt;/span&gt; chunk_iter_stream(fin, &lt;span class=\"hljs-number\"&gt;1024&lt;/span&gt;):\n            h.update(buf)\n    &lt;span class=\"hljs-keyword\"&gt;return&lt;/span&gt; h.hexdigest()\n\nyt.wrapper.file_commands.md5sum = custom_md5sum\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"600\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-600\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-600\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-600.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;hr /&gt;\n&lt;h4 id=\"intermediate-data-account\"&gt;&lt;a href=\"en/faq/index.html#intermediate-data-account\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q: Which account will own stored intermediate data for MapReduce and Sort?&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;Q: Which account will own stored intermediate data for MapReduce and Sort?&lt;/strong&gt;&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;A:&lt;/strong&gt; The default account used is &lt;code&gt;intermediate&lt;/code&gt; but you can change this behavior by overriding the &lt;code&gt;intermediate_data_account&lt;/code&gt; parameter in the operation spec. For more information, see &lt;a href=\"user-guide/data-processing/operations/operations-options.html\"&gt;Operation settings.&lt;/a&gt;&lt;/p&gt;\n&lt;hr /&gt;\n&lt;h4 id=\"operations-input-save\"&gt;&lt;a href=\"en/faq/index.html#operations-input-save\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q: Which account will own stored operation output?&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;Q: Which account will own stored operation output?&lt;/strong&gt;&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;A:&lt;/strong&gt; The account the output tables happen to belong to. If the output tables did not exist prior to operation start, they will be created automatically with the account inherited from the parent directory. To override these settings, you can create the output tables in advance and configure their attributes any way you want.&lt;/p&gt;\n&lt;hr /&gt;\n&lt;h4 id=\"reduce-jobs-max\"&gt;&lt;a href=\"en/faq/index.html#reduce-jobs-max\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q: How do I increase the number of Reduce jobs? The job_count option is not working.&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;Q: How do I increase the number of Reduce jobs? The job_count option is not working.&lt;/strong&gt;&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;A:&lt;/strong&gt; Most likely, the output table is too small, and the scheduler does not have enough key samples to spawn a larger number of jobs.  To get more jobs out of a small table, you will have to forcibly move the table creating more chunks. You can do this with &lt;code&gt;merge&lt;/code&gt; using the &lt;code&gt;desired_chunk_size&lt;/code&gt; option. To create 5-MB chunks, for instance, you need to run the command below:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;yt merge --src _table --dst _table --spec &lt;span class=\"hljs-string\"&gt;'{job_io = {table_writer = {desired_chunk_size = 5000000}}; force_transform = %true}'&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"622\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-622\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-622\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-622.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;An alternative way of solving the problem is by using the &lt;code&gt;pivot_keys&lt;/code&gt; option explicitly to define the boundary keys between which jobs must be started.&lt;/p&gt;\n&lt;hr /&gt;\n&lt;h4 id=\"table-not-sorted\"&gt;&lt;a href=\"en/faq/index.html#table-not-sorted\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q: I am attempting to use sorted MapReduce output. And using input keys for the output. The jobs are crashing and returning \"Output table ... is not sorted: job outputs have overlapping key ranges\" or \"Sort order violation\". What seems to be the problem?&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;Q: I am attempting to use sorted MapReduce output. And using input keys for the output. The jobs are crashing and returning \"Output table ... is not sorted: job outputs have overlapping key ranges\" or \"Sort order violation\". What seems to be the problem?&lt;/strong&gt;&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;A:&lt;/strong&gt; Sorted operation output is only possible if jobs produce collections of rows in non-intersecting ranges. In &lt;a href=\"user-guide/data-processing/operations/mapreduce.html\"&gt;MapReduce&lt;/a&gt;, input rows are grouped based on a hash of the key. Therefore, in the scenario described, job ranges will intersect. To work around the issue, you need to use &lt;a href=\"user-guide/data-processing/operations/sort.html\"&gt;Sort&lt;/a&gt; and &lt;a href=\"user-guide/data-processing/operations/reduce.html\"&gt;Reduce&lt;/a&gt; in combination.&lt;/p&gt;\n&lt;hr /&gt;\n&lt;h4 id=\"max-data-exceeded\"&gt;&lt;a href=\"en/faq/index.html#max-data-exceeded\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q: When I start an operation, I get \"Maximum allowed data weight ... exceeded». What do I do about it?&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;Q: When I start an operation, I get \"Maximum allowed data weight ... exceeded». What do I do about it?&lt;/strong&gt;&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;A:&lt;/strong&gt; The error means that the system has spawned a job with an input that is too big: over 200 GB of input data. This job would take too long to process, so the YTsaurus system is preemptively protecting users from this type of error.&lt;/p&gt;\n&lt;hr /&gt;\n&lt;h4 id=\"different-data-volume\"&gt;&lt;a href=\"en/faq/index.html#different-data-volume\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q: When I launch a Reduce or a MapReduce, I can see that the amount of data coming in to the reduce jobs varies greatly. What is the reason, and how do I make the split more uniform?&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;Q: When I launch a Reduce or a MapReduce, I can see that the amount of data coming in to the reduce jobs varies greatly. What is the reason, and how do I make the split more uniform?&lt;/strong&gt;&lt;/h4&gt;\n&lt;p&gt;The large amounts of data may be the result of skewed input meaning that some keys have noticeably more data corresponding to them than others. In this case, you might want to come up with a different solution for the problem being worked, such as try using &lt;a href=\"user-guide/data-processing/operations/reduce.html#rabota-s-bolshimi-klyuchami-—-reduce_combiner\"&gt;combiners&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;If the error arises in a &lt;a href=\"user-guide/data-processing/operations/reduce.html\"&gt;Reduce&lt;/a&gt; whose input includes more than one table (normally, dozens or hundreds), the scheduler may not have enough samples to break input data down more precisely and achieve uniformity. It is a good idea to utilize &lt;a href=\"user-guide/data-processing/operations/mapreduce.html\"&gt;MapReduce&lt;/a&gt; instead of &lt;a href=\"user-guide/data-processing/operations/reduce.html\"&gt;Reduce&lt;/a&gt; in this case.&lt;/p&gt;\n&lt;hr /&gt;\n&lt;h4 id=\"intermediatedataskew\"&gt;&lt;a href=\"en/faq/index.html#intermediatedataskew\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q: A running Sort or MapReduce generates \"Intermediate data skew is too high (see \"Partitions\" tab). Operation is likely to have stragglers». What should I do?&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;Q: A running Sort or MapReduce generates \"Intermediate data skew is too high (see \"Partitions\" tab). Operation is likely to have stragglers». What should I do?&lt;/strong&gt;&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;A:&lt;/strong&gt; This means that partitioning broke data down in a grossly non-uniform manner. For a &lt;a href=\"user-guide/data-processing/operations/mapreduce.html\"&gt;MapReduce&lt;/a&gt;, this makes an input data skew highly likely (some keys have noticeably more data corresponding to them than others).&lt;/p&gt;\n&lt;p&gt;This is also possible for a &lt;a href=\"user-guide/data-processing/operations/sort.html\"&gt;Sort&lt;/a&gt; and is related to the nature of the data and the sampling method. There is no simple solution for this issue as far as &lt;a href=\"user-guide/data-processing/operations/sort.html\"&gt;Sort&lt;/a&gt; is concerned. We recommend contacting the system administrator.&lt;/p&gt;\n&lt;hr /&gt;\n&lt;h4 id=\"make-limit-low\"&gt;&lt;a href=\"en/faq/index.html#make-limit-low\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q: How do I reduce the limit on job crashes that causes the entire operation to end in an error?&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;Q: How do I reduce the limit on job crashes that causes the entire operation to end in an error?&lt;/strong&gt;&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;A:&lt;/strong&gt; The limit is controlled by the &lt;code&gt;max_failed_job_count&lt;/code&gt; setting. For more information, see &lt;a href=\"user-guide/data-processing/operations/operations-options.html\"&gt;Operation settings.&lt;/a&gt;&lt;/p&gt;\n&lt;hr /&gt;\n&lt;h4 id=\"shortjobsduration\"&gt;&lt;a href=\"en/faq/index.html#shortjobsduration\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q: The operation page displays \"Average job duration is smaller than 25 seconds, try increasing data_weight_per_job in operation spec\". What does that mean?&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;Q: The operation page displays \"Average job duration is smaller than 25 seconds, try increasing data_weight_per_job in operation spec\". What does that mean?&lt;/strong&gt;&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;A:&lt;/strong&gt; The message is an indication that the operation jobs are too short, and their launch overhead is slowing the operation down and reducing cluster resource performance. To correct the situation, you need to increase the amount of data being fed to the job as inputs. To do this, you need to increase the relevant settings in the operation spec:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;strong&gt;Map, Reduce, JoinReduce, Merge&lt;/strong&gt; — &lt;code&gt;data_weight_per_job&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;MapReduce&lt;/strong&gt;:\n&lt;ul&gt;\n&lt;li&gt;For &lt;code&gt;map&lt;/code&gt;/&lt;code&gt;partition&lt;/code&gt; jobs: &lt;code&gt;data_weight_per_map_job&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;For &lt;code&gt;reduce&lt;/code&gt; jobs: &lt;code&gt;partition_data_size&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Sort&lt;/strong&gt;:\n&lt;ul&gt;\n&lt;li&gt;For &lt;code&gt;partition&lt;/code&gt; jobs: &lt;code&gt;data_weight_per_partition_job&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;For &lt;code&gt;final_sort&lt;/code&gt; jobs: &lt;code&gt;partition_data_size&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;The default values are listed in the &lt;a href=\"user-guide/data-processing/operations/overview.html\"&gt;sections&lt;/a&gt; on specific operation types.&lt;/p&gt;\n&lt;hr /&gt;\n&lt;h4 id=\"longabortedjobs\"&gt;&lt;a href=\"en/faq/index.html#longabortedjobs\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q: The operation page is displaying \"Aborted jobs time ratio ... is is too high. Scheduling is likely to be inefficient. Consider increasing job count to make individual jobs smaller\"?&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;Q: The operation page is displaying \"Aborted jobs time ratio ... is is too high. Scheduling is likely to be inefficient. Consider increasing job count to make individual jobs smaller\"?&lt;/strong&gt;&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;A:&lt;/strong&gt; The message means that the jobs are too long. Given that the pool's cluster resource allocation changes constantly with the arrival and departure of other users that run operations, an operation's jobs launch and are subsequently displaced. That is why the percentage of time wasted by the jobs becomes very large. The overall recommendation is to make jobs reasonably short. The best job duration is in the single minutes. You can accomplish this by reducing the amount of data fed to a single job either by using the &lt;code&gt;data_weight_per_job&lt;/code&gt; option or by optimizing and accelerating the code.&lt;/p&gt;\n&lt;hr /&gt;\n&lt;h4 id=\"highcpuwait\"&gt;&lt;a href=\"en/faq/index.html#highcpuwait\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q: The operation page is displaying the following message: \"Average CPU wait time of some of your job types is significantly high...\"?&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;Q: The operation page is displaying the following message: \"Average CPU wait time of some of your job types is significantly high...\"?&lt;/strong&gt;&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;A:&lt;/strong&gt; The message means that the jobs spent significant amounts of time (on the order tenths of the total job runtime) waiting for data from YTsaurus or were hung up reading data from local disk/over the network. In the general case, it means that you are not utilizing the CPU efficiently. If there is waiting for data from YTsaurus, you can look to reducing your jobs' &lt;code&gt;cpu_limit&lt;/code&gt; or try moving your data to SSD for faster reading. If this is a feature of your process because it reads something large from the job's local disk or accesses something online, you should either consider optimizing your process or also reducing the &lt;code&gt;cpu_limit&lt;/code&gt;. Optimization implies the restructuring of the user process in a job to prevent disk reads or network requests from becoming a bottleneck.&lt;/p&gt;\n&lt;hr /&gt;\n&lt;h4 id=\"simple-sample-table\"&gt;&lt;a href=\"en/faq/index.html#simple-sample-table\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q: What is the easiest method of sampling a table?&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;Q: What is the easiest method of sampling a table?&lt;/strong&gt;&lt;/
