h4&gt;\n&lt;p&gt;&lt;strong&gt;A:&lt;/strong&gt; In the YTsaurus system, you can request input sampling for any operation.&lt;br /&gt;\nIn particular, you can start a trivial map and get what you need as follows:&lt;br /&gt;\n&lt;code&gt;yt map cat --src _path/to/input --dst _path/to/output --spec '{job_io = {table_reader = {sampling_rate = 0.001}}}' --format yson&lt;/code&gt;&lt;/p&gt;\n&lt;p&gt;Or simply read the data:&lt;br /&gt;\n&lt;code&gt;yt read '//path/to/input' --table-reader '{sampling_rate=0.001}' --format json&lt;/code&gt;&lt;/p&gt;\n&lt;hr /&gt;\n&lt;h4 id=\"operationsuspended\"&gt;&lt;a href=\"en/faq/index.html#operationsuspended\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q: A running operation generates the following warning: \"Account limit exceeded\" and stops. What does it mean?&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;Q: A running operation generates the following warning: \"Account limit exceeded\" and stops. What does it mean?&lt;/strong&gt;&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;A:&lt;/strong&gt; The message indicates that the &lt;code&gt;suspend_operation_if_account_limit_exceeded&lt;/code&gt; specification parameter is enabled. Also, the account that hosts the operation's output tables is out of one of its quotas. Such as, the disk space quota. You need to figure out why this happened and resume the operation. You can view the account's quotas on the &lt;strong&gt;Accounts&lt;/strong&gt; page in the web interface.&lt;/p&gt;\n&lt;hr /&gt;\n&lt;h4 id=\"operationpending\"&gt;&lt;a href=\"en/faq/index.html#operationpending\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q: A running operation remains in pending mode a long time. When will it execute?&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;Q: A running operation remains in pending mode a long time. When will it execute?&lt;/strong&gt;&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;A:&lt;/strong&gt; The YTsaurus system has a limitation on the number of concurrently &lt;strong&gt;executing&lt;/strong&gt; operations in each pool (as opposed to operations launched, or accepted for execution). By default, this limit is not large (around 10). Whenever a pool's limit on the number of executing operations is reached, new operations are queued. Queued operations will proceed when previous operations in the same pool exit. The limit on the number of executing operations is applicable at all levels of the pool hierarchy, that is to say, that if an operation is launched in pool A, it may be classified as pending not only if the limit is reached in pool A itself but also in any of pool A's parents. For more information on pools and pool configuration, please see &lt;a href=\"user-guide/data-processing/scheduler/scheduler-and-pools.html\"&gt;Scheduler and pools&lt;/a&gt;. If there is a reasonable need to run more operations concurrently, you need to send a request to the system administrator.&lt;/p&gt;\n&lt;hr /&gt;\n&lt;h4 id=\"excessivejobspecthrottling\"&gt;&lt;a href=\"en/faq/index.html#excessivejobspecthrottling\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q: A running operation generates the following warning: \"Excessive job spec throttling is detected\". What does it mean?&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;Q: A running operation generates the following warning: \"Excessive job spec throttling is detected\". What does it mean?&lt;/strong&gt;&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;A:&lt;/strong&gt; This message is an indication that an operation is computationally intensive from the standpoint of the resources used by the scheduler itself in the operation setup. This situation is normal behavior for a cluster at load. If you believe that the operation is taking unacceptably long to complete and continues in a starving state a long time, you need to advise your system administrator accordingly.&lt;/p&gt;\n&lt;hr /&gt;\n&lt;h4 id=\"lowcpuusage\"&gt;&lt;a href=\"en/faq/index.html#lowcpuusage\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q: A running operation generates the following message: \"Average cpu usage... is lower than requested 'cpu_limit'». What does it mean?&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;Q: A running operation generates the following message: \"Average cpu usage... is lower than requested 'cpu_limit'». What does it mean?&lt;/strong&gt;&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;A:&lt;/strong&gt; The message means that the operation is using much less CPU than requested. By default, a single HyperThreading core is requested. If you have explicitly set the &lt;code&gt;cpu_limit&lt;/code&gt; higher than one, it means that the operation does not require that much and is not using the pool's CPU quota efficiently. In this case, we recommend reducing the limit for this operation. If you have not set the &lt;code&gt;cpu_limit&lt;/code&gt; higher than one, the operation is probably waiting for some other resource, most often disk I/O. In this case, you can review the operation jobs' runtime &lt;a href=\"user-guide/problems/jobstatistics.html\"&gt;statistics&lt;/a&gt; profiling the job while it is running to understand what it is doing.&lt;/p&gt;\n&lt;hr /&gt;\n&lt;h4 id=\"operationtoolong\"&gt;&lt;a href=\"en/faq/index.html#operationtoolong\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q: A running operation displays the following warning: \"Estimated duration of this operation is about ... days\". What does it mean?&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;Q: A running operation displays the following warning: \"Estimated duration of this operation is about ... days\". What does it mean?&lt;/strong&gt;&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;A:&lt;/strong&gt; The message is an indication that the expected time to complete the operation is too long. Expected completion time is computed as an optimistic estimate to complete running and pending jobs. As a cluster will update from time to time, and operations may restart, a large amount of utilized resources may go to waste. We recommend breaking operations down into smaller ones or looking for ways significantly to increase the quota under which an operation launches.&lt;/p&gt;\n&lt;hr /&gt;\n&lt;h4 id=\"schedulejobtimedout\"&gt;&lt;a href=\"en/faq/index.html#schedulejobtimedout\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q: A running operation generates the following warning: \"Scheduling job in controller of operation &amp;lt;operation_id&amp;gt; timed out\". What does it mean?&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;Q: A running operation generates the following warning: \"Scheduling job in controller of operation &amp;lt;operation_id&amp;gt; timed out\". What does it mean?&lt;/strong&gt;&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;A:&lt;/strong&gt; The warning means that an operation controller is not able to launch an operation job in the time allotted. This may occur if the operation is very heavy or if the scheduler is under heavy load. If you believe that an operation is taking very long to run and continues in a starving state for a long time, you should advise your system administrator accordingly.&lt;/p&gt;\n&lt;hr /&gt;\n&lt;h4 id=\"slotindexcollision\"&gt;&lt;a href=\"en/faq/index.html#slotindexcollision\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q: A running operation displays warning \"Failed to assign slot index to operation\". What does it mean?&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;Q: A running operation displays warning \"Failed to assign slot index to operation\". What does it mean?&lt;/strong&gt;&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;A:&lt;/strong&gt; If this happens, contact the administrator.&lt;/p&gt;\n&lt;hr /&gt;\n&lt;h4 id=\"unusedtmpfsspace\"&gt;&lt;a href=\"en/faq/index.html#unusedtmpfsspace\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q: A running operation generates warning \"Operation has jobs that use less than F% of requested tmpfs size\". What does it mean?&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;Q: A running operation generates warning \"Operation has jobs that use less than F% of requested tmpfs size\". What does it mean?&lt;/strong&gt;&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;A:&lt;/strong&gt; You request a tmpfs for jobs in the specification (you can view the warning attributes to find out which specific jobs) but are not utilizing the entire file system (apart from certain thresholds). tmpfs size is included into the memory limit, which means that a job requests a lot of memory but does not use it in the end. First, this reduces actual memory utilization in your cluster. Second, large tmpfs requests may slow down job scheduling since it is much more likely that the cluster will have a slot with 1 GB of memory than one with 15 GB. You should order as much tmpfs as your jobs actually need. You can review warning attributes or look at the &lt;a href=\"user-guide/problems/jobstatistics.html\"&gt;statistic&lt;/a&gt; for &lt;code&gt;user_job/tmpfs_size&lt;/code&gt; to find out about actual use of tmpfs by jobs.&lt;/p&gt;\n&lt;hr /&gt;\n&lt;h4 id=\"no-node-satisfy-demand\"&gt;&lt;a href=\"en/faq/index.html#no-node-satisfy-demand\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q: When I lunch an operation, I get error \"No online node can satisfy the resource demand\". What do I do?&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;Q: When I lunch an operation, I get error \"No online node can satisfy the resource demand\". What do I do?&lt;/strong&gt;&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;A:&lt;/strong&gt; The message is an indication that the cluster does not have a single suitable node to start the operation job. This normally happens in the following situations, for instance:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;The operation has CPU or memory requirements so large that a single cluster node's resources are not sufficient. For example, if there is an order for 1 TB of memory and 1000 CPUs for a job, this operation will not run returning an error to the client since YTsaurus clusters do not have nodes with these properties.&lt;/li&gt;\n&lt;li&gt;This specifies a &lt;code&gt;scheduling_tag_filter&lt;/code&gt; that none of the cluster nodes match.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;hr /&gt;\n&lt;h4 id=\"allowed-data-limit\"&gt;&lt;a href=\"en/faq/index.html#allowed-data-limit\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q: When I start a Merge, Reduce operation, I get the error \"Maximum allowed data weight per sorted job exceeds the limit: xxx &amp;gt; yyy\"&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;Q: When I start a Merge, Reduce operation, I get the error \"Maximum allowed data weight per sorted job exceeds the limit: xxx &amp;gt; yyy\"&lt;/strong&gt;&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;A:&lt;/strong&gt; When jobs are being built, the scheduler estimates that one job is getting too much data (hundreds of gigabytes), and the scheduler is unable to make a smaller job. The following options are available:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;When you are using &lt;a href=\"user-guide/data-processing/operations/reduce.html\"&gt;Reduce&lt;/a&gt;, and the input table has a monster key meaning that a single row in the first table corresponds to a large number of rows in another, as a result of the &lt;a href=\"user-guide/data-processing/operations/reduce.html\"&gt;Reduce&lt;/a&gt; guarantee, all rows with this key must go into a single job, and the job will run indefinitely. You should use &lt;a href=\"user-guide/data-processing/operations/mapreduce.html\"&gt;MapReduce&lt;/a&gt; with the trivial mapper and the reduce combiner to pre-process monster keys.&lt;/li&gt;\n&lt;li&gt;There are very many input tables being fed to an operation (100 or more) because chunks at the range boundary are not being counted precisely. The general observation is that the more input tables the less efficient the use of sorted input. You may want to use &lt;a href=\"user-guide/data-processing/operations/mapreduce.html\"&gt;MapReduce&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;When using &lt;a href=\"user-guide/data-processing/operations/merge.html\"&gt;Merge&lt;/a&gt;, this error may result from suboptimal scheduler operation. In this case, please write to &lt;code&gt;community@ytsaurus.tech&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;The above recommendations notwithstanding, if you are certain that you would like to launch the operation anyway and are ready for it to take a very long time, you can increase the value of the &lt;code&gt;max_data_weight_per_job&lt;/code&gt; parameter, which will start the operation.&lt;/p&gt;\n&lt;hr /&gt;\n&lt;h4 id=\"newpartitionscountissignificantlylarger\"&gt;&lt;a href=\"en/faq/index.html#newpartitionscountissignificantlylarger\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q: A running operation produces the following warning: \"Partition count, estimated by the new partition heuristic, is significantly larger than old heuristic estimation. This may lead to inadequate number of partitions.\" What does it mean?&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;Q: A running operation produces the following warning: \"Partition count, estimated by the new partition heuristic, is significantly larger than old heuristic estimation. This may lead to inadequate number of partitions.\" What does it mean?&lt;/strong&gt;&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;A:&lt;/strong&gt; A new partitioning algorithm computed a suspicious number of partitions. This may result in a large number of jobs, extremely slow operation execution, overuse of intermediate data quotas, and so on. Check that the parameters are set correctly in the operation spec. Start by looking at &lt;code&gt;map_selectivity_factor&lt;/code&gt;, &lt;code&gt;partition_data_size&lt;/code&gt;, and &lt;code&gt;partition_count&lt;/code&gt;.&lt;/p&gt;\n&lt;hr /&gt;\n&lt;h4 id=\"legacylivepreviewsuppressed\"&gt;&lt;a href=\"en/faq/index.html#legacylivepreviewsuppressed\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q: A running operation produces the following warning: \"Legacy live preview suppressed\", and live preview is not available. What does it mean?&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;Q: A running operation produces the following warning: \"Legacy live preview suppressed\", and live preview is not available. What does it mean?&lt;/strong&gt;&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;A:&lt;/strong&gt; Live preview is a mechanism that creates heavy load for the master servers; therefore, by default, it is disabled for operations launched under robotic users.&lt;/p&gt;\n&lt;p&gt;If you wish to force activate live preview, use the &lt;code&gt;enable_legacy_live_preview = %true&lt;/code&gt; option in the operation spec.&lt;/p&gt;\n&lt;p&gt;If you wish to disable this warning, use the &lt;code&gt;enable_legacy_live_preview = %false&lt;/code&gt; option in the operation spec.&lt;/p&gt;\n&lt;hr /&gt;\n&lt;h4 id=\"unicode-above-255\"&gt;&lt;a href=\"en/faq/index.html#unicode-above-255\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q: When running jobs written using the ytsaurus-client package, I get \"Unicode symbols above 255 are not supported\". What should I do?&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;Q: When running jobs written using the ytsaurus-client package, I get \"Unicode symbols above 255 are not supported\". What should I do?&lt;/strong&gt;&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;A:&lt;/strong&gt; We recommend reading about the JSON format in the &lt;a href=\"user-guide/storage/formats.html#json\"&gt;Formats&lt;/a&gt; section. You can either forego using JSON and use &lt;a href=\"user-guide/storage/formats.html#yson\"&gt;YSON&lt;/a&gt; instead or set &lt;code&gt;encode_utf8=false&lt;/code&gt;.&lt;/p&gt;\n&lt;hr /&gt;\n&lt;h4 id=\"over-dynamic-store-retries\"&gt;&lt;a href=\"en/faq/index.html#over-dynamic-store-retries\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q: What causes the error \"Too many dynamic store locate retries failed\"?&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;Q: What causes the error \"Too many dynamic store locate retries failed\"?&lt;/strong&gt;&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;A:&lt;/strong&gt; If the operation contains a dynamic table with the set &lt;code&gt;enable_dynamic_store_read&lt;/code&gt; attribute as input, jobs will read data directly from tablet nodes that host the dynamic table. For more information about this option, see &lt;a href=\"user-guide/dynamic-tables/mapreduce.html\"&gt;Running operations on dynamic tables&lt;/a&gt;. If tablet nodes are unavailable for a long time, the above error occurs. Check if the cluster undergoes any maintenance works that affect dynamic tables. Besides that, check that the bundle the table refers to is in a healthy state (the &lt;strong&gt;Good&lt;/strong&gt; bar in the interface).&lt;/p&gt;\n&lt;h2 id=\"dynamic_tables\"&gt;&lt;a href=\"en/faq/index.html#dynamic_tables\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Dynamic table questions&lt;/span&gt;&lt;/a&gt;Dynamic table questions&lt;/h2&gt;\n&lt;h4 id=\"sticky-transaction\"&gt;&lt;a href=\"en/faq/index.html#sticky-transaction\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q: When working with dynamic tables from the Python API or C++ API, I get the \"Sticky transaction 1935-3cb03-4040001-e8723e5a is not found\" error. What should I do?&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;Q: When working with dynamic tables from the Python API or C++ API, I get the \"Sticky transaction 1935-3cb03-4040001-e8723e5a is not found\" error. What should I do?&lt;/strong&gt;&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;A:&lt;/strong&gt; The answer depends on how the transactions are used. If a master transaction is used, then this is a pointless action and you must set the query outside the transaction. To do this, you can either create a separate client or explicitly specify that the query must be run under a null transaction (&lt;code&gt;with client.Transaction(transaction_id=\"0-0-0-0\"): ...&lt;/code&gt;).&lt;br /&gt;\nFull use of tablet transactions in Python API is only possible via RPC-proxy (&lt;code&gt;yt.config['backend'] = 'rpc'&lt;/code&gt;). Use of tablet transactions over HTTP is currently not supported.&lt;/p&gt;\n&lt;hr /&gt;\n&lt;h4 id=\"tablet-memory\"&gt;&lt;a href=\"en/faq/index.html#tablet-memory\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q: When writing to a dynamic table, the \"Node is out of tablet memory; all writes disabled\" or \"Active store is overflown, all writes disabled\" error occurs. What does it mean and how should I deal with it?&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;Q: When writing to a dynamic table, the \"Node is out of tablet memory; all writes disabled\" or \"Active store is overflown, all writes disabled\" error occurs. What does it mean and how should I deal with it?&lt;/strong&gt;&lt;/h4&gt;\n&lt;p&gt;**A:**The error occurs when the cluster node runs out of memory to store data not written to the disk. The input data stream is too large and the cluster node has no time to compress and write data to the disk. Queries with such errors must be repeated, possibly with an increasing delay. If this is a recurring error, this may mean (except in off-nominal situations) that individual tablets are overloaded with writes or that the cluster's capacity is not sufficient to cope with this load. Increasing the number of tablets can also help (the &lt;code&gt;reshard-table&lt;/code&gt; command).&lt;/p&gt;\n&lt;hr /&gt;\n&lt;h4 id=\"overlapping-stores\"&gt;&lt;a href=\"en/faq/index.html#overlapping-stores\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q: What does \"Too many overlapping stores\" mean? What should I do?&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;Q: What does \"Too many overlapping stores\" mean? What should I do?&lt;/strong&gt;&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;A:&lt;/strong&gt; This error is an indication that tablet structure is such that the dynamic store coverage of the key range being serviced by the tablet is too dense. Dense coverage with stores leads to degradation of read performance, so in this situation a protection mechanism is activated that prevents new data from being written. The background compaction and partitioning processes should gradually normalize the tablet structure. If this does not happen, the cluster may be failing to cope with the load.&lt;/p&gt;\n&lt;hr /&gt;\n&lt;h4 id=\"block-size-limit\"&gt;&lt;a href=\"en/faq/index.html#block-size-limit\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q: When querying a dynamic table, I get the \"Maximum block size limit violated\" error.&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;Q: When querying a dynamic table, I get the \"Maximum block size limit violated\" error.&lt;/strong&gt;&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;A:&lt;/strong&gt; The query involves a dynamic table once converted from a static table. The &lt;code&gt;block_size&lt;/code&gt; parameter was not specified. If you receive an error like this, make sure you follow all the instructions from the &lt;a href=\"user-guide/dynamic-tables/mapreduce.html\"&gt;section&lt;/a&gt; about converting a static table into a dynamic table. If block size is large, you need to increase &lt;code&gt;max_unversioned_block_size&lt;/code&gt; to 32 MB and re-mount the table. This can happen, if the table's cells store large binary data that are stored in a single block in their entirety.&lt;/p&gt;\n&lt;hr /&gt;\n&lt;h4 id=\"overlapping-stores-tablet\"&gt;&lt;a href=\"en/faq/index.html#overlapping-stores-tablet\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q: When querying a dynamic table, I get the \"Too many overlapping stores in tablet\" error.&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;Q: When querying a dynamic table, I get the \"Too many overlapping stores in tablet\" error.&lt;/strong&gt;&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;A:&lt;/strong&gt; Most likely, the tablet can't cope with the write flow and new chunks don't have time to compact. Check that the table was sharded for a sufficient number of tablets. When writing data to an empty table, disable auto-sharding, because small tablets will be combined into one.&lt;/p&gt;\n&lt;hr /&gt;\n&lt;h4 id=\"active-store-overflown\"&gt;&lt;a href=\"en/faq/index.html#active-store-overflown\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q: When querying a dynamic table, I get the \"Active store is overflown, all writes disabled\" error.&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;Q: When querying a dynamic table, I get the \"Active store is overflown, all writes disabled\" error.&lt;/strong&gt;&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;A:&lt;/strong&gt; The tablet can't cope with the write flow — it doesn't have time to dump the data to the disk or it can't do it for some reason. Check for errors in the &lt;code&gt;@tablet_errors&lt;/code&gt; table attribute and if there are none, check sharding as above.&lt;/p&gt;\n&lt;hr /&gt;\n&lt;h4 id=\"too-many-stores\"&gt;&lt;a href=\"en/faq/index.html#too-many-stores\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q: When querying a dynamic table, I get the \"Too many stores in tablet, all writes disabled\" error.&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;Q: When querying a dynamic table, I get the \"Too many stores in tablet, all writes disabled\" error.&lt;/strong&gt;&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;A:&lt;/strong&gt; The tablet is too large. Get the table to have more tablets. Note that &lt;a href=\"user-guide/dynamic-tables/tablet-balancing.html\"&gt;auto-sharding&lt;/a&gt; limits the number of tablets to the number of cells multiplied by the value of the &lt;code&gt;tablet_balancer_config/tablet_to_cell_ratio&lt;/code&gt; parameter.&lt;/p&gt;\n&lt;hr /&gt;\n&lt;h4 id=\"tablet-not-known\"&gt;&lt;a href=\"en/faq/index.html#tablet-not-known\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q: When querying a dynamic table, I get the error \"Tablet ... is not known\".&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;Q: When querying a dynamic table, I get the error \"Tablet ... is not known\".&lt;/strong&gt;&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;A:&lt;/strong&gt; The client sent a query to a cluster node no longer serving the tablet. This usually occurs as a result of automatic balancing of tablets or restarting of cluster nodes. You need to resend the query to make the error disappear after a cache update or to disable balancing.&lt;/p&gt;\n&lt;hr /&gt;\n&lt;h4 id=\"service-not-known\"&gt;&lt;a href=\"en/faq/index.html#service-not-known\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q: When querying a dynamic table, I get the \"Service is not known\" error.&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;Q: When querying a dynamic table, I get the \"Service is not known\" error.&lt;/strong&gt;&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;A:&lt;/strong&gt; The client sent a query to a cluster node no longer serving the cell tablet. This usually happens when cells are rebalanced. You need to resend the query to make the error disappear after a cache update.&lt;/p&gt;\n&lt;hr /&gt;\n&lt;h4 id=\"chunk-data-not-preloaded\"&gt;&lt;a href=\"en/faq/index.html#chunk-data-not-preloaded\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q: When querying a dynamic table, I get the \"Chunk data is not preloaded yet\" error.&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;Q: When querying a dynamic table, I get the \"Chunk data is not preloaded yet\" error.&lt;/strong&gt;&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;A:&lt;/strong&gt; The message is specific to a table with the &lt;code&gt;in_memory_mode&lt;/code&gt; parameter at other than &lt;code&gt;none&lt;/code&gt;. Such a table is always in memory in a mounted state. In order to read from such a table, all data must be loaded into memory. If the table was recently mounted, the tablet was moved to a different cell, or the YTsaurus process restarted, the data is no longer in memory, which will generate this type of error. You need to wait for the background process to load data into memory.&lt;/p&gt;\n&lt;p&gt;Tablets can move to other cells as a result of &lt;a href=\"user-guide/dynamic-tables/tablet-balancing.html\"&gt;automatic sharding&lt;/a&gt;. You can see these moves on the \"Tablet balancer moves\" graph on the bundle's page. If you want, you can set a different schedule for automatic sharding. Your new schedule must allow the table to continue sustaining your load.&lt;/p&gt;\n&lt;hr /&gt;\n&lt;h4 id=\"too-many-timestamps\"&gt;&lt;a href=\"en/faq/index.html#too-many-timestamps\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q: In tablet_errors, I see the \"Too many write timestamps in a versioned row\" or \"Too many delete timestamps in a versioned row\" error.&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;Q: In tablet_errors, I see the \"Too many write timestamps in a versioned row\" or \"Too many delete timestamps in a versioned row\" error.&lt;/strong&gt;&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;A:&lt;/strong&gt; Sorted dynamic tables store many versions of the same value at the same time. In lookup format, each key can have no more than 2^16 versions. A simple solution is to use a column format (&lt;code&gt;@optimize_for = scan&lt;/code&gt;). In reality, such a large number of versions is not necessary and they occur as a result of misconfiguration or a programming error. For example, when specifying &lt;code&gt;atomicity=none&lt;/code&gt;, you can update the same table key with great frequency (in this mode, there is no row locking and transactions with overlapping time ranges can update the same key). This is not recommended. If writing a large number of versions results from a product need, such as frequent delta writes in aggregation columns, set the &lt;code&gt;@merge_rows_on_flush=%true&lt;/code&gt; table attribute and correctly &lt;a href=\"user-guide/dynamic-tables/sorted-dynamic-tables.html#remove_old_data\"&gt;configure TTL deletion&lt;/a&gt; so that only a small number of actually needed versions are written to the chunk in a flush.&lt;/p&gt;\n&lt;hr /&gt;\n&lt;h4 id=\"excessive-input\"&gt;&lt;a href=\"en/faq/index.html#excessive-input\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q: When querying Select Rows, I get the \"Query terminated prematurely due to excessive input; consider rewriting your query or changing input limit\" error.&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;Q: When querying Select Rows, I get the \"Query terminated prematurely due to excessive input; consider rewriting your query or changing input limit\" error.&lt;/strong&gt;&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;A:&lt;/strong&gt; This error occurs if too much data is read during query execution.&lt;/p&gt;\n&lt;p&gt;Check the following:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;The primary key prefix of the table must be specified in the &lt;code&gt;WHERE&lt;/code&gt; query section. If this hasn't been done, &lt;a href=\"user-guide/dynamic-tables/dyn-query-language.html#input_data_cut\"&gt;input data cutting off&lt;/a&gt; can't be performed, and the query can't be executed efficiently (it will run as a full scan).&lt;/li&gt;\n&lt;li&gt;If the query contains &lt;code&gt;JOIN&lt;/code&gt;, make sure it's executed &lt;a href=\"user-guide/dynamic-tables/dyn-query-language.html#joins\"&gt;using an index&lt;/a&gt;.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;You need to manually rewrite the query to make sure it runs efficiently. To debug the query, you can use the &lt;a href=\"user-guide/dynamic-tables/dyn-query-language.html#explain_query\"&gt;explain&lt;/a&gt; command.&lt;br /&gt;\nYou can temporarily fix the error by increasing &lt;code&gt;input_row_limit&lt;/code&gt;, but this won't fully resolve your issue.&lt;/p&gt;\n&lt;hr /&gt;\n&lt;h4 id=\"maximum-expression-depth\"&gt;&lt;a href=\"en/faq/index.html#maximum-expression-depth\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q: When querying Select Rows, I get the \"Maximum expression depth exceeded\" error.&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;Q: When querying Select Rows, I get the \"Maximum expression depth exceeded\" error.&lt;/strong&gt;&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;A:&lt;/strong&gt; This error occurs if the expression tree depth is too large. This usually happens when writing expressions like&lt;br /&gt;\n&lt;code&gt;FROM [...] WHERE (id1=\"a\" AND id2=\"b\") OR (id1=\"c\" AND id2=\"d\") OR ... &amp;lt;a few thousand conditions&amp;gt;&lt;/code&gt;&lt;br /&gt;\nInstead, you need to set them in the form &lt;code&gt;FROM [...] WHERE (id1, id2) IN ((\"a\", \"b\"), (\"c\", \"b\"), ...)&lt;/code&gt;&lt;br /&gt;\nThere are a few problems with the first option. The problem is that queries are compiled into machine code. Machine code for queries is cached so that query structure not including constants serves as the key.&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;In the first case, as the number of conditions increases, query structure will constantly change. There will be code generation for each query.&lt;/li&gt;\n&lt;li&gt;The first query will generate a very large amount of code.&lt;/li&gt;\n&lt;li&gt;Compiling the query will be very slow.&lt;/li&gt;\n&lt;li&gt;The first case will work simply by checking all the conditions. No transformation into a more complex algorithm is envisaged.&lt;/li&gt;\n&lt;li&gt;Besides that, if the columns are key, read ranges are displayed for them so that only the relevant data can be read. The read range output algorithm will work more optimally for the IN variant.&lt;/li&gt;\n&lt;li&gt;In case of IN, checking the condition will perform search in the hash table.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;hr /&gt;\n&lt;h4 id=\"value-too-long\"&gt;&lt;a href=\"en/faq/index.html#value-too-long\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q: When working with a dynamic table, I get the \"Value is too long\" error.&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;Q: When working with a dynamic table, I get the \"Value is too long\" error.&lt;/strong&gt;&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;A:&lt;/strong&gt; There are quite strict limits on the size of values in dynamic tables. Single value (table cell) size must not exceed 16 MB, while the length of an entire row should stay under 128 and 512 MB taking into account all versions. There can be a maximum of 1024 values in a row, taking all versions into account. There is also a limit on the number of rows per query, which defaults to 100,000 rows per transaction when inserting, 1 million rows for selects, and 5 million for a lookup. Please note that operation may become unstable in the vicinity of the threshold values. If you are over limit, you need to change data storage in a dynamic table and not store such long rows.&lt;/p&gt;\n&lt;hr /&gt;\n&lt;h4 id=\"clear-replicated-table-cli\"&gt;&lt;a href=\"en/faq/index.html#clear-replicated-table-cli\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q: How do I clear a replicated table using a CLI?&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;Q: How do I clear a replicated table using a CLI?&lt;/strong&gt;&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;A:&lt;/strong&gt; You can't clear a replicated table atomically, but you can clear individual replicas using the &lt;a href=\"user-guide/data-processing/operations/erase.html\"&gt;Erase&lt;/a&gt; operation. To do this, you need to &lt;a href=\"user-guide/dynamic-tables/bulk-insert.html\"&gt;enable&lt;/a&gt; bulk insert for the entire cluster by setting:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;//sys/@config/tablet_manager/enable_bulk_insert&lt;/code&gt; to &lt;code&gt;%true&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;//sys/controller_agents/config/enable_bulk_insert_for_everyone&lt;/code&gt; to &lt;code&gt;%true&lt;/code&gt; (note the missing &lt;code&gt;@&lt;/code&gt; symbol)&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;If the last specified node doesn't exist, create it using the following command:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;$ yt create document //sys/controller_agents/config --attributes &lt;span class=\"hljs-string\"&gt;'{value={}}'&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"1053\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-1053\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-1053\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1053.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;hr /&gt;\n&lt;h4 id=\"timed-out-blocked-row\"&gt;&lt;a href=\"en/faq/index.html#timed-out-blocked-row\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q: When reading from a dynamic table, I get the \"Timed out waiting on blocked row\" error.&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;Q: When reading from a dynamic table, I get the \"Timed out waiting on blocked row\" error.&lt;/strong&gt;&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;A:&lt;/strong&gt; This error occurs due to read-write conflicts – you attempt to read by a key used by a concurrent transaction. The system must wait for the result of that transaction to ensure the required level of isolation between transactions.&lt;/p&gt;\n&lt;p&gt;If you don't require strict consistency, you can &lt;a href=\"user-guide/dynamic-tables/sorted-dynamic-tables#chtenie-stroki\"&gt;weaken&lt;/a&gt; the isolation level for the reading transaction.&lt;/p&gt;\n&lt;hr /&gt;\n&lt;h4 id=\"row-lock-conflict\"&gt;&lt;a href=\"en/faq/index.html#row-lock-conflict\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q: When writing to a dynamic table, I get the \"Row lock conflict due to concurrent ... write\" error.&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;Q: When writing to a dynamic table, I get the \"Row lock conflict due to concurrent ... write\" error.&lt;/strong&gt;&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;A:&lt;/strong&gt; This error occurs due to write conflicts – you're trying to write to a row that is locked by a concurrent transaction (this can be a write operation or an explicit lock). In some cases, the system may indicate the conflicting transaction. For example, for write-write conflicts, the error attributes include the transaction ID.&lt;/p&gt;\n&lt;p&gt;In general, to eliminate conflicts caused by writing to the same key from multiple sources, you need to revise your logic for writing to dynamic tables.&lt;/p&gt;\n&lt;p&gt;In some scenarios, weakening &lt;a href=\"user-guide/dynamic-tables/transactions#conflicts\"&gt;guarantees&lt;/a&gt; may help. For example, you can use &lt;code&gt;atomicity=none&lt;/code&gt; mode or shared write lock mode. Before you weaken the guarantees, be sure to read the documentation to find out whether the side effects can impact you.&lt;/p&gt;\n&lt;hr /&gt;\n&lt;h4 id=\"no-working-replicas\"&gt;&lt;a href=\"en/faq/index.html#no-working-replicas\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q: When reading from a dynamic table, I get the \"No working in-sync replicas found for table\" error.&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;Q: When reading from a dynamic table, I get the \"No working in-sync replicas found for table\" error.&lt;/strong&gt;&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;A:&lt;/strong&gt; This error occurs when reading from a replicated or chaotic table if there is no replica to read from. The replica must meet the following criteria:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;It must contain fairly recent data. If a timestamp is specified when reading, the replica must contain data up to that timestamp. If a timestamp is not specified, reads must be made from an &lt;em&gt;actually synchronous&lt;/em&gt; replica: a one that has &lt;code&gt;mode=sync&lt;/code&gt; and definitely contains older data. For more information, see &lt;a href=\"user-guide/dynamic-tables/replicated-dynamic-tables#garantii\"&gt;guarantees of replicated dynamic tables&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;It must be a working replica. If the client has recently got an error from a replica, next time it will try to access a different replica. The replicas you cannot read data from are listed in the &lt;code&gt;banned_replicas&lt;/code&gt; attribute of the error in question.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;hr /&gt;\n&lt;h4 id=\"chunk-view-cannot-be-remote-copied\"&gt;&lt;a href=\"en/faq/index.html#chunk-view-cannot-be-remote-copied\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q: When attempting to execute RemoteCopy, I get the \"Chunk view cannot be copied to remote cluster\" error.&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;Q: When attempting to execute RemoteCopy, I get the \"Chunk view cannot be copied to remote cluster\" error.&lt;/strong&gt;&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;A:&lt;/strong&gt; To ensure cost efficiency, some operations on a dynamic table, such as resharding, may create chunk views — wrappers for chunks. Currently, RemoteCopy can only copy regular chunks, not chunk views.&lt;br /&gt;\nTo remove chunk views from a table, perform a special forced compaction by setting the &lt;code&gt;forced_chunk_view_compaction_revision&lt;/code&gt; attribute to 1, and then execute &lt;code&gt;remount-table&lt;/code&gt;. For more information, see &lt;a href=\"user-guide/dynamic-tables/compaction#forced_compaction\"&gt;Forced compaction&lt;/a&gt;.&lt;/p&gt;\n&lt;h2 id=\"chyt\"&gt;&lt;a href=\"en/faq/index.html#chyt\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;YTsaurus CHYT questions&lt;/span&gt;&lt;/a&gt;YTsaurus CHYT questions&lt;/h2&gt;\n&lt;h4 id=\"chyt-cliques-explanation\"&gt;&lt;a href=\"en/faq/index.html#chyt-cliques-explanation\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q: Why does CHYT have cliques, while regular ClickHouse has nothing analogous? What is a clique?&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;Q: Why does CHYT have cliques, while regular ClickHouse has nothing analogous? What is a clique?&lt;/strong&gt;&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;A:&lt;/strong&gt; There is a dedicated &lt;a href=\"user-guide/data-processing/chyt/general.html\"&gt;article&lt;/a&gt; about this.&lt;/p&gt;\n&lt;hr /&gt;\n&lt;h4 id=\"connection-refused-error\"&gt;&lt;a href=\"en/faq/index.html#connection-refused-error\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q: I am getting the \"DB::NetException: Connection refused\" or the \"DB::Exception: Attempt to read after eof: while receiving packet\" error. What does it mean?&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;Q: I am getting the \"DB::NetException: Connection refused\" or the \"DB::Exception: Attempt to read after eof: while receiving packet\" error. What does it mean?&lt;/strong&gt;&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;A:&lt;/strong&gt; This normally means that the CHYT process inside the Vanilla transaction crashed. You can view the aborted/failed job &lt;a href=\"user-guide/data-processing/chyt/cliques/ui.html\"&gt;counters&lt;/a&gt; in the operation UI. If there are recent jobs aborted due to preemption, it means that the clique is short on resources. If there are recent failed jobs, please contact your system administrator.&lt;/p&gt;\n&lt;hr /&gt;\n&lt;h4 id=\"subquery-data-weight-limit\"&gt;&lt;a href=\"en/faq/index.html#subquery-data-weight-limit\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q: I am getting the \"Subquery exceeds data weight limit: XXX &amp;gt; YYY\" error. What does it mean?&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;Q: I am getting the \"Subquery exceeds data weight limit: XXX &amp;gt; YYY\" error. What does it mean?&lt;/strong&gt;&lt;/h4&gt;\n\n&lt;hr /&gt;\n&lt;h4 id=\"save-to-table\"&gt;&lt;a href=\"en/faq/index.html#save-to-table\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q: How do I save to a table?&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;Q: How do I save to a table?&lt;/strong&gt;&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;A:&lt;/strong&gt; There are &lt;strong&gt;INSERT INTO&lt;/strong&gt; and &lt;strong&gt;CREATE TABLE&lt;/strong&gt; functions. Learn more in the section on &lt;a href=\"user-guide/data-processing/chyt/yt-tables.html#save\"&gt;Differences from ClickHouse.&lt;/a&gt;&lt;/p&gt;\n&lt;hr /&gt;\n&lt;h4 id=\"load-geodictionaries-chyt\"&gt;&lt;a href=\"en/faq/index.html#load-geodictionaries-chyt\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q: How do I load geo-dicts in my own clique?&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;Q: How do I load geo-dicts in my own clique?&lt;/strong&gt;&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;A:&lt;/strong&gt; When starting any clique, you can specify the &lt;code&gt;--cypress-geodata-path&lt;/code&gt; option that enables you to specify the path to geo-dicts in &lt;a href=\"user-guide/storage/cypress.html\"&gt;Cypress&lt;/a&gt;.&lt;/p&gt;\n\n&lt;hr /&gt;\n&lt;h4 id=\"chyt-tzdatetime-handling\"&gt;&lt;a href=\"en/faq/index.html#chyt-tzdatetime-handling\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q: Can CHYT handle dates in TzDatetime format?&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;Q: Can CHYT handle dates in TzDatetime format?&lt;/strong&gt;&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;A:&lt;/strong&gt;  CHYT can handle dates in TzDatetime format just as well as conventional ClickHouse. You will have to store data as strings or numbers and convert them for reading and writing. Example date extraction by &lt;strong&gt;@gri201&lt;/strong&gt;:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs sql\"&gt;toDate(reinterpretAsInt64(reverse(unhex(&lt;span class=\"hljs-built_in\"&gt;substring&lt;/span&gt;(hex(payment_dt), &lt;span class=\"hljs-number\"&gt;1&lt;/span&gt;, &lt;span class=\"hljs-number\"&gt;8&lt;/span&gt;)))))\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"1146\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-1146\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-1146\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1146.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;hr /&gt;\n&lt;h4 id=\"how-to-set-ssd\"&gt;&lt;a href=\"en/faq/index.html#how-to-set-ssd\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q: How do I move a table to an SSD?&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;Q: How do I move a table to an SSD?&lt;/strong&gt;&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;A:&lt;/strong&gt; First, make sure that your YTsaurus account has a quota for the &lt;strong&gt;ssd_blobs&lt;/strong&gt; medium. To do this, go to the account page, switch your medium type to &lt;strong&gt;ssd_blobs&lt;/strong&gt;, and enter your account name. If you have no quota for the &lt;strong&gt;ssd_blobs&lt;/strong&gt; medium, you can request it via a special form.&lt;/p&gt;\n&lt;p&gt;After obtaining the quota for the &lt;strong&gt;ssd_blobs&lt;/strong&gt; medium, you will need to change the value of the &lt;code&gt;primary_medium&lt;/code&gt; attribute, and the data will be moved to the corresponding medium in the background. Learn more in the section on &lt;a href=\"faq/index.html\"&gt;storage&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;For static tables, you can force a move using the &lt;a href=\"user-guide/data-processing/operations/merge.html\"&gt;Merge&lt;/a&gt; operation:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;yt &lt;span class=\"hljs-built_in\"&gt;set&lt;/span&gt; //home/dev/test_table/@primary_medium ssd_blobs\nyt merge --mode auto --spec &lt;span class=\"hljs-string\"&gt;'{\"force_transform\"=true;}'&lt;/span&gt; --src //home/dev/test_table --dst //home/dev/test_table\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"1160\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-1160\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-1160\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1160.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;If the table is dynamic, to change the medium, you must first unmount the table,&lt;br /&gt;\nset the attribute, and then re-mount it:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;yt unmount-table //home/dev/test_table --&lt;span class=\"hljs-built_in\"&gt;sync&lt;/span&gt;\nyt &lt;span class=\"hljs-built_in\"&gt;set&lt;/span&gt; //home/dev/test_table/@primary_medium ssd_blobs\nyt mount-table //home/dev/test_table --&lt;span class=\"hljs-built_in\"&gt;sync&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"1164\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-1164\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-1164\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1164.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;You can speed up the move further with &lt;a href=\"user-guide/dynamic-tables/overview.html#attributes\"&gt;forced_compaction&lt;/a&gt; but using this method creates a heavy load in the cluster and is strongly discouraged.&lt;/p&gt;\n&lt;p&gt;To verify that the table has in fact changed its medium, use the command below:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;$ yt get //home/dev/test_table/@chunk_media_statistics\n\n{\n    &lt;span class=\"hljs-string\"&gt;\"ssd_blobs\"&lt;/span&gt; = {\n        &lt;span class=\"hljs-string\"&gt;\"chunk_count\"&lt;/span&gt; = 2126;\n        &lt;span class=\"hljs-string\"&gt;\"uncompressed_data_size\"&lt;/span&gt; = 9667220402266;\n        &lt;span class=\"hljs-string\"&gt;\"compressed_data_size\"&lt;/span&gt; = 4954465956017;\n        &lt;span class=\"hljs-string\"&gt;\"data_weight\"&lt;/span&gt; = 10764306825793;\n        &lt;span class=\"hljs-string\"&gt;\"max_block_size\"&lt;/span&gt; = 6584787;\n    };\n}\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"1171\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-1171\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-1171\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1171.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;hr /&gt;\n&lt;h4 id=\"chyt-sample-support\"&gt;&lt;a href=\"en/faq/index.html#chyt-sample-support\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q: Is the SAMPLE construct of the ClickHouse language supported?&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;Q: Is the SAMPLE construct of the ClickHouse language supported?&lt;/strong&gt;&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;A:&lt;/strong&gt; CHYT supports the Sample construction. The difference is that CHYT ignores the &lt;code&gt;OFFSET ...&lt;/code&gt; command, so you cannot get a sample from another part of the selected data.&lt;/p&gt;\n&lt;p&gt;Example:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs SQL\"&gt;&lt;span class=\"hljs-keyword\"&gt;SELECT&lt;/span&gt; &lt;span class=\"hljs-built_in\"&gt;count&lt;/span&gt;(&lt;span class=\"hljs-operator\"&gt;*&lt;/span&gt;) &lt;span class=\"hljs-keyword\"&gt;FROM&lt;/span&gt; \"//tmp/sample_table\" SAMPLE &lt;span class=\"hljs-number\"&gt;0.05&lt;/span&gt;;\n\n&lt;span class=\"hljs-keyword\"&gt;SELECT&lt;/span&gt; &lt;span class=\"hljs-built_in\"&gt;count&lt;/span&gt;(&lt;span class=\"hljs-operator\"&gt;*&lt;/span&gt;) &lt;span class=\"hljs-keyword\"&gt;FROM&lt;/span&gt; \"//tmp/sample_table\" SAMPLE &lt;span class=\"hljs-number\"&gt;1&lt;/span&gt;&lt;span class=\"hljs-operator\"&gt;/&lt;/span&gt;&lt;span class=\"hljs-number\"&gt;20&lt;/span&gt;;\n\n&lt;span class=\"hljs-keyword\"&gt;SELECT&lt;/span&gt; &lt;span class=\"hljs-built_in\"&gt;count&lt;/span&gt;(&lt;span class=\"hljs-operator\"&gt;*&lt;/span&gt;) &lt;span class=\"hljs-keyword\"&gt;FROM&lt;/span&gt; \"//tmp/sample_table\" SAMPLE &lt;span class=\"hljs-number\"&gt;100500&lt;/span&gt;;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"1182\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-1182\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;anim
