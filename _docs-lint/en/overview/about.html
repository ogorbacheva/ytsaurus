        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;This section contains information about the basic features and structure of the YTsaurus system.&lt;/p&gt;\n&lt;h2 id=\"clusters\"&gt;&lt;a href=\"en/overview/about.html#clusters\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Clusters&lt;/span&gt;&lt;/a&gt;Clusters&lt;/h2&gt;\n&lt;p&gt;A YTsaurus cluster is a group of instances located in containers on physical hosts and operating as a unit.&lt;br /&gt;\nBased on the tasks to be solved, clusters can be divided into:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Computing clusters for massive parallel big data processing with MapReduce operations.&lt;/li&gt;\n&lt;li&gt;Dynamic table clusters (key-value storage).&lt;/li&gt;\n&lt;li&gt;Geodistributed clusters for coordination.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;A YTsaurus computing cluster is able:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;To store exabytes of data.&lt;/li&gt;\n&lt;li&gt;To use HDD, SDD, and RAM for data storage.&lt;/li&gt;\n&lt;li&gt;To process data on hundreds of thousands of CPU cores.&lt;/li&gt;\n&lt;li&gt;To solve machine learning problems on thousands of GPUs.&lt;/li&gt;\n&lt;li&gt;To store and process data from tens of thousands of platform tenants.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"architecture\"&gt;&lt;a href=\"en/overview/about.html#architecture\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Architecture&lt;/span&gt;&lt;/a&gt;Architecture&lt;/h2&gt;\n&lt;p&gt;&lt;img src=\"images/architecture.png\" alt=\"\" /&gt;&lt;/p&gt;\n&lt;p&gt;The YTsaurus architecture contains three layers:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Distributed file system and metadata storage: Cypress.&lt;/li&gt;\n&lt;li&gt;Scheduler for distributed computing with MapReduce model support.&lt;/li&gt;\n&lt;li&gt;High-level computing engines: YQL, CHYT, and SPYT.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h3 id=\"cypress\"&gt;&lt;a href=\"en/overview/about.html#cypress\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Cypress&lt;/span&gt;&lt;/a&gt;Cypress&lt;/h3&gt;\n&lt;p&gt;Cypress is a fault-tolerant tree-based storage whose capabilities can be briefly described as follows:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;A tree-like namespace with directories, tables, and files as nodes.&lt;/li&gt;\n&lt;li&gt;Transparent sharding of large tabular data into chunks, enabling the table to be treated as a single entity without worrying too much about the details of its physical storage.&lt;/li&gt;\n&lt;li&gt;Support for columnar and row-based storage mechanisms for tabular data.&lt;/li&gt;\n&lt;li&gt;Support for compressed storage using various encoding codecs, such as lz4 and zstd, with varying levels of compression.&lt;/li&gt;\n&lt;li&gt;Support for erasure coding using various erasure codecs with different control sum calculation strategies that have different redundancy parameters and allowable loss types.&lt;/li&gt;\n&lt;li&gt;Expressive data schematization with support for hierarchical types and data sortedness signs.&lt;/li&gt;\n&lt;li&gt;Background replication and repair of erased data without manual intervention.&lt;/li&gt;\n&lt;li&gt;Transactional semantics with support for nested transactions and snapshot/shared/exclusive level locks.&lt;/li&gt;\n&lt;li&gt;Transactions that can affect many Cypress objects and last indefinitely.&lt;/li&gt;\n&lt;li&gt;A flexible disk quota accounting system.&lt;/li&gt;\n&lt;li&gt;A flexible system for delimiting data access permissions, including access to table columns.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;At the heart of Cypress is a replicated and horizontally scalable master server that stores metadata about the Cypress tree structure and the composition and location of chunk replicas for all tables on the cluster. Master servers are implemented as replicated state machines based on Hydra, a proprietary consensus algorithm similar to Raft.&lt;br /&gt;\nCypress implements a fault-tolerant elastic data storage layer.&lt;/p&gt;\n&lt;p&gt;In addition to handling storage, Cypress can act as a lock service similar to Apache Zookeeper.&lt;/p&gt;\n&lt;p&gt;From a user's standpoint, Cypress looks like a Linux file system tree. The easiest way of working with Cypress is to use its web interface.&lt;/p&gt;\n&lt;h3 id=\"dyn-tables\"&gt;&lt;a href=\"en/overview/about.html#dyn-tables\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Dynamic tables&lt;/span&gt;&lt;/a&gt;Dynamic tables&lt;/h3&gt;\n&lt;p&gt;Dynamic tables are tables in YTsaurus that implement an interface for point reads and key-based data writes and have transaction support and a native SQL dialect.&lt;/p&gt;\n&lt;p&gt;Key features of dynamic tables:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Storing data in the &lt;a href=\"https://en.wikipedia.org/wiki/Multiversion_concurrency_control\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;MVCC&lt;/a&gt; model. Users can look up values by key or by timestamp.&lt;/li&gt;\n&lt;li&gt;Scalability: dynamic tables are split into tablets (shards by key ranges) that are served by separate cluster nodes.&lt;/li&gt;\n&lt;li&gt;Transactionality: dynamic tables are OLTP storages that can change many rows from different tablets of different tables within a single transaction.&lt;/li&gt;\n&lt;li&gt;Fault tolerance: failure of a single cluster node serving a tablet causes that tablet to be moved to another cluster node with no data loss.&lt;/li&gt;\n&lt;li&gt;Isolation: instances serving tablets are grouped into bundles that reside on separate servers, ensuring load isolation.&lt;/li&gt;\n&lt;li&gt;Conflict checking at the individual key or even individual value level.&lt;/li&gt;\n&lt;li&gt;Hot data responses from RAM.&lt;/li&gt;\n&lt;li&gt;Deleting data by &lt;a href=\"https://en.wikipedia.org/wiki/Time_to_live\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;TTL&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;A built-in SQL-like language for scanning analytical queries.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;In addition to dynamic tables with the k-v storage interface, the system supports dynamic tables that implement the message queue abstraction, namely topics and streams. These queues can also be considered tables because they consist of rows and have their own schema. In a transaction, you can modify rows in both the k-v dynamic table and the queue simultaneously. This enables you to build stream processing on top of YTsaurus's dynamic tables with exactly once semantics.&lt;/p&gt;\n&lt;h3 id=\"mapreduce\"&gt;&lt;a href=\"en/overview/about.html#mapreduce\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;MapReduce&lt;/span&gt;&lt;/a&gt;MapReduce&lt;/h3&gt;\n&lt;p&gt;The YTsaurus compute architecture is based on the MapReduce distributed computational model. The Map operation processes input data broken down into parts between the cluster's nodes without data being exchanged between such nodes. The Reduce operation groups data from different cluster nodes.&lt;br /&gt;\nThe model helps process large amounts of data in a highly reliable manner. Parts of the computation are automatically restarted if individual cluster nodes are unavailable.&lt;/p&gt;\n&lt;p&gt;MapReduce in YTsaurus has the following features:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;A rich model of base operations: classic MapReduce (with different shuffle strategies and support for multi-phase partitioning), Map, Erase, Sort, and some extensions of the classic model that take into account the sortedness of input data.&lt;/li&gt;\n&lt;li&gt;Horizontal scalability of computations: operations are divided into jobs that run on separate cluster nodes.&lt;/li&gt;\n&lt;li&gt;Support for hundreds of thousands of jobs in a single operation.&lt;/li&gt;\n&lt;li&gt;A flexible model of hierarchical compute pools with instant and integral guarantees, as well as fair_share distribution of underutilized resources among consumers without guarantees.&lt;/li&gt;\n&lt;li&gt;A vector resource model that enables different compute resources (CPU, RAM, GPU) to be requested in different proportions.&lt;/li&gt;\n&lt;li&gt;Job execution on compute nodes in containers isolated by CPU, RAM, file system, and process namespace using the Porto containerization mechanism.&lt;/li&gt;\n&lt;li&gt;A scalable scheduler that can serve clusters with up to a million concurrent tasks.&lt;/li&gt;\n&lt;li&gt;Virtually all compute progress is preserved in the event of updates or scheduler node failures.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;You can execute not only MapReduce jobs but also arbitrary code. In YTsaurus terminology, running arbitrary code is achieved using Vanilla operations.&lt;/p&gt;\n&lt;h3 id=\"yql\"&gt;&lt;a href=\"en/overview/about.html#yql\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;YQL&lt;/span&gt;&lt;/a&gt;YQL&lt;/h3&gt;\n&lt;p&gt;YQL is an SQL-based language of universal declarative queries against data storage and processing systems, as well as an infrastructure to run such queries.&lt;/p&gt;\n&lt;p&gt;YQL benefits include:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;A powerful graph execution engine that can build MapReduce pipelines with hundreds of nodes and adapt during computation.&lt;/li&gt;\n&lt;li&gt;Ability to build complex data processing pipelines using SQL by storing subqueries in variables as chains of dependent queries and transactions.&lt;/li&gt;\n&lt;li&gt;Predictable parallel execution of queries of any complexity.&lt;/li&gt;\n&lt;li&gt;Efficient implementation of joins, subqueries, and window functions with no restrictions on their topology or nesting.&lt;/li&gt;\n&lt;li&gt;Extensive function library.&lt;/li&gt;\n&lt;li&gt;Support for custom functions in C++, Python, and JavaScript.&lt;/li&gt;\n&lt;li&gt;Support for using machine learning models via CatBoost and TensorFlow.&lt;/li&gt;\n&lt;li&gt;Automatic execution of small parts of queries on prepared compute instances, bypassing MapReduce operations to reduce latency.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h3 id=\"chyt\"&gt;&lt;a href=\"en/overview/about.html#chyt\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;CHYT&lt;/span&gt;&lt;/a&gt;CHYT&lt;/h3&gt;\n&lt;p&gt;ClickHouse over YTsaurus (CHYT) is a technology that enables you to create a cluster of ClickHouse servers directly on YTsaurus computational nodes.&lt;br /&gt;\nClickHouse is created within a Vanilla operation and works with the data in YTsaurus. The YTsaurus cluster acts as a compute cloud with respect to the running CHYT clusters within it.&lt;br /&gt;\nThis technology enables different users to run multiple CHYT clusters on a single YTsaurus cluster, completely isolated from each other, solving the problem of resource separation in a cloud-like manner.&lt;/p&gt;\n&lt;p&gt;In the YTsaurus ecosystem, CHYT is responsible for:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Fast analytical queries on static tables in YTsaurus with sub-second latency.&lt;/li&gt;\n&lt;li&gt;Reusing existing data in the YTsaurus cluster without having to copy it to a separate ClickHouse cluster.&lt;/li&gt;\n&lt;li&gt;Ability to integrate via ClickHouse's native ODBC and JDBC drivers, for example, with third-party visualization systems: Tableau, Qlik, Power BI, Oracle Bi, and DataLens.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;The integration is done at a fairly low level. This enables us to use the full potential of both YTsaurus and ClickHouse. This integration implements:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Support of reading both static and dynamic tables.&lt;/li&gt;\n&lt;li&gt;Partial support of the YTsaurus transactional model.&lt;/li&gt;\n&lt;li&gt;Support of distributed inserts.&lt;/li&gt;\n&lt;li&gt;CPU-efficient conversion of columnar data from the internal YTsaurus format to the in-memory ClickHouse representation.&lt;/li&gt;\n&lt;li&gt;Aggressive data caching, which in some cases enables query execution data to be read exclusively from instance memory.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h3 id=\"spyt\"&gt;&lt;a href=\"en/overview/about.html#spyt\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;SPYT&lt;/span&gt;&lt;/a&gt;SPYT&lt;/h3&gt;\n&lt;p&gt;SPYT is a technology that integrates Apache Spark as a compute engine for data stored in YTsaurus. Similar to CHYT, vanilla YTsaurus operations provide computational resources for the SPYT cluster.&lt;br /&gt;\nUsing SPYT helps minimize IO overheads and increase the performance of complex analytical pipelines manifold.&lt;br /&gt;\nSPYT can read both static and dynamic YTsaurus tables, perform computations with them, and capture the output in a static YTsaurus table.&lt;/p&gt;\n&lt;h3 id=\"sdk\"&gt;&lt;a href=\"en/overview/about.html#sdk\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;SDK&lt;/span&gt;&lt;/a&gt;SDK&lt;/h3&gt;\n&lt;p&gt;All APIs in popular languages (C++, Python, Java, Go) were developed by the YTsaurus team, so all the nuances of interacting with the system are considered and well thought out in them. The YTsaurus client part for the mentioned languages enables you to read or write large amounts of data, despite possible network failures and other error.&lt;/p&gt;\n&lt;h3 id=\"ui\"&gt;&lt;a href=\"en/overview/about.html#ui\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Web interface&lt;/span&gt;&lt;/a&gt;Web interface&lt;/h3&gt;\n&lt;p&gt;The YTsaurus system implements a unified web interface for users and administrators. Use it to:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Navigate Cypress and view data.&lt;/li&gt;\n&lt;li&gt;Execute operations with tables, folders, and files.&lt;/li&gt;\n&lt;li&gt;Execute and view MapReduce computations.&lt;/li&gt;\n&lt;li&gt;Execute and view the history of SQL queries across all engines: YQL, CHYT, dynamic tables SQL.&lt;/li&gt;\n&lt;li&gt;Administer the system:\n&lt;ul&gt;\n&lt;li&gt;Monitor cluster component health.&lt;/li&gt;\n&lt;li&gt;Create and delete users and groups.&lt;/li&gt;\n&lt;li&gt;Manage quotas.&lt;/li&gt;\n&lt;li&gt;View access control settings.&lt;/li&gt;\n&lt;li&gt;View cluster component versions and much more.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;/ul&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"en/overview/about.md","sourcePath":"en/overview/about.md"},"headings":[{"title":"Clusters","href":"en/overview/about.html#clusters","level":2},{"title":"Architecture","href":"en/overview/about.html#architecture","level":2,"items":[{"title":"Cypress","href":"en/overview/about.html#cypress","level":3},{"title":"Dynamic tables","href":"en/overview/about.html#dyn-tables","level":3},{"title":"MapReduce","href":"en/overview/about.html#mapreduce","level":3},{"title":"YQL","href":"en/overview/about.html#yql","level":3},{"title":"CHYT","href":"en/overview/about.html#chyt","level":3},{"title":"SPYT","href":"en/overview/about.html#spyt","level":3},{"title":"SDK","href":"en/overview/about.html#sdk","level":3},{"title":"Web interface","href":"en/overview/about.html#ui","level":3}]}],"title":"Overview"},"router":{"pathname":"en/overview/about","depth":3,"base":"../../"},"lang":"en","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/en/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-a29ea7877730322f2ce693378d06d02ac2b374cd-en","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
