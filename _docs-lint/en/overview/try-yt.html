ate id=\"hideAnimation-677\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-677.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;To verify that the data has been written to the table, use the &lt;a href=\"api/cli/commands.html#read-table\"&gt;read-table&lt;/a&gt; command. The half-interval specified in the square brackets indicates that we want to get the first six rows of the table:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;yt read-table &lt;span class=\"hljs-string\"&gt;'//home/mapreduce_input[:#6]'&lt;/span&gt; --format dsv\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"681\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-681\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-681\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-681.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h4 id=\"mr-run\"&gt;&lt;a href=\"en/overview/try-yt.html#mr-run\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;3. Run MapReduce&lt;/span&gt;&lt;/a&gt;3. Run MapReduce&lt;/h4&gt;\n&lt;p&gt;Run the MapReduce operation using the &lt;a href=\"api/cli/commands.html#map-reduce\"&gt;map-reduce&lt;/a&gt; command:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;yt map-reduce --mapper &lt;span class=\"hljs-string\"&gt;\"python3 word-count.py map\"&lt;/span&gt; --reducer &lt;span class=\"hljs-string\"&gt;\"python3 word-count.py reduce\"&lt;/span&gt; --map-local-file word-count.py --reduce-local-file word-count.py --src //home/mapreduce_input --dst //home/mapreduce_result --reduce-by word --format dsv\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"688\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-688\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-688\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-688.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;You can track the status of a running operation in the &lt;strong&gt;Operations&lt;/strong&gt; section of the web interface.&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Where to find this section&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;&lt;img src=\"images/try-yt-operations.png\" alt=\"\" /&gt;&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h4 id=\"mr-get-result\"&gt;&lt;a href=\"en/overview/try-yt.html#mr-get-result\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;4. Read the result&lt;/span&gt;&lt;/a&gt;4. Read the result&lt;/h4&gt;\n&lt;p&gt;Now you can read the resulting table by executing a simple SELECT query. In the web interface, go to the &lt;strong&gt;Queries&lt;/strong&gt; tab and enter the following query:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs sql\"&gt;&lt;span class=\"hljs-keyword\"&gt;SELECT&lt;/span&gt; &lt;span class=\"hljs-operator\"&gt;*&lt;/span&gt; &lt;span class=\"hljs-keyword\"&gt;FROM&lt;/span&gt; `&lt;span class=\"hljs-operator\"&gt;/&lt;/span&gt;&lt;span class=\"hljs-operator\"&gt;/&lt;/span&gt;home&lt;span class=\"hljs-operator\"&gt;/&lt;/span&gt;mapreduce_result`\n&lt;span class=\"hljs-keyword\"&gt;ORDER&lt;/span&gt; &lt;span class=\"hljs-keyword\"&gt;BY&lt;/span&gt; count\nLIMIT &lt;span class=\"hljs-number\"&gt;30&lt;/span&gt;;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"708\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-708\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-708\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-708.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"stop-cluster\"&gt;&lt;a href=\"en/overview/try-yt.html#stop-cluster\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Stopping a cluster&lt;/span&gt;&lt;/a&gt;Stopping a cluster&lt;/h2&gt;\n&lt;div class=\"yfm-tabs yfm-tabs-dropdown\" data-diplodoc-group=\"defaultTabsGroup-kczezmht\" data-diplodoc-variant=\"dropdown\"&gt;\n&lt;div role=\"tablist\" class=\"yfm-tabs-dropdown-select filled\"&gt;Docker&lt;/div&gt;\n&lt;ul class=\"yfm-tabs-dropdown-menu\"&gt;&lt;li class=\"yfm-tab active\" data-diplodoc-id=\"docker-4\" data-diplodoc-key=\"docker\" selected&gt;Docker&lt;/li&gt;&lt;li class=\"yfm-tab\" data-diplodoc-id=\"minikube-4\" data-diplodoc-key=\"minikube\"&gt;Minikube&lt;/li&gt;&lt;/ul&gt;&lt;div id=\"v58bioqy\" class=\"yfm-tab-panel active\" role=\"tabpanel\" data-title=\"Docker\"&gt;\n&lt;p&gt;To stop a YTsaurus cluster, shut down the &lt;code&gt;yt.frontend&lt;/code&gt; and &lt;code&gt;yt.backend&lt;/code&gt; containers. To do this, run the command:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;./run_local_cluster.sh --stop\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"728\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-728\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-728\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-728.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;This command stops (executes &lt;code&gt;docker stop&lt;/code&gt;) and then removes (&lt;code&gt;docker rm&lt;/code&gt;) the containers.&lt;/p&gt;\n&lt;/div&gt;\n&lt;div id=\"1u1slido\" class=\"yfm-tab-panel\" role=\"tabpanel\" data-title=\"Minikube\"&gt;\n&lt;ol&gt;\n&lt;li&gt;\n&lt;p&gt;Delete the YTsaurus cluster:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;kubectl delete -f cluster_v1_local.yaml\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"739\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-739\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-739\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-739.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;Uninstall the operator:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;helm uninstall ytsaurus\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"745\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-745\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-745\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-745.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;Stop the Kubernetes cluster:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;minikube stop\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"751\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-751\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-751\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-751.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;Delete the Kubernetes cluster:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;minikube delete\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"757\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-757\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-757\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-757.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;Clear the Minikube cache:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;&lt;span class=\"hljs-built_in\"&gt;rm&lt;/span&gt; -rf ~/.minikube/\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"763\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-763\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-763\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-763.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;If you used Podman:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;podman &lt;span class=\"hljs-built_in\"&gt;rm&lt;/span&gt; -f minikube\npodman volume &lt;span class=\"hljs-built_in\"&gt;rm&lt;/span&gt; minikube\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"769\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-769\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-769\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-769.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;/li&gt;\n&lt;/ol&gt;\n&lt;/div&gt;\n&lt;/div&gt;\n&lt;h2 id=\"demo\"&gt;&lt;a href=\"en/overview/try-yt.html#demo\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Demo Stand&lt;/span&gt;&lt;/a&gt;Demo Stand&lt;/h2&gt;\n&lt;p&gt;This is an online demonstration of the capabilities offered by YTsaurus. To get access to the demo cluster, &lt;a href=\"https://ytsaurus.tech/#demo\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;fill out this form&lt;/a&gt;. After that, an email with information for accessing the cluster will be sent to your specified address.&lt;/p&gt;\n&lt;p&gt;The demo stand features several environments for interacting with YTsaurus:&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Jupyter Notebook&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;The notebook provides numerous examples for working with YTsaurus, including operations for creating tables, uploading data, and using CHYT, SPYT, and YQL, as well as SDK examples. For an overview of all available examples, see &lt;strong&gt;About YTsaurus demo&lt;/strong&gt;, the notebook home page.&lt;/p&gt;\n&lt;p&gt;A link to a deployed Jupyter Notebook will be included in the email.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"images/try-yt-jupyter.png\" alt=\"\" /&gt;&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Web interface&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Here you can test out the features of the YTsaurus web interface: explore the file system, see the list of pools, and run queries in &lt;a href=\"user-guide/query-tracker/about.html\"&gt;Query Tracker&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;A link to the web interface of a deployed cluster will be included in the email.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"images/try-yt-ui.png\" alt=\"\" /&gt;&lt;/p&gt;\n&lt;p&gt;For more information about using the web interface, watch the &lt;a href=\"https://youtu.be/LTKtY5okG4c?t=929\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;introductory webinar&lt;/a&gt; (the timestamp is 15:30).&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"troubleshooting\"&gt;&lt;a href=\"en/overview/try-yt.html#troubleshooting\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Troubleshooting&lt;/span&gt;&lt;/a&gt;Troubleshooting&lt;/h2&gt;\n&lt;p&gt;If you're having trouble getting something to work, don't hesitate to ask your questions in our &lt;a href=\"https://t.me/ytsaurus\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;community Telegram chat&lt;/a&gt;. We'll do our best to help you.&lt;/p&gt;\n&lt;p&gt;To share your suggestions or comments on the documentation, &lt;a href=\"https://github.com/ytsaurus/ytsaurus/issues\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;create an issue&lt;/a&gt; in the project's GitHub repository. Your feedback is always welcome; it helps us make the documentation more informative.&lt;/p&gt;\n&lt;dfn class=\"yfm yfm-term_dfn\" id=\":about-cypress_element\" role=\"dialog\"&gt;&lt;p&gt;Cypress is a distributed file system and metadata storage. Cypress stores tables and files. To learn more, see the &lt;a href=\"en/overview/user-guide/storage/cypress.html\"&gt;documentation&lt;/a&gt;.&lt;/p&gt;\n&lt;/dfn&gt;&lt;dfn class=\"yfm yfm-term_dfn\" id=\":about-docker-containers_element\" role=\"dialog\"&gt;&lt;p&gt;Container images are collected from the Dockerfile available &lt;a href=\"https://github.com/ytsaurus/ytsaurus/blob/main/yt/docker/ytsaurus/Dockerfile\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;here&lt;/a&gt;.&lt;/p&gt;\n&lt;/dfn&gt;&lt;dfn class=\"yfm yfm-term_dfn\" id=\":about-qt_element\" role=\"dialog\"&gt;&lt;p&gt;A tool for running SQL-like queries. Query Tracker is available in the web interface, under &lt;strong&gt;Queries&lt;/strong&gt;. To learn more, see the &lt;a href=\"en/overview/user-guide/query-tracker/about.html\"&gt;documentation&lt;/a&gt;.&lt;/p&gt;\n&lt;/dfn&gt;&lt;dfn class=\"yfm yfm-term_dfn\" id=\":about-yql_element\" role=\"dialog\"&gt;&lt;p&gt;A declarative query language for data storage and processing systems. It's based on SQL syntax. &lt;/p&gt;\n&lt;/dfn&gt;&lt;dfn class=\"yfm yfm-term_dfn\" id=\":about-master_element\" role=\"dialog\"&gt;&lt;p&gt;The master server is responsible for fault-tolerant storage of the cluster's metadata. This includes information about system users, stored objects, and the location of the data itself. To learn more, see the &lt;a href=\"en/overview/admin-guide/components.html#master\"&gt;documentation&lt;/a&gt;.&lt;/p&gt;\n&lt;/dfn&gt;&lt;dfn class=\"yfm yfm-term_dfn\" id=\":about-scheduler_element\" role=\"dialog\"&gt;&lt;p&gt;The scheduler is responsible for allocating resources between operations as well as for their execution on the cluster. To learn more, see the &lt;a href=\"en/overview/user-guide/data-processing/scheduler/scheduler-and-pools.html\"&gt;documentation&lt;/a&gt;.&lt;/p&gt;\n&lt;/dfn&gt;","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"en/overview/try-yt.md","sourcePath":"en/overview/try-yt.md"},"headings":[{"title":"Before you start","href":"en/overview/try-yt.html#prerequisites","level":2},{"title":"Installing and starting a YTsaurus cluster","href":"en/overview/try-yt.html#launch-cluster","level":2},{"title":"Installing the YTsaurus CLI","href":"en/overview/try-yt.html#install-cli","level":2},{"title":"Executing examples","href":"en/overview/try-yt.html#launch-example","level":2,"items":[{"title":"Set environment variables","href":"en/overview/try-yt.html#set-vars","level":3},{"title":"Create a table","href":"en/overview/try-yt.html#create-table","level":3},{"title":"Write data","href":"en/overview/try-yt.html#insert-data","level":3},{"title":"Read the result","href":"en/overview/try-yt.html#get-result","level":3},{"title":"Advanced example: running MapReduce","href":"en/overview/try-yt.html#mr","level":3,"items":[{"title":"1. Prepare the data","href":"en/overview/try-yt.html#mr-prepare-data","level":4},{"title":"2. Create a table","href":"en/overview/try-yt.html#mr-create-table","level":4},{"title":"3. Run MapReduce","href":"en/overview/try-yt.html#mr-run","level":4},{"title":"4. Read the result","href":"en/overview/try-yt.html#mr-get-result","level":4}]}]},{"title":"Stopping a cluster","href":"en/overview/try-yt.html#stop-cluster","level":2},{"title":"Demo Stand","href":"en/overview/try-yt.html#demo","level":2},{"title":"Troubleshooting","href":"en/overview/try-yt.html#troubleshooting","level":2}],"title":"How to try YTsaurus"},"router":{"pathname":"en/overview/try-yt","depth":3,"base":"../../"},"lang":"en","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/en/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-a29ea7877730322f2ce693378d06d02ac2b374cd-en","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
