            {"data":{"leading":false,"html":"&lt;p&gt;This guide offers a look at YTsaurus in action and describes the process of installing and starting a cluster. You'll deploy a local YTsaurus cluster, create a table, and run a simple SELECT query. Then, you'll deal with a slightly more complex challenge and solve the classic Word Count problem with a MapReduce operation.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Note&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;The fastest way to familiarize yourself with the product's features is by using the &lt;a href=\"en/overview/try-yt.html#demo\"&gt;Demo Stand&lt;/a&gt;. It provides temporary access to a demo cluster that includes all the required YTsaurus components. All you need is a web browser.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"prerequisites\"&gt;&lt;a href=\"en/overview/try-yt.html#prerequisites\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Before you start&lt;/span&gt;&lt;/a&gt;Before you start&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;\n&lt;p&gt;We recommend using an x86_64 Linux operating environment for YTsaurus. If you're using MacOS with an Apple Silicon processor, you'll need to use the x86 emulation mode to install YTsaurus locally. This can be achieved by using the &lt;a href=\"https://docs.docker.com/desktop/setup/install/mac-install/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Docker Desktop&lt;/a&gt; virtualization platform with &lt;a href=\"https://support.apple.com/en-us/102527\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Rosetta 2&lt;/a&gt; enabled. However, keep in mind that YTsaurus &lt;strong&gt;isn't guaranteed&lt;/strong&gt; to work in emulation mode. &lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;In this guide, you'll start a YTsaurus cluster with a minimal configuration, which means it will offer no guarantees of fault tolerance. Don't use this configuration in a production environment or for performance testing. Examples of how to configure your cluster configuration are available in the &lt;a href=\"admin-guide/prepare-spec.html\"&gt;Administrator manual&lt;/a&gt;.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;For the examples to work correctly, Python 3.8+ must be installed on your system.&lt;/p&gt;\n&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"launch-cluster\"&gt;&lt;a href=\"en/overview/try-yt.html#launch-cluster\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Installing and starting a YTsaurus cluster&lt;/span&gt;&lt;/a&gt;Installing and starting a YTsaurus cluster&lt;/h2&gt;\n&lt;p&gt;This guide offers two methods for installing a YTsaurus cluster: using &lt;a href=\"https://www.docker.com/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Docker&lt;/a&gt; and using &lt;a href=\"https://minikube.sigs.k8s.io/docs/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Minikube&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;Regardless of the installation method, the required system components will be deployed in the process, including the &lt;i class=\"yfm yfm-term_title\" term-key=\":about-master\" role=\"button\" aria-describedby=\":about-master_element\" tabindex=\"0\" id=\"gb9sre5u\"&gt;master server&lt;/i&gt;, &lt;i class=\"yfm yfm-term_title\" term-key=\":about-scheduler\" role=\"button\" aria-describedby=\":about-scheduler_element\" tabindex=\"0\" id=\"hx6ch6xr\"&gt;scheduler&lt;/i&gt;, &lt;i class=\"yfm yfm-term_title\" term-key=\":about-yql\" role=\"button\" aria-describedby=\":about-yql_element\" tabindex=\"0\" id=\"v51f80cn\"&gt;YQL&lt;/i&gt;, &lt;i class=\"yfm yfm-term_title\" term-key=\":about-qt\" role=\"button\" aria-describedby=\":about-qt_element\" tabindex=\"0\" id=\"tdysy737\"&gt;Query Tracker&lt;/i&gt;, and others. All examples in this guide — table creation, data upload, and running MapReduce — apply regardless of your preferred installation method and will be the same for both Docker and Minikube.&lt;/p&gt;\n&lt;div class=\"yfm-tabs yfm-tabs-dropdown\" data-diplodoc-group=\"defaultTabsGroup-md5pk4zz\" data-diplodoc-variant=\"dropdown\"&gt;\n&lt;div role=\"tablist\" class=\"yfm-tabs-dropdown-select filled\"&gt;Docker&lt;/div&gt;\n&lt;ul class=\"yfm-tabs-dropdown-menu\"&gt;&lt;li class=\"yfm-tab active\" data-diplodoc-id=\"docker\" data-diplodoc-key=\"docker\" selected&gt;Docker&lt;/li&gt;&lt;li class=\"yfm-tab\" data-diplodoc-id=\"minikube\" data-diplodoc-key=\"minikube\"&gt;Minikube&lt;/li&gt;&lt;/ul&gt;&lt;div id=\"ud822rk1\" class=\"yfm-tab-panel active\" role=\"tabpanel\" data-title=\"Docker\"&gt;\n&lt;ol&gt;\n&lt;li&gt;\n&lt;p&gt;Install Docker:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;If you're using Linux x86_64, install &lt;a href=\"https://docs.docker.com/engine/install/ubuntu/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Docker Engine&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;If you're using MacOS, install either &lt;a href=\"https://docs.docker.com/desktop/setup/install/mac-install/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Docker Desktop&lt;/a&gt; or &lt;a href=\"https://podman.io/docs/installation\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Podman&lt;/a&gt;. Make sure that you have &lt;a href=\"https://support.apple.com/en-us/102527\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Rosetta 2&lt;/a&gt; installed and enabled.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;Download the &lt;a href=\"https://github.com/ytsaurus/ytsaurus/tree/main/yt/docker/local\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;run_local_cluster.sh&lt;/a&gt; script for deploying the cluster, and set execution permissions:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;&lt;span class=\"hljs-built_in\"&gt;mkdir&lt;/span&gt; ~/yt-local &amp;amp;&amp;amp; &lt;span class=\"hljs-built_in\"&gt;cd&lt;/span&gt; ~/yt-local\ncurl -s https://raw.githubusercontent.com/ytsaurus/ytsaurus/main/yt/docker/local/run_local_cluster.sh &amp;gt; run_local_cluster.sh\n&lt;span class=\"hljs-built_in\"&gt;chmod&lt;/span&gt; +x run_local_cluster.sh\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"77\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-77\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-77\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-77.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;Run the script to deploy the cluster:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;./run_local_cluster.sh\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"83\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-83\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-83\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-83.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;The script creates and runs &lt;i class=\"yfm yfm-term_title\" term-key=\":about-docker-containers\" role=\"button\" aria-describedby=\":about-docker-containers_element\" tabindex=\"0\" id=\"rft2o1ia\"&gt;docker containers&lt;/i&gt; for deploying YTsaurus. If the operation is successful, you'll see the following message:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;Congratulations! Local cluster is up and running. To use the cluster web interface, point your browser to http://localhost:8001. Or, if you prefer command-line tool 'yt', use it like this: 'yt --proxy localhost:8000 &amp;lt;command&amp;gt;'.\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"87\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-87\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-87\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-87.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Remember the addresses listed in this message — you'll need them later.&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;localhost:8001&lt;/code&gt; is the web interface address. You can open it in your browser.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;localhost:8000&lt;/code&gt; is the cluster's backend address. You'll need to &lt;a href=\"en/overview/try-yt.html#set-vars\"&gt;specify&lt;/a&gt; it as the proxy address to access the cluster via the CLI.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;To make sure everything works correctly, run the following command:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;$ docker ps | grep yt\nCONTAINER ID   IMAGE                           COMMAND                  CREATED         STATUS         PORTS              NAMES\n2c254e35037c   ghcr.io/ytsaurus/local:stable   &lt;span class=\"hljs-string\"&gt;\"--fqdn localhost --…\"&lt;/span&gt;   2 minutes ago   Up 2 minutes   80/tcp, 8002/tcp   yt.backend\n5235b5077b5b   ghcr.io/ytsaurus/ui:stable      &lt;span class=\"hljs-string\"&gt;\"\"&lt;/span&gt;                       2 minutes ago   Up 2 minutes   80/tcp             yt.frontend\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"108\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-108\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-108\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-108.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;You should have two containers running:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;yt.frontend&lt;/code&gt;: Handles processes related to the web interface.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;yt.backend&lt;/code&gt;: Hosts YTsaurus cluster components.&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;About YTsaurus components&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;To find out what YTsaurus components are deployed on your system, check the list of processes running within the container:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;$ docker &lt;span class=\"hljs-built_in\"&gt;exec&lt;/span&gt; -it yt.backend /bin/bash\n$ ps -axo &lt;span class=\"hljs-built_in\"&gt;command&lt;/span&gt; | grep ytserver\n/mnt/rosetta /usr/bin/python3.8 /usr/local/bin/yt_local start --proxy-port 80 --local-cypress-dir /var/lib/yt/local-cypress --fqdn localhost --ytserver-all-path /usr/bin/ytserver-all --&lt;span class=\"hljs-built_in\"&gt;sync&lt;/span&gt; --fqdn localhost --proxy-config {coordinator={public_fqdn=&lt;span class=\"hljs-string\"&gt;\"localhost:8000\"&lt;/span&gt;}} --rpc-proxy-count 0 --rpc-proxy-port 8002 --node-count 1 --queue-agent-count 1 --address-resolver-config {enable_ipv4=%&lt;span class=\"hljs-literal\"&gt;true&lt;/span&gt;;enable_ipv6=%&lt;span class=\"hljs-literal\"&gt;false&lt;/span&gt;;} --native-client-supported --&lt;span class=\"hljs-built_in\"&gt;id&lt;/span&gt; primary -c {name=query-tracker} -c {name=yql-agent;config={path=&lt;span class=\"hljs-string\"&gt;\"/usr/bin\"&lt;/span&gt;;count=1;artifacts_path=&lt;span class=\"hljs-string\"&gt;\"/usr/bin\"&lt;/span&gt;}}\n/mnt/rosetta /primary/bin/ytserver-http-proxy --pdeathsig 9 --config /primary/configs/http-proxy-0.yson --pdeathsig 15 --setsid\n/mnt/rosetta /primary/bin/ytserver-master --pdeathsig 9 --config /primary/configs/master-0-0.yson --pdeathsig 15 --setsid\n/mnt/rosetta /primary/bin/ytserver-queue-agent --pdeathsig 9 --config /primary/configs/queue_agent-0.yson --pdeathsig 15 --setsid\n/mnt/rosetta /primary/bin/ytserver-node --pdeathsig 9 --config /primary/configs/node-0.yson --pdeathsig 15 --setsid\n/mnt/rosetta /primary/bin/ytserver-scheduler --pdeathsig 9 --config /primary/configs/scheduler-0.yson --pdeathsig 15 --setsid\n/mnt/rosetta /primary/bin/ytserver-controller-agent --pdeathsig 9 --config /primary/configs/controller_agent-0.yson --pdeathsig 15 --setsid\n/mnt/rosetta /primary/bin/ytserver-query-tracker --pdeathsig 9 --config /primary/configs/query_tracker-0.yson --pdeathsig 15 --setsid\n/mnt/rosetta /usr/bin/ytserver-yql-agent --pdeathsig 9 --config /primary/configs/yql_agent-0.yson --pdeathsig 15 --setsid\n/mnt/rosetta /usr/bin/grep --color=auto ytserver\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"130\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-130\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-130\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-130.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;As you can see, we launched the following components:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;The &lt;a href=\"admin-guide/components#master\"&gt;master server&lt;/a&gt; is responsible for fault-tolerant storage of the cluster's metadata. This includes information about system users, stored objects, and the location of the data itself.&lt;/li&gt;\n&lt;li&gt;The node combines the functionality of a &lt;a href=\"admin-guide/components.html#data-nodes\"&gt;data node&lt;/a&gt; and an &lt;a href=\"admin-guide/components.html#exec-nodes\"&gt;exec node&lt;/a&gt;. It is responsible for data storage, dynamic tables, and job execution.&lt;/li&gt;\n&lt;li&gt;The &lt;a href=\"admin-guide/components.html#planirovshik\"&gt;scheduler&lt;/a&gt; plans data processing operations, such as Map and Reduce.&lt;/li&gt;\n&lt;li&gt;The &lt;a href=\"admin-guide/components.html#planirovshik\"&gt;controller agent&lt;/a&gt; schedules the jobs of individual operations.&lt;/li&gt;\n&lt;li&gt;The &lt;a href=\"admin-guide/components.html#proxy\"&gt;HTTP proxy&lt;/a&gt; is a server used for external communication.&lt;/li&gt;\n&lt;li&gt;The &lt;a href=\"admin-guide/components.html#yql-agent\"&gt;YQL agent&lt;/a&gt; is an execution engine for SQL-like queries.&lt;/li&gt;\n&lt;li&gt;The &lt;a href=\"user-guide/dynamic-tables/queues.html\"&gt;YTsaurus queue&lt;/a&gt; contains ordered dynamic tables.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"user-guide/query-tracker/about.html\"&gt;Query Tracker&lt;/a&gt; is a component for running queries in different SQL dialects (YQL, QT, CHYT, SPYT).&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;Done! Now YTsaurus is deployed and ready for use. You may proceed to the next step. After you finish working with the examples, remember to &lt;a href=\"en/overview/try-yt.html#stop-cluster\"&gt;delete&lt;/a&gt; the cluster.&lt;/p&gt;\n&lt;/li&gt;\n&lt;/ol&gt;\n&lt;/div&gt;\n&lt;div id=\"fgngi35e\" class=\"yfm-tab-panel\" role=\"tabpanel\" data-title=\"Minikube\"&gt;\n&lt;p&gt;In this example, you'll deploy a local Kubernetes cluster consisting of a single node and run a YTsaurus cluster within it. We'll use Docker as the container execution engine.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Resource requirements&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;To successfully deploy YTsaurus on a Kubernetes cluster, the host machine must have:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;At least four CPU cores.&lt;/li&gt;\n&lt;li&gt;At least 8 GB of RAM.&lt;/li&gt;\n&lt;li&gt;At least 30 GB of disk space.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;To install YTsaurus in Minikube, follow these steps:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;a href=\"en/overview/try-yt.html#setup\"&gt;Set up the environment&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"en/overview/try-yt.html#k8s-start\"&gt;Deploy a Kubernetes cluster&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"en/overview/try-yt.html#cert-manager-apply\"&gt;Install cert-manager&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"en/overview/try-yt.html#operator-install\"&gt;Install the YTsaurus operator&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"en/overview/try-yt.html#yt-start\"&gt;Start the YTsaurus cluster&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"en/overview/try-yt.html#set-url\"&gt;Check network access&lt;/a&gt;&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;For a more detailed description of the installation process, watch &lt;a href=\"https://www.youtube.com/watch?v=LTKtY5okG4c\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;this webinar&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;&lt;/p&gt;\n&lt;h4 id=\"setup\"&gt;&lt;a href=\"en/overview/try-yt.html#setup\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;1. Set up the environment&lt;/span&gt;&lt;/a&gt;1. Set up the environment&lt;/h4&gt;\n&lt;ul&gt;\n&lt;li&gt;Install Docker:\n&lt;ul&gt;\n&lt;li&gt;If you're using Linux, install &lt;a href=\"https://docs.docker.com/engine/install/ubuntu/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Docker Engine&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;If you're using MacOS, install either &lt;a href=\"https://docs.docker.com/desktop/setup/install/mac-install/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Docker Desktop&lt;/a&gt; or &lt;a href=\"https://podman.io/docs/installation\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Podman&lt;/a&gt;. Make sure that you have Rosetta 2 installed and enabled.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;li&gt;Install &lt;a href=\"https://kubernetes.io/docs/tasks/tools/#kubectl\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;kubectl&lt;/a&gt;, a utility program for managing Kubernetes clusters.&lt;/li&gt;\n&lt;li&gt;Install &lt;a href=\"https://kubernetes.io/ru/docs/tasks/tools/install-minikube/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Minikube&lt;/a&gt;, a utility program for running a simple Kubernetes cluster on a local machine.&lt;/li&gt;\n&lt;li&gt;Install &lt;a href=\"https://helm.sh/docs/intro/install/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Helm&lt;/a&gt;, a package manager for installing YTsaurus components in Kubernetes.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h4 id=\"k8s-start\"&gt;&lt;a href=\"en/overview/try-yt.html#k8s-start\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;2. Deploy a Kubernetes cluster&lt;/span&gt;&lt;/a&gt;2. Deploy a Kubernetes cluster&lt;/h4&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;$ minikube start  --cpus=6 --memory=8192 --driver=docker\n\n&lt;span class=\"hljs-comment\"&gt;# If you're using Podman&lt;/span&gt;\n&lt;span class=\"hljs-comment\"&gt;# minikube start --cpus=6 --memory=8192 --driver=podman&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"300\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-300\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-300\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-300.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Once your Kubernetes cluster is deployed, the following command should execute successfully:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;$ kubectl cluster-info\nKubernetes control plane is running at https://127.0.0.1:36399\nCoreDNS is running at https://127.0.0.1:36399/api/v1/namespaces/kube-system/services/kube-dns:dns/proxy\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"304\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-304\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-304\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-304.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h4 id=\"cert-manager-apply\"&gt;&lt;a href=\"en/overview/try-yt.html#cert-manager-apply\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;3. Install cert-manager&lt;/span&gt;&lt;/a&gt;3. Install cert-manager&lt;/h4&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;kubectl apply -f https://github.com/cert-manager/cert-manager/releases/download/v1.17.1/cert-manager.yaml\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"308\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-308\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-308\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-308.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Wait for the &lt;code&gt;cert-manager-webhook&lt;/code&gt; pod to enter the &lt;code&gt;Running&lt;/code&gt; state:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;$ kubectl get pods -A\nNAMESPACE        NAME                                        READY   STATUS      RESTARTS   AGE\ncert-manager     cert-manager-7b5cdf866f-5lfth               1/1     Running     0          2m12s\ncert-manager     cert-manager-cainjector-7c9788477c-xdp8l    1/1     Running     0          2m12s\ncert-manager     cert-manager-webhook-764949f558-dldzp       1/1     Running     0          2m12s\nkube-system      coredns-668d6bf9bc-774xg                    1/1     Running     0          2m57s\n...\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"312\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-312\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-312\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-312.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h4 id=\"operator-install\"&gt;&lt;a href=\"en/overview/try-yt.html#operator-install\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;4. Install the YTsaurus operator&lt;/span&gt;&lt;/a&gt;4. Install the YTsaurus operator&lt;/h4&gt;\n&lt;p&gt;The &lt;a href=\"https://github.com/ytsaurus/ytsaurus-k8s-operator\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;YTsaurus operator&lt;/a&gt; is a program that manages YTsaurus execution in a Kubernetes cluster. The operator ensures that all YTsaurus components are up and running correctly.&lt;/p&gt;\n&lt;p&gt;Install the chart:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;helm install ytsaurus oci://ghcr.io/ytsaurus/ytop-chart --version 0.20.0\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"322\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-322\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-322\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-322.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;If you see the error 'Internal error occurred: failed calling webhook \"webhook.cert-manager.io\"'&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Check the status of the &lt;code&gt;cert-manager-webhook&lt;/code&gt; pod:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;$ kubectl get pods -A\nNAMESPACE       NAME                                      READY   STATUS               RESTARTS   AGE\ncert-manager    cert-manager-7b5cdf866f-5lfth             1/1     ContainerCreating    0          2m12s\ncert-manager    cert-manager-cainjector-7c9788477c-xdp8l  1/1     ContainerCreating    0          2m12s\ncert-manager    cert-manager-webhook-764949f558-dldzp     1/1     ContainerCreating    0          2m12s\n...\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"331\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-331\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-331\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-331.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;If the pod's status is &lt;code&gt;ContainerCreating&lt;/code&gt;, wait for its installation to complete and try restarting the command: &lt;code&gt;helm install ytsaurus oci://ghcr.io/ytsaurus/ytop-chart --version 0.20.0&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;If the pod's status is &lt;code&gt;ImagePullBackOff&lt;/code&gt;, it means that the system can't download the required images. Most likely, this is caused by the network settings within Minikube. Click &lt;a href=\"https://cert-manager.io/docs/troubleshooting/webhook/#error-connect-connection-refused\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;here&lt;/a&gt; for possible solutions.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;Wait for the operator to enter the &lt;code&gt;Running&lt;/code&gt; state:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;$ kubectl get pod\nNAME                                                      READY   STATUS     RESTARTS   AGE\nytsaurus-ytop-chart-controller-manager-5765c5f995-dntph   2/2     Running    0          7m57s\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"343\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-343\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-343\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-343.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h4 id=\"yt-start\"&gt;&lt;a href=\"en/overview/try-yt.html#yt-start\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;5. Start the YTsaurus cluster&lt;/span&gt;&lt;/a&gt;5. Start the YTsaurus cluster&lt;/h4&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;curl -s https://raw.githubusercontent.com/ytsaurus/ytsaurus/refs/heads/main/yt/docs/code-examples/cluster-config/cluster_v1_local.yaml &amp;gt; cluster_v1_local.yaml\nkubectl apply -f cluster_v1_local.yaml\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"347\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-347\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-347\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-347.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;It usually takes a few minutes for a YTsaurus cluster to start. If everything is successful, the list of running pods will look like this:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;$ kubectl get pod\nNAME                                                      READY   STATUS              RESTARTS   AGE\nca-0                                                      1/1     Running     0          8m43s\ndnd-0                                                     1/1     Running     0          8m44s\ndnd-1                                                     1/1     Running     0          8m44s\ndnd-2                                                     1/1     Running     0          8m44s\nds-0                                                      1/1     Running     0          11m\nend-0                                                     1/1     Running     0          8m43s\nhp-0                                                      1/1     Running     0          8m44s\nhp-control-0                                              1/1     Running     0          8m44s\nms-0                                                      1/1     Running     0          11m\nrp-0                                                      1/1     Running     0          8m43s\nrp-heavy-0                                                1/1     Running     0          8m43s\nsch-0                                                     1/1     Running     0          8m39s\nstrawberry-controller-679786577b-4p5kz                    1/1     Running     0          7m17s\nyt-client-init-job-user-ljfqf                             1/1     Running     0          8m39s\nyt-master-init-job-default-hdnfm                          1/1     Running     0          9m23s\nyt-master-init-job-enablerealchunks-575hk                 1/1     Running     0          8m50s\nyt-strawberry-controller-init-job-cluster-l5gns           1/1     Running     0          8m17s\nyt-strawberry-controller-init-job-user-nn9lk              1/1     Running     0          8m34s\nyt-ui-init-job-default-6w5zv                              1/1     Running     0          8m43s\nytsaurus-ui-deployment-7b469d5cc8-596sf                   1/1     Running     0          8m35s\nytsaurus-ytop-chart-controller-manager-859b7bbddf-jc5sv   2/2     Running     0          14m\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"351\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-351\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-351\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-351.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;If pods are stuck in the &lt;code&gt;Pending&lt;/code&gt; status&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Most likely, this is due to insufficient resources. Delete the Minikube cluster and try creating it again, this time allocating more resources at launch.&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;$ kubectl delete -f cluster_v1_local.yaml\n$ minikube delete\n$ minikube start --cpus=8 --memory=10000 --driver=docker\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"360\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-360\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-360\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-360.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;If the specified resources exceed the limit set in your Podman configurations, increase this limit in the settings section.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"images/try-yt-podman-settings.png\" alt=\"\" /&gt;&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h4 id=\"set-url\"&gt;&lt;a href=\"en/overview/try-yt.html#set-url\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;6. Check network access&lt;/span&gt;&lt;/a&gt;6. Check network access&lt;/h4&gt;\n&lt;p&gt;To check the address at which the YTsaurus cluster will be available, run the following commands:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;&lt;span class=\"hljs-comment\"&gt;# Network access to the web interface&lt;/span&gt;\n$ minikube service ytsaurus-ui --url\nhttp://192.168.49.2:30539\n\n&lt;span class=\"hljs-comment\"&gt;# Network access to the proxy&lt;/span&gt;\n$ minikube service http-proxies-lb --url\nhttp://192.168.49.2:30228\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"375\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-375\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-375\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-375.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;The web interface is available at the first link. To log in, use:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;Login: admin\nPassword: password\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"379\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-379\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-379\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-379.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;How to access the web interface if the cluster is deployed on a remote host&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;ol&gt;\n&lt;li&gt;\n&lt;p&gt;On the remote host, run the command:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;$ minikube service http-proxies-lb --url\n&amp;lt;HOST&amp;gt;:&amp;lt;PORT&amp;gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"390\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-390\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-390\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-390.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;You'll need the &lt;code&gt;&amp;lt;HOST&amp;gt;&lt;/code&gt; and &lt;code&gt;&amp;lt;PORT&amp;gt;&lt;/code&gt; values for the next step.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;On the local host, start a new terminal session and run the following:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;ssh -fnNT -L 127.0.0.1:8080:&amp;lt;HOST&amp;gt;:&amp;lt;PORT&amp;gt; &amp;lt;VM&amp;gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"399\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-399\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-399\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-399.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;The web interface will be available at &lt;a href=\"http://127.0.0.1:8080\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;127.0.0.1:8080&lt;/a&gt;.&lt;/p&gt;\n&lt;/li&gt;\n&lt;/ol&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;You can use the second link to connect to the cluster from the command line. For more information, see the examples section below.&lt;/p&gt;\n&lt;h4 id=\"done\"&gt;&lt;a href=\"en/overview/try-yt.html#done\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Done!&lt;/span&gt;&lt;/a&gt;Done!&lt;/h4&gt;\n&lt;p&gt;YTsaurus is now deployed and ready for use. You may proceed to the next step. After you finish working with the examples, remember to &lt;a href=\"en/overview/try-yt.html#stop-cluster\"&gt;delete&lt;/a&gt; the cluster.&lt;/p&gt;\n&lt;/div&gt;\n&lt;/div&gt;\n&lt;h2 id=\"install-cli\"&gt;&lt;a href=\"en/overview/try-yt.html#install-cli\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Installing the YTsaurus CLI&lt;/span&gt;&lt;/a&gt;Installing the YTsaurus CLI&lt;/h2&gt;\n&lt;p&gt;The most convenient way to interact with the YTsaurus system is through the console. The &lt;a href=\"api/cli/cli.html\"&gt;YTsaurus CLI&lt;/a&gt; utility isn't installed as part of the cluster deployment process. You need to install it on your system separately.&lt;/p&gt;\n&lt;p&gt;First, install the pip3 package manager if you don't already have it installed:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;&lt;span class=\"hljs-built_in\"&gt;sudo&lt;/span&gt; apt update\n&lt;span class=\"hljs-built_in\"&gt;sudo&lt;/span&gt; apt install python3-pip\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"427\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-427\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-427\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-427.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Make sure that everything worked correctly:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;$ pip3 --version\npip 22.0.2 from ...\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"431\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-431\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-431\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-431.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Install the &lt;code&gt;ytsaurus-client&lt;/code&gt; utility:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;pip3 install --user ytsaurus-client\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"435\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-435\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-435\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-435.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Add the path to &lt;code&gt;$HOME/.local/bin&lt;/code&gt; to the &lt;code&gt;PATH&lt;/code&gt; variable:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;&lt;span class=\"hljs-built_in\"&gt;export&lt;/span&gt; PATH=&lt;span class=\"hljs-string\"&gt;\"&lt;span class=\"hljs-variable\"&gt;$PATH&lt;/span&gt;:&lt;span class=\"hljs-variable\"&gt;$HOME&lt;/span&gt;/.local/bin\"&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"439\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-439\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-439\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-439.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;How to save this change after system reboot&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;&lt;span class=\"hljs-built_in\"&gt;echo&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;'export PATH=\"$PATH:$HOME/.local/bin\"'&lt;/span&gt; &amp;gt;&amp;gt; ~/.bashrc &lt;span class=\"hljs-comment\"&gt;# This command appends the string to the end of the ~/.bashrc file&lt;/span&gt;\n&lt;span class=\"hljs-built_in\"&gt;source&lt;/span&gt; ~/.bashrc  &lt;span class=\"hljs-comment\"&gt;# Apply the changes now&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"445\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-445\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-445\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-445.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;Check if the YTsaurus CLI was successfully installed:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;$ yt --version\nVersion: YT wrapper 0.13.20\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"451\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-451\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-451\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-451.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;For more information about working with the CLI, watch the &lt;a href=\"https://youtu.be/LTKtY5okG4c?t=1456\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;introductory webinar&lt;/a&gt; (the timestamp is 24:30).&lt;/p&gt;\n&lt;h2 id=\"launch-example\"&gt;&lt;a href=\"en/overview/try-yt.html#launch-example\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Executing examples&lt;/span&gt;&lt;/a&gt;Executing examples&lt;/h2&gt;\n&lt;p&gt;In this guide, you'll create a table, write data to it, and run a simple SELECT query. The section concludes with a more complex &lt;a href=\"en/overview/try-yt.html#mr\"&gt;example&lt;/a&gt;: running a MapReduce operation.&lt;/p&gt;\n&lt;h3 id=\"set-vars\"&gt;&lt;a href=\"en/overview/try-yt.html#set-vars\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Set environment variables&lt;/span&gt;&lt;/a&gt;Set environment variables&lt;/h3&gt;\n&lt;p&gt;You'll need this to access the cluster via the CLI for the examples that follow.&lt;/p&gt;\n&lt;div class=\"yfm-tabs yfm-tabs-dropdown\" data-diplodoc-group=\"defaultTabsGroup-06ozbx1s\" data-diplodoc-variant=\"dropdown\"&gt;\n&lt;div role=\"tablist\" class=\"yfm-tabs-dropdown-select filled\"&gt;Docker&lt;/div&gt;\n&lt;ul class=\"yfm-tabs-dropdown-menu\"&gt;&lt;li class=\"yfm-tab active\" data-diplodoc-id=\"docker-2\" data-diplodoc-key=\"docker\" selected&gt;Docker&lt;/li&gt;&lt;li class=\"yfm-tab\" data-diplodoc-id=\"minikube-2\" data-diplodoc-key=\"minikube\"&gt;Minikube&lt;/li&gt;&lt;/ul&gt;&lt;div id=\"vvtgb4yy\" class=\"yfm-tab-panel active\" role=\"tabpanel\" data-title=\"Docker\"&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;&lt;span class=\"hljs-built_in\"&gt;export&lt;/span&gt; YT_PROXY=localhost:8000\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"480\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-480\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-480\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-480.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;/div&gt;\n&lt;div id=\"neyb0t5g\" class=\"yfm-tab-panel\" role=\"tabpanel\" data-title=\"Minikube\"&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;&lt;span class=\"hljs-built_in\"&gt;export&lt;/span&gt; YT_PROXY=`minikube service http-proxies-lb --url`\n&lt;span class=\"hljs-comment\"&gt;# Disable automatic proxy server detection YTsaurus&lt;/span&gt;\n&lt;span class=\"hljs-built_in\"&gt;export&lt;/span&gt; YT_CONFIG_PATCHES=&lt;span class=\"hljs-string\"&gt;'{proxy={enable_proxy_discovery=%false}}'&lt;/span&gt;\n&lt;span class=\"hljs-built_in\"&gt;export&lt;/span&gt; YT_TOKEN=password\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"483\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-483\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-483\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-483.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Warning&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Here, the token is set in an environment variable. This is done intentionally for the sake of simplicity and clarity of the example. Avoid this practice in real-world scenarios: YTsaurus provides dedicated commands for managing tokens. For more information, see &lt;a href=\"user-guide/storage/auth.html#upravlenie-tokenami\"&gt;Authentication&lt;/a&gt;.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;\n&lt;/div&gt;\n&lt;h3 id=\"create-table\"&gt;&lt;a href=\"en/overview/try-yt.html#create-table\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Create a table&lt;/span&gt;&lt;/a&gt;Create a table&lt;/h3&gt;\n&lt;p&gt;In YTsaurus, all data is stored in &lt;a href=\"user-guide/storage/static-tables.html\"&gt;tables&lt;/a&gt;. Let's create one!&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;$ yt create table //home/input_table --attributes &lt;span class=\"hljs-string\"&gt;'{schema = [{name = id; type = int64}; {name = text; type = string}]}'&lt;/span&gt;\n&amp;gt; 16-64ca-10191-47007b7d\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"502\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-502\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-502\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-502.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;The value &lt;code&gt;16-64ca-10191-47007b7d&lt;/code&gt; is the ID of the created &lt;i class=\"yfm yfm-term_title\" term-key=\":about-cypress\" role=\"button\" aria-describedby=\":about-cypress_element\" tabindex=\"0\" id=\"leh952bm\"&gt;Cypress&lt;/i&gt; node. Node IDs are useful when working with &lt;a href=\"user-guide/storage/transactions.html\"&gt;transactions&lt;/a&gt; in YTsaurus. You won't need these IDs in this example.&lt;/p&gt;\n&lt;p&gt;You can view the created table in the web interface. In your web browser, open the address that you received when starting the cluster, go to the &lt;strong&gt;Navigation&lt;/strong&gt; tab, and click the created table:&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"images/try-yt-new-table.png\" alt=\"\" /&gt;&lt;/p&gt;\n&lt;h3 id=\"insert-data\"&gt;&lt;a href=\"en/overview/try-yt.html#insert-data\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Write data&lt;/span&gt;&lt;/a&gt;Write data&lt;/h3&gt;\n&lt;p&gt;Now write some data to the table by calling the &lt;a href=\"api/cli/commands.html#write-table\"&gt;write-table&lt;/a&gt; command:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;&lt;span class=\"hljs-built_in\"&gt;echo&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;'{ \"id\": 0, \"text\": \"Hello\" } { \"id\": 1, \"text\": \"World!\" }'&lt;/span&gt; | yt write-table //home/input_table --format json\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"518\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-518\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-518\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-518.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"get-result\"&gt;&lt;a href=\"en/overview/try-yt.html#get-result\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Read the result&lt;/span&gt;&lt;/a&gt;Read the result&lt;/h3&gt;\n&lt;p&gt;To verify that the data has indeed been written to the table, run the following command:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;$ yt read-table //home/input_table --format json\n{&lt;span class=\"hljs-string\"&gt;\"id\"&lt;/span&gt;:0,&lt;span class=\"hljs-string\"&gt;\"text\"&lt;/span&gt;:&lt;span class=\"hljs-string\"&gt;\"Hello\"&lt;/span&gt;}\n{&lt;span class=\"hljs-string\"&gt;\"id\"&lt;/span&gt;:1,&lt;span class=\"hljs-string\"&gt;\"text\"&lt;/span&gt;:&lt;span class=\"hljs-string\"&gt;\"World!\"&lt;/span&gt;}\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"525\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-525\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-525\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-525.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Another way to read a table is by running a &lt;a href=\"yql/syntax/select/index.html\"&gt;SELECT&lt;/a&gt; query in the web interface. To do this, go to the &lt;strong&gt;Queries&lt;/strong&gt; tab and enter the following query:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs sql\"&gt;&lt;span class=\"hljs-keyword\"&gt;SELECT&lt;/span&gt; &lt;span class=\"hljs-operator\"&gt;*&lt;/span&gt; &lt;span class=\"hljs-keyword\"&gt;FROM&lt;/span&gt; `&lt;span class=\"hljs-operator\"&gt;/&lt;/span&gt;&lt;span class=\"hljs-operator\"&gt;/&lt;/span&gt;home&lt;span class=\"hljs-operator\"&gt;/&lt;/span&gt;input_table`;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"529\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-529\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-529\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-529.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;&lt;img src=\"images/try-yt-hello-world-select.png\" alt=\"\" /&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;I get the error 'Attribute \"cluster_name\" is not found'&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;If you deployed your YTsaurus cluster via Docker, follow these steps:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;\n&lt;p&gt;In the web interface, go to the &lt;strong&gt;Queries&lt;/strong&gt; tab.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;Click the settings icon at the top right of the page. Delete your current &lt;strong&gt;Settings&lt;/strong&gt;.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;Click &lt;strong&gt;Add setting&lt;/strong&gt; and specify the field values \"cluster\" and \"primary\", respectively. Click the checkmark.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"images/try-yt-fix-ui-cluster.png\" alt=\"\" /&gt;&lt;/p&gt;\n&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;If you deployed your YTsaurus cluster via Minikube, please let us know about this error in the &lt;a href=\"https://t.me/ytsaurus\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;community chat&lt;/a&gt;.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h3 id=\"mr\"&gt;&lt;a href=\"en/overview/try-yt.html#mr\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Advanced example: running MapReduce&lt;/span&gt;&lt;/a&gt;Advanced example: running MapReduce&lt;/h3&gt;\n&lt;p&gt;This section explains how to run a MapReduce operation, using a &lt;a href=\"https://en.wikipedia.org/wiki/Word_count\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Word Count&lt;/a&gt; problem as an example.&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;a href=\"en/overview/try-yt.html#mr-prepare-data\"&gt;Prepare the data&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"en/overview/try-yt.html#mr-create-table\"&gt;Create a table and write the data to it&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"en/overview/try-yt.html#mr-run\"&gt;Run MapReduce&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"en/overview/try-yt.html#mr-get-result\"&gt;Read the result&lt;/a&gt;&lt;/li&gt;\n&lt;/ol&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;How MapReduce works&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;For a Word Count problem, the MapReduce operation is executed according to the following algorithm:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;The source text is split into strings, with each string written to the table as a separate record.&lt;/li&gt;\n&lt;li&gt;A Map operation is performed for each record, emitting a pair of columns for each word: &lt;code&gt;(&amp;lt;word&amp;gt;, 1)&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;The output of the previous step is sorted by the first column.&lt;/li&gt;\n&lt;li&gt;A Reduce operation is performed on the first column, summing the values from the second column. The resulting output is a set of pairs: &lt;code&gt;(&amp;lt;word&amp;gt;, &amp;lt;number of mentions of the word&amp;gt;)&lt;/code&gt;.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h4 id=\"mr-prepare-data\"&gt;&lt;a href=\"en/overview/try-yt.html#mr-prepare-data\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;1. Prepare the data&lt;/span&gt;&lt;/a&gt;1. Prepare the data&lt;/h4&gt;\n&lt;p&gt;Download the &lt;a href=\"https://github.com/ytsaurus/ytsaurus/blob/main/yt/docs/code-examples/source/moem.txt\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;source text&lt;/a&gt; and convert it into a tab-separated format:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;curl -s https://raw.githubusercontent.com/ytsaurus/ytsaurus/refs/heads/main/yt/docs/code-examples/source/moem.txt &amp;gt; source.txt\nawk &lt;span class=\"hljs-string\"&gt;'{gsub(/\\t/, \"\\\\t\"); print \"lineno=\"NR\"\\ttext=\"$0}'&lt;/span&gt; source.txt &amp;gt; source.tsv\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"632\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-632\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-632\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-632.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;About the tab-separated format&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;ul&gt;\n&lt;li&gt;Table rows are separated by line breaks, &lt;code&gt;\\n&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;Columns are separated by tabs, &lt;code&gt;\\t&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;Column names and their corresponding contents are separated by an equals sign &lt;code&gt;=&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;For example, the string &lt;code&gt;lineno=1\\tsize=6\\tvalue=foobar&lt;/code&gt; describes a row with columns &lt;code&gt;lineno&lt;/code&gt;, &lt;code&gt;size&lt;/code&gt;, and &lt;code&gt;value&lt;/code&gt;, which contain the values &lt;code&gt;1&lt;/code&gt;, &lt;code&gt;6&lt;/code&gt;, and &lt;code&gt;foobar&lt;/code&gt;, respectively. Tab characters are escaped.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;Prepare the source code of the program that will run the MapReduce operation. Download the Python 3 &lt;a href=\"https://github.com/ytsaurus/ytsaurus/blob/main/yt/docs/code-examples/python/word-count.py\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;script&lt;/a&gt; and save it locally:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;curl -s https://raw.githubusercontent.com/ytsaurus/ytsaurus/refs/heads/main/yt/docs/code-examples/python/word-count.py &amp;gt; word-count.py\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"663\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-663\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-663\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-663.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h4 id=\"mr-create-table\"&gt;&lt;a href=\"en/overview/try-yt.html#mr-create-table\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;2. Create a table&lt;/span&gt;&lt;/a&gt;2. Create a table&lt;/h4&gt;\n&lt;p&gt;Create two tables, one for the source data and another for the results of executing the MapReduce operation:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;yt create table //home/mapreduce_input --attributes &lt;span class=\"hljs-string\"&gt;'{schema = [{name = lineno; type = string}; {name = text; type = string}]}'&lt;/span&gt;\nyt create table //home/mapreduce_result --attributes &lt;span class=\"hljs-string\"&gt;'{schema = [{name = count; type = string}; {name = word; type = string}]}'&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"670\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-670\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-670\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-670.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;If you get 'Cannot determine backend type: either driver config or proxy url should be specified,' &lt;a href=\"en/overview/try-yt.html#set-vars\"&gt;set&lt;/a&gt; the environment variable &lt;code&gt;YT_PROXY&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Now write some data to the source table by calling the &lt;a href=\"api/cli/commands.html#write-table\"&gt;write-table&lt;/a&gt; command:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;&lt;span class=\"hljs-built_in\"&gt;cat&lt;/span&gt; source.tsv | yt write-table //home/mapreduce_input --format dsv\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"677\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-677\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;anim
