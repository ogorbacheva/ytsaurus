        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;Convert the input table using a UDF or a &lt;a href=\"en/yql/syntax/expressions.html#lambda\"&gt;lambda function&lt;/a&gt; that is applied sequentially to each input row and can create zero, one, or multiple output strings per input string (similar to Map in terms of MapReduce).&lt;/p&gt;\n&lt;p&gt;The parameters of the function call after the &lt;code&gt;USING&lt;/code&gt; keyword explicitly specify the values of columns from which to pass values for each input row and in which order.&lt;/p&gt;\n&lt;p&gt;You can use functions that return the result of one of three composite types derived from &lt;code&gt;OutputType&lt;/code&gt; (supported &lt;code&gt;OutputType&lt;/code&gt; options are described below):&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;OutputType&lt;/code&gt;: Each input row must always have an output row with the schema determined by the structure type.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;OutputType?&lt;/code&gt;: The function may skip rows, returning empty values (&lt;code&gt;TUnboxedValue()&lt;/code&gt; in C++, &lt;code&gt;None&lt;/code&gt; in Python, or &lt;code&gt;null&lt;/code&gt; in JavaScript).&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;Stream&amp;lt;OutputType&amp;gt;&lt;/code&gt; or &lt;code&gt;List&amp;lt;OutputType&amp;gt;&lt;/code&gt;: An option to return multiple rows.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Regardless of the option selected above, the result is converted to a flat table with columns defined by the &lt;code&gt;OutputType&lt;/code&gt; type.&lt;/p&gt;\n&lt;p&gt;As &lt;code&gt;OutputType&lt;/code&gt;, you can use one of the types:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;Struct&amp;lt;...&amp;gt;&lt;/code&gt;: &lt;code&gt;PROCESS&lt;/code&gt; has exactly one output with entries of a given structure that is a flat table with columns corresponding to the fields &lt;code&gt;Struct&amp;lt;...&amp;gt;&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;Variant&amp;lt;Struct...&amp;gt;,...&amp;gt;&lt;/code&gt;: &lt;code&gt;PROCESS&lt;/code&gt; will have the number of outputs equal to the number of alternatives in &lt;code&gt;Variant&lt;/code&gt;. The entries of each output are represented by a flat table with columns based on fields from the relevant variant. In this case, you can access the set of &lt;code&gt;PROCESS&lt;/code&gt; outputs as a &lt;code&gt;Tuple&lt;/code&gt; of lists that can be unpacked into separate &lt;a href=\"en/yql/syntax/expressions.html#named-nodes\"&gt;named expressions&lt;/a&gt; and used independently.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;In the list of function arguments after the &lt;code&gt;USING&lt;/code&gt; keyword, you can pass one of the two special named expressions:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;TableRow()&lt;/code&gt;: The entire current row in the form of a structure.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;TableRows()&lt;/code&gt;: A lazy iterator by strings, in terms of the types &lt;code&gt;Stream&amp;lt;Struct...&amp;gt;&amp;gt;&lt;/code&gt;. In this case, the output type of the function can only be &lt;code&gt;Stream&amp;lt;OutputType&amp;gt;&lt;/code&gt; or &lt;code&gt;List&amp;lt;OutputType&amp;gt;&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Note&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;After executing &lt;code&gt;PROCESS&lt;/code&gt;, within the same query, on the resulting table (or tables), you can perform &lt;a href=\"en/yql/syntax/select/index.html\"&gt;SELECT&lt;/a&gt;, &lt;a href=\"en/yql/syntax/reduce.html\"&gt;REDUCE&lt;/a&gt;, other &lt;code&gt;PROCESS&lt;/code&gt; and so on, depending on the intended result.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;The &lt;code&gt;USING&lt;/code&gt; keyword and the function are optional: if you omit them, the source table is returned. This can be convenient for using a &lt;a href=\"en/yql/syntax/subquery.html\"&gt;subquery template&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;In &lt;code&gt;PROCESS&lt;/code&gt; you can pass multiple inputs (the input here means a table, a &lt;a href=\"en/yql/syntax/select/concat.html\"&gt;range of tables&lt;/a&gt;, a subquery, a &lt;a href=\"en/yql/syntax/expressions.html#named-nodes\"&gt;named expression&lt;/a&gt;), separated by commas. To the function from &lt;code&gt;USING&lt;/code&gt;, you can only pass in this case special named expressions &lt;code&gt;TableRow()&lt;/code&gt; or  &lt;code&gt;TableRows()&lt;/code&gt; that will have the following type:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;TableRow()&lt;/code&gt;: A &lt;code&gt;Variant&lt;/code&gt; where each element has an entry structure type from the relevant input. For each input row in the Variant, the element corresponding to the occurrence ID for this row is non-empty&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;TableRows()&lt;/code&gt;: A lazy iterator by Variants, in terms of the types &lt;code&gt;Stream&amp;lt;Variant...&amp;gt;&amp;gt;&lt;/code&gt;. The alternative has the same semantics as for &lt;code&gt;TableRow()&lt;/code&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;After &lt;code&gt;USING&lt;/code&gt; in &lt;code&gt;PROCESS&lt;/code&gt; you can optionally specify &lt;code&gt;ASSUME ORDER BY&lt;/code&gt; with a list of columns. The result of such a  &lt;code&gt;PROCESS&lt;/code&gt; statement is treated as sorted, but without actually running a sort. Sort check is performed at the query execution stage. It supports setting the sort order using the keywords &lt;code&gt;ASC&lt;/code&gt; (ascending order) and &lt;code&gt;DESC&lt;/code&gt; (descending order). Expressions are not supported in &lt;code&gt;ASSUME ORDER BY&lt;/code&gt;.&lt;/p&gt;\n&lt;h2 id=\"examples\"&gt;&lt;a href=\"en/yql/syntax/process.html#examples\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Examples&lt;/span&gt;&lt;/a&gt;Examples&lt;/h2&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;PROCESS my_table\nUSING MyUdf::MyProcessor(value)\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"93\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-93\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-93\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-93.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;$udfScript = @@\ndef MyFunc(my_list):\n    return [(int(x.key) % 2, x) for x in my_list]\n@@;\n\n-- The function returns an iterator of Variants\n$udf = Python3::MyFunc(Callable&amp;lt;(Stream&amp;lt;Struct&amp;lt;...&amp;gt;&amp;gt;) -&amp;gt; Stream&amp;lt;Variant&amp;lt;Struct&amp;lt;...&amp;gt;, Struct&amp;lt;...&amp;gt;&amp;gt;&amp;gt;&amp;gt;,\n    $udfScript\n);\n\n-- The output of the PROCESS produces a tuple of lists\n$i, $j = (PROCESS my_table USING $udf(TableRows()));\n\nSELECT * FROM $i;\nSELECT * FROM $j;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"94\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-94\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-94\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-94.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;$udfScript = @@\ndef MyFunc(stream):\n    for r in stream:\n        yield {\"alt\": r[0], \"key\": r[1].key}\n@@;\n\n-- The function accepts an iterator of Variants as input\n$udf = Python::MyFunc(Callable&amp;lt;(Stream&amp;lt;Variant&amp;lt;Struct&amp;lt;...&amp;gt;, Struct&amp;lt;...&amp;gt;&amp;gt;&amp;gt;) -&amp;gt; Stream&amp;lt;Struct&amp;lt;...&amp;gt;&amp;gt;&amp;gt;,\n    $udfScript\n);\n\nPROCESS my_table1, my_table2 USING $udf(TableRows());\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"95\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-95\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-95\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-95.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"en/yql/syntax/process.md","sourcePath":"en/yql/syntax/process.md"},"headings":[{"title":"Examples","href":"en/yql/syntax/process.html#examples","level":2}],"title":"PROCESS"},"router":{"pathname":"en/yql/syntax/process","depth":4,"base":"../../../"},"lang":"en","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/en/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-a29ea7877730322f2ce693378d06d02ac2b374cd-en","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
