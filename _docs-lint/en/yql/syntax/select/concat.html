        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;In standard SQL, &lt;a href=\"en/yql/syntax/select/union.html#union-all\"&gt;UNION ALL&lt;/a&gt; is used to execute a query across tables that bundle outputs of two or more &lt;code&gt;SELECT&lt;/code&gt;s. This is not very convenient for the use case of running the same query on multiple tables (for example, if they contain data for different dates). To make this more convenient, in YQL &lt;code&gt;SELECT&lt;/code&gt; statements, after &lt;code&gt;FROM&lt;/code&gt;, you can specify not only a table or a subquery, but also call built-in functions letting you combine data from multiple tables.&lt;/p&gt;\n&lt;p&gt;The following functions are defined for these purposes:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;CONCAT(`table1`, `table2`, `table3` VIEW view_name, ...)&lt;/code&gt; combines all the tables listed in the arguments.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;EACH($list_of_strings) or EACH($list_of_strings VIEW view_name)&lt;/code&gt; combines all tables whose names are listed in the list of strings. Optionally, you can pass multiple lists in separate arguments similar to &lt;code&gt;CONCAT&lt;/code&gt;.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;RANGE(`prefix`, `min`, `max`, `suffix`, `view`)&lt;/code&gt; combines a range of tables. Arguments:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;The prefix is the folder to search tables in. It's specified without a trailing slash. This is the only required argument. If it's the only one specified, all tables in the folder are used.&lt;/li&gt;\n&lt;li&gt;min, max: These two arguments specify a range of table names included. The range is inclusive on both ends. If no range is specified, all tables in the prefix folder are used. The names of tables or folders located in the folder specified in prefix are lexicographically matched with the &lt;code&gt;[min, max]&lt;/code&gt; range rather than concatenated, so make sure to specify the range without leading slashes.&lt;/li&gt;\n&lt;li&gt;suffix is the name of the table. It's expected without a leading slash. If no suffix is specified, then the &lt;code&gt;[min, max]&lt;/code&gt; arguments specify a range of table names. If the suffix is specified, then the &lt;code&gt;[min, max]&lt;/code&gt; arguments specify a range of folders hosting a table with the name specified in the suffix argument.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;LIKE(`prefix`, `pattern`, `suffix`, `view`)&lt;/code&gt; and &lt;code&gt;REGEXP(`prefix`, `pattern`, `suffix`, `view`)&lt;/code&gt; — the pattern argument is set in a format similar to the same-name binary operator: &lt;a href=\"en/yql/syntax/expressions.html#like\"&gt;LIKE&lt;/a&gt; and &lt;a href=\"en/yql/syntax/expressions.html#regexp\"&gt;REGEXP&lt;/a&gt;.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;FILTER(`prefix`, `callable`, `suffix`, `view`)&lt;/code&gt;: The &lt;code&gt;callable&lt;/code&gt; argument must be a callable expression with the &lt;code&gt;(String)-&amp;gt;Bool&lt;/code&gt; signature that will be called for each table/subdirectory in the prefix folder. The query will only include those tables for which the callable value returned &lt;code&gt;true&lt;/code&gt;. &lt;a href=\"en/yql/syntax/expressions.html#lambda\"&gt;Lambda functions&lt;/a&gt; are most convenient to use as callable values.&lt;/p&gt;\n&lt;/li&gt;\n&lt;/ul&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Warning&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;All of the above functions don't guarantee the order of the table union.&lt;/p&gt;\n&lt;p&gt;The list of tables is calculated &lt;strong&gt;before&lt;/strong&gt; executing the query. Therefore, the tables created during the query execution won't be included in the function results.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;By default, the schemas of all participating tables are aligned based on &lt;a href=\"en/yql/syntax/select/union.html#union-all\"&gt;UNION ALL&lt;/a&gt; rules. If you don't want to align schemas, then you can use functions with the &lt;code&gt;_STRICT&lt;/code&gt; suffix, for example &lt;code&gt;CONCAT_STRICT&lt;/code&gt; or &lt;code&gt;RANGE_STRICT&lt;/code&gt; that are totally similar to the original functions, but treat any difference in table schemas as an error.&lt;/p&gt;\n&lt;p&gt;To specify a cluster of unioned tables, add it before the function name.&lt;/p&gt;\n&lt;p&gt;All arguments of the functions described above can be declared separately using &lt;a href=\"en/yql/syntax/expressions.html#named-nodes\"&gt;named expressions&lt;/a&gt;. In this case, you can also use  simple expressions in them by implicitly calling &lt;a href=\"en/yql/builtins/basic.html#evaluate_expr_atom\"&gt;EvaluateExpr&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;To get the name of the source table from which you originally obtained each row, use T&lt;a href=\"en/yql/builtins/basic.html#tablepath\"&gt;ablePath()&lt;/a&gt;.&lt;/p&gt;\n&lt;h2 id=\"examples\"&gt;&lt;a href=\"en/yql/syntax/select/concat.html#examples\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Examples&lt;/span&gt;&lt;/a&gt;Examples&lt;/h2&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;USE some_cluster;\nSELECT * FROM CONCAT(\n  `table1`,\n  `table2`,\n  `table3`);\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"78\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-78\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-78\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-78.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;USE some_cluster;\n$indices = ListFromRange(1, 4);\n$tables = ListMap($indices, ($index) -&amp;gt; {\n    RETURN \"table\" || CAST($index AS String);\n});\nSELECT * FROM EACH($tables); -- identical to the previous example.\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"79\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-79\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-79\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-79.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;USE some_cluster;\nSELECT * FROM RANGE(`my_folder`);\n&lt;/code&gt;&lt;/pre mation-81\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-81.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;USE some_cluster;\nSELECT * FROM RANGE(\n  `my_folder`,\n  `from_folder`,\n  `to_folder`,\n  `my_table`);\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"82\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-82\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-82\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-82.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;USE some_cluster;\nSELECT * FROM RANGE(\n  `my_folder`,\n  `from_table`,\n  `to_table`,\n  ``,\n  `my_view`);\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"83\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-83\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-83\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-83.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;USE some_cluster;\nSELECT * FROM LIKE(\n  `my_folder`,\n  \"2017-03-%\"\n);\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"84\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-84\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-84\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-84.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;USE some_cluster;\nSELECT * F
