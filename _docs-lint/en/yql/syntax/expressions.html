pboard-icon\" data-animation=\"711\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-711\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-711\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-711.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;-- if the lambda output is calculated as a single expression, you can use a more compact syntax variant:\n$f = ($x, $_) -&amp;gt; ($x || \"suffix\"); -- the second argument isn't used by\nSELECT $f(\"prefix_\", \"whatever\");\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"712\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-712\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-712\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-712.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"items-access\"&gt;&lt;a href=\"en/yql/syntax/expressions.html#items-access\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Accessing containers&lt;/span&gt;&lt;/a&gt;Accessing containers&lt;/h2&gt;\n&lt;p&gt;For accessing the values inside containers:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;Struct&amp;lt;&amp;gt;&lt;/code&gt;, &lt;code&gt;Tuple&amp;lt;&amp;gt;&lt;/code&gt; and &lt;code&gt;Variant&amp;lt;&amp;gt;&lt;/code&gt;, use a &lt;strong&gt;dot&lt;/strong&gt;. The set of keys (for the tuple and the corresponding variant — indexes) is known at the query compilation time. The key is &lt;strong&gt;validated&lt;/strong&gt; before beginning the query execution.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;List&amp;lt;&amp;gt;&lt;/code&gt; and &lt;code&gt;Dict&amp;lt;&amp;gt;&lt;/code&gt;, use &lt;strong&gt;square brackets&lt;/strong&gt;. The set of keys (set of indexes for keys) is known only at the query execution time. The key is &lt;strong&gt;not validated&lt;/strong&gt; before beginning the query execution. If no value is found, an empty value (NULL) is returned&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;&lt;a href=\"en/yql/types/containers.html\"&gt;Description and list of available containers&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;When using this syntax to access containers within table columns, be sure to specify the full column name, including the table name or table alias separated by a dot (see the first example below).&lt;/p&gt;\n&lt;h4 id=\"examples15\"&gt;&lt;a href=\"en/yql/syntax/expressions.html#examples15\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Examples&lt;/span&gt;&lt;/a&gt;Examples&lt;/h4&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;SELECT\n  t.struct.member,\n  t.tuple.7,\n  t.dict[\"key\"],\n  t.list[7]\nFROM my_table AS t;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"740\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-740\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-740\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-740.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;SELECT\n  Sample::ReturnsStruct().member;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"741\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-741\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-741\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-741.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"style":["_bundle/latex-extension.css"],"script":["_bundle/latex-extension.js"],"vcsPath":"en/yql/syntax/expressions.md","sourcePath":"en/yql/syntax/expressions.md"},"headings":[{"title":"String concatenation","href":"en/yql/syntax/expressions.html#concatenation","level":2},{"title":"Matching a string by pattern","href":"en/yql/syntax/expressions.html#check-match","level":2},{"title":"Operators","href":"en/yql/syntax/expressions.html#operators","level":2,"items":[{"title":"Arithmetic operators","href":"en/yql/syntax/expressions.html#math-operators","level":3,"items":[{"title":"Examples","href":"en/yql/syntax/expressions.html#examples2","level":4}]},{"title":"Comparison operators","href":"en/yql/syntax/expressions.html#comparison-operators","level":3,"items":[{"title":"Examples","href":"en/yql/syntax/expressions.html#examples3","level":4}]},{"title":"Logical operators","href":"en/yql/syntax/expressions.html#logic-operators","level":3,"items":[{"title":"Examples","href":"en/yql/syntax/expressions.html#examples4","level":4}]},{"title":"Bitwise operators","href":"en/yql/syntax/expressions.html#bit-operators","level":3,"items":[{"title":"Examples","href":"en/yql/syntax/expressions.html#examples5","level":4}]},{"title":"Precedence and associativity of operators","href":"en/yql/syntax/expressions.html#operator-priority","level":3}]},{"title":"IS [NOT]NULL","href":"en/yql/syntax/expressions.html#is-null","level":2},{"title":"IS [NOT]DISTINCT FROM","href":"en/yql/syntax/expressions.html#is-distinct-from","level":2},{"title":"BETWEEN","href":"en/yql/syntax/expressions.html#between","level":2},{"title":"IN","href":"en/yql/syntax/expressions.html#in","level":2},{"title":"AS","href":"en/yql/syntax/expressions.html#as","level":2},{"title":"CAST","href":"en/yql/syntax/expressions.html#cast","level":2},{"title":"BITCAST","href":"en/yql/syntax/expressions.html#bitcast","level":2},{"title":"CASE","href":"en/yql/syntax/expressions.html#case","level":2},{"title":"Named expressions","href":"en/yql/syntax/expressions.html#named-nodes","level":2},{"title":"Table expressions","href":"en/yql/syntax/expressions.html#table-contexts","level":2},{"title":"Lambda functions","href":"en/yql/syntax/expressions.html#lambda","level":2},{"title":"Accessing containers","href":"en/yql/syntax/expressions.html#items-access","level":2}],"title":"Expressions"},"router":{"pathname":"en/yql/syntax/expressions","depth":4,"base":"../../../"},"lang":"en","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/en/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-a29ea7877730322f2ce693378d06d02ac2b374cd-en","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
