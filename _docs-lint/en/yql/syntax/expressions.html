        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;h2 id=\"concatenation\"&gt;&lt;a href=\"en/yql/syntax/expressions.html#concatenation\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;String concatenation&lt;/span&gt;&lt;/a&gt;String concatenation&lt;/h2&gt;\n&lt;p&gt;Executed using the binary operator &lt;code&gt;||&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;As with other binary operators, if the data on either side is &lt;code&gt;NULL&lt;/code&gt;, the result is also &lt;code&gt;NULL&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Don't confuse this operator with a logical \"or\": in SQL, it's denoted by the &lt;code&gt;OR&lt;/code&gt; keyword. It's also not worth doing concatenation using &lt;code&gt;+&lt;/code&gt;.&lt;/p&gt;\n&lt;h4 id=\"examples\"&gt;&lt;a href=\"en/yql/syntax/expressions.html#examples\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Examples&lt;/span&gt;&lt;/a&gt;Examples&lt;/h4&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;SELECT \"fo\" || \"o\";\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"15\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-15\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-15\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-15.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"check-match\"&gt;&lt;a href=\"en/yql/syntax/expressions.html#check-match\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Matching a string by pattern&lt;/span&gt;&lt;/a&gt;Matching a string by pattern&lt;/h2&gt;\n&lt;p&gt;&lt;code&gt;REGEXP&lt;/code&gt; and &lt;code&gt;RLIKE&lt;/code&gt; are aliases and offer a short way to record for a &lt;a href=\"en/yql/udf/list/re2.html#match\"&gt;Re2::Grep&lt;/a&gt; call. &lt;code&gt;MATCH&lt;/code&gt; — similar to &lt;a href=\"en/yql/udf/list/re2.html#match\"&gt;Re2::Match&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;&lt;code&gt;LIKE&lt;/code&gt; works as follows:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;\n&lt;p&gt;Patterns can include two special characters:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;%&lt;/code&gt;: Zero or more of any characters.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;_&lt;/code&gt;: Exactly one of any character.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;All other characters are literals that represent themselves.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;As opposed to &lt;code&gt;REGEXP&lt;/code&gt;, &lt;code&gt;LIKE&lt;/code&gt; must be matched exactly. For example, to search a substring, add &lt;code&gt;%&lt;/code&gt; at the beginning and end of the pattern.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;ILIKE&lt;/code&gt; is a case-insensitive version of &lt;code&gt;LIKE&lt;/code&gt;.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;If &lt;code&gt;LIKE&lt;/code&gt; is applied to the key column of the sorted table and the pattern doesn't start with a special character, filtering by prefix drills down directly to the cluster level, which in some cases lets you avoid the full table scan. This optimization is disabled for &lt;code&gt;ILIKE&lt;/code&gt;.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;To escape special characters, specify the escaped character after the pattern using the &lt;code&gt;ESCAPE '?'&lt;/code&gt; keyword. Instead of &lt;code&gt;?&lt;/code&gt; you can use any character except &lt;code&gt;%&lt;/code&gt;, &lt;code&gt;_&lt;/code&gt;, and &lt;code&gt;\\&lt;/code&gt;. For example, if you use a question mark as an escaping symbol, then &lt;code&gt;?%&lt;/code&gt;, &lt;code&gt;?_&lt;/code&gt; and &lt;code&gt;??&lt;/code&gt; expressions will match their second character in the template: percent, underscore, and question mark, respectively. The escape character is undefined by default.&lt;/p&gt;\n&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;The most popular way to use the &lt;code&gt;LIKE&lt;/code&gt; and &lt;code&gt;REGEXP&lt;/code&gt; keywords is to filter a table using the statements with the &lt;code&gt;WHERE&lt;/code&gt; clause. However, there are no restrictions on using templates in this context: you can use them in most of contexts involving strings, for example, with concatenation by using &lt;code&gt;||&lt;/code&gt;.&lt;/p&gt;\n&lt;h4 id=\"examples1\"&gt;&lt;a href=\"en/yql/syntax/expressions.html#examples1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Examples&lt;/span&gt;&lt;/a&gt;Examples&lt;/h4&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;SELECT * FROM my_table\nWHERE string_column REGEXP '\\\\d+';\n-- requires a second slash because all\n-- standard string literals in SQL\n-- may accept C-escaped strings.\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"73\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-73\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-73\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-73.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;SELECT\n    string_column LIKE '___!_!_!_!!!!!!' ESCAPE '!'\n    -- searches for a string of exactly 9 symbols:\n    --   3 random,\n    --   then 3 underscores\n    --   and 3 exclamation marks\nFROM my_table;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"74\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-74\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-74\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-74.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;SELECT * FROM my_table\nWHERE key LIKE 'foo%bar';\n-- if there's table sorting by key, it only scans keys,\n-- starting with foo, and then among them\n-- leaves only those that end with bar\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"75\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-75\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-75\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-75.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"operators\"&gt;&lt;a href=\"en/yql/syntax/expressions.html#operators\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Operators&lt;/span&gt;&lt;/a&gt;Operators&lt;/h2&gt;\n&lt;h3 id=\"math-operators\"&gt;&lt;a href=\"en/yql/syntax/expressions.html#math-operators\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Arithmetic operators&lt;/span&gt;&lt;/a&gt;Arithmetic operators&lt;/h3&gt;\n&lt;p&gt;The operators &lt;code&gt;+&lt;/code&gt;, &lt;code&gt;-&lt;/code&gt;, &lt;code&gt;*&lt;/code&gt;, &lt;code&gt;/&lt;/code&gt;, &lt;code&gt;%&lt;/code&gt; are defined for &lt;a href=\"en/yql/types/primitive.html\"&gt;primitive data types&lt;/a&gt; that are variations of numbers.&lt;/p&gt;\n&lt;p&gt;For the Decimal data type, bankers rounding is used (to the nearest even integer).&lt;/p&gt;\n&lt;h4 id=\"examples2\"&gt;&lt;a href=\"en/yql/syntax/expressions.html#examples2\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Examples&lt;/span&gt;&lt;/a&gt;Examples&lt;/h4&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;SELECT 2 + 2;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"91\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-91\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-91\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-91.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;SELECT 0.0 / 0.0;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"92\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-92\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-92\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-92.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"comparison-operators\"&gt;&lt;a href=\"en/yql/syntax/expressions.html#comparison-operators\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Comparison operators&lt;/span&gt;&lt;/a&gt;Comparison operators&lt;/h3&gt;\n&lt;p&gt;&lt;code&gt;=&lt;/code&gt;, &lt;code&gt;==&lt;/code&gt;, &lt;code&gt;!=&lt;/code&gt;, &lt;code&gt;&amp;lt;&amp;gt;&lt;/code&gt;, &lt;code&gt;&amp;gt;&lt;/code&gt;, &lt;code&gt;&amp;lt;&lt;/code&gt; operators are defined for:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Primitive data types except Yson and Json.&lt;/li&gt;\n&lt;li&gt;Tuples and structures with the same set of fields. No order is defined for structures, but you can check for (non-)equality. Tuples are compared element-by-element left to right.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h4 id=\"examples3\"&gt;&lt;a href=\"en/yql/syntax/expressions.html#examples3\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Examples&lt;/span&gt;&lt;/a&gt;Examples&lt;/h4&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;SELECT 2 &amp;gt; 1;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"114\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-114\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-114\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-114.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"logic-operators\"&gt;&lt;a href=\"en/yql/syntax/expressions.html#logic-operators\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Logical operators&lt;/span&gt;&lt;/a&gt;Logical operators&lt;/h3&gt;\n&lt;p&gt;Use the operators &lt;code&gt;AND&lt;/code&gt;, &lt;code&gt;OR&lt;/code&gt;, &lt;code&gt;XOR&lt;/code&gt; for logical operations on Boolean values (&lt;code&gt;Bool&lt;/code&gt;).&lt;/p&gt;\n&lt;h4 id=\"examples4\"&gt;&lt;a href=\"en/yql/syntax/expressions.html#examples4\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Examples&lt;/span&gt;&lt;/a&gt;Examples&lt;/h4&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;SELECT 3 &amp;gt; 0 AND false;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"124\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-124\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-124\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-124.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"bit-operators\"&gt;&lt;a href=\"en/yql/syntax/expressions.html#bit-operators\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Bitwise operators&lt;/span&gt;&lt;/a&gt;Bitwise operators&lt;/h3&gt;\n&lt;p&gt;Bitwise operations on numbers:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;&amp;amp;&lt;/code&gt;, &lt;code&gt;|&lt;/code&gt;, &lt;code&gt;^&lt;/code&gt;: AND, OR, and XOR, respectively. Don't confuse bitwise operations with the related keywords. The keywords &lt;code&gt;AND&lt;/code&gt;, &lt;code&gt;OR&lt;/code&gt;, and &lt;code&gt;XOR&lt;/code&gt; are used for &lt;em&gt;Boolean values only&lt;/em&gt;, but not for numbers.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;~&lt;/code&gt; — negation.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;&amp;lt;&amp;lt;&lt;/code&gt;, &lt;code&gt;&amp;gt;&amp;gt;&lt;/code&gt;: Left or right shifts.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;|&amp;lt;&amp;lt;&lt;/code&gt;, &lt;code&gt;&amp;gt;&amp;gt;|&lt;/code&gt;: Circular left or right shifts.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h4 id=\"examples5\"&gt;&lt;a href=\"en/yql/syntax/expressions.html#examples5\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Examples&lt;/span&gt;&lt;/a&gt;Examples&lt;/h4&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;SELECT\n    key &amp;lt;&amp;lt; 10 AS key,\n    ~value AS value\nFROM my_table;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"156\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-156\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-156\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-156.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"operator-priority\"&gt;&lt;a href=\"en/yql/syntax/expressions.html#operator-priority\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Precedence and associativity of operators&lt;/span&gt;&lt;/a&gt;Precedence and associativity of operators&lt;/h3&gt;\n&lt;p&gt;Operator precedence determines the order of evaluation of an expression that contains different operators.&lt;br /&gt;\nFor example, the expression &lt;code&gt;1 + 2 * 3&lt;/code&gt; is evaluated as &lt;code&gt;1 + (2 * 3)&lt;/code&gt;&lt;br /&gt;\nbecause the multiplication operator has a higher precedence than the addition operator.&lt;/p&gt;\n&lt;p&gt;Associativity determines the order of evaluating expressions containing operators of the same type.&lt;br /&gt;\nFor example, the expression &lt;code&gt;1 + 2 + 3&lt;/code&gt; is evaluated as &lt;code&gt;(1 + 2) + 3&lt;/code&gt; because the addition operator is left-associative.&lt;br /&gt;\nOn the other hand, the expression &lt;code&gt;a ?? b ?? c&lt;/code&gt; is evaluated as &lt;code&gt;a ?? (b ?? c)&lt;/code&gt; because the &lt;code&gt;??&lt;/code&gt; operator is right-associative&lt;/p&gt;\n&lt;p&gt;The table below shows precedence and associativity of YQL operators.&lt;br /&gt;\nThe operators in the table are listed in descending order of precedence.&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Priority&lt;/th&gt;\n&lt;th&gt;Operator&lt;/th&gt;\n&lt;th&gt;Description&lt;/th&gt;\n&lt;th&gt;Associativity&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;1&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;a[], a.foo, a()&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Accessing a container item, calling a function&lt;/td&gt;\n&lt;td&gt;Left&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;2&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;+a, -a, ~a, NOT a&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Unary operators: plus, minus, bitwise and logical negation&lt;/td&gt;\n&lt;td&gt;Right&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;3&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;a||b&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"en/yql/syntax/expressions.html#concatenation\"&gt;String concatenation&lt;/a&gt;&lt;/td&gt;\n&lt;td&gt;Left&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;4&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;a*b, a/b, a%b&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Multiplication, division, remainder of division&lt;/td&gt;\n&lt;td&gt;Left&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;5&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;a+b, a-b&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Addition/Subtraction&lt;/td&gt;\n&lt;td&gt;Left&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;6&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;a ?? b&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Operator notation for &lt;a href=\"en/yql/builtins/basic.html#coalesce\"&gt;NVL/COALESCE&lt;/a&gt;&lt;/td&gt;\n&lt;td&gt;Right&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;7&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;a&amp;lt;&amp;lt;b, a&amp;gt;&amp;gt;b, a|&amp;lt;&amp;lt;b, a&amp;gt;&amp;gt;|b,&lt;/code&gt; &lt;code&gt;a|b, a^b, a&amp;amp;b&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Shift operators and logical bit operators&lt;/td&gt;\n&lt;td&gt;Left&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;8&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;a&amp;lt;b, a&amp;lt;=b, a&amp;gt;=b, a&amp;gt;b&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Comparison&lt;/td&gt;\n&lt;td&gt;Left&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;9&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;a IN b&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Occurrence of an element in a set&lt;/td&gt;\n&lt;td&gt;Left&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;9&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;a==b, a=b, a!=b, a&amp;lt;&amp;gt;b,&lt;/code&gt; &lt;code&gt;a is (not) distinct from b&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Comparison for (non-)equality&lt;/td&gt;\n&lt;td&gt;Left&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;10&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;a XOR b&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Logical XOR&lt;/td&gt;\n&lt;td&gt;Left&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;11&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;a AND b&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Logical AND&lt;/td&gt;\n&lt;td&gt;Left&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;12&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;a OR b&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Logical OR&lt;/td&gt;\n&lt;td&gt;Left&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;h2 id=\"is-null\"&gt;&lt;a href=\"en/yql/syntax/expressions.html#is-null\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;IS NOT NULL&lt;/span&gt;&lt;/a&gt;IS [NOT]NULL&lt;/h2&gt;\n&lt;p&gt;Matching an empty value (&lt;code&gt;NULL&lt;/code&gt;). Since &lt;code&gt;NULL&lt;/code&gt; is a special value that &lt;a href=\"en/yql/types/optional.html#null_expr\"&gt;equals nothing&lt;/a&gt;, regular &lt;a href=\"en/yql/syntax/expressions.html#comparison-operators\"&gt;comparison operators&lt;/a&gt; are not suitable for this task.&lt;/p&gt;\n&lt;h4 id=\"examples6\"&gt;&lt;a href=\"en/yql/syntax/expressions.html#examples6\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Examples&lt;/span&gt;&lt;/a&gt;Examples&lt;/h4&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;SELECT key FROM my_table\nWHERE value IS NOT NULL;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"380\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-380\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-380\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-380.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"is-distinct-from\"&gt;&lt;a href=\"en/yql/syntax/expressions.html#is-distinct-from\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;IS NOT DISTINCT FROM&lt;/span&gt;&lt;/a&gt;IS [NOT]DISTINCT FROM&lt;/h2&gt;\n&lt;p&gt;Comparing of two values. Unlike regular &lt;a href=\"en/yql/syntax/expressions.html#comparison-operators\"&gt;comparison operators&lt;/a&gt;, null values are considered equal to each other.&lt;/p&gt;\n&lt;p&gt;Comparison is done according to the following rules:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;IS DISTINCT FROM&lt;/code&gt;/&lt;code&gt;IS NOT DISTINCT FROM&lt;/code&gt; operators are defined for those (and only those) arguments for which &lt;code&gt;!=&lt;/code&gt; and &lt;code&gt;=&lt;/code&gt; operators are defined.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;The result of &lt;code&gt;IS NOT DISTINCT FROM&lt;/code&gt; is equal to the logical negation of the &lt;code&gt;IS DISTINCT FROM&lt;/code&gt; result for these arguments.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;If the result of the &lt;code&gt;==&lt;/code&gt; operator is not equal to &lt;code&gt;NULL&lt;/code&gt; for some arguments, then it is equal to the result of the &lt;code&gt;IS NOT DISTINCT FROM&lt;/code&gt; operator for the same arguments.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;If both arguments are empty &lt;code&gt;Optional's&lt;/code&gt; or &lt;code&gt;NULL's&lt;/code&gt;, then the value of &lt;code&gt;IS NOT DISTINCT FROM&lt;/code&gt; is &lt;code&gt;True&lt;/code&gt;.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;The result of &lt;code&gt;IS NOT DISTINCT FROM&lt;/code&gt; for an empty &lt;code&gt;Optional&lt;/code&gt; or &lt;code&gt;NULL&lt;/code&gt; and a non-empty &lt;code&gt;Optional&lt;/code&gt; or non-&lt;code&gt;Optional&lt;/code&gt; value is &lt;code&gt;False&lt;/code&gt;.&lt;/p&gt;\n&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;For values of composite types, these rules are used recursively.&lt;/p&gt;\n&lt;h2 id=\"between\"&gt;&lt;a href=\"en/yql/syntax/expressions.html#between\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;BETWEEN&lt;/span&gt;&lt;/a&gt;BETWEEN&lt;/h2&gt;\n&lt;p&gt;Checking whether a value is in a range. Syntax: &lt;code&gt;expr [NOT] BETWEEN [ASYMMETRIC | SYMMETRIC] expr AND expr&lt;/code&gt;.&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;BETWEEN&lt;/code&gt; and &lt;code&gt;BETWEEN ASYMMETRIC&lt;/code&gt; are equivalent, &lt;code&gt;x BETWEEN a AND b&lt;/code&gt; is equivalent to &lt;code&gt;a &amp;lt;= x AND x &amp;lt;= b&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;BETWEEN SYMMETRIC&lt;/code&gt; automatically repositions the arguments so that the range is non-empty,&lt;br /&gt;\n&lt;code&gt;x BETWEEN SYMMETRIC a AND b&lt;/code&gt; is equivalent to &lt;code&gt;(x BETWEEN a AND b) OR (x BETWEEN b AND a)&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;NOT&lt;/code&gt; inverts the check result.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h4 id=\"examples7\"&gt;&lt;a href=\"en/yql/syntax/expressions.html#examples7\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Examples&lt;/span&gt;&lt;/a&gt;Examples&lt;/h4&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;SELECT * FROM my_table\nWHERE key BETWEEN 10 AND 20;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"446\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-446\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-446\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-446.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;SELECT * FROM my_table\nWHERE key NOT BETWEEN SYMMETRIC 20 AND 10;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"447\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-447\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-447\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-447.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"in\"&gt;&lt;a href=\"en/yql/syntax/expressions.html#in\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;IN&lt;/span&gt;&lt;/a&gt;IN&lt;/h2&gt;\n&lt;p&gt;Checking whether a value is inside of a set of values. It's logically equivalent to a chain of equality comparisons using &lt;code&gt;OR&lt;/code&gt; but implemented more efficiently.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Warning&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Unlike the same keyword in Python, in YQL &lt;code&gt;IN&lt;/code&gt; &lt;strong&gt;DOES NOT&lt;/strong&gt; involve searching for a substring in a string. You can use &lt;a href=\"en/yql/udf/list/string.html\"&gt;String::Contains&lt;/a&gt; or &lt;a href=\"en/yql/syntax/expressions.html#check-match\"&gt;LIKE / REGEXP&lt;/a&gt; described above to search for a substring.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;You can specify the &lt;a href=\"en/yql/syntax/lexer.html#sql-hints\"&gt;hint&lt;/a&gt; &lt;code&gt;COMPACT&lt;/code&gt; right after &lt;code&gt;IN&lt;/code&gt;.&lt;br /&gt;\nIf &lt;code&gt;COMPACT&lt;/code&gt; is not specified, then &lt;code&gt;IN&lt;/code&gt; with a subquery is executed as a relevant &lt;code&gt;JOIN&lt;/code&gt; (&lt;code&gt;LEFT SEMI&lt;/code&gt; for &lt;code&gt;IN&lt;/code&gt; and &lt;code&gt;LEFT ONLY&lt;/code&gt; for &lt;code&gt;NOT IN&lt;/code&gt;).&lt;br /&gt;\nThe presence of &lt;code&gt;COMPACT&lt;/code&gt; forces an in-memory execution strategy: a hash table is built in memory based on the content of the right part of &lt;code&gt;IN&lt;/code&gt;, and then the left part is filtered based on the table.&lt;/p&gt;\n&lt;p&gt;The &lt;code&gt;COMPACT&lt;/code&gt; hint must be used with care. Because the hash table is built in memory, the query may throw an error if the right part of &lt;code&gt;IN&lt;/code&gt; contains a lot of large and/or different elements.&lt;/p&gt;\n&lt;p&gt;Because there's a limit on the byte size of queries (approx. 1 MB) in YQL, to get a larger list of values you should attach them to the query via URL and use the &lt;a href=\"en/yql/builtins/basic.html#parsefile\"&gt;ParseFile&lt;/a&gt; function.&lt;/p&gt;\n&lt;h4 id=\"examples8\"&gt;&lt;a href=\"en/yql/syntax/expressions.html#examples8\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Examples&lt;/span&gt;&lt;/a&gt;Examples&lt;/h4&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;SELECT column IN (1, 2, 3)\nFROM my_table;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"476\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-476\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-476\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-476.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;SELECT * FROM my_table\nWHERE string_column IN (\"a\", \"b\", \"c\");\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"477\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-477\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-477\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-477.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;$foo = AsList(1, 2, 3);\nSELECT 1 IN $foo;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"478\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-478\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-478\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-478.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;$values = (SELECT column + 1 FROM table);\nSELECT * FROM my_table WHERE\n    -- filtering by in-memory hash table based on the table\n    column1 IN /*+ COMPACT() */ $values AND\n    -- with subsequent LEFT ONLY JOIN with other_table\n    column2 NOT IN (SELECT other_column FROM other_table);\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"479\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-479\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-479\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-479.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"as\"&gt;&lt;a href=\"en/yql/syntax/expressions.html#as\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;AS&lt;/span&gt;&lt;/a&gt;AS&lt;/h2&gt;\n&lt;p&gt;Can be used in the following scenarios:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Adding a short name (alias) for columns or tables within the query.&lt;/li&gt;\n&lt;li&gt;Using named arguments in function calls.&lt;/li&gt;\n&lt;li&gt;If you perform explicit casting to specify the target type, see &lt;a href=\"en/yql/syntax/expressions.html#cast\"&gt;CAST&lt;/a&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h4 id=\"examples9\"&gt;&lt;a href=\"en/yql/syntax/expressions.html#examples9\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Examples&lt;/span&gt;&lt;/a&gt;Examples&lt;/h4&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;SELECT key AS k FROM my_table;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"506\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-506\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-506\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-506.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;SELECT t.key FROM my_table AS t;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"507\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-507\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-507\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-507.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;SELECT\n    MyFunction(key, 123 AS my_optional_arg)\nFROM my_table;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"508\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-508\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-508\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-508.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"cast\"&gt;&lt;a href=\"en/yql/syntax/expressions.html#cast\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;CAST&lt;/span&gt;&lt;/a&gt;CAST&lt;/h2&gt;\n&lt;p&gt;Tries to cast the value to the specified type. The attempt may fail and return &lt;code&gt;NULL&lt;/code&gt;. When used with numbers, it may lose precision or most significant bits.&lt;/p&gt;\n&lt;p&gt;For lists and dictionaries, it can either delete or replace with &lt;code&gt;NULL&lt;/code&gt; the elements whose conversion failed.&lt;br /&gt;\nFor structures and tuples, it deletes elements that are omitted in the target type. To learn more about conversions, see &lt;a href=\"en/yql/types/cast.html\"&gt;here&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;For the Decimal parameter data type, two additional arguments are specified:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;The total number of decimal digits (up to 35, inclusive).&lt;/li&gt;\n&lt;li&gt;The number of decimal digits after the decimal point (out of the total number, i.e. strictly no more than the previous argument).&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h4 id=\"examples10\"&gt;&lt;a href=\"en/yql/syntax/expressions.html#examples10\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Examples&lt;/span&gt;&lt;/a&gt;Examples&lt;/h4&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;    SELECT\n        CAST(\"12345\" AS Double),                -- 12345.0\n        CAST(1.2345 AS Uint8),                  -- 1\n        CAST(12345 AS String),                  -- \"12345\"\n        CAST(\"1.2345\" AS Decimal(5, 2)),        -- 1.23\n        CAST(\"xyz\" AS Uint64) IS NULL,          -- true, because it failed\n        CAST(-1 AS Uint16) IS NULL,             -- true, negative to unsigned\n        CAST([-1, 0, 1] AS List&amp;lt;Uint8?&amp;gt;),             -- [null, 0, 1]\n            --Optional item type: failed item to null.\n        CAST([\"3.14\", \"bad\", \"42\"] AS List&amp;lt;Float&amp;gt;),   -- [3.14, 42]\n            --Non-optional item type: failed item deleted.\n        CAST(255 AS Uint8),                     -- 255\n        CAST(256 AS Uint8) IS NULL              -- true, out of range\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"536\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-536\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-536\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-536.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"bitcast\"&gt;&lt;a href=\"en/yql/syntax/expressions.html#bitcast\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;BITCAST&lt;/span&gt;&lt;/a&gt;BITCAST&lt;/h2&gt;\n&lt;p&gt;Performs a bitwise conversion of an integer value to the specified integer type. The conversion is always successful, but may lose precision or high-order bits.&lt;/p&gt;\n&lt;h4 id=\"examples11\"&gt;&lt;a href=\"en/yql/syntax/expressions.html#examples11\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Examples&lt;/span&gt;&lt;/a&gt;Examples&lt;/h4&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;SELECT\n    BITCAST(100000ul AS Uint32),     -- 100000\n    BITCAST(100000ul AS Int16),      -- -31072\n    BITCAST(100000ul AS Uint16),     -- 34464\n    BITCAST(-1 AS Int16),            -- -1\n    BITCAST(-1 AS Uint16);           -- 65535\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"546\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-546\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-546\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-546.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"case\"&gt;&lt;a href=\"en/yql/syntax/expressions.html#case\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;CASE&lt;/span&gt;&lt;/a&gt;CASE&lt;/h2&gt;\n&lt;p&gt;Conditional expressions and branching. It's similar to &lt;code&gt;if&lt;/code&gt;, &lt;code&gt;switch&lt;/code&gt; and ternary operators in the imperative programming languages.&lt;br /&gt;\nIf the result of the &lt;code&gt;WHEN&lt;/code&gt; expression is &lt;code&gt;true&lt;/code&gt;, the value of the &lt;code&gt;CASE&lt;/code&gt; expression becomes the result&lt;br /&gt;\nfollowing the condition, and the rest of the &lt;code&gt;CASE&lt;/code&gt; expression isn't calculated. If the condition is not met,&lt;br /&gt;\nall the &lt;code&gt;WHEN&lt;/code&gt; clauses that follow are checked. If none&lt;br /&gt;\nof the &lt;code&gt;WHEN&lt;/code&gt; conditions is fulfilled, the result recorded in the &lt;code&gt;ELSE&lt;/code&gt; sentence becomes the &lt;code&gt;CASE&lt;/code&gt; value.&lt;br /&gt;\nThe &lt;code&gt;ELSE&lt;/code&gt; branch is mandatory in the &lt;code&gt;CASE&lt;/code&gt; expression. Expressions in &lt;code&gt;WHEN&lt;/code&gt; are checked sequentially, from top to bottom.&lt;/p&gt;\n&lt;p&gt;Since its syntax is quite sophisticated, it's often more convenient to use the built-in &lt;a href=\"en/yql/builtins/basic.html#if\"&gt;IF&lt;/a&gt; function.&lt;/p&gt;\n&lt;h4 id=\"examples12\"&gt;&lt;a href=\"en/yql/syntax/expressions.html#examples12\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Examples&lt;/span&gt;&lt;/a&gt;Examples&lt;/h4&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;SELECT\n  CASE\n    WHEN value &amp;gt; 0\n    THEN \"positive\"\n    ELSE \"negative\"\n  END\nFROM my_table;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"559\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-559\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-559\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-559.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;SELECT\n  CASE value\n    WHEN 0 THEN \"zero\"\n    WHEN 1 THEN \"one\"\n    ELSE \"not zero or one\"\n  END\nFROM my_table;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"560\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-560\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-560\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-560.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"named-nodes\"&gt;&lt;a href=\"en/yql/syntax/expressions.html#named-nodes\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Named expressions&lt;/span&gt;&lt;/a&gt;Named expressions&lt;/h2&gt;\n&lt;p&gt;Complex queries may be sophisticated, containing lots of nested levels and/or repeating parts. In YQL, you can use named expressions to assign a name to an arbitrary expression or subquery. Named expressions can be referenced in other expressions or subqueries. In this case, the original expression/subquery is actually substituted at point of use.&lt;/p&gt;\n&lt;p&gt;A named expression is defined as follows:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;&amp;lt;named-expr&amp;gt; = &amp;lt;expression&amp;gt; | &amp;lt;subquery&amp;gt;;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"570\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-570\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-570\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-570.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Here &lt;code&gt;&amp;lt;named-expr&amp;gt;&lt;/code&gt; consists of a $ character and an arbitrary non-empty identifier (for example, &lt;code&gt;$foo&lt;/code&gt;).&lt;/p&gt;\n&lt;p&gt;If the expression on the right is a tuple, you can automatically unpack it by specifying several named expressions separated by commas on the left:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;&amp;lt;named-expr1&amp;gt;, &amp;lt;named-expr2&amp;gt;, &amp;lt;named-expr3&amp;gt; ... = &amp;lt;expression-returning-tuple&amp;gt;;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"577\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-577\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-577\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-577.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;In this case, the number of expressions must match the tuple size.&lt;/p&gt;\n&lt;p&gt;Each named expression has a scope. It starts immediately after defining the named expression and ends at the end of the closest enclosing name scope (for example, at the end of the query or at the end of a &lt;a href=\"en/yql/syntax/expressions.html#lambda\"&gt;lambda function&lt;/a&gt; body, &lt;a href=\"en/yql/syntax/action.html#define-action\"&gt;ACTION&lt;/a&gt;, &lt;a href=\"en/yql/syntax/subquery.html#define-subquery\"&gt;SUBQUERY&lt;/a&gt;, or &lt;a href=\"en/yql/syntax/action.html#evaluate-for\"&gt;EVALUATE FOR&lt;/a&gt; cyclic path).&lt;br /&gt;\nRedefining a named expression with the same name hides the previous expression from the current scope.&lt;/p&gt;\n&lt;p&gt;If the named expression has never been used, a warning is issued. To avoid such a warning, use the underscore as the first character in the ID (for example, &lt;code&gt;$_foo&lt;/code&gt;).&lt;br /&gt;\n&lt;code&gt;$_&lt;/code&gt; named expression is called an anonymous named expression and processed in a special way. It works as if &lt;code&gt;$_&lt;/code&gt; was automatically replaced with &lt;code&gt;$_&amp;lt;some_uniq_name&amp;gt;&lt;/code&gt;.&lt;br /&gt;\nAnonymous named expressions are convenient when you don't need the expression value. For example, to fetch the second element from a tuple of three elements, you can write:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;$_, $second, $_ = AsTuple(1, 2, 3);\nselect $second;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"587\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-587\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-587\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-587.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;An attempt to reference an anonymous named expression results in an error:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;$_ = 1;\nselect $_; --- error: Unable to reference anonymous name $_\nexport $_; --- error: Can not export anonymous name $_\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"591\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-591\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-591\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-591.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Also, you can't import a named expression using an anonymous alias:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;import utils symbols $sqrt as $_; --- error: Can not import anonymous name $_\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"595\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-595\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-595\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-595.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Anonymous argument names are also supported for &lt;a href=\"en/yql/syntax/expressions.html#lambda\"&gt;lambda functions&lt;/a&gt;, &lt;a href=\"en/yql/syntax/action.html#define-action\"&gt;ACTION&lt;/a&gt;, &lt;a href=\"en/yql/syntax/subquery.html#define-subquery\"&gt;SUBQUERY&lt;/a&gt; and in &lt;a href=\"en/yql/syntax/action.html#evaluate-for\"&gt;EVALUATE FOR&lt;/a&gt;.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Note&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;If named expression substitution results in completely identical subgraphs in the query execution graph, the graphs are combined to execute a subgraph only once.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"examples13\"&gt;&lt;a href=\"en/yql/syntax/expressions.html#examples13\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Examples&lt;/span&gt;&lt;/a&gt;Examples&lt;/h4&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;$multiplier = 712;\nSELECT\n  a * $multiplier, -- $multiplier is 712\n  b * $multiplier,\n  (a + b) * $multiplier\nFROM abc_table;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"612\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-612\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-612\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-612.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;$intermediate = (\n  SELECT\n    value * value AS square,\n    value\n  FROM my_table\n);\nSELECT a.square * b.value\nFROM $intermediate AS a\nINNER JOIN $intermediate AS b\nON a.value == b.square;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"613\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-613\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-613\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-613.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;$a, $_, $c = AsTuple(1, 5u, \"test\"); -- tuple unpacking\nSELECT $a, $c;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"614\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-614\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-614\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-614.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;$x, $y = AsTuple($y, $x); -- swap expression values\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"615\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-615\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-615\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-615.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"table-contexts\"&gt;&lt;a href=\"en/yql/syntax/expressions.html#table-contexts\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Table expressions&lt;/span&gt;&lt;/a&gt;Table expressions&lt;/h2&gt;\n&lt;p&gt;A table expression is an expression that returns a table. Table expressions in YQL are as follows:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;\n&lt;p&gt;Subqueries: &lt;code&gt;(SELECT key, subkey FROM T)&lt;/code&gt;&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;a href=\"en/yql/syntax/expressions.html#named-nodes\"&gt;named subqueries&lt;/a&gt;: &lt;code&gt;$foo = SELECT * FROM T;&lt;/code&gt; (use of a &lt;code&gt;$foo&lt;/code&gt; named subquery is a table expression)&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;a href=\"en/yql/syntax/subquery.html#define-subquery\"&gt;subquery templates&lt;/a&gt;: &lt;code&gt;DEFINE SUBQUERY $foo($name) AS ... END DEFINE;&lt;/code&gt; (&lt;code&gt;$foo(\"InputTable\")&lt;/code&gt; call is a table expression).&lt;/p&gt;\n&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Semantics of a table expression depends on the context where it is used. In YQL, table expressions can be used in the following contexts:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;\n&lt;p&gt;Table context: after &lt;a href=\"en/yql/syntax/select/from.html\"&gt;FROM&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;In this case, table expressions work as expected: for example, &lt;code&gt;$input = SELECT a, b, c FROM T; SELECT * FROM $input&lt;/code&gt; returns a table with three columns.&lt;/p&gt;\n&lt;p&gt;The table context also appears after &lt;a href=\"en/yql/syntax/select/index.html#unionall\"&gt;UNION ALL&lt;/a&gt;, &lt;a href=\"en/yql/syntax/join.html#join\"&gt;JOIN&lt;/a&gt;, &lt;a href=\"en/yql/syntax/process.html#process\"&gt;PROCESS&lt;/a&gt;, and &lt;a href=\"en/yql/syntax/reduce.html#reduce\"&gt;REDUCE&lt;/a&gt;;&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;Vector context: after &lt;a href=\"en/yql/syntax/expressions.html#in\"&gt;IN&lt;/a&gt;. In this context, the table expression must contain exactly one column (the name of this column doesn't affect the expression result in any way).&lt;/p&gt;\n&lt;p&gt;A table expression in a vector context is typed as a list (the type of the list element is the same as the column type in this case). Example: &lt;code&gt;SELECT * FROM T WHERE key IN (SELECT k FROM T1)&lt;/code&gt;;&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;A scalar context arises &lt;em&gt;in all the other cases&lt;/em&gt;. As in vector contexts, a table expression must contain exactly one column, but the value of the table expression is a scalar, that is, an arbitrarily selected value of this column (if no rows are returned, the result is &lt;code&gt;NULL&lt;/code&gt;). Example: &lt;code&gt;$count = SELECT COUNT(*) FROM T; SELECT * FROM T ORDER BY key LIMIT $count / 2&lt;/code&gt;.&lt;/p&gt;\n&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;The order of rows in a table context, the order of elements in a vector context, and the rule for selecting a value from a scalar context (if multiple values are returned), aren't defined. This order also cannot be affected by &lt;code&gt;ORDER BY&lt;/code&gt;: &lt;code&gt;ORDER BY&lt;/code&gt; without &lt;code&gt;LIMIT&lt;/code&gt; is ignored in table expressions with a warning, and &lt;code&gt;ORDER BY&lt;/code&gt; with &lt;code&gt;LIMIT&lt;/code&gt; defines a set of elements rather than the order within that set.&lt;/p&gt;\n&lt;p&gt;There is an exception to this rule. A named expression containing &lt;a href=\"en/yql/syntax/process.html#process\"&gt;PROCESS&lt;/a&gt;, when used in scalar context, behaves as if it existed in table context:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;$input = SELECT 1 AS key, 2 AS value;\n$process = PROCESS $input;\n\nSELECT FormatType(TypeOf($process)); -- $process used in scalar context,\n                                     -- but the result of SELECT in this case is List&amp;lt;Struct&amp;lt;'key':Int32,'value':Int32&amp;gt;&amp;gt;\n\nSELECT $process[0].key; -- returns 1\n\nSELECT FormatType(TypeOf($input)); -- error, $input in scalar context must contain one column\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"674\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-674\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-674\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-674.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Attention!&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;A common error is to use an expression in a scalar context rather than a table context or vector context. For example:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;$dict = SELECT key, value FROM T1;\n\nDEFINE SUBQUERY $merge_dict($table, $dict) AS\nSELECT * FROM $table LEFT JOIN $dict USING(key);\nEND DEFINE;\n\nSELECT * FROM $merge_dict(\"Input\", $dict); -- $dict here is used in scalar context.\n                                           -- error, exactly one column is expected in scalar context\n\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"683\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-683\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-683\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-683.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;A correct notation in this case is:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;DEFINE SUBQUERY $dict() AS\nSELECT key, value FROM T1;\nEND DEFINE;\n\nDEFINE SUBQUERY $merge_dict($table, $dict) AS\nSELECT * FROM $table LEFT JOIN $dict() USING(key); -- use of the table expression $dict()\n                                                   -- (subquery template call) in table context\nEND DEFINE;\n\nSELECT * FROM $merge_dict(\"Input\", $dict); -- $dict is a subquery template (not a table expression)\n                                           -- passed as a table expression argument\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"687\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-687\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-687\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-687.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"lambda\"&gt;&lt;a href=\"en/yql/syntax/expressions.html#lambda\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Lambda functions&lt;/span&gt;&lt;/a&gt;Lambda functions&lt;/h2&gt;\n&lt;p&gt;Let you combine multiple expressions into a single callable value.&lt;/p&gt;\n&lt;p&gt;List arguments in round brackets, following them by the arrow and lambda function body. The body of the lambda consists of an expression enclosed in parentheses or of curly brackets enclosing the optional chain of expressions and assigns &lt;a href=\"en/yql/syntax/expressions.html#named-nodes\"&gt;named expressions&lt;/a&gt; and the output of a call after the &lt;code&gt;RETURN&lt;/code&gt; keyword in the last expression.&lt;/p&gt;\n&lt;p&gt;The scope for the lambda body: first the local named expressions, then arguments, then named expressions defined above by the lambda function at the top level of the query.&lt;/p&gt;\n&lt;p&gt;Only use pure expressions inside the lambda body (those might also be other lambdas, possibly passed through arguments). But you can't use &lt;a href=\"en/yql/syntax/select/index.html\"&gt;SELECT&lt;/a&gt;, &lt;a href=\"en/yql/syntax/insert_into.html\"&gt;INSERT INTO&lt;/a&gt; and other top-level statements inside lambdas.&lt;/p&gt;\n&lt;p&gt;One or more of the last lambda parameters can be marked with a question mark as optional: if they haven't been specified when calling lambda, they are assigned the &lt;code&gt;NULL&lt;/code&gt; value.&lt;/p&gt;\n&lt;h4 id=\"examples14\"&gt;&lt;a href=\"en/yql/syntax/expressions.html#examples14\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Examples&lt;/span&gt;&lt;/a&gt;Examples&lt;/h4&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;$f = ($y) -&amp;gt; {\n    $prefix = \"x\";\n    RETURN $prefix || $y;\n};\n\n$g = ($y) -&amp;gt; (\"x\" || $y);\n\n$h = ($x, $y?) -&amp;gt; ($x + ($y ?? 0));\n\nSELECT $f(\"y\"), $g(\"z\"), $h(1), $h(2, 3); -- \"xy\", \"xz\", 1, 5\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-cli
