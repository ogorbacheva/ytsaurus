        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;h2 id=\"definition\"&gt;&lt;a href=\"en/yql/syntax/pragma/index.html#definition\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Definition&lt;/span&gt;&lt;/a&gt;Definition&lt;/h2&gt;\n&lt;p&gt;Pragmas are special directives that override the query execution settings. For example, they can be used to select a strategy for joining tables, configure the error logging level, or specify which pool to perform query operations in. Pragmas can affect query execution speed, resource allocation, and semantics.&lt;/p&gt;\n&lt;p&gt;The pragmas apply only within the current query. For more information, see the &lt;a href=\"en/yql/syntax/pragma/global.html#pragmascope\"&gt;pragma scope&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;For the full list of available settings, &lt;a href=\"en/yql/syntax/pragma/index.html#pragmas\"&gt;see below&lt;/a&gt;.&lt;/p&gt;\n&lt;h2 id=\"syntax\"&gt;&lt;a href=\"en/yql/syntax/pragma/index.html#syntax\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Syntax&lt;/span&gt;&lt;/a&gt;Syntax&lt;/h2&gt;\n&lt;p&gt;&lt;code&gt;PRAGMA x.y = \"z\";&lt;/code&gt; or &lt;code&gt;PRAGMA x.y(\"z\", \"z2\", \"z3\");&lt;/code&gt;:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;x&lt;/code&gt;: (optional) The category of the setting.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;y&lt;/code&gt;: The name of the setting.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;z&lt;/code&gt;: (optional for flags) The value of the setting. The following suffixes are acceptable:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;k&lt;/code&gt;, &lt;code&gt;m&lt;/code&gt;, &lt;code&gt;g&lt;/code&gt;, &lt;code&gt;t&lt;/code&gt;: For the data amounts.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;w&lt;/code&gt;,&lt;code&gt;d&lt;/code&gt;, &lt;code&gt;h&lt;/code&gt;, &lt;code&gt;m&lt;/code&gt;, &lt;code&gt;s&lt;/code&gt;, &lt;code&gt;ms&lt;/code&gt;, &lt;code&gt;us&lt;/code&gt;, &lt;code&gt;ns&lt;/code&gt; : For the time values.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;For &lt;a href=\"en/yql/syntax/pragma/yt.html\"&gt;dynamic yt pragmas&lt;/a&gt;, you can revert the settings values to their default states using &lt;code&gt;PRAGMA my_pragma = default;&lt;/code&gt;. Please note that you can't reset the settings for other pragmas.&lt;/p&gt;\n&lt;h2 id=\"examples\"&gt;&lt;a href=\"en/yql/syntax/pragma/index.html#examples\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Examples&lt;/span&gt;&lt;/a&gt;Examples&lt;/h2&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;PRAGMA AutoCommit;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"53\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-53\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-53\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-53.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;PRAGMA TablePathPrefix = \"home/yql\";\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"54\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-54\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-54\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-54.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;PRAGMA Warning(\"disable\", \"1101\");\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"55\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-55\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-55\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-55.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"pragmas\"&gt;&lt;a href=\"en/yql/syntax/pragma/index.html#pragmas\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Available pragmas&lt;/span&gt;&lt;/a&gt;Available pragmas&lt;/h2&gt;\n&lt;p&gt;Getting diagnostic information from YQL as an additional result of a query.&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"en/yql/syntax/pragma/global.html\"&gt;Global&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"en/yql/syntax/pragma/yson.html\"&gt;Yson&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"en/yql/syntax/pragma/file.html\"&gt;Working with files&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"en/yql/syntax/pragma/yt.html\"&gt;YT pragmas&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;Debug and service — documentation will be added soon&lt;/li&gt;\n&lt;/ul&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"en/yql/syntax/pragma/index.md","sourcePath":"en/yql/syntax/pragma/index.md"},"headings":[{"title":"Definition","href":"en/yql/syntax/pragma/index.html#definition","level":2},{"title":"Syntax","href":"en/yql/syntax/pragma/index.html#syntax","level":2},{"title":"Examples","href":"en/yql/syntax/pragma/index.html#examples","level":2},{"title":"Available pragmas","href":"en/yql/syntax/pragma/index.html#pragmas","level":2}],"title":"PRAGMA"},"router":{"pathname":"en/yql/syntax/pragma/index","depth":5,"base":"../../../../"},"lang":"en","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/en/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-a29ea7877730322f2ce693378d06d02ac2b374cd-en","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
