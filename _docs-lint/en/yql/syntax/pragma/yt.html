e &lt;code&gt;locality_timeout&lt;/code&gt; setting in the operation spec (the setting isn't yet documented).&lt;/p&gt;\n&lt;h2 id=\"ytmaplocalitytimeout\"&gt;&lt;a href=\"en/yql/syntax/pragma/yt.html#ytmaplocalitytimeout\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;yt.MapLocalityTimeout&lt;/span&gt;&lt;/a&gt;yt.MapLocalityTimeout&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Value type&lt;/th&gt;\n&lt;th&gt;Default value&lt;/th&gt;\n&lt;th&gt;Static/&lt;br /&gt;dynamic&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Time interval supporting &lt;code&gt;s/m/h/d&lt;/code&gt; suffixes&lt;/td&gt;\n&lt;td&gt;—&lt;/td&gt;\n&lt;td&gt;Dynamic&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Sets the &lt;code&gt;map_locality_timeout&lt;/code&gt; setting in the operation spec (the setting isn't yet documented).&lt;/p&gt;\n&lt;h2 id=\"ytreducelocalitytimeout\"&gt;&lt;a href=\"en/yql/syntax/pragma/yt.html#ytreducelocalitytimeout\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;yt.ReduceLocalityTimeout&lt;/span&gt;&lt;/a&gt;yt.ReduceLocalityTimeout&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Value type&lt;/th&gt;\n&lt;th&gt;Default value&lt;/th&gt;\n&lt;th&gt;Static/&lt;br /&gt;dynamic&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Time interval supporting &lt;code&gt;s/m/h/d&lt;/code&gt; suffixes&lt;/td&gt;\n&lt;td&gt;—&lt;/td&gt;\n&lt;td&gt;Dynamic&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Sets the &lt;code&gt;reduce_locality_timeout&lt;/code&gt; setting in the operation spec (the setting isn't yet documented).&lt;/p&gt;\n&lt;h2 id=\"ytsortlocalitytimeout\"&gt;&lt;a href=\"en/yql/syntax/pragma/yt.html#ytsortlocalitytimeout\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;yt.SortLocalityTimeout&lt;/span&gt;&lt;/a&gt;yt.SortLocalityTimeout&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Value type&lt;/th&gt;\n&lt;th&gt;Default value&lt;/th&gt;\n&lt;th&gt;Static/&lt;br /&gt;dynamic&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Time interval supporting &lt;code&gt;s/m/h/d&lt;/code&gt; suffixes&lt;/td&gt;\n&lt;td&gt;—&lt;/td&gt;\n&lt;td&gt;Dynamic&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Sets the &lt;code&gt;sort_locality_timeout&lt;/code&gt; setting in the operation spec (the setting isn't yet documented).&lt;/p&gt;\n&lt;h2 id=\"ytminlocalityinputdataweight\"&gt;&lt;a href=\"en/yql/syntax/pragma/yt.html#ytminlocalityinputdataweight\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;yt.MinLocalityInputDataWeight&lt;/span&gt;&lt;/a&gt;yt.MinLocalityInputDataWeight&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Value type&lt;/th&gt;\n&lt;th&gt;Default value&lt;/th&gt;\n&lt;th&gt;Static/&lt;br /&gt;dynamic&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Bytes&lt;/td&gt;\n&lt;td&gt;—&lt;/td&gt;\n&lt;td&gt;Dynamic&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Sets the &lt;code&gt;min_locality_input_data_weight&lt;/code&gt; setting in the operation spec (the setting isn't yet documented).&lt;/p&gt;\n&lt;h2 id=\"ytdefaultmapselectivityfactor\"&gt;&lt;a href=\"en/yql/syntax/pragma/yt.html#ytdefaultmapselectivityfactor\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;yt.DefaultMapSelectivityFactor&lt;/span&gt;&lt;/a&gt;yt.DefaultMapSelectivityFactor&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Value type&lt;/th&gt;\n&lt;th&gt;Default value&lt;/th&gt;\n&lt;th&gt;Static/&lt;br /&gt;dynamic&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Positive floating point number&lt;/td&gt;\n&lt;td&gt;—&lt;/td&gt;\n&lt;td&gt;Dynamic&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Sets the approximate output-input ratio for the map stage in the joint MapReduce operation. See the &lt;a href=\"https://ytsaurus.tech/docs/en/user-guide/data-processing/operations/mapreduce\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;documentation&lt;/a&gt;.&lt;/p&gt;\n&lt;h2 id=\"ytsuspendifaccountlimitexceeded\"&gt;&lt;a href=\"en/yql/syntax/pragma/yt.html#ytsuspendifaccountlimitexceeded\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;yt.SuspendIfAccountLimitExceeded&lt;/span&gt;&lt;/a&gt;yt.SuspendIfAccountLimitExceeded&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Value type&lt;/th&gt;\n&lt;th&gt;Default value&lt;/th&gt;\n&lt;th&gt;Static/&lt;br /&gt;dynamic&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Flag&lt;/td&gt;\n&lt;td&gt;false&lt;/td&gt;\n&lt;td&gt;Dynamic&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Pause the operation if the \"Account limit exceeded\" error occurs in jobs. See the &lt;a href=\"https://ytsaurus.tech/docs/en/user-guide/data-processing/operations/operations-options#common_options\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;documentation&lt;/a&gt;.&lt;/p&gt;\n&lt;h2 id=\"ytcommonjoincorelimit\"&gt;&lt;a href=\"en/yql/syntax/pragma/yt.html#ytcommonjoincorelimit\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;yt.CommonJoinCoreLimit&lt;/span&gt;&lt;/a&gt;yt.CommonJoinCoreLimit&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Value type&lt;/th&gt;\n&lt;th&gt;Default value&lt;/th&gt;\n&lt;th&gt;Static/&lt;br /&gt;dynamic&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Bytes&lt;/td&gt;\n&lt;td&gt;128M&lt;/td&gt;\n&lt;td&gt;Static&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Sets the memory buffer size for CommonJoinCore node execution (executed in the job when the common JOIN strategy is selected).&lt;/p&gt;\n&lt;h2 id=\"ytcombinecorelimit\"&gt;&lt;a href=\"en/yql/syntax/pragma/yt.html#ytcombinecorelimit\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;yt.CombineCoreLimit&lt;/span&gt;&lt;/a&gt;yt.CombineCoreLimit&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Value type&lt;/th&gt;\n&lt;th&gt;Default value&lt;/th&gt;\n&lt;th&gt;Static/&lt;br /&gt;dynamic&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Bytes, minimum 1M&lt;/td&gt;\n&lt;td&gt;128M&lt;/td&gt;\n&lt;td&gt;Static&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Sets the memory buffer size for CombineCore node execution.&lt;/p&gt;\n&lt;h2 id=\"ytswitchlimit\"&gt;&lt;a href=\"en/yql/syntax/pragma/yt.html#ytswitchlimit\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;yt.SwitchLimit&lt;/span&gt;&lt;/a&gt;yt.SwitchLimit&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Value type&lt;/th&gt;\n&lt;th&gt;Default value&lt;/th&gt;\n&lt;th&gt;Static/&lt;br /&gt;dynamic&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Bytes, minimum 1M&lt;/td&gt;\n&lt;td&gt;128M&lt;/td&gt;\n&lt;td&gt;Static&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Sets the memory buffer size for Switch node execution.&lt;/p&gt;\n&lt;h2 id=\"ytevaluationtablesizelimit\"&gt;&lt;a href=\"en/yql/syntax/pragma/yt.html#ytevaluationtablesizelimit\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;yt.EvaluationTableSizeLimit&lt;/span&gt;&lt;/a&gt;yt.EvaluationTableSizeLimit&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Value type&lt;/th&gt;\n&lt;th&gt;Default value&lt;/th&gt;\n&lt;th&gt;Static/&lt;br /&gt;dynamic&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Bytes, maximum 10M&lt;/td&gt;\n&lt;td&gt;1M&lt;/td&gt;\n&lt;td&gt;Static&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Sets the maximum total volume of tables used at the evaluation step.&lt;/p&gt;\n&lt;h2 id=\"ytlookupjoinlimit\"&gt;&lt;a href=\"en/yql/syntax/pragma/yt.html#ytlookupjoinlimit\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;yt.LookupJoinLimit&lt;/span&gt;&lt;/a&gt;yt.LookupJoinLimit&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Value type&lt;/th&gt;\n&lt;th&gt;Default value&lt;/th&gt;\n&lt;th&gt;Static/&lt;br /&gt;dynamic&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Bytes, maximum 10M&lt;/td&gt;\n&lt;td&gt;1M&lt;/td&gt;\n&lt;td&gt;Static&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;A table may be used as a map in the Lookup JOIN strategy if it doesn't exceed the minimum size specified in &lt;code&gt;yt.LookupJoinLimit&lt;/code&gt; and &lt;code&gt;yt.EvaluationTableSizeLimit&lt;/code&gt;.&lt;/p&gt;\n&lt;h2 id=\"ytlookupjoinmaxrows\"&gt;&lt;a href=\"en/yql/syntax/pragma/yt.html#ytlookupjoinmaxrows\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;yt.LookupJoinMaxRows&lt;/span&gt;&lt;/a&gt;yt.LookupJoinMaxRows&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Value type&lt;/th&gt;\n&lt;th&gt;Default value&lt;/th&gt;\n&lt;th&gt;Static/&lt;br /&gt;dynamic&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Number, maximum 1,000&lt;/td&gt;\n&lt;td&gt;900&lt;/td&gt;\n&lt;td&gt;Static&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Maximum number of table rows at which the table may be used as a dictionary in the Lookup JOIN strategy.&lt;/p&gt;\n&lt;h2 id=\"ytmaxextrajobmemorytofuseoperations\"&gt;&lt;a href=\"en/yql/syntax/pragma/yt.html#ytmaxextrajobmemorytofuseoperations\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;yt.MaxExtraJobMemoryToFuseOperations&lt;/span&gt;&lt;/a&gt;yt.MaxExtraJobMemoryToFuseOperations&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Value type&lt;/th&gt;\n&lt;th&gt;Default value&lt;/th&gt;\n&lt;th&gt;Static/&lt;br /&gt;dynamic&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Bytes&lt;/td&gt;\n&lt;td&gt;2G&lt;/td&gt;\n&lt;td&gt;Static&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Maximum memory utilization for jobs permitted after operations are merged by optimizers.&lt;/p&gt;\n&lt;h2 id=\"ytmaxreplicationfactortofuseoperations\"&gt;&lt;a href=\"en/yql/syntax/pragma/yt.html#ytmaxreplicationfactortofuseoperations\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;yt.MaxReplicationFactorToFuseOperations&lt;/span&gt;&lt;/a&gt;yt.MaxReplicationFactorToFuseOperations&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Value type&lt;/th&gt;\n&lt;th&gt;Default value&lt;/th&gt;\n&lt;th&gt;Static/&lt;br /&gt;dynamic&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Floating point number, minimum 1.0&lt;/td&gt;\n&lt;td&gt;20.0&lt;/td&gt;\n&lt;td&gt;Static&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Maximum data replication factor permitted after operations are merged by optimizers.&lt;/p&gt;\n&lt;h2 id=\"yttopsortmaxlimit\"&gt;&lt;a href=\"en/yql/syntax/pragma/yt.html#yttopsortmaxlimit\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;yt.TopSortMaxLimit&lt;/span&gt;&lt;/a&gt;yt.TopSortMaxLimit`&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Value type&lt;/th&gt;\n&lt;th&gt;Default value&lt;/th&gt;\n&lt;th&gt;Static/&lt;br /&gt;dynamic&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Positive number&lt;/td&gt;\n&lt;td&gt;1000&lt;/td&gt;\n&lt;td&gt;Static&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Maximum LIMIT value used together with ORDER BY at which TopSort optimization is launched.&lt;/p&gt;\n&lt;h2 id=\"yttopsortsizeperjob\"&gt;&lt;a href=\"en/yql/syntax/pragma/yt.html#yttopsortsizeperjob\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;yt.TopSortSizePerJob&lt;/span&gt;&lt;/a&gt;yt.TopSortSizePerJob&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Value type&lt;/th&gt;\n&lt;th&gt;Default value&lt;/th&gt;\n&lt;th&gt;Static/&lt;br /&gt;dynamic&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Bytes, minimum 1&lt;/td&gt;\n&lt;td&gt;128M&lt;/td&gt;\n&lt;td&gt;Static&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Sets the expected data volume per job in a TopSort operation.&lt;/p&gt;\n&lt;h2 id=\"yttopsortrowmultiplierperjob\"&gt;&lt;a href=\"en/yql/syntax/pragma/yt.html#yttopsortrowmultiplierperjob\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;yt.TopSortRowMultiplierPerJob&lt;/span&gt;&lt;/a&gt;yt.TopSortRowMultiplierPerJob&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Value type&lt;/th&gt;\n&lt;th&gt;Default value&lt;/th&gt;\n&lt;th&gt;Static/&lt;br /&gt;dynamic&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Number, minimum 1&lt;/td&gt;\n&lt;td&gt;10&lt;/td&gt;\n&lt;td&gt;Static&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Sets the expected number of records per job in a TopSort operation, calculated as &lt;code&gt;LIMIT * yt.TopSortRowMultiplierPerJob&lt;/code&gt;.&lt;/p&gt;\n&lt;h2 id=\"ytdisableoptimizers\"&gt;&lt;a href=\"en/yql/syntax/pragma/yt.html#ytdisableoptimizers\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;yt.DisableOptimizers&lt;/span&gt;&lt;/a&gt;yt.DisableOptimizers&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Value type&lt;/th&gt;\n&lt;th&gt;Default value&lt;/th&gt;\n&lt;th&gt;Static/&lt;br /&gt;dynamic&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;String containing the list of optimizers separated by any of the following symbols: comma, semicolon, space, or `&lt;/td&gt;\n&lt;td&gt;`&lt;/td&gt;\n&lt;td&gt;—&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Disables the set optimizers.&lt;/p&gt;\n&lt;h2 id=\"ytjobenv\"&gt;&lt;a href=\"en/yql/syntax/pragma/yt.html#ytjobenv\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;yt.JobEnv&lt;/span&gt;&lt;/a&gt;yt.JobEnv&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Value type&lt;/th&gt;\n&lt;th&gt;Default value&lt;/th&gt;\n&lt;th&gt;Static/&lt;br /&gt;dynamic&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;String representation of a yson map&lt;/td&gt;\n&lt;td&gt;—&lt;/td&gt;\n&lt;td&gt;Dynamic&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Sets environment variables for map and reduce jobs in operations. Map keys set the environment variable names, and map values set the values for these variables.&lt;/p&gt;\n&lt;h2 id=\"ytoperationspec\"&gt;&lt;a href=\"en/yql/syntax/pragma/yt.html#ytoperationspec\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;yt.OperationSpec&lt;/span&gt;&lt;/a&gt;yt.OperationSpec&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Value type&lt;/th&gt;\n&lt;th&gt;Default value&lt;/th&gt;\n&lt;th&gt;Static/&lt;br /&gt;dynamic&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;String representation of a yson map&lt;/td&gt;\n&lt;td&gt;—&lt;/td&gt;\n&lt;td&gt;Dynamic&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Sets the operation settings map. Lets you set the settings that have no counterparts in the form of pragmas. Settings that were set via special-purpose pragmas have priority and redefine the values in this map.&lt;/p&gt;\n&lt;h2 id=\"ytannotations\"&gt;&lt;a href=\"en/yql/syntax/pragma/yt.html#ytannotations\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;yt.Annotations&lt;/span&gt;&lt;/a&gt;yt.Annotations&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Value type&lt;/th&gt;\n&lt;th&gt;Default value&lt;/th&gt;\n&lt;th&gt;Static/&lt;br /&gt;dynamic&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;String representation of a yson map&lt;/td&gt;\n&lt;td&gt;—&lt;/td&gt;\n&lt;td&gt;Dynamic&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Sets arbitrary structured information related to the operation. See the &lt;a href=\"https://ytsaurus.tech/docs/en/user-guide/data-processing/operations/operations-options\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;documentation&lt;/a&gt;.&lt;/p&gt;\n&lt;h2 id=\"ytstartedby\"&gt;&lt;a href=\"en/yql/syntax/pragma/yt.html#ytstartedby\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;yt.StartedBy&lt;/span&gt;&lt;/a&gt;yt.StartedBy&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Value type&lt;/th&gt;\n&lt;th&gt;Default value&lt;/th&gt;\n&lt;th&gt;Static/&lt;br /&gt;dynamic&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;String representation of a yson map&lt;/td&gt;\n&lt;td&gt;—&lt;/td&gt;\n&lt;td&gt;Dynamic&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Sets the map describing the client that started the operation. See the &lt;a href=\"https://ytsaurus.tech/docs/en/user-guide/data-processing/operations/operations-options\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;documentation&lt;/a&gt;.&lt;/p&gt;\n&lt;h2 id=\"ytdescription\"&gt;&lt;a href=\"en/yql/syntax/pragma/yt.html#ytdescription\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;yt.Description&lt;/span&gt;&lt;/a&gt;yt.Description&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Value type&lt;/th&gt;\n&lt;th&gt;Default value&lt;/th&gt;\n&lt;th&gt;Static/&lt;br /&gt;dynamic&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;String representation of a yson map&lt;/td&gt;\n&lt;td&gt;—&lt;/td&gt;\n&lt;td&gt;Dynamic&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Sets human-readable information displayed on the operation page in the web interface. See the &lt;a href=\"https://ytsaurus.tech/docs/en/user-guide/data-processing/operations/operations-options\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;documentation&lt;/a&gt;.&lt;/p&gt;\n&lt;h2 id=\"ytmaxspeculativejobcountpertask\"&gt;&lt;a href=\"en/yql/syntax/pragma/yt.html#ytmaxspeculativejobcountpertask\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;yt.MaxSpeculativeJobCountPerTask&lt;/span&gt;&lt;/a&gt;yt.MaxSpeculativeJobCountPerTask&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Value type&lt;/th&gt;\n&lt;th&gt;Default value&lt;/th&gt;\n&lt;th&gt;Static/&lt;br /&gt;dynamic&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Positive number&lt;/td&gt;\n&lt;td&gt;—&lt;/td&gt;\n&lt;td&gt;Dynamic&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Sets the number of &lt;a href=\"en/yql/syntax/pragma/%7B%7Byql.pages.syntax.pragma.speculative-job%7D%7D\"&gt;speculatively executed jobs&lt;/a&gt; in YTsaurus operations. YTsaurus cluster settings are used by default.&lt;/p&gt;\n&lt;h2 id=\"ytllvmmemsize\"&gt;&lt;a href=\"en/yql/syntax/pragma/yt.html#ytllvmmemsize\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;yt.LLVMMemSize&lt;/span&gt;&lt;/a&gt;yt.LLVMMemSize&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Value type&lt;/th&gt;\n&lt;th&gt;Default value&lt;/th&gt;\n&lt;th&gt;Static/&lt;br /&gt;dynamic&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Bytes&lt;/td&gt;\n&lt;td&gt;256M&lt;/td&gt;\n&lt;td&gt;Dynamic&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Sets the fixed memory size required for compiling the LLVM code in jobs.&lt;/p&gt;\n&lt;h2 id=\"ytllvmpernodememsize\"&gt;&lt;a href=\"en/yql/syntax/pragma/yt.html#ytllvmpernodememsize\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;yt.LLVMPerNodeMemSize&lt;/span&gt;&lt;/a&gt;yt.LLVMPerNodeMemSize&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Value type&lt;/th&gt;\n&lt;th&gt;Default value&lt;/th&gt;\n&lt;th&gt;Static/&lt;br /&gt;dynamic&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Bytes&lt;/td&gt;\n&lt;td&gt;10K&lt;/td&gt;\n&lt;td&gt;Dynamic&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Sets the required memory size per computation graph node for compiling the LLVM code in jobs.&lt;/p&gt;\n&lt;h2 id=\"ytsamplingioblocksize\"&gt;&lt;a href=\"en/yql/syntax/pragma/yt.html#ytsamplingioblocksize\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;yt.SamplingIoBlockSize&lt;/span&gt;&lt;/a&gt;yt.SamplingIoBlockSize&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Value type&lt;/th&gt;\n&lt;th&gt;Default value&lt;/th&gt;\n&lt;th&gt;Static/&lt;br /&gt;dynamic&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Bytes&lt;/td&gt;\n&lt;td&gt;—&lt;/td&gt;\n&lt;td&gt;Dynamic&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Sets the minimum size of a block for coarse-grain sampling.&lt;/p&gt;\n&lt;h2 id=\"ytbinarytmpfolder\"&gt;&lt;a href=\"en/yql/syntax/pragma/yt.html#ytbinarytmpfolder\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;yt.BinaryTmpFolder&lt;/span&gt;&lt;/a&gt;yt.BinaryTmpFolder&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Value type&lt;/th&gt;\n&lt;th&gt;Default value&lt;/th&gt;\n&lt;th&gt;Static/&lt;br /&gt;dynamic&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Path on cluster&lt;/td&gt;\n&lt;td&gt;—&lt;/td&gt;\n&lt;td&gt;Static&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Sets a separate path on the cluster for caching binary query artifacts (UDF and job binary). Artifacts are saved to the directory root with the same name as the artifact's md5. Artifacts are saved and used in this directory outside of transactions even if a &lt;code&gt;yt.ExternalTx&lt;/code&gt; pragma is set in the query.&lt;/p&gt;\n&lt;h2 id=\"ytbinaryexpirationinterval\"&gt;&lt;a href=\"en/yql/syntax/pragma/yt.html#ytbinaryexpirationinterval\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;yt.BinaryExpirationInterval&lt;/span&gt;&lt;/a&gt;yt.BinaryExpirationInterval&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Value type&lt;/th&gt;\n&lt;th&gt;Default value&lt;/th&gt;\n&lt;th&gt;Static/&lt;br /&gt;dynamic&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Time interval supporting &lt;code&gt;s/m/h/d&lt;/code&gt; suffixes&lt;/td&gt;\n&lt;td&gt;—&lt;/td&gt;\n&lt;td&gt;Static&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Allows management of &lt;a href=\"https://ytsaurus.tech/docs/en/user-guide/storage/cypress#TTL\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;TTL for cached binary artifacts&lt;/a&gt;. Only works together with &lt;code&gt;yt.BinaryTmpFolder&lt;/code&gt;. Each use of a binary artifact in the query extends the lifetime of its TTL.&lt;/p&gt;\n&lt;h2 id=\"ytfolderinlinedatalimit\"&gt;&lt;a href=\"en/yql/syntax/pragma/yt.html#ytfolderinlinedatalimit\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;yt.FolderInlineDataLimit&lt;/span&gt;&lt;/a&gt;yt.FolderInlineDataLimit&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Value type&lt;/th&gt;\n&lt;th&gt;Default value&lt;/th&gt;\n&lt;th&gt;Static/&lt;br /&gt;dynamic&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Bytes&lt;/td&gt;\n&lt;td&gt;100K&lt;/td&gt;\n&lt;td&gt;Static&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Sets the maximum amount of data for the inline list obtained as a result of the Folder computation. If a greater size is selected, a temporary file will be used.&lt;/p&gt;\n&lt;h2 id=\"ytfolderinlineitemslimit\"&gt;&lt;a href=\"en/yql/syntax/pragma/yt.html#ytfolderinlineitemslimit\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;yt.FolderInlineItemsLimit&lt;/span&gt;&lt;/a&gt;yt.FolderInlineItemsLimit&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Value type&lt;/th&gt;\n&lt;th&gt;Default value&lt;/th&gt;\n&lt;th&gt;Static/&lt;br /&gt;dynamic&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Positive number&lt;/td&gt;\n&lt;td&gt;100&lt;/td&gt;\n&lt;td&gt;Static&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Sets the maximum number of elements in the inline list obtained as a result of the Folder computation. If a greater size is selected, a temporary file will be used.&lt;/p&gt;\n&lt;h2 id=\"yt-usenativeyttypes\"&gt;&lt;a href=\"en/yql/syntax/pragma/yt.html#yt-usenativeyttypes\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code&gt;yt.UseNativeYtTypes&lt;/code&gt;&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Value type&lt;/th&gt;\n&lt;th&gt;Default value&lt;/th&gt;\n&lt;th&gt;Static/&lt;br /&gt;dynamic&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Flag&lt;/td&gt;\n&lt;td&gt;false&lt;/td&gt;\n&lt;td&gt;Static&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Allows values of composite data types to be written to tables through native support of composite types in YTsaurus.&lt;/p&gt;\n&lt;h2 id=\"ytpublishedmediayttemporarymedia\"&gt;&lt;a href=\"en/yql/syntax/pragma/yt.html#ytpublishedmediayttemporarymedia\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;yt.PublishedMediayt.TemporaryMedia&lt;/span&gt;&lt;/a&gt;yt.PublishedMedia&lt;code&gt;/&lt;/code&gt;yt.TemporaryMedia`&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Value type&lt;/th&gt;\n&lt;th&gt;Default value&lt;/th&gt;\n&lt;th&gt;Static/&lt;br /&gt;dynamic&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;String representation of a yson map&lt;/td&gt;\n&lt;td&gt;—&lt;/td&gt;\n&lt;td&gt;Dynamic&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Set the &lt;code&gt;@media&lt;/code&gt; attribute for newly created tables. If available, assigns &lt;a href=\"https://ytsaurus.tech/docs/en/user-guide/storage/media#naznachenie-mediuma\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;mediums in YTsaurus&lt;/a&gt;, where table chunks will be stored.&lt;/p&gt;\n&lt;p&gt;Tables specified in &lt;a href=\"en/yql/syntax/insert_into.html\"&gt;INSERT INTO&lt;/a&gt; are Published. All other tables are Temporary.&lt;/p&gt;\n&lt;h2 id=\"ytpublishedprimarymedium-/-yttemporaryprimarymedium\"&gt;&lt;a href=\"en/yql/syntax/pragma/yt.html#ytpublishedprimarymedium-/-yttemporaryprimarymedium\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;yt.PublishedPrimaryMedium / yt.TemporaryPrimaryMedium&lt;/span&gt;&lt;/a&gt;yt.PublishedPrimaryMedium / yt.TemporaryPrimaryMedium&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Value type&lt;/th&gt;\n&lt;th&gt;Default value&lt;/th&gt;\n&lt;th&gt;Static/&lt;br /&gt;dynamic&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;String&lt;/td&gt;\n&lt;td&gt;—&lt;/td&gt;\n&lt;td&gt;Dynamic&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Set the &lt;code&gt;@primary_medium&lt;/code&gt; attribute for newly created tables. If available, assigns the &lt;a href=\"https://ytsaurus.tech/docs/en/user-guide/storage/media#primary\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;primary medium in YTsaurus&lt;/a&gt;, where chunks will be recorded. By default, YTsaurus sets the primary medium to &lt;code&gt;\"default\"&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Tables specified in &lt;a href=\"en/yql/syntax/insert_into.html\"&gt;INSERT INTO&lt;/a&gt; are Published. All other tables are Temporary.&lt;/p&gt;\n&lt;h2 id=\"ytintermediatedatamedium\"&gt;&lt;a href=\"en/yql/syntax/pragma/yt.html#ytintermediatedatamedium\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;yt.IntermediateDataMedium&lt;/span&gt;&lt;/a&gt;yt.IntermediateDataMedium&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Value type&lt;/th&gt;\n&lt;th&gt;Default value&lt;/th&gt;\n&lt;th&gt;Static/&lt;br /&gt;dynamic&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;String&lt;/td&gt;\n&lt;td&gt;—&lt;/td&gt;\n&lt;td&gt;Dynamic&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Set the medium used for intermediate data in operations (Sort, MapReduce). To learn more, see the &lt;a href=\"https://ytsaurus.tech/docs/en/user-guide/data-processing/operations/sort\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;documentation&lt;/a&gt;.&lt;/p&gt;\n&lt;h2 id=\"ytprimarymedium\"&gt;&lt;a href=\"en/yql/syntax/pragma/yt.html#ytprimarymedium\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;yt.PrimaryMedium&lt;/span&gt;&lt;/a&gt;yt.PrimaryMedium&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Value type&lt;/th&gt;\n&lt;th&gt;Default value&lt;/th&gt;\n&lt;th&gt;Static/&lt;br /&gt;dynamic&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;String&lt;/td&gt;\n&lt;td&gt;—&lt;/td&gt;\n&lt;td&gt;Dynamic&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Sets the &lt;a href=\"https://ytsaurus.tech/docs/en/user-guide/storage/media#primary\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;primary medium in YTsaurus&lt;/a&gt; for Published and Temporary tables and intermediate data in operations. Amounts to simultaneous setting of &lt;code&gt;yt.IntermediateDataMedium&lt;/code&gt;, &lt;code&gt;yt.PublishedPrimaryMedium&lt;/code&gt;, and &lt;code&gt;yt.TemporaryPrimaryMedium&lt;/code&gt; pragmas.&lt;/p&gt;\n&lt;h2 id=\"ythybriddqexecution\"&gt;&lt;a href=\"en/yql/syntax/pragma/yt.html#ythybriddqexecution\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;yt.HybridDqExecution&lt;/span&gt;&lt;/a&gt;yt.HybridDqExecution&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Value type&lt;/th&gt;\n&lt;th&gt;Default value&lt;/th&gt;\n&lt;th&gt;Static/&lt;br /&gt;dynamic&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Flag&lt;/td&gt;\n&lt;td&gt;true&lt;/td&gt;\n&lt;td&gt;Static&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Includes hybrid query execution via DQ&lt;/p&gt;\n&lt;h2 id=\"ytnetworkproject\"&gt;&lt;a href=\"en/yql/syntax/pragma/yt.html#ytnetworkproject\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;yt.NetworkProject&lt;/span&gt;&lt;/a&gt;yt.NetworkProject&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Value type&lt;/th&gt;\n&lt;th&gt;Default value&lt;/th&gt;\n&lt;th&gt;Static/&lt;br /&gt;dynamic&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;String&lt;/td&gt;\n&lt;td&gt;-&lt;/td&gt;\n&lt;td&gt;Dynamic&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Sets the use of a specified network project in jobs. See the &lt;a href=\"https://ytsaurus.tech/docs/en/user-guide/data-processing/operations/mtn\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;documentation&lt;/a&gt;.&lt;/p&gt;\n&lt;h2 id=\"ytbatchlistfolderconcurrency\"&gt;&lt;a href=\"en/yql/syntax/pragma/yt.html#ytbatchlistfolderconcurrency\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;yt.BatchListFolderConcurrency&lt;/span&gt;&lt;/a&gt;yt.BatchListFolderConcurrency&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Value type&lt;/th&gt;\n&lt;th&gt;Default value&lt;/th&gt;\n&lt;th&gt;Static/&lt;br /&gt;dynamic&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Positive number&lt;/td&gt;\n&lt;td&gt;5&lt;/td&gt;\n&lt;td&gt;Static&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Sets the number of concurrent directory listing operations.&lt;/p&gt;\n&lt;h2 id=\"ytcolumngroupmode\"&gt;&lt;a href=\"en/yql/syntax/pragma/yt.html#ytcolumngroupmode\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;yt.ColumnGroupMode&lt;/span&gt;&lt;/a&gt;yt.ColumnGroupMode&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Value type&lt;/th&gt;\n&lt;th&gt;Default value&lt;/th&gt;\n&lt;th&gt;Static/&lt;br /&gt;dynamic&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;String: disable, single or perusage&lt;/td&gt;\n&lt;td&gt;disable&lt;/td&gt;\n&lt;td&gt;Static&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Sets the columnar group computation mode for intermediate query tables. In &lt;code&gt;disable&lt;/code&gt; mode, columnar groups aren't used. In &lt;code&gt;single&lt;/code&gt; mode, one group is created for all table columns. In &lt;code&gt;perusage&lt;/code&gt; mode, granular column groups by their consumers are created. All columns of the same group are simultaneously used in one or more consumers. For example, if the intermediate table has columns [a, b, c, d, e, f] and it is used by two operations with column selections [a, b, c, d] and [c, d, e, f] respectively, three column groups ([a, b], [c, d], and [e, f]) will be created in the table. If the intermediate table is used for publishing to an output table (that is, the consumer is the YtPublish node), columnar groups aren't used, except for the explicitly specified &lt;a href=\"en/yql/syntax/insert_into.html#hints\"&gt;column_groups modifier&lt;/a&gt;. In the latter case, the intermediate table uses the modifier's columnar groups.&lt;/p&gt;\n&lt;h2 id=\"ytmincolumngroupsize\"&gt;&lt;a href=\"en/yql/syntax/pragma/yt.html#ytmincolumngroupsize\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;yt.MinColumnGroupSize&lt;/span&gt;&lt;/a&gt;yt.MinColumnGroupSize&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Value type&lt;/th&gt;\n&lt;th&gt;Default value&lt;/th&gt;\n&lt;th&gt;Static/&lt;br /&gt;dynamic&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Positive number not less than 2&lt;/td&gt;\n&lt;td&gt;2&lt;/td&gt;\n&lt;td&gt;Static&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Sets the minimum size of a columnar group. If a computed group contains the number of columns that is less than the specified pragma value, the group isn't created.&lt;/p&gt;\n&lt;h2 id=\"ytmaxcolumngroups\"&gt;&lt;a href=\"en/yql/syntax/pragma/yt.html#ytmaxcolumngroups\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;yt.MaxColumnGroups&lt;/span&gt;&lt;/a&gt;yt.MaxColumnGroups&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Value type&lt;/th&gt;\n&lt;th&gt;Default value&lt;/th&gt;\n&lt;th&gt;Static/&lt;br /&gt;dynamic&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Positive number&lt;/td&gt;\n&lt;td&gt;64&lt;/td&gt;\n&lt;td&gt;Static&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Sets the maximum number of columnar groups per intermediate query table. If the computed number of groups exceeds this limit, groups aren't created for this table.&lt;/p&gt;\n&lt;h2 id=\"ytforcejobsizeadjuster\"&gt;&lt;a href=\"en/yql/syntax/pragma/yt.html#ytforcejobsizeadjuster\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;yt.ForceJobSizeAdjuster&lt;/span&gt;&lt;/a&gt;yt.ForceJobSizeAdjuster&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Value type&lt;/th&gt;\n&lt;th&gt;Default value&lt;/th&gt;\n&lt;th&gt;Static/&lt;br /&gt;dynamic&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Flag&lt;/td&gt;\n&lt;td&gt;true&lt;/td&gt;\n&lt;td&gt;Static&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Sets the &lt;code&gt;\"force_job_size_adjuster\"&lt;/code&gt; option in the operation settings.&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"en/yql/syntax/pragma/yt.md","sourcePath":"en/yql/syntax/pragma/yt.md"},"headings":[{"title":"yt.InferSchema / yt.ForceInferSchema","href":"en/yql/syntax/pragma/yt.html#inferschema","level":2},{"title":"yt.InferSchemaTableCountThreshold","href":"en/yql/syntax/pragma/yt.html#ytinferschematablecountthreshold","level":2},{"title":"yt.IgnoreWeakSchema"
