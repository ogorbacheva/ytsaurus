            {"data":{"leading":false,"html":"&lt;p&gt;YT pragmas may be defined as static or dynamic based on their lifetimes. Static pragmas are initialized one time at the earliest query processing step. If a static pragma is specified multiple times in a query, it accepts the latest value set for it. Dynamic pragma values are initialized at the query execution step after its optimization and execution plan preparation. The specified value is valid until the next identical pragma is found or until the query is completed. For dynamic pragmas only, you can reset their values to the default by assigning a &lt;code&gt;default&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;All pragmas that affect query optimizers are static because dynamic pragma values are not yet calculated at this step.&lt;/p&gt;\n&lt;h2 id=\"inferschema\"&gt;&lt;a href=\"en/yql/syntax/pragma/yt.html#inferschema\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;yt.InferSchema / yt.ForceInferSchema&lt;/span&gt;&lt;/a&gt;yt.InferSchema / yt.ForceInferSchema&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Value type&lt;/th&gt;\n&lt;th&gt;Default value&lt;/th&gt;\n&lt;th&gt;Static/&lt;br /&gt;dynamic&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;A number from 1 to 1,000&lt;/td&gt;\n&lt;td&gt;—&lt;/td&gt;\n&lt;td&gt;Static&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Outputting the data schema based on the contents of the table's first rows. If PRAGMA is specified without a value, the contents of only the first row is used. If multiple rows are specified and column data types differ, they are extended to Yson.&lt;/p&gt;\n&lt;p&gt;InferSchema includes outputting data schemas for those tables only where it's not specified in metadata at all. When using ForceInferSchema, the data schema from metadata is ignored except for the list of key columns for sorted tables.&lt;/p&gt;\n&lt;p&gt;In addition to the detected column, dictionary column _other (row-on-row) is generated, which contains values for those columns that weren't in the first row but were found somewhere else. This lets you use &lt;a href=\"en/yql/builtins/basic.html#weakfield\"&gt;WeakField&lt;/a&gt; for such tables.&lt;/p&gt;\n&lt;p&gt;Due to a wide range of issues that may arise, this mode isn't recommended for use and is disabled by default.&lt;/p&gt;\n&lt;h2 id=\"ytinferschematablecountthreshold\"&gt;&lt;a href=\"en/yql/syntax/pragma/yt.html#ytinferschematablecountthreshold\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;yt.InferSchemaTableCountThreshold&lt;/span&gt;&lt;/a&gt;yt.InferSchemaTableCountThreshold&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Value type&lt;/th&gt;\n&lt;th&gt;Default value&lt;/th&gt;\n&lt;th&gt;Static/&lt;br /&gt;dynamic&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Positive number&lt;/td&gt;\n&lt;td&gt;50&lt;/td&gt;\n&lt;td&gt;Static&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;If the number of tables for which the schema is outputted based on their contents exceeds the specified value, then schema outputting is initiated as a separate operation on YTsaurus, which may happen much faster.&lt;/p&gt;\n&lt;h2 id=\"ytignoreweakschema\"&gt;&lt;a href=\"en/yql/syntax/pragma/yt.html#ytignoreweakschema\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;yt.IgnoreWeakSchema&lt;/span&gt;&lt;/a&gt;yt.IgnoreWeakSchema&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Value type&lt;/th&gt;\n&lt;th&gt;Default value&lt;/th&gt;\n&lt;th&gt;Static/&lt;br /&gt;dynamic&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Flag&lt;/td&gt;\n&lt;td&gt;false&lt;/td&gt;\n&lt;td&gt;Static&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Ignore the table's weak schema (produced by sorting a non-schematized table based on a set of fields).&lt;/p&gt;\n&lt;p&gt;Together with &lt;code&gt;yt.InferSchema&lt;/code&gt;, you can output data-based schemas for such tables.&lt;/p&gt;\n&lt;h2 id=\"ytignoreyamrdsv\"&gt;&lt;a href=\"en/yql/syntax/pragma/yt.html#ytignoreyamrdsv\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;yt.IgnoreYamrDsv&lt;/span&gt;&lt;/a&gt;yt.IgnoreYamrDsv&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Value type&lt;/th&gt;\n&lt;th&gt;Default value&lt;/th&gt;\n&lt;th&gt;Static/&lt;br /&gt;dynamic&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Flag&lt;/td&gt;\n&lt;td&gt;false&lt;/td&gt;\n&lt;td&gt;Static&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Ignore &lt;code&gt;_format=yamred_dsv&lt;/code&gt; if it is specified in the input table's metadata.&lt;/p&gt;\n&lt;h2 id=\"ignoretypev3\"&gt;&lt;a href=\"en/yql/syntax/pragma/yt.html#ignoretypev3\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;yt.IgnoreTypeV3&lt;/span&gt;&lt;/a&gt;yt.IgnoreTypeV3&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Value type&lt;/th&gt;\n&lt;th&gt;Default value&lt;/th&gt;\n&lt;th&gt;Static/&lt;br /&gt;dynamic&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Flag&lt;/td&gt;\n&lt;td&gt;false&lt;/td&gt;\n&lt;td&gt;Static&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;When reading tables with type_v3 schema, all fields containing complex types will be displayed as Yson fields in the query. Complex types include all non-data types and data types with more than one level of optionality.&lt;/p&gt;\n&lt;h2 id=\"ytstaticpool\"&gt;&lt;a href=\"en/yql/syntax/pragma/yt.html#ytstaticpool\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;yt.StaticPool&lt;/span&gt;&lt;/a&gt;yt.StaticPool&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Value type&lt;/th&gt;\n&lt;th&gt;Default value&lt;/th&gt;\n&lt;th&gt;Static/&lt;br /&gt;dynamic&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;String&lt;/td&gt;\n&lt;td&gt;Current user login&lt;/td&gt;\n&lt;td&gt;Static&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Selecting a computing pool in the scheduler for operations performed at the optimization step.&lt;/p&gt;\n&lt;h2 id=\"ytpool\"&gt;&lt;a href=\"en/yql/syntax/pragma/yt.html#ytpool\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;yt.Pool&lt;/span&gt;&lt;/a&gt;yt.Pool&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Value type&lt;/th&gt;\n&lt;th&gt;Default value&lt;/th&gt;\n&lt;th&gt;Static/&lt;br /&gt;dynamic&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;String&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;yt.StaticPool&lt;/code&gt; if set, or the current user login&lt;/td&gt;\n&lt;td&gt;Dynamic&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Selecting a computing pool in the scheduler for regular query operations.&lt;/p&gt;\n&lt;h2 id=\"ytowners\"&gt;&lt;a href=\"en/yql/syntax/pragma/yt.html#ytowners\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;yt.Owners&lt;/span&gt;&lt;/a&gt;yt.Owners&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Value type&lt;/th&gt;\n&lt;th&gt;Default value&lt;/th&gt;\n&lt;th&gt;Static/&lt;br /&gt;dynamic&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;A string containing the list of logins separated by any of these symbols: comma, semicolon, space or `&lt;/td&gt;\n&lt;td&gt;`&lt;/td&gt;\n&lt;td&gt;—&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Lets you grant management permissions for operations created by MapReduce in YTsaurus (cancel, pause, run-job-shell, etc.) to any users other than the YQL operation owner.&lt;/p&gt;\n&lt;h2 id=\"ytoperationreaders\"&gt;&lt;a href=\"en/yql/syntax/pragma/yt.html#ytoperationreaders\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;yt.OperationReaders&lt;/span&gt;&lt;/a&gt;yt.OperationReaders&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Value type&lt;/th&gt;\n&lt;th&gt;Default value&lt;/th&gt;\n&lt;th&gt;Static/&lt;br /&gt;dynamic&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;A string containing the list of logins separated by any of these symbols: comma, semicolon, space or `&lt;/td&gt;\n&lt;td&gt;`&lt;/td&gt;\n&lt;td&gt;—&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Lets you grant read permissions for operations created by MapReduce in YTsaurus to any users other than the YQL operation owner.&lt;/p&gt;\n&lt;h2 id=\"ytauth\"&gt;&lt;a href=\"en/yql/syntax/pragma/yt.html#ytauth\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;yt.Auth&lt;/span&gt;&lt;/a&gt;yt.Auth&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Value type&lt;/th&gt;\n&lt;th&gt;Default value&lt;/th&gt;\n&lt;th&gt;Static/&lt;br /&gt;dynamic&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;String&lt;/td&gt;\n&lt;td&gt;—&lt;/td&gt;\n&lt;td&gt;Static&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Use authentication data other than the default data.&lt;/p&gt;\n&lt;h2 id=\"ytdefaultmaxjobfails\"&gt;&lt;a href=\"en/yql/syntax/pragma/yt.html#ytdefaultmaxjobfails\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;yt.DefaultMaxJobFails&lt;/span&gt;&lt;/a&gt;yt.DefaultMaxJobFails&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Value type&lt;/th&gt;\n&lt;th&gt;Default value&lt;/th&gt;\n&lt;th&gt;Static/&lt;br /&gt;dynamic&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Positive number&lt;/td&gt;\n&lt;td&gt;5&lt;/td&gt;\n&lt;td&gt;Static&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;The number of failed MapReduce jobs, upon reaching which query execution retries are stopped and the query is considered failed.&lt;/p&gt;\n&lt;h2 id=\"ytdefaultmemorylimit\"&gt;&lt;a href=\"en/yql/syntax/pragma/yt.html#ytdefaultmemorylimit\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;yt.DefaultMemoryLimit&lt;/span&gt;&lt;/a&gt;yt.DefaultMemoryLimit&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Value type&lt;/th&gt;\n&lt;th&gt;Default value&lt;/th&gt;\n&lt;th&gt;Static/&lt;br /&gt;dynamic&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Bytes&lt;/td&gt;\n&lt;td&gt;512M&lt;/td&gt;\n&lt;td&gt;Dynamic&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Limitation of memory utilization (bytes) by jobs, which is ordered when launching MapReduce operations.&lt;/p&gt;\n&lt;p&gt;You can use K, M, and G suffixes to specify values in kilobytes, megabytes, and gigabytes, respectively.&lt;/p&gt;\n&lt;h2 id=\"datasizeperjob\"&gt;&lt;a href=\"en/yql/syntax/pragma/yt.html#datasizeperjob\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;yt.DataSizePerJob / yt.DataSizePerMapJob&lt;/span&gt;&lt;/a&gt;yt.DataSizePerJob / yt.DataSizePerMapJob&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Value type&lt;/th&gt;\n&lt;th&gt;Default value&lt;/th&gt;\n&lt;th&gt;Static/&lt;br /&gt;dynamic&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Bytes&lt;/td&gt;\n&lt;td&gt;2G&lt;/td&gt;\n&lt;td&gt;Dynamic&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Controls the splitting of MapReduce operations into jobs: the larger the number, the fewer jobs. Use a lower value for compute-intensive jobs. Use a higher value for jobs that scan through a large amount of data (namely, user_sessions).&lt;/p&gt;\n&lt;p&gt;You can use K, M, and G suffixes to specify values in kilobytes, megabytes, and gigabytes, respectively.&lt;/p&gt;\n&lt;h2 id=\"ytdatasizepersortjob\"&gt;&lt;a href=\"en/yql/syntax/pragma/yt.html#ytdatasizepersortjob\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;yt.DataSizePerSortJob&lt;/span&gt;&lt;/a&gt;yt.DataSizePerSortJob&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Value type&lt;/th&gt;\n&lt;th&gt;Default value&lt;/th&gt;\n&lt;th&gt;Static/&lt;br /&gt;dynamic&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Bytes&lt;/td&gt;\n&lt;td&gt;-&lt;/td&gt;\n&lt;td&gt;Dynamic&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Controls the splitting of sort jobs in MapReduce operations.&lt;/p&gt;\n&lt;p&gt;You can use K, M, and G suffixes to specify values in kilobytes, megabytes, and gigabytes, respectively.&lt;/p&gt;\n&lt;h2 id=\"ytdatasizeperpartition\"&gt;&lt;a href=\"en/yql/syntax/pragma/yt.html#ytdatasizeperpartition\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;yt.DataSizePerPartition&lt;/span&gt;&lt;/a&gt;yt.DataSizePerPartition&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Value type&lt;/th&gt;\n&lt;th&gt;Default value&lt;/th&gt;\n&lt;th&gt;Static/&lt;br /&gt;dynamic&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Bytes&lt;/td&gt;\n&lt;td&gt;1G&lt;/td&gt;\n&lt;td&gt;Dynamic&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Controls the size of partitions in MapReduce operations.&lt;/p&gt;\n&lt;p&gt;You can use K, M, and G suffixes to specify values in kilobytes, megabytes, and gigabytes, respectively.&lt;/p&gt;\n&lt;h2 id=\"ytmaxjobcount\"&gt;&lt;a href=\"en/yql/syntax/pragma/yt.html#ytmaxjobcount\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;yt.MaxJobCount&lt;/span&gt;&lt;/a&gt;yt.MaxJobCount&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Value type&lt;/th&gt;\n&lt;th&gt;Default value&lt;/th&gt;\n&lt;th&gt;Static/&lt;br /&gt;dynamic&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Positive integer&lt;/td&gt;\n&lt;td&gt;16384&lt;/td&gt;\n&lt;td&gt;Dynamic&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Maximum number of jobs within a single YTsaurus operation. It is used only for single-stage map, reduce, merge, and other operations. If &lt;a href=\"en/yql/syntax/pragma/yt.html#datasizeperjob\"&gt;&lt;code&gt;yt.DataSizePerJob&lt;/code&gt;&lt;/a&gt; and &lt;code&gt;yt.MaxJobCount&lt;/code&gt; are both specified, job splitting is done with account for &lt;a href=\"en/yql/syntax/pragma/yt.html#datasizeperjob\"&gt;&lt;code&gt;yt.DataSizePerJob&lt;/code&gt;&lt;/a&gt;, and even if the resulting value &lt;code&gt;N&lt;/code&gt; exceeds &lt;code&gt;yt.MaxJobCount&lt;/code&gt;, &lt;code&gt;N&lt;/code&gt; jobs will be run, and &lt;code&gt;yt.MaxJobCount&lt;/code&gt; will only affect whether the jobs will be split after their number reaches a particular threshold.&lt;/p&gt;\n&lt;h2 id=\"ytuserslots\"&gt;&lt;a href=\"en/yql/syntax/pragma/yt.html#ytuserslots\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;yt.UserSlots&lt;/span&gt;&lt;/a&gt;yt.UserSlots&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Value type&lt;/th&gt;\n&lt;th&gt;Default value&lt;/th&gt;\n&lt;th&gt;Static/&lt;br /&gt;dynamic&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Positive number&lt;/td&gt;\n&lt;td&gt;No limits&lt;/td&gt;\n&lt;td&gt;Dynamic&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Upper limit on the number of concurrent jobs within a MapReduce operation.&lt;/p&gt;\n&lt;h2 id=\"ytdefaultoperationweight\"&gt;&lt;a href=\"en/yql/syntax/pragma/yt.html#ytdefaultoperationweight\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;yt.DefaultOperationWeight&lt;/span&gt;&lt;/a&gt;yt.DefaultOperationWeight&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Value type&lt;/th&gt;\n&lt;th&gt;Default value&lt;/th&gt;\n&lt;th&gt;Static/&lt;br /&gt;dynamic&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Floating-point number&lt;/td&gt;\n&lt;td&gt;1.0&lt;/td&gt;\n&lt;td&gt;Dynamic&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Weight of all launched MapReduce operations in a selected computing pool.&lt;/p&gt;\n&lt;h2 id=\"yttmpfolder\"&gt;&lt;a href=\"en/yql/syntax/pragma/yt.html#yttmpfolder\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;yt.TmpFolder&lt;/span&gt;&lt;/a&gt;yt.TmpFolder&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Value type&lt;/th&gt;\n&lt;th&gt;Default value&lt;/th&gt;\n&lt;th&gt;Static/&lt;br /&gt;dynamic&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;String&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;//tmp/yql/&amp;lt;login&amp;gt;&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Static&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Directory for storing temporary tables and files.&lt;/p&gt;\n&lt;h2 id=\"yttablestmpfolder\"&gt;&lt;a href=\"en/yql/syntax/pragma/yt.html#yttablestmpfolder\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;yt.TablesTmpFolder&lt;/span&gt;&lt;/a&gt;yt.TablesTmpFolder&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Value type&lt;/th&gt;\n&lt;th&gt;Default value&lt;/th&gt;\n&lt;th&gt;Static/&lt;br /&gt;dynamic&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;String&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;//tmp/yql/&amp;lt;login&amp;gt;&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Static&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Directory for storing temporary tables. Takes priority over &lt;code&gt;yt.TmpFolder&lt;/code&gt;.&lt;/p&gt;\n&lt;h2 id=\"yttemptablesttl\"&gt;&lt;a href=\"en/yql/syntax/pragma/yt.html#yttemptablesttl\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;yt.TempTablesTtl&lt;/span&gt;&lt;/a&gt;yt.TempTablesTtl&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Value type&lt;/th&gt;\n&lt;th&gt;Default value&lt;/th&gt;\n&lt;th&gt;Static/&lt;br /&gt;dynamic&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Time interval supporting &lt;code&gt;s/m/h/d&lt;/code&gt; suffixes&lt;/td&gt;\n&lt;td&gt;—&lt;/td&gt;\n&lt;td&gt;Static&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Allows management of TTL for temporary tables. Effective for tables containing a full result, while the other temporary tables are unconditionally removed upon completion of the query regardless of this pragma.&lt;/p&gt;\n&lt;h2 id=\"ytfilecachettl\"&gt;&lt;a href=\"en/yql/syntax/pragma/yt.html#ytfilecachettl\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;yt.FileCacheTtl&lt;/span&gt;&lt;/a&gt;yt.FileCacheTtl&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Value type&lt;/th&gt;\n&lt;th&gt;Default value&lt;/th&gt;\n&lt;th&gt;Static/&lt;br /&gt;dynamic&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Time interval supporting &lt;code&gt;s/m/h/d&lt;/code&gt; suffixes&lt;/td&gt;\n&lt;td&gt;7d&lt;/td&gt;\n&lt;td&gt;Static&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Allows management of TTL for YTsaurus file cache. Value of 0 disables use of TTL for file cache.&lt;/p&gt;\n&lt;h2 id=\"ytintermediateaccount\"&gt;&lt;a href=\"en/yql/syntax/pragma/yt.html#ytintermediateaccount\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;yt.IntermediateAccount&lt;/span&gt;&lt;/a&gt;yt.IntermediateAccount&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Value type&lt;/th&gt;\n&lt;th&gt;Default value&lt;/th&gt;\n&lt;th&gt;Static/&lt;br /&gt;dynamic&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Account name in YTsaurus&lt;/td&gt;\n&lt;td&gt;intermediate&lt;/td&gt;\n&lt;td&gt;Dynamic&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Allows use of your account for intermediate data in a unified MapReduce operation.&lt;/p&gt;\n&lt;p&gt;The common account, which can overflow at an unfortunate time, is the default.&lt;/p&gt;\n&lt;p&gt;If &lt;a href=\"en/yql/syntax/pragma/yt.html#yt.tmpfolder\"&gt;PRAGMA yt.TmpFolder&lt;/a&gt; is set, then instead of the common account you can use the one specified in the temporary directory.&lt;/p&gt;\n&lt;h2 id=\"ytintermediatereplicationfactor\"&gt;&lt;a href=\"en/yql/syntax/pragma/yt.html#ytintermediatereplicationfactor\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;yt.IntermediateReplicationFactor&lt;/span&gt;&lt;/a&gt;yt.IntermediateReplicationFactor&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Value type&lt;/th&gt;\n&lt;th&gt;Default value&lt;/th&gt;\n&lt;th&gt;Static/&lt;br /&gt;dynamic&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;A number from 1 to 10&lt;/td&gt;\n&lt;td&gt;—&lt;/td&gt;\n&lt;td&gt;Dynamic&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Intermediate data replication factor.&lt;/p&gt;\n&lt;h2 id=\"replicationfactor\"&gt;&lt;a href=\"en/yql/syntax/pragma/yt.html#replicationfactor\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;yt.PublishedReplicationFactor / yt.TemporaryReplicationFactor&lt;/span&gt;&lt;/a&gt;yt.PublishedReplicationFactor / yt.TemporaryReplicationFactor&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Value type&lt;/th&gt;\n&lt;th&gt;Default value&lt;/th&gt;\n&lt;th&gt;Static/&lt;br /&gt;dynamic&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;A number from 1 to 10&lt;/td&gt;\n&lt;td&gt;—&lt;/td&gt;\n&lt;td&gt;Dynamic&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Replication factor for tables created through YQL.&lt;/p&gt;\n&lt;p&gt;Tables specified in &lt;a href=\"en/yql/syntax/insert_into.html\"&gt;INSERT INTO&lt;/a&gt; are Published. All other tables are Temporary.&lt;/p&gt;\n&lt;h2 id=\"ytexternaltx\"&gt;&lt;a href=\"en/yql/syntax/pragma/yt.html#ytexternaltx\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;yt.ExternalTx&lt;/span&gt;&lt;/a&gt;yt.ExternalTx&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Value type&lt;/th&gt;\n&lt;th&gt;Default value&lt;/th&gt;\n&lt;th&gt;Static/&lt;br /&gt;dynamic&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;String&lt;/td&gt;\n&lt;td&gt;—&lt;/td&gt;\n&lt;td&gt;Static&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Running an operation in a transaction that has already been launched outside YQL. Its identifier is passed to the value.&lt;/p&gt;\n&lt;p&gt;All directories required for running the query are created in a specified transaction. This may cause conflicts when attempting to write data from two queries with different ExternalTx into a previously non-existent directory.&lt;/p&gt;\n&lt;h2 id=\"ytoptimizefor\"&gt;&lt;a href=\"en/yql/syntax/pragma/yt.html#ytoptimizefor\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;yt.OptimizeFor&lt;/span&gt;&lt;/a&gt;yt.OptimizeFor&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Value type&lt;/th&gt;\n&lt;th&gt;Default value&lt;/th&gt;\n&lt;th&gt;Static/&lt;br /&gt;dynamic&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;String: lookup/scan&lt;/td&gt;\n&lt;td&gt;scan&lt;/td&gt;\n&lt;td&gt;Dynamic&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Controls the &lt;code&gt;optimize_for&lt;/code&gt; attribute for the tables being created.&lt;/p&gt;\n&lt;h2 id=\"compressioncodec\"&gt;&lt;a href=\"en/yql/syntax/pragma/yt.html#compressioncodec\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;yt.PublishedCompressionCodec / yt.TemporaryCompressionCodec&lt;/span&gt;&lt;/a&gt;yt.PublishedCompressionCodec / yt.TemporaryCompressionCodec&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Value type&lt;/th&gt;\n&lt;th&gt;Default value&lt;/th&gt;\n&lt;th&gt;Static/&lt;br /&gt;dynamic&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;String, see the &lt;a href=\"https://ytsaurus.tech/docs/en/user-guide/storage/compression\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;documentation&lt;/a&gt;&lt;/td&gt;\n&lt;td&gt;zstd_5&lt;/td&gt;\n&lt;td&gt;Dynamic&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Compression settings for tables created through YQL.&lt;/p&gt;\n&lt;p&gt;Tables specified in &lt;a href=\"en/yql/syntax/insert_into.html\"&gt;INSERT INTO&lt;/a&gt; are Published. All other tables are Temporary. Also, a codec specified as Temporary is used for intermediate data in a single YTsaurus operation (e.g. unified MapReduce).&lt;/p&gt;\n&lt;h2 id=\"ytpublishederasurecodec-/-yttemporaryerasurecodec\"&gt;&lt;a href=\"en/yql/syntax/pragma/yt.html#ytpublishederasurecodec-/-yttemporaryerasurecodec\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;yt.PublishedErasureCodec / yt.TemporaryErasureCodec&lt;/span&gt;&lt;/a&gt;yt.PublishedErasureCodec / yt.TemporaryErasureCodec&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Value type&lt;/th&gt;\n&lt;th&gt;Default value&lt;/th&gt;\n&lt;th&gt;Static/&lt;br /&gt;dynamic&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;String, see the &lt;a href=\"https://ytsaurus.tech/docs/en/user-guide/storage/replication#erasure\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;documentation&lt;/a&gt;&lt;/td&gt;\n&lt;td&gt;none&lt;/td&gt;\n&lt;td&gt;Dynamic&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Erasure coding is always disabled by default. To enable it, you should use a value of lrc_12_2_2.&lt;/p&gt;\n&lt;p&gt;The difference between Published and Temporary is similar to &lt;a href=\"en/yql/syntax/pragma/yt.html#compressioncodec\"&gt;CompressionCodec&lt;/a&gt;.&lt;/p&gt;\n&lt;h2 id=\"ytnightlycompress\"&gt;&lt;a href=\"en/yql/syntax/pragma/yt.html#ytnightlycompress\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;yt.NightlyCompress&lt;/span&gt;&lt;/a&gt;yt.NightlyCompress&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Value type&lt;/th&gt;\n&lt;th&gt;Default value&lt;/th&gt;\n&lt;th&gt;Static/&lt;br /&gt;dynamic&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Flag&lt;/td&gt;\n&lt;td&gt;-&lt;/td&gt;\n&lt;td&gt;Dynamic&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Manages the &lt;a href=\"https://ytsaurus.tech/docs/en/user-guide/storage/regular-system-processes#nightly_compress\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;background table compression&lt;/a&gt; process so that the tables take up less space.&lt;/p&gt;\n&lt;p&gt;The &lt;code&gt;true&lt;/code&gt; value sets the &lt;code&gt;@force_nightly_compress&lt;/code&gt; attribute equal to &lt;code&gt;true&lt;/code&gt; on the table.&lt;br /&gt;\nThe &lt;code&gt;false&lt;/code&gt; value sets the &lt;code&gt;@nightly_compression_settings&lt;/code&gt; attribute with the &lt;code&gt;enabled&lt;/code&gt; child value equal to &lt;code&gt;false&lt;/code&gt; on the table.&lt;/p&gt;\n&lt;p&gt;The setting applies only to tables newly created by the YQL query (as well as to tables overwritten using &lt;a href=\"en/yql/syntax/pragma/insert_into\"&gt;INSERT INTO ... WITH TRUNCATE&lt;/a&gt;).&lt;br /&gt;\nThe setting doesn't apply to temporary tables.&lt;/p&gt;\n&lt;h2 id=\"ytexpirationdeadline-/-ytexpirationinterval\"&gt;&lt;a href=\"en/yql/syntax/pragma/yt.html#ytexpirationdeadline-/-ytexpirationinterval\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;yt.ExpirationDeadline / yt.ExpirationInterval&lt;/span&gt;&lt;/a&gt;yt.ExpirationDeadline / yt.ExpirationInterval&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Value type&lt;/th&gt;\n&lt;th&gt;Default value&lt;/th&gt;\n&lt;th&gt;Static/&lt;br /&gt;dynamic&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;ExpirationDeadline: point in time in &lt;a href=\"https://en.wikipedia.org/wiki/ISO_8601\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;ISO 8601&lt;/a&gt; format. ExpirationInterval: time interval supporting &lt;code&gt;s/m/h/d&lt;/code&gt; suffixes during which the node shouldn't be accessed.&lt;/td&gt;\n&lt;td&gt;—&lt;/td&gt;\n&lt;td&gt;Dynamic&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Allows management of &lt;a href=\"https://ytsaurus.tech/docs/en/user-guide/storage/cypress#TTL\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;TTL for tables created by the operation&lt;/a&gt;.&lt;/p&gt;\n&lt;h2 id=\"ytmaxrowweight\"&gt;&lt;a href=\"en/yql/syntax/pragma/yt.html#ytmaxrowweight\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;yt.MaxRowWeight&lt;/span&gt;&lt;/a&gt;yt.MaxRowWeight&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Value type&lt;/th&gt;\n&lt;th&gt;Default value&lt;/th&gt;\n&lt;th&gt;Static/&lt;br /&gt;dynamic&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Bytes, up to 128M&lt;/td&gt;\n&lt;td&gt;16M&lt;/td&gt;\n&lt;td&gt;Dynamic&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Increase the maximum table row length limit in yt.&lt;/p&gt;\n&lt;h2 id=\"ytmaxkeyweight\"&gt;&lt;a href=\"en/yql/syntax/pragma/yt.html#ytmaxkeyweight\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;yt.MaxKeyWeight&lt;/span&gt;&lt;/a&gt;yt.MaxKeyWeight&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Value type&lt;/th&gt;\n&lt;th&gt;Default value&lt;/th&gt;\n&lt;th&gt;Static/&lt;br /&gt;dynamic&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Bytes, up to 256K&lt;/td&gt;\n&lt;td&gt;16K&lt;/td&gt;\n&lt;td&gt;Dynamic&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Increase the maximum table key length limit in YTsaurus, based on which the table is sorted.&lt;/p&gt;\n&lt;h2 id=\"ytusetmpfs\"&gt;&lt;a href=\"en/yql/syntax/pragma/yt.html#ytusetmpfs\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;yt.UseTmpfs&lt;/span&gt;&lt;/a&gt;yt.UseTmpfs&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Value type&lt;/th&gt;\n&lt;th&gt;Default value&lt;/th&gt;\n&lt;th&gt;Static/&lt;br /&gt;dynamic&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Flag&lt;/td&gt;\n&lt;td&gt;false&lt;/td&gt;\n&lt;td&gt;Dynamic&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Connects &lt;a href=\"https://en.wikipedia.org/wiki/Tmpfs\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;tmpfs&lt;/a&gt; to the &lt;code&gt;_yql_tmpfs&lt;/code&gt; folder in the sandbox with MapReduce jobs. Its use is not recommended.&lt;/p&gt;\n&lt;h2 id=\"ytextratmpfssize\"&gt;&lt;a href=\"en/yql/syntax/pragma/yt.html#ytextratmpfssize\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;yt.ExtraTmpfsSize&lt;/span&gt;&lt;/a&gt;yt.ExtraTmpfsSize&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Value type&lt;/th&gt;\n&lt;th&gt;Default value&lt;/th&gt;\n&lt;th&gt;Static/&lt;br /&gt;dynamic&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Bytes&lt;/td&gt;\n&lt;td&gt;—&lt;/td&gt;\n&lt;td&gt;Dynamic&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Ability to increase the size of tmpfs in addition to the total size of all expressly used files (specified in megabytes). It can be useful if you create new files in UDF locally. Without &lt;a href=\"en/yql/syntax/pragma/yt.html#yt.usetmpfs\"&gt;UseTmpfs&lt;/a&gt; is ignored.&lt;/p&gt;\n&lt;h2 id=\"ytpooltrees\"&gt;&lt;a href=\"en/yql/syntax/pragma/yt.html#ytpooltrees\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;yt.PoolTrees&lt;/span&gt;&lt;/a&gt;yt.PoolTrees&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Value type&lt;/th&gt;\n&lt;th&gt;Default value&lt;/th&gt;\n&lt;th&gt;Static/&lt;br /&gt;dynamic&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;String containing a list of tree names separated by any of the following symbols: comma, semicolon, space, or `&lt;/td&gt;\n&lt;td&gt;`&lt;/td&gt;\n&lt;td&gt;—&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Ability to select pool trees different from the standard ones.&lt;/p&gt;\n&lt;h2 id=\"yttentativepooltrees\"&gt;&lt;a href=\"en/yql/syntax/pragma/yt.html#yttentativepooltrees\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;yt.TentativePoolTrees&lt;/span&gt;&lt;/a&gt;yt.TentativePoolTrees&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Value type&lt;/th&gt;\n&lt;th&gt;Default value&lt;/th&gt;\n&lt;th&gt;Static/&lt;br /&gt;dynamic&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;String containing a list of tree names separated by any of the following symbols: comma, semicolon, space, or `&lt;/td&gt;\n&lt;td&gt;`&lt;/td&gt;\n&lt;td&gt;—&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Ability to \"gently\" spread operations across pool trees different from the standard ones.&lt;/p&gt;\n&lt;h2 id=\"yttentativetreeeligibilitysamplejobcount\"&gt;&lt;a href=\"en/yql/syntax/pragma/yt.html#yttentativetreeeligibilitysamplejobcount\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;yt.TentativeTreeEligibilitySampleJobCount&lt;/span&gt;&lt;/a&gt;yt.TentativeTreeEligibilitySampleJobCount&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Value type&lt;/th&gt;\n&lt;th&gt;Default value&lt;/th&gt;\n&lt;th&gt;Static/&lt;br /&gt;dynamic&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Positive number&lt;/td&gt;\n&lt;td&gt;—&lt;/td&gt;\n&lt;td&gt;Dynamic&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Effective only when the &lt;code&gt;yt.TentativePoolTrees&lt;/code&gt; pragma is present. Sets the number of jobs in a sample.&lt;/p&gt;\n&lt;h2 id=\"yttentativetreeeligibilitymaxjobdurationratio\"&gt;&lt;a href=\"en/yql/syntax/pragma/yt.html#yttentativetreeeligibilitymaxjobdurationratio\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;yt.TentativeTreeEligibilityMaxJobDurationRatio&lt;/span&gt;&lt;/a&gt;yt.TentativeTreeEligibilityMaxJobDurationRatio&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Value type&lt;/th&gt;\n&lt;th&gt;Default value&lt;/th&gt;\n&lt;th&gt;Static/&lt;br /&gt;dynamic&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Floating-point number&lt;/td&gt;\n&lt;td&gt;—&lt;/td&gt;\n&lt;td&gt;Dynamic&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Effective only when the &lt;code&gt;yt.TentativePoolTrees&lt;/code&gt; pragma is present. Sets the permissible job slowdown factor in an alternative pool tree.&lt;/p&gt;\n&lt;h2 id=\"yttentativetreeeligibilityminjobduration\"&gt;&lt;a href=\"en/yql/syntax/pragma/yt.html#yttentativetreeeligibilityminjobduration\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;yt.TentativeTreeEligibilityMinJobDuration&lt;/span&gt;&lt;/a&gt;yt.TentativeTreeEligibilityMinJobDuration&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Value type&lt;/th&gt;\n&lt;th&gt;Default value&lt;/th&gt;\n&lt;th&gt;Static/&lt;br /&gt;dynamic&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Milliseconds&lt;/td&gt;\n&lt;td&gt;—&lt;/td&gt;\n&lt;td&gt;Dynamic&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Effective only when the &lt;code&gt;yt.TentativePoolTrees&lt;/code&gt; pragma is present. Sets the minimum average job duration in an alternative pool tree.&lt;/p&gt;\n&lt;h2 id=\"ytusedefaulttentativepooltrees\"&gt;&lt;a href=\"en/yql/syntax/pragma/yt.html#ytusedefaulttentativepooltrees\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;yt.UseDefaultTentativePoolTrees&lt;/span&gt;&lt;/a&gt;yt.UseDefaultTentativePoolTrees&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Value type&lt;/th&gt;\n&lt;th&gt;Default value&lt;/th&gt;\n&lt;th&gt;Static/&lt;br /&gt;dynamic&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Flag&lt;/td&gt;\n&lt;td&gt;—&lt;/td&gt;\n&lt;td&gt;Dynamic&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Sets the value for the &lt;code&gt;use_default_tentative_pool_trees&lt;/code&gt; option in the operation spec.&lt;/p&gt;\n&lt;h2 id=\"querycache\"&gt;&lt;a href=\"en/yql/syntax/pragma/yt.html#querycache\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;yt.QueryCacheMode&lt;/span&gt;&lt;/a&gt;yt.QueryCacheMode&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Value type&lt;/th&gt;\n&lt;th&gt;Default value&lt;/th&gt;\n&lt;th&gt;Static/&lt;br /&gt;dynamic&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;String: disable / readonly / refresh / normal&lt;/td&gt;\n&lt;td&gt;normal&lt;/td&gt;\n&lt;td&gt;Static&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Cache operates at the level of MapReduce operations:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Cache is disabled in &lt;strong&gt;disable&lt;/strong&gt; mode.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;readonly&lt;/strong&gt; — read permissions only. No writes allowed.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;refresh&lt;/strong&gt; — write-only. No reads are allowed. A query error is generated if an error occurs during parallel write to the cache from another transaction.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;normal&lt;/strong&gt; — read and write permissions. If an error occurs during parallel write to the cache from another transaction, assume that the same data was written and continue your work.&lt;br /&gt;\nIn &lt;strong&gt;normal&lt;/strong&gt; and &lt;strong&gt;refresh&lt;/strong&gt; mode, the output for each operation is additionally stored in &lt;code&gt;//&amp;lt;tmp_folder&amp;gt;/query_cache/&amp;lt;hash&amp;gt;&lt;/code&gt;, where:&lt;/li&gt;\n&lt;li&gt;tmp_folder — defaults to &lt;code&gt;tmp/&amp;lt;login&amp;gt;&lt;/code&gt; or &lt;a href=\"en/yql/syntax/pragma/yt.html#yt.tmpfolder\"&gt;PRAGMA yt.TmpFolder&lt;/a&gt; value;&lt;/li&gt;\n&lt;li&gt;hash — hash of input tables' meaningful metadata and the logical program that ran in the operation.&lt;br /&gt;\nIn &lt;strong&gt;normal&lt;/strong&gt; and &lt;strong&gt;readonly&lt;/strong&gt; mode, this path is calculated for the MapReduce operation just before its launch. Depending on the selected caching mode, the operation may either be launched or instantly marked as successful using the prepared table instead of its outcome. If an expression contains nondeterministic functions like Random/RandomNumber/RandomUuid/CurrentUtcDate/CurrentUtcDatetime/CurrentUtcTimestamp, the cache for this operation is disabled. All UDFs are currently considered deterministic, meaning they don't interfere with caching. If a non-deterministic UDF must be used, you should specify an additional Uint64-type argument and pass &lt;code&gt;CurentUtcTimestamp()&lt;/code&gt; to it. Use of arguments is not mandatory in this case.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"ytquerycacheignoretablerevision\"&gt;&lt;a href=\"en/yql/syntax/pragma/yt.html#ytquerycacheignoretablerevision\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;yt.QueryCacheIgnoreTableRevision&lt;/span&gt;&lt;/a&gt;yt.QueryCacheIgnoreTableRevision&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Value type&lt;/th&gt;\n&lt;th&gt;Default value&lt;/th&gt;\n&lt;th&gt;Static/&lt;br /&gt;dynamic&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Flag&lt;/td&gt;\n&lt;td&gt;false&lt;/td&gt;\n&lt;td&gt;Static&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;If the flag is set, YTsaurus &lt;a href=\"https://ytsaurus.tech/docs/en/user-guide/storage/cypress\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;revision is excluded from metadata during hash calculation&lt;/a&gt;. Therefore, QueryCache is not invalidated when modifying input table contents.&lt;/p&gt;\n&lt;p&gt;The mode is primarily intended for speeding up the complex queries debugging process in large, modifiable tables where query logic can't ignore these modifications.&lt;/p&gt;\n&lt;h2 id=\"ytquerycachesalt\"&gt;&lt;a href=\"en/yql/syntax/pragma/yt.html#ytquerycachesalt\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;yt.QueryCacheSalt&lt;/span&gt;&lt;/a&gt;yt.QueryCacheSalt&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Value type&lt;/th&gt;\n&lt;th&gt;Default value&lt;/th&gt;\n&lt;th&gt;Static/&lt;br /&gt;dynamic&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Random string&lt;/td&gt;\n&lt;td&gt;—&lt;/td&gt;\n&lt;td&gt;Static&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Salt to be mixed into the hash values calculation process for the query cache&lt;/p&gt;\n&lt;h2 id=\"ytquerycachettl\"&gt;&lt;a href=\"en/yql/syntax/pragma/yt.html#ytquerycachettl\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;yt.QueryCacheTtl&lt;/span&gt;&lt;/a&gt;yt.QueryCacheTtl&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Value type&lt;/th&gt;\n&lt;th&gt;Default value&lt;/th&gt;\n&lt;th&gt;Static/&lt;br /&gt;dynamic&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Time interval supporting &lt;code&gt;s/m/h/d&lt;/code&gt; suffixes that counts from table creation time in the query cache or from the time of last table use.&lt;/td&gt;\n&lt;td&gt;7d&lt;/td&gt;\n&lt;td&gt;Static&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Allows management of &lt;a href=\"https://ytsaurus.tech/docs/en/user-guide/storage/cypress\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;TTL for tables created by the operation in the query cache&lt;/a&gt;.&lt;/p&gt;\n&lt;h2 id=\"ytautomerge-/-yttemporaryautomerge-/-ytpublishedautomerge\"&gt;&lt;a href=\"en/yql/syntax/pragma/yt.html#ytautomerge-/-yttemporaryautomerge-/-ytpublishedautomerge\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;yt.AutoMerge / yt.TemporaryAutoMerge / yt.PublishedAutoMerge&lt;/span&gt;&lt;/a&gt;yt.AutoMerge / yt.TemporaryAutoMerge / yt.PublishedAutoMerge&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Value type&lt;/th&gt;\n&lt;th&gt;Default value&lt;/th&gt;\n&lt;th&gt;Static/&lt;br /&gt;dynamic&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;String: relaxed/economy/disabled&lt;/td&gt;\n&lt;td&gt;relaxed&lt;/td&gt;\n&lt;td&gt;Dynamic&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Management of the &lt;a href=\"https://ytsaurus.tech/docs/en/user-guide/data-processing/operations/automerge\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;same-named settingYTsaurus&lt;/a&gt; that helps reduce the utilization quota for chunk quantity. &lt;code&gt;yt.TemporaryAutoMerge&lt;/code&gt; is valid for all YT operations except for merge inside the YtPublish node.&lt;/p&gt;\n&lt;p&gt;&lt;code&gt;yt.PublishedAutoMerge&lt;/code&gt; is only valid for merge inside the YtPublish node (if it's launched there). &lt;code&gt;yt.AutoMerge&lt;/code&gt; sets the value for this setting simultaneously for all YTsaurus query operations.&lt;/p&gt;\n&lt;h2 id=\"ytscriptcpu\"&gt;&lt;a href=\"en/yql/syntax/pragma/yt.html#ytscriptcpu\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;yt.ScriptCpu&lt;/span&gt;&lt;/a&gt;yt.ScriptCpu&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Value type&lt;/th&gt;\n&lt;th&gt;Default value&lt;/th&gt;\n&lt;th&gt;Static/&lt;br /&gt;dynamic&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Floating point number, minimum 1.0&lt;/td&gt;\n&lt;td&gt;1.0&lt;/td&gt;\n&lt;td&gt;Dynamic&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Multiplier for evaluating utilization of the script UDF processor (including Python UDF and JavaScript UDF). Affects splitting of MapReduce operations to jobs. May be redefined with special-purpose &lt;code&gt;yt.PythonCpu&lt;/code&gt; / &lt;code&gt;yt.JavascriptCpu&lt;/code&gt; pragmas for a specific UDF type.&lt;/p&gt;\n&lt;h2 id=\"ytpythoncpu-/-ytjavascriptcpu\"&gt;&lt;a href=\"en/yql/syntax/pragma/yt.html#ytpythoncpu-/-ytjavascriptcpu\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;yt.PythonCpu / yt.JavascriptCpu&lt;/span&gt;&lt;/a&gt;yt.PythonCpu / yt.JavascriptCpu&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Value type&lt;/th&gt;\n&lt;th&gt;Default value&lt;/th&gt;\n&lt;th&gt;Static/&lt;br /&gt;dynamic&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Floating point number, minimum 1.0&lt;/td&gt;\n&lt;td&gt;4.0&lt;/td&gt;\n&lt;td&gt;Dynamic&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Multiplier for evaluating utilization of the Python UDF and JavaScript UDF processors, respectively. Affects splitting of MapReduce operations into jobs.&lt;/p&gt;\n&lt;h2 id=\"yterasurecodeccpu\"&gt;&lt;a href=\"en/yql/syntax/pragma/yt.html#yterasurecodeccpu\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;yt.ErasureCodecCpu&lt;/span&gt;&lt;/a&gt;yt.ErasureCodecCpu&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Value type&lt;/th&gt;\n&lt;th&gt;Default value&lt;/th&gt;\n&lt;th&gt;Static/&lt;br /&gt;dynamic&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Floating point number, minimum 1.0&lt;/td&gt;\n&lt;td&gt;1.0&lt;/td&gt;\n&lt;td&gt;Dynamic&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Multiplier for evaluating utilization of the processor used for processing tables compressed with the erasure codec. Affects splitting of MapReduce operations to jobs.&lt;/p&gt;\n&lt;h2 id=\"ytreleasetempdata\"&gt;&lt;a href=\"en/yql/syntax/pragma/yt.html#ytreleasetempdata\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;yt.ReleaseTempData&lt;/span&gt;&lt;/a&gt;yt.ReleaseTempData&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Value type&lt;/th&gt;\n&lt;th&gt;Default value&lt;/th&gt;\n&lt;th&gt;Static/&lt;br /&gt;dynamic&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;String: immediate/finish/never&lt;/td&gt;\n&lt;td&gt;immediate&lt;/td&gt;\n&lt;td&gt;Static&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Allows management of the removal time of temporary objects (e.g. tables) created when running the query:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;immediate&lt;/code&gt; — remove objects as soon as they're no longer required.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;finish&lt;/code&gt; — remove after running the entire YQL query.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;never&lt;/code&gt; — never remove.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"ytcoredumppath\"&gt;&lt;a href=\"en/yql/syntax/pragma/yt.html#ytcoredumppath\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;yt.CoreDumpPath&lt;/span&gt;&lt;/a&gt;yt.CoreDumpPath&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Value type&lt;/th&gt;\n&lt;th&gt;Default value&lt;/th&gt;\n&lt;th&gt;Static/&lt;br /&gt;dynamic&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Path on cluster&lt;/td&gt;\n&lt;td&gt;—&lt;/td&gt;\n&lt;td&gt;Static&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Allows the &lt;a href=\"https://en.wikipedia.org/wiki/Core_dump\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;coredump&lt;/a&gt; of dropped jobs for MapReduce operations to be saved to a separate table.&lt;/p&gt;\n&lt;h2 id=\"ytmaxinputtables\"&gt;&lt;a href=\"en/yql/syntax/pragma/yt.html#ytmaxinputtables\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;yt.MaxInputTables&lt;/span&gt;&lt;/a&gt;yt.MaxInputTables&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Value type&lt;/th&gt;\n&lt;th&gt;Default value&lt;/th&gt;\n&lt;th&gt;Static/&lt;br /&gt;dynamic&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Positive number&lt;/td&gt;\n&lt;td&gt;1000&lt;/td&gt;\n&lt;td&gt;Static&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Limit of the number of delivered input tables for each specific MapReduce operation.&lt;/p&gt;\n&lt;h2 id=\"ytmaxinputtablesforsortedmerge\"&gt;&lt;a href=\"en/yql/syntax/pragma/yt.html#ytmaxinputtablesforsortedmerge\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;yt.MaxInputTablesForSortedMerge&lt;/span&gt;&lt;/a&gt;yt.MaxInputTablesForSortedMerge&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Value type&lt;/th&gt;\n&lt;th&gt;Default value&lt;/th&gt;\n&lt;th&gt;Static/&lt;br /&gt;dynamic&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Positive number&lt;/td&gt;\n&lt;td&gt;100&lt;/td&gt;\n&lt;td&gt;Static&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Limit of the number of delivered input tables for a sorted merge operation.&lt;/p&gt;\n&lt;h2 id=\"ytmaxoutputtables\"&gt;&lt;a href=\"en/yql/syntax/pragma/yt.html#ytmaxoutputtables\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;yt.MaxOutputTables&lt;/span&gt;&lt;/a&gt;yt.MaxOutputTables&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Value type&lt;/th&gt;\n&lt;th&gt;Default value&lt;/th&gt;\n&lt;th&gt;Static/&lt;br /&gt;dynamic&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Number from 1 to 100&lt;/td&gt;\n&lt;td&gt;50&lt;/td&gt;\n&lt;td&gt;Static&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Limit of the number of output tables for each specific MapReduce operation.&lt;/p&gt;\n&lt;h2 id=\"ytjoincollectcolumnarstatistics\"&gt;&lt;a href=\"en/yql/syntax/pragma/yt.html#ytjoincollectcolumnarstatistics\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;yt.JoinCollectColumnarStatistics&lt;/span&gt;&lt;/a&gt;yt.JoinCollectColumnarStatistics&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Value type&lt;/th&gt;\n&lt;th&gt;Default value&lt;/th&gt;\n&lt;th&gt;Static/&lt;br /&gt;dynamic&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;String: disable/sync/async&lt;/td&gt;\n&lt;td&gt;async&lt;/td&gt;\n&lt;td&gt;Static&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Manages the use of columnar statistics in order to precisely evaluate JOIN inputs and select the optimal strategy. Async includes the asynchronous columnar statistics collection mode.&lt;/p&gt;\n&lt;h2 id=\"ytjoincolumnarstatisticsfetchermode\"&gt;&lt;a href=\"en/yql/syntax/pragma/yt.html#ytjoincolumnarstatisticsfetchermode\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;yt.JoinColumnarStatisticsFetcherMode&lt;/span&gt;&lt;/a&gt;yt.JoinColumnarStatisticsFetcherMode&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Value type&lt;/th&gt;\n&lt;th&gt;Default value&lt;/th&gt;\n&lt;th&gt;Static/&lt;br /&gt;dynamic&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;String: from_nodes/from_master/fallback&lt;/td&gt;\n&lt;td&gt;fallback&lt;/td&gt;\n&lt;td&gt;Static&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Manages the columnar statistics query mode in order to precisely evaluate JOIN inputs from YTsaurus. From_nodesmode ensures precise evaluation but may fail to fit timeouts for large tables. From_master mode works very fast but provides simplified statistics. Fallback mode works as a combination of the previous two.&lt;/p&gt;\n&lt;h2 id=\"ytmapjoinlimit\"&gt;&lt;a href=\"en/yql/syntax/pragma/yt.html#ytmapjoinlimit\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;yt.MapJoinLimit&lt;/span&gt;&lt;/a&gt;yt.MapJoinLimit&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Value type&lt;/th&gt;\n&lt;th&gt;Default value&lt;/th&gt;\n&lt;th&gt;Static/&lt;br /&gt;dynamic&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Bytes&lt;/td&gt;\n&lt;td&gt;2048M&lt;/td&gt;\n&lt;td&gt;Static&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Limit of a smaller table in JOIN, which ensures the Map-side strategy (creating a dictionary in the memory based on the smaller table and using it in the Map for a larger one).&lt;/p&gt;\n&lt;p&gt;You can disable the strategy completely by specifying 0 as the value.&lt;/p&gt;\n&lt;h2 id=\"ytmapjoinshardcount\"&gt;&lt;a href=\"en/yql/syntax/pragma/yt.html#ytmapjoinshardcount\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;yt.MapJoinShardCount&lt;/span&gt;&lt;/a&gt;yt.MapJoinShardCount&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Value type&lt;/th&gt;\n&lt;th&gt;Default value&lt;/th&gt;\n&lt;th&gt;Static/&lt;br /&gt;dynamic&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;A number from 1 to 10&lt;/td&gt;\n&lt;td&gt;4&lt;/td&gt;\n&lt;td&gt;Static&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Map-side JOIN strategy may run in a sharded manner. The smaller side is split into N shards (where N is less than or equal to the value of this PRAGMA), and all shards are independently and simultaneously joined with the larger side. Thus, concatenation of JOIN with shards is considered to be the outcome of JOIN.&lt;/p&gt;\n&lt;h2 id=\"ytmapjoinshardminrows\"&gt;&lt;a href=\"en/yql/syntax/pragma/yt.html#ytmapjoinshardminrows\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;yt.MapJoinShardMinRows&lt;/span&gt;&lt;/a&gt;yt.MapJoinShardMinRows&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Value type&lt;/th&gt;\n&lt;th&gt;Default value&lt;/th&gt;\n&lt;th&gt;Static/&lt;br /&gt;dynamic&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Positive number&lt;/td&gt;\n&lt;td&gt;1&lt;/td&gt;\n&lt;td&gt;Static&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Minimum number of writes to the shard in map-side JOIN strategy.&lt;/p&gt;\n&lt;h2 id=\"ytjoinmergetableslimit\"&gt;&lt;a href=\"en/yql/syntax/pragma/yt.html#ytjoinmergetableslimit\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;yt.JoinMergeTablesLimit&lt;/span&gt;&lt;/a&gt;yt.JoinMergeTablesLimit&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Value type&lt;/th&gt;\n&lt;th&gt;Default value&lt;/th&gt;\n&lt;th&gt;Static/&lt;br /&gt;dynamic&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Positive number&lt;/td&gt;\n&lt;td&gt;64&lt;/td&gt;\n&lt;td&gt;Static&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Total permissible number of tables in the left and right sides for enabling Ordered JOIN strategy.&lt;/p&gt;\n&lt;p&gt;You can disable the strategy completely by specifying 0 as the value.&lt;/p&gt;\n&lt;h2 id=\"ytjoinmergeusesmallasprimary\"&gt;&lt;a href=\"en/yql/syntax/pragma/yt.html#ytjoinmergeusesmallasprimary\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;yt.JoinMergeUseSmallAsPrimary&lt;/span&gt;&lt;/a&gt;yt.JoinMergeUseSmallAsPrimary&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Value type&lt;/th&gt;\n&lt;th&gt;Default value&lt;/th&gt;\n&lt;th&gt;Static/&lt;br /&gt;dynamic&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Flag&lt;/td&gt;\n&lt;td&gt;-&lt;/td&gt;\n&lt;td&gt;Static&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Explicit management in selecting the primary table in a Reduce operation with the Ordered JOIN strategy. If the value is set as True, then the smaller side will always be selected as the primary table. If the flag value is False, the larger side will be selected, except when unique keys are available on the larger side. Selecting a larger table as the primary table is safe, even if the table contains monster keys. However, it will run slower. If this pragma isn't set, the primary table is selected automatically based on the maximum size of the resulting jobs (see yt.JoinMergeReduceJobMaxSize).&lt;/p&gt;\n&lt;h2 id=\"ytjoinmergereducejobmaxsize\"&gt;&lt;a href=\"en/yql/syntax/pragma/yt.html#ytjoinmergereducejobmaxsize\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;yt.JoinMergeReduceJobMaxSize&lt;/span&gt;&lt;/a&gt;yt.JoinMergeReduceJobMaxSize&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Value type&lt;/th&gt;\n&lt;th&gt;Default value&lt;/th&gt;\n&lt;th&gt;Static/&lt;br /&gt;dynamic&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Bytes&lt;/td&gt;\n&lt;td&gt;8G&lt;/td&gt;\n&lt;td&gt;Static&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Maximum acceptable size of Reduce job when selecting a small table as the primary table with the Ordered JOIN strategy. If the resulting size exceeds the specified value, the Reduce operation is repeated for the larger table as the primary table.&lt;/p&gt;\n&lt;h2 id=\"ytjoinmergeunsortedfactor\"&gt;&lt;a href=\"en/yql/syntax/pragma/yt.html#ytjoinmergeunsortedfactor\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;yt.JoinMergeUnsortedFactor&lt;/span&gt;&lt;/a&gt;yt.JoinMergeUnsortedFactor&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Value type&lt;/th&gt;\n&lt;th&gt;Default value&lt;/th&gt;\n&lt;th&gt;Static/&lt;br /&gt;dynamic&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Positive floating point number&lt;/td&gt;\n&lt;td&gt;0.2&lt;/td&gt;\n&lt;td&gt;Static&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Minimum ratio of the unsorted JOIN side to the sorted one for its additional sorting and selection of the Ordered JOIN strategy.&lt;/p&gt;\n&lt;h2 id=\"ytjoinmergeforce\"&gt;&lt;a href=\"en/yql/syntax/pragma/yt.html#ytjoinmergeforce\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;yt.JoinMergeForce&lt;/span&gt;&lt;/a&gt;yt.JoinMergeForce&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Value type&lt;/th&gt;\n&lt;th&gt;Default value&lt;/th&gt;\n&lt;th&gt;Static/&lt;br /&gt;dynamic&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Flag&lt;/td&gt;\n&lt;td&gt;-&lt;/td&gt;\n&lt;td&gt;Static&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Forces selection of the Ordered JOIN strategy. If the flag is set to True, the Ordered JOIN strategy is selected even if a single JOIN side or both JOIN sides are unsorted. In this case, unsorted sides are pre-sorted. The maximum size of the unsorted table (see &lt;code&gt;yt.JoinMergeUnsortedFactor&lt;/code&gt;) is unlimited in this case.&lt;/p&gt;\n&lt;h2 id=\"ytjoinallowcolumnrenames\"&gt;&lt;a href=\"en/yql/syntax/pragma/yt.html#ytjoinallowcolumnrenames\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;yt.JoinAllowColumnRenames&lt;/span&gt;&lt;/a&gt;yt.JoinAllowColumnRenames&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Value type&lt;/th&gt;\n&lt;th&gt;Default value&lt;/th&gt;\n&lt;th&gt;Static/&lt;br /&gt;dynamic&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Flag&lt;/td&gt;\n&lt;td&gt;true&lt;/td&gt;\n&lt;td&gt;Static&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Enables column renaming when executing the Ordered JOIN strategy (&lt;a href=\"https://ytsaurus.tech/docs/en/user-guide/data-processing/operations/operations-options#path_attributes\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;rename_columns&lt;/a&gt; attribute is used). If the option is disabled, then the Ordered JOIN strategy is selected only when the left and right column names match.&lt;/p&gt;\n&lt;h2 id=\"ytusecolumnarstatistics\"&gt;&lt;a href=\"en/yql/syntax/pragma/yt.html#ytusecolumnarstatistics\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;yt.UseColumnarStatistics&lt;/span&gt;&lt;/a&gt;yt.UseColumnarStatistics&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Value type&lt;/th&gt;\n&lt;th&gt;Default value&lt;/th&gt;\n&lt;th&gt;Static/&lt;br /&gt;dynamic&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;String: disable/auto/force/0 (=disable)/1 (=force)&lt;/td&gt;\n&lt;td&gt;force&lt;/td&gt;\n&lt;td&gt;Dynamic&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Includes the use of columnar statistics to precisely evaluate job sizes when launching operations on top of the tables containing columnar data selections. See the &lt;a href=\"https://ytsaurus.tech/docs/en/user-guide/data-processing/operations/operations-options#common_options\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;documentation&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;Auto mode automatically disables the use of statistics for operations that use tables with &lt;code&gt;optimize_for=lookup&lt;/code&gt; as input.&lt;/p&gt;\n&lt;h2 id=\"ytminpublishedavgchunksize\"&gt;&lt;a href=\"en/yql/syntax/pragma/yt.html#ytminpublishedavgchunksize\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;yt.MinPublishedAvgChunkSize&lt;/span&gt;&lt;/a&gt;yt.MinPublishedAvgChunkSize&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Value type&lt;/th&gt;\n&lt;th&gt;Default value&lt;/th&gt;\n&lt;th&gt;Static/&lt;br /&gt;dynamic&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Bytes&lt;/td&gt;\n&lt;td&gt;—&lt;/td&gt;\n&lt;td&gt;Static&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;If the average chunk size in the resulting output table is smaller than the specified setting, launch an additional YTsaurus Merge operation to enlarges the chunks to reach the specified size. The value of 0 has a special meaning, causing merge to always launch and enlarge the chunks up to 1G.&lt;/p&gt;\n&lt;p&gt;If the table uses the compression codec, then the chunk output size may differ from the specified one by the compression factor value. Essentially, this pragma sets the data size per merge job. The output size may be significantly smaller after compression. In this case, you should increase the pragma value by the expected compression factor value.&lt;/p&gt;\n&lt;h2 id=\"ytmintempavgchunksize\"&gt;&lt;a href=\"en/yql/syntax/pragma/yt.html#ytmintempavgchunksize\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;yt.MinTempAvgChunkSize&lt;/span&gt;&lt;/a&gt;yt.MinTempAvgChunkSize&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Value type&lt;/th&gt;\n&lt;th&gt;Default value&lt;/th&gt;\n&lt;th&gt;Static/&lt;br /&gt;dynamic&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Bytes&lt;/td&gt;\n&lt;td&gt;—&lt;/td&gt;\n&lt;td&gt;Static&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;The setting is similar to &lt;code&gt;yt.MinPublishedAvgChunkSize&lt;/code&gt;, but it works for intermediate temporary tables.&lt;/p&gt;\n&lt;h2 id=\"yttablecontentdeliverymode\"&gt;&lt;a href=\"en/yql/syntax/pragma/yt.html#yttablecontentdeliverymode\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;yt.TableContentDeliveryMode&lt;/span&gt;&lt;/a&gt;yt.TableContentDeliveryMode&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Value type&lt;/th&gt;\n&lt;th&gt;Default value&lt;/th&gt;\n&lt;th&gt;Static/&lt;br /&gt;dynamic&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;String: native/file&lt;/td&gt;\n&lt;td&gt;native&lt;/td&gt;\n&lt;td&gt;Dynamic&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;If the native value is set, then the table contents are delivered to jobs via native YTsaurus mechanisms. If the file value is set, the table contents are first downloaded to the YQL server and then delivered to jobs as a regular file.&lt;/p&gt;\n&lt;h2 id=\"yttablecontentmaxchunksfornativedelivery\"&gt;&lt;a href=\"en/yql/syntax/pragma/yt.html#yttablecontentmaxchunksfornativedelivery\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;yt.TableContentMaxChunksForNativeDelivery&lt;/span&gt;&lt;/a&gt;yt.TableContentMaxChunksForNativeDelivery&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Value type&lt;/th&gt;\n&lt;th&gt;Default value&lt;/th&gt;\n&lt;th&gt;Static/&lt;br /&gt;dynamic&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Positive number, up to and including 1,000&lt;/td&gt;\n&lt;td&gt;1000&lt;/td&gt;\n&lt;td&gt;Static&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Maximum number of chunks in the table for it to be delivered to jobs via native YTsaurus mechanisms. If this number is exceeded, the table is delivered via a file.&lt;/p&gt;\n&lt;h2 id=\"yttablecontentcompresslevel\"&gt;&lt;a href=\"en/yql/syntax/pragma/yt.html#yttablecontentcompresslevel\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;yt.TableContentCompressLevel&lt;/span&gt;&lt;/a&gt;yt.TableContentCompressLevel&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Value type&lt;/th&gt;\n&lt;th&gt;Default value&lt;/th&gt;\n&lt;th&gt;Static/&lt;br /&gt;dynamic&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Positive number, up to and including 11&lt;/td&gt;\n&lt;td&gt;8&lt;/td&gt;\n&lt;td&gt;Dynamic&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Setting the compression level for the table contents delivered via a file (if yt.TableContentDeliveryMode=\"file\").&lt;/p&gt;\n&lt;h2 id=\"yttablecontenttmpfolder\"&gt;&lt;a href=\"en/yql/syntax/pragma/yt.html#yttablecontenttmpfolder\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;yt.TableContentTmpFolder&lt;/span&gt;&lt;/a&gt;yt.TableContentTmpFolder&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Value type&lt;/th&gt;\n&lt;th&gt;Default value&lt;/th&gt;\n&lt;th&gt;Static/&lt;br /&gt;dynamic&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Path on cluster&lt;/td&gt;\n&lt;td&gt;—&lt;/td&gt;\n&lt;td&gt;Dynamic&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Directory where temporary files for tables delivered via file (if yt.TableContentDeliveryMode=\"file\") will be added. If not set, then the standard YTsaurus file cache is used.&lt;/p&gt;\n&lt;h2 id=\"yttablecontentminavgchunksize\"&gt;&lt;a href=\"en/yql/syntax/pragma/yt.html#yttablecontentminavgchunksize\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;yt.TableContentMinAvgChunkSize&lt;/span&gt;&lt;/a&gt;yt.TableContentMinAvgChunkSize&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Value type&lt;/th&gt;\n&lt;th&gt;Default value&lt;/th&gt;\n&lt;th&gt;Static/&lt;br /&gt;dynamic&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Bytes&lt;/td&gt;\n&lt;td&gt;1GB&lt;/td&gt;\n&lt;td&gt;Static&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Minimum average size of chunks in the table for it to be delivered to jobs via native YTsaurus mechanisms. If the chunk size isn't large enough, then preliminary merge is inserted.&lt;/p&gt;\n&lt;h2 id=\"yttablecontentmaxinputtables\"&gt;&lt;a href=\"en/yql/syntax/pragma/yt.html#yttablecontentmaxinputtables\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;yt.TableContentMaxInputTables&lt;/span&gt;&lt;/a&gt;yt.TableContentMaxInputTables&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Value type&lt;/th&gt;\n&lt;th&gt;Default value&lt;/th&gt;\n&lt;th&gt;Static/&lt;br /&gt;dynamic&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Positive number, up to and including 1,000&lt;/td&gt;\n&lt;td&gt;1000&lt;/td&gt;\n&lt;td&gt;Static&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Maximum number of tables for delivery to jobs via native YTsaurus mechanisms. If this number is exceeded, then preliminary merge is inserted.&lt;/p&gt;\n&lt;h2 id=\"yttablecontentuseskiff\"&gt;&lt;a href=\"en/yql/syntax/pragma/yt.html#yttablecontentuseskiff\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;yt.TableContentUseSkiff&lt;/span&gt;&lt;/a&gt;yt.TableContentUseSkiff&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Value type&lt;/th&gt;\n&lt;th&gt;Default value&lt;/th&gt;\n&lt;th&gt;Static/&lt;br /&gt;dynamic&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Flag&lt;/td&gt;\n&lt;td&gt;true&lt;/td&gt;\n&lt;td&gt;Dynamic&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Enables the skiff format for delivering the table to operation jobs.&lt;/p&gt;\n&lt;h2 id=\"ytlayerpaths\"&gt;&lt;a href=\"en/yql/syntax/pragma/yt.html#ytlayerpaths\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;yt.LayerPaths&lt;/span&gt;&lt;/a&gt;yt.LayerPaths&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Value type&lt;/th&gt;\n&lt;th&gt;Default value&lt;/th&gt;\n&lt;th&gt;Static/&lt;br /&gt;dynamic&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;String containing the list of paths to porto layers separated by any of the following symbols: comma, semicolon, space, or `&lt;/td&gt;\n&lt;td&gt;`&lt;/td&gt;\n&lt;td&gt;—&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Ability to specify the sequence of porto layers in order to create an environment for executing custom jobs.&lt;/p&gt;\n&lt;h2 id=\"ytuseskiff\"&gt;&lt;a href=\"en/yql/syntax/pragma/yt.html#ytuseskiff\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;yt.UseSkiff&lt;/span&gt;&lt;/a&gt;yt.UseSkiff&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Value type&lt;/th&gt;\n&lt;th&gt;Default value&lt;/th&gt;\n&lt;th&gt;Static/&lt;br /&gt;dynamic&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Flag&lt;/td&gt;\n&lt;td&gt;true&lt;/td&gt;\n&lt;td&gt;Dynamic&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Enables the skiff format for inputting and outputting in operation jobs.&lt;/p&gt;\n&lt;h2 id=\"ytdefaultcalcmemorylimit\"&gt;&lt;a href=\"en/yql/syntax/pragma/yt.html#ytdefaultcalcmemorylimit\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;yt.DefaultCalcMemoryLimit&lt;/span&gt;&lt;/a&gt;yt.DefaultCalcMemoryLimit&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Value type&lt;/th&gt;\n&lt;th&gt;Default value&lt;/th&gt;\n&lt;th&gt;Static/&lt;br /&gt;dynamic&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Bytes&lt;/td&gt;\n&lt;td&gt;1G&lt;/td&gt;\n&lt;td&gt;Static&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Limit on memory utilization for calculations that aren't related to table access.&lt;/p&gt;\n&lt;p&gt;You can use K, M, and G suffixes to specify values in kilobytes, megabytes, and gigabytes, respectively.&lt;/p&gt;\n&lt;h2 id=\"ytparalleloperationslimit\"&gt;&lt;a href=\"en/yql/syntax/pragma/yt.html#ytparalleloperationslimit\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;yt.ParallelOperationsLimit&lt;/span&gt;&lt;/a&gt;yt.ParallelOperationsLimit&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Value type&lt;/th&gt;\n&lt;th&gt;Default value&lt;/th&gt;\n&lt;th&gt;Static/&lt;br /&gt;dynamic&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Number, minimum 1&lt;/td&gt;\n&lt;td&gt;16&lt;/td&gt;\n&lt;td&gt;Static&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Sets the maximum number of concurrently launched YTsaurus operations in a query.&lt;/p&gt;\n&lt;h2 id=\"ytdefaultcluster\"&gt;&lt;a href=\"en/yql/syntax/pragma/yt.html#ytdefaultcluster\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;yt.DefaultCluster&lt;/span&gt;&lt;/a&gt;yt.DefaultCluster&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Value type&lt;/th&gt;\n&lt;th&gt;Default value&lt;/th&gt;\n&lt;th&gt;Static/&lt;br /&gt;dynamic&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;String&lt;/td&gt;\n&lt;td&gt;hahn&lt;/td&gt;\n&lt;td&gt;Static&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Sets the default cluster for performing computations that aren't related to table access.&lt;/p&gt;\n&lt;h2 id=\"ytdefaultmemoryreservefactor\"&gt;&lt;a href=\"en/yql/syntax/pragma/yt.html#ytdefaultmemoryreservefactor\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;yt.DefaultMemoryReserveFactor&lt;/span&gt;&lt;/a&gt;yt.DefaultMemoryReserveFactor&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Value type&lt;/th&gt;\n&lt;th&gt;Default value&lt;/th&gt;\n&lt;th&gt;Static/&lt;br /&gt;dynamic&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Floating point number from 0.0 to 1.0&lt;/td&gt;\n&lt;td&gt;—&lt;/td&gt;\n&lt;td&gt;Dynamic&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Sets the job memory reservation factor. See the &lt;a href=\"https://ytsaurus.tech/docs/en/user-guide/data-processing/operations/operations-options#memory_reserve_factor\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;documentation&lt;/a&gt;.&lt;/p&gt;\n&lt;h2 id=\"ytdefaultmemorydigestlowerbound\"&gt;&lt;a href=\"en/yql/syntax/pragma/yt.html#ytdefaultmemorydigestlowerbound\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;yt.DefaultMemoryDigestLowerBound&lt;/span&gt;&lt;/a&gt;yt.DefaultMemoryDigestLowerBound&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Value type&lt;/th&gt;\n&lt;th&gt;Default value&lt;/th&gt;\n&lt;th&gt;Static/&lt;br /&gt;dynamic&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Floating point number from 0.0 to 1.0&lt;/td&gt;\n&lt;td&gt;—&lt;/td&gt;\n&lt;td&gt;Dynamic&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Sets the &lt;code&gt;user_job_memory_digest_lower_bound&lt;/code&gt; setting in the operation spec. To learn more about the setting, see the &lt;a href=\"https://ytsaurus.tech/docs/en/user-guide/data-processing/scheduler/memory-digest#nastrojki-digest\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;documentation&lt;/a&gt;.&lt;/p&gt;\n&lt;h2 id=\"ytbufferrowcount\"&gt;&lt;a href=\"en/yql/syntax/pragma/yt.html#ytbufferrowcount\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;yt.BufferRowCount&lt;/span&gt;&lt;/a&gt;yt.BufferRowCount&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Value type&lt;/th&gt;\n&lt;th&gt;Default value&lt;/th&gt;\n&lt;th&gt;Static/&lt;br /&gt;dynamic&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Number, minimum 1&lt;/td&gt;\n&lt;td&gt;—&lt;/td&gt;\n&lt;td&gt;Dynamic&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Limit on the number of records that JobProxy can buffer.&lt;/p&gt;\n&lt;h2 id=\"ytdisablejobsplitting\"&gt;&lt;a href=\"en/yql/syntax/pragma/yt.html#ytdisablejobsplitting\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;yt.DisableJobSplitting&lt;/span&gt;&lt;/a&gt;yt.DisableJobSplitting&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Value type&lt;/th&gt;\n&lt;th&gt;Default value&lt;/th&gt;\n&lt;th&gt;Static/&lt;br /&gt;dynamic&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Flag&lt;/td&gt;\n&lt;td&gt;false&lt;/td&gt;\n&lt;td&gt;Dynamic&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Prohibit the YTsaurus scheduler from adaptively splitting long-running custom jobs.&lt;/p&gt;\n&lt;h2 id=\"ytdefaultlocalitytimeout\"&gt;&lt;a href=\"en/yql/syntax/pragma/yt.html#ytdefaultlocalitytimeout\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;yt.DefaultLocalityTimeout&lt;/span&gt;&lt;/a&gt;yt.DefaultLocalityTimeout&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Value type&lt;/th&gt;\n&lt;th&gt;Default value&lt;/th&gt;\n&lt;th&gt;Static/&lt;br /&gt;dynamic&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Time interval supporting &lt;code&gt;s/m/h/d&lt;/code&gt; suffixes&lt;/td&gt;\n&lt;td&gt;—&lt;/td&gt;\n&lt;td&gt;Dynamic&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Sets th
