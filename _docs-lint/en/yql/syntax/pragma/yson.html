            {"data":{"leading":false,"html":"&lt;p&gt;Management of Yson UDF default behavior. To learn more, see the &lt;a href=\"en/yql/udf/list/yson.html\"&gt;documentation&lt;/a&gt;, in particular, &lt;a href=\"en/yql/udf/list/yson.html#ysonoptions\"&gt;Yson::Options&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;The Yson pragma affects all subsequent expressions up to the end of the module in which it occurs.&lt;/p&gt;\n&lt;h2 id=\"ysonautoconvert\"&gt;&lt;a href=\"en/yql/syntax/pragma/yson.html#ysonautoconvert\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;yson.AutoConvert&lt;/span&gt;&lt;/a&gt;yson.AutoConvert&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Value type&lt;/th&gt;\n&lt;th&gt;By default&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Flag&lt;/td&gt;\n&lt;td&gt;false&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Automatic conversion of values to the required data type in all Yson UDF calls, including implicit calls.&lt;/p&gt;\n&lt;h2 id=\"ysonstrict\"&gt;&lt;a href=\"en/yql/syntax/pragma/yson.html#ysonstrict\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;yson.Strict&lt;/span&gt;&lt;/a&gt;yson.Strict&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Value type&lt;/th&gt;\n&lt;th&gt;By default&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Flag&lt;/td&gt;\n&lt;td&gt;true&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Strict mode control in all Yson UDF calls, including implicit calls. Empty or &lt;code&gt;\"true\"&lt;/code&gt; value enables strict mode. If the value is &lt;code&gt;\"false\"&lt;/code&gt;, strict mode is disabled.&lt;/p&gt;\n&lt;h2 id=\"ysondisablestrict\"&gt;&lt;a href=\"en/yql/syntax/pragma/yson.html#ysondisablestrict\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;yson.DisableStrict&lt;/span&gt;&lt;/a&gt;yson.DisableStrict&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Value type&lt;/th&gt;\n&lt;th&gt;By default&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Flag&lt;/td&gt;\n&lt;td&gt;false&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;An inverted version of &lt;code&gt;yson.Strict&lt;/code&gt;. Empty or &lt;code&gt;\"true\"&lt;/code&gt; value disables strict mode. If the value is &lt;code&gt;\"false\"&lt;/code&gt;, strict mode is enabled.&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"en/yql/syntax/pragma/yson.md","sourcePath":"en/yql/syntax/pragma/yson.md"},"headings":[{"title":"yson.AutoConvert","href":"en/yql/syntax/pragma/yson.html#ysonautoconvert","level":2},{"title":"yson.Strict","href":"en/yql/syntax/pragma/yson.html#ysonstrict","level":2},{"title":"yson.DisableStrict","href":"en/yql/syntax/pragma/yson.html#ysondisablestrict","level":2}],"title":"Yson"},"router":{"pathname":"en/yql/syntax/pragma/yson","depth":5,"base":"../../../../"},"lang":"en","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/en/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-a29ea7877730322f2ce693378d06d02ac2b374cd-en","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
