        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;h2 id=\"file\"&gt;&lt;a href=\"en/yql/syntax/pragma/file.html#file\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;File&lt;/span&gt;&lt;/a&gt;File&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Value type&lt;/th&gt;\n&lt;th&gt;Default value&lt;/th&gt;\n&lt;th&gt;Static/&lt;br /&gt;dynamic&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Two or three string arguments — alias, URL, and optional token name&lt;/td&gt;\n&lt;td&gt;—&lt;/td&gt;\n&lt;td&gt;Static&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Attach a file to the query by URL. For attaching files you can use the built-in functions &lt;a href=\"en/yql/builtins/basic.html#filecontent\"&gt;FilePath and FileContent&lt;/a&gt;. This &lt;code&gt;PRAGMA&lt;/code&gt; is a universal alternative to attaching files using built-in mechanisms of web or console clients.&lt;/p&gt;\n&lt;p&gt;YQL reserves the right to cache files at the URL for an indefinite period, hence, if there is a significant change in the content behind it, we strongly recommend to modify the URL by adding or modifying dummy parameters.&lt;/p&gt;\n&lt;p&gt;If the token name is specified, its value will be used to access the target system.&lt;/p&gt;\n&lt;h2 id=\"fileoption\"&gt;&lt;a href=\"en/yql/syntax/pragma/file.html#fileoption\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;FileOption&lt;/span&gt;&lt;/a&gt;FileOption&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Value type&lt;/th&gt;\n&lt;th&gt;Default value&lt;/th&gt;\n&lt;th&gt;Static/&lt;br /&gt;dynamic&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Three string arguments: alias, key, value&lt;/td&gt;\n&lt;td&gt;—&lt;/td&gt;\n&lt;td&gt;Static&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Set the option by the specified key for the specified file to the specified value. The file with this alias should already be declared through &lt;a href=\"en/yql/syntax/pragma/file.html#file\"&gt;PRAGMA File&lt;/a&gt; or attached to the query.&lt;/p&gt;\n&lt;p&gt;Currently supported options:&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Key&lt;/th&gt;\n&lt;th&gt;Value range&lt;/th&gt;\n&lt;th&gt;Description&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;bypass_artifact_cache&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;true&lt;/code&gt;/&lt;code&gt;false&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Manages &lt;a href=\"https://ytsaurus.tech/docs/en/user-guide/data-processing/operations/operations-options#fajly\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;caching&lt;/a&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Example:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;PRAGMA FileOption(\"&amp;lt;file-name&amp;gt;\", \"bypass_artifact_cache\", \"true\");\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"108\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-108\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-108\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-108.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"library\"&gt;&lt;a href=\"en/yql/syntax/pragma/file.html#library\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Library&lt;/span&gt;&lt;/a&gt;Library&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Value type&lt;/th&gt;\n&lt;th&gt;Default value&lt;/th&gt;\n&lt;th&gt;Static/&lt;br /&gt;dynamic&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;One or two arguments: file name and optional URL&lt;/td&gt;\n&lt;td&gt;—&lt;/td&gt;\n&lt;td&gt;Static&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Treat the specified attached file as a library from which you can do &lt;a href=\"en/yql/syntax/export_import.html\"&gt;IMPORT&lt;/a&gt;. The syntax type for the library is determined from the file extension:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;.sql&lt;/code&gt;: For the YQL dialect of SQL &lt;span style=\"color:green\"&gt;(recommended)&lt;/span&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;.yqls&lt;/code&gt;: For s-expressions.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Example with a file attached to the query:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;PRAGMA library(\"a.sql\");\nIMPORT a SYMBOLS $x;\nSELECT $x;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"158\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-158\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-158\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-158.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;If the URL is specified, the library is downloaded from the URL rather than from the previously attached file as in the following example:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;PRAGMA library(\"a.sql\",\"https://raw.githubusercontent.com/ytsaurus/ytsaurus/refs/heads/main/yt/docs/code-examples/yql/pragma-library-example\");\nIMPORT a SYMBOLS $x;\nSELECT $x;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"162\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-162\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-162\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-162.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;In this case, you can use text parameter value substitution in the URL:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;DECLARE $_ver AS STRING; -- \"pragma-library-example\"\nPRAGMA library(\"a.sql\",\"https://raw.githubusercontent.com/ytsaurus/ytsaurus/refs/heads/main/yt/docs/code-examples/yql/{$_ver}\");\nIMPORT a SYMBOLS $x;\nSELECT $x;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"166\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-166\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-166\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-166.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"package\"&gt;&lt;a href=\"en/yql/syntax/pragma/file.html#package\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Package&lt;/span&gt;&lt;/a&gt;Package&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Value type&lt;/th&gt;\n&lt;th&gt;Default value&lt;/th&gt;\n&lt;th&gt;Static/&lt;br /&gt;dynamic&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Two or three arguments: package name, URL, and optional token&lt;/td&gt;\n&lt;td&gt;—&lt;/td&gt;\n&lt;td&gt;Static&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Attach a hierarchical set of files to the query by URL, treating them as a package with the specified name, an interrelated set of libraries.&lt;/p&gt;\n&lt;p&gt;The package name is expected in &lt;code&gt;project_name.package_name&lt;/code&gt; format; package libraries can then be used to make &lt;a href=\"en/yql/syntax/export_import.html\"&gt;IMPORT&lt;/a&gt; with a module name like &lt;code&gt;pkg.project_name.package_name.maybe.nested.module.name&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Example for a package with a flat hierarchy consisting of two libraries, foo.sql and bar.sql:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;PRAGMA package(\"project.package\", \"/path/to/package\");\nIMPORT pkg.project.package.foo SYMBOLS $foo;\nIMPORT pkg.project.package.bar SYMBOLS $bar;\nSELECT $foo, $bar;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"207\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-207\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-207\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-207.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;In this case, you can use text parameter value substitution in the URL:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;DECLARE $_path AS STRING; -- \"path\"\nPRAGMA package(\"project.package\", \"{$_path}/to/package\");\nIMPORT pkg.project.package.foo SYMBOLS $foo;\nIMPORT pkg.project.package.bar SYMBOLS $bar;\nSELECT $foo, $bar;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"211\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-211\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-211\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-211.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"overridelibrary\"&gt;&lt;a href=\"en/yql/syntax/pragma/file.html#overridelibrary\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;OverrideLibrary&lt;/span&gt;&lt;/a&gt;OverrideLibrary&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Value type&lt;/th&gt;\n&lt;th&gt;Default value&lt;/th&gt;\n&lt;th&gt;Static/&lt;br /&gt;dynamic&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;One argument: file name&lt;/td&gt;\n&lt;td&gt;—&lt;/td&gt;\n&lt;td&gt;Static&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Interpret the specified attached file as a library and override one of the package libraries with it.&lt;/p&gt;\n&lt;p&gt;The file name should be in the format &lt;code&gt;project_name/package_name/maybe/nested/module/name.EXTENSION&lt;/code&gt;, &lt;a href=\"en/yql/syntax/pragma/file.html#library\"&gt;PRAGMA Library&lt;/a&gt; extensions are supported.&lt;/p&gt;\n&lt;p&gt;Example:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;PRAGMA package(\"project.package\", \"/path/to/package\");\nPRAGMA override_library(\"project/package/maybe/nested/module/name.sql\");\n\nIMPORT pkg.project.package.foo SYMBOLS $foo;\nSELECT $foo;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"252\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-252\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-252\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-252.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Warning&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;For PRAGMA &lt;code&gt;Package&lt;/code&gt;, only links to directories on YTsaurus clusters are supported.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"en/yql/syntax/pragma/file.md","sourcePath":"en/yql/syntax/pragma/file.md"},"headings":[{"title":"File","href":"en/yql/syntax/pragma/file.html#file","level":2},{"title":"FileOption","href":"en/yql/syntax/pragma/file.html#fileoption","level":2},{"title":"Library","href":"en/yql/syntax/pragma/file.html#library","level":2},{"title":"Package","href":"en/yql/syntax/pragma/file.html#package","level":2},{"title":"OverrideLibrary","href":"en/yql/syntax/pragma/file.html#overridelibrary","level":2}],"title":"Working with files"},"router":{"pathname":"en/yql/syntax/pragma/file","depth":5,"base":"../../../../"},"lang":"en","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/en/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-a29ea7877730322f2ce693378d06d02ac2b374cd-en","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
