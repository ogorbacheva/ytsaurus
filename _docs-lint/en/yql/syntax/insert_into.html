        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;Adds rows to the table. If the target table already exists and is not sorted, the operation &lt;code&gt;INSERT INTO&lt;/code&gt; adds rows at the end of the table. For a sorted table, YQL tries to preserve sorting by starting a sorted merge.&lt;/p&gt;\n&lt;p&gt;Search for the table by name in the database specified by the &lt;a href=\"en/yql/syntax/use.html\"&gt;USE&lt;/a&gt; operator.&lt;/p&gt;\n&lt;p&gt;&lt;code&gt;INSERT INTO&lt;/code&gt; lets you perform the following operations:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;\n&lt;p&gt;Adding constant values using &lt;a href=\"en/yql/syntax/values.html\"&gt;&lt;code&gt;VALUES&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;INSERT INTO my_table (Column1, Column2, Column3, Column4)\nVALUES (345987,'ydb', 'Pied piper', 1414);\nCOMMIT;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"14\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-14\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-14\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-14.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;INSERT INTO my_table (Column1, Column2)\nVALUES (\"foo\", 1), (\"bar\", 2);\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"15\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-15\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-15\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-15.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;Saving the &lt;code&gt;SELECT&lt;/code&gt; result.&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;INSERT INTO my_table\nSELECT SourceTableColumn1 AS MyTableColumn1, \"Empty\" AS MyTableColumn2, SourceTableColumn2 AS MyTableColumn3\nFROM source_table;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"21\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-21\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-21\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-21.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"using-modifiers\"&gt;&lt;a href=\"en/yql/syntax/insert_into.html#using-modifiers\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Using modifiers&lt;/span&gt;&lt;/a&gt;Using modifiers&lt;/h2&gt;\n&lt;p&gt;Write operation can be performed with one or more modifiers. The modifier is specified after the &lt;code&gt;WITH&lt;/code&gt; keyword after the table name: &lt;code&gt;INSERT INTO ... WITH SOME_HINT&lt;/code&gt;. For example, to clear existing data from the table before the write operation, just add a modifier &lt;code&gt;WITH TRUNCATE&lt;/code&gt;:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;INSERT INTO my_table WITH TRUNCATE\nSELECT key FROM my_table_source;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"30\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-30\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-30\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-30.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;The following rules apply when working with modifiers:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;If the modifier has a value, it's specified after the &lt;code&gt;=&lt;/code&gt; sign: &lt;code&gt;INSERT INTO ... WITH SOME_HINT=value&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;If you need to specify multiple modifiers, they must be enclosed in parentheses: &lt;code&gt;INSERT INTO ... WITH (SOME_HINT1=value, SOME_HINT2, SOME_HINT3=value)&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;The full list of supported write modifiers:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;TRUNCATE&lt;/code&gt; to clear existing data from the table.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;COMPRESSION_CODEC=codec_name&lt;/code&gt; to write data with the specified compression codec. Takes priority over the &lt;code&gt;yt.PublishedCompressionCodec&lt;/code&gt; pragma. For permitted values, see the &lt;a href=\"https://ytsaurus.tech/docs/en/user-guide/storage/compression\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Compression&lt;/a&gt; section.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;ERASURE_CODEC=erasure_name&lt;/code&gt; to write data with the specified erasure codec. Takes priority over the &lt;code&gt;yt.PublishedErasureCodec&lt;/code&gt; pragma. For permitted values, see the &lt;a href=\"https://ytsaurus.tech/docs/en/user-guide/storage/replication#erasure\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Erasure coding&lt;/a&gt; section.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;EXPIRATION=value&lt;/code&gt; to the set expiration period for the table being created. The value can be set as &lt;code&gt;duration&lt;/code&gt; or as &lt;code&gt;timestamp&lt;/code&gt; in &lt;a href=\"https://en.wikipedia.org/wiki/ISO_8601\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;ISO 8601&lt;/a&gt; format. Takes priority over the &lt;code&gt;yt.ExpirationDeadline&lt;/code&gt;/&lt;code&gt;yt.ExpirationInterval&lt;/code&gt; pragmas. This modifier can only be set together with &lt;code&gt;TRUNCATE&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;REPLICATION_FACTOR=factor&lt;/code&gt; to set the replication factor for the table being created. The value must be in the [1, 10] range.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;USER_ATTRS=yson&lt;/code&gt; to set the user attribute that will be added to the table. Attributes must be set as a yson dictionary.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;MEDIA=yson&lt;/code&gt; to set the media. Takes priority over the &lt;code&gt;yt.PublishedMedia&lt;/code&gt; pragma. For permitted values, see the &lt;a href=\"https://ytsaurus.tech/docs/en/user-guide/storage/media\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Media&lt;/a&gt; section.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;PRIMARY_MEDIUM=medium_name&lt;/code&gt; to set the primary medium. Takes priority over the &lt;code&gt;yt.PublishedPrimaryMedium&lt;/code&gt; pragma.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;KEEP_META&lt;/code&gt; to save the current schema, user attributes, and retention attributes (codecs, replications, media) of the target table. This modifier can only be set together with &lt;code&gt;TRUNCATE&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Note&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;We do not recommend using system attributes in &lt;code&gt;USER_ATTRS&lt;/code&gt; because the result of their application to the written data is not defined.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"examples\"&gt;&lt;a href=\"en/yql/syntax/insert_into.html#examples\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Examples&lt;/span&gt;&lt;/a&gt;Examples&lt;/h4&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;INSERT INTO my_table WITH (TRUNCATE, EXPIRATION=\"15m\")\nSELECT key FROM my_table_source;\n\nINSERT INTO my_table WITH USER_ATTRS=\"{attr1=value1; attr2=value2;}\"\nSELECT key FROM my_table_source;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"109\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-109\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-109\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-109.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"en/yql/syntax/insert_into.md","sourcePath":"en/yql/syntax/insert_into.md"},"headings":[{"title":"Using modifiers","href":"en/yql/syntax/insert_into.html#using-modifiers","level":2}],"title":"INSERT INTO"},"router":{"pathname":"en/yql/syntax/insert_into","depth":4,"base":"../../../"},"lang":"en","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/en/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-a29ea7877730322f2ce693378d06d02ac2b374cd-en","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
