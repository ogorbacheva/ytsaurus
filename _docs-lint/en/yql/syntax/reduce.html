            {"data":{"leading":false,"html":"&lt;p&gt;Groups the input by the specified key columns, then passes the current keys and a lazy iterator over their corresponding values from the remaining columns to the specified UDF for processing. Similarly to &lt;code&gt;PROCESS&lt;/code&gt;, the UDF can return an arbitrary number of result rows per call and also return &lt;code&gt;Variants&lt;/code&gt; to create multiple outputs. In terms of MapReduce, it's very similar to Reduce.&lt;/p&gt;\n&lt;p&gt;Keywords that can follow:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;PRESORT&lt;/code&gt; (optional) — specifies the sequence inside each group. Syntax is similar to that of &lt;a href=\"en/yql/syntax/select/order_by.html\"&gt;ORDER BY&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;ON&lt;/code&gt; (required) — specifies key columns.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;USING&lt;/code&gt; or &lt;code&gt;USING ALL&lt;/code&gt; (required) — UDF call. See the detailed rules below.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Rules for passing UDF arguments:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;\n&lt;p&gt;If &lt;code&gt;TableRows()&lt;/code&gt; is specified as a UDF argument, then the UDF must accept one argument: a lazy iterator over strings, with the type &lt;code&gt;Stream&amp;lt;Struct&amp;lt;...&amp;gt;&amp;gt;&lt;/code&gt;. In this case, the output function type can only be &lt;code&gt;Stream&amp;lt;OutputType&amp;gt;&lt;/code&gt; or &lt;code&gt;List&amp;lt;OutputType&amp;gt;&lt;/code&gt;. It's guaranteed that the data in the input iterator is grouped by the key and, if necessary, sorted according to the &lt;code&gt;PRESORT&lt;/code&gt; section. With &lt;code&gt;TableRows()&lt;/code&gt;, you can only use &lt;code&gt;USING ALL&lt;/code&gt;.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;With &lt;code&gt;USING&lt;/code&gt;:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;The UDF must accept two arguments: the current key is passed to the first argument, and a lazy iterator with values corresponding to this key is passed to the second argument.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;With &lt;code&gt;USING ALL&lt;/code&gt;:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;The UDF must accept one argument: a lazy iterator over &lt;code&gt;Tuples&lt;/code&gt;, where the first item in the tuple is a key, and the second item is a lazy iterator with values corresponding to this key.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;The key to be passed to the UDF follows the rule below. If there is only one key column, then only its value is used in the key. If there are multiple columns (columns are listed similarly to &lt;code&gt;GROUP BY&lt;/code&gt; separated by commas), then the key is a &lt;code&gt;Tuple&lt;/code&gt; with values from the listed columns in the specified order.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;When you call &lt;code&gt;REDUCE&lt;/code&gt; from a query, only the expression whose values will be passed as iterator items follows the UDF name in parentheses (the second UDF argument for &lt;code&gt;USING&lt;/code&gt; or the second item of the tuple for &lt;code&gt;USING ALL&lt;/code&gt;).&lt;/p&gt;\n&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;The result is built in the same way as for &lt;a href=\"en/yql/syntax/process.html\"&gt;PROCESS&lt;/a&gt;. You can also use the &lt;code&gt;TableRow()&lt;/code&gt; keyword to get the whole string as a structure.&lt;/p&gt;\n&lt;p&gt;In &lt;code&gt;REDUCE&lt;/code&gt;, you can pass multiple inputs (the input here means a table, a &lt;a href=\"en/yql/syntax/select/concat.html\"&gt;range of tables&lt;/a&gt;, a subquery, a &lt;a href=\"en/yql/syntax/expressions.html#named-nodes\"&gt;named expression&lt;/a&gt;), separated by commas. All inputs must have the key columns of the matching type specified in &lt;code&gt;ON&lt;/code&gt;. To the function from &lt;code&gt;USING&lt;/code&gt; in this case, you can only pass a special named expression &lt;code&gt;TableRow()&lt;/code&gt;. The second argument (or the second element of the tuple for &lt;code&gt;USING ALL&lt;/code&gt;) will include a lazy iterator over variants with a populated element that corresponds to the occurrence ID for the current entry.&lt;/p&gt;\n&lt;p&gt;After &lt;code&gt;USING&lt;/code&gt;, in &lt;code&gt;REDUCE&lt;/code&gt; you can optionally specify &lt;code&gt;ASSUME ORDER BY&lt;/code&gt; with a list of columns. The result of such a &lt;code&gt;REDUCE&lt;/code&gt; statement is treated as sorted, but without actually running a sort. Sort check is performed at the query execution stage. It supports setting the sort order using the keywords &lt;code&gt;ASC&lt;/code&gt; (ascending order) and &lt;code&gt;DESC&lt;/code&gt; (descending order). Expressions are not supported in &lt;code&gt;ASSUME ORDER BY&lt;/code&gt;.&lt;/p&gt;\n&lt;h2 id=\"examples\"&gt;&lt;a href=\"en/yql/syntax/reduce.html#examples\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Examples&lt;/span&gt;&lt;/a&gt;Examples&lt;/h2&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;REDUCE my_table\nON key, subkey\nUSING MyUdf::MyReducer(TableRow());\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"79\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-79\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-79\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-79.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;REDUCE my_table\nON key, subkey\nUSING ALL MyUdf::MyStreamReducer(TableRow()); -- MyUdf::MyStreamReducer accepts the idle list of tuples as input (key, list of records for keys)\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"80\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-80\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-80\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-80.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;REDUCE my_table\nPRESORT LENGTH(subkey) DESC\nON key\nUSING MyUdf::MyReducer(\n    AsTuple(subkey, value)\n);\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"81\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-81\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-81\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-81.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;REDUCE my_table\nON key\nUSING ALL MyUdf::MyFlatStreamReducer(TableRows()); -- MyUdf::MyFlatStreamReducer accepts a single idle list of records as input\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"82\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-82\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-82\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-82.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;-- The function returns an alternative\n$udf = Python::MyReducer(Callable&amp;lt;(String, Stream&amp;lt;Struct&amp;lt;...&amp;gt;&amp;gt;) -&amp;gt; Variant&amp;lt;Struct&amp;lt;...&amp;gt;, Struct&amp;lt;...&amp;gt;&amp;gt;&amp;gt;,\n    $udfScript\n);\n\n-- We get the tuple of lists as output of REDUCE\n$i, $j = (REDUCE my_table ON key USING $udf(TableRow()));\n\nSELECT * FROM $i;\nSELECT * FROM $j;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"83\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-83\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-83\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-83.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;$script = @@\ndef MyReducer(key, values):\n    state = None, 0\n    for name, last_visit_time in values:\n        if state[1] &amp;lt; last_visit_time:\n            state = name, last_visit_time\n    return {\n        'region':key,\n        'last_visitor':state[0],\n    }\n@@;\n\n$udf = Python::MyReducer(Callable&amp;lt;(\n    Int64?,\n    Stream&amp;lt;Tuple&amp;lt;String?, Uint64?&amp;gt;&amp;gt;\n) -&amp;gt; Struct&amp;lt;\n    region:Int64?,\n    last_visitor:String?\n&amp;gt;&amp;gt;,\n    $script\n);\n\nREDUCE hahn.`home/yql/tutorial/users`\nON region USING $udf((name, last_visit_time));\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"84\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-84\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-84\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-84.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;-- The function accepts a key and an alternatives iterator as input\n$udf = Python::MyReducer(Callable&amp;lt;(String, Stream&amp;lt;Variant&amp;lt;Struct&amp;lt;...&amp;gt;,Struct&amp;lt;...&amp;gt;&amp;gt;&amp;gt;) -&amp;gt; Struct&amp;lt;...&amp;gt;&amp;gt;,\n    $udfScript\n);\n\nREDUCE my_table1, my_table2 ON key USING $udf(TableRow());\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"85\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-85\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-85\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-85.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"en/yql/syntax/reduce.md","sourcePath":"en/yql/syntax/reduce.md"},"headings":[{"title":"Examples","href":"en/yql/syntax/reduce.html#examples","level":2}],"title":"REDUCE"},"router":{"pathname":"en/yql/syntax/reduce","depth":4,"base":"../../../"},"lang":"en","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/en/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-a29ea7877730322f2ce693378d06d02ac2b374cd-en","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
