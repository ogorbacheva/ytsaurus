        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;h2 id=\"data-types-accepting-null\"&gt;&lt;a href=\"en/yql/types/optional.html#data-types-accepting-null\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Data types accepting NULL&lt;/span&gt;&lt;/a&gt;Data types accepting NULL&lt;/h2&gt;\n&lt;p&gt;Any typed data in YQL, including table columns, can be either non-nullable (guaranteed value) or nullable (empty value denoted as &lt;code&gt;NULL&lt;/code&gt;). Data types that can include &lt;code&gt;NULL&lt;/code&gt; values are called &lt;em&gt;optional&lt;/em&gt; or, in SQL terms, &lt;em&gt;nullable&lt;/em&gt;.&lt;/p&gt;\n&lt;p&gt;Optional data types in the &lt;a href=\"en/yql/types/type_string.html\"&gt;text format&lt;/a&gt; use the question mark at the end (for example, &lt;code&gt;String?&lt;/code&gt;) or the notation &lt;code&gt;Optional&amp;lt;...&amp;gt;&lt;/code&gt;.&lt;br /&gt;\nThe following operations are most often performed on optional data types:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"en/yql/syntax/expressions.html#is-null\"&gt;IS NULL&lt;/a&gt;: Matching an empty value&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"en/yql/builtins/basic.html#coalesce\"&gt;COALESCE&lt;/a&gt;: Leave the filled values unchanged and replace &lt;code&gt;NULL&lt;/code&gt; with the default value that follows&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"en/yql/builtins/basic.html#optional-ops\"&gt;UNWRAP&lt;/a&gt;: Extract the value of the original type from the optional data type, &lt;code&gt;T?&lt;/code&gt;. is converted to &lt;code&gt;T&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"en/yql/builtins/basic#optional-ops\"&gt;JUST&lt;/a&gt;: Add optionality to the current type, &lt;code&gt;T&lt;/code&gt; is converted to &lt;code&gt;T?&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"en/yql/builtins/basic.html#optional-ops\"&gt;NOTHING&lt;/a&gt;: Create an empty value with the specified type.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;&lt;code&gt;Optional&lt;/code&gt; (nullable) isn't a property of a data type or column, but a container type where &lt;a href=\"en/yql/types/containers.html\"&gt;containers&lt;/a&gt; can be arbitrarily nested into each other. For example, a column with the type &lt;code&gt;Optional&amp;lt;Optional&amp;lt;Boolean&amp;gt;&amp;gt;&lt;/code&gt; can accept 4 values: &lt;code&gt;NULL&lt;/code&gt; of the whole container, &lt;code&gt;NULL&lt;/code&gt; of the inner container, &lt;code&gt;TRUE&lt;/code&gt;, and &lt;code&gt;FALSE&lt;/code&gt;. The above-declared type differs from &lt;code&gt;List&amp;lt;List&amp;lt;Boolean&amp;gt;&amp;gt;&lt;/code&gt;, because it uses &lt;code&gt;NULL&lt;/code&gt; as an empty list, and you can't put more than one non-null element in it. In addition, &lt;code&gt;Optional&amp;lt;Optional&amp;lt;T&amp;gt;&amp;gt;&lt;/code&gt; type values are returned as results when searching by the key in the &lt;code&gt;Dict(k,v)&lt;/code&gt; dictionary with &lt;code&gt;Optional&amp;lt;T&amp;gt;&lt;/code&gt; type values. Using this type of result data, you can distinguish between a &lt;code&gt;NULL&lt;/code&gt; value in the dictionary and a situation when the key is missing.&lt;/p&gt;\n&lt;h4 id=\"example\"&gt;&lt;a href=\"en/yql/types/optional.html#example\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Example&lt;/span&gt;&lt;/a&gt;Example&lt;/h4&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;$dict = {\"a\":1, \"b\":null};\n$found = $dict[\"b\"];\nselect if($found is not null, unwrap($found), -1);\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"42\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-42\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-42\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-42.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Result:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs text\"&gt;# column0\nnull\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"46\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-46\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-46\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-46.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"null_expr\"&gt;&lt;a href=\"en/yql/types/optional.html#null_expr\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Logical and arithmetic operations with NULL&lt;/span&gt;&lt;/a&gt;Logical and arithmetic operations with NULL&lt;/h2&gt;\n&lt;p&gt;The &lt;code&gt;NULL&lt;/code&gt; literal has a separate singular &lt;code&gt;Null&lt;/code&gt; type and can be implicitly converted to any optional type (for example, the nested type &lt;code&gt;Optional&amp;lt;Optional&amp;lt;...Optional&amp;lt;T&amp;gt;...&amp;gt;&amp;gt;&lt;/code&gt;). In ANSI SQL, &lt;code&gt;NULL&lt;/code&gt; means \"an unknown value\", that's why logical and arithmetic operations involving &lt;code&gt;NULL&lt;/code&gt; or empty &lt;code&gt;Optional&lt;/code&gt; have certain specifics.&lt;/p&gt;\n&lt;h4 id=\"examples\"&gt;&lt;a href=\"en/yql/types/optional.html#examples\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Examples&lt;/span&gt;&lt;/a&gt;Examples&lt;/h4&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;SELECT\n    True OR NULL,        -- Just(True) (works the same way as True OR &amp;lt;unknown value of type Bool&amp;gt;)\n    False AND NULL,      -- Just(False)\n    True AND NULL,       -- NULL   (more precise than Nothing&amp;lt;Bool?&amp;gt; – &amp;lt;unknown value of type Bool&amp;gt;)\n    NULL OR NOT NULL,    -- NULL   (all NULLs are \"different\")\n    1 + NULL,            -- NULL   (Nothing&amp;lt;Int32?&amp;gt;) - the result of adding 1 together with\n                         --         unknown value of type Int)\n    1 == NULL,           -- NULL   (the result of adding 1 together with unknown value of type Int)\n    (1, NULL) == (1, 2), -- NULL   (composite elements are compared by component\n                         --         through `AND`)\n    (2, NULL) == (1, 3), -- Just(False) (expression is equivalent to 2 == 1 AND NULL == 3)\n\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"56\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-56\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-56\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-56.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"en/yql/types/optional.md","sourcePath":"en/yql/types/optional.md"},"headings":[{"title":"Data types accepting NULL","href":"en/yql/types/optional.html#data-types-accepting-null","level":2},{"title":"Logical and arithmetic operations with NULL","href":"en/yql/types/optional.html#null_expr","level":2}],"title":""},"router":{"pathname":"en/yql/types/optional","depth":4,"base":"../../../"},"lang":"en","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/en/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-a29ea7877730322f2ce693378d06d02ac2b374cd-en","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
