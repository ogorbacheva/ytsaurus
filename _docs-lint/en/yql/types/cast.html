        <title>Rules for type casting using the operator <a href="en/yql/syntax/expressions.html#cast">CAST</a> |  YTsaurus </title>

        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;h2 id=\"rules-for-casting-primitive-data-types\"&gt;&lt;a href=\"en/yql/types/cast.html#rules-for-casting-primitive-data-types\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Rules for casting primitive data types&lt;/span&gt;&lt;/a&gt;Rules for casting primitive data types&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;\n&lt;p&gt;When casting primitive data types, some of the source information may be discarded unless contained in the target type. For example:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;The &lt;code&gt;Float&lt;/code&gt;/&lt;code&gt;Double&lt;/code&gt; fractional part, when casting to integer types.&lt;/li&gt;\n&lt;li&gt;The &lt;code&gt;Datetime&lt;/code&gt;/&lt;code&gt;Timestamp&lt;/code&gt; time, when casting to &lt;code&gt;Date&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;The timezone, when casting from timezone types to date/time types without a timezone.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;If, in a certain combination of the source and target type, casting can't be performed for all possible values of the source type, then, if the casting fails, &lt;code&gt;CAST&lt;/code&gt; returns &lt;code&gt;NULL&lt;/code&gt;. In such cases, one &lt;code&gt;Optional&lt;/code&gt; level is added to the return value type, unless already present. For example, the constructs: &lt;code&gt;CAST(\"3.14\" AS Float?)&lt;/code&gt; and &lt;code&gt;CAST(\"3.14\" AS Float)&lt;/code&gt; are fully equivalent and return &lt;code&gt;Float?&lt;/code&gt;.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;If casting is possible for all values of the source type, then adding '?' works the same way as &lt;code&gt;Just&lt;/code&gt; on top: &lt;code&gt;CAST(3.14 AS Utf8?)&lt;/code&gt; is same as &lt;code&gt;Just(CAST(3.14 AS Utf8))&lt;/code&gt;.&lt;/p&gt;\n&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;All combinations of primitive data types for which &lt;code&gt;CAST&lt;/code&gt; can be used are described &lt;a href=\"en/yql/types/primitive.html\"&gt;here&lt;/a&gt;.&lt;/p&gt;\n&lt;h2 id=\"casting-rules-for-containers\"&gt;&lt;a href=\"en/yql/types/cast.html#casting-rules-for-containers\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Casting rules for containers&lt;/span&gt;&lt;/a&gt;Casting rules for containers&lt;/h2&gt;\n&lt;h3 id=\"rules-for-optional\"&gt;&lt;a href=\"en/yql/types/cast.html#rules-for-optional\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Rules for Optional&lt;/span&gt;&lt;/a&gt;Rules for Optional&lt;/h3&gt;\n&lt;ul&gt;\n&lt;li&gt;If a higher &lt;code&gt;Optional&lt;/code&gt; level is set for the target type than for the source type, it's same as adding &lt;code&gt;Just&lt;/code&gt; on top of &lt;code&gt;CAST&lt;/code&gt; with a lower &lt;code&gt;Optional&lt;/code&gt; level.&lt;/li&gt;\n&lt;li&gt;If the source type has a higher level of &lt;code&gt;Optional&lt;/code&gt; for the source type, then &lt;code&gt;NULL&lt;/code&gt; at any level higher than the target level results in &lt;code&gt;NULL&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;At equal levels of &lt;code&gt;Optional&lt;/code&gt;, the &lt;code&gt;NULL&lt;/code&gt; value preserves the same level.&lt;/li&gt;\n&lt;/ul&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;SELECT\n    CAST(1 AS Int32?),                  -- is equivalent to Just(1)\n    CAST(Just(2/1) AS Float??),         -- [2]\n    CAST(Just(3/0) AS Float??) IS NULL; -- false: the result is Just(NULL)\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"63\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-63\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-63\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-63.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"rules-for-list/dict\"&gt;&lt;a href=\"en/yql/types/cast.html#rules-for-list/dict\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Rules for List/Dict&lt;/span&gt;&lt;/a&gt;Rules for List/Dict&lt;/h3&gt;\n&lt;ul&gt;\n&lt;li&gt;To create a list, &lt;code&gt;CAST&lt;/code&gt; is applied to each item in the source list to cast it to the target type.&lt;/li&gt;\n&lt;li&gt;If the target item type is non-optional and &lt;code&gt;CAST&lt;/code&gt; on the item might fail, then such casting is discarded. In this case, the resulting list might be shorter or even empty if every casting failed.&lt;/li&gt;\n&lt;li&gt;For dictionaries, the casting is totally similar to lists, with &lt;code&gt;CAST&lt;/code&gt; being applied to keys and values.&lt;/li&gt;\n&lt;/ul&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;SELECT\n    CAST([-1, 0, 1] AS List&amp;lt;Uint8?&amp;gt;),             -- [null, 0, 1]\n    CAST([\"3.14\", \"bad\", \"42\"] AS List&amp;lt;Float&amp;gt;),   -- [3.14, 42]\n\n    CAST({-1:3.14, 7:1.6} AS Dict&amp;lt;Uint8, Utf8&amp;gt;),  -- {7: \"1.6\"}\n    CAST({-1:3.14, 7:1.6} AS Dict&amp;lt;Uint8?, Utf8&amp;gt;); -- {7: \"1.6\", null:\"3.14\"}\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"84\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-84\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-84\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-84.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"rules-for-struct/tuple\"&gt;&lt;a href=\"en/yql/types/cast.html#rules-for-struct/tuple\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Rules for Struct/Tuple&lt;/span&gt;&lt;/a&gt;Rules for Struct/Tuple&lt;/h3&gt;\n&lt;ul&gt;\n&lt;li&gt;A structure or tuple is created by applying &lt;code&gt;CAST&lt;/code&gt; to each item of the source type to cast it to an item with the same name or target type index.&lt;/li&gt;\n&lt;li&gt;If some field is missing in the target type, it's simply discarded.&lt;/li&gt;\n&lt;li&gt;If some field is missing in the source value type, then it can be added only if it's optional and accepts the &lt;code&gt;NULL&lt;/code&gt; value.&lt;/li&gt;\n&lt;li&gt;If some field is non-optional in the target type, but its casting might fail, then &lt;code&gt;CAST&lt;/code&gt; adds Optional to the structure or tuple level and might return &lt;code&gt;NULL&lt;/code&gt; for the entire result.&lt;/li&gt;\n&lt;/ul&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;SELECT\n    CAST((-1, 0, 1) AS Tuple&amp;lt;Uint16?, Uint16?, Utf8&amp;gt;), -- (null, 0, \"1\")\n    CAST((-2, 0) AS Tuple&amp;lt;Uint16, Utf8&amp;gt;),              -- null\n    CAST((3, 4) AS Tuple&amp;lt;Uint16, String&amp;gt;),             -- (3, \"4\"): the type is Tuple&amp;lt;Uint16, String&amp;gt;?\n    CAST((\"4\",) AS Tuple&amp;lt;Uint16, String?&amp;gt;),            -- (4, null)\n    CAST((5, 6, null) AS Tuple&amp;lt;Uint8?&amp;gt;);               -- (5,): the items were removed.\n\nSELECT -- One field was removed and one field was added: (\"three\":null, \"two\": \"42\")\n    CAST(&amp;lt;|one:\"8912\", two:42|&amp;gt; AS Struct&amp;lt;two:Utf8, three:Date?&amp;gt;);\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"110\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-110\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-110\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-110.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"rules-for-variant\"&gt;&lt;a href=\"en/yql/types/cast.html#rules-for-variant\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Rules for Variant&lt;/span&gt;&lt;/a&gt;Rules for Variant&lt;/h3&gt;\n&lt;ul&gt;\n&lt;li&gt;A variant with a specific name or index is cast to a variant with the same name or index.&lt;/li&gt;\n&lt;li&gt;If casting of a variant might fail and the type of this variant is non-optional, then &lt;code&gt;CAST&lt;/code&gt; adds Optional to the top level and can return &lt;code&gt;NULL&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;If some variant is missing in the target type, then &lt;code&gt;CAST&lt;/code&gt; adds Optional to the top level and returns &lt;code&gt;NULL&lt;/code&gt; for such a value.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h3 id=\"nested-containers\"&gt;&lt;a href=\"en/yql/types/cast.html#nested-containers\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Nested containers&lt;/span&gt;&lt;/a&gt;Nested containers&lt;/h3&gt;\n&lt;ul&gt;\n&lt;li&gt;All of the above rules are applied recursively for nested containers.&lt;/li&gt;\n&lt;/ul&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"en/yql/types/cast.md","sourcePath":"en/yql/types/cast.md"},"headings":[{"title":"Rules for casting primitive data types","href":"en/yql/types/cast.html#rules-for-casting-primitive-data-types","level":2},{"title":"Casting rules for containers","href":"en/yql/types/cast.html#casting-rules-for-containers","level":2,"items":[{"title":"Rules for Optional","href":"en/yql/types/cast.html#rules-for-optional","level":3},{"title":"Rules for List/Dict","href":"en/yql/types/cast.html#rules-for-list/dict","level":3},{"title":"Rules for Struct/Tuple","href":"en/yql/types/cast.html#rules-for-struct/tuple","level":3},{"title":"Rules for Variant","href":"en/yql/types/cast.html#rules-for-variant","level":3},{"title":"Nested containers","href":"en/yql/types/cast.html#nested-containers","level":3}]}],"title":"Rules for type casting using the operator &lt;a href=\"en/yql/syntax/expressions.html#cast\"&gt;CAST&lt;/a&gt;"},"router":{"pathname":"en/yql/types/cast","depth":4,"base":"../../../"},"lang":"en","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/en/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-a29ea7877730322f2ce693378d06d02ac2b374cd-en","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
