f=\"en/yql/builtins/basic.html#aggregatetransformoutput\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;AggregateTransformOutput&lt;/span&gt;&lt;/a&gt;AggregateTransformOutput&lt;/h2&gt;\n&lt;p&gt;&lt;code&gt;AggregateTransformOutput()&lt;/code&gt; transforms the &lt;a href=\"en/yql/builtins/aggregation.html\"&gt;aggregate function&lt;/a&gt; factory, for example, the one obtained via the &lt;a href=\"en/yql/builtins/basic.html#aggregationfactory\"&gt;AggregationFactory&lt;/a&gt; function, into another factory in which the specified transformation of the result is performed after the aggregation is completed.&lt;/p&gt;\n&lt;p&gt;Arguments:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;Aggregate function factory.&lt;/li&gt;\n&lt;li&gt;Lambda function with one argument which transforms the result.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;h4 id=\"examples42\"&gt;&lt;a href=\"en/yql/builtins/basic.html#examples42\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Examples&lt;/span&gt;&lt;/a&gt;Examples&lt;/h4&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;$f = AggregationFactory(\"sum\");\n$g = AggregateTransformOutput($f, ($x) -&amp;gt; ($x * 2));\nSELECT ListAggregate([1,2,3], $f); -- 6\nSELECT ListAggregate([1,2,3], $g); -- 12\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"1719\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-1719\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-1719\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1719.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"aggregateflatten\"&gt;&lt;a href=\"en/yql/builtins/basic.html#aggregateflatten\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;AggregateFlatten&lt;/span&gt;&lt;/a&gt;AggregateFlatten&lt;/h2&gt;\n&lt;p&gt;Adapts the &lt;a href=\"en/yql/builtins/aggregation.html\"&gt;aggregate function&lt;/a&gt; factory, for example, the one obtained via the &lt;a href=\"en/yql/builtins/basic.html#aggregationfactory\"&gt;AggregationFactory&lt;/a&gt; function, so that it performs aggregation on input items — lists. This operation is similar to &lt;a href=\"en/yql/syntax/flatten.html\"&gt;FLATTEN LIST BY&lt;/a&gt;: each item in the list is aggregated.&lt;/p&gt;\n&lt;p&gt;Arguments:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;Aggregate function factory.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;h4 id=\"examples43\"&gt;&lt;a href=\"en/yql/builtins/basic.html#examples43\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Examples&lt;/span&gt;&lt;/a&gt;Examples&lt;/h4&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;$i = AggregationFactory(\"AGGREGATE_LIST_DISTINCT\");\n$j = AggregateFlatten($i);\nSELECT AggregateBy(x, $j) from (\n   SELECT [1,2] as x\n   union all\n   SELECT [2,3] as x\n); -- [1, 2, 3]\n\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"1739\"&gt;\n                &lt;path
