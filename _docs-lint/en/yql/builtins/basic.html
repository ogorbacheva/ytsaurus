=\"examples24\"&gt;&lt;a href=\"en/yql/builtins/basic.html#examples24\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Examples&lt;/span&gt;&lt;/a&gt;Examples&lt;/h4&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;SELECT\n    WeakField(my_column, String, \"no value\"),\n    WeakField(my_table.other_column, Int64)\nFROM my_table;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"1088\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-1088\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-1088\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1088.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"ensure\"&gt;&lt;a href=\"en/yql/builtins/basic.html#ensure\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ensure...&lt;/span&gt;&lt;/a&gt;Ensure...&lt;/h2&gt;\n&lt;p&gt;Checking for the user conditions:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;Ensure()&lt;/code&gt;: Checking whether the predicate is true at query execution.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;EnsureType()&lt;/code&gt;: Checking that the expression type exactly matches the specified type.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;EnsureConvertibleTo()&lt;/code&gt;: A soft check of the expression type (with the same rules as for implicit type conversion).&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;If the check fails, the entire query fails.&lt;/p&gt;\n&lt;h4 id=\"signatures7\"&gt;&lt;a href=\"en/yql/builtins/basic.html#signatures7\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Signatures&lt;/span&gt;&lt;/a&gt;Signatures&lt;/h4&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;Ensure(T, Bool, String)-&amp;gt;T\nEnsureType(T, Type&amp;lt;T&amp;gt;, String)-&amp;gt;T\nEnsureConvertibleTo(T, Type&amp;lt;T&amp;gt;, String)-&amp;gt;T\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"1118\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-1118\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-1118\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1118.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Arguments:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;An expression that will result from a function call if the check is successful. It's also checked for the data type in the corresponding functions.&lt;/li&gt;\n&lt;li&gt;Ensure uses a Boolean predicate that is checked for being &lt;code&gt;true&lt;/code&gt;. The other functions use the data type that can be obtained using the &lt;a href=\"en/yql/builtins/types.html\"&gt;relevant functions&lt;/a&gt; or a string literal with the &lt;a href=\"en/yql/types/type_string.html\"&gt;text description of the type&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;An optional string with an error comment to be included in the overall error message when the query is complete. The data itself can't be used for type checks, since the data check is performed at query validation (or can be an arbitrary expression in the case of Ensure).&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;To check the conditions based on the final calculation result, it's convenient to combine Ensure with &lt;a href=\"en/yql/syntax/discard.html\"&gt;DISCARD SELECT&lt;/a&gt;.&lt;/p&gt;\n&lt;h4 id=\"examples25\"&gt;&lt;a href=\"en/yql/builtins/basic.html#examples25\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Examples&lt;/span&gt;&lt;/a&gt;Examples&lt;/h4&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;SELECT Ensure(\n    value,\n    value &amp;lt; 100,\n    \"value out or range\"\n) AS value FROM my_table;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"1145\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-1145\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-1145\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1145.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;SELECT EnsureType(\n    value,\n    TypeOf(other_value),\n    \"expected value and other_value to be of same type\"\n) AS value FROM my_table;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"1146\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-1146\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-1146\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1146.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;SELECT EnsureConvertibleTo(\n    value,\n    Double?,\n    \"expected value to be numeric\"\n) AS value FROM my_table;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"1147\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-1147\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-1147\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1147.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"assumestrict\"&gt;&lt;a href=\"en/yql/builtins/basic.html#assumestrict\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;AssumeStrict&lt;/span&gt;&lt;/a&gt;AssumeStrict&lt;/h2&gt;\n&lt;h4 id=\"signature24\"&gt;&lt;a href=\"en/yql/builtins/basic.html#signature24\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Signature&lt;/span&gt;&lt;/a&gt;Signature&lt;/h4&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;AssumeStrict(T)-&amp;gt;T\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"1154\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-1154\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-1154\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1154.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;The &lt;code&gt;AssumeStrict&lt;/code&gt; function returns its argument. Using this function is a way to tell the YQL optimizer that the expression in the argument is &lt;em&gt;strict&lt;/em&gt;, i.e. free of runtime errors.&lt;br /&gt;\nMost of the built-in YQL functions and operators are strict, but there are exceptions like &lt;a href=\"en/yql/builtins/basic.html#optional-ops\"&gt;Unwrap&lt;/a&gt; and &lt;a href=\"en/yql/builtins/basic.html#ensure\"&gt;Ensure&lt;/a&gt;.&lt;br /&gt;\nBesides that, a non-strict expression is considered a UDF call.&lt;/p&gt;\n&lt;p&gt;If you are sure that no runtime errors actually occur when computing the expression, we recommend using &lt;code&gt;AssumeStrict&lt;/code&gt;.&lt;/p&gt;\n&lt;h4 id=\"example10\"&gt;&lt;a href=\"en/yql/builtins/basic.html#example10\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Example&lt;/span&gt;&lt;/a&gt;Example&lt;/h4&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;SELECT * FROM T1 AS a JOIN T2 AS b USING(key)\nWHERE AssumeStrict(Unwrap(CAST(a.key AS Int32))) == 1;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"1164\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-1164\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-1164\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1164.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;In this example, we assume that all values of the &lt;code&gt;a.key&lt;/code&gt; text column in table &lt;code&gt;T1&lt;/code&gt; are valid numbers, so Unwrap does not cause an error.&lt;br /&gt;\nIf there is &lt;code&gt;AssumeStrict&lt;/code&gt;, the optimizer will be able to perform filtering first and then JOIN.&lt;br /&gt;\nWithout &lt;code&gt;AssumeStrict&lt;/code&gt;, such optimization is not performed: the optimizer must take into account the situation when there are non-numeric values in the &lt;code&gt;a.key&lt;/code&gt; column which are filtered out by &lt;code&gt;JOIN&lt;/code&gt;.&lt;/p&gt;\n&lt;h2 id=\"likely\"&gt;&lt;a href=\"en/yql/builtins/basic.html#likely\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Likely&lt;/span&gt;&lt;/a&gt;Likely&lt;/h2&gt;\n&lt;h4 id=\"signature25\"&gt;&lt;a href=\"en/yql/builtins/basic.html#signature25\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Signature&lt;/span&gt;&lt;/a&gt;Signature&lt;/h4&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;Likely(Bool)-&amp;gt;Bool\nLikely(Bool?)-&amp;gt;Bool?\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"1174\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-1174\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-1174\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1174.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;The &lt;code&gt;Likely&lt;/code&gt; function returns its argument. This function is a hint for the optimizer that tells it that in most cases its argument will be &lt;code&gt;True&lt;/code&gt;.&lt;br /&gt;\nFor example, if such a function is used in &lt;code&gt;WHERE&lt;/code&gt;, it means that the filter is weekly selective.&lt;/p&gt;\n&lt;h4 id=\"example11\"&gt;&lt;a href=\"en/yql/builtins/basic.html#example11\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Example&lt;/span&gt;&lt;/a&gt;Example&lt;/h4&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;SELECT * FROM T1 AS a JOIN T2 AS b USING(key)\nWHERE Likely(a.amount &amp;gt; 0)  -- This condition is almost always true\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"1181\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-1181\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-1181\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1181.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;When you use &lt;code&gt;Likely&lt;/code&gt;, the optimizer won't attempt to perform filtering before &lt;code&gt;JOIN&lt;/code&gt;.&lt;/p&gt;\n&lt;h2 id=\"evaluate_expr_atom\"&gt;&lt;a href=\"en/yql/builtins/basic.html#evaluate_expr_atom\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;EvaluateExpr, EvaluateAtom&lt;/span&gt;&lt;/a&gt;EvaluateExpr, EvaluateAtom&lt;/h2&gt;\n&lt;p&gt;Evaluate an expression before the start of the main calculation and input its result to the query as a literal (constant). In many contexts where the standard SQL would only expect a constant (for example in table names, number of rows in &lt;a href=\"en/yql/syntax/select/limit_offset.html\"&gt;LIMIT&lt;/a&gt;, and so on), this functionality is automatically activated implicitly.&lt;/p&gt;\n&lt;p&gt;EvaluateExpr can be used where the grammar already expects an expression. For example, you can use it to:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Round the current time to days, weeks, or months and add the time to the query. This will ensure &lt;a href=\"en/yql/syntax/pragma/yt.html#ytquerycachemode\"&gt;valid query caching&lt;/a&gt;, although normally, when you use &lt;a href=\"en/yql/builtins/basic.html#current-utc\"&gt;current-time functions&lt;/a&gt;, caching is disabled completely.&lt;/li&gt;\n&lt;li&gt;Run a heavy calculation with a small result once per query instead of once per job.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;You can use EvaluateAtom to create an &lt;a href=\"en/yql/types/special.html\"&gt;atom&lt;/a&gt; dynamically. However, since atoms are mainly controlled from a lower s-expressions level, it is generally not recommended to use this function directly.&lt;/p&gt;\n&lt;p&gt;The only argument for both functions is the expression for calculation and substitution.&lt;/p&gt;\n&lt;p&gt;Restrictions:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;The expression must not trigger MapReduce operations.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h4 id=\"examples26\"&gt;&lt;a href=\"en/yql/builtins/basic.html#examples26\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Examples&lt;/span&gt;&lt;/a&gt;Examples&lt;/h4&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;$now = CurrentUtcDate();\nSELECT EvaluateExpr(\n    DateTime::MakeDate(DateTime::StartOfWeek($now)\n    )\n);\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"1225\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-1225\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-1225\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1225.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"data-type-literals\"&gt;&lt;a href=\"en/yql/builtins/basic.html#data-type-literals\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Literals of primitive types&lt;/span&gt;&lt;/a&gt;Literals of primitive types&lt;/h2&gt;\n&lt;p&gt;For primitive types, you can create literals based on string literals.&lt;/p&gt;\n&lt;h4 id=\"syntax\"&gt;&lt;a href=\"en/yql/builtins/basic.html#syntax\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Syntax&lt;/span&gt;&lt;/a&gt;Syntax&lt;/h4&gt;\n&lt;p&gt;&lt;code&gt;&amp;lt;Primitive type&amp;gt;( &amp;lt;string&amp;gt;[, &amp;lt;additional attributes&amp;gt;] )&lt;/code&gt;&lt;/p&gt;\n&lt;p&gt;Unlike &lt;code&gt;CAST(\"myString\" AS MyType)&lt;/code&gt;:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;The check for literal's castability to the desired type occurs at validation.&lt;/li&gt;\n&lt;li&gt;The result is non-optional.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;For the &lt;code&gt;Date&lt;/code&gt;, &lt;code&gt;Datetime&lt;/code&gt;, &lt;code&gt;Timestamp&lt;/code&gt;, and &lt;code&gt;Interval&lt;/code&gt; data types, literals are supported only in the format conforming to &lt;a href=\"https://ru.wikipedia.org/wiki/ISO_8601\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;ISO 8601&lt;/a&gt;. &lt;code&gt;Interval&lt;/code&gt; has the following differences from the standard:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;It supports the negative sign for shifts to the past.&lt;/li&gt;\n&lt;li&gt;Microseconds can be expressed as fractional parts of seconds.&lt;/li&gt;\n&lt;li&gt;You can't use units of measurement exceeding one week.&lt;/li&gt;\n&lt;li&gt;The options with the beginning/end of the interval and with repetitions, are not supported.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;For the &lt;code&gt;TzDate&lt;/code&gt;, &lt;code&gt;TzDatetime&lt;/code&gt;, &lt;code&gt;TzTimestamp&lt;/code&gt; data types, literals are also set in the format conforming to &lt;a href=\"https://ru.wikipedia.org/wiki/ISO_8601\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;ISO 8601&lt;/a&gt;, but instead of the optional Z suffix, they specify the &lt;a href=\"https://en.wikipedia.org/wiki/List_of_tz_database_time_zones\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;IANA name of the time zone&lt;/a&gt;, separated by a comma (for example, GMT or Europe/Moscow).&lt;/p&gt;\n&lt;p&gt;For the Decimal parameter data type, two additional arguments are specified:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;The total number of decimal digits (up to 35, inclusive).&lt;/li&gt;\n&lt;li&gt;The number of decimal digits after the decimal point (out of the total number, i.e. strictly no more than the previous argument).&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h4 id=\"examples27\"&gt;&lt;a href=\"en/yql/builtins/basic.html#examples27\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Examples&lt;/span&gt;&lt;/a&gt;Examples&lt;/h4&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;SELECT\n  Bool(\"true\"),\n  Uint8(\"0\"),\n  Int32(\"-1\"),\n  Uint32(\"2\"),\n  Int64(\"-3\"),\n  Uint64(\"4\"),\n  Float(\"-5\"),\n  Double(\"6\"),\n  Decimal(\"1.23\", 5, 2), -- up to 5 decimal points, 2 of which follow a comma\n  String(\"foo\"),\n  Utf8(\"hello\"),\n  Yson(\"&amp;lt;a=1&amp;gt;[3;%false]\"),\n  Json(@@{\"a\":1,\"b\":null}@@),\n  Date(\"2017-11-27\"),\n  Datetime(\"2017-11-27T13:24:00Z\"),\n  Timestamp(\"2017-11-27T13:24:00.123456Z\"),\n  Interval(\"P1DT2H3M4.567890S\"),\n  TzDate(\"2017-11-27,Europe/Moscow\"),\n  TzDatetime(\"2017-11-27T13:24:00,America/Los_Angeles\"),\n  TzTimestamp(\"2017-11-27T13:24:00.123456,GMT\"),\n  Uuid(\"f9d5cc3f-f1dc-4d9c-b97e-766e57ca4ccb\");\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"1299\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-1299\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-1299\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1299.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"metadata\"&gt;&lt;a href=\"en/yql/builtins/basic.html#metadata\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Access to the metadata of the current operation&lt;/span&gt;&lt;/a&gt;Access to the metadata of the current operation&lt;/h2&gt;\n&lt;p&gt;When you run YQL operations via the web interface or HTTP API, you get access to the following data:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;CurrentOperationId()&lt;/code&gt;: The private ID of the operation.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;CurrentOperationSharedId()&lt;/code&gt;: The public ID of the operation.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;CurrentAuthenticatedUser()&lt;/code&gt;: The username of the current user.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h4 id=\"signatures8\"&gt;&lt;a href=\"en/yql/builtins/basic.html#signatures8\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Signatures&lt;/span&gt;&lt;/a&gt;Signatures&lt;/h4&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;CurrentOperationId()-&amp;gt;String\nCurrentOperationSharedId()-&amp;gt;String\nCurrentAuthenticatedUser()-&amp;gt;String\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"1326\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-1326\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-1326\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1326.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;No arguments.&lt;/p&gt;\n&lt;p&gt;If this data is missing, for example, when you run operations in the embedded mode, the functions return an empty string.&lt;/p&gt;\n&lt;h4 id=\"examples28\"&gt;&lt;a href=\"en/yql/builtins/basic.html#examples28\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Examples&lt;/span&gt;&lt;/a&gt;Examples&lt;/h4&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;SELECT\n    CurrentOperationId(),\n    CurrentOperationSharedId(),\n    CurrentAuthenticatedUser();\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"1336\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-1336\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-1336\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1336.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"to-from-bytes\"&gt;&lt;a href=\"en/yql/builtins/basic.html#to-from-bytes\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;ToBytes and FromBytes&lt;/span&gt;&lt;/a&gt;ToBytes and FromBytes&lt;/h2&gt;\n&lt;p&gt;Conversion of &lt;a href=\"en/yql/types/primitive.html\"&gt;primitive data types&lt;/a&gt; to a string with their binary representation and back. Numbers are represented in the &lt;a href=\"https://en.wikipedia.org/wiki/Endianness#Little-endian\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;little endian&lt;/a&gt; encoding.&lt;/p&gt;\n&lt;h4 id=\"signatures9\"&gt;&lt;a href=\"en/yql/builtins/basic.html#signatures9\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Signatures&lt;/span&gt;&lt;/a&gt;Signatures&lt;/h4&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;ToBytes(T)-&amp;gt;String\nToBytes(T?)-&amp;gt;String?\n\nFromBytes(String, Type&amp;lt;T&amp;gt;)-&amp;gt;T?\nFromBytes(String?, Type&amp;lt;T&amp;gt;)-&amp;gt;T?\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"1346\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-1346\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-1346\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1346.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h4 id=\"examples29\"&gt;&lt;a href=\"en/yql/builtins/basic.html#examples29\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Examples&lt;/span&gt;&lt;/a&gt;Examples&lt;/h4&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;SELECT\n    ToBytes(123), -- \"\\u0001\\u0000\\u0000\\u0000\"\n    FromBytes(\n        \"\\xd2\\x02\\x96\\x49\\x00\\x00\\x00\\x00\",\n        Uint64\n    ); -- 1234567890ul\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"1350\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-1350\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-1350\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1350.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"byteat\"&gt;&lt;a href=\"en/yql/builtins/basic.html#byteat\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;ByteAt&lt;/span&gt;&lt;/a&gt;ByteAt&lt;/h2&gt;\n&lt;p&gt;Getting the byte value in the string by the index from its beginning. If the index is invalid, &lt;code&gt;NULL&lt;/code&gt; is returned.&lt;/p&gt;\n&lt;h4 id=\"signature26\"&gt;&lt;a href=\"en/yql/builtins/basic.html#signature26\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Signature&lt;/span&gt;&lt;/a&gt;Signature&lt;/h4&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;ByteAt(String, Uint32)-&amp;gt;Uint8\nByteAt(String?, Uint32)-&amp;gt;Uint8?\n\nByteAt(Utf8, Uint32)-&amp;gt;Uint8\nByteAt(Utf8?, Uint32)-&amp;gt;Uint8?\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"1360\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-1360\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-1360\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1360.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Arguments:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;String: &lt;code&gt;String&lt;/code&gt; or &lt;code&gt;Utf8&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;Index: &lt;code&gt;Uint32&lt;/code&gt;.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;h4 id=\"examples30\"&gt;&lt;a href=\"en/yql/builtins/basic.html#examples30\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Examples&lt;/span&gt;&lt;/a&gt;Examples&lt;/h4&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;SELECT\n    ByteAt(\"foo\", 0), -- 102\n    ByteAt(\"foo\", 1), -- 111\n    ByteAt(\"foo\", 9); -- NULL\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"1379\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-1379\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-1379\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1379.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"bitops\"&gt;&lt;a href=\"en/yql/builtins/basic.html#bitops\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;...Bit&lt;/span&gt;&lt;/a&gt;...Bit&lt;/h2&gt;\n&lt;p&gt;&lt;code&gt;TestBit()&lt;/code&gt;, &lt;code&gt;ClearBit()&lt;/code&gt;, &lt;code&gt;SetBit()&lt;/code&gt;, and &lt;code&gt;FlipBit()&lt;/code&gt;: Test, clear, set, or flip a bit in an unsigned number by the specified bit sequence number.&lt;/p&gt;\n&lt;h4 id=\"signatures10\"&gt;&lt;a href=\"en/yql/builtins/basic.html#signatures10\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Signatures&lt;/span&gt;&lt;/a&gt;Signatures&lt;/h4&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;TestBit(T, Uint8)-&amp;gt;Bool\nTestBit(T?, Uint8)-&amp;gt;Bool?\nTestBit(String, Uint8)-&amp;gt;Bool?\nTestBit(String?, Uint8)-&amp;gt;Bool?\n\nClearBit(T, Uint8)-&amp;gt;T\nClearBit(T?, Uint8)-&amp;gt;T?\n\nSetBit(T, Uint8)-&amp;gt;T\nSetBit(T?, Uint8)-&amp;gt;T?\n\nFlipBit(T, Uint8)-&amp;gt;T\nFlipBit(T?, Uint8)-&amp;gt;T?\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"1389\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-1389\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-1389\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1389.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Arguments:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;An unsigned number to perform the desired operation on. &lt;code&gt;TestBit&lt;/code&gt; is also implemented for strings (see the description below).&lt;/li&gt;\n&lt;li&gt;Bit number.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;&lt;code&gt;TestBit&lt;/code&gt; returns &lt;code&gt;true/false&lt;/code&gt;. Other functions return a copy of their first argument with the corresponding transformation performed.&lt;/p&gt;\n&lt;p&gt;&lt;code&gt;TestBit&lt;/code&gt; for string arguments works as follows:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;Based on the second argument, the function selects the corresponding byte &lt;em&gt;from the beginning of the string&lt;/em&gt;.&lt;/li&gt;\n&lt;li&gt;In that byte, it then selects the corresponding low-order bit.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;h4 id=\"examples31\"&gt;&lt;a href=\"en/yql/builtins/basic.html#examples31\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Examples&lt;/span&gt;&lt;/a&gt;Examples&lt;/h4&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;SELECT\n    TestBit(1u, 0), -- true\n    TestBit('ax', 12) -- true (second byte, fourth bit)\n    SetBit(8u, 0); -- 9\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"1426\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-1426\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-1426\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1426.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"abs\"&gt;&lt;a href=\"en/yql/builtins/basic.html#abs\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Abs&lt;/span&gt;&lt;/a&gt;Abs&lt;/h2&gt;\n&lt;p&gt;Absolute value of the number.&lt;/p&gt;\n&lt;h4 id=\"signature27\"&gt;&lt;a href=\"en/yql/builtins/basic.html#signature27\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Signature&lt;/span&gt;&lt;/a&gt;Signature&lt;/h4&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;Abs(T)-&amp;gt;T\nAbs(T?)-&amp;gt;T?\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"1436\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-1436\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-1436\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1436.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h4 id=\"examples32\"&gt;&lt;a href=\"en/yql/builtins/basic.html#examples32\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Examples&lt;/span&gt;&lt;/a&gt;Examples&lt;/h4&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;SELECT Abs(-123); -- 123\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"1440\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-1440\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-1440\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1440.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"optional-ops\"&gt;&lt;a href=\"en/yql/builtins/basic.html#optional-ops\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Just&lt;/span&gt;&lt;/a&gt;Just&lt;/h2&gt;\n&lt;p&gt;&lt;code&gt;Just()&lt;/code&gt;: Change the data type of the value to an &lt;a href=\"en/yql/types/optional.html\"&gt;optional&lt;/a&gt; type derived from the current data type (for example, &lt;code&gt;T&lt;/code&gt; becomes &lt;code&gt;T?&lt;/code&gt;).&lt;/p&gt;\n&lt;h4 id=\"signature28\"&gt;&lt;a href=\"en/yql/builtins/basic.html#signature28\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Signature&lt;/span&gt;&lt;/a&gt;Signature&lt;/h4&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;Just(T)-&amp;gt;T?\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"1450\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-1450\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-1450\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1450.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h4 id=\"examples33\"&gt;&lt;a href=\"en/yql/builtins/basic.html#examples33\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Examples&lt;/span&gt;&lt;/a&gt;Examples&lt;/h4&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;SELECT\n  Just(\"my_string\"); --  String?\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"1454\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-1454\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-1454\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1454.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"unwrap\"&gt;&lt;a href=\"en/yql/builtins/basic.html#unwrap\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Unwrap&lt;/span&gt;&lt;/a&gt;Unwrap&lt;/h2&gt;\n&lt;p&gt;&lt;code&gt;Unwrap()&lt;/code&gt;: Converting the &lt;a href=\"en/yql/types/optional.html\"&gt;optional&lt;/a&gt; value of the data type to the corresponding non-optional type, raising a runtime error if the data is &lt;code&gt;NULL&lt;/code&gt;. This means that &lt;code&gt;T?&lt;/code&gt; becomes &lt;code&gt;T&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;If the value is not &lt;a href=\"en/yql/types/optional.html\"&gt;optional&lt;/a&gt;, the function returns its first argument without change.&lt;/p&gt;\n&lt;h4 id=\"signature29\"&gt;&lt;a href=\"en/yql/builtins/basic.html#signature29\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Signature&lt;/span&gt;&lt;/a&gt;Signature&lt;/h4&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;Unwrap(T?)-&amp;gt;T\nUnwrap(T?, Utf8)-&amp;gt;T\nUnwrap(T?, String)-&amp;gt;T\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"1467\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-1467\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-1467\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1467.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Arguments:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;Value to be converted.&lt;/li&gt;\n&lt;li&gt;An optional string with a comment for the error text.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;The reverse operation is &lt;a href=\"en/yql/builtins/basic.html#optional-ops\"&gt;Just&lt;/a&gt;.&lt;/p&gt;\n&lt;h4 id=\"examples34\"&gt;&lt;a href=\"en/yql/builtins/basic.html#examples34\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Examples&lt;/span&gt;&lt;/a&gt;Examples&lt;/h4&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;$value = Just(\"value\");\n\nSELECT Unwrap($value, \"Unexpected NULL for $value\");\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"1489\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-1489\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-1489\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1489.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"nothing\"&gt;&lt;a href=\"en/yql/builtins/basic.html#nothing\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Nothing&lt;/span&gt;&lt;/a&gt;Nothing&lt;/h2&gt;\n&lt;p&gt;&lt;code&gt;Nothing()&lt;/code&gt;: Create an empty value for the specified &lt;a href=\"en/yql/types/optional.html\"&gt;Optional&lt;/a&gt; data type.&lt;/p&gt;\n&lt;h4 id=\"signature30\"&gt;&lt;a href=\"en/yql/builtins/basic.html#signature30\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Signature&lt;/span&gt;&lt;/a&gt;Signature&lt;/h4&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;Nothing(Type&amp;lt;T?&amp;gt;)-&amp;gt;T?\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"1499\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-1499\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-1499\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1499.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h4 id=\"examples35\"&gt;&lt;a href=\"en/yql/builtins/basic.html#examples35\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Examples&lt;/span&gt;&lt;/a&gt;Examples&lt;/h4&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;SELECT\n  Nothing(String?); -- A NULL value with the String? type\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"1503\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-1503\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-1503\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1503.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;&lt;a href=\"en/yql/builtins/types.html\"&gt;Learn more about ParseType and other functions for data types&lt;/a&gt;.&lt;/p&gt;\n&lt;h2 id=\"callable\"&gt;&lt;a href=\"en/yql/builtins/basic.html#callable\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Callable&lt;/span&gt;&lt;/a&gt;Callable&lt;/h2&gt;\n&lt;p&gt;Create a callable value with the given signature from a lambda function. Usually used to place callable values in containers.&lt;/p&gt;\n&lt;h4 id=\"signature31\"&gt;&lt;a href=\"en/yql/builtins/basic.html#signature31\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Signature&lt;/span&gt;&lt;/a&gt;Signature&lt;/h4&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;Callable(Type&amp;lt;Callable&amp;lt;(...)-&amp;gt;T&amp;gt;&amp;gt;, lambda)-&amp;gt;Callable&amp;lt;(...)-&amp;gt;T&amp;gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"1516\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-1516\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-1516\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1516.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Arguments:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;Type.&lt;/li&gt;\n&lt;li&gt;Lambda function.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;h4 id=\"examples36\"&gt;&lt;a href=\"en/yql/builtins/basic.html#examples36\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Examples&lt;/span&gt;&lt;/a&gt;Examples&lt;/h4&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;$lambda = ($x) -&amp;gt; {\n    RETURN CAST($x as String)\n};\n\n$callables = AsTuple(\n    Callable(Callable&amp;lt;(Int32)-&amp;gt;String&amp;gt;, $lambda),\n    Callable(Callable&amp;lt;(Bool)-&amp;gt;String&amp;gt;, $lambda),\n);\n\nSELECT $callables.0(10), $callables.1(true);\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"1535\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-1535\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-1535\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1535.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"pickle\"&gt;&lt;a href=\"en/yql/builtins/basic.html#pickle\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Pickle, Unpickle&lt;/span&gt;&lt;/a&gt;Pickle, Unpickle&lt;/h2&gt;\n&lt;p&gt;&lt;code&gt;Pickle()&lt;/code&gt; and &lt;code&gt;StablePickle()&lt;/code&gt; serialize an arbitrary object into a sequence of bytes, if possible. Typical non-serializable objects are Callable and Resource. The serialization format is not versioned and can be used within a single query. For the Dict type, the StablePickle function pre-sorts the keys, and for Pickle, the order of dictionary elements in the serialized representation isn't defined.&lt;/p&gt;\n&lt;p&gt;&lt;code&gt;Unpickle()&lt;/code&gt; is the inverse operation (deserialization), where with the first argument being the data type of the result and the second argument is the string with the result of &lt;code&gt;Pickle()&lt;/code&gt; or &lt;code&gt;StablePickle()&lt;/code&gt;.&lt;/p&gt;\n&lt;h4 id=\"signatures11\"&gt;&lt;a href=\"en/yql/builtins/basic.html#signatures11\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Signatures&lt;/span&gt;&lt;/a&gt;Signatures&lt;/h4&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;Pickle(T)-&amp;gt;String\nStablePickle(T)-&amp;gt;String\nUnpickle(Type&amp;lt;T&amp;gt;, String)-&amp;gt;T\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"1548\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-1548\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-1548\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1548.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h4 id=\"examples37\"&gt;&lt;a href=\"en/yql/builtins/basic.html#examples37\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Examples&lt;/span&gt;&lt;/a&gt;Examples&lt;/h4&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;SELECT *\nFROM my_table\nWHERE Digest::MurMurHash32(\n        Pickle(TableRow())\n    ) % 10 == 0; -- from practical viewpoint, it's better to use TABLESAMPLE\n\n$buf = Pickle(123);\nSELECT Unpickle(Int32, $buf);\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"1552\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-1552\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-1552\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1552.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"staticmap\"&gt;&lt;a href=\"en/yql/builtins/basic.html#staticmap\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;StaticMap&lt;/span&gt;&lt;/a&gt;StaticMap&lt;/h2&gt;\n&lt;p&gt;Transforms a structure or tuple by applying a lambda function to each item.&lt;/p&gt;\n&lt;h4 id=\"signature32\"&gt;&lt;a href=\"en/yql/builtins/basic.html#signature32\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Signature&lt;/span&gt;&lt;/a&gt;Signature&lt;/h4&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;StaticMap(Struct&amp;lt;...&amp;gt;, lambda)-&amp;gt;Struct&amp;lt;...&amp;gt;\nStaticMap(Tuple&amp;lt;...&amp;gt;, lambda)-&amp;gt;Tuple&amp;lt;...&amp;gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"1562\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-1562\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-1562\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1562.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Arguments:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Structure or tuple.&lt;/li&gt;\n&lt;li&gt;Lambda for processing items.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Result: a structure or tuple with the same number and naming of items as in the first argument, and with item data types determined by lambda results.&lt;/p&gt;\n&lt;h4 id=\"examples38\"&gt;&lt;a href=\"en/yql/builtins/basic.html#examples38\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Examples&lt;/span&gt;&lt;/a&gt;Examples&lt;/h4&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;SELECT *\nFROM (\n    SELECT\n        StaticMap(TableRow(), ($item) -&amp;gt; {\n            return CAST($item AS String);\n        })\n    FROM my_table\n) FLATTEN COLUMNS; -- converting all columns to rows\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"1584\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-1584\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-1584\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1584.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"staticzip\"&gt;&lt;a href=\"en/yql/builtins/basic.html#staticzip\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;StaticZip&lt;/span&gt;&lt;/a&gt;StaticZip&lt;/h2&gt;\n&lt;p&gt;Merges structures or tuples element-by-element. All arguments (one or more) must be either structures with the same set of fields or tuples of the same length.&lt;br /&gt;\nThe result will be a structure or tuple, respectively.&lt;br /&gt;\nEach item of the result is a tuple comprised of items taken from arguments.&lt;/p&gt;\n&lt;h4 id=\"signature33\"&gt;&lt;a href=\"en/yql/builtins/basic.html#signature33\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Signature&lt;/span&gt;&lt;/a&gt;Signature&lt;/h4&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;StaticZip(Struct, Struct)-&amp;gt;Struct\nStaticZip(Tuple, Tuple)-&amp;gt;Tuple\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"1594\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-1594\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-1594\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1594.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h4 id=\"examples39\"&gt;&lt;a href=\"en/yql/builtins/basic.html#examples39\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Examples&lt;/span&gt;&lt;/a&gt;Examples&lt;/h4&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;$one = &amp;lt;|k1:1, k2:2.0|&amp;gt;;\n$two = &amp;lt;|k1:3.0, k2:4|&amp;gt;;\n\n-- element-wise addition of two structures\nSELECT StaticMap(StaticZip($one, $two), ($tuple)-&amp;gt;($tuple.0 + $tuple.1)) AS sum;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"1598\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-1598\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-1598\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1598.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"staticfold\"&gt;&lt;a href=\"en/yql/builtins/basic.html#staticfold\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;StaticFold, StaticFold1&lt;/span&gt;&lt;/a&gt;StaticFold, StaticFold1&lt;/h2&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;StaticFold(obj:Struct/Tuple, initVal, updateLambda)\nStaticFold1(obj:Struct/Tuple, initLambda, updateLambda)\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"1602\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-1602\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-1602\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1602.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Static left-associative fold over a structure or tuple.&lt;br /&gt;\nTuples are folded from the lower index to the higher one; for structures, the order is not guaranteed.&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;obj&lt;/code&gt;: Object whose elements are to be folded.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;initVal&lt;/code&gt;: &lt;em&gt;(for StaticFold)&lt;/em&gt; Initial fold state.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;initLambda&lt;/code&gt;: &lt;em&gt;(for StaticFold1)&lt;/em&gt; Function that produces an initial fold state based on the first element.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;updateLambda&lt;/code&gt;: Function that updates a state (accepts the next object element and the previous state in the arguments).&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;&lt;code&gt;StaticFold(&amp;lt;|key_1:$el_1, key_2:$el_2, ..., key_n:$el_n|&amp;gt;, $init, $f)&lt;/code&gt; transforms into fold:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;$f($el_n, ...$f($el_2, $f($init, el_1))...)\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"1631\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-1631\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-1631\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1631.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;&lt;code&gt;StaticFold1(&amp;lt;|key_1:$el_1, key_2:$el_2, ..., key_n:$el_n|&amp;gt;, $f0, $f)&lt;/code&gt;:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;$f($el_n, ...$f($el_2, $f($f0($init), el_1))...)\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"1635\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-1635\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-1635\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1635.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;&lt;code&gt;StaticFold1(&amp;lt;||&amp;gt;, $f0, $f)&lt;/code&gt; returns &lt;code&gt;NULL&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;The same logic applies to tuples.&lt;/p&gt;\n&lt;h2 id=\"aggregationfactory\"&gt;&lt;a href=\"en/yql/builtins/basic.html#aggregationfactory\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;AggregationFactory&lt;/span&gt;&lt;/a&gt;AggregationFactory&lt;/h2&gt;\n&lt;p&gt;Create the &lt;a href=\"en/yql/builtins/aggregation.html\"&gt;aggregate function&lt;/a&gt; factory to separate the process of describing how to aggregate data and which data to apply it to.&lt;/p&gt;\n&lt;p&gt;Arguments:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;A string in quotation marks that is the name of an aggregate function, for example, &lt;a href=\"en/yql/builtins/aggregation.html#min\"&gt;\"MIN\"&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;Optional aggregate function parameters that do not depend on the data. For example, the percentile value in &lt;a href=\"en/yql/builtins/aggregation.html#percentile\"&gt;PERCENTILE&lt;/a&gt;.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;The resulting factory can be used as a second parameter of the &lt;a href=\"en/yql/builtins/aggregation.html#aggregateby\"&gt;AGGREGATE_BY&lt;/a&gt; function.&lt;br /&gt;\nIf the aggregate function works on two columns instead of one, for example, &lt;a href=\"en/yql/builtins/aggregation.html#minby\"&gt;MIN_BY&lt;/a&gt;, &lt;code&gt;Tuple&lt;/code&gt; of two values is passed as a first argument in &lt;a href=\"en/yql/builtins/aggregation.html#aggregateby\"&gt;AGGREGATE_BY&lt;/a&gt;. For more information, see the description of this aggregate function.&lt;/p&gt;\n&lt;h4 id=\"examples40\"&gt;&lt;a href=\"en/yql/builtins/basic.html#examples40\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Examples&lt;/span&gt;&lt;/a&gt;Examples&lt;/h4&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;$factory = AggregationFactory(\"MIN\");\nSELECT\n    AGGREGATE_BY(value, $factory) AS min_value -- apply MIN aggregation to value column\nFROM my_table;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"1669\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-1669\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-1669\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1669.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"aggregatetransform\"&gt;&lt;a href=\"en/yql/builtins/basic.html#aggregatetransform\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;AggregateTransformInput&lt;/span&gt;&lt;/a&gt;AggregateTransformInput&lt;/h2&gt;\n&lt;p&gt;&lt;code&gt;AggregateTransformInput()&lt;/code&gt; transforms the &lt;a href=\"en/yql/builtins/aggregation.html\"&gt;aggregate function&lt;/a&gt; factory, for example, the one obtained via the &lt;a href=\"en/yql/builtins/basic.html#aggregationfactory\"&gt;AggregationFactory&lt;/a&gt; function, into another factory in which the specified transformation of input items is performed before the aggregation starts.&lt;/p&gt;\n&lt;p&gt;Arguments:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;Aggregate function factory.&lt;/li&gt;\n&lt;li&gt;Lambda function with one argument which transforms an input item.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;h4 id=\"examples41\"&gt;&lt;a href=\"en/yql/builtins/basic.html#examples41\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Examples&lt;/span&gt;&lt;/a&gt;Examples&lt;/h4&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;$f = AggregationFactory(\"sum\");\n$g = AggregateTransformInput($f, ($x) -&amp;gt; (cast($x as Int32)));\n$h = AggregateTransformInput($f, ($x) -&amp;gt; ($x * 2));\nSELECT ListAggregate([1,2,3], $f); -- 6\nSELECT ListAggregate([\"1\",\"2\",\"3\"], $g); -- 6\nSELECT ListAggregate([1,2,3], $h); -- 12\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"1694\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-1694\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-1694\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1694.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"aggregatetransformoutput\"&gt;&lt;a hre
