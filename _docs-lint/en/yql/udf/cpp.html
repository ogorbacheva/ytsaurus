        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;h2 id=\"introduction\"&gt;&lt;a href=\"en/yql/udf/cpp.html#introduction\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Introduction&lt;/span&gt;&lt;/a&gt;Introduction&lt;/h2&gt;\n&lt;p&gt;YQL currently supports user-defined functions (UDFs) in C++ and Python. The information below covers only C++. &lt;a href=\"en/yql/udf/python.html\"&gt;Python UDFs&lt;/a&gt; are covered on a separate page.&lt;/p&gt;\n&lt;p&gt;YQL offers a set of basic functions, and we recommend viewing the &lt;a href=\"en/yql/udf/list/index.html\"&gt;list&lt;/a&gt; of them.&lt;/p&gt;\n&lt;h2 id=\"terminology\"&gt;&lt;a href=\"en/yql/udf/cpp.html#terminology\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Terminology&lt;/span&gt;&lt;/a&gt;Terminology&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;strong&gt;A &lt;span style=\"color:gray\"&gt;callable&lt;/span&gt; value&lt;/strong&gt; is an entity with a fixed, strictly typed signature that, when called, can return a result based on its arguments.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;A user-defined function&lt;/strong&gt; &lt;span style=\"color:gray\"&gt;(UDF)&lt;/span&gt; is a generator of callable values.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;A &lt;span style=\"color:gray\"&gt;module&lt;/span&gt;&lt;/strong&gt; is a set of closely related functions with a common prefix. All module functions are distributed together in a single shared library (&lt;code&gt;.so&lt;/code&gt;). If a module is project-specific, it's advisable to reflect this in its name by adding a prefix.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;A &lt;span style=\"color:gray\"&gt;registrator&lt;/span&gt;&lt;/strong&gt; is an interface for adding modules and functions to the general registry.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;A module &lt;span style=\"color:gray\"&gt;group&lt;/span&gt;&lt;/strong&gt; is a group of modules belonging to a structural unit or a large project. It serves only for logical separation of source code (see the next section) and is not visible from YQL/SQL.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Configuration parameters&lt;/strong&gt; are an optional tool for setting up a user-defined function (generator of callable values). You can use configuration parameters to change the behavior of callable values without recompilation.\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;Type Config&lt;/code&gt;, &lt;code&gt;User Type&lt;/code&gt;: They are used by the function to define and declare the signature of the callable value; used when building a computation graph. They must be known at compile time, so &lt;code&gt;Type Config&lt;/code&gt; must be an atom, and &lt;code&gt;User Type&lt;/code&gt; must be a certain type (for example, obtained using the TypeOf operation).&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;Run Config&lt;/code&gt;: Function uses it to return the callable value with the previously declared signature. The Run Config value type is specified in the UDF code when declaring the signature of the callable value. It differs from a regular argument in that it is passed at initialization, not at each call.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"examples\"&gt;&lt;a href=\"en/yql/udf/cpp.html#examples\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Examples&lt;/span&gt;&lt;/a&gt;Examples&lt;/h2&gt;\n&lt;p&gt;Examples of ready-to-use modules are available at &lt;a href=\"https://github.com/ytsaurus/ytsaurus/tree/main/yql/essentials/udfs\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;https://github.com/ytsaurus/ytsaurus/tree/main/yql/essentials/udfs&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;See the &lt;a href=\"https://github.com/ytsaurus/ytsaurus/tree/main/yql/essentials/udfs/examples\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;examples&lt;/a&gt; subdirectory for very basic examples and other subdirectories (such as &lt;a href=\"https://github.com/ytsaurus/ytsaurus/tree/main/yql/essentials/udfs/common\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;common&lt;/a&gt;) for more realistic ones.&lt;/p&gt;\n&lt;p&gt;Before you move on to the next section, we recommend opening one or multiple examples to follow along: the section provides only an overview of the code, without complete listings.&lt;/p&gt;\n&lt;h2 id=\"interfaces-s\"&gt;&lt;a href=\"en/yql/udf/cpp.html#interfaces-s\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Interfaces (С++)&lt;/span&gt;&lt;/a&gt;Interfaces (С++)&lt;/h2&gt;\n&lt;h3 id=\"tunboxedvalue-udfvalueh\"&gt;&lt;a href=\"en/yql/udf/cpp.html#tunboxedvalue-udfvalueh\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;TUnboxedValue (udfvalue.h)&lt;/span&gt;&lt;/a&gt;TUnboxedValue (udf_value.h)&lt;/h3&gt;\n&lt;p&gt;Wrapper class for typed data. It provides a set of constructors for creating composite data types from primitive types along with a set of helpers for working with the former.&lt;/p&gt;\n&lt;p&gt;Numbers, intervals, dates (including dates with a timezone), and short strings up to 14 bytes are stored by value; the &lt;code&gt;IsEmbedded()&lt;/code&gt; method returns &lt;code&gt;true&lt;/code&gt; for them. Strings larger than 14 bytes are stored by pointer.&lt;/p&gt;\n&lt;h3 id=\"tunboxedvaluepodudfvalueh\"&gt;&lt;a href=\"en/yql/udf/cpp.html#tunboxedvaluepodudfvalueh\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;TUnboxedValuePod(udfvalue.h)&lt;/span&gt;&lt;/a&gt;TUnboxedValuePod(udf_value.h)&lt;/h3&gt;\n&lt;p&gt;It is a base class for TUnboxedValue. It does not&lt;br /&gt;\nautomatically count references to its value, unlike its subclass, which does it in the constructor and destructor. The key point here is that the TUnboxedValuePod class does not have constructors and destructors. It implements the entire logic of working with&lt;br /&gt;\ntyped data.&lt;/p&gt;\n&lt;h3 id=\"ivaluebuilder-udfvaluebuilderh\"&gt;&lt;a href=\"en/yql/udf/cpp.html#ivaluebuilder-udfvaluebuilderh\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;IValueBuilder (udfvaluebuilder.h)&lt;/span&gt;&lt;/a&gt;IValueBuilder (udf_value_builder.h)&lt;/h3&gt;\n&lt;p&gt;The Run method must return TUnboxedValue. For numeric types, you can use the type constructor, for example, &lt;code&gt;return TUnboxedValue&amp;lt;ui32&amp;gt;(123);&lt;/code&gt;. To create TUnboxedValue with more complex content, you can pass IValueBuilder to the Run method. It can be used to call one of the &lt;code&gt;New***&lt;/code&gt; methods to get the &lt;code&gt;I***ValueBuilder&lt;/code&gt; interface, where *** is a String, Struct, Dict, or another type. Use this to add type-specific elements and then call &lt;code&gt;Build&lt;/code&gt; to get the filled TUnboxedValue.&lt;br /&gt;\nYou can also create a Struct or Tuple with preallocation to store the contents. To do this, call the corresponding method &lt;code&gt;New***(const TType* type, TUnboxedValue*&amp;amp; items)&lt;/code&gt; and fill the items.&lt;/p&gt;\n&lt;p&gt;See &lt;a href=\"https://github.com/ytsaurus/ytsaurus/tree/main/yql/essentials/udfs/examples/structs\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;yql/essentials/udfs/examples/structs&lt;/a&gt; for an example with structs.&lt;/p&gt;\n&lt;h3 id=\"tboxedvalue-udfvalueh\"&gt;&lt;a href=\"en/yql/udf/cpp.html#tboxedvalue-udfvalueh\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;TBoxedValue (udfvalue.h)&lt;/span&gt;&lt;/a&gt;TBoxedValue (udf_value.h)&lt;/h3&gt;\n&lt;p&gt;A typical UDF class inherits from TBoxedValue and, in addition to the constructor, overrides the Run method where the main logic for handling one particular call should be placed. The IValueBuilder interface (more on it below below) and the passed arguments in the form of the TUnboxedValue array are passed to the Run arguments.&lt;/p&gt;\n&lt;p&gt;In the constructor, you can store a state in private class variables. Thus, a specific object of our TBoxedValue subclass becomes a callable value with potentially unique behavior.&lt;/p&gt;\n&lt;p&gt;For simple UDFs (without using YQL structures, C++ templates, inheritance, and so on), you can use the &lt;code&gt;SIMPLE_UDF(udfName, signature)&lt;/code&gt; macro (you can find it in &lt;code&gt;udf_helpers.h&lt;/code&gt;). &lt;code&gt;signature&lt;/code&gt; is specified as &lt;code&gt;returnType(arg1, arg2, ..., argN)&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Example:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs cpp\"&gt;&lt;span class=\"hljs-built_in\"&gt;SIMPLE_UDF&lt;/span&gt;(TAbs, &lt;span class=\"hljs-built_in\"&gt;ui64&lt;/span&gt;(i64)) {\n    i64 input = args[&lt;span class=\"hljs-number\"&gt;0&lt;/span&gt;].&lt;span class=\"hljs-built_in\"&gt;Get&lt;/span&gt;&amp;lt;i64&amp;gt;();\n    ui64 result = &lt;span class=\"hljs-built_in\"&gt;static_cast&lt;/span&gt;&amp;lt;ui64&amp;gt;(input &amp;gt;= &lt;span class=\"hljs-number\"&gt;0&lt;/span&gt; ? input : -input);\n    &lt;span class=\"hljs-keyword\"&gt;return&lt;/span&gt; &lt;span class=\"hljs-built_in\"&gt;TUnboxedValue&lt;/span&gt;(result);\n}\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"110\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-110\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-110\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-110.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;The function will be registered as &lt;code&gt;Abs&lt;/code&gt;, the argument type is &lt;code&gt;i64&lt;/code&gt;, and the result is &lt;code&gt;ui64&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;An example where a successful result is not guaranteed:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs cpp\"&gt;&lt;span class=\"hljs-built_in\"&gt;SIMPLE_UDF&lt;/span&gt;(TParseDuration, &lt;span class=\"hljs-built_in\"&gt;TOptional&lt;/span&gt;&amp;lt;ui64&amp;gt;(&lt;span class=\"hljs-type\"&gt;char&lt;/span&gt;*)) {\n    TDuration result;\n    &lt;span class=\"hljs-keyword\"&gt;auto&lt;/span&gt; input = args[&lt;span class=\"hljs-number\"&gt;0&lt;/span&gt;].&lt;span class=\"hljs-built_in\"&gt;AsStringRef&lt;/span&gt;();\n    &lt;span class=\"hljs-type\"&gt;bool&lt;/span&gt; success = TDuration::&lt;span class=\"hljs-built_in\"&gt;TryParse&lt;/span&gt;(input, result);\n    &lt;span class=\"hljs-keyword\"&gt;return&lt;/span&gt; success ? TUnboxedValue::&lt;span class=\"hljs-built_in\"&gt;Optional&lt;/span&gt;(result.&lt;span class=\"hljs-built_in\"&gt;Seconds&lt;/span&gt;()) : &lt;span class=\"hljs-built_in\"&gt;TUnboxedValue&lt;/span&gt;();\n}\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"117\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-117\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-117\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-117.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;&lt;code&gt;Optional (type)&lt;/code&gt; (&lt;a href=\"en/yql/types/optional.html\"&gt;nullable type&lt;/a&gt;) means that a value of the specified type may be missing (for example, if there is an error). In SQL, you can use the &lt;code&gt;IS [NOT] NULL&lt;/code&gt; expression to check for this type in the result.&lt;/p&gt;\n&lt;h3 id=\"iudfmodule-udfregistratorh\"&gt;&lt;a href=\"en/yql/udf/cpp.html#iudfmodule-udfregistratorh\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;IUdfModule (udfregistrator.h)&lt;/span&gt;&lt;/a&gt;IUdfModule (udf_registrator.h)&lt;/h3&gt;\n&lt;p&gt;For common modules, you can use the &lt;code&gt;SIMPLE_MODULE(moduleName, udfs...)&lt;/code&gt; macro (you can find it in &lt;code&gt;udf_helpers.h&lt;/code&gt;):&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;The first argument is the name of the module class; when registering, the &lt;code&gt;T&lt;/code&gt; prefix and the &lt;code&gt;Module&lt;/code&gt; suffix will be removed.&lt;/li&gt;\n&lt;li&gt;Next is a list of N constituent UDFs; when registering them, only the &lt;code&gt;T&lt;/code&gt; prefix will be removed.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;In the example &lt;code&gt;SIMPLE_MODULE(TFooModule, TBar, TBaz)&lt;/code&gt;, the &lt;code&gt;Foo&lt;/code&gt; module with two UDFs (&lt;code&gt;Bar&lt;/code&gt; and &lt;code&gt;Baz&lt;/code&gt;) will be available from YQL after registration (more on registration below).&lt;/p&gt;\n&lt;h4 id=\"manual-module-implementation\"&gt;&lt;a href=\"en/yql/udf/cpp.html#manual-module-implementation\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Manual module implementation&lt;/span&gt;&lt;/a&gt;Manual module implementation&lt;/h4&gt;\n&lt;p&gt;A typical module class inherits from IUdfModule and must implement two methods:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;GetAllFunctionNames&lt;/code&gt;: In the passed &lt;code&gt;IFunctionNamesSink&lt;/code&gt;, you need to call the &lt;code&gt;Add(name)&lt;/code&gt; method for each UDF included in the module.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;BuildFunctionTypeInfo&lt;/code&gt;: Using the passed UDF name and Type Config, you need to call on the passed &lt;code&gt;IFunctionTypeInfoBuilder&lt;/code&gt;:\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;Args()-&amp;gt;Add&amp;lt;ui32&amp;gt;()[-&amp;gt;Add(foo)-&amp;gt;Add...].Done()&lt;/code&gt;:\n&lt;ul&gt;\n&lt;li&gt;To specify arguments and their types, for numbers and strings, you can specify the argument type using a template.&lt;/li&gt;\n&lt;li&gt;You can describe a composite type, such as a Struct or Dict, using the same-name &lt;code&gt;IFunctionTypeInfoBuilder&lt;/code&gt; method, then passing it to the &lt;code&gt;Add&lt;/code&gt; argument. For example:&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;/ul&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs cpp\"&gt;ui32 a = &lt;span class=\"hljs-number\"&gt;0&lt;/span&gt;;\nui32 b = &lt;span class=\"hljs-number\"&gt;0&lt;/span&gt;;\n&lt;span class=\"hljs-keyword\"&gt;auto&lt;/span&gt; foo = builder.&lt;span class=\"hljs-built_in\"&gt;Struct&lt;/span&gt;()-&amp;gt;&lt;span class=\"hljs-built_in\"&gt;AddField&lt;/span&gt;&amp;lt;&lt;span class=\"hljs-type\"&gt;char&lt;/span&gt;*&amp;gt;(&lt;span class=\"hljs-string\"&gt;\"A\"&lt;/span&gt;, &amp;amp;a).&lt;span class=\"hljs-built_in\"&gt;AddField&lt;/span&gt;&amp;lt;ui32&amp;gt;(&lt;span class=\"hljs-string\"&gt;\"B\"&lt;/span&gt;, &amp;amp;b).&lt;span class=\"hljs-built_in\"&gt;Build&lt;/span&gt;();\nbuilder.&lt;span class=\"hljs-built_in\"&gt;Args&lt;/span&gt;()-&amp;gt;&lt;span class=\"hljs-built_in\"&gt;Add&lt;/span&gt;(foo);\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"179\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-179\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-179\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-179.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;ul&gt;\n&lt;li&gt;When describing types like &lt;code&gt;builder.List()-&amp;gt;...&lt;/code&gt;, you should copy examples of others as carefully as possible: calling a chain of builder methods in a wrong sequence or with wrong arguments often compiles fine, but crashes at runtime with a non-trivial backtrace. Example of such a chain:&lt;/li&gt;\n&lt;/ul&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs cpp\"&gt;&lt;span class=\"hljs-comment\"&gt;// udf returns list of lists of char*&lt;/span&gt;\n&lt;span class=\"hljs-keyword\"&gt;auto&lt;/span&gt; retType = buider.&lt;span class=\"hljs-built_in\"&gt;List&lt;/span&gt;()-&amp;gt;&lt;span class=\"hljs-built_in\"&gt;Item&lt;/span&gt;(builder.&lt;span class=\"hljs-built_in\"&gt;List&lt;/span&gt;()-&amp;gt;&lt;span class=\"hljs-built_in\"&gt;Item&lt;/span&gt;&amp;lt;&lt;span class=\"hljs-type\"&gt;char&lt;/span&gt;*&amp;gt;().&lt;span class=\"hljs-built_in\"&gt;Build&lt;/span&gt;()).&lt;span class=\"hljs-built_in\"&gt;Build&lt;/span&gt;(); &lt;span class=\"hljs-comment\"&gt;// Correct&lt;/span&gt;\n&lt;span class=\"hljs-keyword\"&gt;auto&lt;/span&gt; retType = buider.&lt;span class=\"hljs-built_in\"&gt;List&lt;/span&gt;()-&amp;gt;&lt;span class=\"hljs-built_in\"&gt;Item&lt;/span&gt;&amp;lt;&lt;span class=\"hljs-type\"&gt;char&lt;/span&gt;*&amp;gt;().&lt;span class=\"hljs-built_in\"&gt;Build&lt;/span&gt;(); &lt;span class=\"hljs-comment\"&gt;// Wrong type, coredump with backtrace in casting to string deep in validating&lt;/span&gt;\n&lt;span class=\"hljs-keyword\"&gt;auto&lt;/span&gt; retType = buider.&lt;span class=\"hljs-built_in\"&gt;List&lt;/span&gt;()-&amp;gt;&lt;span class=\"hljs-built_in\"&gt;Build&lt;/span&gt;(); &lt;span class=\"hljs-comment\"&gt;// No type at all, coredump with attempt to dereference nullptr deep in type machinery&lt;/span&gt;\nbuilder.&lt;span class=\"hljs-built_in\"&gt;Returns&lt;/span&gt;(retType);\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"187\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-187\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-187\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-187.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;ul&gt;\n&lt;li&gt;The arguments also pass the &lt;code&gt;ui32 flags&lt;/code&gt; bitmask, which at the time of writing can contain only &lt;code&gt;(cpp)TFlags::TypesOnly&lt;/code&gt; that, if present, does not require calling &lt;code&gt;builder.Implementation(new TMyUdf);&lt;/code&gt; for the UDF corresponding to the passed name.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h3 id=\"iregistrator-udfregistratorh\"&gt;&lt;a href=\"en/yql/udf/cpp.html#iregistrator-udfregistratorh\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;IRegistrator (udfregistrator.h)&lt;/span&gt;&lt;/a&gt;IRegistrator (udf_registrator.h)&lt;/h3&gt;\n&lt;p&gt;For simplified module registration in the system, we recommend using a macro:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs cpp\"&gt;&lt;span class=\"hljs-built_in\"&gt;REGISTER_MODULES&lt;/span&gt;(\n    TFooModule,\n    TBarModule&amp;lt;&lt;span class=\"hljs-literal\"&gt;true&lt;/span&gt;&amp;gt;,\n    TBarModule&amp;lt;&lt;span class=\"hljs-literal\"&gt;false&lt;/span&gt;&amp;gt;\n)\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"201\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-201\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-201\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-201.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;In this case, the module name is taken from the &lt;code&gt;Name()&lt;/code&gt; method that must return &lt;code&gt;TStringRef&lt;/code&gt; by value; the &lt;code&gt;SIMPLE_MODULE&lt;/code&gt; macro creates it automatically.&lt;/p&gt;\n&lt;h4 id=\"alternative-method-for-advanced-users\"&gt;&lt;a href=\"en/yql/udf/cpp.html#alternative-method-for-advanced-users\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Alternative method for advanced users&lt;/span&gt;&lt;/a&gt;Alternative method for advanced users&lt;/h4&gt;\n&lt;p&gt;You need to declare the &lt;code&gt;Register&lt;/code&gt; function of the following form, then register the module(s) in the passed interface and export the ABI version:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs cpp\"&gt;&lt;span class=\"hljs-keyword\"&gt;extern&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;\"C\"&lt;/span&gt; &lt;span class=\"hljs-function\"&gt;YQL_UDF_API &lt;span class=\"hljs-type\"&gt;void&lt;/span&gt; &lt;span class=\"hljs-title\"&gt;Register&lt;/span&gt;&lt;span class=\"hljs-params\"&gt;(NKikimr::NUdf::IRegistrator&amp;amp; registrator, ui32 flags)&lt;/span&gt;\n&lt;/span&gt;{\n     registrator-&amp;gt;&lt;span class=\"hljs-built_in\"&gt;AddModule&lt;/span&gt;(&lt;span class=\"hljs-string\"&gt;\"Foo\"&lt;/span&gt;, &lt;span class=\"hljs-keyword\"&gt;new&lt;/span&gt; NDetail::&lt;span class=\"hljs-built_in\"&gt;TFooModule&lt;/span&gt;(flags));\n}\n\n&lt;span class=\"hljs-keyword\"&gt;extern&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;\"C\"&lt;/span&gt; &lt;span class=\"hljs-function\"&gt;YQL_UDF_API ui32 &lt;span class=\"hljs-title\"&gt;AbiVersion&lt;/span&gt;&lt;span class=\"hljs-params\"&gt;()&lt;/span&gt;\n&lt;/span&gt;{\n    &lt;span class=\"hljs-keyword\"&gt;return&lt;/span&gt; &lt;span class=\"hljs-built_in\"&gt;CurrentAbiVersion&lt;/span&gt;();\n}\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"211\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-211\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-211\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-211.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;You can get the list of flags with &lt;code&gt;IUdfModule::TFlags&lt;/code&gt;. At the time of writing, only &lt;code&gt;TypesOnly&lt;/code&gt; is implemented. It is used as an indication that no real computations will be performed yet, because the computation graph is still being built, and only function signatures are required at this stage.&lt;/p&gt;\n&lt;h3 id=\"exception-and-error-handling\"&gt;&lt;a href=\"en/yql/udf/cpp.html#exception-and-error-handling\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Exception and error handling&lt;/span&gt;&lt;/a&gt;Exception and error handling&lt;/h3&gt;\n&lt;p&gt;To return fatal exceptions to the user, use the following block:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs cpp\"&gt;&lt;span class=\"hljs-keyword\"&gt;try&lt;/span&gt; {\n   ...\n} &lt;span class=\"hljs-built_in\"&gt;catch&lt;/span&gt; (&lt;span class=\"hljs-type\"&gt;const&lt;/span&gt; std::exception&amp;amp; e) {\n    &lt;span class=\"hljs-built_in\"&gt;UdfTerminate&lt;/span&gt;(e.&lt;span class=\"hljs-built_in\"&gt;what&lt;/span&gt;());\n}\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"221\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-221\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-221\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-221.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Instead of &lt;code&gt;e.what()&lt;/code&gt;, you can write a human-readable error description if possible.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Attention&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;We strongly recommend against completely terminating program execution using &lt;code&gt;abort&lt;/code&gt;, &lt;code&gt;exit&lt;/code&gt;, &lt;code&gt;Y_ABORT_UNLESS&lt;/code&gt;, &lt;code&gt;Y_ABORT&lt;/code&gt;, and other similar mechanisms from UDF code, because this would limit its scope to environments where a separate process is created for each calculation. The &lt;code&gt;UdfTerminate&lt;/code&gt; implementation is aware of the current environment and will invoke the error handling mechanism it expects.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"en/yql/udf/cpp.md","sourcePath":"en/yql/udf/cpp.md"},"headings":[{"title":"Introduction","href":"en/yql/udf/cpp.html#introduction","level":2},{"title":"Terminology","href":"en/yql/udf/cpp.html#terminology","level":2},{"title":"Examples","href":"en/yql/udf/cpp.html#examples","level":2},{"title":"Interfaces (С++)","href":"en/yql/udf/cpp.html#interfaces-s","level":2,"items":[{"title":"TUnboxedValue (udf_value.h)","href":"en/yql/udf/cpp.html#tunboxedvalue-udfvalueh","level":3},{"title":"TUnboxedValuePod(udf_value.h)","href":"en/yql/udf/cpp.html#tunboxedvaluepodudfvalueh","level":3},{"title":"IValueBuilder (udf_value_builder.h)","href":"en/yql/udf/cpp.html#ivaluebuilder-udfvaluebuilderh","level":3},{"title":"TBoxedValue (udf_value.h)","href":"en/yql/udf/cpp.html#tboxedvalue-udfvalueh","level":3},{"title":"IUdfModule (udf_registrator.h)","href":"en/yql/udf/cpp.html#iudfmodule-udfregistratorh","level":3,"items":[{"title":"Manual module implementation","href":"en/yql/udf/cpp.html#manual-module-implementation","level":4}]},{"title":"IRegistrator (udf_registrator.h)","href":"en/yql/udf/cpp.html#iregistrator-udfregistratorh","level":3,"items":[{"title":"Alternative method for advanced users","href":"en/yql/udf/cpp.html#alternative-method-for-advanced-users","level":4}]},{"title":"Exception and error handling","href":"en/yql/udf/cpp.html#exception-and-error-handling","level":3}]}],"title":"Developing UDFs in C++"},"router":{"pathname":"en/yql/udf/cpp","depth":4,"base":"../../../"},"lang":"en","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/en/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-a29ea7877730322f2ce693378d06d02ac2b374cd-en","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
