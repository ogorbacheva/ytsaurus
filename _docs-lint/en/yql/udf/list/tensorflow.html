            {"data":{"leading":false,"html":"&lt;p&gt;Using &lt;a href=\"https://www.tensorflow.org\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;TensorFlow&lt;/a&gt; computational graphs.&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;TensorFlow::InitSession(\n  String, -- path to the computational graph serialized in the protobuf format (the only mandatory agrument)\n  Bool?, -- EnableMKLDNN, enable MKLDNN https://01.org/mkl-dnn\n  Bool?, -- MKLCBWRCompatible, enable SSE2 compatibility for MKL https://software.intel.com/en-us/mkl\n  Bool?, -- MKLDNNUseWeightsAsGiven, false by default\n  Bool?, -- AllowSoftPlacement, true by default\n  Int32?, -- IntraOpParallelismThreads, 0 by default\n  Int32?, -- InterOpParallelismThreads, 0 by default\n) -&amp;gt; Resource&amp;lt;TensorFlow.Session&amp;gt; -- pointer to the TensorFlow session with an initialized computational graph\n\nTensorFlow::RunBatch(\n  Resource&amp;lt;TensorFlow.Session&amp;gt;, -- result of TensorFlow::InitSession\n  List&amp;lt;Struct&amp;lt;\n    PassThrough:* -- arbitrary data passed through the function without change\n    *:* -- names of other fields correspond to computational graph input names that will be passed to TensorFlow,\n        -- and fields' data types correspond to tensor forms; a primitive data type corresponds to a scalar\n        -- tensor, a list — to a vector. Matrices are not supported at the moment.\n  &amp;gt;&amp;gt;,\n  Type&amp;lt;Struct&amp;lt;*:*&amp;gt;&amp;gt;, -- description of graph outputs that must be calculated like inputs\n  List&amp;lt;String&amp;gt;?, -- TargetNodeNames, an optional list of graph node names that must be calculated, but not returned\n  Uint32?, -- BatchSize, 128 by default\n  Uint32?, -- MinVectorSize, 1 by default. Lets you adjust input vectors to the specified length\n           -- if their input lengths differ and are less than or equal to the specified length.\n           -- If the argument isn't specified, vector lengths are adjusted to the maximum length within the batch.\n) -&amp;gt; List&amp;lt;Struct&amp;lt;\n  PassThrough:* -- passed to the PassThrough argument without change,\n  *:* -- other fields correspond to the data type specified in the third argument\n&amp;gt;&amp;gt; -- result\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"3\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-3\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-3\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-3.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;&lt;code&gt;TensorFlow::RunBatch&lt;/code&gt; is a fairly complex polymorphic function designed to be executed in &lt;a href=\"en/yql/syntax/process.html\"&gt;PROCESS&lt;/a&gt;. Therefore, we strongly recommend that you review the example below.&lt;/p&gt;\n&lt;h2 id=\"usage-example\"&gt;&lt;a href=\"en/yql/udf/list/tensorflow.html#usage-example\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Usage example&lt;/span&gt;&lt;/a&gt;Usage example&lt;/h2&gt;\n&lt;p&gt;&lt;strong&gt;Task:&lt;/strong&gt; given email address, guess the gender of it's owner using the TensorFlow and pre-trained LSTM neural network.&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Input table &lt;code&gt;emails_sample&lt;/code&gt; data example&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;table&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;\n&lt;p&gt;&lt;strong&gt;email&lt;/strong&gt;&lt;/p&gt;\n&lt;/td&gt;\n&lt;td&gt;\n&lt;p&gt;&lt;strong&gt;uid&lt;/strong&gt;&lt;/p&gt;\n&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;\n&lt;p&gt;\"ayse.betul@list.ru\"&lt;/p&gt;\n&lt;/td&gt;\n&lt;td&gt;\n&lt;p&gt;8401912741484409541&lt;/p&gt;\n&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;\n&lt;p&gt;\"gkorchigina@advisegroup.ru\"&lt;/p&gt;\n&lt;/td&gt;\n&lt;td&gt;\n&lt;p&gt;7443540151492739379&lt;/p&gt;\n&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;\n&lt;p&gt;\"derunova@hyva.ru\"&lt;/p&gt;\n&lt;/td&gt;\n&lt;td&gt;\n&lt;p&gt;1206408241455208802&lt;/p&gt;\n&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;\n&lt;p&gt;\"n.tohtaeva@apex-realty.ru\"&lt;/p&gt;\n&lt;/td&gt;\n&lt;td&gt;\n&lt;p&gt;8401934471495213920&lt;/p&gt;\n&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;\n&lt;p&gt;\"danya_kuzya11@topservice.od.ua\"&lt;/p&gt;\n&lt;/td&gt;\n&lt;td&gt;\n&lt;p&gt;9354031741499148496&lt;/p&gt;\n&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;\n&lt;p&gt;\"e.a.abrosimova@hyva.ru\"&lt;/p&gt;\n&lt;/td&gt;\n&lt;td&gt;\n&lt;p&gt;1206415791497489033&lt;/p&gt;\n&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;\n&lt;p&gt;\"muratguney@tut.by\"&lt;/p&gt;\n&lt;/td&gt;\n&lt;td&gt;\n&lt;p&gt;84019341499566593&lt;/p&gt;\n&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;\n&lt;p&gt;\"juriy647@zakrepi.ru\"&lt;/p&gt;\n&lt;/td&gt;\n&lt;td&gt;\n&lt;p&gt;7443595151476837533&lt;/p&gt;\n&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;\n&lt;p&gt;\"inginiringstroy@bodo.ua\"&lt;/p&gt;\n&lt;/td&gt;\n&lt;td&gt;\n&lt;p&gt;120641461502424396&lt;/p&gt;\n&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;\n&lt;p&gt;\"homuncule@fenixrostov.ru\"&lt;/p&gt;\n&lt;/td&gt;\n&lt;td&gt;\n&lt;p&gt;8401933951498412781&lt;/p&gt;\n&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;\n&lt;p&gt;\"vetal1984@72.ru\"&lt;/p&gt;\n&lt;/td&gt;\n&lt;td&gt;\n&lt;p&gt;7443588691497078993&lt;/p&gt;\n&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;\n&lt;p&gt;\"botagoz@game-forest.com\"&lt;/p&gt;\n&lt;/td&gt;\n&lt;td&gt;\n&lt;p&gt;1206414471493466146&lt;/p&gt;\n&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;\n&lt;p&gt;\"kent2010@etvp.perm.ru\"&lt;/p&gt;\n&lt;/td&gt;\n&lt;td&gt;\n&lt;p&gt;8401933051457890411&lt;/p&gt;\n&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;\n&lt;p&gt;\"gordeeva@lider-exp.ru\"&lt;/p&gt;\n&lt;/td&gt;\n&lt;td&gt;\n&lt;p&gt;7443585201492797494&lt;/p&gt;\n&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;\n&lt;p&gt;\"a.vakish@tut.by\"&lt;/p&gt;\n&lt;/td&gt;\n&lt;td&gt;\n&lt;p&gt;1206414051498009965&lt;/p&gt;\n&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;\n&lt;p&gt;\"d.volia.pinsk@b-urist.ru\"&lt;/p&gt;\n&lt;/td&gt;\n&lt;td&gt;\n&lt;p&gt;8401932351484247832&lt;/p&gt;\n&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;\n&lt;p&gt;\"juravleva.e@rambler.ru\"&lt;/p&gt;\n&lt;/td&gt;\n&lt;td&gt;\n&lt;p&gt;7443577411470618706&lt;/p&gt;\n&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;\n&lt;p&gt;\"hr.pers.specialist7@prizyvanet.ru\"&lt;/p&gt;\n&lt;/td&gt;\n&lt;td&gt;\n&lt;p&gt;1206412411504975868&lt;/p&gt;\n&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;\n&lt;p&gt;\"sales106@belydom.ru\"&lt;/p&gt;\n&lt;/td&gt;\n&lt;td&gt;\n&lt;p&gt;8401929831460458776&lt;/p&gt;\n&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;\n&lt;p&gt;\"r.zinatullin@smum.biz\"&lt;/p&gt;\n&lt;/td&gt;\n&lt;td&gt;\n&lt;p&gt;7443574961501375635&lt;/p&gt;\n&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;\n&lt;p&gt;\"dpm.spec.delivery.rent2@mgllojistik.com\"&lt;/p&gt;\n&lt;/td&gt;\n&lt;td&gt;\n&lt;p&gt;1206412411502352831&lt;/p&gt;\n&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;\n&lt;p&gt;\"ekaterina@rc.yartel.ru\"&lt;/p&gt;\n&lt;/td&gt;\n&lt;td&gt;\n&lt;p&gt;8401921921456190987&lt;/p&gt;\n&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;\n&lt;p&gt;\"alex.krause@aktivdengi.com\"&lt;/p&gt;\n&lt;/td&gt;\n&lt;td&gt;\n&lt;p&gt;7443572251501358851&lt;/p&gt;\n&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;\n&lt;p&gt;\"acc.invest.other@smpvo.ru\"&lt;/p&gt;\n&lt;/td&gt;\n&lt;td&gt;\n&lt;p&gt;1206412411498937658&lt;/p&gt;\n&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;\n&lt;p&gt;\"turris.secretary-r@n-h-s.ru\"&lt;/p&gt;\n&lt;/td&gt;\n&lt;td&gt;\n&lt;p&gt;8401916371502363695&lt;/p&gt;\n&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;/div&gt;&lt;/details&gt;\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;PRAGMA yt.DataSizePerJob = \"128M\"; -- as this computation is quite CPU intensive,\n                                   -- it's a good idea to request smaller\n                                   -- data size per job\nPRAGMA file(\"email.pb\", \"&amp;lt;location of serialized graph&amp;gt;\");\n$session = TensorFlow::InitSession(\n    FilePath(\"email.pb\") -- path to TensorFlow graph definition\n);\n\nPRAGMA library(\"char_table.sql\"); -- treat attached file as source for imports\nIMPORT char_table SYMBOLS $char_to_float; -- import lambda from library that converts chars of emails\n                                          -- the same way as it has been done during model training\n\n-- Lambda function to preprocess emails:\n$email_to_float_vector = ($email) -&amp;gt; {\n    $cut = FIND($email, \"@\"); -- keep only the login\n    $cut = MIN_OF($cut, 20u) ?? 20u;\n    $email = SUBSTRING($email, 0, $cut); -- cut long logins too\n    $email_bytes = String::ToByteList($email); -- String to list of bytes\n    RETURN ListFlatMap($email_bytes, $char_to_float); -- apply lambda\n};\n\n$input = (\n    SELECT\n        $email_to_float_vector(email) AS input_1, -- the name of column\n                                                  -- should match the name\n                                                  -- of TensorFlow graph\n                                                  -- input\n        TableRow() AS PassThrough -- special column name to pass\n                                  -- any data through the TensorFlow\n                                  -- batch mode, in this example\n                                  -- the whole input row\n    FROM emails_sample);\n--------------------------------------------------------------------------------\n-- Conventions on border between TensorFlow and YQL:\n-- - While name of input column should match the name of graph input,\n--   it's type should match the tensor shape and data type.\n-- - Supported data types: Float, Double, Int32, Int64, Uint8, Bool\n-- - List&amp;lt;...&amp;gt; means vector, while just data type - scalar,\n--   matrices and other shapes are not supported yet.\n-- - This model has only one input, but there might be many.\n-- - As you'll see below, the same rules apply to graph output.\n-- - PassThrough column is currently required, but may become optional\n--   in the future.\n--------------------------------------------------------------------------------\n\n$processed = (PROCESS $input\nUSING TensorFlow::RunBatch( -- Apply TensorFlow graph in batches\n    $session,\n    TableRows(), -- Special name for the iterator over table rows\n    -- Description of graph output to compute:\n    Struct&amp;lt;network_output:List&amp;lt;Float&amp;gt;&amp;gt;,\n    -- - Each struct member represents one graph output.\n    -- - Name should match the one used during training.\n    -- - Mapping between tensors and YQL types is the same\n    --   as with input.\n    ListCreate(String), -- TargetNodeNames\n    128,                  -- BatchSize\n    20                    -- MinVectorSize\n));\n\nSELECT\n    network_output[0] ?? 0.0f AS score, -- the result of gender guess given email:\n                                        -- - close to 0.0 means female\n                                        -- - close to 1.0 means male\n                                        -- - close to 0.5 means \"not sure\"\n    PassThrough.email AS email, -- the original email\n    PassThrough.yandexuid AS yandexuid -- other column from input\nFROM $processed;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"336\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-336\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-336\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-336.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"style":["_assets/cut-extension.css"],"script":["_assets/cut-extension.js"],"vcsPath":"en/yql/udf/list/tensorflow.md","sourcePath":"en/yql/udf/list/tensorflow.md"},"headings":[{"title":"Usage example","href":"en/yql/udf/list/tensorflow.html#usage-example","level":2}],"title":"TensorFlow UDF"},"router":{"pathname":"en/yql/udf/list/tensorflow","depth":5,"base":"../../../../"},"lang":"en","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/en/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-a29ea7877730322f2ce693378d06d02ac2b374cd-en","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
