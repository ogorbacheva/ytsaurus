        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;Functions for ASCII strings:&lt;/p&gt;\n&lt;h2 id=\"list-of-functions\"&gt;&lt;a href=\"en/yql/udf/list/string.html#list-of-functions\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;List of functions&lt;/span&gt;&lt;/a&gt;List of functions&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;String::Base64Encode(String{Flags:AutoMap}) -&amp;gt; String&lt;/code&gt;&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;String::Base64Decode(String) -&amp;gt; String?&lt;/code&gt;&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;String::Base64StrictDecode(String) -&amp;gt; String?&lt;/code&gt;&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;String::EscapeC(String{Flags:AutoMap}) -&amp;gt; String&lt;/code&gt;&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;String::UnescapeC(String{Flags:AutoMap}) -&amp;gt; String&lt;/code&gt;&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;String::HexEncode(String{Flags:AutoMap}) -&amp;gt; String&lt;/code&gt;&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;String::HexDecode(String) -&amp;gt; String?&lt;/code&gt;&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;String::EncodeHtml(String{Flags:AutoMap}) -&amp;gt; String&lt;/code&gt;&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;String::DecodeHtml(String{Flags:AutoMap}) -&amp;gt; String&lt;/code&gt;&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;String::CgiEscape(String{Flags:AutoMap}) -&amp;gt; String&lt;/code&gt;&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;String::CgiUnescape(String{Flags:AutoMap}) -&amp;gt; String&lt;/code&gt;&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;String::Strip(String{Flags:AutoMap}) -&amp;gt; String&lt;/code&gt;&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;String::Collapse(String{Flags:AutoMap}) -&amp;gt; String&lt;/code&gt;&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;String::CollapseText(String{Flags:AutoMap}, Uint64) -&amp;gt; String&lt;/code&gt;&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;String::AsciiEqualsIgnoreCase(String?, String) -&amp;gt; Bool&lt;/code&gt; Added in the version &lt;a href=\"en/yql/changelog/2025.02.html#string-module\"&gt;2025.02&lt;/a&gt;&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;String::Contains(String?, String) -&amp;gt; Bool&lt;/code&gt;&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;String::AsciiContainsIgnoreCase(String?, String) -&amp;gt; Bool&lt;/code&gt; Added in the version &lt;a href=\"en/yql/changelog/2025.02.html#string-module\"&gt;2025.02&lt;/a&gt;&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;String::Find(String{Flags:AutoMap}, String, [Uint64?]) -&amp;gt; Int64&lt;/code&gt;: Returns the first position found or -1. The optional argument is the offset from the beginning of the string.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;String::ReverseFind(String{Flags:AutoMap}, String, [Uint64?]) -&amp;gt; Int64&lt;/code&gt;: Returns the last position found or -1. The optional argument is the offset from the beginning of the string.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;String::AsciiStartsWithIgnoreCase(String?, String) -&amp;gt; Bool&lt;/code&gt; Added in the version &lt;a href=\"en/yql/changelog/2025.02.html#string-module\"&gt;2025.02&lt;/a&gt;&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;String::HasPrefix(String?, String) -&amp;gt; Bool&lt;/code&gt;&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;String::HasPrefixIgnoreCase(String?, String) -&amp;gt; Bool&lt;/code&gt; Removed in the version &lt;a href=\"en/yql/changelog/2025.02.html#string-module\"&gt;2025.02&lt;/a&gt;&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;String::StartsWith(String?, String) -&amp;gt; Bool&lt;/code&gt;&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;String::StartsWithIgnoreCase(String?, String) -&amp;gt; Bool&lt;/code&gt; Removed in the version &lt;a href=\"en/yql/changelog/2025.02.html#string-module\"&gt;2025.02&lt;/a&gt;&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;String::AsciiEndsWithIgnoreCase(String?, String) -&amp;gt; Bool&lt;/code&gt; Added in the version &lt;a href=\"en/yql/changelog/2025.02.html#string-module\"&gt;2025.02&lt;/a&gt;&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;String::HasSuffix(String?, String) -&amp;gt; Bool&lt;/code&gt;&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;String::HasSuffixIgnoreCase(String?, String) -&amp;gt; Bool&lt;/code&gt; Removed in the version &lt;a href=\"en/yql/changelog/2025.02.html#string-module\"&gt;2025.02&lt;/a&gt;&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;String::EndsWith(String?, String) -&amp;gt; Bool&lt;/code&gt;&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;String::EndsWithIgnoreCase(String?, String) -&amp;gt; Bool&lt;/code&gt; Removed in the version &lt;a href=\"en/yql/changelog/2025.02.html#string-module\"&gt;2025.02&lt;/a&gt;&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;String::Substring(String{Flags:AutoMap}, [Uint64?, Uint64?]) -&amp;gt; String&lt;/code&gt;&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;String::AsciiToLower(String{Flags:AutoMap}) -&amp;gt; String&lt;/code&gt;: Changes only Latin characters. For working with other alphabets, see Unicode::ToLower&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;String::AsciiToUpper(String{Flags:AutoMap}) -&amp;gt; String&lt;/code&gt;: Changes only Latin characters. For working with other alphabets, see Unicode::ToUpper&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;String::AsciiToTitle(String{Flags:AutoMap}) -&amp;gt; String&lt;/code&gt;: Changes only Latin characters. For working with other alphabets, see Unicode::ToTitle&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;String::SplitToList( String?, String, [ DelimeterString:Bool?, SkipEmpty:Bool?, Limit:Uint64? ]) -&amp;gt; List&amp;lt;String&amp;gt;&lt;/code&gt;&lt;/p&gt;\n&lt;p&gt;The first argument is the source string&lt;br /&gt;\nThe second argument is a delimiter&lt;br /&gt;\nThe third argument includes the following parameters:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;DelimeterString:Bool? — treating a delimiter as a string (true, by default) or a set of characters \"any of\" (false)&lt;/li&gt;\n&lt;li&gt;SkipEmpty:Bool? — whether to skip empty strings in the result, is false by default&lt;/li&gt;\n&lt;li&gt;Limit:Uint64? — Limits the number of fetched components (unlimited by default); if the limit is exceeded, the raw suffix of the source string is returned in the last item&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;String::JoinFromList(List&amp;lt;String&amp;gt;{Flags:AutoMap}, String) -&amp;gt; String&lt;/code&gt;&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;String::ToByteList(List&amp;lt;String&amp;gt;{Flags:AutoMap}) -&amp;gt; List&amp;lt;Byte&amp;gt;&lt;/code&gt;&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;String::FromByteList(List&amp;lt;Uint8&amp;gt;) -&amp;gt; String&lt;/code&gt;&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;String::ReplaceAll(String{Flags:AutoMap}, String, String) -&amp;gt; String&lt;/code&gt;: Arguments: input, find, replacement&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;String::ReplaceFirst(String{Flags:AutoMap}, String, String) -&amp;gt; String&lt;/code&gt;: Arguments: input, find, replacement&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;String::ReplaceLast(String{Flags:AutoMap}, String, String) -&amp;gt; String&lt;/code&gt;: Arguments: input, find, replacement&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;String::RemoveAll(String{Flags:AutoMap}, String) -&amp;gt; String&lt;/code&gt;: The second argument is interpreted as an unordered set of characters to delete&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;String::RemoveFirst(String{Flags:AutoMap}, String) -&amp;gt; String&lt;/code&gt;: An unordered set of characters in the second argument, only the first encountered character from set is deleted&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;String::RemoveLast(String{Flags:AutoMap}, String) -&amp;gt; String&lt;/code&gt;: An unordered set of characters in the second argument, only the last encountered character from the set is deleted&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;String::ReverseBytes(String{Flags:AutoMap}) -&amp;gt; String&lt;/code&gt; - Added in the version &lt;a href=\"en/yql/changelog/2025.02.html#string-module\"&gt;2025.02&lt;/a&gt;&lt;br /&gt;\nReverses a string, treating it as a byte sequence.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;String::ReverseBits(String{Flags:AutoMap}) -&amp;gt; String&lt;/code&gt; - Added in the version &lt;a href=\"en/yql/changelog/2025.02.html#string-module\"&gt;2025.02&lt;/a&gt;&lt;br /&gt;\nReverses a string, treating it as a bit sequence.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;String::IsAscii(String{Flags:AutoMap}) -&amp;gt; Bool&lt;/code&gt;&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;String::IsAsciiSpace(String{Flags:AutoMap}) -&amp;gt; Bool&lt;/code&gt;&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;String::IsAsciiUpper(String{Flags:AutoMap}) -&amp;gt; Bool&lt;/code&gt;&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;String::IsAsciiLower(String{Flags:AutoMap}) -&amp;gt; Bool&lt;/code&gt;&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;String::IsAsciiAlpha(String{Flags:AutoMap}) -&amp;gt; Bool&lt;/code&gt;&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;String::IsAsciiAlnum(String{Flags:AutoMap}) -&amp;gt; Bool&lt;/code&gt;&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;String::IsAsciiHex(String{Flags:AutoMap}) -&amp;gt; Bool&lt;/code&gt;&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;String::LevensteinDistance(String{Flags:AutoMap}, String{Flags:AutoMap}) -&amp;gt; Uint64&lt;/code&gt;&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;String::LeftPad(String{Flags:AutoMap}, Uint64, [String?]) -&amp;gt; String&lt;/code&gt;&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;String::RightPad(String{Flags:AutoMap}, Uint64) -&amp;gt; String&lt;/code&gt;&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;String::Hex(Uint64{Flags:AutoMap}) -&amp;gt; String&lt;/code&gt;&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;String::SHex(Int64{Flags:AutoMap}) -&amp;gt; String&lt;/code&gt;&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;String::Bin(Uint64{Flags:AutoMap}) -&amp;gt; String&lt;/code&gt;&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;String::SBin(Int64{Flags:AutoMap}) -&amp;gt; String&lt;/code&gt;&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;String::HexText(String{Flags:AutoMap}) -&amp;gt; String&lt;/code&gt;&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;String::BinText(String{Flags:AutoMap}) -&amp;gt; String&lt;/code&gt;&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;String::HumanReadableDuration(Uint64{Flags:AutoMap}) -&amp;gt; String&lt;/code&gt;&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;String::HumanReadableQuantity(Uint64{Flags:AutoMap}) -&amp;gt; String&lt;/code&gt;&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;String::HumanReadableBytes(Uint64{Flags:AutoMap}) -&amp;gt; String&lt;/code&gt;&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;String::Prec(Double{Flags:AutoMap}, Uint64) -&amp;gt; String&lt;/code&gt;&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;String::Reverse(String?) -&amp;gt; String?&lt;/code&gt; Removed in the version &lt;a href=\"en/yql/changelog/2025.02.html#string-module\"&gt;2025.02&lt;/a&gt;&lt;/p&gt;\n&lt;/li&gt;\n&lt;/ul&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Alert&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;The functions from the String library don't support Cyrillic and can only work with ASCII characters. To work with UTF-8 encoded strings, use functions from &lt;a href=\"en/yql/udf/list/unicode.html\"&gt;Unicode&lt;/a&gt;.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"examples\"&gt;&lt;a href=\"en/yql/udf/list/string.html#examples\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Examples&lt;/span&gt;&lt;/a&gt;Examples&lt;/h2&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;SELECT String::Base64Encode(\"YQL\"); -- \"WVFM\"\nSELECT String::Strip(\"YQL \");       -- \"YQL\"\nSELECT String::SplitToList(\"1,2,3,4,5,6,7\", \",\", 3 as Limit); -- [\"1\", \"2\", \"3\", \"4,5,6,7\"]\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"371\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-371\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-371\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-371.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platfo
