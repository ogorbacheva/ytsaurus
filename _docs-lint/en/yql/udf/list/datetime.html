            {"data":{"leading":false,"html":"&lt;p&gt;In the DateTime module, there are two internal representation formats: &lt;code&gt;Resource&amp;lt;TM&amp;gt;&lt;/code&gt; for basic types and &lt;code&gt;Resource&amp;lt;TM64&amp;gt;&lt;/code&gt; for extended ones.&lt;/p&gt;\n&lt;p&gt;&lt;code&gt;Resource&amp;lt;TM&amp;gt;&lt;/code&gt; and &lt;code&gt;Resource&amp;lt;TM64&amp;gt;&lt;/code&gt; store the following date components:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Year (12 bits, unsigned for &lt;code&gt;Resource&amp;lt;TM&amp;gt;&lt;/code&gt;; 19 bits, signed for &lt;code&gt;Resource&amp;lt;TM64&amp;gt;&lt;/code&gt;).&lt;/li&gt;\n&lt;li&gt;Month (4 bits).&lt;/li&gt;\n&lt;li&gt;Day (5 bits).&lt;/li&gt;\n&lt;li&gt;Hour (5 bits).&lt;/li&gt;\n&lt;li&gt;Minute (6 bits).&lt;/li&gt;\n&lt;li&gt;Second (6 bits).&lt;/li&gt;\n&lt;li&gt;Microsecond (20 bits).&lt;/li&gt;\n&lt;li&gt;TimezoneId (16 bits).&lt;/li&gt;\n&lt;li&gt;DayOfYear (9 bits): Day since the beginning of the year.&lt;/li&gt;\n&lt;li&gt;WeekOfYear (6 bits): Week since the beginning of the year, January 1 is always in week 1.&lt;/li&gt;\n&lt;li&gt;WeekOfYearIso8601 (6 bits): Week of the year according to ISO 8601 (the first week is the one that includes January 4).&lt;/li&gt;\n&lt;li&gt;DayOfWeek (3 bits): Day of the week.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;If the timezone is not GMT, the components store the local time for the relevant timezone.&lt;/p&gt;\n&lt;h2 id=\"split\"&gt;&lt;a href=\"en/yql/udf/list/datetime.html#split\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Split&lt;/span&gt;&lt;/a&gt;Split&lt;/h2&gt;\n&lt;p&gt;Conversion from a primitive type to an internal representation. It's always successful on a non-empty input.&lt;/p&gt;\n&lt;h4 id=\"list-of-functions\"&gt;&lt;a href=\"en/yql/udf/list/datetime.html#list-of-functions\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;List of functions&lt;/span&gt;&lt;/a&gt;List of functions&lt;/h4&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;DateTime::Split(Date/TzDate/Datetime/TzDatetime/Timestamp/TzTimestamp{Flags:AutoMap}) -&amp;gt; Resource&amp;lt;TM&amp;gt;&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;DateTime::Split(Date32/TzDate32/Datetime64/TzDatetime64/Timestamp64/TzTimestamp64{Flags:AutoMap}) -&amp;gt; Resource&amp;lt;TM64&amp;gt;&lt;/code&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Functions that accept &lt;code&gt;Resource&amp;lt;TM&amp;gt;&lt;/code&gt; or &lt;code&gt;Resource&amp;lt;TM64&amp;gt;&lt;/code&gt; as input, can be called directly from the primitive date/time type. An implicit conversion will be made in this case by calling a relevant &lt;code&gt;Split&lt;/code&gt; function.&lt;/p&gt;\n&lt;h2 id=\"make\"&gt;&lt;a href=\"en/yql/udf/list/datetime.html#make\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Make...&lt;/span&gt;&lt;/a&gt;Make...&lt;/h2&gt;\n&lt;p&gt;Making a primitive type from an internal representation. It's always successful on a non-empty input.&lt;/p&gt;\n&lt;h4 id=\"list-of-functions1\"&gt;&lt;a href=\"en/yql/udf/list/datetime.html#list-of-functions1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;List of functions&lt;/span&gt;&lt;/a&gt;List of functions&lt;/h4&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;DateTime::MakeDate(Resource&amp;lt;TM&amp;gt;{Flags:AutoMap}) -&amp;gt; Date&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;DateTime::MakeTzDate(Resource&amp;lt;TM&amp;gt;{Flags:AutoMap}) -&amp;gt; TzDate&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;DateTime::MakeDate32(Resource&amp;lt;TM64&amp;gt;{Flags:AutoMap}) -&amp;gt; Date32&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;DateTime::MakeTzDate32(Resource&amp;lt;TM64&amp;gt;{Flags:AutoMap}) -&amp;gt; TzDate32&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;DateTime::MakeDatetime(Resource&amp;lt;TM&amp;gt;{Flags:AutoMap}) -&amp;gt; Datetime&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;DateTime::MakeTzDatetime(Resource&amp;lt;TM&amp;gt;{Flags:AutoMap}) -&amp;gt; TzDatetime&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;DateTime::MakeDatetime64(Resource&amp;lt;TM64&amp;gt;{Flags:AutoMap}) -&amp;gt; Datetime64&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;DateTime::MakeTzDatetime64(Resource&amp;lt;TM64&amp;gt;{Flags:AutoMap}) -&amp;gt; TzDatetime64&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;DateTime::MakeTimestamp(Resource&amp;lt;TM&amp;gt;{Flags:AutoMap}) -&amp;gt; Timestamp&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;DateTime::MakeTzTimestamp(Resource&amp;lt;TM&amp;gt;{Flags:AutoMap}) -&amp;gt; TzTimestamp&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;DateTime::MakeTimestamp64(Resource&amp;lt;TM64&amp;gt;{Flags:AutoMap}) -&amp;gt; Timestamp64&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;DateTime::MakeTzTimestamp64(Resource&amp;lt;TM64&amp;gt;{Flags:AutoMap}) -&amp;gt; TzTimestamp64&lt;/code&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h4 id=\"examples\"&gt;&lt;a href=\"en/yql/udf/list/datetime.html#examples\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Examples&lt;/span&gt;&lt;/a&gt;Examples&lt;/h4&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;SELECT\n    DateTime::MakeTimestamp(DateTime::Split(Datetime(\"2019-01-01T15:30:00Z\"))),\n      -- 2019-01-01T15:30:00.000000Z\n    DateTime::MakeDate(Datetime(\"2019-01-01T15:30:00Z\")),\n      -- 2019-01-01\n    DateTime::MakeTimestamp(DateTime::Split(TzDatetime(\"2019-01-01T00:00:00,Europe/Moscow\"))),\n      -- 2018-12-31T21:00:00Z (conversion to UTC)\n    DateTime::MakeDate(TzDatetime(\"2019-01-01T12:00:00,GMT\"))\n      -- 2019-01-01 (Datetime -&amp;gt; Date with implicit Split)&amp;gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"169\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-169\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-169\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-169.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"get\"&gt;&lt;a href=\"en/yql/udf/list/datetime.html#get\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Get...&lt;/span&gt;&lt;/a&gt;Get...&lt;/h2&gt;\n&lt;p&gt;Extracting a component from an internal representation.&lt;/p&gt;\n&lt;h4 id=\"list-of-functions2\"&gt;&lt;a href=\"en/yql/udf/list/datetime.html#list-of-functions2\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;List of functions&lt;/span&gt;&lt;/a&gt;List of functions&lt;/h4&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;DateTime::GetYear(Resource&amp;lt;TM&amp;gt;{Flags:AutoMap}) -&amp;gt; Uint16&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;DateTime::GetYear(Resource&amp;lt;TM64&amp;gt;{Flags:AutoMap}) -&amp;gt; Int32&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;DateTime::GetDayOfYear(Resource&amp;lt;TM&amp;gt;/Resource&amp;lt;TM64&amp;gt;{Flags:AutoMap}) -&amp;gt; Uint16&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;DateTime::GetMonth(Resource&amp;lt;TM&amp;gt;/Resource&amp;lt;TM64&amp;gt;{Flags:AutoMap}) -&amp;gt; Uint8&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;DateTime::GetMonthName(Resource&amp;lt;TM&amp;gt;/Resource&amp;lt;TM64&amp;gt;{Flags:AutoMap}) -&amp;gt; String&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;DateTime::GetWeekOfYear(Resource&amp;lt;TM&amp;gt;/Resource&amp;lt;TM64&amp;gt;{Flags:AutoMap}) -&amp;gt; Uint8&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;DateTime::GetWeekOfYearIso8601(Resource&amp;lt;TM&amp;gt;/Resource&amp;lt;TM64&amp;gt;{Flags:AutoMap}) -&amp;gt; Uint8&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;DateTime::GetDayOfMonth(Resource&amp;lt;TM&amp;gt;/Resource&amp;lt;TM64&amp;gt;{Flags:AutoMap}) -&amp;gt; Uint8&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;DateTime::GetDayOfWeek(Resource&amp;lt;TM&amp;gt;/Resource&amp;lt;TM64&amp;gt;{Flags:AutoMap}) -&amp;gt; Uint8&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;DateTime::GetDayOfWeekName(Resource&amp;lt;TM&amp;gt;/Resource&amp;lt;TM64&amp;gt;{Flags:AutoMap}) -&amp;gt; String&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;DateTime::GetHour(Resource&amp;lt;TM&amp;gt;/Resource&amp;lt;TM64&amp;gt;{Flags:AutoMap}) -&amp;gt; Uint8&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;DateTime::GetMinute(Resource&amp;lt;TM&amp;gt;/Resource&amp;lt;TM64&amp;gt;{Flags:AutoMap}) -&amp;gt; Uint8&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;DateTime::GetSecond(Resource&amp;lt;TM&amp;gt;/Resource&amp;lt;TM64&amp;gt;{Flags:AutoMap}) -&amp;gt; Uint8&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;DateTime::GetMillisecondOfSecond(Resource&amp;lt;TM&amp;gt;/Resource&amp;lt;TM64&amp;gt;{Flags:AutoMap}) -&amp;gt; Uint32&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;DateTime::GetMicrosecondOfSecond(Resource&amp;lt;TM&amp;gt;/Resource&amp;lt;TM64&amp;gt;{Flags:AutoMap}) -&amp;gt; Uint32&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;DateTime::GetTimezoneId(Resource&amp;lt;TM&amp;gt;/Resource&amp;lt;TM64&amp;gt;{Flags:AutoMap}) -&amp;gt; Uint16&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;DateTime::GetTimezoneName(Resource&amp;lt;TM&amp;gt;/Resource&amp;lt;TM64&amp;gt;{Flags:AutoMap}) -&amp;gt; String&lt;/code&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h4 id=\"examples1\"&gt;&lt;a href=\"en/yql/udf/list/datetime.html#examples1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Examples&lt;/span&gt;&lt;/a&gt;Examples&lt;/h4&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;$tm = DateTime::Split(TzDatetime(\"2019-01-09T00:00:00,Europe/Moscow\"));\n\nSELECT\n    DateTime::GetDayOfMonth($tm) as Day, -- 9\n    DateTime::GetMonthName($tm) as Month, -- \"January\"\n    DateTime::GetYear($tm) as Year, -- 2019\n    DateTime::GetTimezoneName($tm) as TzName, -- \"Europe/Moscow\"\n    DateTime::GetDayOfWeekName($tm) as WeekDay; -- \"Wednesday\"\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"269\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-269\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-269\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-269.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"update\"&gt;&lt;a href=\"en/yql/udf/list/datetime.html#update\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Update&lt;/span&gt;&lt;/a&gt;Update&lt;/h2&gt;\n&lt;p&gt;Updating one or more components in the internal representation. Returns either an updated copy or NULL, if an update produces an invalid date or other inconsistencies.&lt;/p&gt;\n&lt;h4 id=\"list-of-functions3\"&gt;&lt;a href=\"en/yql/udf/list/datetime.html#list-of-functions3\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;List of functions&lt;/span&gt;&lt;/a&gt;List of functions&lt;/h4&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;DateTime::Update(Resource&amp;lt;TM&amp;gt;{Flags:AutoMap}, [ Year:Uint16?, Month:Uint8?, Day:Uint8?, Hour:Uint8?, Minute:Uint8?, Second:Uint8?, Microsecond:Uint32?, Timezone:String? ]) -&amp;gt; Resource&amp;lt;TM&amp;gt;?\nDateTime::Update(Resource&amp;lt;TM64&amp;gt;{Flags:AutoMap}, [ Year:Int32?, Month:Uint8?, Day:Uint8?, Hour:Uint8?, Minute:Uint8?, Second:Uint8?, Microsecond:Uint32?, Timezone:String? ]) -&amp;gt; Resource&amp;lt;TM64&amp;gt;?\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"279\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-279\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-279\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-279.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h4 id=\"examples2\"&gt;&lt;a href=\"en/yql/udf/list/datetime.html#examples2\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Examples&lt;/span&gt;&lt;/a&gt;Examples&lt;/h4&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;$tm = DateTime::Split(Timestamp(\"2019-01-01T01:02:03.456789Z\"));\n\nSELECT\n    DateTime::MakeDate(DateTime::Update($tm, 2012)), -- 2012-01-01\n    DateTime::MakeDate(DateTime::Update($tm, 2000, 6, 6)), -- 2000-06-06\n    DateTime::MakeDate(DateTime::Update($tm, NULL, 2, 30)), -- NULL (February 30)\n    DateTime::MakeDatetime(DateTime::Update($tm, NULL, NULL, 31)), -- 2019-01-31T01:02:03Z\n    DateTime::MakeDatetime(DateTime::Update($tm, 15 as Hour, 30 as Minute)), -- 2019-01-01T15:30:03Z\n    DateTime::MakeTimestamp(DateTime::Update($tm, 999999 as Microsecond)), -- 2019-01-01T01:02:03.999999Z\n    DateTime::MakeTimestamp(DateTime::Update($tm, \"Europe/Moscow\" as Timezone)), -- 2018-12-31T22:02:03.456789Z (conversion to UTC)\n    DateTime::MakeTzTimestamp(DateTime::Update($tm, \"Europe/Moscow\" as Timezone)); -- 2019-01-01T01:02:03.456789,Europe/Moscow\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"283\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-283\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-283\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-283.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"from\"&gt;&lt;a href=\"en/yql/udf/list/datetime.html#from\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;From...&lt;/span&gt;&lt;/a&gt;From...&lt;/h2&gt;\n&lt;p&gt;Getting a Timestamp from the number of seconds/milliseconds/microseconds since the UTC epoch. When the Timestamp limits are exceeded, NULL is returned.&lt;/p&gt;\n&lt;h4 id=\"list-of-functions4\"&gt;&lt;a href=\"en/yql/udf/list/datetime.html#list-of-functions4\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;List of functions&lt;/span&gt;&lt;/a&gt;List of functions&lt;/h4&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;DateTime::FromSeconds(Uint32{Flags:AutoMap}) -&amp;gt; Timestamp&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;DateTime::FromSeconds64(Int64{Flags:AutoMap}) -&amp;gt; Timestamp64&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;DateTime::FromMilliseconds(Uint64{Flags:AutoMap}) -&amp;gt; Timestamp&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;DateTime::FromMilliseconds64(Int64{Flags:AutoMap}) -&amp;gt; Timestamp64&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;DateTime::FromMicroseconds(Uint64{Flags:AutoMap}) -&amp;gt; Timestamp&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;DateTime::FromMicroseconds64(Int64{Flags:AutoMap}) -&amp;gt; Timestamp64&lt;/code&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"to\"&gt;&lt;a href=\"en/yql/udf/list/datetime.html#to\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;To...&lt;/span&gt;&lt;/a&gt;To...&lt;/h2&gt;\n&lt;p&gt;Getting a number of seconds/milliseconds/microseconds since the UTC Epoch from a primitive type.&lt;/p&gt;\n&lt;h4 id=\"list-of-functions5\"&gt;&lt;a href=\"en/yql/udf/list/datetime.html#list-of-functions5\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;List of functions&lt;/span&gt;&lt;/a&gt;List of functions&lt;/h4&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;DateTime::ToSeconds(Date/Datetime/Timestamp/TzDate/TzDatetime/TzTimestamp{Flags:AutoMap}) -&amp;gt; Uint32&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;DateTime::ToSeconds(Date32/Datetime64/Timestamp64/TzDate32/TzDatetime64/TzTimestamp64{Flags:AutoMap}) -&amp;gt; Int64&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;DateTime::ToMilliseconds(Date/Datetime/Timestamp/TzDate/TzDatetime/TzTimestamp{Flags:AutoMap}) -&amp;gt; Uint64&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;DateTime::ToMilliseconds(Date32/Datetime64/Timestamp64/TzDate32/TzDatetime64/TzTimestamp64{Flags:AutoMap}) -&amp;gt; Int64&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;DateTime::ToMicroseconds(Date/Datetime/Timestamp/TzDate/TzDatetime/TzTimestamp{Flags:AutoMap}) -&amp;gt; Uint64&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;DateTime::ToMicroseconds(Date32/Datetime64/Timestamp64/TzDate32/TzDatetime64/TzTimestamp64{Flags:AutoMap}) -&amp;gt; Int64&lt;/code&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h4 id=\"examples3\"&gt;&lt;a href=\"en/yql/udf/list/datetime.html#examples3\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Examples&lt;/span&gt;&lt;/a&gt;Examples&lt;/h4&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;SELECT\n    DateTime::FromSeconds(1546304523), -- 2019-01-01T01:02:03.000000Z\n    DateTime::ToMicroseconds(Timestamp(\"2019-01-01T01:02:03.456789Z\")); -- 1546304523456789\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"369\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-369\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-369\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-369.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"interval\"&gt;&lt;a href=\"en/yql/udf/list/datetime.html#interval\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Interval...&lt;/span&gt;&lt;/a&gt;Interval...&lt;/h2&gt;\n&lt;p&gt;Conversions between &lt;code&gt;Interval&lt;/code&gt; and various time units.&lt;/p&gt;\n&lt;h4 id=\"list-of-functions6\"&gt;&lt;a href=\"en/yql/udf/list/datetime.html#list-of-functions6\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;List of functions&lt;/span&gt;&lt;/a&gt;List of functions&lt;/h4&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;DateTime::ToDays(Interval{Flags:AutoMap}) -&amp;gt; Int32&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;DateTime::ToDays(Interval64{Flags:AutoMap}) -&amp;gt; Int32&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;DateTime::ToHours(Interval{Flags:AutoMap}) -&amp;gt; Int32&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;DateTime::ToHours(Interval64{Flags:AutoMap}) -&amp;gt; Int64&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;DateTime::ToMinutes(Interval{Flags:AutoMap}) -&amp;gt; Int32&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;DateTime::ToMinutes(Interval64{Flags:AutoMap}) -&amp;gt; Int64&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;DateTime::ToSeconds(Interval{Flags:AutoMap}) -&amp;gt; Int32&lt;/code&gt; Until &lt;a href=\"en/yql/changelog/2025.03.html\"&gt;2025.03&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;DateTime::ToSeconds(Interval{Flags:AutoMap}) -&amp;gt; Int64&lt;/code&gt; Since &lt;a href=\"en/yql/changelog/2025.03.html\"&gt;2025.03&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;DateTime::ToSeconds(Interval64{Flags:AutoMap}) -&amp;gt; Int64&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;DateTime::ToMilliseconds(Interval{Flags:AutoMap}) -&amp;gt; Int64&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;DateTime::ToMilliseconds(Interval64{Flags:AutoMap}) -&amp;gt; Int64&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;DateTime::ToMicroseconds(Interval{Flags:AutoMap}) -&amp;gt; Int64&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;DateTime::ToMicroseconds(Interval64{Flags:AutoMap}) -&amp;gt; Int64&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;DateTime::IntervalFromDays(Int32{Flags:AutoMap}) -&amp;gt; Interval&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;DateTime::Interval64FromDays(Int32{Flags:AutoMap}) -&amp;gt; Interval64&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;DateTime::IntervalFromHours(Int32{Flags:AutoMap}) -&amp;gt; Interval&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;DateTime::Interval64FromHours(Int64{Flags:AutoMap}) -&amp;gt; Interval64&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;DateTime::IntervalFromMinutes(Int32{Flags:AutoMap}) -&amp;gt; Interval&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;DateTime::Interval64FromMinutes(Int64{Flags:AutoMap}) -&amp;gt; Interval64&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;DateTime::IntervalFromSeconds(Int32{Flags:AutoMap}) -&amp;gt; Interval&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;DateTime::Interval64FromSeconds(Int64{Flags:AutoMap}) -&amp;gt; Interval64&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;DateTime::IntervalFromMilliseconds(Int64{Flags:AutoMap}) -&amp;gt; Interval&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;DateTime::Interval64FromMilliseconds(Int64{Flags:AutoMap}) -&amp;gt; Interval64&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;DateTime::IntervalFromMicroseconds(Int64{Flags:AutoMap}) -&amp;gt; Interval&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;DateTime::Interval64FromMicroseconds(Int64{Flags:AutoMap}) -&amp;gt; Interval64&lt;/code&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;AddTimezone doesn't affect the output of ToSeconds() in any way, because ToSeconds() always returns GMT time.&lt;/p&gt;\n&lt;p&gt;You can also create an Interval from a string literal in the format &lt;a href=\"https://en.wikipedia.org/wiki/ISO_8601%23Durations\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;ISO 8601&lt;/a&gt;.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Warning&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;At the moment, only literals for deterministic intervals are supported. All components greater than week -- M (month) and Y (year) -- are not fixed, since the interval can be defined only considering the particular context (month, year).&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"examples4\"&gt;&lt;a href=\"en/yql/udf/list/datetime.html#examples4\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Examples&lt;/span&gt;&lt;/a&gt;Examples&lt;/h4&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;SELECT\n    DateTime::ToDays(Interval(\"PT3000M\")), -- 2\n    DateTime::IntervalFromSeconds(1000000), -- 11 days 13 hours 46 minutes 40 seconds\n    DateTime::ToDays(cast('2018-01-01' as date) - cast('2017-12-31' as date)); --1\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"525\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-525\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-525\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-525.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"startof\"&gt;&lt;a href=\"en/yql/udf/list/datetime.html#startof\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;StartOf... / EndOf... / TimeOfDay&lt;/span&gt;&lt;/a&gt;StartOf... / EndOf... / TimeOfDay&lt;/h2&gt;\n&lt;p&gt;Get the start (end) of the period including the date/time. If the result is invalid, NULL is returned. If the timezone is different from GMT, then the period start (end) is in the specified time zone.&lt;/p&gt;\n&lt;h4 id=\"list-of-functions7\"&gt;&lt;a href=\"en/yql/udf/list/datetime.html#list-of-functions7\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;List of functions&lt;/span&gt;&lt;/a&gt;List of functions&lt;/h4&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;DateTime::StartOfYear(Resource&amp;lt;TM&amp;gt;{Flags:AutoMap}) -&amp;gt; Resource&amp;lt;TM&amp;gt;?&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;DateTime::StartOfYear(Resource&amp;lt;TM64&amp;gt;{Flags:AutoMap}) -&amp;gt; Resource&amp;lt;TM64&amp;gt;?&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;DateTime::EndOfYear(Resource&amp;lt;TM&amp;gt;{Flags:AutoMap}) -&amp;gt; Resource&amp;lt;TM&amp;gt;?&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;DateTime::EndOfYear(Resource&amp;lt;TM64&amp;gt;{Flags:AutoMap}) -&amp;gt; Resource&amp;lt;TM64&amp;gt;?&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;DateTime::StartOfQuarter(Resource&amp;lt;TM&amp;gt;{Flags:AutoMap}) -&amp;gt; Resource&amp;lt;TM&amp;gt;?&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;DateTime::StartOfQuarter(Resource&amp;lt;TM64&amp;gt;{Flags:AutoMap}) -&amp;gt; Resource&amp;lt;TM64&amp;gt;?&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;DateTime::EndOfQuarter(Resource&amp;lt;TM&amp;gt;{Flags:AutoMap}) -&amp;gt; Resource&amp;lt;TM&amp;gt;?&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;DateTime::EndOfQuarter(Resource&amp;lt;TM64&amp;gt;{Flags:AutoMap}) -&amp;gt; Resource&amp;lt;TM64&amp;gt;?&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;DateTime::StartOfMonth(Resource&amp;lt;TM&amp;gt;{Flags:AutoMap}) -&amp;gt; Resource&amp;lt;TM&amp;gt;?&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;DateTime::StartOfMonth(Resource&amp;lt;TM64&amp;gt;{Flags:AutoMap}) -&amp;gt; Resource&amp;lt;TM64&amp;gt;?&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;DateTime::EndOfMonth(Resource&amp;lt;TM&amp;gt;{Flags:AutoMap}) -&amp;gt; Resource&amp;lt;TM&amp;gt;?&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;DateTime::EndOfMonth(Resource&amp;lt;TM64&amp;gt;{Flags:AutoMap}) -&amp;gt; Resource&amp;lt;TM64&amp;gt;?&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;DateTime::StartOfWeek(Resource&amp;lt;TM&amp;gt;{Flags:AutoMap}) -&amp;gt; Resource&amp;lt;TM&amp;gt;?&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;DateTime::StartOfWeek(Resource&amp;lt;TM64&amp;gt;{Flags:AutoMap}) -&amp;gt; Resource&amp;lt;TM64&amp;gt;?&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;DateTime::EndOfWeek(Resource&amp;lt;TM&amp;gt;{Flags:AutoMap}) -&amp;gt; Resource&amp;lt;TM&amp;gt;?&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;DateTime::EndOfWeek(Resource&amp;lt;TM64&amp;gt;{Flags:AutoMap}) -&amp;gt; Resource&amp;lt;TM64&amp;gt;?&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;DateTime::StartOfDay(Resource&amp;lt;TM&amp;gt;{Flags:AutoMap}) -&amp;gt; Resource&amp;lt;TM&amp;gt;?&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;DateTime::StartOfDay(Resource&amp;lt;TM64&amp;gt;{Flags:AutoMap}) -&amp;gt; Resource&amp;lt;TM64&amp;gt;?&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;DateTime::EndOfDay(Resource&amp;lt;TM&amp;gt;{Flags:AutoMap}) -&amp;gt; Resource&amp;lt;TM&amp;gt;?&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;DateTime::EndOfDay(Resource&amp;lt;TM64&amp;gt;{Flags:AutoMap}) -&amp;gt; Resource&amp;lt;TM64&amp;gt;?&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;DateTime::StartOf(Resource&amp;lt;TM&amp;gt;{Flags:AutoMap}, Interval{Flags:AutoMap}) -&amp;gt; Resource&amp;lt;TM&amp;gt;?&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;DateTime::StartOf(Resource&amp;lt;TM64&amp;gt;{Flags:AutoMap}, Interval64{Flags:AutoMap}) -&amp;gt; Resource&amp;lt;TM64&amp;gt;?&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;DateTime::EndOf(Resource&amp;lt;TM&amp;gt;{Flags:AutoMap}, Interval{Flags:AutoMap}) -&amp;gt; Resource&amp;lt;TM&amp;gt;?&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;DateTime::EndOf(Resource&amp;lt;TM64&amp;gt;{Flags:AutoMap}, Interval64{Flags:AutoMap}) -&amp;gt; Resource&amp;lt;TM64&amp;gt;?&lt;/code&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;The &lt;code&gt;StartOf&lt;/code&gt;/&lt;code&gt;EndOf&lt;/code&gt; functions are intended for grouping by an arbitrary period within a day. The result differs from the input value only by time components. A period exceeding one day is treated as a day (an equivalent of &lt;code&gt;StartOfDay&lt;/code&gt;/&lt;code&gt;EndOfDay&lt;/code&gt;). If a day doesn't include an integer number of periods, the number is rounded to the nearest time from the beginning of the day that is a multiple of the specified period. When the interval is zero, the output is same as the input. A negative interval is treated as a positive one.&lt;/p&gt;\n&lt;p&gt;The &lt;code&gt;EndOf...&lt;/code&gt; functions are intended for obtaining the latest moment in the same period of time as the specified one.&lt;/p&gt;\n&lt;p&gt;The functions treat periods longer than one day in a different manner than the same-name functions in the old library. The time components are always reset to zero (this makes sense, because these functions are mainly used for grouping by the period). You can also specify a time period within a day:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;DateTime::TimeOfDay(Resource&amp;lt;TM&amp;gt;{Flags:AutoMap}) -&amp;gt; Interval&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;DateTime::TimeOfDay(Resource&amp;lt;TM64&amp;gt;{Flags:AutoMap}) -&amp;gt; Interval64&lt;/code&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h4 id=\"examples5\"&gt;&lt;a href=\"en/yql/udf/list/datetime.html#examples5\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Examples&lt;/span&gt;&lt;/a&gt;Examples&lt;/h4&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;SELECT\n    DateTime::MakeDate(DateTime::StartOfYear(Date(\"2019-06-06\"))),\n      -- 2019-01-01 (implicit Split here and below)\n    DateTime::MakeDatetime(DateTime::StartOfQuarter(Datetime(\"2019-06-06T01:02:03Z\"))),\n      -- 2019-04-01T00:00:00Z (time components are reset to zero)\n    DateTime::MakeDate(DateTime::StartOfMonth(Timestamp(\"2019-06-06T01:02:03.456789Z\"))),\n      -- 2019-06-01\n    DateTime::MakeDate(DateTime::StartOfWeek(Date(\"1970-01-01\"))),\n      -- NULL (the beginning of the epoch is Thursday, the beginning of the week is 1969-12-29 that is beyond the limits)\n    DateTime::MakeTimestamp(DateTime::StartOfWeek(Date(\"2019-01-01\"))),\n      -- 2018-12-31T00:00:00Z\n    DateTime::MakeDatetime(DateTime::StartOfDay(Datetime(\"2019-06-06T01:02:03Z\"))),\n      -- 2019-06-06T00:00:00Z\n    DateTime::MakeTzDatetime(DateTime::StartOfDay(TzDatetime(\"1970-01-01T05:00:00,Europe/Moscow\"))),\n      -- NULL (beyond the epoch in GMT)\n    DateTime::MakeTzTimestamp(DateTime::StartOfDay(TzTimestamp(\"1970-01-02T05:00:00.000000,Europe/Moscow\"))),\n      -- 1970-01-02T00:00:00,Europe/Moscow (the beginning of the day in Moscow)\n    DateTime::MakeDatetime(DateTime::StartOf(Datetime(\"2019-06-06T23:45:00Z\"), Interval(\"PT7H\"))),\n      -- 2019-06-06T21:00:00Z\n    DateTime::MakeDatetime(DateTime::StartOf(Datetime(\"2019-06-06T23:45:00Z\"), Interval(\"PT20M\"))),\n      -- 2019-06-06T23:40:00Z\n    DateTime::TimeOfDay(Timestamp(\"2019-02-14T01:02:03.456789Z\"));\n      -- 1 hour 2 minutes 3 seconds 456789 microseconds\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"681\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-681\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-681\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-681.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"shift\"&gt;&lt;a href=\"en/yql/udf/list/datetime.html#shift\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Shift...&lt;/span&gt;&lt;/a&gt;Shift...&lt;/h2&gt;\n&lt;p&gt;Add/subtract the specified number of units to/from the component in the internal representation and update the other fields.&lt;br /&gt;\nReturns either an updated copy or NULL, if an update produces an invalid date or other inconsistencies.&lt;/p&gt;\n&lt;h4 id=\"list-of-functions8\"&gt;&lt;a href=\"en/yql/udf/list/datetime.html#list-of-functions8\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;List of functions&lt;/span&gt;&lt;/a&gt;List of functions&lt;/h4&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;DateTime::ShiftYears(Resource&amp;lt;TM&amp;gt;{Flags:AutoMap}, Int32) -&amp;gt; Resource&amp;lt;TM&amp;gt;?&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;DateTime::ShiftYears(Resource&amp;lt;TM64&amp;gt;{Flags:AutoMap}, Int32) -&amp;gt; Resource&amp;lt;TM64&amp;gt;?&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;DateTime::ShiftQuarters(Resource&amp;lt;TM&amp;gt;{Flags:AutoMap}, Int32) -&amp;gt; Resource&amp;lt;TM&amp;gt;?&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;DateTime::ShiftQuarters(Resource&amp;lt;TM64&amp;gt;{Flags:AutoMap}, Int32) -&amp;gt; Resource&amp;lt;TM64&amp;gt;?&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;DateTime::ShiftMonths(Resource&amp;lt;TM&amp;gt;{Flags:AutoMap}, Int32) -&amp;gt; Resource&amp;lt;TM&amp;gt;?&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;DateTime::ShiftMonths(Resource&amp;lt;TM64&amp;gt;{Flags:AutoMap}, Int32) -&amp;gt; Resource&amp;lt;TM64&amp;gt;?&lt;/code&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;If the resulting number of the day in the month exceeds the maximum allowed, then the &lt;code&gt;Day&lt;/code&gt; field will accept the last day of the month without changing the time (see examples).&lt;/p&gt;\n&lt;h4 id=\"examples6\"&gt;&lt;a href=\"en/yql/udf/list/datetime.html#examples6\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Examples&lt;/span&gt;&lt;/a&gt;Examples&lt;/h4&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;$tm1 = DateTime::Split(Datetime(\"2019-01-31T01:01:01Z\"));\n$tm2 = DateTime::Split(TzDatetime(\"2049-05-20T12:34:50,Europe/Moscow\"));\n\nSELECT\n    DateTime::MakeDate(DateTime::ShiftYears($tm1, 10)), -- 2029-01-31T01:01:01\n    DateTime::MakeDate(DateTime::ShiftYears($tm2, -10000)), -- NULL (beyond the limits)\n    DateTime::MakeDate(DateTime::ShiftQuarters($tm2, 0)), -- 2049-05-20T12:34:50,Europe/Moscow\n    DateTime::MakeDate(DateTime::ShiftQuarters($tm1, -3)), -- 2018-04-30T01:01:01\n    DateTime::MakeDate(DateTime::ShiftMonths($tm1, 1)), -- 2019-02-28T01:01:01\n    DateTime::MakeDate(DateTime::ShiftMonths($tm1, -35)), -- 2016-02-29T01:01:01\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"729\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-729\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-729\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-729.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"format\"&gt;&lt;a href=\"en/yql/udf/list/datetime.html#format\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Format&lt;/span&gt;&lt;/a&gt;Format&lt;/h2&gt;\n&lt;p&gt;Get a string representation of a time using an arbitrary formatting string.&lt;/p&gt;\n&lt;h4 id=\"list-of-functions9\"&gt;&lt;a href=\"en/yql/udf/list/datetime.html#list-of-functions9\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;List of functions&lt;/span&gt;&lt;/a&gt;List of functions&lt;/h4&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;DateTime::Format(String, alwaysWriteFractionalSeconds:Bool?) -&amp;gt; (Resource&amp;lt;TM64&amp;gt;{Flags:AutoMap}) -&amp;gt; String&lt;/code&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;A set of specifiers is implemented for the formatting string:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;%%&lt;/code&gt;: % character;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;%Y&lt;/code&gt;: Variable length (1-6 digits) year with minus for the dates BC;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;%m&lt;/code&gt;: 2-digit month;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;%d&lt;/code&gt;: 2-digit day;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;%H&lt;/code&gt;: 2-digit hour;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;%M&lt;/code&gt;: 2-digit minutes;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;%S&lt;/code&gt;: 2-digit seconds or &lt;code&gt;XX.XXXXXX&lt;/code&gt; in the case of non-empty microseconds (only if &lt;code&gt;alwaysWriteFractionalSeconds&lt;/code&gt; is not set to &lt;code&gt;True&lt;/code&gt;);&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;%z&lt;/code&gt;: +hhmm or -hhmm;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;%Z&lt;/code&gt;: IANA name of the timezone (GMT);&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;%b&lt;/code&gt;: A short three-letter English name of the month (Jan);&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;%B&lt;/code&gt;: A full English name of the month (January).&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;All other characters in the format string are passed on without changes.&lt;/p&gt;\n&lt;h4 id=\"examples7\"&gt;&lt;a href=\"en/yql/udf/list/datetime.html#examples7\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Examples&lt;/span&gt;&lt;/a&gt;Examples&lt;/h4&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;$format = DateTime::Format(\"%Y-%m-%d %H:%M:%S %Z\");\n\nSELECT\n    $format(DateTime::Split(TzDatetime(\"2019-01-01T01:02:03,Europe/Moscow\")));\n      -- \"2019-01-01 01:02:03 Europe/Moscow\"\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"812\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-812\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-812\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-812.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"parse\"&gt;&lt;a href=\"en/yql/udf/list/datetime.html#parse\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Parse/Parse64&lt;/span&gt;&lt;/a&gt;Parse/Parse64&lt;/h2&gt;\n&lt;p&gt;Parse a string into an internal representation using an arbitrary formatting string. Default values are used for empty fields. If errors are raised, NULL is returned.&lt;/p&gt;\n&lt;h4 id=\"list-of-functions10\"&gt;&lt;a href=\"en/yql/udf/list/datetime.html#list-of-functions10\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;List of functions&lt;/span&gt;&lt;/a&gt;List of functions&lt;/h4&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;DateTime::Parse(String) -&amp;gt; (String{Flags:AutoMap}) -&amp;gt; Resource&amp;lt;TM&amp;gt;?&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;DateTime::Parse64(String) -&amp;gt; (String{Flags:AutoMap}) -&amp;gt; Resource&amp;lt;TM64&amp;gt;?&lt;/code&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Implemented specifiers:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;%%&lt;/code&gt;: the % character;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;%Y&lt;/code&gt;: 4-digit year when using &lt;code&gt;Parse&lt;/code&gt;, and variable length (1-6 digits) year with minus for the dates BC when using &lt;code&gt;Parse64&lt;/code&gt;;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;%m&lt;/code&gt;: 2-digit month;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;%d&lt;/code&gt;: 2-digit day;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;%H&lt;/code&gt;: 2-digit hour;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;%M&lt;/code&gt;: 2-digit minutes;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;%S&lt;/code&gt;: Seconds, can also accept microseconds in the formats from &lt;code&gt;XX&lt;/code&gt; up to &lt;code&gt;XX.XXXXXX&lt;/code&gt;;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;%Z&lt;/code&gt;: The IANA name of the timezone (GMT);&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;%b&lt;/code&gt;: A short three-letter case-insensitive English name of the month (Jan);&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;%B&lt;/code&gt;: A full case-insensitive English name of the month (January).&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h4 id=\"examples8\"&gt;&lt;a href=\"en/yql/udf/list/datetime.html#examples8\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Examples&lt;/span&gt;&lt;/a&gt;Examples&lt;/h4&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;$parse1 = DateTime::Parse(\"%H:%M:%S\");\n$parse2 = DateTime::Parse(\"%S\");\n$parse3 = DateTime::Parse(\"%m/%d/%Y\");\n$parse4 = DateTime::Parse(\"%Z\");\n$parse5 = DateTime::Parse64(\"%m/%d/%Y\");\n\nSELECT\n    DateTime::MakeDatetime($parse1(\"01:02:03\")), -- 1970-01-01T01:02:03Z\n    DateTime::MakeTimestamp($parse2(\"12.3456\")), -- 1970-01-01T00:00:12.345600Z\n    DateTime::MakeTimestamp($parse3(\"02/30/2000\")), -- NULL (Feb 30)\n    DateTime::MakeTimestamp($parse4(\"Canada/Central\")), -- 1970-01-01T06:00:00Z (conversion to UTC)\n    DateTime::MakeTimestamp64($parse5(\"02/10/1931\")), -- 1931-02-10T00:00:00Z (conversion to UTC)\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"892\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-892\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-892\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-892.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;For the common formats, wrappers around the corresponding util methods are supported. You can only get TM with components in the UTC timezone.&lt;/p&gt;\n&lt;h2 id=\"parse-specific-formats\"&gt;&lt;a href=\"en/yql/udf/list/datetime.html#parse-specific-formats\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Parse specific formats&lt;/span&gt;&lt;/a&gt;Parse specific formats&lt;/h2&gt;\n&lt;h4 id=\"list-of-functions11\"&gt;&lt;a href=\"en/yql/udf/list/datetime.html#list-of-functions11\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;List of functions&lt;/span&gt;&lt;/a&gt;List of functions&lt;/h4&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;DateTime::ParseRfc822(String{Flags:AutoMap}) -&amp;gt; Resource&amp;lt;TM&amp;gt;?&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;DateTime::ParseIso8601(String{Flags:AutoMap}) -&amp;gt; Resource&amp;lt;TM&amp;gt;?&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;DateTime::ParseHttp(String{Flags:AutoMap}) -&amp;gt; Resource&amp;lt;TM&amp;gt;?&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;DateTime::ParseX509(String{Flags:AutoMap}) -&amp;gt; Resource&amp;lt;TM&amp;gt;?&lt;/code&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h4 id=\"examples9\"&gt;&lt;a href=\"en/yql/udf/list/datetime.html#examples9\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Examples&lt;/span&gt;&lt;/a&gt;Examples&lt;/h4&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;SELECT\n    DateTime::MakeTimestamp(DateTime::ParseRfc822(\"Fri, 4 Mar 2005 19:34:45 EST\")),\n      -- 2005-03-05T00:34:45Z\n    DateTime::MakeTimestamp(DateTime::ParseIso8601(\"2009-02-14T02:31:30+0300\")),\n      -- 2009-02-13T23:31:30Z\n    DateTime::MakeTimestamp(DateTime::ParseHttp(\"Sunday, 06-Nov-94 08:49:37 GMT\")),\n      -- 1994-11-06T08:49:37Z\n    DateTime::MakeTimestamp(DateTime::ParseX509(\"20091014165533Z\"))\n      -- 2009-10-14T16:55:33Z\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"927\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-927\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-927\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-927.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"standard-scenarios\"&gt;&lt;a href=\"en/yql/udf/list/datetime.html#standard-scenarios\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Standard scenarios&lt;/span&gt;&lt;/a&gt;Standard scenarios&lt;/h2&gt;\n&lt;h3 id=\"conversions-between-strings-and-seconds\"&gt;&lt;a href=\"en/yql/udf/list/datetime.html#conversions-between-strings-and-seconds\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Conversions between strings and seconds&lt;/span&gt;&lt;/a&gt;Conversions between strings and seconds&lt;/h3&gt;\n&lt;p&gt;Converting a string date (in the Moscow timezone) to seconds (in GMT timezone):&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;$datetime_parse = DateTime::Parse(\"%Y-%m-%d %H:%M:%S\");\n$datetime_parse_tz = DateTime::Parse(\"%Y-%m-%d %H:%M:%S %Z\");\n\nSELECT\n    DateTime::ToSeconds(TzDatetime(\"2019-09-16T00:00:00,Europe/Moscow\")) AS md_us1, -- 1568581200\n    DateTime::ToSeconds(DateTime::MakeDatetime($datetime_parse_tz(\"2019-09-16 00:00:00\" || \" Europe/Moscow\"))),  -- 1568581200\n    DateTime::ToSeconds(DateTime::MakeDatetime(DateTime::Update($datetime_parse(\"2019-09-16 00:00:00\"), \"Europe/Moscow\" as Timezone))), -- 1568581200\n\n    -- INCORRECT (Date imports time as GMT, but AddTimezone has no effect on ToSeconds that always returns GMT time)\n    DateTime::ToSeconds(AddTimezone(Date(\"2019-09-16\"), 'Europe/Moscow')) AS md_us2, -- 1568592000\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"937\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-937\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-937\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-937.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Converting a string date (in the Moscow timezone) to seconds (in the Moscow timezone). DateTime::ToSeconds() exports only to GMT. That's why we should put timezones aside for a while and use only GMT (as if we assumed for a while that Moscow is in GMT):&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;$date_parse = DateTime::Parse(\"%Y-%m-%d\");\n$datetime_parse = DateTime::Parse(\"%Y-%m-%d %H:%M:%S\");\n$datetime_parse_tz = DateTime::Parse(\"%Y-%m-%d %H:%M:%S %Z\");\n\nSELECT\n    DateTime::ToSeconds(Datetime(\"2019-09-16T00:00:00Z\")) AS md_ms1, -- 1568592000\n    DateTime::ToSeconds(Date(\"2019-09-16\")) AS md_ms2, -- 1568592000\n    DateTime::ToSeconds(DateTime::MakeDatetime($date_parse(\"2019-09-16\"))) AS md_ms3, -- 1568592000\n    DateTime::ToSeconds(DateTime::MakeDatetime($datetime_parse(\"2019-09-16 00:00:00\"))) AS md_ms4, -- 1568592000\n    DateTime::ToSeconds(DateTime::MakeDatetime($datetime_parse_tz(\"2019-09-16 00:00:00 GMT\"))) AS md_ms5, -- 1568592000\n\n    -- INCORRECT (imports the time in the Moscow timezone, but RemoveTimezone doesn't affect ToSeconds in any way)\n    DateTime::ToSeconds(RemoveTimezone(TzDatetime(\"2019-09-16T00:00:00,Europe/Moscow\"))) AS md_ms6, -- 1568581200\n    DateTime::ToSeconds(DateTime::MakeDatetime($datetime_parse_tz(\"2019-09-16 00:00:00 Europe/Moscow\"))) AS md_ms7 -- 1568581200\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"941\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-941\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-941\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-941.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Converting seconds (in the GMT timezone) to a string date (in the Moscow timezone):&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;$date_format = DateTime::Format(\"%Y-%m-%d %H:%M:%S %Z\");\nSELECT\n    $date_format(AddTimezone(DateTime::FromSeconds(1568592000), 'Europe/Moscow')) -- \"2019-09-16 03:00:00 Europe/Moscow\"\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"945\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-945\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-945\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-945.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Converting seconds (in the Moscow timezone) to a string date (in the Moscow timezone). In this case, the %Z  timezone is output for reference: usually, it's not needed because it's \"GMT\" and might mislead you.&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;$date_format = DateTime::Format(\"%Y-%m-%d %H:%M:%S %Z\");\nSELECT\n    $date_format(DateTime::FromSeconds(1568592000)) -- \"2019-09-16 00:00:00 GMT\"\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"949\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-949\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-949\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-949.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Converting seconds (in the GMT timezone) to three-letter days of the week (in the Moscow timezone):&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;SELECT\n    SUBSTRING(DateTime::GetDayOfWeekName(AddTimezone(DateTime::FromSeconds(1568581200), \"Europe/Moscow\")), 0, 3) -- \"Mon\"\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"953\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-953\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-953\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-953.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"date-and-time-formatting\"&gt;&lt;a href=\"en/yql/udf/list/datetime.html#date-and-time-formatting\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Date and time formatting&lt;/span&gt;&lt;/a&gt;Date and time formatting&lt;/h3&gt;\n&lt;p&gt;Usually a separate named expression is used to format time, but you can do without it:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;$date_format = DateTime::Format(\"%Y-%m-%d %H:%M:%S %Z\");\n\nSELECT\n\n   -- A variant with a named expression\n\n   $date_format(AddTimezone(DateTime::FromSeconds(1568592000), 'Europe/Moscow')),\n\n   -- A variant without a named expression\n\n   DateTime::Format(\"%Y-%m-%d %H:%M:%S %Z\")\n       (AddTimezone(DateTime::FromSeconds(1568592000), 'Europe/Moscow'))\n;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"960\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-960\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-960\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-960.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"converting-types\"&gt;&lt;a href=\"en/yql/udf/list/datetime.html#converting-types\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Converting types&lt;/span&gt;&lt;/a&gt;Converting types&lt;/h3&gt;\n&lt;p&gt;This way, you can convert only constants:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;SELECT\n    TzDatetime(\"2019-09-16T00:00:00,Europe/Moscow\"), -- 2019-09-16T00:00:00,Europe/Moscow\n    Date(\"2019-09-16\") -- 2019-09-16\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"967\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-967\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-967\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-967.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;But this way, you can convert a constant, a named expression, or a table field:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;SELECT\n    CAST(\"2019-09-16T00:00:00,Europe/Moscow\" AS TzDatetime), -- 2019-09-16T00:00:00,Europe/Moscow\n    CAST(\"2019-09-16\" AS Date) -- 2019-09-16\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"971\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-971\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-971\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-971.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"converting-time-to-date\"&gt;&lt;a href=\"en/yql/udf/list/datetime.html#converting-time-to-date\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Converting time to date&lt;/span&gt;&lt;/a&gt;Converting time to date&lt;/h3&gt;\n&lt;p&gt;A CAST to Date or TzDate outputs a GMT date for a midnight, local time (for example, for Moscow time 2019-10-22 00:00:00, the date 2019-10-21 is returned). To get a date in the local timezone, you can use DateTime::Format.&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;$x = Datetime(\"2019-10-21T21:00:00Z\");\nSELECT\n    AddTimezone($x, \"Europe/Moscow\"), -- 2019-10-22T00:00:00,Europe/Moscow\n    cast($x as TzDate), -- 2019-10-21,GMT\n    cast(AddTimezone($x, \"Europe/Moscow\") as TzDate), -- 2019-10-21,Europe/Moscow\n    cast(AddTimezone($x, \"Europe/Moscow\") as Date), -- 2019-10-21\n  DateTime::Format(\"%Y-%m-%d %Z\")(AddTimezone($x, \"Europe/Moscow\")), -- 2019-10-22 Europe/Moscow\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"978\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-978\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-978\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-978.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;It's worth mentioning that several &lt;code&gt;TzDatetime&lt;/code&gt; or &lt;code&gt;TzTimestamp&lt;/code&gt; values with a positive timezone offset cannot be cast to &lt;code&gt;TzDate&lt;/code&gt;. Consider the example below:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;SELECT CAST(TzDatetime(\"1970-01-01T23:59:59,Europe/Moscow\") as TzDate);\n/* Fatal: Timestamp 1970-01-01T23:59:59.000000,Europe/Moscow cannot be casted to TzDate */\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"982\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-982\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-982\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-982.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Starting from the Unix epoch, there is no valid value representing midnight on 01/01/1970 for the Europe/Moscow timezone. As a result, such a cast is impossible and fails at runtime.&lt;/p&gt;\n&lt;p&gt;At the same time, values with a negative timezone offset are converted correctly:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;SELECT CAST(TzDatetime(\"1970-01-01T23:59:59,America/Los_Angeles\") as TzDate);\n/* 1970-01-01,America/Los_Angeles */\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"989\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-989\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-989\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-989.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"daylight-saving-time\"&gt;&lt;a href=\"en/yql/udf/list/datetime.html#daylight-saving-time\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Daylight saving time&lt;/span&gt;&lt;/a&gt;Daylight saving time&lt;/h3&gt;\n&lt;p&gt;Please note that daylight saving time depends on the year:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;SELECT\n    RemoveTimezone(TzDatetime(\"2019-09-16T10:00:00,Europe/Moscow\")) as DST1, -- 2019-09-16T07:00:00Z\n    RemoveTimezone(TzDatetime(\"2008-12-03T10:00:00,Europe/Moscow\")) as DST2, -- 2008-12-03T07:00:00Z\n    RemoveTimezone(TzDatetime(\"2008-07-03T10:00:00,Europe/Moscow\")) as DST3, -- 2008-07-03T06:00:00Z (DST)\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"996\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-996\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-996\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-996.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"en/yql/udf/list/datetime.md","sourcePath":"en/yql/udf/list/datetime.md"},"headings":[{"title":"Split","href":"en/yql/udf/list/datetime.html#split","level":2},{"title":"Make...","href":"en/yql/udf/list/datetime.html#make","level":2},{"title":"Get...","href":"en/yql/udf/list/datetime.html#get","level":2},{"title":"Update","href":"en/yql/udf/list/datetime.html#update","level":2},{"title":"From...","href":"en/yql/udf/list/datetime.html#from","level":2},{"title":"To...","href":"en/yql/udf/list/datetime.html#to","level":2},{"title":"Interval...","href":"en/yql/udf/list/datetime.html#interval","level":2},{"title":"StartOf... / EndOf... / TimeOfDay","href":"en/yql/udf/list/datetime.html#startof","level":2},{"title":"Shift...","href":"en/yql/udf/list/datetime.html#shift","level":2},{"title":"Format","href":"en/yql/udf/list/datetime.html#format","level":2},{"title":"Parse/Parse64","href":"en/yql/udf/list/datetime.html#parse","level":2},{"title":"Parse specific formats","href":"en/yql/udf/list/datetime.html#parse-specific-formats","level":2},{"title":"Standard scenarios","href":"en/yql/udf/list/datetime.html#standard-scenarios","level":2,"items":[{"title":"Conversions between strings and seconds","href":"en/yql/udf/list/datetime.html#conversions-between-strings-and-seconds","level":3},{"title":"Date and time formatting","href":"en/yql/udf/list/datetime.html#date-and-time-formatting","level":3},{"title":"Converting types","href":"en/yql/udf/list/datetime.html#converting-types","level":3},{"title":"Converting time to date","href":"en/yql/udf/list/datetime.html#converting-time-to-date","level":3},{"title":"Daylight saving time","href":"en/yql/udf/list/datetime.html#daylight-saving-time","level":3}]}],"title":"DateTime"},"router":{"pathname":"en/yql/udf/list/datetime","depth":5,"base":"../../../../"},"lang":"en","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/en/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-a29ea7877730322f2ce693378d06d02ac2b374cd-en","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
