        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;Converting protobuf messages to YQL structs.&lt;/p&gt;\n&lt;p&gt;Function list:&lt;/p&gt;\n&lt;p&gt;&lt;code&gt;Protobuf::Parse(String?{Flags:AutoMap}) -&amp;gt; &amp;lt;Struct&amp;gt;?&lt;/code&gt; — Unpackages a message into a YQL struct.&lt;br /&gt;\n&lt;code&gt;Protobuf::TryParse(String?{Flags:AutoMap}) -&amp;gt; &amp;lt;Struct&amp;gt;?&lt;/code&gt; — Safely unpackages a message. Returns Null on error.&lt;br /&gt;\n&lt;code&gt;Protobuf::Serialize(&amp;lt;Struct&amp;gt;?{Flags:AutoMap}) -&amp;gt; String&lt;/code&gt; — Serializes a struct into a protobuf string.&lt;/p&gt;\n&lt;p&gt;Before using, create metainformation similar to what is written to the &lt;code&gt;_yql_proto_field&lt;/code&gt; meta attribute.&lt;/p&gt;\n&lt;h2 id=\"yql_proto_field_desc\"&gt;&lt;a href=\"en/yql/udf/list/protobuf.html#yql_proto_field_desc\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Supported descriptor fields&lt;/span&gt;&lt;/a&gt;Supported descriptor fields&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;name&lt;/code&gt; — The name of the protobuf message. It is comprised of the package name and message name separated by the dot (\"package.message\"), where:\n&lt;ul&gt;\n&lt;li&gt;package stores the proto file.&lt;/li&gt;\n&lt;li&gt;message is used to collect data.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;meta&lt;/code&gt; — The descriptor of the protobuf message (compressed zlib, base64).&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;format&lt;/code&gt; — The protobuf serialization format. Possible values: &lt;code&gt;protobin&lt;/code&gt; (default) — binary, &lt;code&gt;prototext&lt;/code&gt; — text, &lt;code&gt;json&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;skip&lt;/code&gt; — The number of bytes in each value to be ignored before parsing (0 by default).&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;view&lt;/code&gt; — The dictionary defining the view settings for protobuf messages. The following settings are supported:\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;enum&lt;/code&gt; — Protobuf enumeration view in YQL. Possible values: &lt;code&gt;number&lt;/code&gt; (default), &lt;code&gt;name&lt;/code&gt;, &lt;code&gt;full_name&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;recursion&lt;/code&gt; — A method to process recursive messages. Possible values: &lt;code&gt;fail&lt;/code&gt; (default) — display an error, &lt;code&gt;ignore&lt;/code&gt;— skip recursive insertions, &lt;code&gt;bytes&lt;/code&gt; (deprecated) — convert recursive insertions to byte strings, &lt;code&gt;bytesV2&lt;/code&gt; — same as bytes, but with the output type changed to optional byte strings for optional fields.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;yt_mode&lt;/code&gt; — The &lt;code&gt;YT Mode&lt;/code&gt; (&lt;code&gt;false&lt;/code&gt; by default) used to process YT-specific protobuf options. If the message lacks &lt;code&gt;NYT.default_field_flags&lt;/code&gt; or its value is not &lt;code&gt;SERIALIZATION_YT&lt;/code&gt;, the message is converted to a byte string. If its value is &lt;code&gt;SERIALIZATION_YT&lt;/code&gt;, the message is processed as usual (recursive message processing is defined by the &lt;code&gt;recursion&lt;/code&gt; option).&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;lists&lt;/code&gt; — The dictionary that defines view settings for repeated fields in protobuf messages. The following settings are supported:\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;optional&lt;/code&gt; — Displays repeated fields as optional lists instead of regular ones (&lt;code&gt;true&lt;/code&gt; by default).&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;/ul&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Attention&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;If &lt;code&gt;lists&lt;/code&gt; &lt;code&gt;optional=false&lt;/code&gt;, we don't recommend writing the &lt;code&gt;Protobuf::Parse&lt;/code&gt; result into tables because the table schema becomes incompatible if new repeated fields are introduced.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"examples\"&gt;&lt;a href=\"en/yql/udf/list/protobuf.html#examples\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Examples&lt;/span&gt;&lt;/a&gt;Examples&lt;/h2&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;$config = @@{\n    \"name\": \"my.service.proto.BufferWrapper\",\n    \"meta\": \"H4sIAAAAAAAAA51YT3PbVBCv/9vr2FGUAkE9AG6BtAWnSdrp39AmbUo6JZBpy2SGYaajSM+xJraeR5KdpB+B6ZkjnDlx4RPADF+EM2cOXNi3+yzZabDV3KSn3d/b3bf7232C13m47QTHvche2g/sXnvJtSP7pdftySBaOhR7A++VDJZ6gYzkkhgIP3oZHfdE2KQV80LQbx7bviuOml0RBd6B3TwcrPDHK7/koLKpVF6ghlmDSlf2Q9GVA2GcM6tQotd+z8jE31x56BtZswIFp+M5B0bOBCiGTiA7HSNv1gEOPR9l9jr9wCiYs1Dl95Z0+qFRVHr8WDLLkCepslmCnJAto6I2CUVHOJEnfQMUstO2/X1hVJWi5/f6kTGjpCLZd9pkZk3tSa9hZAeRUTdnoEzvwneNWWUBvTm274iOYZjnwaCFlgwcoeHnTANmUGJgh9siakvXME0T6ryyE8ieCKJjY16Z/ErKrnFemRaI0HsljHfUFl3herZWfdecgxotxJrvKZsPxHEYBfJAGAsK3BUDzxHPZGSTt+8rP1p4sJ3NIJCBYan3th22tYkX9op0ZKvwownX3yod0mSCdfYMa/xUhgIlkXkd8urDQubDzGJ95ZPmhA2bSdrVoYhHty+ihSzqzWE8S63A7oon7kKOFtYAKPdIZSGPa9WVTyeCb8fiW+fM+1DlBGX9AukvTtR/nsgzAGcxAxRTAOwm8giwCfU4rxmjRBhXJxsxpsJ2cDYwRjmFHQ8TeQRY06XC+pUUgXwRi/P+Xcpx1ocU+28n8gjwEGo9XRMMUSWIKxMhdkY1EOQuVFQRMsAMAUzOtO+G0uwC1y2r11K48CyRR4AvYTYu5JBB6gTy2USQp+M6CPQNzI9TAIPNEti1iWCP3tRjyxL+YDAjhWWPx3UYKCEeBppLAbQ1rrN1bqMIeRSzGw2ApCCRyTNHxBAF9XhMRV9oLEN1pOhOF0Jqz/fsfUG0UG7UoDpSZo0dqI9XDJJugZqCBqpim/FdDTWHrUZ9+1q6jKeaVQm/00KebFqD6kj9KLiB3ekzvVWUODYZ50AwZFnxWNtzXeFr+37IACT1Yz6AEvelEAFyGM6llJXXfN7fwzqyrTtQ0o/Yf7Keqw2hWCkTshyrHD3WVKfFFke+ZBt/ZKASF4K5AWVVQ48D2SWQaRkXa9LTjvTIn6LCeCFp7zMgWNfYJIZDezvYWzpkTzZxqpA4VWg8h+pIOSqdQ8+N2vqA1QEIb78dJWes0mWXRPiMMXBqaYvF+JivQnWEphQKs5wOLyYddqcQMXOLlcY1qI0REk4O5SGnaYU4T5QVlcavGZg9Uf5Y/JCwiE6Hu29DIMk7vVpPoT6+MpIhlPm4Hduj/PPUmGNzmioHutL1Wp4IKCCVxhOYP4VipkV7Hqoy8FCQVPSBrcPsCYJR8XRUjXGw
