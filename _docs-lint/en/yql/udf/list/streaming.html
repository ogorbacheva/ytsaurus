        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;Functions designed to launch an arbitrary script or executable in the streaming mode:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;Streaming::Process(List&amp;lt;Struct&amp;lt;Data:String&amp;gt;&amp;gt;, String, List&amp;lt;String&amp;gt;) -&amp;gt; List&amp;lt;Struct&amp;lt;Data:String&amp;gt;&amp;gt;\nStreaming::ProcessInline(List&amp;lt;Struct&amp;lt;Data:String&amp;gt;&amp;gt;, String, List&amp;lt;String&amp;gt;) -&amp;gt; List&amp;lt;Struct&amp;lt;Data:String&amp;gt;&amp;gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"3\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-3\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-3\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-3.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Argument description:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;Input data (&lt;code&gt;List&amp;lt;Struct&amp;lt;Data:String&amp;gt;&amp;gt;&lt;/code&gt;):\n&lt;ul&gt;\n&lt;li&gt;A child process is launched once in the beginning of list processing (or a part of it, see the next section), and each element is fed to it via stdin in separate lines.&lt;/li&gt;\n&lt;li&gt;If the input list is a large table, many identical processes are launched to process its parts in parallel. Processing of all table data in one process and the order of line processing are not guaranteed.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;Process&lt;/code&gt; and &lt;code&gt;ProcessInline&lt;/code&gt; expect each line in the input data list to be wrapped in a structure. It simplifies using &lt;code&gt;SELECT&lt;/code&gt; because this is the type of &lt;code&gt;SELECT ... AS Data FROM ...&lt;/code&gt;. Also, it helps discourage the user from choosing a very inefficient scenario in which a separate process is launched for each line of the source MapReduce table.&lt;/li&gt;\n&lt;li&gt;The &lt;code&gt;Data&lt;/code&gt; name for the list item structure is fixed at the time of writing.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;li&gt;The second argument (&lt;code&gt;String&lt;/code&gt;):\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;Streaming::Process&lt;/code&gt; is the program name from &lt;code&gt;$PATH&lt;/code&gt; (you must ensure that it's installed on the target cluster) or the executable path that can be attached to the query and then receive the path via the built-in &lt;code&gt;FilePath(\"file alias\")&lt;/code&gt; function.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;Streaming::ProcessInline&lt;/code&gt; is the line with the script that will be launched using the interpreter specified in &lt;a href=\"https://en.wikipedia.org/wiki/Shebang_(Unix)\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;shebang&lt;/a&gt; (i.e. the first line of the script must read like &lt;code&gt;#!/usr/bin/env bash&lt;/code&gt;, for example). Basic interpreters, such as sh, bash, awk, perl, or python, are usually already installed. If you need something unconventional, you can attach it to your query. The script can be defined inline using a multiline string literal (&lt;code&gt;@@&lt;/code&gt;) or in a separate file (a tab in the web interface). In the second case, you can get a file's content in a line using the built-in &lt;code&gt;FileContent(\"file alias\")&lt;/code&gt; function.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;li&gt;The list of arguments to be passed to the script or executable when launching (&lt;code&gt;List&amp;lt;String&amp;gt;&lt;/code&gt;, optional argument):\n&lt;ul&gt;\n&lt;li&gt;An easy way to create a list of arguments using literals is to use the built-in &lt;code&gt;AsList&lt;/code&gt; function (accepts 1 or more arguments and creates a list of them).&lt;/li&gt;\n&lt;li&gt;If you don't need to pass arguments, skip them.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;If you're interested in a specific interaction with a child process that's different from the line-by-line approach described above, tell us about your use scenario in the &lt;a href=\"https://t.me/ytsaurus\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;community chat&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;Notes on implementation:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;Streaming::ProcessInline&lt;/code&gt; usually uses the interpreter installed on the target cluster, which might lead to unexpected results in case of version conflict. To avoid this, you can attach your interpreter to the query (which isn't always straightforward) or ask the cluster administrator to install the required interpreter or its version (it's better if you contact them directly, but you can also ask us for help).&lt;/li&gt;\n&lt;li&gt;stderr can be used for troubleshooting issues: some part of it is saved and returned to the client in case of a runtime error when running the query. The size of the saved part of stderr is configured on the cluster side and usually is several kilobytes.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h4 id=\"examples\"&gt;&lt;a href=\"en/yql/udf/list/streaming.html#examples\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Examples&lt;/span&gt;&lt;/a&gt;Examples&lt;/h4&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;$input = [\n  &amp;lt;| \"Data\":\"a\" |&amp;gt;,\n  &amp;lt;| \"Data\":\"b\" |&amp;gt;,\n  &amp;lt;| \"Data\":\"c\" |&amp;gt;,\n];\n\nPROCESS AS_TABLE($input) USING Streaming::Process(TableRows(), \"cat\", [\"-n\"]);\n\n/*\n[(Data: ' 1 a'),\n(Data: ' 2 b'),\n(Data: ' 3 c')]\n*/\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"91\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-91\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-91\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-91.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;$ips = (SELECT COALESCE(ip, \"\") AS Data FROM &amp;lt;cluster-name&amp;gt;.`home/yql/tutorial/users`);\n\n$script = @@#!/usr/bin/awk -f\nBEGIN { FS=\".\"; }\n$2 ~ /170/ { print $0\" has 170 in second octet!\"; }\n@@;\n\nPROCESS $ips\nUSING Streaming::ProcessInline(\n  TableRows(),\n  $script\n);\n/*\n\"93.170.111.29 has 170 in second octet!\"\n\"93.170.111.28 has 170 in second octet!\"\n*/\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"92\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-92\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-92\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-92.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"en/yql/udf/list/streaming.md","sourcePath":"en/yql/udf/list/streaming.md"},"headings":[],"title":"Streaming UDF"},"router":{"pathname":"en/yql/udf/list/streaming","depth":5,"base":"../../../../"},"lang":"en","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/en/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-a29ea7877730322f2ce693378d06d02ac2b374cd-en","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
