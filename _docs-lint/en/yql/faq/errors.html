            {"data":{"leading":false,"html":"&lt;h2 id=\"expected-comparable-type,-but-got-yson\"&gt;&lt;a href=\"en/yql/faq/errors.html#expected-comparable-type,-but-got-yson\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Expected comparable type, but got: Yson&lt;/span&gt;&lt;/a&gt;Expected comparable type, but got: Yson&lt;/h2&gt;\n&lt;p&gt;This might happen if the table has been created in YTsaurus without a schema and then sorted. In this case, the system (YT) assigns the &lt;code&gt;any&lt;/code&gt; type to the sort column in the table schema. In YQL, this is equivalent to the &lt;code&gt;Yson&lt;/code&gt; column type (arbitrary YSON data).&lt;/p&gt;\n&lt;p&gt;For example, for this query:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;SELECT * FROM my_table\nWHERE key = 'www.youtube.com/watch?v=Xn599R0ZBwg';\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"9\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-9\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-9\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-9.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;... you can make a workaround:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;SELECT * FROM my_table\nWHERE Yson::ConvertToString(Yson::Parse(key)) = 'www.youtube.com/watch?v=Xn599R0ZBwg';\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"13\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-13\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-13\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-13.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;&lt;strong&gt;The drawback of this solution:&lt;/strong&gt;&lt;br /&gt;\nThe queries used in the examples output all the rows that match a certain key. If the table has been sorted by this key, the query execution time is usually independent of the table size. But for this workaround, such optimization won't work, and you'll have to scan the entire table.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Note&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;This issue doesn't occur with tables that have a  valid schema. Configure the schema if you know how to do it. If not, ask the people responsible for the tables to do it for you.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;More &lt;a href=\"en/yql/udf/list/yson.html\"&gt;about Yson UDF&lt;/a&gt;.&lt;/p&gt;\n&lt;h2 id=\"cannot-add-type-string-string-and-string-string\"&gt;&lt;a href=\"en/yql/faq/errors.html#cannot-add-type-string-string-and-string-string\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Cannot add type String (String?) and String (String?)&lt;/span&gt;&lt;/a&gt;Cannot add type String (String?) and String (String?)&lt;/h2&gt;\n&lt;p&gt;This error arises when you try to concatenate strings using the '+' operator.&lt;br /&gt;\nUse the '||' operator instead:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;SELECT \"Hello, \" || \"world\" || \"!\";\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"36\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-36\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-36\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-36.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"expression-has-to-be-an-aggregation-function-or-key-column,-because-aggregation-is-used-elsewhere-in-this-subquery\"&gt;&lt;a href=\"en/yql/faq/errors.html#expression-has-to-be-an-aggregation-function-or-key-column,-because-aggregation-is-used-elsewhere-in-this-subquery\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Expression has to be an aggregation function or key column, because aggregation is used elsewhere in this subquery&lt;/span&gt;&lt;/a&gt;Expression has to be an aggregation function or key column, because aggregation is used elsewhere in this subquery&lt;/h2&gt;\n&lt;p&gt;This issue most often arises when you try to use aliases used in your &lt;code&gt;SELECT&lt;/code&gt; clause, further in the &lt;code&gt;HAVING&lt;/code&gt; clause. Aliases are names of fields that follow &lt;code&gt;AS&lt;/code&gt; in a &lt;code&gt;SELECT&lt;/code&gt; statement. They define a projection and are applied after the &lt;code&gt;HAVING&lt;/code&gt; clause (that's why you can't use them in HAVING).&lt;/p&gt;\n&lt;p&gt;An example of an invalid query (such a query &lt;strong&gt;WON'T&lt;/strong&gt; work):&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;USE &amp;lt;cluster-name&amp;gt;;\nSELECT\n    region,\n    COUNT(age) AS counter\nFROM `home/yql/tutorial/users`\nGROUP BY region\nHAVING counter &amp;gt; 3\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"46\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-46\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-46\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-46.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;To avoid calling aggregate functions twice, add a subquery, moving the logic from the &lt;code&gt;HAVING&lt;/code&gt; to the &lt;code&gt;WHERE&lt;/code&gt; clause.&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;USE &amp;lt;cluster-name&amp;gt;;\nSELECT *\nFROM\n    (SELECT\n        region,\n        COUNT(age) AS counter\n    FROM `home/yql/tutorial/users`\n    GROUP BY region)\nWHERE counter &amp;gt; 3\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"50\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-50\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-50\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-50.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"value-type-double-is-not-a-number\"&gt;&lt;a href=\"en/yql/faq/errors.html#value-type-double-is-not-a-number\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Value type \"double\" is not a number&lt;/span&gt;&lt;/a&gt;Value type \"double\" is not a number&lt;/h2&gt;\n&lt;p&gt;The reason for this error is, most often, division by zero: it results in an NaN value (not a number) not supported by YTsaurus in some cases.&lt;/p&gt;\n&lt;h2 id=\"row-weight-is-too-large\"&gt;&lt;a href=\"en/yql/faq/errors.html#row-weight-is-too-large\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Row weight is too large&lt;/span&gt;&lt;/a&gt;Row weight is too large&lt;/h2&gt;\n&lt;p&gt;This error occurs when the maximum memory allocated for a row is exhausted. Use the relevant &lt;a href=\"en/yql/syntax/pragma#yt\"&gt;PRAGMA&lt;/a&gt; to increase the maximum row length in your YTsaurus tables.&lt;br /&gt;\nThe default value is \"16M\", the maximum value is \"128M\". If you exceed the maximum value, change your computing logic, for example, split your table into parts or apply compression algorithms (&lt;a href=\"en/yql/udf/list/compress_decompress.html\"&gt;Compress UDF&lt;/a&gt;)&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;PRAGMA yt.MaxRowWeight = \"32M\";\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"63\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-63\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-63\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-63.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"key-weight-is-too-large\"&gt;&lt;a href=\"en/yql/faq/errors.html#key-weight-is-too-large\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Key weight is too large&lt;/span&gt;&lt;/a&gt;Key weight is too large&lt;/h2&gt;\n&lt;p&gt;This error arises when the value in a key field of the table is too large. One of the methods to resolve the issue is to use a &lt;a href=\"en/yql/syntax/pragma#yt\"&gt;PRAGMA&lt;/a&gt; that increases the maximum length of key table fields in YTsaurus, where fields are used for &lt;code&gt;ORDER BY&lt;/code&gt;, &lt;code&gt;GROUP BY&lt;/code&gt;, &lt;code&gt;PARTITION BY&lt;/code&gt;, &lt;code&gt;DISTINCT&lt;/code&gt;, &lt;code&gt;REDUCE&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;The default value is \"16K\" and the maximum value is \"256K\".&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;PRAGMA yt.MaxKeyWeight = \"32K\";\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"73\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-73\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-73\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-73.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"badtabledata\"&gt;&lt;a href=\"en/yql/faq/errors.html#badtabledata\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;The same table column includes values of different types&lt;/span&gt;&lt;/a&gt;The same table column includes values of different types&lt;/h2&gt;\n&lt;p&gt;When processing such tables, you might encounter different errors depending on query settings:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt; ReadYsonValue(): requirement cmd == Int64Marker failed, message: Expected char: \"\\2\", but read: \"\\1\"&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt; { 'Table input pipe failed' { 'Unexpected type of \"score\" column, expected: \"int64\" found \"uint64\"' } }&lt;/code&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;To read or process such a table, you need to patch the column type to &lt;code&gt;Yson?&lt;/code&gt; using &lt;a href=\"en/yql/syntax/select/with.html\"&gt;WITH COLUMNS&lt;/a&gt; and then parse the data manually using &lt;a href=\"en/yql/udf/list/yson.html\"&gt;Yson UDF&lt;/a&gt;:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;SELECT Yson::ConvertToDouble(bad_column, Yson::Options(false as Strict)) ?? CAST(Yson::ConvertToString(bad_column, Yson::Options(false as Strict)) as Double) as bad_column\nFROM `path/to/bad_table`\nWITH COLUMNS Struct&amp;lt;bad_column: Yson?&amp;gt;;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"95\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-95\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-95\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-95.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;If the types can be converted automatically, you can do like this:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;SELECT Yson::ConvertToDouble(bad_column, Yson::Options(true as AutoConvert)) as bad_column\nFROM `path/to/bad_table`\nWITH COLUMNS Struct&amp;lt;bad_column: Yson?&amp;gt;;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"99\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-99\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-99\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-99.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"symlinkaccess\"&gt;&lt;a href=\"en/yql/faq/errors.html#symlinkaccess\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Access denied for user &amp;lt;&amp;gt;: \"read\" permission for node &amp;lt;&amp;gt; is not allowed by any matching ACE&lt;/span&gt;&lt;/a&gt;Access denied for user &amp;lt;&amp;gt;: \"read\" permission for node &amp;lt;&amp;gt; is not allowed by any matching ACE&lt;/h2&gt;\n&lt;h3 id=\"requesting-rights-in-ytsaurus\"&gt;&lt;a href=\"en/yql/faq/errors.html#requesting-rights-in-ytsaurus\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Requesting rights in YTsaurus&lt;/span&gt;&lt;/a&gt;Requesting rights in YTsaurus&lt;/h3&gt;\n&lt;p&gt;Check whether you can open the table in the YTsaurus interface. If you don't have access rights, request them in the web interface YTsaurus or in the CLI.&lt;/p&gt;\n&lt;h3 id=\"rights-for-table-symlinks\"&gt;&lt;a href=\"en/yql/faq/errors.html#rights-for-table-symlinks\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Rights for table symlinks&lt;/span&gt;&lt;/a&gt;Rights for table symlinks&lt;/h3&gt;\n&lt;p&gt;If you can open the table in the YTsaurus interface but YQL can't see it, the issue may be in symlinks to tables, when the user has access rights for the underlying table but doesn't have a read access to its symlink. To resolve the underlying table in YTsaurus, you don't need read access to its symlink: that's why in YTsaurus the contents of the table would display normally. However, besides resolving the table, YQL also reads its symlink attributes because the attributes can override, for example, the table schema. To resolve this issue, request the rights to read the symlink.&lt;/p&gt;\n&lt;h2 id=\"key_monster\"&gt;&lt;a href=\"en/yql/faq/errors.html#key_monster\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Maximum allowed data weight per sorted job exceeds the limit&lt;/span&gt;&lt;/a&gt;Maximum allowed data weight per sorted job exceeds the limit&lt;/h2&gt;\n&lt;p&gt;In most cases, the error arises when executing a &lt;code&gt;JOIN&lt;/code&gt; if its inputs include a monster key (a huge number of records with the same key value). To check for a monster key, click the red circle in the query execution plan and drill down to the failed YTsaurus operation. After that, in the YTsaurus interface, open the &lt;code&gt;Partition sizes&lt;/code&gt; tab of the failed operation.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"images/partition_sizes.png\" alt=\"\" /&gt;&lt;/p&gt;\n&lt;p&gt;If you see large partitions (more than 200 GB), this indicates that you have monster keys. To find the value of the problem key, expand the error message in the operation's &lt;code&gt;Details&lt;/code&gt; tab. Most probably, you'll find it there.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"images/max_allowed_data_error.png\" alt=\"\" /&gt;&lt;/p&gt;\n&lt;p&gt;In this example, the problem key is an empty string. &lt;/p&gt;\n&lt;p&gt;The main way to resolve this issue is to filter the problem key values at JOIN inputs. Monster keys typically include irrelevant values (NULL, empty string) that you can safely filter out. If the values of monster keys are critical for you, process them separately.&lt;/p&gt;\n&lt;p&gt;Besides JOIN, such an error may also arise in the following cases:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;Huge amounts of data in &lt;code&gt;GROUP BY&lt;/code&gt;, &lt;code&gt;JOIN&lt;/code&gt;. Solution: try to decrease the data amount.&lt;/li&gt;\n&lt;li&gt;The &lt;a href=\"en/yql/syntax/window\"&gt;window&lt;/a&gt; includes the entire table. Solution: review the partitioning conditions for the window function&lt;/li&gt;\n&lt;li&gt;Huge amounts of data for certain values of the &lt;code&gt;GROUP BY&lt;/code&gt; key. The method used to find a problem key in this case is the same as for &lt;code&gt;JOIN&lt;/code&gt;. Solution: filter out the problem key, add more columns to the group key.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;h2 id=\"reading-multiple-times-from-the-same-source-is-not-supported\"&gt;&lt;a href=\"en/yql/faq/errors.html#reading-multiple-times-from-the-same-source-is-not-supported\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Reading multiple times from the same source is not supported&lt;/span&gt;&lt;/a&gt;Reading multiple times from the same source is not supported&lt;/h2&gt;\n&lt;p&gt;DQ can't execute the query because the resulting query execution plan splits the input into multiple streams. YTsaurus does not currently support this behavior, and you can't correctly execute this query.&lt;/p&gt;\n\n&lt;h2 id=\"strict-yson-type-is-not-allowed-to-write,-please-use-optional\"&gt;&lt;a href=\"en/yql/faq/errors.html#strict-yson-type-is-not-allowed-to-write,-please-use-optional\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Strict Yson type is not allowed to write, please use Optional&lt;/span&gt;&lt;/a&gt;Strict Yson type is not allowed to write, please use Optional&lt;/h2&gt;\n&lt;p&gt;This is a current YTsaurus restriction that doesn't allow writing non-optional Yson columns in &lt;code&gt;type_v3&lt;/code&gt; mode. The error occurs when using the &lt;a href=\"en/yql/syntax/pragma#yt-usenativeyttypes\"&gt;yt.UseNativeYtTypes&lt;/a&gt; pragma in the query. Please note that this pragma is enabled by default.&lt;/p&gt;\n&lt;p&gt;To fix the error:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Make sure that the query doesn't explicitly generate Yson-type data at any level (for example, the &lt;code&gt;List&amp;lt;Yson&amp;gt;&lt;/code&gt; type can't be written either).&lt;/li&gt;\n&lt;li&gt;Make sure that your query tables don't contain any columns with non-optional Yson at any level.&lt;/li&gt;\n&lt;li&gt;Some aggregate functions (for example, &lt;code&gt;AGG_LIST&lt;/code&gt;) inherently remove optionality from their elements. Even if the original column was of the &lt;code&gt;Optional&amp;lt;Yson&amp;gt;&lt;/code&gt; type, &lt;code&gt;AGG_LIST&lt;/code&gt; will result in the &lt;code&gt;List&amp;lt;Yson&amp;gt;&lt;/code&gt; type that can't be written. In this case, convert the column type into any other type before executing &lt;code&gt;AGG_LIST&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;You can also disable the &lt;code&gt;PRAGMA yt.UseNativeYtTypes&lt;/code&gt; pragma. Please note that if you disable the pragma, you will lose the benefits of strong typing, since native types will be represented as strings.&lt;/li&gt;\n&lt;/ul&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"en/yql/faq/errors.md","sourcePath":"en/yql/faq/errors.md"},"headings":[{"title":"Expected comparable type, but got: Yson","href":"en/yql/faq/errors.html#expected-comparable-type,-but-got-yson","level":2},{"title":"Cannot add type String (String?) and String (String?)","href":"en/yql/faq/errors.html#cannot-add-type-string-string-and-string-string","level":2},{"title":"Expression has to be an aggregation function or key column, because aggregation is used elsewhere in this subquery","href":"en/yql/faq/errors.html#expression-has-to-be-an-aggregation-function-or-key-column,-because-aggregation-is-used-elsewhere-in-this-subquery","level":2},{"title":"Value type \"double\" is not a number","href":"en/yql/faq/errors.html#value-type-double-is-not-a-number","level":2},{"title":"Row weight is too large","href":"en/yql/faq/errors.html#row-weight-is-too-large","level":2},{"title":"Key weight is too large","href":"en/yql/faq/errors.html#key-weight-is-too-large","level":2},{"title":"The same table column includes values of different types","href":"en/yql/faq/errors.html#badtabledata","level":2},{"title":"Access denied for user &lt;&gt;: \"read\" permission for node &lt;&gt; is not allowed by any matching ACE","href":"en/yql/faq/errors.html#symlinkaccess","level":2,"items":[{"title":"Requesting rights in YTsaurus","href":"en/yql/faq/errors.html#requesting-rights-in-ytsaurus","level":3},{"title":"Rights for table symlinks","href":"en/yql/faq/errors.html#rights-for-table-symlinks","level":3}]},{"title":"Maximum allowed data weight per sorted job exceeds the limit","href":"en/yql/faq/errors.html#key_monster","level":2},{"title":"Reading multiple times from the same source is not supported","href":"en/yql/faq/errors.html#reading-multiple-times-from-the-same-source-is-not-supported","level":2},{"title":"Strict Yson type is not allowed to write, please use Optional","href":"en/yql/faq/errors.html#strict-yson-type-is-not-allowed-to-write,-please-use-optional","level":2}],"title":"Errors"},"router":{"pathname":"en/yql/faq/errors","depth":4,"base":"../../../"},"lang":"en","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/en/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-a29ea7877730322f2ce693378d06d02ac2b374cd-en","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
