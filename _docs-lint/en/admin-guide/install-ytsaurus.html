        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;h2 id=\"deploying-ytsaurus-in-k8s\"&gt;&lt;a href=\"en/admin-guide/install-ytsaurus.html#deploying-ytsaurus-in-k8s\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Deploying YTsaurus in K8s&lt;/span&gt;&lt;/a&gt;Deploying YTsaurus in K8s&lt;/h2&gt;\n&lt;p&gt;You can deploy the YTsaurus cluster in &lt;a href=\"https://kubernetes.io/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Kubernetes&lt;/a&gt; using the &lt;a href=\"en/admin-guide/install-ytsaurus.html#operator\"&gt;operator&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;To successfully deploy YTsaurus in a Kubernetes cluster, there must be at least three nodes with at least four CPU cores and 8 GB of RAM.&lt;/p&gt;\n&lt;p&gt;Before using the operator, make sure you have the &lt;a href=\"https://kubernetes.io/docs/tasks/tools/#kubectl\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;kubectl&lt;/a&gt; utility installed and configured.&lt;/p&gt;\n&lt;h2 id=\"operator\"&gt;&lt;a href=\"en/admin-guide/install-ytsaurus.html#operator\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Kubernetes operator&lt;/span&gt;&lt;/a&gt;Kubernetes operator&lt;/h2&gt;\n&lt;p&gt;The YTsaurus team supports and develops its own K8s operator. The operator code is available on &lt;a href=\"https://github.com/ytsaurus/ytsaurus-k8s-operator\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;GitHub&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;Operator releases are posted on &lt;a href=\"https://github.com/ytsaurus/ytsaurus-k8s-operator/pkgs/container/k8s-operator\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Github Packages&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;Additionally, &lt;a href=\"https://github.com/ytsaurus/ytsaurus-k8s-operator/pkgs/container/ytop-chart\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;helm charts&lt;/a&gt; are laid out so you can install all the components you need.&lt;/p&gt;\n&lt;h3 id=\"installing-the-operator\"&gt;&lt;a href=\"en/admin-guide/install-ytsaurus.html#installing-the-operator\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Installing the operator&lt;/span&gt;&lt;/a&gt;Installing the operator&lt;/h3&gt;\n&lt;ol&gt;\n&lt;li&gt;Install the &lt;a href=\"https://helm.sh/docs/intro/install/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;helm&lt;/a&gt; utility.&lt;/li&gt;\n&lt;li&gt;Install cert-manager: &lt;code&gt;kubectl apply -f https://github.com/cert-manager/cert-manager/releases/download/v1.11.0/cert-manager.yaml&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;Install the charts &lt;code&gt;helm install ytsaurus oci://ghcr.io/ytsaurus/ytop-chart --version 0.20.0&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;Check the result:&lt;/li&gt;\n&lt;/ol&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;$ kubectl get pod\nNAME                                                      READY   STATUS     RESTARTS   AGE\nytsaurus-ytop-chart-controller-manager-7478f9b6cb-qr8wd   2/2     Running   0           1m\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"49\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-49\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-49\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-49.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;You can read about updating the operator in &lt;a href=\"admin-guide/update-ytsaurus.html#operator\"&gt;that section&lt;/a&gt;.&lt;/p&gt;\n&lt;h2 id=\"starting-cluster\"&gt;&lt;a href=\"en/admin-guide/install-ytsaurus.html#starting-cluster\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Starting cluster YTsaurus&lt;/span&gt;&lt;/a&gt;Starting cluster YTsaurus&lt;/h2&gt;\n&lt;p&gt;Create a namespace to run the cluster:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;$ kubectl create namespace &amp;lt;namespace&amp;gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"59\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-59\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-59\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-59.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Create a secret containing the login, password, and token of the cluster administrator:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;$ kubectl create secret generic ytadminsec --from-literal=login=admin --from-literal=password=&amp;lt;password&amp;gt; --from-literal=token=&amp;lt;password&amp;gt;  -n &amp;lt;namespace&amp;gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"63\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-63\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-63\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-63.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;&lt;a href=\"admin-guide/prepare-spec.html\"&gt;Prepare the &lt;code&gt;Ytsaurus&lt;/code&gt; specification&lt;/a&gt; for the resource and upload it to K8s (&lt;a href=\"https://github.com/ytsaurus/ytsaurus-k8s-operator/blob/main/config/samples/cluster_v1_demo.yaml\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;sample specification&lt;/a&gt;):&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;$ kubectl apply -f my_ytsaurus_spec.yaml -n &amp;lt;namespace&amp;gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"67\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-67\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-67\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-67.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;The cluster will move to the &lt;code&gt;Initializing&lt;/code&gt; state, and the operator will go to start all the necessary components.&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;$ kubectl get ytsaurus -n &amp;lt;namespace&amp;gt;\nNAME         CLUSTERSTATE   UPDATESTATE   UPDATINGCOMPONENTS\nminisaurus   Initializing   None\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"71\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-71\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-71\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-71.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;You can track how pods are started using &lt;code&gt;kubectl get pod -n &amp;lt;namespace&amp;gt;&lt;/code&gt;.&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Sample successfully raised cluster&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;What the pods look like during cluster initialization.&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;$ kubectl get pod -n &amp;lt;namespace&amp;gt;\nNAME                                                    READY   STATUS     RESTARTS   AGE\nds-0                                                    0/1     Init:0/1   0          1s\nms-0                                                    0/1     Init:0/1   0          1s\nytsaurus-ytop-chart-controller-manager-fbbffc97-6stk8   2/2     Running    0          2m43s\n\n$ kubectl get pod -n &amp;lt;namespace&amp;gt;\nNAME                                                    READY   STATUS      RESTARTS   AGE\nds-0                                                    1/1     Running     0          28s\nms-0                                                    1/1     Running     0          28s\nyt-master-init-job-default-vtkzw                        0/1     Completed   1          25s\nytsaurus-ytop-chart-controller-manager-fbbffc97-6stk8   2/2     Running     0          3m10s\n\n$ kubectl get pod -n &amp;lt;namespace&amp;gt;\nNAME                                                    READY   STATUS              RESTARTS   AGE\nca-0                                                    0/1     PodInitializing     0          9s\ndnd-0                                                   1/1     Running             0          10s\nds-0                                                    1/1     Running             0          41s\nend-0                                                   0/1     Init:0/1            0          9s\nhp-0                                                    1/1     Running             0          10s\nhp-control-0                                            0/1     PodInitializing     0          9s\nms-0                                                    1/1     Running             0          41s\nrp-0                                                    0/1     PodInitializing     0          9s\nrp-heavy-0                                              0/1     PodInitializing     0          9s\nyt-master-init-job-default-vtkzw                        0/1     Completed           1          38s\nyt-ui-init-job-default-2rsfz                            0/1     ContainerCreating   0          8s\nytsaurus-ytop-chart-controller-manager-fbbffc97-6stk8   2/2     Running             0          3m23s\n\n$ kubectl get ytsaurus -n &amp;lt;namespace&amp;gt;\nNAME         CLUSTERSTATE   UPDATESTATE   UPDATINGCOMPONENTS\nminisaurus   Initializing        None\n\n$ kubectl get pod -n &amp;lt;namespace&amp;gt;\nNAME                                                    READY   STATUS      RESTARTS   AGE\nca-0                                                    1/1     Running     0          21s\ndnd-0                                                   1/1     Running     0          22s\nds-0                                                    1/1     Running     0          53s\nend-0                                                   1/1     Running     0          21s\nhp-0                                                    1/1     Running     0          22s\nhp-control-0                                            1/1     Running     0          21s\nms-0                                                    1/1     Running     0          53s\nrp-0                                                    1/1     Running     0          21s\nrp-heavy-0                                              1/1     Running     0          21s\nsch-0                                                   1/1     Running     0          7s\nyt-client-init-job-user-jtl8p                           0/1     Completed   0          11s\nyt-master-init-job-default-vtkzw                        0/1     Completed   1          50s\nyt-ui-init-job-default-2rsfz                            0/1     Completed   0          20s\nytsaurus-ui-deployment-7b5d4776df-w42mj                 1/1     Running     0          5s\nytsaurus-ytop-chart-controller-manager-fbbffc97-6stk8   2/2     Running     0          3m35s\n\n$ kubectl get ytsaurus -n &amp;lt;namespace&amp;gt;\nNAME         CLUSTERSTATE   UPDATESTATE   UPDATINGCOMPONENTS\nminisaurus   Running        None\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"83\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-83\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-83\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-83.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;Wait for the operator to create the cluster. The &lt;code&gt;Ytsaurus&lt;/code&gt; resource should be in the &lt;code&gt;Running&lt;/code&gt; state:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;$ kubectl get ytsaurus -n &amp;lt;namespace&amp;gt;\nNAME         CLUSTERSTATE   UPDATESTATE   UPDATINGCOMPONENTS\nminisaurus   Running        None\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"89\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-89\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-89\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-89.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"diagnosing-problems-during-initialization\"&gt;&lt;a href=\"en/admin-guide/install-ytsaurus.html#diagnosing-problems-during-initialization\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Diagnosing problems during initialization&lt;/span&gt;&lt;/a&gt;Diagnosing problems during initialization&lt;/h3&gt;\n&lt;p&gt;If the cluster is stuck in the &lt;code&gt;Initializing&lt;/code&gt; state, start debugging by checking &lt;code&gt;Ytsaurus sync status&lt;/code&gt; messages in the operator logs, which list the components that didn't start properly. To view the logs, use the command &lt;code&gt;kubectl logs deployment.apps/ytsaurus-ytop-chart-controller-manager&lt;/code&gt;.&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Sample operator logs with component status&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;kubectl logs deployment.apps/ytsaurus-ytop-chart-controller-manager\n...\n2023-09-10T11:43:00.405Z        INFO    Ytsaurus &lt;span class=\"hljs-built_in\"&gt;sync&lt;/span&gt; status    {&lt;span class=\"hljs-string\"&gt;\"controller\"&lt;/span&gt;: &lt;span class=\"hljs-string\"&gt;\"ytsaurus\"&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;\"controllerGroup\"&lt;/span&gt;: &lt;span class=\"hljs-string\"&gt;\"cluster.ytsaurus.tech\"&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;\"controllerKind\"&lt;/span&gt;: &lt;span class=\"hljs-string\"&gt;\"Ytsaurus\"&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;\"ytsaurus\"&lt;/span&gt;: {&lt;span class=\"hljs-string\"&gt;\"name\"&lt;/span&gt;:&lt;span class=\"hljs-string\"&gt;\"minisaurus\"&lt;/span&gt;,&lt;span class=\"hljs-string\"&gt;\"namespace\"&lt;/span&gt;:&lt;span class=\"hljs-string\"&gt;\"default\"&lt;/span&gt;}, &lt;span class=\"hljs-string\"&gt;\"namespace\"&lt;/span&gt;: &lt;span class=\"hljs-string\"&gt;\"default\"&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;\"name\"&lt;/span&gt;: &lt;span class=\"hljs-string\"&gt;\"minisaurus\"&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;\"reconcileID\"&lt;/span&gt;: &lt;span class=\"hljs-string\"&gt;\"a9fcb896-5976-4d60-b18b-730a2c969758\"&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;\"notReadyComponents\"&lt;/span&gt;: [&lt;span class=\"hljs-string\"&gt;\"Discovery\"&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;\"Master\"&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;\"YtsaurusClient\"&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;\"DataNode\"&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;\"HttpProxy\"&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;\"HttpPr , &lt;span class=\"hljs-string\"&gt;\"RpcProxy-heavy\"&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;\"ExecNode\"&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;\"Scheduler\"&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;\"ControllerAgent\"&lt;/span&gt;], &lt;span class=\"hljs-string\"&gt;\"updateState\"&lt;/span&gt;: &lt;span class=\"hljs-string\"&gt;\"None\"&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;\"clusterState\"&lt;/span&gt;: &lt;span class=\"hljs-string\"&gt;\"Running\"&lt;/span&gt;}\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"101\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-101\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-101\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-101.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;To find out why a component isn't running, check the &lt;code&gt;Conditions&lt;/code&gt; field in the &lt;code&gt;Ytsaurus&lt;/code&gt; resource status. You can view the status by executing the command &lt;code&gt;kubectl describe ytsaurus -n &amp;lt;namespace&amp;gt;&lt;/code&gt;.&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Conditions sample during cluster initialization&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;The example shows that the &lt;code&gt;Scheduler&lt;/code&gt; component isn't initializing since the &lt;code&gt;ExecNode&lt;/code&gt; component is not running yet (&lt;code&gt;Message:Wait for ExecNode&lt;/code&gt;), as it awaits its pods in statefulset (&lt;code&gt;Wait for pods&lt;/code&gt;).&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs yaml\"&gt;&lt;span class=\"hljs-attr\"&gt;Status:&lt;/span&gt;\n  &lt;span class=\"hljs-attr\"&gt;Conditions:&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;Last Transition Time:&lt;/span&gt;  &lt;span class=\"hljs-number\"&gt;2023-09-10T11:53:43Z&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;Message:&lt;/span&gt;               &lt;span class=\"hljs-string\"&gt;Ready&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;Reason:&lt;/span&gt;                &lt;span class=\"hljs-string\"&gt;Ready&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;Status:&lt;/span&gt;                &lt;span class=\"hljs-literal\"&gt;True&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;Type:&lt;/span&gt;                  &lt;span class=\"hljs-string\"&gt;DiscoveryReady&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;Last Transition Time:&lt;/span&gt;  &lt;span class=\"hljs-number\"&gt;2023-09-10T11:54:27Z&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;Message:&lt;/span&gt;               &lt;span class=\"hljs-string\"&gt;yt-master-init-job-default&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;completed&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;Reason:&lt;/span&gt;                &lt;span class=\"hljs-string\"&gt;Ready&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;Status:&lt;/span&gt;                &lt;span class=\"hljs-literal\"&gt;True&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;Type:&lt;/span&gt;                  &lt;span class=\"hljs-string\"&gt;MasterReady&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;Last Transition Time:&lt;/span&gt;  &lt;span class=\"hljs-number\"&gt;2023-09-10T11:53:33Z&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;Message:&lt;/span&gt;               &lt;span class=\"hljs-string\"&gt;Wait&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;for&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;HttpProxy&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;Reason:&lt;/span&gt;                &lt;span class=\"hljs-string\"&gt;Blocked&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;Status:&lt;/span&gt;                &lt;span class=\"hljs-literal\"&gt;False&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;Type:&lt;/span&gt;                  &lt;span class=\"hljs-string\"&gt;YtsaurusClientReady&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;Last Transition Time:&lt;/span&gt;  &lt;span class=\"hljs-number\"&gt;2023-09-10T11:53:33Z&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;Message:&lt;/span&gt;               &lt;span class=\"hljs-string\"&gt;Wait&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;for&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;pods&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;Reason:&lt;/span&gt;                &lt;span class=\"hljs-string\"&gt;Blocked&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;Status:&lt;/span&gt;                &lt;span class=\"hljs-literal\"&gt;False&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;Type:&lt;/span&gt;                  &lt;span class=\"hljs-string\"&gt;DataNodeReady&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;Last Transition Time:&lt;/span&gt;  &lt;span class=\"hljs-number\"&gt;2023-09-10T11:53:33Z&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;Message:&lt;/span&gt;               &lt;span class=\"hljs-string\"&gt;Wait&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;for&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;pods&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;Reason:&lt;/span&gt;                &lt;span class=\"hljs-string\"&gt;Blocked&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;Status:&lt;/span&gt;                &lt;span class=\"hljs-literal\"&gt;False&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;Type:&lt;/span&gt;                  &lt;span class=\"hljs-string\"&gt;HttpProxyReady&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;Last Transition Time:&lt;/span&gt;  &lt;span class=\"hljs-number\"&gt;2023-09-10T11:53:33Z&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;Message:&lt;/span&gt;               &lt;span class=\"hljs-string\"&gt;Wait&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;for&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;pods&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;Reason:&lt;/span&gt;                &lt;span class=\"hljs-string\"&gt;Blocked&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;Status:&lt;/span&gt;                &lt;span class=\"hljs-literal\"&gt;False&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;Type:&lt;/span&gt;                  &lt;span class=\"hljs-string\"&gt;HttpProxy-controlReady&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;Last Transition Time:&lt;/span&gt;  &lt;span class=\"hljs-number\"&gt;2023-09-10T11:53:33Z&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;Message:&lt;/span&gt;               &lt;span class=\"hljs-string\"&gt;Wait&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;for&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;yt-ui-init-job-default&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;completion&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;Reason:&lt;/span&gt;                &lt;span class=\"hljs-string\"&gt;Blocked&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;Status:&lt;/span&gt;                &lt;span class=\"hljs-literal\"&gt;False&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;Type:&lt;/span&gt;                  &lt;span class=\"hljs-string\"&gt;UIReady&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;Last Transition Time:&lt;/span&gt;  &lt;span class=\"hljs-number\"&gt;2023-09-10T11:53:33Z&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;Message:&lt;/span&gt;               &lt;span class=\"hljs-string\"&gt;Wait&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;for&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;pods&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;Reason:&lt;/span&gt;                &lt;span class=\"hljs-string\"&gt;Blocked&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;Status:&lt;/span&gt;                &lt;span class=\"hljs-literal\"&gt;False&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;Type:&lt;/span&gt;                  &lt;span class=\"hljs-string\"&gt;RpcProxyReady&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;Last Transition Time:&lt;/span&gt;  &lt;span class=\"hljs-number\"&gt;2023-09-10T11:53:33Z&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;Message:&lt;/span&gt;               &lt;span class=\"hljs-string\"&gt;Wait&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;for&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;pods&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;Reason:&lt;/span&gt;                &lt;span class=\"hljs-string\"&gt;Blocked&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;Status:&lt;/span&gt;                &lt;span class=\"hljs-literal\"&gt;False&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;Type:&lt;/span&gt;                  &lt;span class=\"hljs-string\"&gt;RpcProxy-heavyReady&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;Last Transition Time:&lt;/span&gt;  &lt;span class=\"hljs-number\"&gt;2023-09-10T11:53:33Z&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;Message:&lt;/span&gt;               &lt;span class=\"hljs-string\"&gt;Wait&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;for&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;pods&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;Reason:&lt;/span&gt;                &lt;span class=\"hljs-string\"&gt;Blocked&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;Status:&lt;/span&gt;                &lt;span class=\"hljs-literal\"&gt;False&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;Type:&lt;/span&gt;                  &lt;span class=\"hljs-string\"&gt;ExecNodeReady&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;Last Transition Time:&lt;/span&gt;  &lt;span class=\"hljs-number\"&gt;2023-09-10T11:53:33Z&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;Message:&lt;/span&gt;               &lt;span class=\"hljs-string\"&gt;Wait&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;for&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;ExecNode&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;Reason:&lt;/span&gt;                &lt;span class=\"hljs-string\"&gt;Blocked&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;Status:&lt;/span&gt;                &lt;span class=\"hljs-literal\"&gt;False&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;Type:&lt;/span&gt;                  &lt;span class=\"hljs-string\"&gt;SchedulerReady&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;Last Transition Time:&lt;/span&gt;  &lt;span class=\"hljs-number\"&gt;2023-09-10T11:53:33Z&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;Message:&lt;/span&gt;               &lt;span class=\"hljs-string\"&gt;Wait&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;for&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;pods&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;Reason:&lt;/span&gt;                &lt;span class=\"hljs-string\"&gt;Blocked&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;Status:&lt;/span&gt;                &lt;span class=\"hljs-literal\"&gt;False&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;Type:&lt;/span&gt;                  &lt;span class=\"hljs-string\"&gt;ControllerAgentReady&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;Last Transition Time:&lt;/span&gt;  &lt;span class=\"hljs-number\"&gt;2023-09-10T11:54:25Z&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;Message:&lt;/span&gt;               &lt;span class=\"hljs-string\"&gt;Init&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;job&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;successfully&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;completed&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;Reason:&lt;/span&gt;                &lt;span class=\"hljs-string\"&gt;InitJobCompleted&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;Status:&lt;/span&gt;                &lt;span class=\"hljs-literal\"&gt;True&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;Type:&lt;/span&gt;                  &lt;span class=\"hljs-string\"&gt;defaultMasterInitJobCompleted&lt;/span&gt;\n  &lt;span class=\"hljs-attr\"&gt;State:&lt;/span&gt;                   &lt;span class=\"hljs-string\"&gt;Initializing&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"115\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-115\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-115\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-115.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;One possible reason for the cluster getting stuck in the &lt;code&gt;Initializing&lt;/code&gt; state could be that one of the init jobs is still running, either because it didn't have had enough time to complete or failed. Check the job logs using the command &lt;code&gt;kubectl logs &amp;lt;init-job-pod-name&amp;gt; -n &amp;lt;namespace&amp;gt;&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Another possible reason is that K8s isn't able to schedule cluster sub-nodes due to a shortage of K8s nodes satisfying &lt;code&gt;resources.requests&lt;/code&gt; components.&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Sample pod that can't be deployed&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;The &lt;code&gt;Ytsaurus&lt;/code&gt; specification has the following &lt;code&gt;execNodes&lt;/code&gt; group set:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs yaml\"&gt;  &lt;span class=\"hljs-attr\"&gt;execNodes:&lt;/span&gt;\n    &lt;span class=\"hljs-bullet\"&gt;-&lt;/span&gt; &lt;span class=\"hljs-attr\"&gt;instanceCount:&lt;/span&gt; &lt;span class=\"hljs-number\"&gt;1&lt;/span&gt;\n      &lt;span class=\"hljs-attr\"&gt;loggers:&lt;/span&gt; &lt;span class=\"hljs-meta\"&gt;*loggers&lt;/span&gt;\n      &lt;span class=\"hljs-attr\"&gt;resources:&lt;/span&gt;\n        &lt;span class=\"hljs-attr\"&gt;limits:&lt;/span&gt;\n          &lt;span class=\"hljs-attr\"&gt;cpu:&lt;/span&gt; &lt;span class=\"hljs-number\"&gt;10&lt;/span&gt;\n          &lt;span class=\"hljs-attr\"&gt;memory:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;2Gi&lt;/span&gt;\n        &lt;span class=\"hljs-attr\"&gt;requests:&lt;/span&gt;\n          &lt;span class=\"hljs-attr\"&gt;cpu:&lt;/span&gt; &lt;span class=\"hljs-number\"&gt;10&lt;/span&gt;\n\n      &lt;span class=\"hljs-attr\"&gt;volumeMounts:&lt;/span&gt;\n        &lt;span class=\"hljs-bullet\"&gt;-&lt;/span&gt; &lt;span class=\"hljs-attr\"&gt;name:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;node-data&lt;/span&gt;\n          &lt;span class=\"hljs-attr\"&gt;mountPath:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;/yt/node-data&lt;/span&gt;\n\n      &lt;span class=\"hljs-attr\"&gt;volumes:&lt;/span&gt;\n        &lt;span class=\"hljs-bullet\"&gt;-&lt;/span&gt; &lt;span class=\"hljs-attr\"&gt;name:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;node-data&lt;/span&gt;\n          &lt;span class=\"hljs-attr\"&gt;emptyDir:&lt;/span&gt;\n            &lt;span class=\"hljs-attr\"&gt;sizeLimit:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;5Gi&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"132\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-132\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-132\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-132.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;If there isn't a node with 10 CPUs in K8s, the pod will get stuck in the &lt;code&gt;Pending&lt;/code&gt; state:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;$  kubectl get pod -n &amp;lt;namespace&amp;gt;\nNAME                                                    READY   STATUS    RESTARTS   AGE\nca-0                                                    1/1     Running   0          14m\ndnd-0                                                   1/1     Running   0          14m\nds-0                                                    1/1     Running   0          15m\nend-0                                                   0/1     Pending   0          15m\nhp-0                                                    1/1     Running   0          14m\nhp-control-0                                            1/1     Running   0          14m\nms-0                                                    1/1     Running   0          15m\n...\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"136\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-136\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-136\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-136.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;You can find out why using &lt;code&gt;kubectl describe&lt;/code&gt;:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;$ kubectl describe pod end-0 -n &amp;lt;namespace&amp;gt;\n...\nEvents:\n  Type     Reason            Age    From               Message\n  ----     ------            ----   ----               -------\n  Warning  FailedScheduling  15m42s  default-scheduler  0/1 nodes are available: 1 Insufficient cpu. preemption: 0/1 nodes are available: 1 No preemption victims found &lt;span class=\"hljs-keyword\"&gt;for&lt;/span&gt; incoming pod..\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"140\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-140\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-140\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-140.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"installing-ytsaurus-ui-helm-chart\"&gt;&lt;a href=\"en/admin-guide/install-ytsaurus.html#installing-ytsaurus-ui-helm-chart\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Installing YTsaurus UI helm chart&lt;/span&gt;&lt;/a&gt;Installing YTsaurus UI helm chart&lt;/h2&gt;\n&lt;h3 id=\"using-with-ytop-chart\"&gt;&lt;a href=\"en/admin-guide/install-ytsaurus.html#using-with-ytop-chart\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Using with ytop-chart&lt;/span&gt;&lt;/a&gt;Using with &lt;a href=\"https://github.com/ytsaurus/ytsaurus-k8s-operator/pkgs/container/ytop-chart\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;ytop-chart&lt;/a&gt;&lt;/h3&gt;\n&lt;p&gt;Follow all required steps to &lt;a href=\"en/admin-guide/install-ytsaurus.html#starting-cluster\"&gt;start the YTsaurus cluster&lt;/a&gt;. Then install the chart:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;git clone https://github.com/ytsaurus/ytsaurus-ui.git\nhelm upgrade --install ytsaurus-ui ytsaurus-ui/packages/ui-helm-chart/\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"152\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-152\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-152\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-152.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"using-with-a-custom-cluster\"&gt;&lt;a href=\"en/admin-guide/install-ytsaurus.html#using-with-a-custom-cluster\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Using with a custom cluster&lt;/span&gt;&lt;/a&gt;Using with a custom cluster&lt;/h3&gt;\n&lt;h4 id=\"pre-requirements\"&gt;&lt;a href=\"en/admin-guide/install-ytsaurus.html#pre-requirements\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Pre-requirements&lt;/span&gt;&lt;/a&gt;Pre-requirements&lt;/h4&gt;\n&lt;p&gt;The instructions below describe how to start the YTsaurus UI from the helm chart. You are supposed to have already:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;configured the &lt;code&gt;kubectl&lt;/code&gt; cli-tool (for example, use &lt;a href=\"https://minikube.sigs.k8s.io/docs/start/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;minikube&lt;/a&gt;),&lt;/li&gt;\n&lt;li&gt;started your YTsaurus cluster and know the hostname of &lt;code&gt;http_proxy&lt;/code&gt;,&lt;/li&gt;\n&lt;li&gt;prepared a special robot-user for the YTsaurus UI and ready to provide its token (see the &lt;a href=\"user-guide/storage/auth.html#token-management\"&gt;Token management&lt;/a&gt; section).&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h4 id=\"quick-start\"&gt;&lt;a href=\"en/admin-guide/install-ytsaurus.html#quick-start\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Quick start&lt;/span&gt;&lt;/a&gt;Quick start&lt;/h4&gt;\n&lt;p&gt;By default, the chart expects existence of &lt;code&gt;yt-ui-secret&lt;/code&gt; with the &lt;code&gt;yt-interface-secret.json&lt;/code&gt; key. The secret can be created by the following commands:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;read -sp \"TOKEN: \" TOKEN ; echo '{\"oauthToken\":\"'$TOKEN'\"}' &amp;gt; tmp.json\nkubectl create secret generic yt-ui-secret --from-literal=\"yt-interface-secret.json=$(cat tmp.json)\" &amp;amp;&amp;amp; rm tmp.json\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"185\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-185\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-185\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-185.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Also, you have to provide a description of your cluster:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;read -p \"Cluster id: \" id_; read -p \"http_proxy hostname: \" proxy_; read -p \"Use https [true/false]: \" secure_; read -p \"NODE_TLS_REJECT_UNAUTHORIZED [1/0]: \" tlsrej_; (\ntee values.yaml &amp;lt;&amp;lt; _EOF\nui:\n  env:\n    - name: NODE_TLS_REJECT_UNAUTHORIZED\n      value: \"$tlsrej_\"\n    - name: ALLOW_PASSWORD_AUTH\n      value: \"1\"\n  clusterConfig:\n    clusters:\n      - authentication: basic\n        id: $id_\n        proxy: $proxy_\n        description: My first YTsaurus. Handle with care.\n        environment: testing\n        group: My YTsaurus clusters\n        name: my cluster\n        primaryMaster:\n          cellTag: 1\n        secure: $secure_\n        theme: lavander\n_EOF\n)\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"189\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-189\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-189\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-189.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Then you are ready to install or upgrade the chart:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;git clone https://github.com/ytsaurus/ytsaurus-ui.git\nhelm upgrade --install yt-ui ytsaurus-ui/packages/ui-helm-chart/ -f values.yaml\n# or run specific version of UI (all versions: https://github.com/ytsaurus/ytsaurus-ui/pkgs/container/ui)\nhelm upgrade --install yt-ui ytsaurus-ui/packages/ui-helm-chart/ -f values.yaml --set ui.image.tag=1.60.1\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"193\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-193\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-193\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-193.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;You may want to add port-forwarding to open the YTsaurus UI in your browser:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;kubectl port-forward deployment/yt-ui-ytsaurus-ui-chart 8080:80\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"197\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-197\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-197\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-197.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"cron-installation\"&gt;&lt;a href=\"en/admin-guide/install-ytsaurus.html#cron-installation\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Cron Installation&lt;/span&gt;&lt;/a&gt;Cron Installation&lt;/h2&gt;\n&lt;h3 id=\"description\"&gt;&lt;a href=\"en/admin-guide/install-ytsaurus.html#description\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Description&lt;/span&gt;&lt;/a&gt;Description&lt;/h3&gt;\n&lt;p&gt;For YTsaurus, there is a set of cron jobs that are useful for cluster operations, such as cleaning up temporary directories or removing inactive nodes. Both built-in and custom jobs are supported.&lt;/p&gt;\n&lt;p&gt;List of built-in scripts:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;clear_tmp&lt;/code&gt; – a script that cleans temporary files on the cluster. The script’s source code lives &lt;a href=\"https://github.com/ytsaurus/ytsaurus/tree/main/yt/cron/clear_tmp\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;here&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;prune_offline_cluster_nodes&lt;/code&gt; – a script that removes offline nodes from Cypress. The script’s source code lives &lt;a href=\"https://github.com/ytsaurus/ytsaurus/blob/main/yt/cron/prune_offline_cluster_nodes\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;here&lt;/a&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h3 id=\"prerequisites\"&gt;&lt;a href=\"en/admin-guide/install-ytsaurus.html#prerequisites\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Prerequisites&lt;/span&gt;&lt;/a&gt;Prerequisites&lt;/h3&gt;\n&lt;p&gt;At this point, you should have:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Helm 3.x&lt;/li&gt;\n&lt;li&gt;a running YTsaurus cluster and the HTTP proxy address (&lt;code&gt;http_proxy&lt;/code&gt;)&lt;/li&gt;\n&lt;li&gt;a dedicated robot user for Cron with a token issued to it (see &lt;a href=\"user-guide/storage/auth.html#token-management\"&gt;Token Management&lt;/a&gt;)&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h3 id=\"basic-installation\"&gt;&lt;a href=\"en/admin-guide/install-ytsaurus.html#basic-installation\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Basic Installation&lt;/span&gt;&lt;/a&gt;Basic Installation&lt;/h3&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;helm install ytsaurus-cron oci://ghcr.io/ytsaurus/cron-chart --version 0.0.2 --&lt;span class=\"hljs-built_in\"&gt;set&lt;/span&gt; yt.proxy=&lt;span class=\"hljs-string\"&gt;\"http_proxy\"&lt;/span&gt; --&lt;span class=\"hljs-built_in\"&gt;set&lt;/span&gt; yt.token=&lt;span class=\"hljs-string\"&gt;\"&amp;lt;ROBOT-CRON-TOKEN&amp;gt;\"&lt;/span&gt; --&lt;span class=\"hljs-built_in\"&gt;set&lt;/span&gt; image.tag=&lt;span class=\"hljs-string\"&gt;\"0.0.2\"&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"248\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-248\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-248\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-248.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"configuration\"&gt;&lt;a href=\"en/admin-guide/install-ytsaurus.html#configuration\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Configuration&lt;/span&gt;&lt;/a&gt;Configuration&lt;/h3&gt;\n&lt;p&gt;All chart parameters can be set via &lt;code&gt;values.yaml&lt;/code&gt; or overridden with &lt;code&gt;--set&lt;/code&gt; on the command line.&lt;/p&gt;\n&lt;h3 id=\"authentication-in-ytsaurus\"&gt;&lt;a href=\"en/admin-guide/install-ytsaurus.html#authentication-in-ytsaurus\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Authentication in YTsaurus&lt;/span&gt;&lt;/a&gt;Authentication in YTsaurus&lt;/h3&gt;\n&lt;p&gt;Specify the token directly:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs yaml\"&gt;&lt;span class=\"hljs-attr\"&gt;yt:&lt;/span&gt;\n  &lt;span class=\"hljs-attr\"&gt;proxy:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;yt.company.com&lt;/span&gt;\n  &lt;span class=\"hljs-attr\"&gt;token:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;Qwerty123!&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"261\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-261\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-261\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-261.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Or configure it via a Kubernetes Secret:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs yaml\"&gt;&lt;span class=\"hljs-attr\"&gt;unmanagedSecret:&lt;/span&gt;\n  &lt;span class=\"hljs-attr\"&gt;enabled:&lt;/span&gt; &lt;span class=\"hljs-literal\"&gt;true&lt;/span&gt;\n  &lt;span class=\"hljs-attr\"&gt;secretKeyRef:&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;name:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;ytadminsec&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;key:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;token&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"265\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-265\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-265\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-265.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"built-in-jobs\"&gt;&lt;a href=\"en/admin-guide/install-ytsaurus.html#built-in-jobs\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Built-in Jobs ()&lt;/span&gt;&lt;/a&gt;Built-in Jobs (&lt;code&gt;jobs&lt;/code&gt;)&lt;/h3&gt;\n&lt;p&gt;Each job is defined by the following structure:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;name&lt;/code&gt;: a unique job name&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;enabled&lt;/code&gt;: whether the job is enabled&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;args&lt;/code&gt;: command-line arguments&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;schedule&lt;/code&gt;: cron-format schedule&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;restartPolicy&lt;/code&gt;: restart policy (recommended: &lt;code&gt;Never&lt;/code&gt;)&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Example of enabling a job:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;helm upgrade --install ytsaurus-cron oci://ghcr.io/ytsaurus/cron-chart --version 0.0.2 --&lt;span class=\"hljs-built_in\"&gt;set&lt;/span&gt; &lt;span class=\"hljs-built_in\"&gt;jobs&lt;/span&gt;[1].enabled=&lt;span class=\"hljs-literal\"&gt;true&lt;/span&gt; --&lt;span class=\"hljs-built_in\"&gt;set&lt;/span&gt; &lt;span class=\"hljs-built_in\"&gt;jobs&lt;/span&gt;[1].args[5]=&lt;span class=\"hljs-string\"&gt;\"tmp_files\"&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"302\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-302\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-302\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-302.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Array indexing of &lt;code&gt;jobs&lt;/code&gt; starts at zero—keep track of the job order.&lt;/p&gt;\n&lt;h3 id=\"custom-jobs\"&gt;&lt;a href=\"en/admin-guide/install-ytsaurus.html#custom-jobs\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Custom Jobs&lt;/span&gt;&lt;/a&gt;Custom Jobs&lt;/h3&gt;\n&lt;p&gt;You can define your own jobs:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs yaml\"&gt;&lt;span class=\"hljs-attr\"&gt;additionalJobs:&lt;/span&gt;\n  &lt;span class=\"hljs-bullet\"&gt;-&lt;/span&gt; &lt;span class=\"hljs-attr\"&gt;name:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;my_cleanup&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;enabled:&lt;/span&gt; &lt;span class=\"hljs-literal\"&gt;true&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;args:&lt;/span&gt;\n      &lt;span class=\"hljs-bullet\"&gt;-&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;clear_tmp&lt;/span&gt;\n      &lt;span class=\"hljs-bullet\"&gt;-&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;--directory&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;\"//my/custom/path\"&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;schedule:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;\"0 */6 * * *\"&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;restartPolicy:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;Never&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"312\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-312\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-312\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-312.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"example\"&gt;&lt;a href=\"en/admin-guide/install-ytsaurus.html#example\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Example &lt;/span&gt;&lt;/a&gt;Example &lt;code&gt;values.yaml&lt;/code&gt;&lt;/h3&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs yaml\"&gt;&lt;span class=\"hljs-attr\"&gt;yt:&lt;/span&gt;\n  &lt;span class=\"hljs-attr\"&gt;proxy:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;yt.mycompany.com&lt;/span&gt;\n  &lt;span class=\"hljs-attr\"&gt;token:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;my-secret-token&lt;/span&gt;\n\n&lt;span class=\"hljs-attr\"&gt;jobs:&lt;/span&gt;\n  &lt;span class=\"hljs-bullet\"&gt;-&lt;/span&gt; &lt;span class=\"hljs-attr\"&gt;name:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;clear_tmp_files&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;enabled:&lt;/span&gt; &lt;span class=\"hljs-literal\"&gt;true&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;args:&lt;/span&gt;\n      &lt;span class=\"hljs-bullet\"&gt;-&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;clear_tmp&lt;/span&gt;\n      &lt;span class=\"hljs-bullet\"&gt;-&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;--directory&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;\"//tmp/yt_wrapper/file_storage\"&lt;/span&gt;\n      &lt;span class=\"hljs-bullet\"&gt;-&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;--account&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;\"tmp_files\"&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;schedule:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;\"*/30 * * * *\"&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;restartPolicy:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;Never&lt;/span&gt;\n\n&lt;span class=\"hljs-attr\"&gt;unmanagedSecret:&lt;/span&gt;\n  &lt;span class=\"hljs-attr\"&gt;enabled:&lt;/span&gt; &lt;span class=\"hljs-literal\"&gt;false&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"316\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-316\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-316\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-316.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;To deploy:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;helm upgrade --install ytsaurus-cron oci://ghcr.io/ytsaurus/cron-chart --version 0.0.2 -f my-values.yaml\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"320\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-320\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-320\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-320.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"commonly-used-parameters\"&gt;&lt;a href=\"en/admin-guide/install-ytsaurus.html#commonly-used-parameters\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Commonly Used Parameters&lt;/span&gt;&lt;/a&gt;Commonly Used Parameters&lt;/h3&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Parameter&lt;/th&gt;\n&lt;th&gt;Description&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;yt.proxy&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;HTTP proxy for accessing YTsaurus&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;yt.token&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Access token (if &lt;code&gt;unmanagedSecret&lt;/code&gt; is disabled)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;unmanagedSecret&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Use a Kubernetes Secret&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;image.repository&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Docker image repository&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;image.tag&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Docker image tag&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;schedule&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Default schedule (if not specified per job)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;concurrencyPolicy&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;Allow&lt;/code&gt;, &lt;code&gt;Forbid&lt;/code&gt;, or &lt;code&gt;Replace&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;successfulJobsHistoryLimit&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Number of successful job records to keep&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;failedJobsHistoryLimit&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Number of failed job records to keep&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"},{"property":"og:title","content":"Installing YTsaurus"},{"property":"og:description","content":"The instrunctions below describe how to deploy the YTsaurus cluster in Kubernetes using operator and start the YTsaurus UI from the helm chart."},{"property":"og:type","content":"article"},{"property":"og:url","content":"https://ytsaurus.tech/docs/en/admin-guide/install-ytsaurus"},{"property":"article:section","content":"adminguide"},{"property":"article:tag","content":"k8s"},{"property":"article:modified_time","content":"2024-10-18T20:00:00+03:00"},{"property":"article:author","content":"Nadezhda Savchenko"},{"property":"article:author","content":"Maxim Efremov"}],"vcsPath":"en/admin-guide/install-ytsaurus.md","sourcePath":"en/admin-guide/install-ytsaurus.md"},"headings":[{"title":"Deploying YTsaurus in K8s","href":"en/admin-guide/install-ytsaurus.html#deploying-ytsaurus-in-k8s","level":2},{"title":"Kubernetes operator","href":"en/admin-guide/install-ytsaurus.html#operator","level":2,"items":[{"title":"Installing the operator","href":"en/admin-guide/install-ytsaurus.html#installing-the-operator","level":3}]},{"title":"Starting cluster YTsaurus","href":"en/admin-guide/install-ytsaurus.html#starting-cluster","level":2,"items":[{"title":"Diagnosing problems during initialization","href":"en/admin-guide/install-ytsaurus.html#diagnosing-problems-during-initialization","level":3}]},{"title":"Installing YTsaurus UI helm chart","href":"en/admin-guide/install-ytsaurus.html#installing-ytsaurus-ui-helm-chart","level":2,"items":[{"title":"Using with ytop-chart","href":"en/admin-guide/install-ytsaurus.html#using-with-ytop-chart","level":3},{"title":"Using with a custom cluster","href":"en/admin-guide/install-ytsaurus.html#using-with-a-custom-cluster","level":3,"items":[{"title":"Pre-requirements","href":"en/admin-guide/install-ytsaurus.html#pre-requirements","level":4},{"title":"Quick start","href":"en/admin-guide/install-ytsaurus.html#quick-start","level":4}]}]},{"title":"Cron Installation","href":"en/admin-guide/install-ytsaurus.html#cron-installation","level":2,"items":[{"title":"Description","href":"en/admin-guide/install-ytsaurus.html#description","level":3},{"title":"Prerequisites","href":"en/admin-guide/install-ytsaurus.html#prerequisites","level":3},{"title":"Basic Installation","href":"en/admin-guide/install-ytsaurus.html#basic-installation","level":3},{"title":"Configuration","href":"en/admin-guide/install-ytsaurus.html#configuration","level":3},{"title":"Authentication in YTsaurus","href":"en/admin-guide/install-ytsaurus.html#authentication-in-ytsaurus","level":3},{"title":"Built-in Jobs (jobs)","href":"en/admin-guide/install-ytsaurus.html#built-in-jobs","level":3},{"title":"Custom Jobs","href":"en/admin-guide/install-ytsaurus.html#custom-jobs","level":3},{"title":"Example values.yaml","href":"en/admin-guide/install-ytsaurus.html#example","level":3},{"title":"Commonly Used Parameters","href":"en/admin-guide/install-ytsaurus.html#commonly-used-parameters","level":3}]}],"title":"Installing YTsaurus"},"router":{"pathname":"en/admin-guide/install-ytsaurus","depth":3,"base":"../../"},"lang":"en","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/en/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-a29ea7877730322f2ce693378d06d02ac2b374cd-en","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
