            {"data":{"leading":false,"html":"&lt;p&gt;Adding new master cells always requires complete cluster downtime. In simplified form, cluster extension is a simultaneous update of the static config of all cluster components with some additional actions. Below is a detailed action plan. We strongly advise you read it to the end before proceeding.&lt;/p&gt;\n&lt;h2 id=\"preparation\"&gt;&lt;a href=\"en/admin-guide/cell-addition.html#preparation\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Preparation&lt;/span&gt;&lt;/a&gt;Preparation&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;You need to prepare a new static config and add information about the new cells to it.&lt;/li&gt;\n&lt;li&gt;You can prepare @cluster_connection with the new cells in advance (to learn more about @cluster_connection, see item 14).&lt;/li&gt;\n&lt;/ol&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Important&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Cell tags / cell IDs must be unique and ideally should follow a predictable pattern. If you have a multi-cluster installation, cell tags / cell IDs must be unique among all master cells of all your installation clusters.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"detailed-plan\"&gt;&lt;a href=\"en/admin-guide/cell-addition.html#detailed-plan\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Detailed plan&lt;/span&gt;&lt;/a&gt;Detailed plan&lt;/h2&gt;\n&lt;h3 id=\"1-shut-down-schedulers-and-controller-agents\"&gt;&lt;a href=\"en/admin-guide/cell-addition.html#1-shut-down-schedulers-and-controller-agents\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;1. Shut down schedulers and controller agents&lt;/span&gt;&lt;/a&gt;1. Shut down schedulers and controller agents&lt;/h3&gt;\n&lt;p&gt;These components must be shut down first, because they can abort user operations if a large number of nodes leave (which entails a lack of resources).&lt;/p&gt;\n&lt;h3 id=\"2-disable-chunk-refresh-and-chunk-requisition-update\"&gt;&lt;a href=\"en/admin-guide/cell-addition.html#2-disable-chunk-refresh-and-chunk-requisition-update\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;2. Disable chunk refresh and chunk requisition update&lt;/span&gt;&lt;/a&gt;2. Disable chunk refresh and chunk requisition update&lt;/h3&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;yt &lt;span class=\"hljs-built_in\"&gt;set&lt;/span&gt; //sys/@config/chunk_manager/enable_chunk_refresh %&lt;span class=\"hljs-literal\"&gt;false&lt;/span&gt;\nyt &lt;span class=\"hljs-built_in\"&gt;set&lt;/span&gt; //sys/@config/chunk_manager/enable_chunk_requisition_update %&lt;span class=\"hljs-literal\"&gt;false&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"40\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-40\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-40\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-40.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Master servers have background chunk replication. In the next step, we are going to shut down all nodes, causing the chunks to inevitably lose their replicas: this may create a lot of needless load (although master servers do have safeguards that trigger when too many replicas are lost, they'd still be doing needless work before these safeguards activate). To prevent this, you can toggle the described flags in advance.&lt;/p&gt;\n&lt;h3 id=\"3-shut-down-all-nodes\"&gt;&lt;a href=\"en/admin-guide/cell-addition.html#3-shut-down-all-nodes\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;3. Shut down all nodes&lt;/span&gt;&lt;/a&gt;3. Shut down all nodes&lt;/h3&gt;\n&lt;p&gt;(You can monitor the state of nodes at //sys/nodes/@count and //sys/nodes/@online_node_count).&lt;/p&gt;\n&lt;p&gt;Make sure that all cluster nodes are offline (you can check the state using //sys/cluster_nodes/{node_address}/@state). Master servers have a protection that prevents the registration of new cells if there is at least one non-offline node.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Important&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;If the cluster contains secondary cells, the nodes may be in mixed state for a while. In this case, you also need to wait for all nodes to go offline.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"4-shut-down-all-proxies\"&gt;&lt;a href=\"en/admin-guide/cell-addition.html#4-shut-down-all-proxies\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;4. Shut down all proxies&lt;/span&gt;&lt;/a&gt;4. Shut down all proxies&lt;/h3&gt;\n&lt;h3 id=\"5-shut-down-all-the-remaining-services-except-master-servers\"&gt;&lt;a href=\"en/admin-guide/cell-addition.html#5-shut-down-all-the-remaining-services-except-master-servers\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;5. Shut down all the remaining services except master servers&lt;/span&gt;&lt;/a&gt;5. Shut down all the remaining services &lt;strong&gt;except&lt;/strong&gt; master servers&lt;/h3&gt;\n&lt;p&gt;(Most likely, these are clock servers, master caches, timestamp providers, and discovery servers. If there are other services, disable them at this step as well).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Note&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;During extension, you do not have to disable services that do not rely on master servers in their operations. Examples of such services are clock servers, discovery servers, and possibly other services that do not have master server addresses in their static config.&lt;/p&gt;\n&lt;p&gt;If for some reason you need these services to stay alive, you do not have to shut them down at this step. Still, we strongly suggest double checking: failure to disable a service that DOES have master servers in its static config (which then will not be updated) may result in the cluster breaking in an arbitrary way.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"6-create-a-read-only-snapshot-on-the-master-servers\"&gt;&lt;a href=\"en/admin-guide/cell-addition.html#6-create-a-read-only-snapshot-on-the-master-servers\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;6. Create a read-only snapshot on the master servers&lt;/span&gt;&lt;/a&gt;6. Create a read-only snapshot on the master servers&lt;/h3&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;yt-admin build-master-snapshots —read-only —wait-for-snapshot-completion\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"88\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-88\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-88\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-88.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Read-only is a special cluster state in which master servers cannot accept, schedule, or apply mutations. Creating a snapshot in this mode is a standard technique used for major updates. It helps ensure that the updated master servers will recover only from the snapshot, without applying a changelog over the snapshot (because the changelog will be empty after the snapshot).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Attention&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;This step is very important: not following it may result in loss of data.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;You can verify that the master servers are in read-only mode and have created a snapshot by leader logs:&lt;br /&gt;\n\"Read-only mode enabled\" and \"Distributed snapshot creation finished\".&lt;/p&gt;\n&lt;h3 id=\"7-shut-down-the-master-servers\"&gt;&lt;a href=\"en/admin-guide/cell-addition.html#7-shut-down-the-master-servers\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;7. Shut down the master servers&lt;/span&gt;&lt;/a&gt;7. Shut down the master servers&lt;/h3&gt;\n&lt;h3 id=\"8-deploy-the-master-servers,-clock-servers,-master-caches,-timestamp-providers,-and-discovery-servers\"&gt;&lt;a href=\"en/admin-guide/cell-addition.html#8-deploy-the-master-servers,-clock-servers,-master-caches,-timestamp-providers,-and-discovery-servers\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;8. Deploy the master servers, clock servers, master caches, timestamp providers, and discovery servers&lt;/span&gt;&lt;/a&gt;8. Deploy the master servers, clock servers, master caches, timestamp providers, and discovery servers&lt;/h3&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Important&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;If any services other than the ones listed above were disabled at step 5, &lt;strong&gt;do not&lt;/strong&gt; deploy them yet!&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"9-exit-read-only-mode\"&gt;&lt;a href=\"en/admin-guide/cell-addition.html#9-exit-read-only-mode\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;9. Exit read-only mode&lt;/span&gt;&lt;/a&gt;9. Exit read-only mode&lt;/h3&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;yt-admin master-exit-read-only\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"124\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-124\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-124\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-124.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"10-wait-for-the-registration-of-new-cells-and-replication-of-global-objects\"&gt;&lt;a href=\"en/admin-guide/cell-addition.html#10-wait-for-the-registration-of-new-cells-and-replication-of-global-objects\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;10. Wait for the registration of new cells and replication of global objects&lt;/span&gt;&lt;/a&gt;10. Wait for the registration of new cells and replication of global objects&lt;/h3&gt;\n&lt;p&gt;Use the master server logs to verify that the new cells have been successfully registered and global master objects have been replicated on them.&lt;/p&gt;\n&lt;p&gt;Search for the registration success message in the logs of the primary cell: \"Master cell registered\".&lt;br /&gt;\nObject replication messages can be found in the logs of the newly added master cells: \"Foreign object created\" (you may have to wait for a couple of minutes for the messages to start appearing). Note that there may be many objects on the cluster, so you want to wait for the global object replication to complete (wait for the flow of \"Foreign object created\" messages to stop).&lt;/p&gt;\n&lt;h3 id=\"11-wait-for-the-master-servers-to-return-to-their-normal-operation-mode\"&gt;&lt;a href=\"en/admin-guide/cell-addition.html#11-wait-for-the-master-servers-to-return-to-their-normal-operation-mode\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;11. Wait for the master servers to return to their normal operation mode&lt;/span&gt;&lt;/a&gt;11. Wait for the master servers to return to their normal operation mode&lt;/h3&gt;\n&lt;p&gt;Make sure that all master servers, including other secondary cells if any, are in normal operation mode.&lt;/p&gt;\n&lt;p&gt;You can search for the \"Leader active\"/\"Follower active\" message in the logs.&lt;/p&gt;\n&lt;h3 id=\"12-assign-roles-to-the-new-cells\"&gt;&lt;a href=\"en/admin-guide/cell-addition.html#12-assign-roles-to-the-new-cells\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;12. Assign roles to the new cells&lt;/span&gt;&lt;/a&gt;12. Assign roles to the new cells&lt;/h3&gt;\n&lt;p&gt;You need secondary master cells to shard the load, and there are different methods to do that. Here you need to choose what kind of work the new cell will be doing.&lt;/p&gt;\n&lt;p&gt;Current types of roles:&lt;br /&gt;\n*&lt;code&gt;chunk_host&lt;/code&gt;: Sharding by chunks, assigns the work with table chunks to the cell. The most popular and once default role. After this role is specified, new chunks will automatically start populating the cell.&lt;br /&gt;\n*&lt;code&gt;cypress_node_host&lt;/code&gt;: Sharding of the metainformation tree, assigns Cypress subtrees to this cell (this requires manual actions; you can do that with this role, but there will be no automation). This article does not cover the procedure for placing subtrees on a separate cell.&lt;br /&gt;\n*&lt;code&gt;transaction_coordinator&lt;/code&gt;: Sharding of the work with transactions.&lt;/p&gt;\n&lt;p&gt;If you do not know what to do, the best way is probably to make the new cells host chunks (chunk_host). The other two roles are needed only for very large clusters.&lt;/p&gt;\n&lt;p&gt;You can assign the new roles at &lt;code&gt;//sys/@config/multicell_manager/cell_descriptors&lt;/code&gt;:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;//sys/@config/multicell_manager/cell_descriptors/{cell_tag}/roles\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"158\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-158\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-158\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-158.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Remember that proxy servers are not up at this point in time, and any access to Cypress is possible only through a correctly configured native client. Such a client can usually be found in the master's container.&lt;/p&gt;\n&lt;p&gt;You can assign the roles later, but do not forget to do that; if you do, the new cells will not be doing anything useful.&lt;/p&gt;\n&lt;h3 id=\"13-deploy-nodes-to-the-version-with-the-new-config\"&gt;&lt;a href=\"en/admin-guide/cell-addition.html#13-deploy-nodes-to-the-version-with-the-new-config\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;13. Deploy nodes (to the version with the new config)&lt;/span&gt;&lt;/a&gt;13. Deploy nodes (to the version with the new config)&lt;/h3&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Important&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;This step is a point of no return. In theory, you can still roll back the addition of cells at any step before this one. After this step, reverting the addition of new cells will inevitably result in loss of data.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"14-write-new-cells-to-cluster-connection\"&gt;&lt;a href=\"en/admin-guide/cell-addition.html#14-write-new-cells-to-cluster-connection\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;14. Write new cells to cluster connection&lt;/span&gt;&lt;/a&gt;14. Write new cells to cluster connection&lt;/h3&gt;\n&lt;p&gt;Cluster connection resides in Cypress at &lt;code&gt;//sys/@cluster_connection/secondary_masters&lt;/code&gt;.&lt;br /&gt;\nYou need to write cells in the following format:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;[\n        {\n            &lt;span class=\"hljs-string\"&gt;\"addresses\"&lt;/span&gt; = [\n                &lt;span class=\"hljs-string\"&gt;\"some_master_address:9010\"&lt;/span&gt;;\n            ];\n            &lt;span class=\"hljs-string\"&gt;\"cell_id\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"1-2-3-4\"&lt;/span&gt;;\n        };\n];\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"184\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-184\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-184\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-184.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Attention&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;The new cells must be ADDED. If the cluster already contains secondary master cells, the new ones should simply be appended to the end of the list. We recommend saving the old cluster_connection somewhere before modifying it.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"15-enable-chunk-refresh-and-chunk-requisition-update\"&gt;&lt;a href=\"en/admin-guide/cell-addition.html#15-enable-chunk-refresh-and-chunk-requisition-update\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;15. Enable chunk refresh and chunk requisition update&lt;/span&gt;&lt;/a&gt;15. Enable chunk refresh and chunk requisition update&lt;/h3&gt;\n&lt;p&gt;If you did not disable them at step 2, skip this step.&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;yt &lt;span class=\"hljs-built_in\"&gt;set&lt;/span&gt; //sys/@config/chunk_manager/enable_chunk_refresh %&lt;span class=\"hljs-literal\"&gt;true&lt;/span&gt;\nyt &lt;span class=\"hljs-built_in\"&gt;set&lt;/span&gt; //sys/@config/chunk_manager/enable_chunk_requisition_update %&lt;span class=\"hljs-literal\"&gt;true&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"201\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-201\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-201\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-201.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"16-wait-until-all-nodes-are-registered-and-the-chunk-refresh-process-completes-successfully\"&gt;&lt;a href=\"en/admin-guide/cell-addition.html#16-wait-until-all-nodes-are-registered-and-the-chunk-refresh-process-completes-successfully\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;16. Wait until all nodes are registered and the chunk refresh process completes successfully&lt;/span&gt;&lt;/a&gt;16. Wait until all nodes are registered and the chunk refresh process completes successfully&lt;/h3&gt;\n&lt;p&gt;Depending on the number of nodes and chunks on the cluster, this step may take a significant amount of time.&lt;/p&gt;\n&lt;h3 id=\"17-deploy-other-components\"&gt;&lt;a href=\"en/admin-guide/cell-addition.html#17-deploy-other-components\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;17. Deploy other components&lt;/span&gt;&lt;/a&gt;17. Deploy other components&lt;/h3&gt;\n&lt;p&gt;Deploy proxies, schedulers, controller agents, and other components (if any are remaining).&lt;br /&gt;\nComponents must be deployed to the version with the updated config.&lt;/p&gt;\n&lt;h3 id=\"18-wait-for-the-cluster-to-return-to-its-normal-operation-mode\"&gt;&lt;a href=\"en/admin-guide/cell-addition.html#18-wait-for-the-cluster-to-return-to-its-normal-operation-mode\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;18. Wait for the cluster to return to its normal operation mode&lt;/span&gt;&lt;/a&gt;18. Wait for the cluster to return to its normal operation mode&lt;/h3&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"en/admin-guide/cell-addition.md","sourcePath":"en/admin-guide/cell-addition.md"},"headings":[{"title":"Preparation","href":"en/admin-guide/cell-addition.html#preparation","level":2},{"title":"Detailed plan","href":"en/admin-guide/cell-addition.html#detailed-plan","level":2,"items":[{"title":"1. Shut down schedulers and controller agents","href":"en/admin-guide/cell-addition.html#1-shut-down-schedulers-and-controller-agents","level":3},{"title":"2. Disable chunk refresh and chunk requisition update","href":"en/admin-guide/cell-addition.html#2-disable-chunk-refresh-and-chunk-requisition-update","level":3},{"title":"3. Shut down all nodes","href":"en/admin-guide/cell-addition.html#3-shut-down-all-nodes","level":3},{"title":"4. Shut down all proxies","href":"en/admin-guide/cell-addition.html#4-shut-down-all-proxies","level":3},{"title":"5. Shut down all the remaining services except master servers","href":"en/admin-guide/cell-addition.html#5-shut-down-all-the-remaining-services-except-master-servers","level":3},{"title":"6. Create a read-only snapshot on the master servers","href":"en/admin-guide/cell-addition.html#6-create-a-read-only-snapshot-on-the-master-servers","level":3},{"title":"7. Shut down the master servers","href":"en/admin-guide/cell-addition.html#7-shut-down-the-master-servers","level":3},{"title":"8. Deploy the master servers, clock servers, master caches, timestamp providers, and discovery servers","href":"en/admin-guide/cell-addition.html#8-deploy-the-master-servers,-clock-servers,-master-caches,-timestamp-providers,-and-discovery-servers","level":3},{"title":"9. Exit read-only mode","href":"en/admin-guide/cell-addition.html#9-exit-read-only-mode","level":3},{"title":"10. Wait for the registration of new cells and replication of global objects","href":"en/admin-guide/cell-addition.html#10-wait-for-the-registration-of-new-cells-and-replication-of-global-objects","level":3},{"title":"11. Wait for the master servers to return to their normal operation mode","href":"en/admin-guide/cell-addition.html#11-wait-for-the-master-servers-to-return-to-their-normal-operation-mode","level":3},{"title":"12. Assign roles to the new cells","href":"en/admin-guide/cell-addition.html#12-assign-roles-to-the-new-cells","level":3},{"title":"13. Deploy nodes (to the version with the new config)","href":"en/admin-guide/cell-addition.html#13-deploy-nodes-to-the-version-with-the-new-config","level":3},{"title":"14. Write new cells to cluster connection","href":"en/admin-guide/cell-addition.html#14-write-new-cells-to-cluster-connection","level":3},{"title":"15. Enable chunk refresh and chunk requisition update","href":"en/admin-guide/cell-addition.html#15-enable-chunk-refresh-and-chunk-requisition-update","level":3},{"title":"16. Wait until all nodes are registered and the chunk refresh process completes successfully","href":"en/admin-guide/cell-addition.html#16-wait-until-all-nodes-are-registered-and-the-chunk-refresh-process-completes-successfully","level":3},{"title":"17. Deploy other components","href":"en/admin-guide/cell-addition.html#17-deploy-other-components","level":3},{"title":"18. Wait for the cluster to return to its normal operation mode","href":"en/admin-guide/cell-addition.html#18-wait-for-the-cluster-to-return-to-its-normal-operation-mode","level":3}]}],"title":"Extending master servers"},"router":{"pathname":"en/admin-guide/cell-addition","depth":3,"base":"../../"},"lang":"en","langs":["ru","en
