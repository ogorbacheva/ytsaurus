            {"data":{"leading":false,"html":"&lt;h2 id=\"lvc\"&gt;&lt;a href=\"en/admin-guide/problems.html#lvc\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;LVC (Lost Vital Chunks)&lt;/span&gt;&lt;/a&gt;LVC (Lost Vital Chunks)&lt;/h2&gt;\n&lt;p&gt;If some chunks become unavailable, the alert &lt;code&gt;lost_vital_chunks&lt;/code&gt; is triggered. That can happen, for example, if some &lt;code&gt;Data Nodes&lt;/code&gt; are unavailable.&lt;/p&gt;\n&lt;p&gt;To see the list of unavailable chunks, use &lt;code&gt;yt list //sys/lost_vital_chunks&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;To figure out where the replicas of a chunk were, use &lt;code&gt;yt get #chunk-id/@last_seen_replicas&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;For erasure chunks, you could look at &lt;code&gt;yt get #chunk_id/@stored_replicas&lt;/code&gt; to find out which parts of the chunk are still available.&lt;/p&gt;\n&lt;h2 id=\"tabletcellbundles\"&gt;&lt;a href=\"en/admin-guide/problems.html#tabletcellbundles\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Tablet Cell Bundle's health is not good&lt;/span&gt;&lt;/a&gt;Tablet Cell Bundle's health is not good&lt;/h2&gt;\n&lt;p&gt;The UI on the Bundles page shows bundle states. If a bundle isn't in the &lt;code&gt;Good&lt;/code&gt; state, you need to find out why.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Remark&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;If there are bundles that aren't in the &lt;code&gt;Good&lt;/code&gt; state, you can't start updating the cluster.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"en/admin-guide/problems.md","sourcePath":"en/admin-guide/problems.md"},"headings":[{"title":"LVC (Lost Vital Chunks)","href":"en/admin-guide/problems.html#lvc","level"
