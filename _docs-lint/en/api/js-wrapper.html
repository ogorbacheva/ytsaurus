        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;A wrapper for queries to YTsaurus clusters that uses the YTsaurus HTTP API with the closest interface possible.&lt;/p&gt;\n&lt;h2 id=\"installation\"&gt;&lt;a href=\"en/api/js-wrapper.html#installation\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Installation&lt;/span&gt;&lt;/a&gt;Installation&lt;/h2&gt;\n&lt;p&gt;&lt;code&gt;npm install @ytsaurus/javascript-wrapper&lt;/code&gt;&lt;/p&gt;\n&lt;h2 id=\"connection-and-use\"&gt;&lt;a href=\"en/api/js-wrapper.html#connection-and-use\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Connection and use&lt;/span&gt;&lt;/a&gt;Connection and use&lt;/h2&gt;\n&lt;p&gt;The library is written in CommonJS style: you can use it in a Node.js app or bundle dependencies with Webpack.&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs javascript\"&gt;    &lt;span class=\"hljs-keyword\"&gt;const&lt;/span&gt; yt = &lt;span class=\"hljs-built_in\"&gt;require&lt;/span&gt;(&lt;span class=\"hljs-string\"&gt;'@ytsaurus/javascript-wrapper'&lt;/span&gt;)()\n\n    &lt;span class=\"hljs-comment\"&gt;// Enables you to set default settings for all commands.&lt;/span&gt;\n    &lt;span class=\"hljs-comment\"&gt;// If you need to work with multiple clusters simultaneously, the proxy and token are sent to each command separately.&lt;/span&gt;\n    yt.&lt;span class=\"hljs-property\"&gt;setup&lt;/span&gt;.&lt;span class=\"hljs-title function_\"&gt;setGlobalOption&lt;/span&gt;(&lt;span class=\"hljs-string\"&gt;'proxy'&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;'cluster-name.yt.my-domain.com'&lt;/span&gt;);\n    yt.&lt;span class=\"hljs-property\"&gt;setup&lt;/span&gt;.&lt;span class=\"hljs-title function_\"&gt;setGlobalOption&lt;/span&gt;(&lt;span class=\"hljs-string\"&gt;'secure'&lt;/span&gt;, &lt;span class=\"hljs-literal\"&gt;true&lt;/span&gt;);\n\n    yt.&lt;span class=\"hljs-property\"&gt;setup&lt;/span&gt;.&lt;span class=\"hljs-title function_\"&gt;setGlobalOption&lt;/span&gt;(&lt;span class=\"hljs-string\"&gt;'authentication'&lt;/span&gt;, {\n        &lt;span class=\"hljs-attr\"&gt;type&lt;/span&gt;: &lt;span class=\"hljs-string\"&gt;'domain'&lt;/span&gt;\n    });\n\n    yt.&lt;span class=\"hljs-property\"&gt;setup&lt;/span&gt;.&lt;span class=\"hljs-title function_\"&gt;setGlobalOption&lt;/span&gt;(&lt;span class=\"hljs-string\"&gt;'timeout'&lt;/span&gt;, &lt;span class=\"hljs-number\"&gt;15000&lt;/span&gt;);\n\n    &lt;span class=\"hljs-comment\"&gt;// Example 1&lt;/span&gt;\n    yt.&lt;span class=\"hljs-property\"&gt;v3&lt;/span&gt;.&lt;span class=\"hljs-title function_\"&gt;get&lt;/span&gt;({ &lt;span class=\"hljs-attr\"&gt;path&lt;/span&gt;: &lt;span class=\"hljs-string\"&gt;'//sys/users/user/@'&lt;/span&gt; })\n\n    yt.&lt;span class=\"hljs-property\"&gt;v3&lt;/span&gt;.&lt;span class=\"hljs-title function_\"&gt;get&lt;/span&gt;({\n        &lt;span class=\"hljs-attr\"&gt;setup&lt;/span&gt;: {\n            &lt;span class=\"hljs-attr\"&gt;proxy&lt;/span&gt;: &lt;span class=\"hljs-string\"&gt;'cluster-name.yt.my-domain.com'&lt;/span&gt;,\n            &lt;span class=\"hljs-attr\"&gt;authentication&lt;/span&gt;: {\n                &lt;span class=\"hljs-attr\"&gt;type&lt;/span&gt;: &lt;span class=\"hljs-string\"&gt;'none'&lt;/span&gt;\n            }\n        },\n        &lt;span class=\"hljs-attr\"&gt;parameters&lt;/span&gt;: { &lt;span class=\"hljs-attr\"&gt;path&lt;/span&gt;: &lt;span class=\"hljs-string\"&gt;'//sys/users/user/@'&lt;/span&gt; }\n    })\n        .&lt;span class=\"hljs-title function_\"&gt;done&lt;/span&gt;(&lt;span class=\"hljs-keyword\"&gt;function&lt;/span&gt; (&lt;span class=\"hljs-params\"&gt;userAttributes&lt;/span&gt;) {\n            &lt;span class=\"hljs-comment\"&gt;// ...&lt;/span&gt;\n        });\n\n\n    &lt;span class=\"hljs-comment\"&gt;// Example 2&lt;/span&gt;\n    yt.&lt;span class=\"hljs-property\"&gt;v3&lt;/span&gt;.&lt;span class=\"hljs-title function_\"&gt;set&lt;/span&gt;({ &lt;span class=\"hljs-attr\"&gt;path&lt;/span&gt;: &lt;span class=\"hljs-string\"&gt;'//sys/users/user/@banned'&lt;/span&gt; }, &lt;span class=\"hljs-literal\"&gt;true&lt;/span&gt;);\n\n    yt.&lt;span class=\"hljs-property\"&gt;v3&lt;/span&gt;.&lt;span class=\"hljs-title function_\"&gt;set&lt;/span&gt;({\n        &lt;span class=\"hljs-attr\"&gt;setup&lt;/span&gt;: {\n            &lt;span class=\"hljs-attr\"&gt;proxy&lt;/span&gt;: &lt;span class=\"hljs-string\"&gt;'cluster-name.yt.my-domain.com'&lt;/span&gt;,\n            &lt;span class=\"hljs-attr\"&gt;authentication&lt;/span&gt;: {\n                &lt;span class=\"hljs-attr\"&gt;type&lt;/span&gt;: &lt;span class=\"hljs-string\"&gt;'oauth'&lt;/span&gt;,\n                &lt;span class=\"hljs-attr\"&gt;token&lt;/span&gt;: &lt;span class=\"hljs-string\"&gt;'abcdefghijklmnopqrstuvwxyz'&lt;/span&gt;\n            }\n        },\n        &lt;span class=\"hljs-attr\"&gt;parameters&lt;/span&gt;: { &lt;span class=\"hljs-attr\"&gt;path&lt;/span&gt;: &lt;span class=\"hljs-string\"&gt;'//sys/users/user/@banned'&lt;/span&gt; },\n        &lt;span class=\"hljs-attr\"&gt;data&lt;/span&gt;: &lt;span class=\"hljs-literal\"&gt;true&lt;/span&gt;\n    })\n        .&lt;span class=\"hljs-title function_\"&gt;done&lt;/span&gt;(&lt;span class=\"hljs-keyword\"&gt;function&lt;/span&gt; (&lt;span class=\"hljs-params\"&gt;&lt;/span&gt;) {\n            &lt;span class=\"hljs-comment\"&gt;// ...&lt;/span&gt;\n        });\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"15\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-15\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-15\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-15.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;The library can also be used as a global variable.&lt;/p&gt;\n&lt;h2 id=\"settings\"&gt;&lt;a href=\"en/api/js-wrapper.html#settings\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Settings&lt;/span&gt;&lt;/a&gt;Settings&lt;/h2&gt;\n&lt;p&gt;The wrapper enables you to specify global and local settings for each query.&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Name&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Type&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Default value&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;secure&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;boolean&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;true&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;useHeavyProxy&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;boolean&lt;/td&gt;\n&lt;td&gt;-&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;proxy&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;string&lt;/td&gt;\n&lt;td&gt;-&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;heavyProxy&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;string&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;true&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;timeout&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Number&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;100,000&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;useEncodedParameters&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;boolean&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;true&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;authentication&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;object&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;{ type: 'none' }&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;dataType&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;string&lt;/td&gt;\n&lt;td&gt;-&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;encodedParametersSettings&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;object&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;\n{\n    maxSize: 64 * 1024,\n    maxCount: 2,\n    encoder(string) {\n        return window.btoa(utf8.encode(string));\n    }\n}\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"141\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-141\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-141\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-141.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"events\"&gt;&lt;a href=\"en/api/js-wrapper.html#events\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Events&lt;/span&gt;&lt;/a&gt;Events&lt;/h2&gt;\n&lt;p&gt;You can subscribe to &lt;code&gt;requestStart&lt;/code&gt;, &lt;code&gt;requestEnd&lt;/code&gt;, and &lt;code&gt;error&lt;/code&gt; events:&lt;/p&gt;\n&lt;pre&gt;&lt;code&gt;yt.subscribe('requestStart', function () {\n    console.log('requestStart');\n});\n&lt;/code&gt;&lt;/pre&gt;\n&lt;p&gt;This can be useful for displaying the loader (you can count how many active queries there are) and for logging errors occurring on API requests.&lt;/p&gt;\n&lt;h2 id=\"commands\"&gt;&lt;a href=\"en/api/js-wrapper.html#commands\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Commands&lt;/span&gt;&lt;/a&gt;Commands&lt;/h2&gt;\n&lt;p&gt;For information about the available commands, see the &lt;a href=\"api/commands.html\"&gt;Commands&lt;/a&gt; section. The only difference is that the command names are written in the usual style for the JavaScript language, namely CamelCase.&lt;/p&gt;\n&lt;p&gt;Not all commands have been implemented, but they can be added if needed. If there is no command, the wrapper usually displays a corresponding error.&lt;/p&gt;\n&lt;p&gt;Generic command format:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs javascript\"&gt;&lt;span class=\"hljs-comment\"&gt;// yt.&amp;lt;version&amp;gt;.&amp;lt;command&amp;gt;(&amp;lt;parameters&amp;gt;[, &amp;lt;data&amp;gt;])&lt;/span&gt;\nyt.&lt;span class=\"hljs-property\"&gt;v3&lt;/span&gt;.&lt;span class=\"hljs-title function_\"&gt;get&lt;/span&gt;({ &lt;span class=\"hljs-attr\"&gt;path&lt;/span&gt;: &lt;span class=\"hljs-string\"&gt;\"//home/user/@account\"&lt;/span&gt; });\nyt.&lt;span class=\"hljs-property\"&gt;v3&lt;/span&gt;.&lt;span class=\"hljs-title function_\"&gt;set&lt;/span&gt;({ &lt;span class=\"hljs-attr\"&gt;path&lt;/span&gt;: &lt;span class=\"hljs-string\"&gt;\"//home/user/@account\"&lt;/span&gt; }, &lt;span class=\"hljs-string\"&gt;\"default\"&lt;/span&gt;);\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"164\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-164\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-164\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-164.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Generic command format supporting the configuration of local settings:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs javascript\"&gt;&lt;span class=\"hljs-comment\"&gt;/**\n * yt.&amp;lt;version&amp;gt;.&amp;lt;command&amp;gt;({\n *    parameters: &amp;lt;parameters&amp;gt;,\n *    data: &amp;lt;data&amp;gt;,\n *    setup: &amp;lt;setup&amp;gt;\n * })\n */&lt;/span&gt;\n&lt;span class=\"hljs-keyword\"&gt;const&lt;/span&gt; setup = { &lt;span class=\"hljs-attr\"&gt;timeout&lt;/span&gt;: &lt;span class=\"hljs-number\"&gt;3000&lt;/span&gt; };\nyt.&lt;span class=\"hljs-property\"&gt;v3&lt;/span&gt;.&lt;span class=\"hljs-title function_\"&gt;get&lt;/span&gt;({ setup, &lt;span class=\"hljs-attr\"&gt;parameters&lt;/span&gt;: { &lt;span class=\"hljs-attr\"&gt;path&lt;/span&gt;: &lt;span class=\"hljs-string\"&gt;\"//home/user/@account\"&lt;/span&gt; } });\nyt.&lt;span class=\"hljs-property\"&gt;v3&lt;/span&gt;.&lt;span class=\"hljs-title function_\"&gt;set&lt;/span&gt;({ setup, &lt;span class=\"hljs-attr\"&gt;parameters&lt;/span&gt;: { &lt;span class=\"hljs-attr\"&gt;path&lt;/span&gt;: &lt;span class=\"hljs-string\"&gt;\"//home/user/@account\"&lt;/span&gt; } }, &lt;span class=\"hljs-string\"&gt;\"default\"&lt;/span&gt;);\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"168\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-168\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-168\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-168.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"constants-for-error-codes\"&gt;&lt;a href=\"en/api/js-wrapper.html#constants-for-error-codes\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Constants for error codes&lt;/span&gt;&lt;/a&gt;Constants for error codes&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Constant&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Code&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;yt.codes.GENERAL_ERROR&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;1&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;yt.codes.NODE_DOES_NOT_EXIST&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;500&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;yt.codes.NODE_ALREADY_EXISTS&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;501&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;yt.codes.PERMISSION_DENIED&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;901&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;yt.codes.USER_IS_BANNED&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;903&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;yt.codes.USER_EXCEEDED_RPS&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;904&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;h2 id=\"useful-links\"&gt;&lt;a href=\"en/api/js-wrapper.html#useful-links\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Useful links&lt;/span&gt;&lt;/a&gt;Useful links&lt;/h2&gt;\n&lt;p&gt;&lt;a href=\"https://github.com/YTsaurus/YTsaurus/blob/main/yt/yt/client/driver/driver.cpp\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Registering commands by version on the backend&lt;/a&gt;.&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"en/api/js-wrapper.md","sourcePath":"en/api/js-wrapper.md"},"headings":[{"title":"Installation","href":"en/api/js-wrapper.html#installation","level":2},{"title":"Connection and use","href":"en/api/js-wrapper.html#connection-and-use","level":2},{"title":"Settings","href":"en/api/js-wrapper.html#settings","level":2},{"title":"Events","href":"en/api/js-wrapper.html#events","level":2},{"title":"Commands","href":"en/api/js-wrapper.html#commands","level":2},{"title":"Constants for error codes","href":"en/api/js-wrapper.html#constants-for-error-codes","level":2},{"title":"Useful links","href":"en/api/js-wrapper.html#useful-links","level":2}],"title":"YTsaurus JavaScript Wrappe
