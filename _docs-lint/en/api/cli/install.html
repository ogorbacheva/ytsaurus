        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;h2 id=\"installation\"&gt;&lt;a href=\"en/api/cli/install.html#installation\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Installation&lt;/span&gt;&lt;/a&gt;Installation&lt;/h2&gt;\n&lt;p&gt;There are several ways to install the CLI.&lt;br /&gt;\nThe CLI consists of several parts. The main part is written in Python, it is compatible with Python 2&amp;amp;3, and it is platform-independent.&lt;br /&gt;\nTo use the &lt;a href=\"user-guide/storage/yson.html\"&gt;YSON&lt;/a&gt; format of data representation, you can install the so called YSON bindings.&lt;br /&gt;\nThey are a separate library available only for Linux and MacOS and written in C++.&lt;/p&gt;\n&lt;p&gt;You can find out the version of the installed CLI by calling the &lt;code&gt;yt --version&lt;/code&gt; command, which is the easiest way to check if the CLI is working.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Attention!&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;We do not recommend installing the library and YSON bindings in different ways at the same time.&lt;br /&gt;\nThis can lead to problems that are difficult to diagnose.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Note&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;If you have any problems, check the &lt;a href=\"faq/index.html\"&gt;FAQ&lt;/a&gt; section.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;The package is called &lt;code&gt;ytsaurus-client&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Before installing the package, you can install the &lt;code&gt;wheel&lt;/code&gt; package to be able to install a version other than the system one or&lt;br /&gt;\ninstall the YTsaurus CLI without sudo).&lt;/p&gt;\n&lt;p&gt;By default, the latest stable version of the package is installed from PyPI.&lt;br /&gt;\nAll test versions have the \"a1\" suffix and can be installed via pip by adding the &lt;code&gt;--pre&lt;/code&gt; option.&lt;br /&gt;\nThe command for installing from pypi:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;&lt;span class=\"hljs-comment\"&gt;# Install the YTsaurus CLI&lt;/span&gt;\npip install ytsaurus-client\n&lt;span class=\"hljs-comment\"&gt;# Install YSON bindings&lt;/span&gt;\npip install ytsaurus-yson\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"38\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-38\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-38\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-38.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"autocompletion\"&gt;&lt;a href=\"en/api/cli/install.html#autocompletion\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Autocompletion&lt;/span&gt;&lt;/a&gt;Autocompletion&lt;/h2&gt;\n&lt;p&gt;The Deb and PyPI packages also come with a bash autocompletion script.&lt;/p&gt;\n&lt;p&gt;In the case of a pip package, you can enable autocompletion using the &lt;code&gt;register-python-argcomplete&lt;/code&gt; utility, which comes with the argcomplete package.&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;register-python-argcomplete yt | &lt;span class=\"hljs-built_in\"&gt;sudo&lt;/span&gt; &lt;span class=\"hljs-built_in\"&gt;tee&lt;/span&gt; /etc/bash_completion.d/yt &amp;gt;/dev/null\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"48\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-48\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-48\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-48.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;You can check whether it is operating correctly by entering this in the console:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;yt &amp;lt;TAB&amp;gt;&amp;lt;TAB&amp;gt;\nabort-job\nabort-op\nabort-tx\nadd-member\nalter-table\nalter-table-replica\ncheck-permission\n...\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"52\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-52\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-52\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-52.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;The main advantage of this feature is supplementing paths in Cypress. For this function to work, the cluster you are working with must be specified in the environment variables, for example, using the &lt;code&gt;export YT_PROXY=&amp;lt;cluster_name&amp;gt;&lt;/code&gt; command. Example:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;&lt;span class=\"hljs-built_in\"&gt;export&lt;/span&gt; YT_PROXY=&amp;lt;cluster-name&amp;gt;\nyt list /&amp;lt;TAB&amp;gt;/&amp;lt;TAB&amp;gt;&amp;lt;TAB&amp;gt;\n//@               //home/           //porto_layers/   //statbox/        //test_q_roc_auc  //trash           //userfeat/       //userstats/\n//cooked_logs/    //logs            //projects/       //sys             //tmp/            //userdata/       //user_sessions/\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"56\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-56\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-56\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-56.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;If you see something else (either nothing or paths in the current directory) instead of Cypress command names or paths, then autocompletion is not enabled. Check that the following conditions are met:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;The main bash_completion package must be installed. On Ubuntu-like systems, this can be achieved by running the &lt;code&gt;sudo apt-get install bash-completion&lt;/code&gt; command.&lt;/li&gt;\n&lt;li&gt;Bash-completion must be initiated when a bash session is started. For example, by default, Ubuntu contains a &lt;code&gt;. /etc/bash_completion&lt;/code&gt; string. If you don't see it, you should add it to .bashrc.&lt;/li&gt;\n&lt;li&gt;The &lt;code&gt;yt_completion&lt;/code&gt; file that configures autocompletion for the yt command must be placed to /etc/bash_completion.d. If all the contents of /etc/bash_completion.d do not run automatically on your system for some reason, you can run this script yourself at the end of your .bashrc.&lt;/li&gt;\n&lt;/ul&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"en/api/cli/install.md","sourcePath":"en/api/cli/install.md"},"headings":[{"title":"Installation","href":"en/api/cli/install.html#installation","level":2},{"title":"Autocompletion","href":"en/api/cli/install.html#autocompletion","level":2}],"title":"YTsaurus CLI"},"router":{"pathname":"en/api/cli/install","depth":4,"base":"../../../"},"lang":"en","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/en/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-a29ea7877730322f2ce693378d06d02ac2b374cd-en","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
