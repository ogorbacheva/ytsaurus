            {"data":{"leading":false,"html":"&lt;p&gt;In some YTsaurus operations, calculations are so simple that creating a class for each of them using the &lt;a href=\"api/cpp/description.html\"&gt;C++ API&lt;/a&gt; feels excessive. In this case, you can use &lt;a href=\"https://en.wikipedia.org/wiki/Anonymous_function\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;lambda expressions&lt;/a&gt; to describe operations.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Warning&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Such lambda expressions currently can't capture variables, meaning they must have an empty capture block. This makes them equivalent to C functions. This is because generic lambda are problematic to serialize correctly in modern C++. To pass parameters to a lambda, you can sometimes use &lt;code&gt;static const&lt;/code&gt; and &lt;a href=\"en/api/cpp/lambda.html#saveable\"&gt;TSaveable&lt;/a&gt; global variables.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Warning&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;This only works from programs built statically for Linux, so you can't use settings like &lt;code&gt;JobBinaryLocalPath&lt;/code&gt;.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"using-the-yt_lambda-library\"&gt;&lt;a href=\"en/api/cpp/lambda.html#using-the-yt_lambda-library\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Using the yt_lambda library&lt;/span&gt;&lt;/a&gt;Using the yt_lambda library&lt;/h2&gt;\n&lt;p&gt;Connect the &lt;a href=\"https://github.com/ytsaurus/ytsaurus/blob/main/yt/cpp/mapreduce/library/lambda/yt_lambda.h\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;yt_lambda&lt;/a&gt;library and include the following header in the program:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;#include &amp;lt;yt/cpp/mapreduce/library/lambda/yt_lambda.h&amp;gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"29\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-29\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-29\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-29.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;&lt;a href=\"api/cpp/description.html#init\"&gt;Initialize YTsaurus&lt;/a&gt; and get the &lt;code&gt;client&lt;/code&gt;. Pass the &lt;code&gt;client&lt;/code&gt; or &lt;a href=\"api/cpp/description.html#transactions\"&gt;transaction&lt;/a&gt; as the first parameter to the functions described in this document.&lt;/p&gt;\n&lt;p&gt;This library's functions have good compatibility with the use of records in &lt;a href=\"api/cpp/protobuf.html\"&gt;protobuf&lt;/a&gt; format.&lt;/p&gt;\n&lt;h2 id=\"operations-overview\"&gt;&lt;a href=\"en/api/cpp/lambda.html#operations-overview\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Operations overview&lt;/span&gt;&lt;/a&gt;Operations overview&lt;/h2&gt;\n&lt;p&gt;All of the operations in this library take as input lambda-expressed operators on a single record, which are then repeatedly applied. In general, an operation can also be viewed as a chain of conversions of types:&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"images/lambda-normal-op.png\" alt=\"\" class=\"center\" /&gt;&lt;/p&gt;\n&lt;h3 id=\"additive-operations\"&gt;&lt;a href=\"en/api/cpp/lambda.html#additive-operations\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Additive operations&lt;/span&gt;&lt;/a&gt;Additive operations&lt;/h3&gt;\n&lt;p&gt;A variant of ordinary operations where &lt;a href=\"user-guide/data-processing/operations/reduce.html\"&gt;Reduce&lt;/a&gt; has the same input and output type and is associative. In this case, you can further simplify the implementation of the Reduce transformation and use it as a combiner for free.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"images/lambda-additive-op.png\" alt=\"\" class=\"center\" /&gt;&lt;/p&gt;\n&lt;h2 id=\"copyif\"&gt;&lt;a href=\"en/api/cpp/lambda.html#copyif\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;CopyIf&lt;/span&gt;&lt;/a&gt;CopyIf&lt;/h2&gt;\n&lt;p&gt;This function filters records in the table without modifying them.&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs c++\"&gt;&lt;span class=\"hljs-keyword\"&gt;template&lt;/span&gt; &amp;lt;&lt;span class=\"hljs-keyword\"&gt;class&lt;/span&gt; &lt;span class=\"hljs-title class_\"&gt;T&lt;/span&gt;&amp;gt;\n&lt;span class=\"hljs-function\"&gt;&lt;span class=\"hljs-type\"&gt;void&lt;/span&gt; &lt;span class=\"hljs-title\"&gt;CopyIf&lt;/span&gt;&lt;span class=\"hljs-params\"&gt;(&lt;span class=\"hljs-type\"&gt;const&lt;/span&gt; IClientBasePtr&amp;amp; client, &lt;span class=\"hljs-type\"&gt;const&lt;/span&gt; TRichYPath&amp;amp; from, &lt;span class=\"hljs-type\"&gt;const&lt;/span&gt; TRichYPath&amp;amp; to, &lt;span class=\"hljs-type\"&gt;bool&lt;/span&gt; (*p)(&lt;span class=\"hljs-type\"&gt;const&lt;/span&gt; T&amp;amp;))&lt;/span&gt;&lt;/span&gt;;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"60\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-60\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-60\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-60.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Parameter&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Description&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;T&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Record type (TNode or a specific &lt;a href=\"api/cpp/protobuf.html\"&gt;protobuf message&lt;/a&gt; type)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;from&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Input table name&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;to&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Output table name&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;p&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Filtering predicate&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Notes:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;The order of records in the table isn't changed, and the &lt;code&gt;Ordered&lt;/code&gt; flag that may slightly slow down the operation is set.&lt;/li&gt;\n&lt;li&gt;A known defect: if there is only one input table, it has a schema, and is sorted, the sorting information doesn't reach the output table schema.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h3 id=\"application\"&gt;&lt;a href=\"en/api/cpp/lambda.html#application\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Application&lt;/span&gt;&lt;/a&gt;Application&lt;/h3&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs c++\"&gt;NYT::&lt;span class=\"hljs-built_in\"&gt;CopyIf&lt;/span&gt;&amp;lt;TMyProtoMsg&amp;gt;(client, &lt;span class=\"hljs-string\"&gt;\"//home/project/inTable\"&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;\"//home/project/outTable\"&lt;/span&gt;,\n    [](&lt;span class=\"hljs-keyword\"&gt;auto&lt;/span&gt;&amp;amp; rec) { &lt;span class=\"hljs-keyword\"&gt;return&lt;/span&gt; rec.&lt;span class=\"hljs-built_in\"&gt;GetSomeField&lt;/span&gt;() &amp;gt; &lt;span class=\"hljs-number\"&gt;10000&lt;/span&gt;; });\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"125\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-125\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-125\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-125.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"transformcopyif,-or-map\"&gt;&lt;a href=\"en/api/cpp/lambda.html#transformcopyif,-or-map\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;TransformCopyIf, or Map&lt;/span&gt;&lt;/a&gt;TransformCopyIf, or Map&lt;/h2&gt;\n&lt;p&gt;This function performs a classic &lt;a href=\"user-guide/data-processing/operations/map.html\"&gt;Map&lt;/a&gt;: it reads each record from the table of one format and writes them to the table of another format. Some records aren't included in the final table.&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs c++\"&gt;&lt;span class=\"hljs-keyword\"&gt;template&lt;/span&gt; &amp;lt;&lt;span class=\"hljs-keyword\"&gt;class&lt;/span&gt; &lt;span class=\"hljs-title class_\"&gt;R&lt;/span&gt;, &lt;span class=\"hljs-keyword\"&gt;class&lt;/span&gt; &lt;span class=\"hljs-title class_\"&gt;W&lt;/span&gt;&amp;gt;\n&lt;span class=\"hljs-function\"&gt;&lt;span class=\"hljs-type\"&gt;void&lt;/span&gt; &lt;span class=\"hljs-title\"&gt;TransformCopyIf&lt;/span&gt;&lt;span class=\"hljs-params\"&gt;(&lt;span class=\"hljs-type\"&gt;const&lt;/span&gt; IClientBasePtr&amp;amp; client, &lt;span class=\"hljs-type\"&gt;const&lt;/span&gt; TRichYPath&amp;amp; from, &lt;span class=\"hljs-type\"&gt;const&lt;/span&gt; TRichYPath&amp;amp; to, &lt;span class=\"hljs-type\"&gt;bool&lt;/span&gt; (*mapper)(&lt;span class=\"hljs-type\"&gt;const&lt;/span&gt; R&amp;amp;, W&amp;amp;))&lt;/span&gt;&lt;/span&gt;;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"132\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-132\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-132\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-132.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Parameter&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Description&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;R&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Input record type (TNode or a specific protobuf message type)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;W&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Output record type (TNode or a specific protobuf message type)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;from&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Input table name&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;to&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Output table name&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;mapper&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;A conversion function that takes an &lt;code&gt;src&lt;/code&gt; record of the &lt;code&gt;R&lt;/code&gt; type as input and fills the &lt;code&gt;dst&lt;/code&gt; record of the &lt;code&gt;W&lt;/code&gt; type. For &lt;code&gt;dst&lt;/code&gt; to be written, return &lt;code&gt;true&lt;/code&gt;. For performance reasons, the library passes as &lt;code&gt;dst&lt;/code&gt; the same buffer variable that isn't even cleared between &lt;code&gt;mapper&lt;/code&gt; calls. This is generally not a problem, because the &lt;code&gt;mapper&lt;/code&gt; usually fills in the same &lt;code&gt;dst&lt;/code&gt; fields.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Note:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;The order of records in the table isn't changed, and the &lt;code&gt;Ordered&lt;/code&gt; flag that may slightly slow down the operation is set.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h3 id=\"application1\"&gt;&lt;a href=\"en/api/cpp/lambda.html#application1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Application&lt;/span&gt;&lt;/a&gt;Application&lt;/h3&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs c++\"&gt;NYT::&lt;span class=\"hljs-built_in\"&gt;TransformCopyIf&lt;/span&gt;&amp;lt;TDataMsg, TStatsMsg&amp;gt;(\n    client, &lt;span class=\"hljs-string\"&gt;\"//home/project/inTable\"&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;\"//home/project/outTable\"&lt;/span&gt;,\n    [](&lt;span class=\"hljs-keyword\"&gt;auto&lt;/span&gt;&amp;amp; src, &lt;span class=\"hljs-keyword\"&gt;auto&lt;/span&gt;&amp;amp; dst) {\n        dst.&lt;span class=\"hljs-built_in\"&gt;SetField&lt;/span&gt;(src.&lt;span class=\"hljs-built_in\"&gt;GetField&lt;/span&gt;());\n        &lt;span class=\"hljs-keyword\"&gt;return&lt;/span&gt; &lt;span class=\"hljs-literal\"&gt;true&lt;/span&gt;;\n    });\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"200\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-200\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-200\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-200.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"additivereduce\"&gt;&lt;a href=\"en/api/cpp/lambda.html#additivereduce\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;AdditiveReduce&lt;/span&gt;&lt;/a&gt;AdditiveReduce&lt;/h2&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs c++\"&gt;&lt;span class=\"hljs-keyword\"&gt;template&lt;/span&gt; &amp;lt;&lt;span class=\"hljs-keyword\"&gt;class&lt;/span&gt; &lt;span class=\"hljs-title class_\"&gt;T&lt;/span&gt;, &lt;span class=\"hljs-keyword\"&gt;class&lt;/span&gt; &lt;span class=\"hljs-title class_\"&gt;TFin&lt;/span&gt;&amp;gt;\n&lt;span class=\"hljs-function\"&gt;&lt;span class=\"hljs-type\"&gt;void&lt;/span&gt; &lt;span class=\"hljs-title\"&gt;AdditiveReduce&lt;/span&gt;&lt;span class=\"hljs-params\"&gt;(\n    &lt;span class=\"hljs-type\"&gt;const&lt;/span&gt; IClientBasePtr&amp;amp; client,\n    &lt;span class=\"hljs-type\"&gt;const&lt;/span&gt; TKeyBase&amp;lt;TRichYPath&amp;gt;&amp;amp; from,\n    &lt;span class=\"hljs-type\"&gt;const&lt;/span&gt; TRichYPath&amp;amp; to,\n    &lt;span class=\"hljs-type\"&gt;const&lt;/span&gt; TKeyColumns&amp;amp; reduceFields,\n    &lt;span class=\"hljs-type\"&gt;void&lt;/span&gt; (*reducer)(&lt;span class=\"hljs-type\"&gt;const&lt;/span&gt; T&amp;amp;, T&amp;amp;),\n    &lt;span class=\"hljs-type\"&gt;bool&lt;/span&gt; (*finalizer)(&lt;span class=\"hljs-type\"&gt;const&lt;/span&gt; T&amp;amp;, TFin&amp;amp;))&lt;/span&gt;&lt;/span&gt;;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"204\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-204\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-204\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-204.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Parameter&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Description&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;T&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Input and output record type for reducer (TNode or a specific protobuf message type)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;TFin&lt;/code&gt;Opt&lt;/td&gt;\n&lt;td&gt;&lt;strong&gt;Optional parameter.&lt;/strong&gt; Output record type (TNode or a specific protobuf message type). &lt;span style=\"color:green\"&gt;&lt;strong&gt;Specified only in the version with a finalizer&lt;/strong&gt;&lt;/span&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;from&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Name of an input table (input tables)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;to&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Output table name&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;reduceFields&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Which keys' identical values will be used for sorting and folding (Reduce)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;reducer&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;A conversion function that takes a new &lt;code&gt;src&lt;/code&gt; record of the &lt;code&gt;T&lt;/code&gt; type as input and modifies the &lt;code&gt;dst&lt;/code&gt; record of the same &lt;code&gt;T&lt;/code&gt; type. The first record of the current range of records with the same &lt;code&gt;reduceFields&lt;/code&gt; keys is initially included in &lt;code&gt;dst&lt;/code&gt;. If there is one record in the current range, the &lt;code&gt;reducer&lt;/code&gt; won't be called. You don't need to write anything in the &lt;code&gt;dst&lt;/code&gt; fields that correspond to the keys — everything is already there&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;finalizer&lt;/code&gt;Opt&lt;/td&gt;\n&lt;td&gt;&lt;strong&gt;Optional parameter.&lt;/strong&gt; A conversion function that takes a new &lt;code&gt;src&lt;/code&gt; record of the &lt;code&gt;T&lt;/code&gt; type as input and fills the &lt;code&gt;dst&lt;/code&gt; record of the &lt;code&gt;TFin&lt;/code&gt; type. Called once after Reduce has processed a range of input records to generate the final version of the output record. &lt;code&gt;dst&lt;/code&gt; is initialized by default. You don't need to write anything in the &lt;code&gt;dst&lt;/code&gt; fields that correspond to the keys — everything is already there&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;h2 id=\"reduce\"&gt;&lt;a href=\"en/api/cpp/lambda.html#reduce\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Reduce&lt;/span&gt;&lt;/a&gt;Reduce&lt;/h2&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs c++\"&gt;&lt;span class=\"hljs-keyword\"&gt;template&lt;/span&gt; &amp;lt;&lt;span class=\"hljs-keyword\"&gt;class&lt;/span&gt; &lt;span class=\"hljs-title class_\"&gt;R&lt;/span&gt;, &lt;span class=\"hljs-keyword\"&gt;class&lt;/span&gt; &lt;span class=\"hljs-title class_\"&gt;W&lt;/span&gt;, &lt;span class=\"hljs-keyword\"&gt;class&lt;/span&gt; &lt;span class=\"hljs-title class_\"&gt;TFin&lt;/span&gt;&amp;gt;\n&lt;span class=\"hljs-function\"&gt;&lt;span class=\"hljs-type\"&gt;void&lt;/span&gt; &lt;span class=\"hljs-title\"&gt;Reduce&lt;/span&gt;&lt;span class=\"hljs-params\"&gt;(\n    &lt;span class=\"hljs-type\"&gt;const&lt;/span&gt; IClientBasePtr&amp;amp; client,\n    &lt;span class=\"hljs-type\"&gt;const&lt;/span&gt; TKeyBase&amp;lt;TRichYPath&amp;gt;&amp;amp; from,\n    &lt;span class=\"hljs-type\"&gt;const&lt;/span&gt; TRichYPath&amp;amp; to,\n    &lt;span class=\"hljs-type\"&gt;const&lt;/span&gt; TKeyColumns&amp;amp; reduceFields,\n    &lt;span class=\"hljs-type\"&gt;void&lt;/span&gt; (*reducer)(&lt;span class=\"hljs-type\"&gt;const&lt;/span&gt; R&amp;amp;, W&amp;amp;),\n    &lt;span class=\"hljs-type\"&gt;bool&lt;/span&gt; (*finalizer)(&lt;span class=\"hljs-type\"&gt;const&lt;/span&gt; W&amp;amp;, TFin&amp;amp;))&lt;/span&gt;&lt;/span&gt;;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"278\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-278\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-278\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-278.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Parameter&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Description&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;R&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Input record type (TNode or a specific protobuf message type)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;W&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Reducer's output record type (TNode or protobuf)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;TFin&lt;/code&gt;Opt&lt;/td&gt;\n&lt;td&gt;&lt;strong&gt;Optional parameter.&lt;/strong&gt; Output record type (TNode or a specific protobuf message type). &lt;span style=\"color:green\"&gt;&lt;strong&gt;Specified only in the version with a finalizer&lt;/strong&gt;&lt;/span&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;from&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Name of an input table (input tables)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;to&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Output table name&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;reduceFields&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Which keys' identical values will be used for sorting and folding (Reduce)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;reducer&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;A conversion function that takes a new &lt;code&gt;src&lt;/code&gt; record of the &lt;code&gt;R&lt;/code&gt; type as input and modifies the &lt;code&gt;dst&lt;/code&gt; record of the &lt;code&gt;W&lt;/code&gt; type. &lt;code&gt;dst&lt;/code&gt; is initialized by default (in case of TNode, there will be an empty TNode, that is, &lt;code&gt;Undefined&lt;/code&gt;; protobuf is usually initialized with zeros and empty strings, which makes it more practical). You don't need to write anything in the &lt;code&gt;dst&lt;/code&gt; fields that correspond to the keys — everything is already there&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;finalizer&lt;/code&gt;Opt&lt;/td&gt;\n&lt;td&gt;&lt;strong&gt;Optional parameter.&lt;/strong&gt; A conversion function that takes a new &lt;code&gt;src&lt;/code&gt; record of the &lt;code&gt;W&lt;/code&gt; type as input and fills the &lt;code&gt;dst&lt;/code&gt; record of the &lt;code&gt;TFin&lt;/code&gt; type. Called once after Reduce has processed a range of input records to generate the final version of the output record. &lt;code&gt;dst&lt;/code&gt; is initialized by default. You don't need to write anything in the &lt;code&gt;dst&lt;/code&gt; fields that correspond to the keys — everything is already there&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;h2 id=\"additive_mapreduce\"&gt;&lt;a href=\"en/api/cpp/lambda.html#additive_mapreduce\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;AdditiveMapReduce[Sorted]&lt;/span&gt;&lt;/a&gt;AdditiveMapReduce[Sorted]&lt;/h2&gt;\n&lt;p&gt;The &lt;code&gt;AdditiveMapReduce&lt;/code&gt; function generates a merged &lt;a href=\"user-guide/data-processing/operations/mapreduce.html\"&gt;MapReduce operation&lt;/a&gt;, that is, it converts records of the input table (or tables), sorts the result, and performs Reduce. The reducer must be an &lt;a href=\"https://en.wikipedia.org/wiki/Associative_property\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;associative binary operation&lt;/a&gt; on same-type records — most often, this will be an addition of numbers. As a bonus, YT can use such a reducer as a combiner if needed.&lt;/p&gt;\n&lt;p&gt;Unfortunately, merged MapReduce operations in YT always generate an unsorted table. There's a workaround in the form of the &lt;code&gt;AdditiveMapReduceSorted&lt;/code&gt; function, which invokes &lt;code&gt;AdditiveMapReduce&lt;/code&gt; and then sorts the output table.&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs c++\"&gt;&lt;span class=\"hljs-keyword\"&gt;template&lt;/span&gt; &amp;lt;&lt;span class=\"hljs-keyword\"&gt;class&lt;/span&gt; &lt;span class=\"hljs-title class_\"&gt;R&lt;/span&gt;, &lt;span class=\"hljs-keyword\"&gt;class&lt;/span&gt; &lt;span class=\"hljs-title class_\"&gt;W&lt;/span&gt;, &lt;span class=\"hljs-keyword\"&gt;class&lt;/span&gt; &lt;span class=\"hljs-title class_\"&gt;TFin&lt;/span&gt;&amp;gt;\n&lt;span class=\"hljs-function\"&gt;&lt;span class=\"hljs-type\"&gt;void&lt;/span&gt; &lt;span class=\"hljs-title\"&gt;AdditiveMapReduce&lt;/span&gt;&lt;span class=\"hljs-params\"&gt;(\n    &lt;span class=\"hljs-type\"&gt;const&lt;/span&gt; IClientBasePtr&amp;amp; client,\n    &lt;span class=\"hljs-type\"&gt;const&lt;/span&gt; TKeyBase&amp;lt;TRichYPath&amp;gt;&amp;amp; from,\n    &lt;span class=\"hljs-type\"&gt;const&lt;/span&gt; TRichYPath&amp;amp; to,\n    &lt;span class=\"hljs-type\"&gt;const&lt;/span&gt; TKeyColumns&amp;amp; reduceFields,\n    &lt;span class=\"hljs-type\"&gt;bool&lt;/span&gt; (*mapper)(&lt;span class=\"hljs-type\"&gt;const&lt;/span&gt; R&amp;amp;, W&amp;amp;),\n    &lt;span class=\"hljs-type\"&gt;void&lt;/span&gt; (*reducer)(&lt;span class=\"hljs-type\"&gt;const&lt;/span&gt; W&amp;amp;, W&amp;amp;),\n    &lt;span class=\"hljs-type\"&gt;bool&lt;/span&gt; (*finalizer)(&lt;span class=\"hljs-type\"&gt;const&lt;/span&gt; W&amp;amp;, TFin&amp;amp;))&lt;/span&gt;&lt;/span&gt;;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"366\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-366\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-366\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-366.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Parameter&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Description&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;R&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Input record type (TNode or a specific protobuf message type)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;W&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Output record type for reducer (TNode or a specific protobuf message type)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;TFin&lt;/code&gt;Opt&lt;/td&gt;\n&lt;td&gt;&lt;strong&gt;Optional parameter.&lt;/strong&gt; Output record type (TNode or a specific protobuf message type). &lt;span style=\"color:green\"&gt;&lt;strong&gt;Specified only in the version with a finalizer&lt;/strong&gt;&lt;/span&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;from&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Name of an input table (input tables)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;to&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Output table name&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;reduceFields&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Which keys' identical values will be used for sorting and folding (Reduce)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;mapper&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;A conversion function that takes an &lt;code&gt;src&lt;/code&gt; record of the &lt;code&gt;R&lt;/code&gt; type as input and fills the &lt;code&gt;dst&lt;/code&gt; record of the &lt;code&gt;W&lt;/code&gt; type. For &lt;code&gt;dst&lt;/code&gt; to be written, return &lt;code&gt;true&lt;/code&gt;. &lt;code&gt;mapper&lt;/code&gt; may be &lt;code&gt;nullptr&lt;/code&gt;. For performance reasons, the library passes as &lt;code&gt;dst&lt;/code&gt; the same buffer variable that isn't even cleared between &lt;code&gt;mapper&lt;/code&gt; calls. This is generally not a problem, because the &lt;code&gt;mapper&lt;/code&gt; usually fills in the same &lt;code&gt;dst&lt;/code&gt; fields.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;reducer&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;A conversion function that takes a new &lt;code&gt;src&lt;/code&gt; record of the &lt;code&gt;W&lt;/code&gt; type and modifies the &lt;code&gt;dst&lt;/code&gt; record of the same &lt;code&gt;W&lt;/code&gt; type. The first record of the current range of records with the same &lt;code&gt;reduceFields&lt;/code&gt; keys is initially included in &lt;code&gt;dst&lt;/code&gt;. If there is one record in the current range, the &lt;code&gt;reducer&lt;/code&gt; won't be called. You don't need to write anything in the &lt;code&gt;dst&lt;/code&gt; fields that correspond to the keys — everything is already there&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;finalizer&lt;/code&gt;Opt&lt;/td&gt;\n&lt;td&gt;&lt;strong&gt;Optional parameter.&lt;/strong&gt; A conversion function that takes a new &lt;code&gt;src&lt;/code&gt; record of the &lt;code&gt;W&lt;/code&gt; type as input and fills the &lt;code&gt;dst&lt;/code&gt; record of the &lt;code&gt;TFin&lt;/code&gt; type. Called once after Reduce has processed a range of input records to generate the final version of the output record. &lt;code&gt;dst&lt;/code&gt; is initialized by default. You don't need to write anything in the &lt;code&gt;dst&lt;/code&gt; fields that correspond to the keys — everything is already there&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;h3 id=\"application2\"&gt;&lt;a href=\"en/api/cpp/lambda.html#application2\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Application&lt;/span&gt;&lt;/a&gt;Application&lt;/h3&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs c++\"&gt;NYT::&lt;span class=\"hljs-built_in\"&gt;AdditiveMapReduceSorted&lt;/span&gt;&amp;lt;TDataMsg, TStatsMsg&amp;gt;(\n    client,\n    inTable, &lt;span class=\"hljs-comment\"&gt;// or inTables&lt;/span&gt;\n    outTable,\n    &lt;span class=\"hljs-string\"&gt;\"name\"&lt;/span&gt;, &lt;span class=\"hljs-comment\"&gt;// sort key, matches TStatsMsg::Name&lt;/span&gt;\n    [](&lt;span class=\"hljs-keyword\"&gt;auto&lt;/span&gt;&amp;amp; src, &lt;span class=\"hljs-keyword\"&gt;auto&lt;/span&gt;&amp;amp; dst) {\n        &lt;span class=\"hljs-comment\"&gt;// dst is a buffer that may contain garbage.&lt;/span&gt;\n        &lt;span class=\"hljs-comment\"&gt;// We don't need to clear it because we set all fields.&lt;/span&gt;\n        dst.&lt;span class=\"hljs-built_in\"&gt;SetName&lt;/span&gt;(src.&lt;span class=\"hljs-built_in\"&gt;GetSomeField&lt;/span&gt;());\n        dst.&lt;span class=\"hljs-built_in\"&gt;SetCount&lt;/span&gt;(src.&lt;span class=\"hljs-built_in\"&gt;GetSomeCountField&lt;/span&gt;());\n        &lt;span class=\"hljs-keyword\"&gt;return&lt;/span&gt; &lt;span class=\"hljs-literal\"&gt;true&lt;/span&gt;;\n    },\n    [](&lt;span class=\"hljs-keyword\"&gt;auto&lt;/span&gt;&amp;amp; src, &lt;span class=\"hljs-keyword\"&gt;auto&lt;/span&gt;&amp;amp; dst) {\n        &lt;span class=\"hljs-comment\"&gt;// dst is initialized by the first record of equal key range.&lt;/span&gt;\n        &lt;span class=\"hljs-comment\"&gt;// This lambda function is called starting from the 2nd record.&lt;/span&gt;\n        &lt;span class=\"hljs-comment\"&gt;// dst.Name is filled with correct value and must not be modified.&lt;/span&gt;\n        dst.&lt;span class=\"hljs-built_in\"&gt;SetCount&lt;/span&gt;(src.&lt;span class=\"hljs-built_in\"&gt;GetCount&lt;/span&gt;() + dst.&lt;span class=\"hljs-built_in\"&gt;GetCount&lt;/span&gt;());\n    });\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"456\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-456\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-456\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-456.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"mapreduce\"&gt;&lt;a href=\"en/api/cpp/lambda.html#mapreduce\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;MapReduce[Sorted]&lt;/span&gt;&lt;/a&gt;MapReduce[Sorted]&lt;/h2&gt;\n&lt;p&gt;The MapReduce function generates a merged MapReduce operation, that is, it converts records of the input table (or tables), sorts the result, and performs Reduce. Unlike &lt;a href=\"en/api/cpp/lambda.html#additive_mapreduce\"&gt;AdditiveMapReduce&lt;/a&gt;, the reducer function doesn't have to be associative, so it can have different input and output record types (and thus can't be used as a combiner). To make the output clearer, you can use an additional lambda function — finalizer, — which will be called on the reducer output to generate the final version of the record.&lt;/p&gt;\n&lt;p&gt;Unfortunately, merged MapReduce operations in YT always generate an unsorted table. There's a workaround in the form of the &lt;code&gt;MapReduceSorted&lt;/code&gt; function, which invokes &lt;code&gt;MapReduce&lt;/code&gt; and then sorts the output table.&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs c++\"&gt;&lt;span class=\"hljs-keyword\"&gt;template&lt;/span&gt; &amp;lt;&lt;span class=\"hljs-keyword\"&gt;class&lt;/span&gt; &lt;span class=\"hljs-title class_\"&gt;R&lt;/span&gt;, &lt;span class=\"hljs-keyword\"&gt;class&lt;/span&gt; &lt;span class=\"hljs-title class_\"&gt;TMapped&lt;/span&gt;, &lt;span class=\"hljs-keyword\"&gt;class&lt;/span&gt; &lt;span class=\"hljs-title class_\"&gt;TReducerData&lt;/span&gt;, &lt;span class=\"hljs-keyword\"&gt;class&lt;/span&gt; &lt;span class=\"hljs-title class_\"&gt;W&lt;/span&gt;&amp;gt;\n&lt;span class=\"hljs-function\"&gt;&lt;span class=\"hljs-type\"&gt;void&lt;/span&gt; &lt;span class=\"hljs-title\"&gt;MapReduce&lt;/span&gt;&lt;span class=\"hljs-params\"&gt;(\n    &lt;span class=\"hljs-type\"&gt;const&lt;/span&gt; IClientBasePtr&amp;amp; client,\n    &lt;span class=\"hljs-type\"&gt;const&lt;/span&gt; TKeyBase&amp;lt;TRichYPath&amp;gt;&amp;amp; from,\n    &lt;span class=\"hljs-type\"&gt;const&lt;/span&gt; TRichYPath&amp;amp; to,\n    &lt;span class=\"hljs-type\"&gt;const&lt;/span&gt; TKeyColumns&amp;amp; reduceFields,\n    &lt;span class=\"hljs-type\"&gt;bool&lt;/span&gt; (*mapper)(&lt;span class=\"hljs-type\"&gt;const&lt;/span&gt; R&amp;amp; src, TMapped&amp;amp; dst),\n    &lt;span class=\"hljs-type\"&gt;void&lt;/span&gt; (*reducer)(&lt;span class=\"hljs-type\"&gt;const&lt;/span&gt; TMapped&amp;amp; src, TReducerData&amp;amp; dst),\n    &lt;span class=\"hljs-type\"&gt;bool&lt;/span&gt; (*finalizer)(&lt;span class=\"hljs-type\"&gt;const&lt;/span&gt; TReducerData&amp;amp; src, W&amp;amp; dst))&lt;/span&gt;&lt;/span&gt;;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"466\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-466\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-466\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-466.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Parameter&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Description&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;R&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Input record type (TNode or a specific protobuf message type)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;TMapped&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Output record type for mapper and input record type for reducer (TNode or protobuf)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;TReducerData&lt;/code&gt;Opt&lt;/td&gt;\n&lt;td&gt;&lt;strong&gt;Optional parameter.&lt;/strong&gt; Output record type for the reducer and input record type for the finalizer (any type, including C++ struct). &lt;span style=\"color:green\"&gt;&lt;strong&gt;Specified only in the MapReduce version with a finalizer&lt;/strong&gt;&lt;/span&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;W&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Output record type (TNode or a specific protobuf message type)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;from&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Name of an input table (input tables)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;to&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Output table name&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;reduceFields&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Which keys' identical values will be used for sorting and folding (Reduce)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;mapper&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;A conversion function that takes an &lt;code&gt;src&lt;/code&gt; record of the &lt;code&gt;R&lt;/code&gt; type as input and fills the &lt;code&gt;dst&lt;/code&gt; record of the &lt;code&gt;TMapped&lt;/code&gt; type. For &lt;code&gt;dst&lt;/code&gt; to be written, return &lt;code&gt;true&lt;/code&gt;. &lt;code&gt;mapper&lt;/code&gt; may be &lt;code&gt;nullptr&lt;/code&gt;. For performance reasons, the library passes as &lt;code&gt;dst&lt;/code&gt; the same buffer variable that isn't even cleared between &lt;code&gt;mapper&lt;/code&gt; calls. This is generally not a problem, because the &lt;code&gt;mapper&lt;/code&gt; usually fills in the same &lt;code&gt;dst&lt;/code&gt; fields.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;reducer&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;A conversion function that takes a new &lt;code&gt;src&lt;/code&gt; record of the &lt;code&gt;TMapped&lt;/code&gt; type as input and modifies the &lt;code&gt;dst&lt;/code&gt; record of the &lt;code&gt;W&lt;/code&gt; type (or &lt;code&gt;TReducerData&lt;/code&gt; when using a finalizer). &lt;code&gt;dst&lt;/code&gt; is initialized by default (in case of TNode, there will be an empty TNode, that is, &lt;code&gt;Undefined&lt;/code&gt;; protobuf is usually initialized with zeros and empty strings, which makes it more practical). You don't need to write anything in the &lt;code&gt;dst&lt;/code&gt; fields that correspond to the keys — everything is already there&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;finalizer&lt;/code&gt;Opt&lt;/td&gt;\n&lt;td&gt;&lt;strong&gt;Optional parameter.&lt;/strong&gt; A conversion function that takes a new &lt;code&gt;src&lt;/code&gt; record of the &lt;code&gt;TReducerData&lt;/code&gt; type as input and fills the &lt;code&gt;dst&lt;/code&gt; record of the &lt;code&gt;W&lt;/code&gt; type. Called once after the reducer has processed a range of input records to generate the final version of the output record. &lt;code&gt;dst&lt;/code&gt; is initialized by default. You don't need to write anything in the &lt;code&gt;dst&lt;/code&gt; fields that correspond to the keys — everything is already there&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;h3 id=\"mapreduce_example\"&gt;&lt;a href=\"en/api/cpp/lambda.html#mapreduce_example\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Application&lt;/span&gt;&lt;/a&gt;Application&lt;/h3&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs c++\"&gt;message TSimpleKeyValue {\n    required string Key = &lt;span class=\"hljs-number\"&gt;1&lt;/span&gt;          [(NYT.column_name) = &lt;span class=\"hljs-string\"&gt;\"key\"&lt;/span&gt;];\n    required uint64 Value = &lt;span class=\"hljs-number\"&gt;2&lt;/span&gt;        [(NYT.column_name) = &lt;span class=\"hljs-string\"&gt;\"value\"&lt;/span&gt;];\n}\n\nmessage TKeyStat {\n    required string Key = &lt;span class=\"hljs-number\"&gt;1&lt;/span&gt;          [(NYT.column_name) = &lt;span class=\"hljs-string\"&gt;\"key\"&lt;/span&gt;];\n    required &lt;span class=\"hljs-type\"&gt;double&lt;/span&gt; Mean = &lt;span class=\"hljs-number\"&gt;2&lt;/span&gt;         [(NYT.column_name) = &lt;span class=\"hljs-string\"&gt;\"mean\"&lt;/span&gt;];\n    required &lt;span class=\"hljs-type\"&gt;double&lt;/span&gt; Sigma = &lt;span class=\"hljs-number\"&gt;3&lt;/span&gt;        [(NYT.column_name) = &lt;span class=\"hljs-string\"&gt;\"sigma\"&lt;/span&gt;];\n}message TSimpleKeyValue {\n    required string Key = &lt;span class=\"hljs-number\"&gt;1&lt;/span&gt;          [(NYT.column_name) = &lt;span class=\"hljs-string\"&gt;\"key\"&lt;/span&gt;];\n    required uint64 Value = &lt;span class=\"hljs-number\"&gt;2&lt;/span&gt;        [(NYT.column_name) = &lt;span class=\"hljs-string\"&gt;\"value\"&lt;/span&gt;];\n}\n\nmessage TKeyStat {\n    required string Key = &lt;span class=\"hljs-number\"&gt;1&lt;/span&gt;          [(NYT.column_name) = &lt;span class=\"hljs-string\"&gt;\"key\"&lt;/span&gt;];\n    required &lt;span class=\"hljs-type\"&gt;double&lt;/span&gt; Mean = &lt;span class=\"hljs-number\"&gt;2&lt;/span&gt;         [(NYT.column_name) = &lt;span class=\"hljs-string\"&gt;\"mean\"&lt;/span&gt;];\n    required &lt;span class=\"hljs-type\"&gt;double&lt;/span&gt; Sigma = &lt;span class=\"hljs-number\"&gt;3&lt;/span&gt;        [(NYT.column_name) = &lt;span class=\"hljs-string\"&gt;\"sigma\"&lt;/span&gt;];\n}\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"564\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-564\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-564\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-564.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs c++\"&gt;&lt;span class=\"hljs-keyword\"&gt;struct&lt;/span&gt; &lt;span class=\"hljs-title class_\"&gt;TDispersionData&lt;/span&gt; {\n    ui64 Count = &lt;span class=\"hljs-number\"&gt;0&lt;/span&gt;;\n    &lt;span class=\"hljs-type\"&gt;long&lt;/span&gt; &lt;span class=\"hljs-type\"&gt;double&lt;/span&gt; Sum = &lt;span class=\"hljs-number\"&gt;0.&lt;/span&gt;;\n    &lt;span class=\"hljs-type\"&gt;long&lt;/span&gt; &lt;span class=\"hljs-type\"&gt;double&lt;/span&gt; SumSquared = &lt;span class=\"hljs-number\"&gt;0.&lt;/span&gt;;\n};\n\n&lt;span class=\"hljs-function\"&gt;&lt;span class=\"hljs-type\"&gt;void&lt;/span&gt; &lt;span class=\"hljs-title\"&gt;CalculateDispersion&lt;/span&gt;&lt;span class=\"hljs-params\"&gt;(IClientPtr&amp;amp; client, TString input, TString output)&lt;/span&gt; &lt;/span&gt;{\n    NYT::&lt;span class=\"hljs-built_in\"&gt;MapReduceSorted&lt;/span&gt;&amp;lt;TDataMsg, TSimpleKeyValue, TDispersionData, TKeyStat&amp;gt;(\n        client,\n        input,\n        output,\n        &lt;span class=\"hljs-string\"&gt;\"key\"&lt;/span&gt;,\n        [](&lt;span class=\"hljs-keyword\"&gt;auto&lt;/span&gt;&amp;amp; src, &lt;span class=\"hljs-keyword\"&gt;auto&lt;/span&gt;&amp;amp; dst) { &lt;span class=\"hljs-comment\"&gt;// mapper&lt;/span&gt;\n            dst.&lt;span class=\"hljs-built_in\"&gt;SetName&lt;/span&gt;(src.&lt;span class=\"hljs-built_in\"&gt;GetSomeField&lt;/span&gt;());\n            dst.&lt;span class=\"hljs-built_in\"&gt;SetCount&lt;/span&gt;(src.&lt;span class=\"hljs-built_in\"&gt;GetSomeCountField&lt;/span&gt;());\n            &lt;span class=\"hljs-keyword\"&gt;return&lt;/span&gt; &lt;span class=\"hljs-literal\"&gt;true&lt;/span&gt;;\n        },\n        [](&lt;span class=\"hljs-keyword\"&gt;auto&lt;/span&gt;&amp;amp; src, &lt;span class=\"hljs-keyword\"&gt;auto&lt;/span&gt;&amp;amp; dst) { &lt;span class=\"hljs-comment\"&gt;// reducer&lt;/span&gt;\n            &lt;span class=\"hljs-type\"&gt;double&lt;/span&gt; value = src.&lt;span class=\"hljs-built_in\"&gt;GetValue&lt;/span&gt;();\n            dst.Count++;\n            dst.Sum += value;\n            dst.SumSquared += value * value;\n        },\n        [](&lt;span class=\"hljs-keyword\"&gt;auto&lt;/span&gt;&amp;amp; src, &lt;span class=\"hljs-keyword\"&gt;auto&lt;/span&gt;&amp;amp; dst) { &lt;span class=\"hljs-comment\"&gt;// finalizer&lt;/span&gt;\n            &lt;span class=\"hljs-type\"&gt;double&lt;/span&gt; mean = (&lt;span class=\"hljs-type\"&gt;double&lt;/span&gt;)src.Sum / src.Count;\n            &lt;span class=\"hljs-type\"&gt;double&lt;/span&gt; dispersion = (&lt;span class=\"hljs-type\"&gt;double&lt;/span&gt;)src.SumSquared / src.Count - mean * mean;\n            dst.&lt;span class=\"hljs-built_in\"&gt;SetMean&lt;/span&gt;(mean);\n            dst.&lt;span class=\"hljs-built_in\"&gt;SetSigma&lt;/span&gt;(std::&lt;span class=\"hljs-built_in\"&gt;sqrt&lt;/span&gt;(dispersion));\n        });\n}\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"565\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-565\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-565\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-565.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"mapreduce_combined\"&gt;&lt;a href=\"en/api/cpp/lambda.html#mapreduce_combined\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;MapReduceCombined[Sorted]&lt;/span&gt;&lt;/a&gt;MapReduceCombined[Sorted]&lt;/h2&gt;\n&lt;p&gt;The MapReduceCombined function generates a merged MapReduce operation, that is, it converts records of the input table (or tables), sorts the result, and performs Reduce similarly to &lt;a href=\"en/api/cpp/lambda.html#mapreduce\"&gt;MapReduce&lt;/a&gt;, but with combiner mandatorily enabled. To make the output clearer, you can use an additional lambda function — finalizer, — which will be called on the reducer output to generate the final version of the record.&lt;/p&gt;\n&lt;p&gt;Unfortunately, merged MapReduce operations in YT always generate an unsorted table. There's a workaround in the form of the &lt;code&gt;MapReduceCombinedSorted&lt;/code&gt; function, which invokes &lt;code&gt;MapReduceCombined&lt;/code&gt; and then sorts the output table.&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs c++\"&gt;&lt;span class=\"hljs-keyword\"&gt;template&lt;/span&gt; &amp;lt;&lt;span class=\"hljs-keyword\"&gt;class&lt;/span&gt; &lt;span class=\"hljs-title class_\"&gt;R&lt;/span&gt;, &lt;span class=\"hljs-keyword\"&gt;class&lt;/span&gt; &lt;span class=\"hljs-title class_\"&gt;TMapped&lt;/span&gt;, &lt;span class=\"hljs-keyword\"&gt;class&lt;/span&gt; &lt;span class=\"hljs-title class_\"&gt;W&lt;/span&gt;, &lt;span class=\"hljs-keyword\"&gt;class&lt;/span&gt; &lt;span class=\"hljs-title class_\"&gt;TFin&lt;/span&gt;&amp;gt;\n&lt;span class=\"hljs-function\"&gt;&lt;span class=\"hljs-type\"&gt;void&lt;/span&gt; &lt;span class=\"hljs-title\"&gt;MapReduceCombined&lt;/span&gt;&lt;span class=\"hljs-params\"&gt;(\n    &lt;span class=\"hljs-type\"&gt;const&lt;/span&gt; IClientBasePtr&amp;amp; client,\n    &lt;span class=\"hljs-type\"&gt;const&lt;/span&gt; TKeyBase&amp;lt;TRichYPath&amp;gt;&amp;amp; from,\n    &lt;span class=\"hljs-type\"&gt;const&lt;/span&gt; TRichYPath&amp;amp; to,\n    &lt;span class=\"hljs-type\"&gt;const&lt;/span&gt; TKeyColumns&amp;amp; reduceFields,\n    &lt;span class=\"hljs-type\"&gt;bool&lt;/span&gt; (*mapper)(&lt;span class=\"hljs-type\"&gt;const&lt;/span&gt; R&amp;amp;, TMapped&amp;amp;),\n    &lt;span class=\"hljs-type\"&gt;void&lt;/span&gt; (*combiner)(&lt;span class=\"hljs-type\"&gt;const&lt;/span&gt; TMapped&amp;amp;, W&amp;amp;),\n    &lt;span class=\"hljs-type\"&gt;void&lt;/span&gt; (*reducer)(&lt;span class=\"hljs-type\"&gt;const&lt;/span&gt; W&amp;amp;, W&amp;amp;),\n    &lt;span class=\"hljs-type\"&gt;bool&lt;/span&gt; (*finalizer)(&lt;span class=\"hljs-type\"&gt;const&lt;/span&gt; W&amp;amp;, TFin&amp;amp;))&lt;/span&gt;&lt;/span&gt;;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"575\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-575\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-575\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-575.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Parameter&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Description&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;R&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Input record type (TNode or a specific protobuf message type)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;TMapped&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Output record type for mapper and input record type for reducer (TNode or protobuf)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;W&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Output record type for the combiner, input record type for the reducer and finalizer (TNode or a specific protobuf message type)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;TFin&lt;/code&gt;Opt&lt;/td&gt;\n&lt;td&gt;&lt;strong&gt;Optional parameter.&lt;/strong&gt; Output entry type for finalizer (TNode or a specific protobuf message type). &lt;span style=\"color:green\"&gt;&lt;strong&gt;Specified only in the version with a finalizer&lt;/strong&gt;&lt;/span&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;from&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Name of an input table (input tables)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;to&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Output table name&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;reduceFields&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Which keys' identical values will be used for sorting and folding (Reduce)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;mapper&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;A conversion function that takes an &lt;code&gt;src&lt;/code&gt; record of the &lt;code&gt;R&lt;/code&gt; type as input and fills the &lt;code&gt;dst&lt;/code&gt; record of the &lt;code&gt;TMapped&lt;/code&gt; type. For &lt;code&gt;dst&lt;/code&gt; to be written, return &lt;code&gt;true&lt;/code&gt;. &lt;code&gt;mapper&lt;/code&gt; may be &lt;code&gt;nullptr&lt;/code&gt;. For performance reasons, the library passes as &lt;code&gt;dst&lt;/code&gt; the same buffer variable that isn't even cleared between &lt;code&gt;mapper&lt;/code&gt; calls. This is generally not a problem, because the &lt;code&gt;mapper&lt;/code&gt; usually fills in the same &lt;code&gt;dst&lt;/code&gt; fields.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;combiner&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;A conversion function that takes a new &lt;code&gt;src&lt;/code&gt; record of the &lt;code&gt;TMapped&lt;/code&gt; type as input and modifies the &lt;code&gt;dst&lt;/code&gt; record of the &lt;code&gt;W&lt;/code&gt; type. Essentially, it does the same thing that the reducer does in &lt;a href=\"en/api/cpp/lambda.html#mapreduce\"&gt;MapReduce&lt;/a&gt;. &lt;code&gt;dst&lt;/code&gt; is initialized by default (in case of TNode, there will be an empty TNode, that is, &lt;code&gt;Undefined&lt;/code&gt;; protobuf is usually initialized with zeros and empty strings, which makes it more practical). You don't need to write anything in the &lt;code&gt;dst&lt;/code&gt; fields that correspond to the keys — everything is already there&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;reducer&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;An associative conversion function that takes a new &lt;code&gt;src&lt;/code&gt; record as input and modifies the &lt;code&gt;dst&lt;/code&gt; record of the same &lt;code&gt;W&lt;/code&gt; type. The first record of the current range of records with the same &lt;code&gt;reduceFields&lt;/code&gt; keys is initially included in &lt;code&gt;dst&lt;/code&gt;. If there is one record in the current range, the &lt;code&gt;reducer&lt;/code&gt; won't be called. You don't need to write anything in the &lt;code&gt;dst&lt;/code&gt; fields that correspond to the keys — everything is already there&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;finalizer&lt;/code&gt;Opt&lt;/td&gt;\n&lt;td&gt;&lt;strong&gt;Optional parameter.&lt;/strong&gt; A conversion function that takes a new &lt;code&gt;src&lt;/code&gt; record of the &lt;code&gt;W&lt;/code&gt; type as input and fills the &lt;code&gt;dst&lt;/code&gt; record of the &lt;code&gt;TFin&lt;/code&gt; type. Called once after Reduce has processed a range of input records to generate the final version of the output record. &lt;code&gt;dst&lt;/code&gt; is initialized by default. You don't need to write anything in the &lt;code&gt;dst&lt;/code&gt; fields that correspond to the keys — everything is already there&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;h3 id=\"application3\"&gt;&lt;a href=\"en/api/cpp/lambda.html#application3\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Application&lt;/span&gt;&lt;/a&gt;Application&lt;/h3&gt;\n&lt;p&gt;In addition to the protobuf messages defined in the &lt;a href=\"en/api/cpp/lambda.html#mapreduce_example\"&gt;example for MapReduce&lt;/a&gt;:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs c++\"&gt;message TDispersionDataMsg {\n    required string Key = &lt;span class=\"hljs-number\"&gt;1&lt;/span&gt;          [(NYT.column_name) = &lt;span class=\"hljs-string\"&gt;\"key\"&lt;/span&gt;];\n    required uint64 Count = &lt;span class=\"hljs-number\"&gt;2&lt;/span&gt;        [(NYT.column_name) = &lt;span class=\"hljs-string\"&gt;\"count\"&lt;/span&gt;];\n    required &lt;span class=\"hljs-type\"&gt;double&lt;/span&gt; Sum = &lt;span class=\"hljs-number\"&gt;3&lt;/span&gt;          [(NYT.column_name) = &lt;span class=\"hljs-string\"&gt;\"sum\"&lt;/span&gt;];\n    required &lt;span class=\"hljs-type\"&gt;double&lt;/span&gt; SumSquared = &lt;span class=\"hljs-number\"&gt;4&lt;/span&gt;   [(NYT.column_name) = &lt;span class=\"hljs-string\"&gt;\"sum_squared\"&lt;/span&gt;];\n};\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"684\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-684\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-684\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-684.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;The function itself:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs c++\"&gt;&lt;span class=\"hljs-function\"&gt;&lt;span class=\"hljs-type\"&gt;void&lt;/span&gt; &lt;span class=\"hljs-title\"&gt;CalculateDispersionWithCombiner&lt;/span&gt;&lt;span class=\"hljs-params\"&gt;(IClientPtr&amp;amp; client, TString input, TString output)&lt;/span&gt; &lt;/span&gt;{\n    NYT::&lt;span class=\"hljs-built_in\"&gt;MapReduceCombinedSorted&lt;/span&gt;&amp;lt;TDataMsg, TSimpleKeyValue, TDispersionDataMsg, TKeyStat&amp;gt;(\n        client,\n        input,\n        output,\n        &lt;span class=\"hljs-string\"&gt;\"key\"&lt;/span&gt;,\n        [](&lt;span class=\"hljs-keyword\"&gt;auto&lt;/span&gt;&amp;amp; src, &lt;span class=\"hljs-keyword\"&gt;auto&lt;/span&gt;&amp;amp; dst) { &lt;span class=\"hljs-comment\"&gt;// mapper&lt;/span&gt;\n            dst.&lt;span class=\"hljs-built_in\"&gt;SetName&lt;/span&gt;(src.&lt;span class=\"hljs-built_in\"&gt;GetSomeField&lt;/span&gt;());\n            dst.&lt;span class=\"hljs-built_in\"&gt;SetCount&lt;/span&gt;(src.&lt;span class=\"hljs-built_in\"&gt;GetSomeCountField&lt;/span&gt;());\n            &lt;span class=\"hljs-keyword\"&gt;return&lt;/span&gt; &lt;span class=\"hljs-literal\"&gt;true&lt;/span&gt;;\n        },\n        [](&lt;span class=\"hljs-keyword\"&gt;auto&lt;/span&gt;&amp;amp; src, &lt;span class=\"hljs-keyword\"&gt;auto&lt;/span&gt;&amp;amp; dst) { &lt;span class=\"hljs-comment\"&gt;// combiner&lt;/span&gt;\n            &lt;span class=\"hljs-type\"&gt;double&lt;/span&gt; value = src.&lt;span class=\"hljs-built_in\"&gt;GetValue&lt;/span&gt;();\n            dst.&lt;span class=\"hljs-built_in\"&gt;SetCount&lt;/span&gt;(dst.&lt;span class=\"hljs-built_in\"&gt;GetCount&lt;/span&gt;() + &lt;span class=\"hljs-number\"&gt;1&lt;/span&gt;);\n            dst.&lt;span class=\"hljs-built_in\"&gt;SetSum&lt;/span&gt;(dst.&lt;span class=\"hljs-built_in\"&gt;GetSum&lt;/span&gt;() + value);\n            dst.&lt;span class=\"hljs-built_in\"&gt;SetSumSquared&lt;/span&gt;(dst.&lt;span class=\"hljs-built_in\"&gt;GetSumSquared&lt;/span&gt;() + value * value);\n        },\n        [](&lt;span class=\"hljs-keyword\"&gt;auto&lt;/span&gt;&amp;amp; src, &lt;span class=\"hljs-keyword\"&gt;auto&lt;/span&gt;&amp;amp; dst) { &lt;span class=\"hljs-comment\"&gt;// reducer&lt;/span&gt;\n            dst.&lt;span class=\"hljs-built_in\"&gt;SetCount&lt;/span&gt;(src.&lt;span class=\"hljs-built_in\"&gt;GetCount&lt;/span&gt;() + dst.&lt;span class=\"hljs-built_in\"&gt;GetCount&lt;/span&gt;());\n            dst.&lt;span class=\"hljs-built_in\"&gt;SetSum&lt;/span&gt;(src.&lt;span class=\"hljs-built_in\"&gt;GetSum&lt;/span&gt;() + dst.&lt;span class=\"hljs-built_in\"&gt;GetSum&lt;/span&gt;());\n            dst.&lt;span class=\"hljs-built_in\"&gt;SetSumSquared&lt;/span&gt;(src.&lt;span class=\"hljs-built_in\"&gt;GetSumSquared&lt;/span&gt;() + dst.&lt;span class=\"hljs-built_in\"&gt;GetSumSquared&lt;/span&gt;());\n        },\n        [](&lt;span class=\"hljs-keyword\"&gt;auto&lt;/span&gt;&amp;amp; src, &lt;span class=\"hljs-keyword\"&gt;auto&lt;/span&gt;&amp;amp; dst) { &lt;span class=\"hljs-comment\"&gt;// finalizer&lt;/span&gt;\n            &lt;span class=\"hljs-type\"&gt;double&lt;/span&gt; mean = src.&lt;span class=\"hljs-built_in\"&gt;GetSum&lt;/span&gt;() / src.&lt;span class=\"hljs-built_in\"&gt;GetCount&lt;/span&gt;();\n            &lt;span class=\"hljs-type\"&gt;double&lt;/span&gt; dispersion = src.&lt;span class=\"hljs-built_in\"&gt;GetSumSquared&lt;/span&gt;() / src.&lt;span class=\"hljs-built_in\"&gt;GetCount&lt;/span&gt;() - mean * mean;\n            dst.&lt;span class=\"hljs-built_in\"&gt;SetMean&lt;/span&gt;(mean);\n            dst.&lt;span class=\"hljs-built_in\"&gt;SetSigma&lt;/span&gt;(std::&lt;span class=\"hljs-built_in\"&gt;sqrt&lt;/span&gt;(dispersion));\n        });\n}\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"688\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-688\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-688\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-688.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"choosing-between-mapreduce-and-mapreducecombined\"&gt;&lt;a href=\"en/api/cpp/lambda.html#choosing-between-mapreduce-and-mapreducecombined\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Choosing between MapReduce and MapReduceCombined&lt;/span&gt;&lt;/a&gt;Choosing between MapReduce and MapReduceCombined&lt;/h3&gt;\n&lt;p&gt;The &lt;code&gt;AdditiveMapReduce&lt;/code&gt; function, which also provides the combiner, leaves it up to YT to choose whether to use the combiner or not. The &lt;code&gt;MapReduceCombined&lt;/code&gt; function always forces the system to use the combiner even if omitting it would be more efficient. This is because writing lambdas in this function would be problematic, as this would allow inputting different types of records (from map and from combine) to the reducer.&lt;/p&gt;\n&lt;p&gt;In general, the observed effect is as follows: the &lt;code&gt;MapReduceCombined&lt;/code&gt; operations consume a few percent more CPU resources on the cluster than fully identical MapReduce operations, but are completed much faster. Since using &lt;a href=\"en/api/cpp/lambda.html#mapreduce_combined\"&gt;MapReduceCombined&lt;/a&gt; is as simple as using &lt;a href=\"en/api/cpp/lambda.html#mapreduce\"&gt;MapReduce&lt;/a&gt;, it may be worth trying both during the development stage and leave the one that best suits your needs.&lt;/p&gt;\n&lt;h2 id=\"combining-lambdas-with-the-regular-api\"&gt;&lt;a href=\"en/api/cpp/lambda.html#combining-lambdas-with-the-regular-api\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Combining lambdas with the regular API&lt;/span&gt;&lt;/a&gt;Combining lambdas with the regular API&lt;/h2&gt;\n&lt;p&gt;You may want to use a lambda when calling operations in a standard way via &lt;code&gt;IClientBase&lt;/code&gt; methods. For example, you wrote the mapper as a large class, and the reducer remained simple. Then it makes sense to use named wrapper classes (&lt;code&gt;TCopyIfMapper&lt;/code&gt;, &lt;code&gt;TTransformMapper&lt;/code&gt;, &lt;code&gt;TAdditiveReducer&lt;/code&gt;, etc.).&lt;/p&gt;\n&lt;h3 id=\"lambdas_mixed_example\"&gt;&lt;a href=\"en/api/cpp/lambda.html#lambdas_mixed_example\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Example&lt;/span&gt;&lt;/a&gt;Example&lt;/h3&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs c++\"&gt;&lt;span class=\"hljs-keyword\"&gt;auto&lt;/span&gt; createReducer = []() {\n    &lt;span class=\"hljs-keyword\"&gt;return&lt;/span&gt; &lt;span class=\"hljs-keyword\"&gt;new&lt;/span&gt; &lt;span class=\"hljs-built_in\"&gt;TAdditiveReducer&lt;/span&gt;&amp;lt;TOutStatsProto&amp;gt;([](&lt;span class=\"hljs-keyword\"&gt;auto&lt;/span&gt;&amp;amp; src, &lt;span class=\"hljs-keyword\"&gt;auto&lt;/span&gt;&amp;amp; dst) {\n        dst.&lt;span class=\"hljs-built_in\"&gt;SetCount&lt;/span&gt;(src.&lt;span class=\"hljs-built_in\"&gt;GetCount&lt;/span&gt;() + dst.&lt;span class=\"hljs-built_in\"&gt;GetCount&lt;/span&gt;());\n    });\n};\n\nclient-&amp;gt;&lt;span class=\"hljs-built_in\"&gt;MapReduce&lt;/span&gt;(\n    &lt;span class=\"hljs-built_in\"&gt;TMapReduceOperationSpec&lt;/span&gt;()\n        .&lt;span class=\"hljs-built_in\"&gt;AddInput&lt;/span&gt;&amp;lt;TInputProto&amp;gt;(inTable)\n        .&lt;span class=\"hljs-built_in\"&gt;AddOutput&lt;/span&gt;&amp;lt;TOutStatsProto&amp;gt;(outTable)\n        .&lt;span class=\"hljs-built_in\"&gt;ReduceBy&lt;/span&gt;(fields),\n    &lt;span class=\"hljs-keyword\"&gt;new&lt;/span&gt; &lt;span class=\"hljs-built_in\"&gt;TMyComplicatedMapper&lt;/span&gt;(),\n    &lt;span class=\"hljs-built_in\"&gt;createReducer&lt;/span&gt;(), &lt;span class=\"hljs-comment\"&gt;// combiner&lt;/span&gt;\n    &lt;span class=\"hljs-built_in\"&gt;createReducer&lt;/span&gt;(), &lt;span class=\"hljs-comment\"&gt;// reducer&lt;/span&gt;\n    &lt;span class=\"hljs-built_in\"&gt;TOperationOptions&lt;/span&gt;().&lt;span class=\"hljs-built_in\"&gt;Spec&lt;/span&gt;(&lt;span class=\"hljs-built_in\"&gt;TNode&lt;/span&gt;()(&lt;span class=\"hljs-string\"&gt;\"map_selectivity_factor\"&lt;/span&gt;, &lt;span class=\"hljs-number\"&gt;0.005&lt;/span&gt;)));\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"707\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-707\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-707\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-707.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"saveable\"&gt;&lt;a href=\"en/api/cpp/lambda.html#saveable\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;TSaveable — global variables accessible from lambda operations&lt;/span&gt;&lt;/a&gt;TSaveable — global variables accessible from lambda operations&lt;/h2&gt;\n&lt;p&gt;If you create a global variable of the &lt;code&gt;NYT::TSaveable&amp;lt;TYourStruct&amp;gt;&lt;/code&gt; type, where &lt;code&gt;TYourStruct&lt;/code&gt; has access to the &lt;code&gt;ysaveload&lt;/code&gt; variant serialization, then all the above functions described in the &lt;code&gt;yt_lambda&lt;/code&gt; library will save the variable in the job state at the beginning of their work and restore it on the cluster before executing the job.&lt;/p&gt;\n&lt;p&gt;Example:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs c++\"&gt;&lt;span class=\"hljs-keyword\"&gt;struct&lt;/span&gt; &lt;span class=\"hljs-title class_\"&gt;TGlobalSettings&lt;/span&gt; {\n    TString MailSuffix;\n    &lt;span class=\"hljs-built_in\"&gt;Y_SAVELOAD_DEFINE&lt;/span&gt;(MailSuffix);\n};\nNYT::TSaveable&amp;lt;TGlobalSettings&amp;gt; GlobalSettings;\n&lt;span class=\"hljs-function\"&gt;&lt;span class=\"hljs-type\"&gt;int&lt;/span&gt; &lt;span class=\"hljs-title\"&gt;main&lt;/span&gt;&lt;span class=\"hljs-params\"&gt;()&lt;/span&gt; &lt;/span&gt;{\n    GlobalSettings.MailSuffix = &lt;span class=\"hljs-string\"&gt;\"@domain-name\"&lt;/span&gt;;\n    ...\n    &lt;span class=\"hljs-comment\"&gt;/// use GlobalSettings.MailSuffix in lambda&lt;/span&gt;\n}\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"717\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-717\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-717\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-717.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Attention&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;ul&gt;\n&lt;li&gt;\n&lt;p&gt;Naturally, the contents of &lt;code&gt;TSaveable&lt;/code&gt; aren't saved In ordinary (non-lambda) operations. In the &lt;a href=\"en/api/cpp/lambda.html#lambdas_mixed_example\"&gt;example above&lt;/a&gt;, you can't use the &lt;code&gt;TSaveable&lt;/code&gt; variable from the &lt;code&gt;TMyComplicatedMapper&lt;/code&gt; class, but you can use it from the lambda created inside &lt;code&gt;createReducer()&lt;/code&gt;. If necessary, you can manually add calls to &lt;code&gt;TSaveablesRegistry::Get()-&amp;gt;SaveAll(stream)&lt;/code&gt; and &lt;code&gt;LoadAll(stream) &lt;/code&gt; in the &lt;code&gt;Save&lt;/code&gt; and &lt;code&gt;Load&lt;/code&gt; functions of your mapper or reducer.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;Don't use &lt;code&gt;TSaveable&lt;/code&gt; if modification of these global variables and start of operations can be initiated from different threads to avoid data races and crashes.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;You can create only one &lt;code&gt;TSaveable&lt;/code&gt; variable for each user-defined type. This is intended and won't be changed in the near future.&lt;/p&gt;\n&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/div&gt;&lt;/div&gt;","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"en/api/cpp/lambda.md","sourcePath":"en/api/cpp/lambda.md"},"headings":[{"title":"Using the yt_lambda library","href":"en/api/cpp/lambda.html#using-the-yt_lambda-library","level":2},{"title":"Operations overview","href":"en/api/cpp/lambda.html#operations-overview","level":2,"items":[{"title":"Additive operations","href":"en/api/cpp/lambda.html#additive-operations","level":3}]},{"title":"CopyIf","href":"en/api/cpp/lambda.html#copyif","level":2,"items":[{"title":"Application","href":"en/api/cpp/lambda.html#application","level":3}]},{"title":"TransformCopyIf, or Map","href":"en/api/cpp/lambda.html#transformcopyif,-or-map","level":2,"items":[{"title":"Application","href":"en/api/cpp/lambda.html#application1","level":3}]},{"title":"AdditiveReduce","href":"en/api/cpp/lambda.html#additivereduce","level":2},{"title":"Reduce","href":"en/api/cpp/lambda.html#reduce","level":2},{"title":"AdditiveMapReduce[Sorted]","href":"en/api/cpp/lambda.html#additive_mapreduce","level":2,"items":[{"title":"Application","href":"en/api/cpp/lambda.html#application2","level":3}]},{"title":"MapReduce[Sorted]","href":"en/api/cpp/lambda.html#mapreduce","level":2,"items":[{"title":"Application","href":"en/api/cpp/lambda.html#mapreduce_example","level":3}]},{"title":"MapReduceCombined[Sorted]","href":"en/api/cpp/lambda.html#mapreduce_combined","level":2,"items":[{"title":"Application","href":"en/api/cpp/lambda.html#application3","level":3},{"title":"Choosing between MapReduce and MapReduceCombined","href":"en/api/cpp/lambda.html#choosing-between-mapreduce-and-mapreducecombined","level":3}]},{"title":"Combining lambdas with the regular API","href":"en/api/cpp/lambda.html#combining-lambdas-with-the-regular-api","level":2,"items":[{"title":"Example","href":"en/api/cpp/lambda.html#lambdas_mixed_example","level":3}]},{"title":"TSaveable — global variables accessible from lambda operations","href":"en/api/cpp/lambda.html#saveable","level":2}],"title":"Lambda expressions"},"router":{"pathname":"en/api/cpp/lambda","depth":4,"base":"../../../"},"lang":"en","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/en/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-a29ea7877730322f2ce693378d06d02ac2b374cd-en","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
