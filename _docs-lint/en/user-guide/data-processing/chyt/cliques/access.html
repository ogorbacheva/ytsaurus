        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;This article describes the clique access rules and how to request them.&lt;/p&gt;\n&lt;h2 id=\"authentication\"&gt;&lt;a href=\"en/user-guide/data-processing/chyt/cliques/access.html#authentication\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Authentication&lt;/span&gt;&lt;/a&gt;Authentication&lt;/h2&gt;\n&lt;p&gt;Users are authenticated in CHYT in the same way as in YTsaurus — using a token from YTsaurus (for more information, see &lt;a href=\"en/user-guide/storage/auth.html\"&gt;Authentication&lt;/a&gt;).&lt;/p&gt;\n&lt;h2 id=\"access_types\"&gt;&lt;a href=\"en/user-guide/data-processing/chyt/cliques/access.html#access_types\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Access types&lt;/span&gt;&lt;/a&gt;Access types&lt;/h2&gt;\n&lt;p&gt;Upon receiving a query, CHYT checks for two types of permissions:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;strong&gt;Permissions to access clique resources&lt;/strong&gt; &lt;br /&gt;&lt;br /&gt;\nWhen receiving a query, the clique checks whether the user that made the query has the permission to use the clique.&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;To execute SQL queries, you need the &lt;code&gt;use&lt;/code&gt; permission.&lt;/li&gt;\n&lt;li&gt;To modify, view, and delete a clique configuration, you need the &lt;code&gt;manage&lt;/code&gt;, &lt;code&gt;read&lt;/code&gt;, and &lt;code&gt;remove&lt;/code&gt; permissions.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Clique permissions are stored in a dedicated system node called Access Control Object. It's located at the path &lt;code&gt;//sys/access_control_object_namespaces/chyt/&amp;lt;alias&amp;gt;/principal&lt;/code&gt; and is generated automatically for each clique created with the &lt;a href=\"en/user-guide/data-processing/chyt/cliques/controller.html\"&gt;CHYT Controller&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;Clique permissions only control access to the computational resources of the cliques themselves.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;strong&gt;Data access permissions&lt;/strong&gt; &lt;br /&gt;&lt;br /&gt;\nWhen accessing any data in YTsaurus, the user's read/write access to all referenced tables is verified according to the standard ACL mechanism implemented in YTsaurus. This verification ensures secure data access.&lt;/p&gt;\n&lt;/li&gt;\n&lt;/ol&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"en/user-guide/data-processing/chyt/cliques/access.md","sourcePath":"en/user-guide/data-processing/chyt/cliques/access.md"},"headings":[{"title":"Authentication","href":"en/user-guide/data-processing/chyt/cliques/access.html#authentication","level":2},{"title":"Access types","href":"en/user-guide/data-processing/chyt/cliques/access.html#access_types","level":2}],"title":"Access permissions"},"router":{"pathname":"en/user-guide/data-processing/chyt/cliques/access","depth":6,"base":"../../../../../"},"lang":"en","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/en/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-a29ea7877730322f2ce693378d06d02ac2b374cd-en","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
