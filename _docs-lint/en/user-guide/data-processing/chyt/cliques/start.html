        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;A &lt;em&gt;private clique&lt;/em&gt; is a clique that can be accessed only by certain users or units.&lt;/p&gt;\n&lt;h2 id=\"conditions\"&gt;&lt;a href=\"en/user-guide/data-processing/chyt/cliques/start.html#conditions\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Start conditions&lt;/span&gt;&lt;/a&gt;Start conditions&lt;/h2&gt;\n&lt;p&gt;To start a private clique, you need a dedicated compute pool with CPU guarantees (&lt;code&gt;strong_guarantee_resources&lt;/code&gt;). If there is not any, you need to:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Ask your cluster administrator to check for a &lt;a href=\"user-guide/data-processing/scheduler/scheduler-and-pools.html\"&gt;compute pool&lt;/a&gt; with available resources.&lt;/li&gt;\n&lt;li&gt;Order new resources for the future.&lt;/li&gt;\n&lt;li&gt;Start a clique without guarantees (not recommended).&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"how-start\"&gt;&lt;a href=\"en/user-guide/data-processing/chyt/cliques/start.html#how-start\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;How to start&lt;/span&gt;&lt;/a&gt;How to start&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;\n&lt;p&gt;Install the &lt;a href=\"user-guide/data-processing/chyt/cli-and-api.html\"&gt;CHYT CLI&lt;/a&gt; by installing the &lt;code&gt;ytsaurus-client&lt;/code&gt; package.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;Start the clique. Below is an example of a clique of five instances with default settings (16 cores per instance) in the &lt;code&gt;chyt&lt;/code&gt; pool called &lt;code&gt;chyt_example_clique&lt;/code&gt;.&lt;/p&gt;\n&lt;/li&gt;\n&lt;/ol&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;CPU quota request&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;To create a clique with &lt;code&gt;N&lt;/code&gt; instances on the &lt;code&gt;&amp;lt;cluster_name&amp;gt;&lt;/code&gt; cluster, you need to:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;&amp;lt;cluster_name&amp;gt; &amp;lt;pool_tree_name&amp;gt; &amp;lt;running_operations&amp;gt; &lt;/code&gt;: &lt;code&gt;1&lt;/code&gt; (a clique is a single YTsaurus operation that is always running).&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;&amp;lt;cluster_name&amp;gt; &amp;lt;pool_tree_name&amp;gt; &amp;lt;total_operations&amp;gt;&lt;/code&gt;: &lt;code&gt;1&lt;/code&gt; (must be greater than or equal to the limit on the number of running operations).&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;&amp;lt;cluster_name&amp;gt; &amp;lt;pool_tree_name&amp;gt; &amp;lt;CPU strong guarantee&amp;gt;&lt;/code&gt;: &lt;code&gt;N * 16&lt;/code&gt; (there are 16 CPU cores per instance by default).&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;To avoid mentioning the YTsaurus cluster name in each command (in the &lt;code&gt;--proxy&lt;/code&gt; argument), as the first step, set the default value by the environment variable:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;&lt;span class=\"hljs-built_in\"&gt;export&lt;/span&gt; YT_PROXY=&amp;lt;cluster_name&amp;gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"71\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-71\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-71\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-71.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Next, create a clique, using the command from the &lt;a href=\"user-guide/data-processing/chyt/cliques/controller.html\"&gt;CHYT Controller CLI&lt;/a&gt;:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;yt clickhouse ctl create chyt_example_clique\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"75\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-75\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-75\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-75.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Once you've created the clique, configure it with the relevant options: Every clique has a mandatory &lt;code&gt;pool&lt;/code&gt; option with the name of the compute pool where the operation on instances will be started for the clique. Because the operations for the clique are started by the &lt;code&gt;robot-strawberry-controller&lt;/code&gt; system robot, first you need to grant the &lt;code&gt;Use&lt;/code&gt; permission for the specified pool to this robot.&lt;/p&gt;\n&lt;p&gt;When setting the &lt;code&gt;pool&lt;/code&gt; option, make sure that you have the &lt;code&gt;Use&lt;/code&gt; right for the specified pool (otherwise, the command will fail):&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;yt clickhouse ctl set-option pool chyt_example_pool --&lt;span class=\"hljs-built_in\"&gt;alias&lt;/span&gt; chyt_example_clique\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"82\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-82\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-82\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-82.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;To set the instance count, use &lt;code&gt;instance_count&lt;/code&gt;:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;yt clickhouse ctl set-option instance_count 2 --&lt;span class=\"hljs-built_in\"&gt;alias&lt;/span&gt; chyt_example_clique\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"86\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-86\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-86\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-86.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;The clique is now configured, and all its settings are saved in Cypress. The only thing left to do is to start the configured clique:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;yt clickhouse ctl start chyt_example_clique\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"90\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-90\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-90\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-90.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;To view the clique status, use the &lt;code&gt;status&lt;/code&gt; command. Once the clique's operation is started, the value of the &lt;code&gt;status&lt;/code&gt; field should change to &lt;code&gt;Ok&lt;/code&gt;, and &lt;code&gt;operation_state&lt;/code&gt; should change to &lt;code&gt;running&lt;/code&gt;:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;$ yt clickhouse ctl status chyt_example_clique\n{\n    &lt;span class=\"hljs-string\"&gt;\"status\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"Waiting for restart: oplet does not have running yt operation\"&lt;/span&gt;;\n}\n&lt;span class=\"hljs-comment\"&gt;# a few moments later&lt;/span&gt;\n$ yt clickhouse ctl status chyt_example_clique\n{\n    &lt;span class=\"hljs-string\"&gt;\"status\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"Ok\"&lt;/span&gt;;\n    &lt;span class=\"hljs-string\"&gt;\"operation_state\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"running\"&lt;/span&gt;;\n    &lt;span class=\"hljs-string\"&gt;\"operation_url\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"https://domain.com/&amp;lt;cluster_name&amp;gt;/operations/48bdec5d-ed641014-3fe03e8-4289d62e\"&lt;/span&gt;;\n}\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"94\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-94\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-94\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-94.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;After starting the operation, you need to wait for the clique instances to start up and start accepting incoming queries. To make sure that the clique works, make a test query to the table &lt;code&gt;//sys/clickhouse/sample_table&lt;/code&gt;. This table is available on all clusters with CHYT:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;$ yt clickhouse execute --proxy &amp;lt;cluster_name&amp;gt; --&lt;span class=\"hljs-built_in\"&gt;alias&lt;/span&gt; chyt_example_clique &lt;span class=\"hljs-string\"&gt;'select avg(a) from `//sys/clickhouse/sample_table`'&lt;/span&gt;\n224.30769230769232\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"98\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-98\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-98\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-98.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;If the clique is unavailable for more than 10 minutes, try to identify the problem by following the &lt;code&gt;operation_url&lt;/code&gt; from the &lt;code&gt;status&lt;/code&gt; command in the operation's web interface. If you don't manage to work it out on your own, write to the &lt;a href=\"https://t.me/ytsaurus_ru\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;YTsaurus chat&lt;/a&gt;.&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"en/user-guide/data-processing/chyt/cliques/start.md","sourcePath":"en/user-guide/data-processing/chyt/cliques/start.md"},"headings":[{"title":"Start conditions","href":"en/user-guide/data-processing/chyt/cliques/start.html#conditions","level":2},{"title":"How to start","href":"en/user-guide/data-processing/chyt/cliques/start.html#how-start","level":2}],"title":"How to start a private clique"},"router":{"pathname":"en/user-guide/data-processing/chyt/cliques/start","depth":6,"base":"../../../../../"},"lang":"en","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/en/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-a29ea7877730322f2ce693378d06d02ac2b374cd-en","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
        </script>
