        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;Cliques don't have their own web interface, but you can view all clique-related objects using the YTsaurus web interface.&lt;/p&gt;\n&lt;h2 id=\"strawberry-node\"&gt;&lt;a href=\"en/user-guide/data-processing/chyt/cliques/ui.html#strawberry-node\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Strawberry Node&lt;/span&gt;&lt;/a&gt;Strawberry Node&lt;/h2&gt;\n&lt;p&gt;The clique's configuration and persistent state are stored in Cypress at &lt;code&gt;//sys/strawberry/chyt/&amp;lt;alias&amp;gt;&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;The node description provides housekeeping information: whether the clique is running, in what pool, what the status of the corresponding YTsaurus operation is, and so on. This node also contains a YSON document called speclet, which stores all the clique settings set with the &lt;code&gt;yt clickhouse ctl set-option&lt;/code&gt; command.&lt;/p&gt;\n&lt;p&gt;In addition, you can retrieve information from the strawberry node using the &lt;code&gt;yt clickhouse ctl get-speclet&lt;/code&gt; and &lt;code&gt;yt clickhouse ctl status&lt;/code&gt; commands in our CLI.&lt;/p&gt;\n\n&lt;h2 id=\"access-control-object-node\"&gt;&lt;a href=\"en/user-guide/data-processing/chyt/cliques/ui.html#access-control-object-node\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Access Control Object Node&lt;/span&gt;&lt;/a&gt;Access Control Object Node&lt;/h2&gt;\n&lt;p&gt;The clique's ACL is stored in a specialized access control object node located at &lt;code&gt;//sys/access_control_object_namespaces/chyt/&amp;lt;alias&amp;gt;&lt;/code&gt;. In this node, you can view all the accesses granted for the clique.&lt;/p&gt;\n\n&lt;h2 id=\"yt-operation\"&gt;&lt;a href=\"en/user-guide/data-processing/chyt/cliques/ui.html#yt-operation\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;YT Operation&lt;/span&gt;&lt;/a&gt;YT Operation&lt;/h2&gt;\n&lt;p&gt;To access the web interface of the YTsaurus system operation used to start the clique instances, follow the link from the strawberry node description or the link from the &lt;code&gt;yt clickhouse ctl status&lt;/code&gt; command output.&lt;/p&gt;\n&lt;p&gt;There is a lot of useful information on the operation page to help with the operation of CHYT.&lt;/p&gt;\n&lt;h3 id=\"description\"&gt;&lt;a href=\"en/user-guide/data-processing/chyt/cliques/ui.html#description\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Description&lt;/span&gt;&lt;/a&gt;Description&lt;/h3&gt;\n&lt;p&gt;The &lt;strong&gt;Description&lt;/strong&gt; section contains various system information about the clique and a number of links.&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;ytserver-log-tailer&lt;/code&gt;, &lt;code&gt;ytserver-clickhouse&lt;/code&gt;, &lt;code&gt;clickhouse-trampoline&lt;/code&gt; — these sections describe versions of various components of the CHYT server code.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h3 id=\"specification\"&gt;&lt;a href=\"en/user-guide/data-processing/chyt/cliques/ui.html#specification\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Specification&lt;/span&gt;&lt;/a&gt;Specification&lt;/h3&gt;\n&lt;p&gt;The &lt;strong&gt;Specification&lt;/strong&gt; section contains information about how exactly the clique was started.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"images/chyt_operation_specification.png\" alt=\"\" class=\"center\" /&gt;&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;strong&gt;Wrapper version&lt;/strong&gt;: Contains the version of the launcher that started the clique.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Command&lt;/strong&gt;: Contains the clique start string.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;The last two values are very useful if you need, for example, to restart a more recent version of the clique. You can either address the user who started it or reproduce the start command yourself.&lt;/p&gt;\n&lt;h3 id=\"jobs\"&gt;&lt;a href=\"en/user-guide/data-processing/chyt/cliques/ui.html#jobs\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Jobs&lt;/span&gt;&lt;/a&gt;Jobs&lt;/h3&gt;\n&lt;p&gt;The &lt;strong&gt;Jobs&lt;/strong&gt; section contains information about the jobs of the operation in which the clique was started. Remember that one job corresponds to one instance in a clique, that is, one ClickHouse server.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"images/chyt_operation_jobs.png\" alt=\"\" class=\"center\" /&gt;&lt;/p&gt;\n&lt;p&gt;In this section, in terms of CHYT instances:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;total&lt;/code&gt;: The total number of instances in a clique.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;pending&lt;/code&gt;: The number of instances out of the total number that have not yet been started. A non-zero number in this section means that the clique does not have enough resources to keep all instances running at once — a bad situation for the clique.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;running&lt;/code&gt;: The number of running instances out of the total number, i.e. &lt;code&gt;running + pending = total&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;completed&lt;/code&gt;: The number of &lt;em&gt;gracefully preempted&lt;/em&gt; instances. This includes those instances that were subject to preemption and were able to complete all the queries running on them before they were forcibly aborted.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;failed&lt;/code&gt;: The number of failed instances. Instances can fail for various reasons and the most common are: OOM (out of memory) or bugs in the CHYT or ClickHouse code.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;aborted&lt;/code&gt;: The number of aborted instances. Some aborts happen due to insurmountable circumstances (for example, a node failed) and nothing can be done with them. If there are jobs aborted due to &lt;code&gt;preemption&lt;/code&gt;, this is a bad sign that indicates a lack of resources.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;lost&lt;/code&gt;: Jobs must not occur in the clique.&lt;/li&gt;\n&lt;/ul&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"en/user-guide/data-processing/chyt/cliques/ui.md","sourcePath":"en/user-guide/data-processing/chyt/cliques/ui.md"},"headings":[{"title":"Strawberry Node","href":"en/user-guide/data-processing/chyt/cliques/ui.html#strawberry-node","level":2},{"title":"Access Control Object Node","href":"en/user-guide/data-processing/chyt/cliques/ui.html#access-control-object-node","level":2},{"title":"YT Operation","href":"en/user-guide/data-processing/chyt/cliques/ui.html#yt-operation","level":2,"items":[{"title":"Description","href":"en/user-guide/data-processing/chyt/cliques/ui.html#description","level":3},{"title":"Specification","href":"en/user-guide/data-processing/chyt/cliques/ui.html#specification","level":3},{"title":"Jobs","href":"en/user-guide/data-processing/chyt/cliques/ui.html#jobs","level":3}]}],"title":"A clique in the YTsaurus web interface"},"router":{"pathname":"en/user-guide/data-processing/chyt/cliques/ui","depth":6,"base":"../../../../../"},"lang":"en","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/en/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-a29ea7877730322f2ce693378d06d02ac2b374cd-en","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
