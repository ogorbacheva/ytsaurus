        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;You can use this command to execute a random query in the clique. Also see the &lt;a href=\"user-guide/data-processing/chyt/try-chyt.html\"&gt;How to try&lt;/a&gt; article which lists alternative ways to query a CHYT clique.&lt;/p&gt;\n&lt;h2 id=\"cli\"&gt;&lt;a href=\"en/user-guide/data-processing/chyt/reference/execute.html#cli\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;CLI&lt;/span&gt;&lt;/a&gt;CLI&lt;/h2&gt;\n&lt;p&gt;The &lt;code&gt;yt clickhouse execute&lt;/code&gt; command has the following parameters (default values are specified in parentheses):&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;query&lt;/code&gt;: The query.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;--proxy&lt;/code&gt;: The cluster on which the clique will be started, for example. This option can also be specified via the &lt;code&gt;YT_PROXY&lt;/code&gt; environment variable (for example, &lt;code&gt;export YT_PROXY=&amp;lt;cluster_name&amp;gt;&lt;/code&gt;).&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;--alias&lt;/code&gt;: The alias under which the clique will be available. This option can also be set via the &lt;code&gt;CHYT_ALIAS&lt;/code&gt; environment variable (&lt;code&gt;export CHYT_ALIAS=example&lt;/code&gt;).&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;--format&lt;/code&gt; [TabSeparated]: The &lt;a href=\"https://clickhouse.tech/docs/en/interfaces/formats/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;ClickHouse format&lt;/a&gt; in which to output the result.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;--setting&lt;/code&gt;: Enables you to pass a random setting to the query in &lt;code&gt;&amp;lt;key&amp;gt;=&amp;lt;value&amp;gt;&lt;/code&gt; format, can be specified several times.&lt;/p&gt;\n&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"python\"&gt;&lt;a href=\"en/user-guide/data-processing/chyt/reference/execute.html#python\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Python API  &lt;/span&gt;&lt;/a&gt;Python API  &lt;/h2&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Attention&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;To use this function , be &lt;strong&gt;sure to&lt;/strong&gt; configure logging at the &lt;strong&gt;Debug&lt;/strong&gt; level. It is impossible to answer any question about query execution (including \"why does it run so long\", \"why did it fail\", \"why did it output such responses\") without debug logs.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;The following method (some of the parameters are intentionally not mentioned because they are not intended to be used in a usual situation) is available in the &lt;code&gt;yt.clickhouse&lt;/code&gt; module:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs python\"&gt;&lt;span class=\"hljs-keyword\"&gt;def&lt;/span&gt; &lt;span class=\"hljs-title function_\"&gt;execute&lt;/span&gt;(&lt;span class=\"hljs-params\"&gt;\n    query,\n    alias=&lt;span class=\"hljs-literal\"&gt;None&lt;/span&gt;,\n    &lt;span class=\"hljs-built_in\"&gt;format&lt;/span&gt;=&lt;span class=\"hljs-literal\"&gt;None&lt;/span&gt;,\n    settings=&lt;span class=\"hljs-literal\"&gt;None&lt;/span&gt;,\n    raw=&lt;span class=\"hljs-literal\"&gt;None&lt;/span&gt;,\n    client=&lt;span class=\"hljs-literal\"&gt;None&lt;/span&gt;&lt;/span&gt;):\n    &lt;span class=\"hljs-keyword\"&gt;pass&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"52\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-52\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-52\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-52.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Some of the parameters overlap with the command line options. The same is true for them as in the previous section. The function returns a string generator from the result and the strings can be python objects (lists, dictionaries, numbers, and strings) and strings in ordered format.&lt;/p&gt;\n&lt;p&gt;Let's describe the individual parameters and the differences from starting via the CLI:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;format&lt;/code&gt; (None) and &lt;code&gt;raw&lt;/code&gt; (False): These options control the type of returned values. If &lt;code&gt;raw = False&lt;/code&gt;, the function will turn values into python objects similarly to how the YTsaurus Python API read_table method does it. If &lt;code&gt;raw = True&lt;/code&gt;, you have to additionally specify the ClickHouse format. Then the returned value will be a string iterator (str) in ordered format.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;settings&lt;/code&gt; ({}): A dict with additional ClickHouse &lt;a href=\"https://clickhouse.tech/docs/ru/operations/settings/settings/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;settings&lt;/a&gt; for the query.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;client&lt;/code&gt;: A client from the YTsaurus cluster in which the query to the clique should be run. The global client is taken by default. You can, for example, pass &lt;code&gt;yt.wrapper.YtClient(\"&amp;lt;cluster_name&amp;gt;\")&lt;/code&gt; as the client and thus specify the desired cluster. Learn more in the relevant section of the Python API documentation.&lt;/p&gt;\n&lt;/li&gt;\n&lt;/ul&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"en/user-guide/data-processing/chyt/reference/execute.md","sourcePath":"en/user-guide/data-processing/chyt/reference/execute.md"},"headings":[{"title":"CLI","href":"en/user-guide/data-processing/chyt/reference/execute.html#cli","level":2},{"title":"Python API  ","href":"en/user-guide/data-processing/chyt/reference/execute.html#python","level":2}],"title":"Executing queries"},"router":{"pathname":"en/user-guide/data-processing/chyt/reference/execute","depth":6,"base":"../../../../../"},"lang":"en","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/en/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-a29ea7877730322f2ce693378d06d02ac2b374cd-en","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
