        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;When choosing between CH and CHYT, the question arises — which is faster and by how much?&lt;/p&gt;\n&lt;p&gt;We cannot give a general answer to this question, since the query execution speed depends on many factors, including the query itself, the number of resources, and the data storage schema.&lt;/p&gt;\n&lt;p&gt;The data in YTsaurus is not originally designed to execute OLAP queries. To get normal speed, you need to prepare them.&lt;br /&gt;\nYou are unlikely to achieve the speed of CH, but you can get closer, choosing the proper schema for storing data and queries to it.&lt;br /&gt;\nBut if you store data improperly, you can easily achieve query speeds hundreds of times lower than in CH.&lt;/p&gt;\n&lt;h2 id=\"where_my_time\"&gt;&lt;a href=\"en/user-guide/data-processing/chyt/reference/performance.html#where_my_time\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Where the time goes&lt;/span&gt;&lt;/a&gt;Where the time goes&lt;/h2&gt;\n&lt;p&gt;Below are the query execution stages that can be a bottleneck.&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;Reading table and chunk metainformation, distributing a query to instances.&lt;/li&gt;\n&lt;li&gt;Reading data from the disk.&lt;/li&gt;\n&lt;li&gt;Transmitting data over the network.&lt;/li&gt;\n&lt;li&gt;Data uncompressing and decoding.&lt;/li&gt;\n&lt;li&gt;Version merging (for &lt;a href=\"user-guide/dynamic-tables/overview.html\"&gt;dynamic&lt;/a&gt; tables only).&lt;/li&gt;\n&lt;li&gt;Converting data from YTsaurus format into CH format.&lt;/li&gt;\n&lt;li&gt;Data processing by the ClickHouse engine.&lt;/li&gt;\n&lt;li&gt;Converting data from CH format into YTsaurus format (for write operations only).&lt;/li&gt;\n&lt;li&gt;Writing data in YTsaurus (for write operations only).&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;Depending on how the data is stored and what queries are processed, different stages can be a bottleneck.&lt;/p&gt;\n&lt;h2 id=\"read\"&gt;&lt;a href=\"en/user-guide/data-processing/chyt/reference/performance.html#read\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Reading data&lt;/span&gt;&lt;/a&gt;Reading data&lt;/h2&gt;\n&lt;p&gt;Below are the factors that affect the read query speed.&lt;/p&gt;\n&lt;h3 id=\"data_weight\"&gt;&lt;a href=\"en/user-guide/data-processing/chyt/reference/performance.html#data_weight\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Processed data size&lt;/span&gt;&lt;/a&gt;Processed data size&lt;/h3&gt;\n&lt;p&gt;CHYT is primarily designed for fast (a few seconds) processing of small (about 1 GB) and medium (about tens of GB) data. You cannot use CHYT effectively to process TB of data. You can reduce the amount of processed data with a right data storage &lt;a href=\"user-guide/storage/static-schema.html\"&gt;schema&lt;/a&gt; (using column orientation and sorting).&lt;/p&gt;\n&lt;p&gt;To build dashboards on top of a large amount of data, we recommend making separate tables with the necessary data and pre-aggregated values. For example, if the data is specified in milliseconds and you need to build analytics by days, you need to pre-aggregate the data to a day.&lt;/p&gt;\n&lt;p&gt;How to reduce the amount of computations on the fly:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;For example, you can compute the date by the &lt;code&gt;datetime&lt;/code&gt; field, but filtering by this field will be slower.&lt;/li&gt;\n&lt;li&gt;Avoiding unreasonably heavy queries. For example, sorting 100 GB, &lt;code&gt;SELECT DISTINCT&lt;/code&gt; or &lt;code&gt;GROUP BY&lt;/code&gt; by the column that has millions of different values, or using the &lt;code&gt;JOIN&lt;/code&gt; operator for large tables. Such queries will always be processed slowly.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Reading large tables can bump into any of the query execution points from the list above.&lt;/p&gt;\n&lt;h3 id=\"erasure\"&gt;&lt;a href=\"en/user-guide/data-processing/chyt/reference/performance.html#erasure\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Erasure coding&lt;/span&gt;&lt;/a&gt;Erasure coding&lt;/h3&gt;\n&lt;p&gt;Erasure coding is intended for \"cold\" tables. In erasure coding, data takes up less disk space, but this has a negative impact on the read speed of such data:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;Each chunk is divided into 16 (or 9 depending on the coding algorithm) parts, which increases the amount of metainformation (point 1).&lt;/li&gt;\n&lt;li&gt;Data is stored as a single copy, so parallel reading isn't possible (point 2).&lt;/li&gt;\n&lt;li&gt;If the disk on the node is loaded, you cannot switch to read data from another node. And since the chunk is divided into 16 parts, the probability that reading at least one of them will freeze greatly increases.&lt;/li&gt;\n&lt;li&gt;If data is unavailable due to a cluster node failure, it must be restored. This is a rather long and resource-consuming process. (points 2, 4?).&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;As a result, it takes much longer to read erasure-coded data and reading latency becomes more likely and less predictable. &lt;strong&gt;We strongly do not recommend&lt;/strong&gt; building dashboards or making other regular queries on top of erasure-coded data.&lt;/p&gt;\n&lt;h3 id=\"optimize_for\"&gt;&lt;a href=\"en/user-guide/data-processing/chyt/reference/performance.html#optimize_for\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Data storage format&lt;/span&gt;&lt;/a&gt;Data storage format&lt;/h3&gt;\n&lt;p&gt;Data in YTsaurus tables can be stored both in row-based (&lt;code&gt;optimize_for=lookup&lt;/code&gt;) and columnar (&lt;code&gt;optimize_for=scan&lt;/code&gt;) formats.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Attention&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;ClickHouse is a column-oriented DBMS, so we highly recommend using columnar storage.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Columnar data storage has the following advantages:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Converting data into CH format from the YTsaurus columnar format is many times (if not dozens of times) more efficient than from row-based format (point 6).&lt;/li&gt;\n&lt;li&gt;When columnar storage, only the requested columns will be read during the query. (points 2, 3, and 4).&lt;/li&gt;\n&lt;li&gt;Columnar stored data is better compressed, so it takes up less space (points 2, 3).&lt;/li&gt;\n&lt;/ul&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Note&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;The ordinary change of the &lt;code&gt;optimize_for/erasure_codec&lt;/code&gt; attributes does not convert old data into the new format. To change the format, run the &lt;code&gt;merge&lt;/code&gt; operation with the &lt;code&gt;force_transform=%true&lt;/code&gt; option.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"key_columns\"&gt;&lt;a href=\"en/user-guide/data-processing/chyt/reference/performance.html#key_columns\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Key columns&lt;/span&gt;&lt;/a&gt;Key columns&lt;/h3&gt;\n&lt;p&gt;ClickHouse has indexes and sharding keys for efficient reading. In YTsaurus, the data storage model is a bit different, there are no usual indexes, but there are sorted tables. Queries on top of sorted tables use the sort key as a primary index (primary key) and the sharding key.&lt;/p&gt;\n&lt;p&gt;This enables you to:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Effectively filter and not read unnecessary data from the disk (point 2).&lt;/li&gt;\n&lt;li&gt;Make a query, in particular &lt;code&gt;Sorted Join&lt;/code&gt;, more effectively.&lt;/li&gt;\n&lt;li&gt;Better compress sorted tables so that they take up less space (point 2).&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Select the sort key based on your queries:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;For example, if the queries look like&lt;br /&gt;\n&lt;code&gt; ... where date between '2021-01-01' and '2021-02-01'&lt;/code&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;A good key will be &lt;code&gt;date&lt;/code&gt;.&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;For queries of type&lt;br /&gt;\n&lt;code&gt; ... where user_id = 1234&lt;/code&gt;&lt;br /&gt;\nA good key will be &lt;code&gt;user_id&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;In some cases, if you sort the table, there will be no effective filtering. The column is string and the &lt;code&gt;DateTime&lt;/code&gt; &amp;lt;-&amp;gt; &lt;code&gt;String&lt;/code&gt; transformation is not monotonic and unambiguous. The &lt;code&gt;Int&lt;/code&gt; &amp;lt;-&amp;gt; &lt;code&gt;DateTime&lt;/code&gt; transformation is monotonic, but such optimization cannot be generally applied with string representation. For example, &lt;code&gt;2020-01-01 00:00:00&lt;/code&gt; and &lt;code&gt;2020-01-01T00:00:00&lt;/code&gt; are the correct representation of the same time moment in ClickHouse, but when sorting with string representation, the &lt;code&gt;2020-01-01 00:00:01&lt;/code&gt; value may appear between them, so the &lt;code&gt;String&lt;/code&gt; -&amp;gt; &lt;code&gt;DateTime&lt;/code&gt; transformation is not monotonic and you cannot use this optimization.&lt;/p&gt;\n&lt;h3 id=\"chunk_count\"&gt;&lt;a href=\"en/user-guide/data-processing/chyt/reference/performance.html#chunk_count\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Number of chunks&lt;/span&gt;&lt;/a&gt;Number of chunks&lt;/h3&gt;\n&lt;p&gt;The number of chunks affects several query execution stages.&lt;/p&gt;\n&lt;p&gt;The more chunks a table has, the more metainformation must be read at step 1. If a table has thousands of chunks, it may take several seconds to read metainformation. If there are many chunks in a very small table, reading each chunk becomes a random read and can be slow (step 2).&lt;br /&gt;\nOn the other hand, if there are too few chunks (for example, 1 chunk per 10 GB), all data is stored on the same disks, which will limit the concurrency of reads at step 2.&lt;/p&gt;\n&lt;p&gt;Use the &lt;code&gt;Merge&lt;/code&gt; operation to enlarge the chunks.&lt;/p&gt;\n&lt;h3 id=\"table_count\"&gt;&lt;a href=\"en/user-guide/data-processing/chyt/reference/performance.html#table_count\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Number of input tables&lt;/span&gt;&lt;/a&gt;Number of input tables&lt;/h3&gt;\n&lt;p&gt;Similar to the number of chunks, but metainformation for a table is much heavier than metainformation for a chunk. Besides that, access permissions must be checked for each table separately. We recommend making no more than hundreds of tables. You better combine many tables into a single large one.&lt;/p&gt;\n&lt;h3 id=\"column_count\"&gt;&lt;a href=\"en/user-guide/data-processing/chyt/reference/performance.html#column_count\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Number of columns&lt;/span&gt;&lt;/a&gt;Number of columns&lt;/h3&gt;\n&lt;p&gt;The number of columns in the table also affects the speed of data even if it is stored in the columnar format. The block size is selected so that the reader can read a block for each column and output the result. If you want the data to fit into memory in this case, the block size must decrease as the number of columns increases. When blocks are very small, reading becomes a random read (step 2). We recommend having dozens or a maximum of 100 columns. Thousands of columns are guaranteed to perform poorly.&lt;br /&gt;\nBesides that, the large number of columns increases the amount of metainformation at step 1.&lt;/p&gt;\n&lt;h3 id=\"dyn-vs-stat\"&gt;&lt;a href=\"en/user-guide/data-processing/chyt/reference/performance.html#dyn-vs-stat\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Dynamic vs static tables&lt;/span&gt;&lt;/a&gt;Dynamic vs static tables&lt;/h3&gt;\n&lt;p&gt;Data in dynamic tables is stored in a different way and is not intended for full-scan reading. Additional expenses are required to read them:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;First, you have to read its own version for each value.&lt;/li&gt;\n&lt;li&gt;Second, you must read all the key columns for each row even if they are not used in the query.&lt;/li&gt;\n&lt;li&gt;Next, you need to merge all the rows with the same key, leaving only 1 most recent version. It's a very hard process with a lot of comparisons. In addition, the process is purely row-by-row, so even if the data is stored in the columnar format, it will have to be converted into the row-based format.&lt;/li&gt;\n&lt;li&gt;After that, you need to convert the data back into the columnar format.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;&lt;code&gt;Merge&lt;/code&gt; can add x10 to the data read time.&lt;/p&gt;\n&lt;p&gt;We strongly do not recommend building dashboards or making other regular queries on top of large dynamic tables due to the inefficiency of reading.&lt;/p&gt;\n&lt;h3 id=\"ssd_vs_hdd\"&gt;&lt;a href=\"en/user-guide/data-processing/chyt/reference/performance.html#ssd_vs_hdd\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;SSD vs HDD&lt;/span&gt;&lt;/a&gt;SSD vs HDD&lt;/h3&gt;\n&lt;p&gt;SSDs have the obvious advantage of higher read speed and lower latency at step 2.&lt;/p&gt;\n&lt;h3 id=\"optional_columns\"&gt;&lt;a href=\"en/user-guide/data-processing/chyt/reference/performance.html#optional_columns\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Optional columns&lt;/span&gt;&lt;/a&gt;Optional columns&lt;/h3&gt;\n&lt;p&gt;Most columns in YTsaurus are optional (&lt;code&gt;required: false&lt;/code&gt;), &lt;code&gt;Null&lt;/code&gt; can be stored instead of a value. In CH, this is not the case, most columns are not &lt;code&gt;Nullable&lt;/code&gt;. Using optional speakers slows down almost all stages, from reading and converting data to processing in CH.&lt;/p&gt;\n&lt;p&gt;We recommend applying a more rigid schema and getting rid of optional columns when they are not required.&lt;/p&gt;\n&lt;h3 id=\"data_caches\"&gt;&lt;a href=\"en/user-guide/data-processing/chyt/reference/performance.html#data_caches\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Data caches&lt;/span&gt;&lt;/a&gt;Data caches&lt;/h3&gt;\n&lt;p&gt;CHYT has a large number of caches to speed up some query execution stages.&lt;br /&gt;\nThe main caches are &lt;code&gt;compressed_block_cache&lt;/code&gt; and &lt;code&gt;uncompressed_block_cache&lt;/code&gt;. Using the second one eliminates stages 2 and 3. Using the first one eliminates stages 2, 3, and 4 (uncompressing).&lt;br /&gt;\nSmall tables will probably be always read from the cache.&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"en/user-guide/data-processing/chyt/reference/performance.md","sourcePath":"en/user-guide/data-processing/chyt/reference/performance.md"},"headings":[{"title":"Where the time goes","href":"en/user-guide/data-processing/chyt/reference/performance.html#where_my_time","level":2},{"title":"Reading data","href":"en/user-guide/data-processing/chyt/reference/performance.html#read","level":2,"items":[{"title":"Processed data size","href":"en/user-guide/data-processing/chyt/reference/performance.html#data_weight","level":3},{"title":"Erasure coding","href":"en/user-guide/data-processing/chyt/reference/performance.html#erasure","level":3},{"title":"Data storage format","href":"en/user-guide/data-processing/chyt/reference/performance.html#optimize_for","level":3},{"title":"Key columns","href":"en/user-guide/data-processing/chyt/reference/performance.html#key_columns","level":3},{"title":"Number of chunks","href":"en/user-guide/data-processing/chyt/reference/performance.html#chunk_count","level":3},{"title":"Number of input tables","href":"en/user-guide/data-processing/chyt/reference/performance.html#table_count","level":3},{"title":"Number of columns","href":"en/user-guide/data-processing/chyt/reference/performance.html#column_count","level":3},{"title":"Dynamic vs static tables","href":"en/user-guide/data-processing/chyt/reference/performance.html#dyn-vs-stat","level":3},{"title":"SSD vs HDD","href":"en/user-guide/data-processing/chyt/reference/performance.html#ssd_vs_hdd","level":3},{"title":"Optional columns","href":"en/user-guide/data-processing/chyt/reference/performance.html#optional_columns","level":3},{"title":"Data caches","href":"en/user-guide/data-processing/chyt/reference/performance.html#data_caches","level":3}]}],"title":"Performance and recommendations"},"router":{"pathname":"en/user-guide/data-processing/chyt/reference/performance","depth":6,"base":"../../../../../"},"lang":"en","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/en/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-a29ea7877730322f2ce693378d06d02ac2b374cd-en","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
