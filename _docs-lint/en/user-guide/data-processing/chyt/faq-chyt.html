        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;h4 id=\"chyt-cliques-explanation\"&gt;&lt;a href=\"en/user-guide/data-processing/chyt/faq-chyt.html#chyt-cliques-explanation\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q: Why does CHYT have cliques, while regular ClickHouse has nothing analogous? What is a clique?&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;Q: Why does CHYT have cliques, while regular ClickHouse has nothing analogous? What is a clique?&lt;/strong&gt;&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;A:&lt;/strong&gt; There is a dedicated &lt;a href=\"en/user-guide/user-guide/data-processing/chyt/general.html\"&gt;article&lt;/a&gt; about this.&lt;/p&gt;\n&lt;hr /&gt;\n&lt;h4 id=\"connection-refused-error\"&gt;&lt;a href=\"en/user-guide/data-processing/chyt/faq-chyt.html#connection-refused-error\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q: I am getting the \"DB::NetException: Connection refused\" or the \"DB::Exception: Attempt to read after eof: while receiving packet\" error. What does it mean?&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;Q: I am getting the \"DB::NetException: Connection refused\" or the \"DB::Exception: Attempt to read after eof: while receiving packet\" error. What does it mean?&lt;/strong&gt;&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;A:&lt;/strong&gt; This normally means that the CHYT process inside the Vanilla transaction crashed. You can view the aborted/failed job &lt;a href=\"en/user-guide/user-guide/data-processing/chyt/cliques/ui.html\"&gt;counters&lt;/a&gt; in the operation UI. If there are recent jobs aborted due to preemption, it means that the clique is short on resources. If there are recent failed jobs, please contact your system administrator.&lt;/p&gt;\n&lt;hr /&gt;\n&lt;h4 id=\"subquery-data-weight-limit\"&gt;&lt;a href=\"en/user-guide/data-processing/chyt/faq-chyt.html#subquery-data-weight-limit\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q: I am getting the \"Subquery exceeds data weight limit: XXX &amp;gt; YYY\" error. What does it mean?&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;Q: I am getting the \"Subquery exceeds data weight limit: XXX &amp;gt; YYY\" error. What does it mean?&lt;/strong&gt;&lt;/h4&gt;\n\n&lt;hr /&gt;\n&lt;h4 id=\"save-to-table\"&gt;&lt;a href=\"en/user-guide/data-processing/chyt/faq-chyt.html#save-to-table\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q: How do I save to a table?&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;Q: How do I save to a table?&lt;/strong&gt;&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;A:&lt;/strong&gt; There are &lt;strong&gt;INSERT INTO&lt;/strong&gt; and &lt;strong&gt;CREATE TABLE&lt;/strong&gt; functions. Learn more in the section on &lt;a href=\"en/user-guide/user-guide/data-processing/chyt/yt-tables.html#save\"&gt;Differences from ClickHouse.&lt;/a&gt;&lt;/p&gt;\n&lt;hr /&gt;\n&lt;h4 id=\"load-geodictionaries-chyt\"&gt;&lt;a href=\"en/user-guide/data-processing/chyt/faq-chyt.html#load-geodictionaries-chyt\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q: How do I load geo-dicts in my own clique?&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;Q: How do I load geo-dicts in my own clique?&lt;/strong&gt;&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;A:&lt;/strong&gt; When starting any clique, you can specify the &lt;code&gt;--cypress-geodata-path&lt;/code&gt; option that enables you to specify the path to geo-dicts in &lt;a href=\"en/user-guide/user-guide/storage/cypress.html\"&gt;Cypress&lt;/a&gt;.&lt;/p&gt;\n\n&lt;hr /&gt;\n&lt;h4 id=\"chyt-tzdatetime-handling\"&gt;&lt;a href=\"en/user-guide/data-processing/chyt/faq-chyt.html#chyt-tzdatetime-handling\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q: Can CHYT handle dates in TzDatetime format?&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;Q: Can CHYT handle dates in TzDatetime format?&lt;/strong&gt;&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;A:&lt;/strong&gt;  CHYT can handle dates in TzDatetime format just as well as conventional ClickHouse. You will have to store data as strings or numbers and convert them for reading and writing. Example date extraction by &lt;strong&gt;@gri201&lt;/strong&gt;:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs sql\"&gt;toDate(reinterpretAsInt64(reverse(unhex(&lt;span class=\"hljs-built_in\"&gt;substring&lt;/span&gt;(hex(payment_dt), &lt;span class=\"hljs-number\"&gt;1&lt;/span&gt;, &lt;span class=\"hljs-number\"&gt;8&lt;/span&gt;)))))\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"40\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-40\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-40\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-40.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;hr /&gt;\n&lt;h4 id=\"how-to-set-ssd\"&gt;&lt;a href=\"en/user-guide/data-processing/chyt/faq-chyt.html#how-to-set-ssd\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q: How do I move a table to an SSD?&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;Q: How do I move a table to an SSD?&lt;/strong&gt;&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;A:&lt;/strong&gt; First, make sure that your YTsaurus account has a quota for the &lt;strong&gt;ssd_blobs&lt;/strong&gt; medium. To do this, go to the account page, switch your medium type to &lt;strong&gt;ssd_blobs&lt;/strong&gt;, and enter your account name. If you have no quota for the &lt;strong&gt;ssd_blobs&lt;/strong&gt; medium, you can request it via a special form.&lt;/p&gt;\n&lt;p&gt;After obtaining the quota for the &lt;strong&gt;ssd_blobs&lt;/strong&gt; medium, you will need to change the value of the &lt;code&gt;primary_medium&lt;/code&gt; attribute, and the data will be moved to the corresponding medium in the background. Learn more in the section on &lt;a href=\"en/user-guide/faq/index.html\"&gt;storage&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;For static tables, you can force a move using the &lt;a href=\"en/user-guide/user-guide/data-processing/operations/merge.html\"&gt;Merge&lt;/a&gt; operation:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;yt &lt;span class=\"hljs-built_in\"&gt;set&lt;/span&gt; //home/dev/test_table/@primary_medium ssd_blobs\nyt merge --mode auto --spec &lt;span class=\"hljs-string\"&gt;'{\"force_transform\"=true;}'&lt;/span&gt; --src //home/dev/test_table --dst //home/dev/test_table\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"54\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-54\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-54\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-54.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;If the table is dynamic, to change the medium, you must first unmount the table,&lt;br /&gt;\nset the attribute, and then re-mount it:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;yt unmount-table //home/dev/test_table --&lt;span class=\"hljs-built_in\"&gt;sync&lt;/span&gt;\nyt &lt;span class=\"hljs-built_in\"&gt;set&lt;/span&gt; //home/dev/test_table/@primary_medium ssd_blobs\nyt mount-table //home/dev/test_table --&lt;span class=\"hljs-built_in\"&gt;sync&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"58\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-58\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-58\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-58.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;You can speed up the move further with &lt;a href=\"en/user-guide/user-guide/dynamic-tables/overview.html#attributes\"&gt;forced_compaction&lt;/a&gt; but using this method creates a heavy load in the cluster and is strongly discouraged.&lt;/p&gt;\n&lt;p&gt;To verify that the table has in fact changed its medium, use the command below:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;$ yt get //home/dev/test_table/@chunk_media_statistics\n\n{\n    &lt;span class=\"hljs-string\"&gt;\"ssd_blobs\"&lt;/span&gt; = {\n        &lt;span class=\"hljs-string\"&gt;\"chunk_count\"&lt;/span&gt; = 2126;\n        &lt;span class=\"hljs-string\"&gt;\"uncompressed_data_size\"&lt;/span&gt; = 9667220402266;\n        &lt;span class=\"hljs-string\"&gt;\"compressed_data_size\"&lt;/span&gt; = 4954465956017;\n        &lt;span class=\"hljs-string\"&gt;\"data_weight\"&lt;/span&gt; = 10764306825793;\n        &lt;span class=\"hljs-string\"&gt;\"max_block_size\"&lt;/span&gt; = 6584787;\n    };\n}\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"65\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-65\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-65\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-65.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;hr /&gt;\n&lt;h4 id=\"chyt-sample-support\"&gt;&lt;a href=\"en/user-guide/data-processing/chyt/faq-chyt.html#chyt-sample-support\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q: Is the SAMPLE construct of the ClickHouse language supported?&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;Q: Is the SAMPLE construct of the ClickHouse language supported?&lt;/strong&gt;&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;A:&lt;/strong&gt; CHYT supports the Sample construction. The difference is that CHYT ignores the &lt;code&gt;OFFSET ...&lt;/code&gt; command, so you cannot get a sample from another part of the selected data.&lt;/p&gt;\n&lt;p&gt;Example:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs SQL\"&gt;&lt;span class=\"hljs-keyword\"&gt;SELECT&lt;/span&gt; &lt;span class=\"hljs-built_in\"&gt;count&lt;/span&gt;(&lt;span class=\"hljs-operator\"&gt;*&lt;/span&gt;) &lt;span class=\"hljs-keyword\"&gt;FROM&lt;/span&gt; \"//tmp/sample_table\" SAMPLE &lt;span class=\"hljs-number\"&gt;0.05&lt;/span&gt;;\n\n&lt;span class=\"hljs-keyword\"&gt;SELECT&lt;/span&gt; &lt;span class=\"hljs-built_in\"&gt;count&lt;/span&gt;(&lt;span class=\"hljs-operator\"&gt;*&lt;/span&gt;) &lt;span class=\"hljs-keyword\"&gt;FROM&lt;/span&gt; \"//tmp/sample_table\" SAMPLE &lt;span class=\"hljs-number\"&gt;1&lt;/span&gt;&lt;span class=\"hljs-operator\"&gt;/&lt;/span&gt;&lt;span class=\"hljs-number\"&gt;20&lt;/span&gt;;\n\n&lt;span class=\"hljs-keyword\"&gt;SELECT&lt;/span&gt; &lt;span class=\"hljs-built_in\"&gt;count&lt;/span&gt;(&lt;span class=\"hljs-operator\"&gt;*&lt;/span&gt;) &lt;span class=\"hljs-keyword\"&gt;FROM&lt;/span&gt; \"//tmp/sample_table\" SAMPLE &lt;span class=\"hljs-number\"&gt;100500&lt;/span&gt;;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"76\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-76\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-76\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-76.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;hr /&gt;\n&lt;h4 id=\"get-table-name-query\"&gt;&lt;a href=\"en/user-guide/data-processing/chyt/faq-chyt.html#get-table-name-query\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q: How do I get the table name in a query?&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;Q: How do I get the table name in a query?&lt;/strong&gt;&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;A:&lt;/strong&gt; You can use the &lt;code&gt;$table_name&lt;/code&gt; and &lt;code&gt;$table_path&lt;/code&gt; virtual columns. For more information about the virtual columns, see &lt;a href=\"en/user-guide/user-guide/data-processing/chyt/yt-tables.html##virtual_columns\"&gt;Working with YTsaurus tables&lt;/a&gt;.&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"en/user-guide/data-processing/chyt/faq-chyt.md","sourcePath":"en/user-guide/data-processing/chyt/faq-chyt.md"},"headings":[],"title":"FAQ"},"router":{"pathname":"en/user-guide/data-processing/chyt/faq-chyt","depth":5,"base":"../../../../"},"lang":"en","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/en/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-a29ea7877730322f2ce693378d06d02ac2b374cd-en","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
        </script>
