        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;strong&gt;CHYT powered by ClickHouse&lt;/strong&gt; is a technology that enables you to create a cluster of ClickHouse servers directly on YTsaurus compute nodes.&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://clickhouse.com/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;ClickHouse&lt;/a&gt; is created within a Vanilla operation and works with the data in YTsaurus. This operation is called a &lt;em&gt;clique&lt;/em&gt; (for more information, see &lt;a href=\"user-guide/data-processing/chyt/general.html#what-is\"&gt;Concepts&lt;/a&gt;). Cliques can be public (available to all users) and private (available to a user or a team). The public clique &lt;code&gt;ch_public&lt;/code&gt; is a basic public clique running on each YTsaurus cluster.&lt;/p&gt;\n&lt;h2 id=\"advantages\"&gt;&lt;a href=\"en/user-guide/data-processing/chyt/about-chyt.html#advantages\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Main advantages&lt;/span&gt;&lt;/a&gt;Main advantages&lt;/h2&gt;\n&lt;p&gt;The vast majority of built-in ClickHouse features are available in CHYT. To learn more about various features of ClickHouse, see the &lt;a href=\"https://clickhouse.com/docs/en/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;official documentation&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;Besides that, there are the following advantages:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;You don't need to copy data from YTsaurus to ClickHouse.&lt;/li&gt;\n&lt;li&gt;You can use the computing quota in YTsaurus for fast computations.&lt;/li&gt;\n&lt;li&gt;You can quickly perform computations on YTsaurus data of small and medium size (up to 1 TB) up to 100 times faster than running MapReduce operations.&lt;/li&gt;\n&lt;li&gt;Working with &lt;a href=\"user-guide/storage/static-tables.html\"&gt;static&lt;/a&gt; and &lt;a href=\"user-guide/dynamic-tables/overview.html\"&gt;dynamic&lt;/a&gt; tables is supported.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"disadvantages\"&gt;&lt;a href=\"en/user-guide/data-processing/chyt/about-chyt.html#disadvantages\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Restrictions&lt;/span&gt;&lt;/a&gt;Restrictions&lt;/h2&gt;\n&lt;p&gt;Processed tables must be &lt;a href=\"user-guide/storage/static-schema.html\"&gt;schematized&lt;/a&gt;.&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"en/user-guide/data-processing/chyt/about-chyt.md","sourcePath":"en/user-guide/data-processing/chyt/about-chyt.md"},"headings":[{"title":"Main advantages","href":"en/user-guide/data-processing/chyt/about-chyt.html#advantages","level":2},{"title":"Restrictions","href":"en/user-guide/data-processing/chyt/about-chyt.html#disadvantages","level":2}],"title":"CHYT"},"router":{"pathname":"en/user-guide/data-processing/chyt/about-chyt","depth":5,"base":"../../../../"},"lang":"en","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/en/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-a29ea7877730322f2ce693378d06d02ac2b374cd-en","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
