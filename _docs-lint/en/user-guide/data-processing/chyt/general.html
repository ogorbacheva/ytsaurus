        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;This article provides a rationale for the selected ClickHouse model within the YTsaurus ecosystem. In particular, why CHYT has &lt;em&gt;cliques&lt;/em&gt;, while regular ClickHouse has nothing analogous.&lt;/p&gt;\n&lt;h2 id=\"what-is\"&gt;&lt;a href=\"en/user-guide/data-processing/chyt/general.html#what-is\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;What is a clique?&lt;/span&gt;&lt;/a&gt;What is a clique?&lt;/h2&gt;\n&lt;p&gt;A &lt;em&gt;clique&lt;/em&gt; is a full-fledged ClickHouse cluster that can read data from tables located in YTsaurus via the built-in YTsaurus internal protocol.&lt;/p&gt;\n&lt;p&gt;From the point of view of the &lt;a href=\"user-guide/data-processing/scheduler/scheduler-and-pools.html\"&gt;YTsaurus scheduler&lt;/a&gt;, a clique is a Vanilla operation containing in a typical case up to dozens of jobs, each of which consumes up to 16 CPU cores by default. The name &lt;em&gt;clique&lt;/em&gt; was chosen as a play on words in consonance with the name ClickHouse, but the correct spelling in English is &lt;em&gt;Clique&lt;/em&gt;.&lt;/p&gt;\n&lt;h2 id=\"administration\"&gt;&lt;a href=\"en/user-guide/data-processing/chyt/general.html#administration\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Administering a clique&lt;/span&gt;&lt;/a&gt;Administering a clique&lt;/h2&gt;\n&lt;p&gt;Cliques are administered by &lt;em&gt;users&lt;/em&gt;, not YTsaurus administrators. Specifically, any YTsaurus user can start their own clique (or even several cliques) at any time. For more information, see &lt;a href=\"user-guide/data-processing/chyt/cliques/start.html\"&gt;How to start a private clique&lt;/a&gt;.&lt;/p&gt;\n&lt;h2 id=\"isolation\"&gt;&lt;a href=\"en/user-guide/data-processing/chyt/general.html#isolation\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Reliable isolation&lt;/span&gt;&lt;/a&gt;Reliable isolation&lt;/h2&gt;\n&lt;p&gt;This representation solves the problem of &lt;em&gt;isolating&lt;/em&gt; the load from various users. OLAP databases like ClickHouse can have a fundamentally diverse load. We can mention production processes like ETL which create a constant background of load from under robotic users. Besides that, there are one-time ad-hoc queries from human users through tools like YQL, as well as one-time or regular uploads of datasets to external BI systems, such as &lt;a href=\"https://cloud.yandex.ru/docs/datalens/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;DataLens&lt;/a&gt; or &lt;a href=\"https://www.tableau.com/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Tableau&lt;/a&gt;, for further visualization.&lt;/p&gt;\n&lt;p&gt;If the database faces many \"heavy\" queries made at the same time, this can overload the cluster in many different ways:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;The compute nodes may run out of CPU resources, causing all queries (including fast ones under normal circumstances) to get less CPU time and randomly degrade.&lt;/li&gt;\n&lt;li&gt;As a consequence, the IO subsystem or the network stack (for example, a TCP or DNS subsystem) which also need CPU time to function may degrade.&lt;/li&gt;\n&lt;li&gt;Compute nodes can bump into the network bandwidth and become &lt;a href=\"https://en.wikipedia.org/wiki/I/O_bound\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;IO-bound&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;Finally, processing substantial amounts of data can consume a lot of RAM, both directly for computations that require maintaining large intermediate states (such as heavy &lt;code&gt;GROUP BY&lt;/code&gt;, sorting, or &lt;code&gt;COUNT DISTINCT&lt;/code&gt;) and elementarily for reading data for buffers over the network.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Despite the fact that ClickHouse has built-in individual protection mechanisms to solve the problems described above, they do not always help in the realities of YTsaurus. A key property of YTsaurus as a data source for ClickHouse is that any even somewhat large table is \"very heavily distributed\". Roughly speaking, you can assume that every next GB of data in the table will live on a new host. In addition, &lt;a href=\"user-guide/storage/static-tables.html\"&gt;static YTsaurus tables&lt;/a&gt;, and especially those storing analytical data, can often be compressed with a heavy compression codec (see &lt;a href=\"user-guide/storage/compression.html\"&gt;Compression&lt;/a&gt;).&lt;/p&gt;\n&lt;p&gt;This leads to the fact that processing even a \"relatively light\" table of a dozen GB with only a few narrow columns with a total weight of hundreds of MB is heavily dependent on the network stack and the data decompression subsystem and is quite demanding on RAM for buffers to read from each machine over the network.&lt;/p&gt;\n&lt;p&gt;Not wanting to solve the difficult task of managing CPU, RAM, network and disk IO bandwidth resources within ClickHouse, the decision was made to separate users physically between different processes, which is just achieved by having the required number of cliques used by small groups of users and independent of each other. Cliques are expected to be small-granular enough not to serve different types of load or a large number of users at the same time.&lt;/p&gt;\n&lt;p&gt;The only exception to this rule are &lt;a href=\"user-guide/data-processing/chyt/try-chyt.html#public\"&gt;public cliques&lt;/a&gt; which are intentionally open to all, but are provided on the best effort principle: they may be unavailable or overloaded at any time, although their performance is monitored. There are restrictions on the complexity of executed queries, sometimes quite severe. Consider public cliques to be a demo version of CHYT.&lt;/p&gt;\n&lt;h2 id=\"as-a-service\"&gt;&lt;a href=\"en/user-guide/data-processing/chyt/general.html#as-a-service\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;CHYT as a service: reuse of resources in YTsaurus and exploitation by users&lt;/span&gt;&lt;/a&gt;CHYT as a service: reuse of resources in YTsaurus and exploitation by users&lt;/h2&gt;\n&lt;p&gt;This system of distributing resources between different cliques within one large YTsaurus cluster resembles ClickHouse \"cloud\" hosting similar to &lt;a href=\"https://cloud.yandex.ru/services/managed-clickhouse\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Managed ClickHouse&lt;/a&gt; in a cloud provider. The only difference is that users do not pay with rubles in the external cloud, but with a computing quota in YTsaurus. This enables many analytical and development teams to flexibly manage existing computing resources in YTsaurus. Some of them can be used in \"classic\" computational pipelines for minutes/hours/days with Map-Reduce, for example, via YQL over YTsaurus. And the other small part can be used to create a clique of a suitable size for fast ad-hoc computations with delays of seconds.&lt;/p&gt;\n&lt;p&gt;Besides that, as is always the case with cloud technologies, providing something on an \"as a service\" model enables you to clearly specify the boundaries of responsibility for the operation of certain technical solutions.&lt;/p&gt;\n&lt;p&gt;The greatest success in the operation of any database is achieved when two conditions are met simultaneously:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;The user has a good understanding of the database structure and is able to evaluate the bottlenecks of the future computational pipeline using it.&lt;/li&gt;\n&lt;li&gt;The user is well aware of the specifics of the stored data, as well as the necessary computations on them, also knows where the data arises from in the database, and is responsible for its specific representation and form of storage.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Users are expected to use the documentation to solve the majority of operational problems, including diagnosing slow queries and intelligently evaluating the need for resources.&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"en/user-guide/data-processing/chyt/general.md","sourcePath":"en/user-guide/data-processing/chyt/general.md"},"headings":[{"title":"What is a clique?","href":"en/user-guide/data-processing/chyt/general.html#what-is","level":2},{"title":"Administering a clique","href":"en/user-guide/data-processing/chyt/general.html#administration","level":2},{"title":"Reliable isolation","href":"en/user-guide/data-processing/chyt/general.html#isolation","level":2},{"title":"CHYT as a service: reuse of resources in YTsaurus and exploitation by users","href":"en/user-guide/data-processing/chyt/general.html#as-a-service","level":2}],"title":"Introduction"},"router":{"pathname":"en/user-guide/data-processing/chyt/general","depth":5,"base":"../../../../"},"lang":"en","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/en/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-a29ea7877730322f2ce693378d06d02ac2b374cd-en","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
