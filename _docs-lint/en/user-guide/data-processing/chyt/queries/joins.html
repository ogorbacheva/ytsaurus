        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;This article presents a high-level description of the JOIN structure in CHYT.&lt;/p&gt;\n&lt;h2 id=\"sort-vs-shard\"&gt;&lt;a href=\"en/user-guide/data-processing/chyt/queries/joins.html#sort-vs-shard\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Sorting vs sharding&lt;/span&gt;&lt;/a&gt;Sorting vs sharding&lt;/h2&gt;\n&lt;p&gt;The table storage schema in YTsaurus is fundamentally different from that in ClickHouse. In YTsaurus, the basic storage primitive is a &lt;a href=\"user-guide/storage/static-tables.html\"&gt;static table&lt;/a&gt; with rows in &lt;a href=\"user-guide/storage/chunks.html\"&gt;chunks&lt;/a&gt; randomly scattered across the cluster. Static tables are extremely inefficient for tasks that require point data reads (since these point reads usually result in Random IO on the hard disk). For quick point reads, YTsaurus has a more efficient and complex primitive called &lt;a href=\"user-guide/dynamic-tables/overview.html\"&gt;dynamic tables&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;However, many batch applications that process a large amount of data in a flow require one way or another working in a model when some of the columns are &lt;em&gt;key&lt;/em&gt;. YTsaurus supports the concept of a sorted table — a table schema can show that table rows are sorted by a column prefix. Such columns are called key columns. Such metainformation enables you to efficiently implement, for example, the Sorted Reduce operation which is missing in the original Map-Reduce paradigm. In YTsaurus, the Reduce range is very wide: in particular, operations like Reduce support foreign tables with &lt;code&gt;LEFT INNER JOIN&lt;/code&gt; semantics.&lt;/p&gt;\n&lt;p&gt;In ClickHouse, the basis for distributed data storage is not &lt;a href=\"user-guide/dynamic-tables/sorted-dynamic-tables.html\"&gt;sorting&lt;/a&gt; as in YTsaurus, but &lt;em&gt;sharding&lt;/em&gt;. By default, the data is distributed across shards according to a shard key based on the remainder of the sharding expression divided by the total weight of all shards (for more information, see the &lt;a href=\"https://clickhouse.yandex/docs/en/operations/table_engines/distributed/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;ClickHouse documentation&lt;/a&gt;). Besides that, users often control the sharding logic themselves by inserting data into specific hosts.&lt;/p&gt;\n&lt;p&gt;Both schemas achieve the same goal in different ways:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;In YTsaurus, sorting ensures the locality of rows with one key value in a single chunk (or in a set of consecutive chunks).&lt;/li&gt;\n&lt;li&gt;In ClickHouse, sharding ensures the locality of rows with one sharding expression value on a single machine.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"query\"&gt;&lt;a href=\"en/user-guide/data-processing/chyt/queries/joins.html#query\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;How does a query work in CHYT?&lt;/span&gt;&lt;/a&gt;How does a query work in CHYT?&lt;/h2&gt;\n&lt;p&gt;The CHYT structure is described in detail In the &lt;a href=\"user-guide/data-processing/chyt/queries/anatomy.html\"&gt;Query anatomy&lt;/a&gt; section. Any SELECT query is split by the coordinator into portions on the main table and then each portion is processed independently on its own instance.&lt;/p&gt;\n&lt;p&gt;This execution schema is very similar to that of the Distributed ClickHouse engine, except that in ClickHouse, data is read literally \"from underneath\" the instance, while in YTsaurus, chunks are scattered randomly across the cluster machines, which is compensated by a very broad network.&lt;/p&gt;\n&lt;p&gt;This method is well-suited for single-source threaded queries that do not contain JOIN. However, as soon as the need for joins arises, you have to figure out how to combine related rows from different sources without having to perform random reads.&lt;/p&gt;\n&lt;h2 id=\"types\"&gt;&lt;a href=\"en/user-guide/data-processing/chyt/queries/joins.html#types\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;JOIN types in ClickHouse&lt;/span&gt;&lt;/a&gt;JOIN types in ClickHouse&lt;/h2&gt;\n&lt;p&gt;How can coordination (i.e. load distribution between instances) of JOIN work in a distributed environment? In ClickHouse, the following execution strategies of the &lt;code&gt;lhs JOIN rhs USING/ON ...&lt;/code&gt; construction are possible:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;Distributed local JOIN: if the tables are sharded &lt;em&gt;in the same way&lt;/em&gt;, you can execute JOIN independently on each instance, since it is true that a pair of keys joined by JOIN cannot end up on different machines. Thus, &lt;code&gt;lhs&lt;/code&gt; and &lt;code&gt;rhs&lt;/code&gt; on each instance are interpreted as their respective local tables.&lt;/li&gt;\n&lt;li&gt;GLOBAL JOIN: if you use the keyword GLOBAL next to JOIN, you can force the system to do the following. The right-hand side &lt;code&gt;rhs&lt;/code&gt; argument is executed and serialized on the query coordinator and its serialized representation is sent out along with the query to the instances. The instances are invited to use this representation to retrieve the right-hand side part in their memory. This method is good when &lt;code&gt;rhs&lt;/code&gt; is relatively small and there are relatively few instances: it is easy to see that if one of these conditions is not met, you can bump into distribution of the table from the coordinator by subqueries over the network (or over the memory on the coordinator). This method &lt;em&gt;does not require&lt;/em&gt; any additional conditions for the consistency of the storage/sharding schema on the tables.&lt;/li&gt;\n&lt;li&gt;JOIN via subqueries. ClickHouse enables you to surround &lt;code&gt;lhs&lt;/code&gt; and/or &lt;code&gt;rhs&lt;/code&gt; with brackets and this significantly affects the execution plan:&lt;br /&gt;\n— If you surround &lt;code&gt;lhs&lt;/code&gt; with brackets, ClickHouse loses any information about the lhs structure, in particular, knowledge about the distributed nature of the left-hand side part is lost. In this situation, the left-hand side part is executed independently on the coordinator, the right-hand side part is executed independently and goes up to the RAM to the hash table, and then JOIN is completely executed only on the coordinator.&lt;br /&gt;\n— If you surround &lt;code&gt;rhs&lt;/code&gt; with brackets, ClickHouse will make a distributed query as if the query just looks like &lt;code&gt;SELECT lhs&lt;/code&gt;. Then it will send its queries to the instances, leaving &lt;code&gt;JOIN (rhs)&lt;/code&gt; as it is. Next, each instance will execute &lt;code&gt;rhs&lt;/code&gt; independently, which can lead to a much heavier load, since each instance will materialize the right-hand side part independently. The latter problem is solved by the protective mechanism that prohibits such behavior by default and results in the &lt;code&gt;Double-distributed IN/JOIN subqueries is denied&lt;/code&gt; error.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;For more information, see the ClickHouse documentation. Relevant links:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"https://clickhouse.com/docs/en/sql-reference/statements/select/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;SELECT Query&lt;/a&gt;;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://clickhouse.com/docs/en/operations/settings/settings/#distributed-product-mode\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;distributed_product_mode&lt;/a&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;What does a similar classification look like in CHYT? Points 2 and 3 work exactly the same way: strategy 2 is good if the right-hand side of the table is small. The first option of strategy 3 is suitable if the right-hand table is very large, but you can wait for a long time. Note that CHYT is designed for fast analytical queries and if something requires to join large heterogeneous tables, better use YQL and Map-Reduce. Therefore, we do not recommend this method.&lt;/p&gt;\n&lt;p&gt;There is a significant difference in strategy 1 in CHYT. You can read about it below.&lt;/p&gt;\n&lt;h2 id=\"sorted\"&gt;&lt;a href=\"en/user-guide/data-processing/chyt/queries/joins.html#sorted\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Sorted JOIN&lt;/span&gt;&lt;/a&gt;Sorted JOIN&lt;/h2&gt;\n&lt;p&gt;Instead of the &lt;em&gt;Distributed JOIN&lt;/em&gt; logic that uses the identity of the argument &lt;em&gt;sharding&lt;/em&gt; schema, CHYT naturally produces the &lt;em&gt;Sorted JOIN&lt;/em&gt; logic that uses the identity of the argument &lt;em&gt;sorting&lt;/em&gt; schema. For those who understand how the Sorted Reduce operation works, Sorted JOIN works exactly the same way.&lt;/p&gt;\n&lt;p&gt;To use the Sorted JOIN strategy, use the ordinary &lt;code&gt;lhs JOIN rhs USING/ON ...&lt;/code&gt; construction, but &lt;code&gt;lhs&lt;/code&gt; and &lt;code&gt;rhs&lt;/code&gt; are subject to the following additional restrictions:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;lhs&lt;/code&gt; and &lt;code&gt;rhs&lt;/code&gt; must be sorted tables. Let &lt;code&gt;lhs&lt;/code&gt; be sorted by columns &lt;code&gt;l1, l2, ..., ln&lt;/code&gt; and &lt;code&gt;rhs&lt;/code&gt; be sorted by columns &lt;code&gt;r1, r2, ..., rm&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;The JOIN condition should look like a set of equalities &lt;code&gt;l1 = r1&lt;/code&gt;, ..., &lt;code&gt;lk = rk&lt;/code&gt; for a &lt;code&gt;k&lt;/code&gt; (the equalities themselves can go in any order). This can be expressed as a set of equalities in the ON clause or as a set of common key columns in the USING clause, but not as a condition in the WHERE clause.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;If these conditions are met, you can reuse the coordination logic from the Sorted reduce operation by forming pairs of appropriate ranges from &lt;code&gt;lhs&lt;/code&gt; and &lt;code&gt;rhs&lt;/code&gt; and distributing them to instances in subqueries. If this condition isn't met, an error will occur and you'll have to use either strategy 2 (using GLOBAL JOIN) or the second variant of strategy 3 (placing the right-hand part in a subquery).&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"en/user-guide/data-processing/chyt/queries/joins.md","sourcePath":"en/user-guide/data-processing/chyt/queries/joins.md"},"headings":[{"title":"Sorting vs sharding","href":"en/user-guide/data-processing/chyt/queries/joins.html#sort-vs-shard","level":2},{"title":"How does a query work in CHYT?","href":"en/user-guide/data-processing/chyt/queries/joins.html#query","level":2},{"title":"JOIN types in ClickHouse","href":"en/user-guide/data-processing/chyt/queries/joins.html#types","level":2},{"title":"Sorted JOIN","href":"en/user-guide/data-processing/chyt/queries/joins.html#sorted","level":2}],"title":"JOIN in CHYT"},"router":{"pathname":"en/user-guide/data-processing/chyt/queries/joins","depth":6,"base":"../../../../../"},"lang":"en","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/en/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-a29ea7877730322f2ce693378d06d02ac2b374cd-en","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
