        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;Starting with version 1.74.0, SPYT comes with &lt;a href=\"https://livy.apache.org/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Livy&lt;/a&gt;, a service that allows communication between the client and a Spark cluster over a REST interface. The &lt;a href=\"user-guide/query-tracker/about.html\"&gt;Query tracker&lt;/a&gt; module uses this functionality to execute Spark SQL queries in YTsaurus.&lt;/p&gt;\n&lt;p&gt;The Livy distribution is already included in the release image of SPYT and can be found on the YTsaurus cluster at the path &lt;code&gt;//home/spark/livy/livy.tgz&lt;/code&gt;.&lt;/p&gt;\n&lt;h2 id=\"start\"&gt;&lt;a href=\"en/user-guide/data-processing/spyt/cluster/livy.html#start\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Running Livy&lt;/span&gt;&lt;/a&gt;Running Livy&lt;/h2&gt;\n&lt;p&gt;To run the Livy server, specify the &lt;code&gt;--enable-livy&lt;/code&gt; option in the command for starting a SPYT cluster. The maximum number of concurrent connections to the server is controlled by the &lt;code&gt;--livy-max-sessions&lt;/code&gt; option. Attempting to establish a connection after reaching the limit will result in an error.&lt;/p&gt;\n&lt;p&gt;The driver for Spark jobs executed through Livy is deployed in the same container as the server. For this reason, to ensure correct calculation and allocation of resources in YTsaurus, use the &lt;code&gt;--livy-driver-cores&lt;/code&gt; and &lt;code&gt;--livy-driver-memory&lt;/code&gt; options at cluster startup to configure the number of cores and driver memory size.&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;$ spark-launch-yt ... --enable-livy --livy-max-sessions 5 --livy-driver-cores 1 --livy-driver-memory 1G\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"15\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-15\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-15\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-15.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;To retrieve the address of the Livy server or other components, run the &lt;code&gt;spark-discovery-yt&lt;/code&gt; command.&lt;/p&gt;\n&lt;h2 id=\"query-tracker\"&gt;&lt;a href=\"en/user-guide/data-processing/spyt/cluster/livy.html#query-tracker\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Using Livy in Query Tracker&lt;/span&gt;&lt;/a&gt;Using Livy in Query Tracker&lt;/h2&gt;\n&lt;p&gt;You can send queries to a running SPYT cluster from Query Tracker (SPYT tab) using Spark SQL. To do this, set the &lt;code&gt;cluster&lt;/code&gt; (if your YTsaurus installation doesn't have a default cluster) and &lt;code&gt;discovery_path&lt;/code&gt; fields in &lt;code&gt;settings&lt;/code&gt;. In addition, you can use the &lt;code&gt;spark_conf&lt;/code&gt; field to pass an arbitrary Spark session configuration as a YSON map.&lt;/p&gt;\n&lt;p&gt;QT version 0.0.5 added support for authenticating and reusing sessions:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;\n&lt;p&gt;When Query Tracker starts executing a query, it issues the user a temporary &lt;a href=\"user-guide/storage/auth.html\"&gt;token&lt;/a&gt; with a TTL of tens of minutes. The received token is used to authenticate the user in YTsaurus when executing the query on a SPYT cluster. This ensures that the user has the necessary &lt;a href=\"user-guide/storage/access-control.html#authorization\"&gt;permissions&lt;/a&gt; when reading or writing data. If query execution takes a long time, the temporary token's TTL will be periodically extended.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;If &lt;code&gt;session_reuse&lt;/code&gt; is set to true (default value) in &lt;code&gt;settings&lt;/code&gt;, queries don't close the established cluster connection and reuse it in the future if possible. This reduces query execution time by 10–20 seconds. However, keep in mind that idle sessions also count toward the limit on the number of concurrent connections to the cluster (&lt;code&gt;livy-max-sessions&lt;/code&gt;). The session is automatically terminated if no new queries are received for more than 10 minutes.&lt;/p&gt;\n&lt;/li&gt;\n&lt;/ol&gt;\n&lt;h2 id=\"direct-connect\"&gt;&lt;a href=\"en/user-guide/data-processing/spyt/cluster/livy.html#direct-connect\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Configuring a session when connecting to the server directly&lt;/span&gt;&lt;/a&gt;Configuring a session when connecting to the server directly&lt;/h2&gt;\n&lt;p&gt;Livy server endpoints are described in the &lt;a href=\"https://livy.apache.org/docs/latest/rest-api.html\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;official documentation&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;To use YTsaurus, during the initialization of a Livy session, specify two configuration parameters — the paths to the Java (&lt;code&gt;spark.yt.jars&lt;/code&gt;) and Python (&lt;code&gt;spark.yt.pyFiles&lt;/code&gt;) libraries — in the &lt;code&gt;spark_conf&lt;/code&gt; field:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs python\"&gt;data = {&lt;span class=\"hljs-string\"&gt;'kind'&lt;/span&gt;: &lt;span class=\"hljs-string\"&gt;'spark'&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;'conf'&lt;/span&gt;: {&lt;span class=\"hljs-string\"&gt;'spark.yt.version'&lt;/span&gt;: &lt;span class=\"hljs-string\"&gt;'1.75.4'&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;'spark.yt.jars'&lt;/span&gt;: &lt;span class=\"hljs-string\"&gt;'yt:///home/spark/spyt/releases/1.75.4/spark-yt-data-source.jar'&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;'spark.yt.pyFiles'&lt;/span&gt;: &lt;span class=\"hljs-string\"&gt;'yt:///home/spark/spyt/releases/1.75.4/spyt.zip'&lt;/span&gt;}}\nreq = requests.post(host + &lt;span class=\"hljs-string\"&gt;'/sessions'&lt;/span&gt;, data=json.dumps(data))\nresp = req.json()\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"49\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-49\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-49\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-49.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"sparkmagic\"&gt;&lt;a href=\"en/user-guide/data-processing/spyt/cluster/livy.html#sparkmagic\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Sparkmagic&lt;/span&gt;&lt;/a&gt;Sparkmagic&lt;/h2&gt;\n&lt;p&gt;You can connect to the Livy server via &lt;a href=\"https://github.com/jupyter-incubator/sparkmagic\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Sparkmagic&lt;/a&gt; to work with a SPYT cluster in a Jupyter notebook over a REST interface. This reduces the number of network accesses required to use interactive Python while maintaining all functionality. In addition to Python, Sparkmagic also supports Scala and SQL.&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"en/user-guide/data-processing/spyt/cluster/livy.md","sourcePath":"en/user-guide/data-processing/spyt/cluster/livy.md"},"headings":[{"title":"Running Livy","href":"en/user-guide/data-processing/spyt/cluster/livy.html#start","level":2},{"title":"Using Livy in Query Tracker","href":"en/user-guide/data-processing/spyt/cluster/livy.html#query-tracker","level":2},{"title":"Configuring a session when connecting to the server directly","href":"en/user-guide/data-processing/spyt/cluster/livy.html#direct-connect","level":2},{"title":"Sparkmagic","href":"en/user-guide/data-processing/spyt/cluster/livy.html#sparkmagic","level":2}],"title":"Livy server"},"router":{"pathname":"en/user-guide/data-processing/spyt/cluster/livy","depth":6,"base":"../../../../../"},"lang":"en","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/en/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-a29ea7877730322f2ce693378d06d02ac2b374cd-en","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
