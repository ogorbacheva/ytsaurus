        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;In task execution, some computations can be performed on GPU devices. You can read about GPU resource scheduling in YTsaurus &lt;a href=\"user-guide/data-processing/overview#podderzhka-gpu\"&gt;here&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;GPU-based task execution relies on the &lt;a href=\"https://docs.nvidia.com/spark-rapids/user-guide/23.08/getting-started/on-premise.html\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;RAPIDS Accelerator&lt;/a&gt; plugin. It takes some of the operations for which conversions are described and transfers them to the GPU. The main parameters are described in the plugin documentation.&lt;/p&gt;\n&lt;h2 id=\"configuring-the-gpu-for-direct-execution\"&gt;&lt;a href=\"en/user-guide/data-processing/spyt/thesaurus/gpu-usage.html#configuring-the-gpu-for-direct-execution\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Configuring the GPU for direct execution&lt;/span&gt;&lt;/a&gt;Configuring the GPU for direct execution&lt;/h2&gt;\n&lt;p&gt;For direct execution, pools must be configured correctly. Besides redefining the pool, you'll often also need to redefine the pool tree.&lt;/p&gt;\n&lt;p&gt;The driver doesn't need a GPU, meaning you can use an arbitrary pool (the &lt;code&gt;--queue&lt;/code&gt; option). However, executors do need GPUs, so the pool tree and the pool with GPU resources should be specified for them separately.&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;spark-submit \\\n    ... \\\n    --queue no_gpu_pool \\\n    --conf spark.executor.resource.gpu.amount=1 \\\n    --conf spark.task.resource.gpu.amount=0.5 \\\n    --conf spark.rapids.memory.pinnedPool.size=2G \\\n    --conf spark.plugins=com.nvidia.spark.SQLPlugin \\\n    --jars yt:///home/spark/lib/rapids-4-spark_2.12-23.12.2-cuda11.jar \\\n    --conf spark.ytsaurus.executor.operation.parameters=&lt;span class=\"hljs-string\"&gt;\"{pool=gpu_pool;pool_trees=[gpu_tree]}\"&lt;/span&gt; \\\n    yt:///home/spark/examples/smoke_test_raw.py\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"15\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-15\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-15\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-15.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Only an integer number of GPU devices can be allocated to each executor, but tasks can share GPUs.&lt;/p&gt;\n&lt;p&gt;The library must be compiled for the CUDA version supplied to the job environment. It is specified at &lt;code&gt;//home/spark/conf/global/cuda_toolkit_version&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;An example task in client mode is also available in the repository:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;python python-examples/gpu_example/main.py &amp;lt;cluster-name&amp;gt; gpu_pool gpu_tree\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"25\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-25\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-25\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-25.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"computations-on-a-standalone-cluster\"&gt;&lt;a href=\"en/user-guide/data-processing/spyt/thesaurus/gpu-usage.html#computations-on-a-standalone-cluster\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Computations on a Standalone cluster&lt;/span&gt;&lt;/a&gt;Computations on a Standalone cluster&lt;/h2&gt;\n&lt;h3 id=\"starting-a-cluster\"&gt;&lt;a href=\"en/user-guide/data-processing/spyt/thesaurus/gpu-usage.html#starting-a-cluster\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Starting a cluster&lt;/span&gt;&lt;/a&gt;Starting a cluster&lt;/h3&gt;\n&lt;p&gt;At &lt;a href=\"user-guide/data-processing/spyt/launch#standalone\"&gt;cluster startup&lt;/a&gt;, each worker will be allocated an integer number of GPUs specified in the &lt;code&gt;--worker-gpu-limit&lt;/code&gt; option:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;spark-launch-yt ... --pool gpu_pool --params '{operation_spec={pool_trees=[gpu_tree]}}' --worker-gpu-limit 2\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"35\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-35\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-35\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-35.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;All cluster components will be run in the specified pool, with GPU devices only requested for workers.&lt;/p&gt;\n&lt;h3 id=\"running-tasks\"&gt;&lt;a href=\"en/user-guide/data-processing/spyt/thesaurus/gpu-usage.html#running-tasks\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Running tasks&lt;/span&gt;&lt;/a&gt;Running tasks&lt;/h3&gt;\n&lt;p&gt;Sample Spark task configuration:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;spark-submit-yt \\\n    ... \\\n    --conf spark.executor.resource.gpu.amount=1 \\\n    --conf spark.task.resource.gpu.amount=0.25 \\\n    --conf spark.rapids.memory.pinnedPool.size=2G \\\n    --conf spark.plugins=com.nvidia.spark.SQLPlugin \\\n    --jars yt:///home/spark/lib/rapids-4-spark_2.12-23.12.2-cuda11.jar \\\n    yt:///home/spark/examples/smoke_test_raw.py\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"45\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-45\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-45\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-45.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"en/user-guide/data-processing/spyt/thesaurus/gpu-usage.md","sourcePath":"en/user-guide/data-processing/spyt/thesaurus/gpu-usage.md"},"headings":[{"title":"Configuring the GPU for direct execution","href":"en/user-guide/data-processing/spyt/thesaurus/gpu-usage.html#configuring-the-gpu-for-direct-execution","level":2},{"title":"Computations on a Standalone cluster","href":"en/user-guide/data-processing/spyt/thesaurus/gpu-usage.html#computations-on-a-standalone-cluster","level":2,"items":[{"title":"Starting a cluster","href":"en/user-guide/data-processing/spyt/thesaurus/gpu-usage.html#starting-a-cluster","level":3},{"title":"Running tasks","href":"en/user-guide/data-processing/spyt/thesaurus/gpu-usage.html#running-tasks","level":3}]}],"title":"GPU usage"},"router":{"pathname":"en/user-guide/data-processing/spyt/thesaurus/gpu-usage","depth":6,"base":"../../../../../"},"lang":"en","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/en/index.h
