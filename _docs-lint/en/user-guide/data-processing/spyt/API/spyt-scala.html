        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;h2 id=\"requirements\"&gt;&lt;a href=\"en/user-guide/data-processing/spyt/API/spyt-scala.html#requirements\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Requirements&lt;/span&gt;&lt;/a&gt;Requirements&lt;/h2&gt;\n&lt;p&gt;SPYT works with Java 11 and Scala 2.12.&lt;/p&gt;\n&lt;h2 id=\"dependencies\"&gt;&lt;a href=\"en/user-guide/data-processing/spyt/API/spyt-scala.html#dependencies\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Dependencies&lt;/span&gt;&lt;/a&gt;Dependencies&lt;/h2&gt;\n&lt;p&gt;All the dependencies are installed in SPYT automatically; therefore the &lt;code&gt;scope&lt;/code&gt; value is &lt;code&gt;Provided&lt;/code&gt;. They will be used for compilation only and will not be included in the &lt;code&gt;.jar&lt;/code&gt; or run.&lt;/p&gt;\n&lt;p&gt;All possible values for &lt;code&gt;spytVersion&lt;/code&gt; can be found &lt;a href=\"https://github.com/ytsaurus/ytsaurus/tags\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;here&lt;/a&gt; under the spyt/* or spyt-spark/* tag. Apache Spark compatible versions are described in &lt;a href=\"user-guide/data-processing/spyt/overview.html#spyt-compatibility\"&gt;this table&lt;/a&gt;.&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs scala\"&gt;\n&lt;span class=\"hljs-keyword\"&gt;val&lt;/span&gt; sparkVersion = &lt;span class=\"hljs-string\"&gt;\"3.5.4\"&lt;/span&gt;\n&lt;span class=\"hljs-keyword\"&gt;val&lt;/span&gt; spytVersion = &lt;span class=\"hljs-string\"&gt;\"2.7.1\"&lt;/span&gt;\n\nlibraryDependencies ++= &lt;span class=\"hljs-type\"&gt;Seq&lt;/span&gt;(\n    &lt;span class=\"hljs-comment\"&gt;// Spark dependencies&lt;/span&gt;\n    &lt;span class=\"hljs-string\"&gt;\"org.apache.spark\"&lt;/span&gt; %% &lt;span class=\"hljs-string\"&gt;\"spark-core\"&lt;/span&gt; % sparkVersion % &lt;span class=\"hljs-type\"&gt;Provided&lt;/span&gt;,\n    &lt;span class=\"hljs-string\"&gt;\"org.apache.spark\"&lt;/span&gt; %% &lt;span class=\"hljs-string\"&gt;\"spark-sql\"&lt;/span&gt; % sparkVersion % &lt;span class=\"hljs-type\"&gt;Provided&lt;/span&gt;,\n    &lt;span class=\"hljs-comment\"&gt;// SPYT library&lt;/span&gt;\n    &lt;span class=\"hljs-string\"&gt;\"tech.ytsaurus\"&lt;/span&gt; %% &lt;span class=\"hljs-string\"&gt;\"spark-yt-data-source\"&lt;/span&gt; % spytVersion % &lt;span class=\"hljs-type\"&gt;Provided&lt;/span&gt;\n)\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"15\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-15\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-15\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-15.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"build\"&gt;&lt;a href=\"en/user-guide/data-processing/spyt/API/spyt-scala.html#build\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Build&lt;/span&gt;&lt;/a&gt;Build&lt;/h2&gt;\n&lt;p&gt;The example code has been built using the &lt;code&gt;sbt assembly&lt;/code&gt; command and posted to YTsaurus: &lt;code&gt;//home/spark/examples/scala-examples-assembly-0.1.jar&lt;/code&gt;.&lt;/p&gt;\n&lt;h2 id=\"start\"&gt;&lt;a href=\"en/user-guide/data-processing/spyt/API/spyt-scala.html#start\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Starting jobs&lt;/span&gt;&lt;/a&gt;Starting jobs&lt;/h2&gt;\n&lt;p&gt;Before running jobs from the example, you need to launch your SPYT cluster or find out the &lt;code&gt;discovery-path&lt;/code&gt; for an already running cluster.&lt;/p&gt;\n&lt;p&gt;Jobs are started via the &lt;code&gt;spark-submit-yt&lt;/code&gt; utility.&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;spark-submit-yt \\\n  --proxy &lt;span class=\"hljs-variable\"&gt;${YT_PROXY}&lt;/span&gt; \\\n  --discovery-path &lt;span class=\"hljs-variable\"&gt;${SPYT_DISCOVERY_PATH}&lt;/span&gt; \\\n  --deploy-mode cluster \\\n  --class tech.ytsaurus.spyt.examples.GroupingExample \\\n  yt:///home/spark/examples/scala-examples-assembly-0.1.jar\n\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"31\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-31\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-31\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-31.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"submit\"&gt;&lt;a href=\"en/user-guide/data-processing/spyt/API/spyt-scala.html#submit\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Differences for submitting directly to YTsaurus (from version 1.76.0)&lt;/span&gt;&lt;/a&gt;Differences for submitting directly to YTsaurus (from version 1.76.0)&lt;/h2&gt;\n&lt;p&gt;For submitting Spark tasks &lt;a href=\"user-guide/data-processing/spyt/launch.html#submit\"&gt;directly to YTsaurus&lt;/a&gt; a &lt;code&gt;SparkSession&lt;/code&gt; object should be created according to Spark recommendations:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs scala\"&gt;&lt;span class=\"hljs-keyword\"&gt;import&lt;/span&gt; org.apache.spark.&lt;span class=\"hljs-type\"&gt;SparkConf&lt;/span&gt;\n&lt;span class=\"hljs-keyword\"&gt;import&lt;/span&gt; org.apache.spark.sql.&lt;span class=\"hljs-type\"&gt;SparkSession&lt;/span&gt;\n\n&lt;span class=\"hljs-class\"&gt;&lt;span class=\"hljs-keyword\"&gt;object&lt;/span&gt; &lt;span class=\"hljs-title\"&gt;MySparkApplication&lt;/span&gt; &lt;/span&gt;{\n\n    &lt;span class=\"hljs-function\"&gt;&lt;span class=\"hljs-keyword\"&gt;def&lt;/span&gt; &lt;span class=\"hljs-title\"&gt;main&lt;/span&gt;&lt;/span&gt;(args: &lt;span class=\"hljs-type\"&gt;Array&lt;/span&gt;[&lt;span class=\"hljs-type\"&gt;String&lt;/span&gt;]): &lt;span class=\"hljs-type\"&gt;Unit&lt;/span&gt; = {\n        &lt;span class=\"hljs-keyword\"&gt;val&lt;/span&gt; conf = &lt;span class=\"hljs-keyword\"&gt;new&lt;/span&gt; &lt;span class=\"hljs-type\"&gt;SparkConf&lt;/span&gt;()\n        &lt;span class=\"hljs-keyword\"&gt;val&lt;/span&gt; spark = &lt;span class=\"hljs-type\"&gt;SparkSession&lt;/span&gt;.builder.config(conf).getOrCreate()\n\n        &lt;span class=\"hljs-keyword\"&gt;try&lt;/span&gt; {\n            &lt;span class=\"hljs-comment\"&gt;// Application code&lt;/span&gt;\n        } &lt;span class=\"hljs-keyword\"&gt;finally&lt;/span&gt; {\n            spark.stop()\n        }\n    }\n}\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"38\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-38\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-38\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-38.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;In this case a standard &lt;code&gt;spark-submit&lt;/code&gt; command should be used:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;$ spark-submit \\\n  --master ytsaurus://&lt;span class=\"hljs-variable\"&gt;${YT_PROXY}&lt;/span&gt; \\\n  --deploy-mode cluster \\\n  --class tech.ytsaurus.spyt.examples.GroupingExample \\\n  yt:///home/spark/examples/scala-examples-assembly-0.1.jar\n\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"42\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-42\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-42\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-42.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"en/user-guide/data-processing/spyt/API/spyt-scala.md","sourcePath":"en/user-guide/data-processing/spyt/API/spyt-scala.md"},"headings":[{"title":"Requirements","href":"en/user-guide/data-processing/spyt/API/spyt-scala.html#requirements","level":2},{"title":"Dependencies","href":"en/user-guide/data-processing/spyt/API/spyt-scala.html#dependencies","level":2},{"title":"Build","href":"en/user-guide/data-processing/spyt/API/spyt-scala.html#build","level":2},{"title":"Starting jobs","href":"en/user-guide/data-processing/spyt/API/spyt-scala.html#start","level":2},{"title":"Differences for submitting directly to YTsaurus (from version 1.76.0)","href":"en/user-guide/data-processing/spyt/API/spyt-scala.html#submit","level":2}],"title":"SPYT in Scala"},"router":{"pathname":"en/user-guide/data-processing/spyt/API/spyt-scala","depth":6,"base":"../../../../../"},"lang":"en","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/en/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-a29ea7877730322f2ce693378d06d02ac2b374cd-en","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
