            {"data":{"leading":false,"html":"&lt;h2 id=\"cluster-generates-errors-on-startup\"&gt;&lt;a href=\"en/user-guide/data-processing/spyt/problems.html#cluster-generates-errors-on-startup\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Cluster generates errors on startup&lt;/span&gt;&lt;/a&gt;Cluster generates errors on startup&lt;/h2&gt;\n&lt;p&gt;To get information on a running transaction, use the &lt;code&gt;spark-discovery-yt&lt;/code&gt; utility:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;spark-discovery-yt &amp;lt;cluster-name&amp;gt; --discovery-path my_discovery_path\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"6\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-6\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-6\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-6.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;A task list for this transaction always includes a master, a worker, and the Spark History Server. If the master is non-functional, so are the other components. If everything is running properly, the worker log will include data on the accepted task and the start of task execution.&lt;/p&gt;\n&lt;p&gt;If a task produces an error at startup, you need to:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Open the task log via Master Web UI. It has links to the driver and the executor logs.&lt;/li&gt;\n&lt;li&gt;Open Worker UI via Master Web UI and review the application startup sequence.&lt;/li&gt;\n&lt;li&gt;View the &lt;a href=\"user-guide/data-processing/spyt/logs.html\"&gt;Event Log&lt;/a&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"en/user-guide/data-processing/spyt/problems.md","sourcePath":"en/user-guide/data-processing/spyt/problems.md"},"headings":[{"title":"Cluster generates errors on startup","href":"en/user-guide/data-processing/spyt/problems.html#cluster-generates-errors-on-startup","level":2}],"title":"Troubleshooting"},"router":{"pathname":"en/user-guide/data-processing/spyt/problems","depth":5,"base":"../../../../"},"lang":"en","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/en/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-a29ea7877730322f2ce693378d06d02ac2b374cd-en","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
