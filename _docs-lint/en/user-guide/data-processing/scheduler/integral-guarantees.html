        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;The basic mechanism for providing guarantees for computing resources in the YTsaurus system stipulates issuing a constant amount of resources (strong guarantee), most often expressed in CPU cores. This guarantee type is well suited for tasks that can utilize resources constantly . In reality, there are other scenarios where more flexibility is required.&lt;/p&gt;\n&lt;p&gt;For example, when a production process needs to perform computations in a relatively short period of time, but needs a lot of computational quota at its peak, whereas the consumption level can be much lower the rest of the time. With the basic mechanism for providing a guarantee, you need to allocate resources to the process at the maximum consumption value and order more resources when scheduling than you actually needed.&lt;/p&gt;\n&lt;p&gt;There are processes for which it is not so important to get computational resources immediately, but it is important that the processes be completed within a certain extended period of time. If that's the case, you are looking at an average value of the computational quota over a long time: for example, research and analytical tasks - experiments.&lt;/p&gt;\n&lt;p&gt;The mechanism of integral guarantees enables you to find a balance between the described scenarios.&lt;/p&gt;\n&lt;h2 id=\"integral-pools\"&gt;&lt;a href=\"en/user-guide/data-processing/scheduler/integral-guarantees.html#integral-pools\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Integral pools&lt;/span&gt;&lt;/a&gt;Integral pools&lt;/h2&gt;\n&lt;p&gt;In the YTsaurus system, you can enable the accumulation of resources for the pool. Such pools receive a certain amount of virtual resources at a constant rate — &lt;code&gt;accumulated_resource_ratio_volume&lt;/code&gt;. The amount of resource is stored in the cluster share per second — &lt;code&gt;fair_share*sec&lt;/code&gt;, but for simplicity we can assume that the value is given in cores per second — &lt;code&gt;cpu*sec&lt;/code&gt;. The pool can consume a virtual resource to start operations and can accumulate it to a certain limit.&lt;/p&gt;\n&lt;p&gt;Example: let there be &lt;code&gt;accumulated_resource_ratio_volume = 60 fair_share*sec&lt;/code&gt; in the pool, 1000 cores on the cluster, and the dominant resource of the user process is CPU. This volume can be converted to &lt;code&gt;cores * seconds&lt;/code&gt; — &lt;code&gt;60,000 cpu*sec&lt;/code&gt;. An operation that consumes 100 CPU cores at a time will use that amount in 10 minutes; one that consumes 50 CPU cores — in 20 minutes. This example does not take into account that the volume of the virtual resource in the pool is replenished over time.&lt;/p&gt;\n&lt;p&gt;The resource accumulation rate is configured in the &lt;code&gt;integral-guarantees/resource_flow&lt;/code&gt; pool attribute. The attribute value must specify the resource type and its volume:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;$ yt &lt;span class=\"hljs-built_in\"&gt;set&lt;/span&gt; //sys/pools/root-pool/burst/@integral-guarantees/resource_flow &lt;span class=\"hljs-string\"&gt;\"{cpu=100}\"&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"24\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-24\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-24\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-24.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Since &lt;code&gt;resource_flow&lt;/code&gt; is the rate at which &lt;code&gt;accumulated_resource_ratio_volume&lt;/code&gt; increases, which is the instantaneous amount of resource multiplied by time, &lt;code&gt;resource_flow/cpu&lt;/code&gt; is measured in cores, simply put, &lt;code&gt;cpu*sec/sec = cpu&lt;/code&gt;. For example, &lt;code&gt;resource_flow/cpu = 100&lt;/code&gt; allows an operation consuming 100 cpu cores at a time to run indefinitely.&lt;/p&gt;\n&lt;p&gt;Accumulation of &lt;code&gt;accumulated_resource_ratio_volume&lt;/code&gt; occurs to a certain limit, which is equal to &lt;code&gt;k*resource_flow_ratio&lt;/code&gt;, where &lt;code&gt;k&lt;/code&gt; is a single scheduler parameter for all pools and &lt;code&gt;resource_flow_ratio&lt;/code&gt; is &lt;code&gt;resource_flow&lt;/code&gt; as a share of all cluster resources. The value for the &lt;code&gt;k&lt;/code&gt; parameter is set by the cluster administrator.&lt;/p&gt;\n&lt;p&gt;The described idea of accumulating and spending resources is much like the &lt;a href=\"https://en.wikipedia.org/wiki/Token_bucket\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Token bucket&lt;/a&gt; algorithm (not to be mistaken for &lt;a href=\"https://en.wikipedia.org/wiki/Leaky_bucket\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Leaky bucket&lt;/a&gt;).&lt;/p&gt;\n&lt;h2 id=\"guarantee-types\"&gt;&lt;a href=\"en/user-guide/data-processing/scheduler/integral-guarantees.html#guarantee-types\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Guarantee types&lt;/span&gt;&lt;/a&gt;Guarantee types&lt;/h2&gt;\n&lt;p&gt;There are three types of guarantees for computing resources in the YTsaurus system:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;strong&gt;strong_guarantee&lt;/strong&gt;: A strong guarantee of the share of cluster resources. Set in an absolute value (in cores), automatically recalculated into the cluster share. Enables you to get a guarantee at any time and use it indefinitely.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;burst_integral&lt;/strong&gt;: An immediate guarantee (\"peak guarantee\") in cores, enables you to get a fixed guarantee over a period of time. For example, get 2000 cores for two hours a day.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;relaxed_integral&lt;/strong&gt;: An integral guarantee (in cores) enables you to get a fixed average amount of resource per day.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h3 id=\"types-of-integral-pools\"&gt;&lt;a href=\"en/user-guide/data-processing/scheduler/integral-guarantees.html#types-of-integral-pools\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Types of integral pools&lt;/span&gt;&lt;/a&gt;Types of integral pools&lt;/h3&gt;\n&lt;p&gt;To support the two scenarios described at the beginning of this section, two types of integral pools are implemented in the YTsaurus system:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;strong&gt;Burst pool&lt;/strong&gt;: The pool that has a priority when spending &lt;code&gt;accumulated_resource_ratio_volume&lt;/code&gt;. Such pools must have &lt;code&gt;resource_flow&lt;/code&gt; and &lt;code&gt;burst_guarantee_resources&lt;/code&gt; specified. If a pool has resource-demanding operations, the scheduler must issue at least &lt;code&gt;burst_guarantee_resources&lt;/code&gt; to the pool if the pool has enough &lt;code&gt;accumulated_resource_ratio_volume&lt;/code&gt;. This pool type provides a &lt;code&gt;burst_integral&lt;/code&gt; guarantee.&lt;/p&gt;\n&lt;p&gt;A burst pool configuration example:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;yt &lt;span class=\"hljs-built_in\"&gt;set&lt;/span&gt; //sys/pools/root-pool/burst/@integral-guarantees &lt;span class=\"hljs-string\"&gt;\"\n{\n  guarantee_type=burst;\n  resource_flow={cpu=1000};\n  burst_guarantee_resources={cpu=2000}\n}\"&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"71\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-71\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-71\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-71.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;In the above example, the user can expect the pool to always be guaranteed 1000 cores, or guaranteed 2000 cores for \"half\" of the time (for example, 12 hours a day) if nothing is running during the second half.&lt;/p&gt;\n&lt;p&gt;A burst guarantee is simultaneously a limit on the consumption rate of the accumulated resource. If the burst_gurantee_resources/cpu guarantee equals 2000, the scheduler will not allow the pool to consume more than 2000 cores at a time by default. This behavior protects against accidental rapid consumption of the accumulated integral resource.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;strong&gt;Relaxed pool&lt;/strong&gt;: The pool for which there is no guarantee to get all resources for &lt;code&gt;accumulated_resource_ratio_volume&lt;/code&gt; at a given moment, but there is a guarantee to get them in the end (within a day). You can only set &lt;code&gt;resource_flow&lt;/code&gt; for a relaxed pool. Such pools are expected to run operations that do not immediately require the resources they are entitled to. This pool type provides a &lt;code&gt;relaxed_integral&lt;/code&gt; guarantee.&lt;br /&gt;\nA relaxed pool configuration example:&lt;/p&gt;\n&lt;p&gt;&lt;small&gt;Listing 3&lt;/small&gt;&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;yt &lt;span class=\"hljs-built_in\"&gt;set&lt;/span&gt; //sys/pools/root-pool/relaxed/@integral-guarantees &lt;span class=\"hljs-string\"&gt;\"\n{\n  guarantee_type=relaxed;\n  resource_flow={cpu=1000}\n}\"&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"86\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-86\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-86\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-86.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Both relaxed and burst pools have a resource consumption limit. In the case of relaxed pools, the limit is three times the value of the flow guarantee. For example, with a resource_flow/cpu guarantee of 1000, the scheduler will limit pool consumption to 3000 cores at a time by default.&lt;/p&gt;\n&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;The described pool types complement each other, allowing the use of the same resources by priority processes that require significant guarantees for limited periods of time as well as by less significant processes which do not require immediate resource allocation.&lt;/p&gt;\n&lt;h3 id=\"example\"&gt;&lt;a href=\"en/user-guide/data-processing/scheduler/integral-guarantees.html#example\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Example&lt;/span&gt;&lt;/a&gt;Example&lt;/h3&gt;\n&lt;p&gt;Suppose there is a production process that requires 2000 CPUs 12 hours a day and a research process that needs only 1000 CPUs on average. With the mechanism of integral guarantees, burst and relaxed pools can be configured for such processes, and 2000 cores will be needed to provide guarantees. The specified pools must be located in the same pool tree, there are no other restrictions. With the basic mechanism of issuing guarantees (strong guarantee), 3000 cores would have to be ordered to enforce such guarantees.&lt;/p&gt;\n&lt;p&gt;The figure shows a graph of CPU usage and demand for a burst pool with a &lt;code&gt;burst_integral&lt;/code&gt; guarantee of 500 CPU cores and a &lt;code&gt;resource_flow&lt;/code&gt; of 100 CPU cores.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"images/pool_consumption.png\" alt=\"\" /&gt;&lt;/p&gt;\n&lt;p&gt;The figure below shows a graph of the volume of accumulated resource for the same pool. You can see how the volume of virtual resource decreases when operations are running in the pool, and then the resource is again accumulated to the specified limit.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"images/pool_accumulated_resource_ratio_volume.png\" alt=\"\" /&gt;&lt;/p&gt;\n&lt;h2 id=\"combination-with-strong-guarantees\"&gt;&lt;a href=\"en/user-guide/data-processing/scheduler/integral-guarantees.html#combination-with-strong-guarantees\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Combination with strong guarantees&lt;/span&gt;&lt;/a&gt;Combination with strong guarantees&lt;/h2&gt;\n&lt;p&gt;Both types of integral pools are naturally compatible with strong guarantees. When issuing resources, the scheduler will first issue resources against strong guarantees. If they are enough to meet the current need of the pool, &lt;code&gt;accumulated_resource_ratio_volume&lt;/code&gt; will not be spent. If the need for resources exceeds the strong guarantees, &lt;code&gt;accumulated_resource_ratio_volume&lt;/code&gt; will be spent to meet the exceeding part.&lt;/p&gt;\n&lt;p&gt;Integral pools along with neighboring pools participate in receiving resources in excess of their guarantees from the pools that are higher in the hierarchy in proportion to the set weights.&lt;/p&gt;\n&lt;h2 id=\"additional-attributes-of-integral-pools\"&gt;&lt;a href=\"en/user-guide/data-processing/scheduler/integral-guarantees.html#additional-attributes-of-integral-pools\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Additional attributes of integral pools&lt;/span&gt;&lt;/a&gt;Additional attributes of integral pools&lt;/h2&gt;\n&lt;p&gt;You can request the scheduler for the value of service attributes, which are available in a special subtree of Cypress called Orchid.&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;accumulated_resource_ratio_volume&lt;/code&gt;: Accumulated integral resources in terms of the cluster share * second.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;accumulated_resource_volume&lt;/code&gt;: &lt;code&gt;accumulated_resource_ratio_volume&lt;/code&gt; as a dict with all resources. For example, &lt;code&gt;accumulated_resource_volume/cpu&lt;/code&gt; is a volume of the accumulated integral resource expressed in core * second.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;integral_pool_capacity&lt;/code&gt;: The limit of accumulating &lt;code&gt;accumulated_resource_ratio_volume&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;specified_burst_ratio&lt;/code&gt;: &lt;code&gt;burst_guarantee_resources&lt;/code&gt; converted into the cluster share.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;specified_resource_flow_ratio&lt;/code&gt;: &lt;code&gt;resource_flow&lt;/code&gt; converted into the cluster share.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;total_burst_ratio&lt;/code&gt;: The sum of &lt;code&gt;specified_burst_ratio&lt;/code&gt; for all descendants (including the current pool).&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;total_resource_flow_ratio&lt;/code&gt;: The sum of &lt;code&gt;specified_resource_flow_ratio&lt;/code&gt; for all descendants (including the current pool).&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;estimated_burst_usage_duration_seconds&lt;/code&gt;: The estimated period of time that the accumulated resource will last (taking into account the continuing inflow of resources at the rate of &lt;code&gt;resource_flow&lt;/code&gt;) when consuming &lt;code&gt;burst_guarantee_resources&lt;/code&gt; (only available for burst pools).&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;An example of requesting an attribute is shown in Listing 4.&lt;br /&gt;\n&lt;small&gt;Listing 4&lt;/small&gt;&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;yt get //sys/scheduler/orchid/scheduler/scheduling_info_per_pool_tree/default/fair_share_info/pools/pool_name/integral_pool_capacity\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"173\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-173\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-173\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-173.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Attention&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;The scheduler Orchid is not part of the stable API and can be changed without announcement.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"en/user-guide/data-processing/scheduler/integral-guarantees.md","sourcePath":"en/user-guide/data-processing/scheduler/integral-guarantees.md"},"headings":[{"title":"Integral pools","href":"en/user-guide/data-processing/scheduler/integral-guarantees.html#integral-pools","level":2},{"title":"Guarantee types","href":"en/user-guide/data-processing/scheduler/integral-guarantees.html#guarantee-types","level":2,"items":[{"title":"Types of integral pools","href":"en/user-guide/data-processing/scheduler/integral-guarantees.html#types-of-integral-pools","level":3},{"title":"Example","href":"en/user-guide/data-processing/scheduler/integral-guarantees.html#example","level":3}]},{"title":"Combination with strong guarantees","href":"en/user-guide/data-processing/scheduler/integral-guarantees.html#combination-with-strong-guarantees","level":2},{"title":"Additional attributes of integral pools","href":"en/user-guide/data-processing/scheduler/integral-guarantees.html#additional-attributes-of-integral-pools","level":2}],"title":"Integral guarantees"},"router":{"pathname":"en/user-guide/data-processing/scheduler/integral-guarantees","depth":5,"base":"../../../../"},"lang":"en","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/en/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-a29ea7877730322f2ce693378d06d02ac2b374cd-en","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
