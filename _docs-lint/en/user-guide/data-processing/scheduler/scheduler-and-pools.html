        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;This section describes the YTsaurus scheduler, introduces the concepts of a pool and pool tree (pool_tree), reviews the process of scheduling calculations, and provides an example of calculating the fair share ratio and a description of preemption.&lt;/p&gt;\n&lt;h2 id=\"general-information\"&gt;&lt;a href=\"en/user-guide/data-processing/scheduler/scheduler-and-pools.html#general-information\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;General information&lt;/span&gt;&lt;/a&gt;General information&lt;/h2&gt;\n&lt;p&gt;A scheduler is a part of the system responsible for allocating resources between operations and determining the order in which operations will be performed. The YTsaurus system uses a hierarchical &lt;a href=\"http://en.wikipedia.org/wiki/Fair-share_scheduling\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;fair_share&lt;/a&gt; scheduler. This means that resources are dynamically allocated between system users according to their guarantees and priority.&lt;/p&gt;\n&lt;p&gt;A pool is a container for the CPU and RAM resources that the scheduler uses. When users run tasks in pools, the scheduler allocates resources between the pools. A hierarchical resource allocation system can be built using the pool tree.&lt;/p&gt;\n&lt;h2 id=\"resources\"&gt;&lt;a href=\"en/user-guide/data-processing/scheduler/scheduler-and-pools.html#resources\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Resources&lt;/span&gt;&lt;/a&gt;Resources&lt;/h2&gt;\n&lt;p&gt;The scheduler uses the following resources:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;cpu&lt;/code&gt;: 1 CPU corresponds to one HyperThreading core on the cluster node. By default, all custom jobs order a single core at start-up. If jobs are multi-threaded, you can increase the number of ordered cores in the operation settings. Otherwise, process jobs will be limited (throttling) so that the amount of actual CPU time consumed corresponds to a single core.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;memory&lt;/code&gt;: The resource to control RAM consumption on the cluster node in bytes.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;user_slots&lt;/code&gt;: The resource to control the number of jobs on the cluster node. Each job of custom operations always consumes exactly one user_slot.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;network&lt;/code&gt;: The resource to control consumption of the internal cluster network by operations actively using the network. For example, sorting. The resource unit has no physical analog, and the automatic values set by the scheduler for sorting operations are selected so that jobs running on the same cluster node do not overload the network channel.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;For each pool and operation, there is a concept of a dominant resource. The dominant resource among the requested operation or pool resources is the resource type that has the highest share relative to the total volume of the corresponding resource of the entire cluster.&lt;/p&gt;\n&lt;p&gt;For example: there is an operation that requires 1,000 &lt;code&gt;cpus&lt;/code&gt; and 2 TiB of &lt;code&gt;memory&lt;/code&gt;. The entire cluster has 50,000 &lt;code&gt;cpus&lt;/code&gt; and 180 TiB of &lt;code&gt;memory&lt;/code&gt;. 1,000 &lt;code&gt;cpus&lt;/code&gt; are 0.02 (2%) of the total number of &lt;code&gt;cpus&lt;/code&gt; in the cluster and 2 TiB are 0.011 (1.1%) of the total &lt;code&gt;memory&lt;/code&gt; capacity in the cluster. Thus, the &lt;code&gt;cpu&lt;/code&gt; share is larger than the &lt;code&gt;memory&lt;/code&gt; share, so &lt;code&gt;cpu&lt;/code&gt; is the dominant resource for a particular operation.&lt;/p&gt;\n&lt;h2 id=\"scheduler\"&gt;&lt;a href=\"en/user-guide/data-processing/scheduler/scheduler-and-pools.html#scheduler\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Scheduler operation description&lt;/span&gt;&lt;/a&gt;Scheduler operation description&lt;/h2&gt;\n&lt;h3 id=\"pools-and-pool-trees\"&gt;&lt;a href=\"en/user-guide/data-processing/scheduler/scheduler-and-pools.html#pools-and-pool-trees\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Pools and pool trees&lt;/span&gt;&lt;/a&gt;Pools and pool trees&lt;/h3&gt;\n&lt;p&gt;The YTsaurus scheduler stores multiple pool trees in memory. Each tree consists of operations and compute pools. Compute pools are tree nodes and operations are leaves. Each operation can belong to one or more trees.&lt;/p&gt;\n&lt;p&gt;Logically, each tree can be regarded as a separate computing cluster — each tree belongs to a number of computing nodes in the cluster, and a cluster node can only belong to one tree.&lt;/p&gt;\n&lt;p&gt;Pool trees are stored in Cypress and configured by the YTsaurus administrator. The pool tree is the &lt;code&gt;scheduler_pool&lt;/code&gt; node at the first level of the &lt;code&gt;//sys/pool_trees&lt;/code&gt; directory in Cypress. The description of the pools for the &lt;code&gt;&amp;lt;tree_id&amp;gt;&lt;/code&gt; tree is a set of nested &lt;code&gt;scheduler_pools&lt;/code&gt; located in the &lt;code&gt;//sys/pool_trees/&amp;lt;tree_id&amp;gt;&lt;/code&gt; node. The pool characteristics are described in the attributes of the appropriate nodes.&lt;/p&gt;\n&lt;p&gt;The trees to which the operation will get at start-up are defined by the &lt;code&gt;pool_trees&lt;/code&gt; parameter in the operation settings. If this parameter is not specified, one &lt;code&gt;default_pool_tree&lt;/code&gt; will be used. For each of the listed trees, you can specify the pool from that tree in which the operation is to run (the &lt;code&gt;scheduling_options_per_pool_tree&lt;/code&gt; option).&lt;/p&gt;\n&lt;p&gt;Each pool tree has the &lt;code&gt;default_parent_pool&lt;/code&gt; attribute, which specifies the default pool. This pool is used as follows: if the pool was not specified for the tree or for all trees in the operation settings, a temporary ephemeral pool will be created in the tree with the name of the user in YTsaurus who started the operation. The pools form a hierarchy &lt;code&gt;//sys/pool_trees/&amp;lt;tree_id&amp;gt;/&amp;lt;default_parent_pool&amp;gt;/&amp;lt;username&amp;gt;&lt;/code&gt; in the end node of which the operation will be run.&lt;/p&gt;\n&lt;p&gt;Example of the setting for running an operation in two trees with indication of the pool in one of them:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;pool_trees = [default; cloud];\nscheduling_options_per_pool_tree = {\n    default = {\n        pool = cool_pool;\n    }\n}\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"70\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-70\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-70\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-70.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"job-scheduling-process\"&gt;&lt;a href=\"en/user-guide/data-processing/scheduler/scheduler-and-pools.html#job-scheduling-process\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Job scheduling process&lt;/span&gt;&lt;/a&gt;Job scheduling process&lt;/h2&gt;\n&lt;p&gt;Each operation consists of a set of jobs. A job is doing some useful work with data on one of the cluster nodes. A job is a scheduling unit.&lt;/p&gt;\n&lt;p&gt;Job scheduling takes place on each cluster node separately:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;The cluster node sends a special message (heartbeat) to the scheduler, indicating the type and amount of available resources, information about the completed and currently running jobs.&lt;/li&gt;\n&lt;li&gt;In response to the message, the scheduler decides whether to start new jobs on the cluster node or abort those in progress. Scheduling takes place in the tree to which the cluster node belongs. Preemption is also possible: aborting already running jobs of any operation if it received an amount of resources that is more than guaranteed.&lt;/li&gt;\n&lt;li&gt;All aborted jobs will later be restarted.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;To understand which jobs should be started and which should be aborted on a particular cluster node, the scheduler analyzes the pool tree. Each pool in the tree has a number of characteristics that enable the scheduler to understand whether a given subtree needs to start new jobs, and, if it does, how much this subpool needs it. According to the pool characteristics, the scheduler goes down the tree from top to bottom until it reaches a leaf. After reaching the leaf, the scheduler suggests that the operation should start the job. The scheduler makes such bypasses as long as there are unscheduled jobs and the cluster node resources are not exhausted.&lt;/p&gt;\n&lt;p&gt;There may be operations to which the scheduler allocated less resources than it was obliged to guarantee. Such operations are called \"&lt;a href=\"user-guide/data-processing/scheduler/preemption.html\"&gt;starving&lt;/a&gt;\" in the system. When the scheduler detects a starving operation, it selects the job with the minimum running time of the non-starving operation on the same cluster node and aborts it.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Note&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;The operation and pool characteristics considered during scheduling are global and do not depend on a particular cluster node. For example, an important characteristic is the share of cluster resources that are already taken up by running operation jobs (&lt;code&gt;usage_share&lt;/code&gt;).&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"en/user-guide/data-processing/scheduler/scheduler-and-pools.md","sourcePath":"en/user-guide/data-processing/scheduler/scheduler-and-pools.md"},"headings":[{"title":"General information","href":"en/user-guide/data-processing/scheduler/scheduler-and-pools.html#general-information","level":2},{"title":"Resources","href":"en/user-guide/data-processing/scheduler/scheduler-and-pools.html#resources","level":2},{"title":"Scheduler operation description","href":"en/user-guide/data-processing/scheduler/scheduler-and-pools.html#scheduler","level":2,"items":[{"title":"Pools and pool trees","href":"en/user-guide/data-processing/scheduler/scheduler-and-pools.html#pools-and-pool-trees","level":3}]},{"title":"Job scheduling process","href":"en/user-guide/data-processing/scheduler/scheduler-and-pools.html#job-scheduling-process","level":2}],"title":"Scheduler and pools"},"router":{"pathname":"en/user-guide/data-processing/scheduler/scheduler-and-pools","depth":5,"base":"../../../../"},"lang":"en","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/en/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-a29ea7877730322f2ce693378d06d02
