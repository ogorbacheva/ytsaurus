        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;The Merge operation merges input tables into one. The output is a table whose set of rows is equal to all the rows of the original tables merged together. The &lt;code&gt;mode&lt;/code&gt; option determines how the merge is performed:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;mode = unordered&lt;/code&gt; — only merge lists of input table chunks. This the default merge mode.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;mode = sorted&lt;/code&gt; — merges the input tables while maintaining sorting. The columns based on which the output table is sorted are determined by the &lt;code&gt;merge_by&lt;/code&gt; option.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;mode = ordered&lt;/code&gt; — keeps the order of the chunks from the input table list. Meaning if &lt;code&gt;T1 = (A1, A2), T2 = (B1, B2, B3)&lt;/code&gt;, then &lt;code&gt;Merge(T1, T2) = (A1, A2, B1, B2, B3)&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;General parameters for all operation types are described in &lt;a href=\"user-guide/data-processing/operations/operations-options.html\"&gt;Operation options&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;The Merge operation supports the following additional options (the default values, if set, are specified in brackets):&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;mode&lt;/code&gt; (unordered) — the type of Merge operation, can take the following values: &lt;code&gt;unordered&lt;/code&gt;, &lt;code&gt;sorted&lt;/code&gt;, &lt;code&gt;ordered&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;input_table_paths&lt;/code&gt; — list of input tables with full paths (cannot be empty).&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;output_table_path&lt;/code&gt; — full path to the output table.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;combine_chunks&lt;/code&gt; (false) — activates the consolidation of chunks.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;force_transform&lt;/code&gt; (false) — forces the read of all the input table data.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;merge_by&lt;/code&gt; — list of columns used for sorted merge.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;job_count&lt;/code&gt;, &lt;code&gt;data_size_per_job&lt;/code&gt; (256 MB) — options specifying how many jobs should be started (these are recommendations). The &lt;code&gt;job_count&lt;/code&gt; option takes precedence over &lt;code&gt;data_size_per_job&lt;/code&gt;. If &lt;code&gt;job_count&lt;/code&gt; is less than or equal to &lt;code&gt;total_input_row_count&lt;/code&gt;, the number of jobs for the unordered/ordered merge operation is guaranteed to be met exactly, so long as it does not conflict with the limit on the maximum number of jobs for the operation. In particular, if &lt;code&gt;job_count&lt;/code&gt; is equal to&lt;code&gt;total_input_row_count&lt;/code&gt;, then each job gets exactly one row, and if &lt;code&gt;job_count&lt;/code&gt; equals 1, only one job is launched.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;schema_inference_mode&lt;/code&gt; (auto) — schema definition mode. Possible values: auto, from_input, from_output. To learn more, see &lt;a href=\"user-guide/storage/static-schema.html#schema_inference\"&gt;Data schema&lt;/a&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;If the &lt;code&gt;force_transform&lt;/code&gt; option is &lt;code&gt;false&lt;/code&gt;, the operation proceeds in such a way as to minimize the number of running jobs. The best scenario will have the merge carried out on the meta-information level. Otherwise, all chunks will be read.&lt;/p&gt;\n&lt;p&gt;In addition to disk space, data also uses the chunk quota of the account where it is located. It is a good idea to run the Merge operation even on a single table to “consolidate” the existing chunks. To do this, enable &lt;code&gt;combine_chunks=true&lt;/code&gt;. To learn more about account quotas, see &lt;a href=\"user-guide/storage/quotas.html\"&gt;Quotas&lt;/a&gt;.&lt;/p&gt;\n&lt;h2 id=\"example-specification\"&gt;&lt;a href=\"en/user-guide/data-processing/operations/merge.html#example-specification\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Example specification&lt;/span&gt;&lt;/a&gt;Example specification&lt;/h2&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs yaml\"&gt;{\n  &lt;span class=\"hljs-string\"&gt;pool&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;=&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;\"my_cool_pool\"&lt;/span&gt;&lt;span class=\"hljs-string\"&gt;;&lt;/span&gt;\n  &lt;span class=\"hljs-string\"&gt;mode&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;=&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;\"sorted\"&lt;/span&gt;&lt;span class=\"hljs-string\"&gt;;&lt;/span&gt;\n  &lt;span class=\"hljs-string\"&gt;merge_by&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;=&lt;/span&gt; [ &lt;span class=\"hljs-string\"&gt;\"field1\"&lt;/span&gt;&lt;span class=\"hljs-string\"&gt;;&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;\"field2\"&lt;/span&gt; ]&lt;span class=\"hljs-string\"&gt;;&lt;/span&gt;\n  &lt;span class=\"hljs-string\"&gt;job_count&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;=&lt;/span&gt; &lt;span class=\"hljs-number\"&gt;100&lt;/span&gt;&lt;span class=\"hljs-string\"&gt;;&lt;/span&gt;\n  &lt;span class=\"hljs-string\"&gt;input_table_paths&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;=&lt;/span&gt; [ &lt;span class=\"hljs-string\"&gt;\"//tmp/input_table1\"&lt;/span&gt;&lt;span class=\"hljs-string\"&gt;;&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;\"//tmp/input_table2\"&lt;/span&gt; ]&lt;span class=\"hljs-string\"&gt;;&lt;/span&gt;\n  &lt;span class=\"hljs-string\"&gt;output_table_path&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;=&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;\"//tmp/output_table\"&lt;/span&gt;&lt;span class=\"hljs-string\"&gt;;&lt;/span&gt;\n  &lt;span class=\"hljs-string\"&gt;combine_chunks&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;=&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;%true;&lt;/span&gt;\n}\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"77\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-77\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-77\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-77.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"en/user-guide/data-processing/operations/merge.md","sourcePath":"en/user-guide/data-processing/operations/merge.md"},"headings":[{"title":"Example specification","href":"en/user-guide/data-processing/operations/merge.html#example-specification","level":2}],"title":"Merge"},"router":{"pathname":"en/user-guide/data-processing/operations/merge","depth":5,"base":"../../../../"},"lang":"en","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/en/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-a29ea7877730322f2ce693378d06d02ac2b374cd-en","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
