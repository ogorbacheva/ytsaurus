        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;For static tables, YTsaurus supports automatic chunk merge on the master server side. Unlike the &lt;a href=\"user-guide/data-processing/operations/merge.html\"&gt;Merge&lt;/a&gt; operation, this method doesn't use the computing resources of the pool.&lt;/p&gt;\n&lt;p&gt;To enable automatic chunk merge, set the &lt;code&gt;@chunk_merger_mode&lt;/code&gt; table attribute to one of the values below:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;strong&gt;shallow&lt;/strong&gt;: Merge chunks at the metadata level, without recompression. This approach works only if the chunks are \"similar\" enough (have the same sort order, schema, compression codec, etc.). The resulting chunk may also have too many &lt;a href=\"user-guide/storage/chunks.html#chunk-size\"&gt;blocks&lt;/a&gt; at a certain point.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;deep&lt;/strong&gt;: Merge chunks with full recompression (by reading all input chunks and writing to a new one). This mode is much more expensive than the previous one, but it allows you to merge chunks with different characteristics if they end up in the same table. You can also use this mode to remove small blocks or chunks in older formats.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;auto&lt;/strong&gt; (recommended): Merge chunks in shallow mode with rollback to deep mode in case of failure.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;We recommend using &lt;code&gt;auto&lt;/code&gt; by default (other modes are allowed as well, but you should switch to them only if you have a good idea of why you need to do that):&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;$ yt &lt;span class=\"hljs-built_in\"&gt;set&lt;/span&gt; //home/dir_with_tables/table_i_want_to_merge/@chunk_merger_mode auto\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"26\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-26\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-26\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-26.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;If you need to merge all tables in a particular subtree, you can set the attribute for the entire directory:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;$ yt &lt;span class=\"hljs-built_in\"&gt;set&lt;/span&gt; //home/dir_with_tables/@chunk_merger_mode auto\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"30\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-30\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-30\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-30.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Note&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;This mechanism works only for static tables. Dynamic tables have their own chunk merge mechanisms. Setting the &lt;code&gt;chunk_merger_mode&lt;/code&gt; attribute for them won't do anything.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Please note that &lt;code&gt;chunk_merger_mode&lt;/code&gt; is an &lt;a href=\"user-guide/storage/chunks.html#common\"&gt;inheritable attribute&lt;/a&gt;. Once it is set, all new tables in the directory will inherit its value, but nothing will change for the old ones, meaning you should go over all the tables when enabling this attribute.&lt;/p&gt;\n&lt;p&gt;Chunks are merged when the attribute is set and every time a write is made to the table (on additional writes, the system will attempt to remerge only the end of the table for optimization purposes).&lt;/p&gt;\n&lt;h2 id=\"merge-attributes-on-the-account\"&gt;&lt;a href=\"en/user-guide/data-processing/operations/chunk-merger.html#merge-attributes-on-the-account\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Merge attributes on the account&lt;/span&gt;&lt;/a&gt;Merge attributes on the account&lt;/h2&gt;\n&lt;p&gt;Every account contains attributes for controling the chunk merge mechanism:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;allow_using_chunk_merger&lt;/code&gt;: Whether it is allowed to merge chunks for tables of this account.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;chunk_merger_node_traversal_concurrency&lt;/code&gt;: The number of tables for which merge jobs can be scheduled concurrently.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;merge_job_rate_limit&lt;/code&gt;: The number of jobs that can be scheduled per second.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;The default settings allow automatic chunk merge for every account.&lt;/p&gt;\n&lt;h2 id=\"about-troubleshooting\"&gt;&lt;a href=\"en/user-guide/data-processing/operations/chunk-merger.html#about-troubleshooting\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;About troubleshooting&lt;/span&gt;&lt;/a&gt;About troubleshooting&lt;/h2&gt;\n&lt;p&gt;Tables have several system attributes for finding out the current chunk merge status. These attributes aren't displayed in the web interface but can be queried via the CLI.&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;@chunk_merger_status&lt;/code&gt;: The table status in the merge pipeline, can take the &lt;code&gt;not_in_merge_pipeline&lt;/code&gt;, &lt;code&gt;awaiting_merge&lt;/code&gt;, and &lt;code&gt;in_merge_pipeline&lt;/code&gt; values. It may take a significant amount of time for the merger to halt all activities on the table after the chunk merge trigger activates. If you've set &lt;code&gt;chunk_merger_mode&lt;/code&gt; for the table, but the chunks in it are still small, look at &lt;code&gt;chunk_merger_status&lt;/code&gt; and wait for it to change to &lt;code&gt;not_in_merge_pipeline&lt;/code&gt;.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;@chunk_merger_traversal_info/chunk_count&lt;/code&gt;: The number of chunks already processed by the merger and which won't be merged any further. You can use this to understand which chunks won't be merged.&lt;/p&gt;\n&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Suppose a merge was performed on a table and left it with 1000 chunks, and now you want to append data to the end of the table. There's no point in going over the chunks from the very beginning after each write: if they weren't merged before, this won't be needed now. However, you may need to merge a newly added chunk with some of the last chunks from the old ones. If &lt;code&gt;@chunk_merger_traversal_info/chunk_count&lt;/code&gt; is, let's say, 980, then only the last 20 chunks will be considered in the future to become merged with new chunks after future writes.&lt;/p&gt;\n&lt;p&gt;Automatic chunk merge doesn't acquire locks on tables, so chunk merge is unnoticed and does not interfere with other processes. This, however, has a negative side effect: such merges may occasionally fail (for example, if the table was completely overwritten with new data during the merge). The system automatically retries failed merges if possible (this may not be possible if the table was deleted or became dynamic). However, if the table is often overwritten with new data, this process can take a long time to complete.&lt;/p&gt;\n&lt;h2 id=\"metrics-in-prometheus\"&gt;&lt;a href=\"en/user-guide/data-processing/operations/chunk-merger.html#metrics-in-prometheus\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Metrics in Prometheus&lt;/span&gt;&lt;/a&gt;Metrics in Prometheus&lt;/h2&gt;\n&lt;p&gt;The following time series are used in Prometheus to collect chunk merge metrics:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;yt.chunk_server.chunk_merger_account_queue_size&lt;/code&gt;: Account-based chunk merge queues. If the account queue is empty, make sure that the correct attribute is set for all required tables. Also make sure that the account settings allow table merges: the &lt;code&gt;allow_using_chunk_merger&lt;/code&gt; attribute is set to &lt;code&gt;true&lt;/code&gt; and the &lt;code&gt;chunk_merger_node_traversal_concurrency&lt;/code&gt; and &lt;code&gt;merge_job_rate_limit&lt;/code&gt; attributes aren't set to 0.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;yt.chunk_server.chunk_merger_chunk_replacements_succeeded&lt;/code&gt;: The number of successful merges.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;yt.chunk_server.chunk_merger_chunk_replacements_failed&lt;/code&gt;: The number of failed merges.&lt;/p&gt;\n&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Having a certain number of failed merges is normal, and you can't get rid of them completely. But if there are more failed merges than successful ones, this is something that you want to take note of. One possible reason could be that chunk merge is enabled for tables that are constantly overwritten from scratch with new data or for tables with a short lifetime. In this case, it's best to disable automatic merge for such tables.&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"en/user-guide/data-processing/operations/chunk-merger.md","sourcePath":"en/user-guide/data-processing/operations/chunk-merger.md"},"headings":[{"title":"Merge attributes on the account","href":"en/user-guide/data-processing/operations/chunk-merger.html#merge-attributes-on-the-account","level":2},{"title":"About troubleshooting","href":"en/user-guide/data-processing/operations/chunk-merger.html#about-troubleshooting","level":2},{"title":"Metrics in Prometheus","href":"en/user-guide/data-processing/operations/chunk-merger.html#metrics-in-prometheus","level":2}],"title":"Chunk auto-merge on the master server side"},"router":{"pathname":"en/user-guide/data-processing/operations/chunk-merger","depth":5,"base":"../../../../"},"lang":"en","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/en/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-a29ea7877730322f2ce693378d06d02ac2b374cd-en","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
        </script>
