            {"data":{"leading":false,"html":"&lt;p&gt;How the MapReduce operation works:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;On cluster nodes, the map phase starts. Each user script in the map phase (mapper) receives a separate part of the input table for input. The output data of the map phase is partitioned based on the hash value of a key. The resulting partitioned data is stored locally on the disk (replicated once), at the nodes where the map jobs were executed.&lt;/li&gt;\n&lt;li&gt;Next comes the reduce phase. Each user script in the reduce phase (reducer) handles one partition: as input, it receives all the records received from mappers whose hashed key has the specified value. Over the network, the reducer fetches the data corresponding to its partition from the cluster nodes where the map jobs were executed. This process is called &lt;strong&gt;shuffle&lt;/strong&gt;, and it produces the highest load on the network. Each partition is sorted in memory by key, and if the keys match, by subkey. The sorted data then becomes input for a reduce job. The reduce job's output is written to the disk and replicated as needed — usually it is two synchronous replicas and one asynchronous, with one synchronous replica being written locally.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;&lt;img src=\"images/mapreduce_op1.png\" alt=\"\" class=\"center\" /&gt;&lt;/p&gt;\n&lt;p&gt;The MapReduce operation is similar to the &lt;a href=\"user-guide/data-processing/operations/sort.html\"&gt;Sort&lt;/a&gt; operation, but allows for executing a mapper user script before partitioning jobs, and a reducer user script after sorting jobs.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Attention&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Functionally, MapReduce is not the same as Map + Sort + Reduce. Even if the user script in the reduce phase does not change key column values, you still cannot get a sorted table as the operation's output. Therefore, using MapReduce in combination with the &lt;code&gt;sorted_by&lt;/code&gt; attribute on the output table is almost always incorrect. The error will make itself known only on fairly large tables, which do not fit into a single reduce job in their entirety.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;In the merged MapReduce operation:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;The user may go without specifying the mapper, in which case it is assumed to be identical, and the input table data is output from the map phase without processing. In YTsaurus terms, a user-defined mapper determines which jobs will be running: partition map jobs (if a user-defined mapper is present) or partition jobs (if there isn't one).&lt;/li&gt;\n&lt;li&gt;If the partition is too large and cannot be stored in memory, it is impossible to sort it on a single cluster node. In these cases, the partition is divided into parts, each part is sorted separately, and the result is locally written to the disk. After that, &lt;a href=\"https://en.wikipedia.org/wiki/K-way_merge_algorithm\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;multiway merge&lt;/a&gt; is launched, which merges the data and feeds it to a reduce job's input. In YTsaurus terms, sorting a small partition in memory is done through partition reduce jobs. If the partition is large, then partition sorting is performed with partition sort jobs, and the final merge and launch of the reducer is handled by sorted_reduce jobs.&lt;/li&gt;\n&lt;li&gt;Until map jobs finish, you cannot start reduce jobs. This is because the YTsaurus system must supply reduce jobs with data ordered by subkey, and that sequence cannot be generated until the data (map job outputs) is completed. A barrier of sorts therefore exists between the map and reduce phases — they must not intersect in time.&lt;br /&gt;\nIf the scheduler detects a large partition that cannot be sorted within one job, it has an opportunity to save time and start processing the partitioned data before all map jobs finish. The scheduler, at its own discretion, divides the partition into several parts. The individual parts are then sorted on different cluster nodes by intermediate sort jobs, which take this data in over the network and sort it. This technique allows for a partial overlap of the phases, shortening the operation time.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;h2 id=\"mapreduce-vs-map-sort-reduce\"&gt;&lt;a href=\"en/user-guide/data-processing/operations/mapreduce.html#mapreduce-vs-map-sort-reduce\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;MapReduce vs Map + Sort + Reduce&lt;/span&gt;&lt;/a&gt;MapReduce vs Map + Sort + Reduce&lt;/h2&gt;\n&lt;p&gt;The merged MapReduce operation has several advantages over the &lt;a href=\"user-guide/data-processing/operations/map.html\"&gt;Map&lt;/a&gt; + &lt;a href=\"user-guide/data-processing/operations/sort.html\"&gt;Sort&lt;/a&gt; + &lt;a href=\"user-guide/data-processing/operations/reduce.html\"&gt;Reduce&lt;/a&gt; combination:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;strong&gt;Less I/O operations on intermediate data.&lt;/strong&gt; Without the merge phase, map-sort-reduce typically writes intermediate data to disk three times: after the map phase, after the partition sort phase, and after sorting. Some of these writes may have a replication factor other than 1. For a MapReduce operation, a single write to disk will suffice, and the replication factor will be 1.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;No unnecessary barriers (synchronization points).&lt;/strong&gt; With the map-sort-reduce combination, YTsaurus is forced to wait for &lt;strong&gt;all&lt;/strong&gt; the map jobs (including the longest ones) to finish before starting partitioning. Similarly, sorting needs to be completed before the first reduce jobs can be run. As for the merged MapReduce operation, there is only one inevitable synchronization point: reduce jobs cannot be started before map jobs run their course.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Better fault tolerance.&lt;/strong&gt; MapReduce constitutes a single operation, so the scheduler does everything it can to complete it even when some intermediate data becomes unavailable. When it comes to a chain of independent operations, the scheduler is only concerned with the individual phases. The only way to combat this is to ramp up intermediate data replication, which severely impacts speed.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;&lt;img src=\"images/mapreduce_op2.png\" alt=\"\" class=\"center\" /&gt;&lt;/p&gt;\n&lt;h3 id=\"usage-notes\"&gt;&lt;a href=\"en/user-guide/data-processing/operations/mapreduce.html#usage-notes\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Usage notes&lt;/span&gt;&lt;/a&gt;Usage notes&lt;/h3&gt;\n&lt;p&gt;To merge the Map + Sort + Reduce combination into a single MapReduce operation, pass both the mapper and reducer options in the operation's specification.&lt;/p&gt;\n&lt;p&gt;In some cases, users may find the merged MapReduce operation not fast enough on default settings. The reasons may be:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;strong&gt;Significant difference between the data volume at the mapper's input and output, which leads to the scheduler misjudging the number of partitions.&lt;/strong&gt;&lt;/p&gt;\n&lt;p&gt;The scheduler estimates the partition number based on the amount of input data as it aims to ensure the partition fully fits into the sort job's memory (2 GB by default). In doing that, the scheduler assumes that the input for the mapper approximately equals its output.&lt;/p&gt;\n&lt;p&gt;In practice, the mapper may be filtering input data with an output-to-input ratio of 1:1000 or less. As a result, each partition's buffer gets something like several records, which leads to a large number of random, small-portioned reads from the disk in the shuffle process at the beginning of the sort phase.&lt;/p&gt;\n&lt;p&gt;Example: Let's say a partition map job is input with 2 GB of data, produces an output of 4 MB, and the &lt;code&gt;partition_count&lt;/code&gt; is 1000. Then, the average pre-compression size of a block written by the partition map job will be around 2 KB. Such blocks cause a huge number of instances of random access to the disk.&lt;/p&gt;\n&lt;p&gt;To combat this problem, the &lt;code&gt;map_selectivity_factor&lt;/code&gt; option was added to an operation's specification, allowing users to set the approximate output-to-input ratio at the start of the operation and improve the scheduler's estimates. Alternatively, you can explicitly specify the desired number of reduce jobs using the &lt;code&gt;partition_count&lt;/code&gt; option.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;strong&gt;\"Heavy\" mappers and a small number of parallel jobs due to memory shortage.&lt;/strong&gt;&lt;/p&gt;\n&lt;p&gt;The scheduler allocates resources for a job based on the memory required for the user-provided code (&lt;code&gt;memory_limit&lt;/code&gt;, set by the user in the operation's specification) and the memory for the system elements (JobProxy). For a map job (within the Map operation), the memory is made up of &lt;code&gt;memory_limit&lt;/code&gt;, the read buffer, and the write buffer.&lt;/p&gt;\n&lt;p&gt;Example: Let's say the &lt;code&gt;memory_limit&lt;/code&gt; is 250 MB and the buffer sizes are 100 + 100 MB, totaling 450 MB per job. If the fair_share distribution for the operation is 0.1 and the total amount of the cluster's resources is 11 TB of memory and 7000 CPUs, then the resources at the operation's disposal are 0.1 * 11 TB = 1.1 TB, and 0.1 * 7000 = 700 CPUs. Therefore, min(1100 GB / 450 MB, 700) = min(2500, 700) = 700 jobs can run in parallel.&lt;/p&gt;\n&lt;p&gt;For partition map jobs, memory is the sum of &lt;code&gt;memory_limit&lt;/code&gt;, read buffer, and partition buffer. For operations with many partitions, the scheduler allocates to the partition map job a large amount of memory for the partition buffer so as to avoid small blocks. For example, given 1000 partitions and a 2 GB buffer, the worst-case block size will be 2 GB / 1000 = 2 MB (with even data distribution). Going back to our previous example, memory amount for a partition map job will be 250 MB + 100 MB + 2 GB ≈ 2400 MB, and with 1.1 TB of available memory the scheduler will be able to run only min(1100 GB / 2400 MB, 700) = min(470, 700) = 470 jobs in parallel.&lt;/p&gt;\n&lt;p&gt;If the mapper is \"heavy\" (high CPU usage per unit of output data), then tamping down on concurrent operations will lead to a significant hike in the execution time and cancel out any possible gains from merging the map and partition phases. Since the typical size of the output from the filter mapper is very small, such a mapper should also be considered \"heavy\".&lt;/p&gt;\n&lt;p&gt;The best solution in this situation is to use the Map + MapReduce combination (with a trivial mapper). This already results in higher intermediate data storage metrics compared to the Map + Sort + Reduce combination.&lt;/p&gt;\n&lt;/li&gt;\n&lt;/ol&gt;\n&lt;h3 id=\"measurement-results\"&gt;&lt;a href=\"en/user-guide/data-processing/operations/mapreduce.html#measurement-results\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Measurement results&lt;/span&gt;&lt;/a&gt;Measurement results&lt;/h3&gt;\n&lt;p&gt;A good example of the improvement in performance is the classic &lt;a href=\"https://en.wikipedia.org/wiki/Word_count\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;WordCount&lt;/a&gt; problem. It boils down to a single MapReduce operation, wherein the mapper aggregates data by key.&lt;/p&gt;\n&lt;p&gt;The table shows the different times it took to solve a WordCount problem using the merged MapReduce operation, the Map + Sort + Reduce sequence, and Map + MapReduce (the last using a trivial mapper).&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Operation&lt;/th&gt;\n&lt;th&gt;Time&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;MapReduce&lt;/td&gt;\n&lt;td&gt;03:25&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Map + MapReduce&lt;/td&gt;\n&lt;td&gt;05:30&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Map + Sort + Reduce&lt;/td&gt;\n&lt;td&gt;08:10&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;These results were collected on a cluster with 200 nodes, each having 48 GB of RAM and 24 cores for jobs. The input data size was 1 TB.&lt;/p&gt;\n&lt;h2 id=\"mapreduce-operation-options\"&gt;&lt;a href=\"en/user-guide/data-processing/operations/mapreduce.html#mapreduce-operation-options\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;MapReduce operation options&lt;/span&gt;&lt;/a&gt;MapReduce operation options&lt;/h2&gt;\n&lt;p&gt;General parameters for all operation types are described in &lt;a href=\"user-guide/data-processing/operations/operations-options.html\"&gt;Operation options&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;The MapReduce operation supports the following additional options (default values, if set, are specified in brackets):&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;mapper&lt;/code&gt; — user-defined script for the map phase. If not specified, input table data is output by the operation without processing.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;reducer&lt;/code&gt; — user-defined script for the reduce phase.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;reduce_combiner&lt;/code&gt; — description of the reduce_combiner script (more details &lt;a href=\"en/user-guide/data-processing/operations/mapreduce.html#reduce_combiner\"&gt;below&lt;/a&gt;).&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;sort_by&lt;/code&gt; (defaults to &lt;code&gt;reduce_by&lt;/code&gt;) — list of columns used for sorting data input at the reduce phase. The sequence of the &lt;code&gt;reduce_by&lt;/code&gt; fields should be set as the prefix of the &lt;code&gt;sort_by&lt;/code&gt; field sequence.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;reduce_by&lt;/code&gt; — list of columns used for grouping.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;input_table_paths&lt;/code&gt; — list of input tables with full paths (must not be empty).&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;output_table_paths&lt;/code&gt; — list of output tables.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;mapper_output_table_count&lt;/code&gt; — number of tables from &lt;code&gt;output_table_paths&lt;/code&gt; that will be output at the map phase. For such tables, the job's &lt;code&gt;table_index&lt;/code&gt; is counted from one, and the intermediate output is a null output table.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;partition_count&lt;/code&gt;, &lt;code&gt;partition_data_size&lt;/code&gt; — options that specify how many partitions are to be made in the sorting process.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;map_job_count&lt;/code&gt;, &lt;code&gt;data_weight_per_map_job&lt;/code&gt; — options that indicate how many jobs should be run at the map phase (these serve as recommendations).&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;data_weight_per_sort_job&lt;/code&gt; — option to control the amount of data at the &lt;code&gt;reduce_combiner&lt;/code&gt; input (more details &lt;a href=\"en/user-guide/data-processing/operations/mapreduce.html#reduce_combiner\"&gt;below&lt;/a&gt;).&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;force_reduce_combiners&lt;/code&gt; (false) — forces the launch of &lt;code&gt;reduce_combiner&lt;/code&gt; (more details &lt;a href=\"en/user-guide/data-processing/operations/mapreduce.html#reduce_combiner\"&gt;below&lt;/a&gt;).&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;map_selectivity_factor&lt;/code&gt; (1.0) — proportion of the original amount of data that remains after the map phase (the default value is 1.0, which means the expected size of the data remains unchanged during the map phase; 2.0 means the data size doubles, and so on).&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;intermediate_data_replication_factor&lt;/code&gt; (1) — replication factor for intermediate data.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;intermediate_data_account&lt;/code&gt; (intermediate) — account to whose quota the transaction's intermediate data goes.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;intermediate_data_medium&lt;/code&gt; (default) — &lt;a href=\"user-guide/storage/media.html\"&gt;type of medium&lt;/a&gt; to write chunks of intermediate data to.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;intermediate_compression_codec&lt;/code&gt; (lz4) — codec used for compressing intermediate data.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;intermediate_data_acl&lt;/code&gt; &lt;code&gt;({action=allow;subjects=[everyone];permissions=[read]})&lt;/code&gt; — permissions for accessing intermediate data that are set up following the map phase.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;map_job_io, sort_job_io, reduce_job_io&lt;/code&gt; — I/O settings for the respective job types; in the &lt;code&gt;reduce_job_io&lt;/code&gt; option, the &lt;code&gt;table_writer&lt;/code&gt; section is added for all jobs that write to output tables.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;sort_locality_timeout&lt;/code&gt; (1 min) — time during which the scheduler waits for resources to free up on specific cluster nodes in order to start sorting all the parts of each partition on a node. This is necessary to ensure higher read locality in the course of the subsequent merging of sorted data.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;ordered&lt;/code&gt; (false) — enables the logic that is similar to ordered map at the partition map phase (input data is divided into jobs in successive segments, with the input of each map phase job being fed rows according to the order contained in the input tables).&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;pivot_keys&lt;/code&gt; — list of keys to be used for data partitioning at the reduce phase. This option is exactly the same as the corresponding reduce &lt;a href=\"user-guide/data-processing/operations/reduce.html\"&gt;option&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;compute_pivot_keys_from_samples&lt;/code&gt; (false) — enables automatic key generation for data partitioning using samples from the table. The option can be enabled only if &lt;code&gt;mapper&lt;/code&gt; is not specified.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;samples_per_partition&lt;/code&gt; (1000) — number of keys for samples from the table for each partition.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;reducer/enable_input_table_index&lt;/code&gt; / &lt;code&gt;reduce_combiner/enable_input_table_index&lt;/code&gt; (false) — whether to send the input table index to the &lt;code&gt;reduce&lt;/code&gt; / &lt;code&gt;reduce_combine&lt;/code&gt; phase (the &lt;code&gt;enable_input_table_index&lt;/code&gt; option is specified within the &lt;code&gt;reducer&lt;/code&gt; / &lt;code&gt;reduce_combiner&lt;/code&gt; section).&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;mapper/output_streams&lt;/code&gt; / &lt;code&gt;reduce_combiner/output_streams&lt;/code&gt; — description of intermediate output streams from the &lt;code&gt;map&lt;/code&gt; or &lt;code&gt;reduce_combine&lt;/code&gt; phase, more details &lt;a href=\"en/user-guide/data-processing/operations/mapreduce.html#output_streams\"&gt;below&lt;/a&gt; (the &lt;code&gt;output_streams&lt;/code&gt; option is specified within the &lt;code&gt;mapper&lt;/code&gt; / &lt;code&gt;reduce_combiner&lt;/code&gt; section).&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;disable_sorted_input_in_reducer&lt;/code&gt; (false) — disables the sorting of inputs of reduce jobs. Other guarantees are maintained. In particular, all rows with the same keys from &lt;code&gt;reduce_by&lt;/code&gt; columns will be sent to a single reduce job.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;By default (and for historical reasons), MapReduce operations support &lt;code&gt;table_index&lt;/code&gt; only in a mapper. If you need to have &lt;code&gt;table_index&lt;/code&gt; in a reducer, you can enable the &lt;code&gt;enable_input_table_index&lt;/code&gt; option within the &lt;code&gt;reducer&lt;/code&gt; (or &lt;code&gt;reduce_combiner&lt;/code&gt;) section. In the future, this option may be enabled by default. To enable sorting by &lt;code&gt;table_index&lt;/code&gt; in a reducer, you need to add a column with the name &lt;code&gt;$table_index&lt;/code&gt; to &lt;code&gt;sort_by&lt;/code&gt;.&lt;/p&gt;\n&lt;h2 id=\"reduce_combiner\"&gt;&lt;a href=\"en/user-guide/data-processing/operations/mapreduce.html#reduce_combiner\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Working with large keys — reduce_combiner&lt;/span&gt;&lt;/a&gt;Working with large keys — reduce_combiner&lt;/h2&gt;\n&lt;p&gt;The reduce phase has a special data processing stage for dealing with large keys. This stage's jobs are called &lt;strong&gt;reduce_combiner&lt;/strong&gt; jobs. They run on parts of \"large\" partitions and facilitate a partial reduce without waiting for all partition parts to get sorted and for reduce with the final merge to start. As input, reduce jobs running on partitions like that receive merged outputs of several &lt;code&gt;reduce_combiner&lt;/code&gt; jobs.&lt;/p&gt;\n&lt;p&gt;&lt;code&gt;Reduce_combiner&lt;/code&gt; is triggered if the partition size exceeds &lt;code&gt;data_weight_per_sort_job&lt;/code&gt;. The amount of data in &lt;code&gt;reduce_combiner&lt;/code&gt; equals &lt;code&gt;data_weight_per_sort_job&lt;/code&gt;. The default value for &lt;code&gt;data_weight_per_sort_job&lt;/code&gt; is set in the scheduler configuration, but can be overridden via an operation's specification (in bytes).&lt;/p&gt;\n&lt;p&gt;You can also force-start &lt;code&gt;reduce_combiner&lt;/code&gt; by setting &lt;code&gt;force_reduce_combiners&lt;/code&gt; to &lt;code&gt;true&lt;/code&gt;. &lt;code&gt;Reduce_combiner&lt;/code&gt; receives a sorted stream of records as input (like a regular reducer). However, these records do not necessarily form a continuous range in &lt;code&gt;sort_by&lt;/code&gt; order. If two given records end up the &lt;code&gt;reduce_combiner&lt;/code&gt; job, there may be records between them (in &lt;code&gt;sort_by&lt;/code&gt; order) that are not in this job.&lt;/p&gt;\n&lt;p&gt;There are several restrictions on the &lt;code&gt;reduce_combiner&lt;/code&gt; output:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;The output must be sorted.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;reduce_combiner&lt;/code&gt; must not change keys — columns specified in the specification's &lt;code&gt;sort_by&lt;/code&gt; field (if not specified — in the &lt;code&gt;reduce_by&lt;/code&gt; field).&lt;/li&gt;\n&lt;li&gt;There must be only one output table, as in the map phase of the &lt;code&gt;MapReduce&lt;/code&gt; operation.&lt;br /&gt;\nThis means that any commutative and associative reducer can be used as &lt;code&gt;reduce_combiner&lt;/code&gt; in its original form.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Starting an operation with &lt;code&gt;reduce_combiner&lt;/code&gt; may look like this:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;yt map-reduce --reduce-combiner cat --reducer cat --reduce-by cookies --src //statbox/access-log/2013-05-15 --dst //tmp/asd --format dsv\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"359\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-359\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-359\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-359.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"output_streams\"&gt;&lt;a href=\"en/user-guide/data-processing/operations/mapreduce.html#output_streams\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Intermediate streams&lt;/span&gt;&lt;/a&gt;Intermediate streams&lt;/h2&gt;\n&lt;p&gt;In ordinary cases, intermediate data streams between &lt;code&gt;map&lt;/code&gt;, &lt;code&gt;reduce_combine&lt;/code&gt;, and &lt;code&gt;reduce&lt;/code&gt; phases have no schema. However, a schema is required to work with composite data types and some efficient formats. To set data schemas for these intermediate streams, use the &lt;code&gt;output_streams&lt;/code&gt; option.&lt;/p&gt;\n&lt;p&gt;The option is specified in the &lt;code&gt;mapper&lt;/code&gt; / &lt;code&gt;reduce_combiner&lt;/code&gt; sections and must contain a list of dictionaries with the following keys:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;schema&lt;/code&gt; — YSON description of the stream schema.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;If the option is specified, the user code can assume that it writes to multiple virtual tables (by the number of items in the &lt;code&gt;output_streams&lt;/code&gt; list). The next phase gets combined data from all intermediate tables and can use &lt;code&gt;table_index&lt;/code&gt; of input data to determine which stream a particular row came from.&lt;/p&gt;\n&lt;p&gt;If both &lt;code&gt;mapper/output_streams&lt;/code&gt; and &lt;code&gt;mapper_output_table_count&lt;/code&gt; options are specified, then first comes intermediate data followed by output data. That is, intermediate data will have &lt;code&gt;table_index = 0 ... len(mapper.output_streams)-1&lt;/code&gt; while output tables will have &lt;code&gt;table_index = len(mapper.output_streams) ... len(mapper.output_streams) + mapper_output_table_count&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Example in the specification:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;mapper = {\n  output_streams = [\n    {\n      \"schema\" = [\n        {\n          name=key;\n          type= ...\n        };\n        ...\n      ]\n    },\n  ]\n}\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"385\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-385\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-385\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-385.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"example-specification\"&gt;&lt;a href=\"en/user-guide/data-processing/operations/mapreduce.html#example-specification\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Example specification&lt;/span&gt;&lt;/a&gt;Example specification&lt;/h2&gt;\n&lt;p&gt;Example of a MapReduce operation's specification:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs yaml\"&gt;{\n  &lt;span class=\"hljs-string\"&gt;partition_count&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;=&lt;/span&gt; &lt;span class=\"hljs-number\"&gt;100&lt;/span&gt;&lt;span class=\"hljs-string\"&gt;;&lt;/span&gt;\n  &lt;span class=\"hljs-string\"&gt;reduce_by&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;=&lt;/span&gt; [&lt;span class=\"hljs-string\"&gt;\"key\"&lt;/span&gt;]&lt;span class=\"hljs-string\"&gt;;&lt;/span&gt;\n  &lt;span class=\"hljs-string\"&gt;sort_by&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;=&lt;/span&gt; [&lt;span class=\"hljs-string\"&gt;\"key\"&lt;/span&gt;&lt;span class=\"hljs-string\"&gt;;&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;\"subkey\"&lt;/span&gt; ]&lt;span class=\"hljs-string\"&gt;;&lt;/span&gt;\n  &lt;span class=\"hljs-string\"&gt;input_table_paths&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;=&lt;/span&gt; [ &lt;span class=\"hljs-string\"&gt;\"//tmp/input_table\"&lt;/span&gt; ]&lt;span class=\"hljs-string\"&gt;;&lt;/span&gt;\n  &lt;span class=\"hljs-string\"&gt;output_table_paths&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;=&lt;/span&gt; [ &lt;span class=\"hljs-string\"&gt;\"//tmp/first_output_table\"&lt;/span&gt;&lt;span class=\"hljs-string\"&gt;;&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;//tmp/second_output_table\"&lt;/span&gt; ]&lt;span class=\"hljs-string\"&gt;;&lt;/span&gt;\n  &lt;span class=\"hljs-string\"&gt;mapper&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;=&lt;/span&gt; {\n    &lt;span class=\"hljs-string\"&gt;command&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;=&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;\"python my_mapper.py\"&lt;/span&gt;&lt;span class=\"hljs-string\"&gt;;&lt;/span&gt;\n    &lt;span class=\"hljs-string\"&gt;file_paths&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;=&lt;/span&gt; [ &lt;span class=\"hljs-string\"&gt;\"//tmp/my_mapper.py\"&lt;/span&gt; ]&lt;span class=\"hljs-string\"&gt;;&lt;/span&gt;\n    &lt;span class=\"hljs-string\"&gt;tmpfs_path&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;=&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;\".\"&lt;/span&gt;&lt;span class=\"hljs-string\"&gt;;&lt;/span&gt;\n    &lt;span class=\"hljs-string\"&gt;tmpfs_size&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;=&lt;/span&gt; &lt;span class=\"hljs-number\"&gt;1000000&lt;/span&gt;&lt;span class=\"hljs-string\"&gt;;&lt;/span&gt;\n    &lt;span class=\"hljs-string\"&gt;copy_files&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;=&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;%true;&lt;/span&gt;\n  }&lt;span class=\"hljs-string\"&gt;;&lt;/span&gt;\n  &lt;span class=\"hljs-string\"&gt;reducer&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;=&lt;/span&gt; {\n    &lt;span class=\"hljs-string\"&gt;command&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;=&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;\"python my_reducer.py\"&lt;/span&gt;&lt;span class=\"hljs-string\"&gt;;&lt;/span&gt;\n    &lt;span class=\"hljs-string\"&gt;file_paths&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;=&lt;/span&gt; [ &lt;span class=\"hljs-string\"&gt;\"//tmp/my_reducer.py\"&lt;/span&gt; ]&lt;span class=\"hljs-string\"&gt;;&lt;/span&gt;\n  }&lt;span class=\"hljs-string\"&gt;;&lt;/span&gt;\n}\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"392\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-392\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-392\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-392.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"en/user-guide/data-processing/operations/mapreduce.md","sourcePath":"en/user-guide/data-processing/operations/mapreduce.md"},"headings":[{"title":"MapReduce vs Map + Sort + Reduce","href":"en/user-guide/data-processing/operations/mapreduce.html#mapreduce-vs-map-sort-reduce","level":2,"items":[{"title":"Usage notes","href":"en/user-guide/data-processing/operations/mapreduce.html#usage-notes","level":3},{"title":"Measurement results","href":"en/user-guide/data-processing/operations/mapreduce.html#measurement-results","level":3}]},{"title":"MapReduce operation options","href":"en/user-guide/data-processing/operations/mapreduce.html#mapreduce-operation-options","level":2},{"title":"Working with large keys — reduce_combiner","href":"en/user-guide/data-processing/operations/mapreduce.html#reduce_combiner","level":2},{"title":"Intermediate streams","href":"en/user-guide/data-processing/operations/mapreduce.html#output_streams","level":2},{"title":"Example specification","href":"en/user-guide/data-processing/operations/mapreduce.html#example-specification","level":2}],"title":"MapReduce"},"router":{"pathname":"en/user-guide/data-processing/operations/mapreduce","depth":5,"base":"../../../../"},"lang":"en","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/en/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-a29ea7877730322f2ce693378d06d02ac2b374cd-en","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
