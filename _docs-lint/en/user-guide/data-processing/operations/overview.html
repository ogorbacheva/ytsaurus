        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;This section defines the data processing operations available in the YTsaurus system. It also introduces the concepts of a user script and a job, which make up an operation, and describes the possible states of operations and jobs.&lt;/p&gt;\n&lt;h2 id=\"overview\"&gt;&lt;a href=\"en/user-guide/data-processing/operations/overview.html#overview\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Overview&lt;/span&gt;&lt;/a&gt;Overview&lt;/h2&gt;\n&lt;p&gt;YTsaurus supports the following data processing operations:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;strong&gt;&lt;a href=\"user-guide/data-processing/operations/map.html\"&gt;Map&lt;/a&gt;, &lt;a href=\"user-guide/data-processing/operations/reduce.html\"&gt;Reduce&lt;/a&gt;, and &lt;a href=\"user-guide/data-processing/operations/mapreduce.html\"&gt;MapReduce&lt;/a&gt;&lt;/strong&gt; execute user-provided code against input data.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;&lt;a href=\"user-guide/data-processing/operations/sort.html\"&gt;Sort&lt;/a&gt;&lt;/strong&gt; sorts input tables.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;&lt;a href=\"user-guide/data-processing/operations/merge.html\"&gt;Merge&lt;/a&gt;&lt;/strong&gt; merges tables.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;&lt;a href=\"user-guide/data-processing/operations/erase.html\"&gt;Erase&lt;/a&gt;&lt;/strong&gt; deletes specified data from a table.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;&lt;a href=\"user-guide/data-processing/operations/remote-copy.html\"&gt;RemoteCopy&lt;/a&gt;&lt;/strong&gt; copies data between clusters.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;&lt;a href=\"user-guide/data-processing/operations/vanilla.html\"&gt;Vanilla&lt;/a&gt;&lt;/strong&gt; launches an appropriate number of &lt;strong&gt;user scripts&lt;/strong&gt; on cluster nodes and keeps them running.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Each operation has a &lt;code&gt;spec&lt;/code&gt; parameter, which, as the name implies, conveys the operation's &lt;strong&gt;specification&lt;/strong&gt; (aka its options). The specification is a hierarchical structure that exists in the &lt;a href=\"user-guide/storage/formats.html#yson\"&gt;YSON format&lt;/a&gt;. Each operation type has its own specification structure, whose detailed description can be found in the subsections dedicated to specific operation types.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;User script&lt;/strong&gt; is a user-defined string that is executed via a &lt;code&gt;bash -c&lt;/code&gt; call, plus the parameters detailing the execution. User scripts run in a &lt;code&gt;sandbox&lt;/code&gt; environment, where they are executed by a service user that is not formally present in the system (referring to Linux system users) and that only has read/write rights for the current directory and for the &lt;code&gt;tmp&lt;/code&gt; directory. To learn more about user script parameters, see &lt;a href=\"user-guide/data-processing/operations/operations-options.html#user_script_options\"&gt;Operation options&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;Operations are run in &lt;strong&gt;compute pools&lt;/strong&gt;, which are structured as a tree and serve to allocate the cluster's compute resources. For more information, see &lt;a href=\"user-guide/data-processing/scheduler/scheduler-and-pools.html\"&gt;Scheduler and pools&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;Operations are comprised of &lt;strong&gt;jobs&lt;/strong&gt;. Jobs as units enable the parallelism of an operation. Input data fed to an operation is divided into parts, with each such part processed by one job.&lt;/p&gt;\n&lt;h2 id=\"parameters-of-a-running-operation\"&gt;&lt;a href=\"en/user-guide/data-processing/operations/overview.html#parameters-of-a-running-operation\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Parameters of a running operation&lt;/span&gt;&lt;/a&gt;Parameters of a running operation&lt;/h2&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Note&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;You can use the &lt;strong&gt;Operations&lt;/strong&gt; screen of the web interface to keep track of operation progress and results.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Another way to get the info you need is the get_operation call,&lt;br /&gt;\nwhich returns a set of operation attributes, the following being especially useful:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;state&lt;/code&gt; — current state of the operation.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;progress&lt;/code&gt; — operation progress broken down by job.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;spec&lt;/code&gt; — specification of the running operation.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;result&lt;/code&gt; — execution result (error report in case the operation ended with the &lt;code&gt;failed&lt;/code&gt; status).&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;By calling list_jobs, you can get the list of the operation's jobs (both running and completed).&lt;br /&gt;\nFor use cases of Python's &lt;code&gt;get_operation&lt;/code&gt; and &lt;code&gt;list_jobs&lt;/code&gt;, see \"Python Wrapper\".&lt;/p&gt;\n&lt;h3 id=\"status\"&gt;&lt;a href=\"en/user-guide/data-processing/operations/overview.html#status\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Operation statuses&lt;/span&gt;&lt;/a&gt;Operation statuses&lt;/h3&gt;\n&lt;p&gt;In the course of execution, an operation can have one of the following statuses:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;running&lt;/code&gt; — the operation is executing.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;pending&lt;/code&gt; — the operation is queued for launch. Each &lt;a href=\"user-guide/data-processing/scheduler/scheduler-and-pools.html\"&gt;pool&lt;/a&gt; has a limit on the number of simultaneously running operations, and, if it is exceeded, operations are sent to a queue.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;completed&lt;/code&gt; — the operation was successfully completed.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;failed&lt;/code&gt; — the operation encountered an error. The main possible reasons are failure to start due to incorrect parameters, or the threshold of jobs stopped due to an error being exceeded.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;aborted&lt;/code&gt; — the operation was aborted. The main possible reasons are it being interrupted by the user, or the transaction housing the operation being interrupted.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;reviving&lt;/code&gt; — the operation is being recovered following the restart of the &lt;a href=\"user-guide/data-processing/scheduler/scheduler-and-pools.html\"&gt;scheduler&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;initializing&lt;/code&gt;, &lt;code&gt;preparing&lt;/code&gt;, &lt;code&gt;materializing&lt;/code&gt;, &lt;code&gt;completing&lt;/code&gt;, &lt;code&gt;aborting&lt;/code&gt;, &lt;code&gt;failing&lt;/code&gt; — intermediate states of an operation that facilitate the step-by-step change of meta-information on the YTsaurus master server.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h3 id=\"job-states\"&gt;&lt;a href=\"en/user-guide/data-processing/operations/overview.html#job-states\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Job states&lt;/span&gt;&lt;/a&gt;Job states&lt;/h3&gt;\n&lt;p&gt;Each operation comprises a number of jobs. Like operations, jobs can have various states:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;running&lt;/code&gt; — the job is executing.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;completed&lt;/code&gt; — the job completed successfully.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;aborted&lt;/code&gt; — the job was interrupted. This normally occurs as a result of &lt;strong&gt;preemption&lt;/strong&gt; or network errors. To learn more about preemption, see &lt;a href=\"user-guide/data-processing/scheduler/scheduler-and-pools.html\"&gt;Scheduler and pools&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;failed&lt;/code&gt; — the job encountered an error. This state usually results from errors in the user script. An error log (stderr) for the failed job has been generated and can be viewed. Such cases may also occur if the &lt;a href=\"user-guide/storage/cypress.html\"&gt;account&lt;/a&gt; in use has run out of space, meaning the job cannot write the result of its work.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;waiting&lt;/code&gt; — the job was sent to a cluster node, but is awaiting resources in a queue.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;aborting&lt;/code&gt; — the scheduler decided to interrupt the job, but the process on the cluster node has not yet ended.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;The operation page in the web interface shows the number of &lt;code&gt;pending&lt;/code&gt; jobs. This is the number of unscheduled jobs that the scheduler assumes need to be executed before the end of the operation. The number of &lt;code&gt;pending&lt;/code&gt; jobs may differ from the number of jobs that will actually be completed: data slicing depends on the job completion speed.&lt;/p&gt;\n&lt;h4 id=\"aborted_jobs\"&gt;&lt;a href=\"en/user-guide/data-processing/operations/overview.html#aborted_jobs\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Aborted jobs&lt;/span&gt;&lt;/a&gt;Aborted jobs&lt;/h4&gt;\n&lt;p&gt;Jobs with the &lt;code&gt;aborted&lt;/code&gt; state contain information on the class of reasons that led to the interruption:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;scheduler&lt;/code&gt; — the job was interrupted by the scheduler, exact reason unknown.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;failed_chunks&lt;/code&gt; — the job was interrupted by the cluster node due to inability to read input data or write output data.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;resource_overdraft&lt;/code&gt; — the job was aborted by the cluster node because the memory limit was exceeded. By default, the scheduler allocates to the job less memory than requested by the user, and if the allocated memory is not enough for the job (in other words, the memory on the cluster node runs out), the job is interrupted and restarted.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;other&lt;/code&gt; — the job was interrupted by the cluster node due to an unclassified reason.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;preemption&lt;/code&gt; — the scheduler interrupted the job to run a different job.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;user_request&lt;/code&gt; — the job was interrupted by the user.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;node_offline&lt;/code&gt; — the job was interrupted because the scheduler lost connection with the cluster node.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;waiting_timeout&lt;/code&gt; — the job was interrupted due to being queued on the cluster node longer than permitted.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;account_limit_exceeded&lt;/code&gt; — the job was interrupted after trying to to write data past the user account's limit. Such jobs are deemed &lt;code&gt;failed&lt;/code&gt;, unless &lt;code&gt;suspend_operation_if_account_limit_exceeded&lt;/code&gt; is enabled.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;unknown&lt;/code&gt; — the job was interrupted for an unknown reason. This behavior occurs when the compute nodes and the scheduler running on the cluster have different versions and the cluster node reports to the scheduler a reason that is unknown to the latter.&lt;/li&gt;\n&lt;li&gt;reasons appended with &lt;code&gt;scheduling_&lt;/code&gt; refer to cases where the scheduler has scheduled the job, but ended up canceling it before making a schedule for it to run on a cluster node. This type of job wastes the resources of the scheduler, but not of the cluster:\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;scheduling_timeout&lt;/code&gt; — the scheduler was unable to schedule the job in the allotted time. May occur with big operations, where the input data numbers in the petabytes, or in cases of scheduler CPU overload.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;scheduling_resource_overcommit&lt;/code&gt; — after the job was scheduled, it turned out that the &lt;code&gt;resource_limits&lt;/code&gt; of the operation or one of the parent pools were exceeded.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;scheduling_operation_suspended&lt;/code&gt; — after the job was scheduled by the controller, it turned out that the operation was suspended.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;scheduling_job_spec_throttling&lt;/code&gt; — after the job is scheduled, a specification is generated for it, which, among other things, contains meta-information on the job's input chunks. Where there are too many input chunks, a mechanism for limiting the creation of jobs in the particular operation is activated. Some of the operation's jobs may be interrupted in the process.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;scheduling_intermediate_chunk_limit_exceeded&lt;/code&gt; — the job was interrupted due to the intermediate chunk limit being exceeded. The limit determines how many such chunks an operation can create with automatic merging of output chunks enabled in &lt;code&gt;economy&lt;/code&gt; and &lt;code&gt;manual&lt;/code&gt; modes;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;scheduling_other&lt;/code&gt; — the job was interrupted by the scheduler for an unclassified reason.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h4 id=\"completed_jobs\"&gt;&lt;a href=\"en/user-guide/data-processing/operations/overview.html#completed_jobs\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Completed jobs&lt;/span&gt;&lt;/a&gt;Completed jobs&lt;/h4&gt;\n&lt;p&gt;Sometimes, the scheduler decides to interrupt a job and stops inputting new data to the job as per the operation's guarantees, giving some time for the job to complete. If the job completes within the allotted time, it switches to the &lt;code&gt;completed&lt;/code&gt; state — not &lt;code&gt;aborted&lt;/code&gt; despite having been interrupted. Such &lt;code&gt;completed&lt;/code&gt; jobs have the &lt;code&gt;interrupt_reason&lt;/code&gt; attribute with a value other than &lt;code&gt;none&lt;/code&gt;, specifying the reason for the scheduler interrupting the job.&lt;br /&gt;\nIn cases like this, the values of the job interruption reason can be:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;none&lt;/code&gt; — the job completed successfully, without interruption.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;preemption&lt;/code&gt; — the scheduler interrupted the job to run a different job.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;user_request&lt;/code&gt; — the job was interrupted by the user.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;job_split&lt;/code&gt; — the job was interrupted to be split into more jobs.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;unknown&lt;/code&gt; — the job was interrupted for an unknown reason. This happens when the decision to interrupt the job was sent to the cluster node, and then the scheduler restarted.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h4 id=\"standard-error-stream\"&gt;&lt;a href=\"en/user-guide/data-processing/operations/overview.html#standard-error-stream\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Standard error stream&lt;/span&gt;&lt;/a&gt;Standard error stream&lt;/h4&gt;\n&lt;p&gt;Data in an operation's job can be written to the standard error stream (stderr) to be saved and available for reading. This can also be useful for debugging purposes.&lt;br /&gt;\nTo get a job's stderr, use the &lt;code&gt;get_job_stderr&lt;/code&gt; command, to get a job list — &lt;code&gt;list_jobs&lt;/code&gt;. For convenience, you can adjust the &lt;code&gt;list_jobs&lt;/code&gt; parameters to only show the jobs where stderr was written to. The &lt;code&gt;list_jobs&lt;/code&gt; and &lt;code&gt;get_job_stderr&lt;/code&gt; commands are available in Python (see \"Python Wrapper\").&lt;br /&gt;\nTo prevent stderr operations from taking up too much space, writing is governed by the following policies:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;No more than &lt;code&gt;max_stderr_size&lt;/code&gt; bytes written to stderr are saved. Anything written beyond this limit is ignored.&lt;/li&gt;\n&lt;li&gt;No more than 150 jobs with such stderr log files can be saved (for schedulers).&lt;/li&gt;\n&lt;li&gt;No more than 20 jobs with such stderr log files can be saved (for operations). May take the value up to 150.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;h2 id=\"chunk_strategy\"&gt;&lt;a href=\"en/user-guide/data-processing/operations/overview.html#chunk_strategy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Unavailable data&lt;/span&gt;&lt;/a&gt;Unavailable data&lt;/h2&gt;\n&lt;h3 id=\"strategies-and-tactics\"&gt;&lt;a href=\"en/user-guide/data-processing/operations/overview.html#strategies-and-tactics\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Strategies and tactics&lt;/span&gt;&lt;/a&gt;Strategies and tactics&lt;/h3&gt;\n&lt;p&gt;Specification features two settings for each operation: &lt;code&gt;unavailable_chunk_strategy&lt;/code&gt; and &lt;code&gt;unavailable_chunk_tactics&lt;/code&gt;. Their possible values are &lt;code&gt;wait&lt;/code&gt;, &lt;code&gt;fail&lt;/code&gt;, and &lt;code&gt;skip&lt;/code&gt;. These values determine the behavior of the scheduler when the necessary input data for the operation is not available:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;wait&lt;/code&gt; — wait for the data for an indefinite period&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;fail&lt;/code&gt; — immediately abort the operation&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;skip&lt;/code&gt; — skip unavailable data and perform calculations on an incomplete set&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Strategy and tactics come into play at different stages of the operation:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;strong&gt;strategy&lt;/strong&gt; is used upon operation start and during initial scheduling of the work scope&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;tactics&lt;/strong&gt; are used when handling unavailable data for an operation that is already running&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Theoretically, 9 combinations are possible, but not all of them are useful. The following combinations are useful:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;wait&lt;/code&gt; strategy, &lt;code&gt;wait&lt;/code&gt; tactic — used by default, calculations are only performed on complete data, even at the cost of waiting.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;fail&lt;/code&gt; strategy, &lt;code&gt;wait&lt;/code&gt; tactic — data integrity is checked at startup, and if any losses are detected you must wait for the missing data to become available.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;skip&lt;/code&gt; strategy, &lt;code&gt;skip&lt;/code&gt; tactic — calculations are performed on any available data without delay.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;skip&lt;/code&gt; strategy, &lt;code&gt;wait&lt;/code&gt; tactic — calculations are started immediately with the losses committed, but no additional losses are allowed — wait for the missing data to become available.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;skip&lt;/code&gt; strategy, &lt;code&gt;fail&lt;/code&gt; tactic — calculations are started immediately with the losses committed, but no additional losses are allowed — interrupt the calculations if unavailable data is detected.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;fail&lt;/code&gt; strategy, &lt;code&gt;fail&lt;/code&gt; tactic — calculations are only performed on complete data, any data unavailability is reported as soon as possible.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;The scheduler periodically queries the master for the status of an operation's input chunks. If the scheduler detects unavailable data, the respective part of the calculation stops. Jobs using this data are not started, but chunks are still requested from the master. Each &lt;code&gt;erasure&lt;/code&gt; request for a chunk causes it to move up in the queue of chunks awaiting recovery (\"move to front\"). The chunks required by the current operations to run are recovered first.&lt;/p&gt;\n&lt;p&gt;These procedures are fully automated and do not require manual set-up.&lt;/p&gt;\n&lt;h3 id=\"chunk_erasure_strategy\"&gt;&lt;a href=\"en/user-guide/data-processing/operations/overview.html#chunk_erasure_strategy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Availability of erasure chunks&lt;/span&gt;&lt;/a&gt;Availability of erasure chunks&lt;/h3&gt;\n&lt;p&gt;To configure the operation behavior when erasure-coded chunks are unavailable, you can use the &lt;code&gt;chunk_availability_policy&lt;/code&gt; option. This option regulates when a chunk is considered available:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;data_parts_available&lt;/code&gt;: A chunk is considered available if all data parts are available. At the same time, parity parts may be lost. With this operation setup, you do not need to wait for data recovery before reading.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;repairable&lt;/code&gt;: A chunk is considered available if there are enough parity parts to recover the data. At the same time, data parts may be lost. In this case, the operation waits for the data to be recovered from parity parts.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;all_parts_available&lt;/code&gt;: A chunk is considered available if all of its parts (data parts and parity parts) are available.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"c-and-python-wrapper\"&gt;&lt;a href=\"en/user-guide/data-processing/operations/overview.html#c-and-python-wrapper\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;C++ and Python Wrapper&lt;/span&gt;&lt;/a&gt;C++ and Python Wrapper&lt;/h2&gt;\n&lt;p&gt;Running operations via С~++ or Python Wrapper is associated with a number of priming works in addition to the calling of the corresponding driver command. Those include:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;\n&lt;p&gt;Uploading files to the &lt;a href=\"user-guide/storage/file-cache.html\"&gt;File cache&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Note&lt;/strong&gt;: Automatic file upload to the cache always takes place outside of the user transaction, which may lead to conflicts on Cypress nodes if the file cache directory was not created in advance.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;Сreating output tables or clearing them using the &lt;code&gt;erase&lt;/code&gt; command. When it comes to the system, all output tables should already be there at the start of the operation.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;Deleting files after the operation is completed.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;Setting the &lt;code&gt;jobcount&lt;/code&gt; and &lt;code&gt;memorylimit&lt;/code&gt; parameters, if they are specified by the user.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;Some parameters may have default values that are different from the system ones.&lt;/p&gt;\n&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"limits-on-the-number-of-tables-and-jobs\"&gt;&lt;a href=\"en/user-guide/data-processing/operations/overview.html#limits-on-the-number-of-tables-and-jobs\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Limits on the number of tables and jobs&lt;/span&gt;&lt;/a&gt;Limits on the number of tables and jobs&lt;/h2&gt;\n&lt;p&gt;The system has restrictions on operation parameters in place that need to be taken into account.&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;There is a limit on the number of input tables for any operation. By default, this limit on \"big\" production clusters is 3,000. Testing clusters, as well as clusters that do not run large-scale MapReduce operations, can have lower restrictions, which can still be increased to 3,000 if necessary.&lt;/li&gt;\n&lt;li&gt;There is no special limit on the number of output tables, but keep in mind that each output table has memory buffer requirements. If an operation has 1,000 output tables, its jobs will have impossible memory requirements and therefore not run. In practice, the upper bound for output tables is approximately 100. If you need more output tables, split the operation into several smaller ones and stagger the processing.&lt;/li&gt;\n&lt;li&gt;There is a limit on the number of jobs an operation can have. For &lt;a href=\"user-guide/data-processing/operations/map.html\"&gt;Map&lt;/a&gt;, &lt;a href=\"user-guide/data-processing/operations/merge.html\"&gt;Merge&lt;/a&gt;, &lt;a href=\"user-guide/data-processing/operations/reduce.html\"&gt;Reduce&lt;/a&gt;, and &lt;a href=\"user-guide/data-processing/operations/remote-copy.html\"&gt;RemoteCopy&lt;/a&gt; it is 100,000 jobs. In the cases of &lt;a href=\"user-guide/data-processing/operations/reduce.html\"&gt;Reduce&lt;/a&gt; and sorted &lt;a href=\"user-guide/data-processing/operations/merge.html\"&gt;Merge&lt;/a&gt;, it may be impossible to generate so many jobs due to the scheduler not having enough samples. For operations that include the shuffle stage (&lt;a href=\"user-guide/data-processing/operations/sort.html\"&gt;Sort&lt;/a&gt; and &lt;a href=\"user-guide/data-processing/operations/mapreduce.html\"&gt;MapReduce&lt;/a&gt;), there is a limit of 5,000 partitions. To learn more about partitions, see the corresponding sections dedicated to specific operation types.&lt;/li&gt;\n&lt;li&gt;There is a limit on the product of an operation's jobs multiplied by the number of output tables. This restriction helps prevent operations from generating a large number of chunks, which can exert an excessive load on the master servers. For \"big\" production clusters, this limit is 2,000,000.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;h2 id=\"transactions\"&gt;&lt;a href=\"en/user-guide/data-processing/operations/overview.html#transactions\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Transactions in data processing&lt;/span&gt;&lt;/a&gt;Transactions in data processing&lt;/h2&gt;\n&lt;p&gt;Any operation can be viewed as a black box with a set of inputs and outputs (I/O), as well as a number of artifacts used in its work (files and porto layers). The general logic of the operation is quite simple: it takes exclusive locks on output tables within a special output transaction and snapshot locks on input tables (and artifacts) within a special input transaction. Then, if and when all calculations have been successfully performed, output transactions are committed. If the operation is interrupted or ends in an error, the output transaction is aborted.&lt;/p&gt;\n&lt;p&gt;There are certain caveats:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;If a table is present in both input and output tables, then only the exclusive lock in the output transaction is taken for that table, and the data is both read and written from this version of the table.&lt;/li&gt;\n&lt;li&gt;If the output table is flagged with &lt;code&gt;append&lt;/code&gt;, it takes a shared lock. The previous item's logic does not work if the tables are present in both the input and output.&lt;/li&gt;\n&lt;li&gt;The operation can be run as part of a user transaction, in which case the input and output transactions are created as the user transaction's subtransactions.&lt;/li&gt;\n&lt;li&gt;Scheduler transactions are created with a timeout sufficient to survive cluster downtimes which can take hours. Then they are pinged by the scheduler. When a standard scheduler update takes place, it reuses operations' existing transactions. In the case of long shutdown drills or major updates of the master server, transactions are interrupted and operations are restarted from scratch, with locks on tables being taken anew.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Operations that contain core or stderr tables can also have a debug transaction. This transaction houses the writing of core files and the stderr, with the transaction being committed even if it is interrupted or ends in an error.&lt;/p&gt;\n&lt;p&gt;These transactions can be viewed via operation attributes:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;code&gt;input_transaction_id&lt;/code&gt;, &lt;code&gt;nested_input_transaction_ids&lt;/code&gt; – transaction with locks on input tables and artifacts. This can also be a list of transactions if &lt;code&gt;transaction_id&lt;/code&gt; on input tables is used.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;output_transaction_id&lt;/code&gt; – transaction within which data is written to output tables.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;debug_transaction_id&lt;/code&gt; – transaction within which core and stderr tables are written.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;async_scheduler_transaction_id&lt;/code&gt; – transaction within which temporary data is written under an operation that always interrupts upon completion. For example, this is where intermediate data lives.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;output_completion_transaction_id&lt;/code&gt;, &lt;code&gt;debug_completion_transaction_id&lt;/code&gt; – transactions serving a technical purpose, used upon successful completion of an operation to atomically commit the operation's result.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;h2 id=\"using-data-from-a-remote-cluster\"&gt;&lt;a href=\"en/user-guide/data-processing/operations/overview.html#using-data-from-a-remote-cluster\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Using data from a remote cluster&lt;/span&gt;&lt;/a&gt;Using data from a remote cluster&lt;/h2&gt;\n&lt;p&gt;For any operation, you can specify the &lt;code&gt;cluster&lt;/code&gt; attribute on one or more input tables. This will initiate data reading from the specified cluster.&lt;br /&gt;\nThe cluster name should be the same as one would use for RemoteCopy operations.&lt;/p&gt;\n&lt;p&gt;Files delivered to each job (&lt;code&gt;/mapper/file_paths&lt;/code&gt; or &lt;code&gt;/reducer/file_paths&lt;/code&gt; section) can be read only from a local cluster. So if you need to use them from a remote cluster, transfer them in advance using the RemoteCopy operation.&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"en/user-guide/data-processing/operations/overview.md","sourcePath":"en/user-guide/data-processing/operations/overview.md"},"headings":[{"title":"Overview","href":"en/user-guide/data-processing/operations/overview.html#overview","level":2},{"title":"Parameters of a running operation","href":"en/user-guide/data-processing/operations/overview.html#parameters-of-a-running-operation","level":2,"items":[{"title":"Operation statuses","href":"en/user-guide/data-processing/operations/overview.html#status","level":3},{"title":"Job states","href":"en/user-guide/data-processing/operations/overview.html#job-states","level":3,"items":[{"title":"Aborted jobs","href":"en/user-guide/data-processing/operations/overview.html#aborted_jobs","level":4},{"title":"Completed jobs","href":"en/user-guide/data-processing/operations/overview.html#completed_jobs","level":4},{"title":"Standard error stream","href":"en/user-guide/data-processing/operations/overview.html#standard-error-stream","level":4}]}]},{"title":"Unavailable data","href":"en/user-guide/data-processing/operations/overview.html#chunk_strategy","level":2,"items":[{"title":"Strategies and tactics","href":"en/user-guide/data-processing/operations/overview.html#strategies-and-tactics","level":3},{"title":"Availability of erasure chunks","href":"en/user-guide/data-processing/operations/overview.html#chunk_erasure_strategy","level":3}]},{"title":"C++ and Python Wrapper","href":"en/user-guide/data-processing/operations/overview.html#c-and-python-wrapper","level":2},{"title":"Limits on the number of tables and jobs","href":"en/user-guide/data-processing/operations/overview.html#limits-on-the-number-of-tables-and-jobs","level":2},{"title":"Transactions in data processing","href":"en/user-guide/data-processing/operations/overview.html#transactions","level":2},{"title":"Using data from a remote cluster","href":"en/user-guide/data-processing/operations/overview.html#using-data-from-a-remote-cluster","level":2}],"title":"Operation types"},"router":{"pathname":"en/user-guide/data-processing/operations/overview","depth":5,"base":"../../../../"},"lang":"en","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/en/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-a29ea7877730322f2ce693378d06d02ac2b374cd-en","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
