        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;This section explains how to use &lt;a href=\"user-guide/storage/cypress.html\"&gt;Cypress&lt;/a&gt; as a distributed locking service, similar to &lt;a href=\"https://zookeeper.apache.org\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;ZooKeeper&lt;/a&gt;.&lt;/p&gt;\n&lt;h2 id=\"general-information\"&gt;&lt;a href=\"en/user-guide/locking/cypress-as-locking-service.html#general-information\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;General information&lt;/span&gt;&lt;/a&gt;General information&lt;/h2&gt;\n&lt;p&gt;To use YTsaurus as a distributed locking service, you need to deploy master servers of a cluster in multiple locations.&lt;/p&gt;\n&lt;p&gt;There must be at least three locations so that the service can work if one of them is not available. If the master servers are located in five locations, the service can work if any two of them are not available.&lt;/p&gt;\n&lt;h3 id=\"how-it-works\"&gt;&lt;a href=\"en/user-guide/locking/cypress-as-locking-service.html#how-it-works\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;How it works&lt;/span&gt;&lt;/a&gt;How it works&lt;/h3&gt;\n&lt;p&gt;YTsaurus supports master and tablet &lt;a href=\"user-guide/storage/transactions.html\"&gt;transactions&lt;/a&gt;. Master transactions use a pessimistic locking model. This means that a lock on a Cypress node is acquired synchronously, and the system checks for potential conflicts.&lt;/p&gt;\n&lt;p&gt;Using the pessimistic model, you can construct a simple emulation of a distributed lock:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;Create a node in Cypress outside of transactions. This node will respond to the lock. The node can be of any type, for example, &lt;code&gt;map_node&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;In the program, create a transaction where you want to acquire a lock on the given node. An attempt to acquire an exclusive lock on the node is under this transaction.&lt;/li&gt;\n&lt;li&gt;If the lock is acquired, then you can execute the code that this lock protects. And it's important that you ping the transaction. If the ping call fails or the transaction is canceled, then the execution is no longer exclusive. In this case, you have to stop the process or take other actions.&lt;/li&gt;\n&lt;li&gt;If the lock &lt;strong&gt;isn't&lt;/strong&gt; acquired, repeat the transaction creation and lock acquisition.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;As with any distributed lock system, you can't fully guarantee that a process under a lock is exclusive when it makes changes to a third-party system that is not integrated with YTsaurus transactions. For example, between consecutive ping calls, it might happen that a transaction is interrupted and a parallel process that acquires a lock on the same node starts.&lt;/p&gt;\n&lt;p&gt;When you make changes on the cluster where the lock is acquired, you should use the &lt;code&gt;prerequisite_transactions&lt;/code&gt; option in requests to the cluster. In this option, you should specify the transaction under which the lock was acquired. Thus, YTsaurus ensures that the request is executed only if the transaction is alive and the lock is acquired.&lt;/p&gt;\n&lt;h3 id=\"how-to-use\"&gt;&lt;a href=\"en/user-guide/locking/cypress-as-locking-service.html#how-to-use\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;How to use&lt;/span&gt;&lt;/a&gt;How to use&lt;/h3&gt;\n&lt;p&gt;To run a process under a lock, you can use the &lt;a href=\"api/cli/commands.html#run-command-with-lock\"&gt;run-command-with-lock&lt;/a&gt; command. Alternatively, you can define how to acquire a lock in the application code.&lt;/p&gt;\n&lt;p&gt;If the process makes changes on a cluster and needs to make them exclusively, we recommend using a lock directly on that cluster.&lt;/p&gt;\n&lt;h2 id=\"quotas\"&gt;&lt;a href=\"en/user-guide/locking/cypress-as-locking-service.html#quotas\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Quotas&lt;/span&gt;&lt;/a&gt;Quotas&lt;/h2&gt;\n&lt;p&gt;The request quota is calculated for a user of the cluster regardless of the host from which they send these requests. The default quota on requests is 100 RPS. If this limit is reached, requests are queued. The default queue depth is 100 requests. If the queue is full, the user gets the &lt;code&gt;Request queue size limit exceeded&lt;/code&gt; error when they send another request. You can ask your cluster administrator to increase the limits.&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"en/user-guide/locking/cypress-as-locking-service.md","sourcePath":"en/user-guide/locking/cypress-as-locking-service.md"},"headings":[{"title":"General information","href":"en/user-guide/locking/cypress-as-locking-service.html#general-information","level":2,"items":[{"title":"How it works","href":"en/user-guide/locking/cypress-as-locking-service.html#how-it-works","level":3},{"title":"How to use","href":"en/user-guide/locking/cypress-as-locking-service.html#how-to-use","level":3}]},{"title":"Quotas","href":"en/user-guide/locking/cypress-as-locking-service.html#quotas","level":2}],"title":"Distributed locks"},"router":{"pathname":"en/user-guide/locking/cypress-as-locking-service","depth":4,"base":"../../../"},"lang":"en","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/en/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-a29ea7877730322f2ce693378d06d02ac2b374cd-en","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
