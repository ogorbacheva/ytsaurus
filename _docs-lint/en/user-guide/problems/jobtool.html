            {"data":{"leading":false,"html":"&lt;p&gt;To make job debugging more convenient (for example, with GDB), you can use a special utility, &lt;code&gt;yt job-tool&lt;/code&gt;. It downloads the job environment along with its input data and generates a script to run it.&lt;/p&gt;\n&lt;p&gt;The utility comes as part of the &lt;a href=\"api/python/start.html\"&gt;Python API&lt;/a&gt; package. All types of jobs that run custom code are supported.&lt;/p&gt;\n&lt;p&gt;The binary file supports two commands: &lt;code&gt;prepare-job-environment&lt;/code&gt; and &lt;code&gt;run-job&lt;/code&gt;. To get detailed information, use the &lt;code&gt;yt job-tool --help&lt;/code&gt; command.&lt;/p&gt;\n&lt;h2 id=\"jobs-input-data\"&gt;&lt;a href=\"en/user-guide/problems/jobtool.html#jobs-input-data\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Job's input data&lt;/span&gt;&lt;/a&gt;Job's input data&lt;/h2&gt;\n&lt;p&gt;By default, &lt;code&gt;job-tool&lt;/code&gt; gets full job input, although it isn't available for all jobs:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;The specification required to get full input is saved for a few failed and a few successfully completed jobs. It is also available for all running jobs.&lt;/li&gt;\n&lt;li&gt;Getting full input requires the data read by the job: input tables must be available and unmodified.&lt;/li&gt;\n&lt;li&gt;\"reduce_combiner\" and \"reduce\" jobs of a MapReduce operation read temporary data that is only available until the operation has completed. To debug such jobs, you can rewrite the operation as a combination of Map, Sort, and Reduce. Or you can debug them while the operation is still running (including while it is suspended).&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"example\"&gt;&lt;a href=\"en/user-guide/problems/jobtool.html#example\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Example&lt;/span&gt;&lt;/a&gt;Example&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;\n&lt;p&gt;Let's run this operation:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs python\"&gt;&lt;span class=\"hljs-keyword\"&gt;import&lt;/span&gt; yt.wrapper &lt;span class=\"hljs-keyword\"&gt;as&lt;/span&gt; yt\n\n&lt;span class=\"hljs-keyword\"&gt;def&lt;/span&gt; &lt;span class=\"hljs-title function_\"&gt;mapper&lt;/span&gt;(&lt;span class=\"hljs-params\"&gt;rec&lt;/span&gt;):\n    &lt;span class=\"hljs-keyword\"&gt;raise&lt;/span&gt; RuntimeError(&lt;span class=\"hljs-string\"&gt;\"fail\"&lt;/span&gt;)\n\n&lt;span class=\"hljs-keyword\"&gt;if&lt;/span&gt; __name__ == &lt;span class=\"hljs-string\"&gt;\"__main__\"&lt;/span&gt;:\n    yt.run_map(mapper, &lt;span class=\"hljs-string\"&gt;\"//home/user/tables/dsv\"&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;\"//home/user/output\"&lt;/span&gt;, &lt;span class=\"hljs-built_in\"&gt;format&lt;/span&gt;=&lt;span class=\"hljs-string\"&gt;\"dsv\"&lt;/span&gt;)\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"40\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-40\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-40\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-40.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;When the operation fails, we diagnose it:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;yt job-tool prepare-job-environment ffc8f462-7f68f8c3-3fe03e8-433fe11f ffe4ff5c-d2fac8c1-3fe0384-816a7fd0\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"46\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-46\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-46\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-46.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;Once the command has finished, the folder &lt;code&gt;job_ffe4ff5c-d2fac8c1-3fe0384-816a7fd0&lt;/code&gt; will contain the following files:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;$ &lt;span class=\"hljs-built_in\"&gt;ls&lt;/span&gt; job_ffe4ff5c-d2fac8c1-3fe0384-816a7fd0\n&lt;span class=\"hljs-built_in\"&gt;command&lt;/span&gt;  input  run_gdb.sh  run.sh  sandbox\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"52\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-52\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-52\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-52.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Where:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;\n&lt;p&gt;The &lt;code&gt;command&lt;/code&gt; file contains the command that runs the job. Since the operation was run using the &lt;a href=\"api/python/start.html\"&gt;Python API&lt;/a&gt;, the code will look like this:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;&lt;span class=\"hljs-built_in\"&gt;cat&lt;/span&gt; job_ffe4ff5c-d2fac8c1-3fe0384-816a7fd0/command\npython _py_runner.py mapper.lV4l9c config_dump6RRYa4 _modulesEFMotR _main_moduleJALUsC.py _main_module PY_SOURCE%\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"61\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-61\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-61\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-61.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;input&lt;/code&gt; is the job input; it could be worth analyzing in some cases.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;run.sh&lt;/code&gt; is a shell script that runs the job locally.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;run_gdb.sh&lt;/code&gt; is a shell script that runs the job with GDB, which is useful for debugging C++ programs.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Note&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;You can modify the &lt;code&gt;run_gdb.sh&lt;/code&gt; and &lt;code&gt;run.sh&lt;/code&gt; scripts, for example, to integrate a custom debugger.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;sandbox&lt;/code&gt; is the directory where the job was run, along with all the files necessary to run it.&lt;br /&gt;\nAs you debug, you can try updating files in the directory.&lt;/p&gt;\n&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;Run the job locally using the &lt;code&gt;run.sh&lt;/code&gt; script:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;./run\n2016-07-22 12:00:33,499 INFO    Started job process\nUser job exited with non-zero &lt;span class=\"hljs-built_in\"&gt;exit&lt;/span&gt; code 1 with stderr:\nTraceback (most recent call last):\n  File &lt;span class=\"hljs-string\"&gt;\"_py_runner.py\"&lt;/span&gt;, line 56, &lt;span class=\"hljs-keyword\"&gt;in&lt;/span&gt; &amp;lt;module&amp;gt;\n    main()\n  File &lt;span class=\"hljs-string\"&gt;\"_py_runner.py\"&lt;/span&gt;, line 53, &lt;span class=\"hljs-keyword\"&gt;in&lt;/span&gt; main\n    yt.wrapper.py_runner_helpers.process_rows(__operation_dump_filename, __config_dump_filename, start_time=start_time)\n  File &lt;span class=\"hljs-string\"&gt;\"/home/user/yt/python/yt/wrapper/py_runner_helpers.py\"&lt;/span&gt;, line 154, &lt;span class=\"hljs-keyword\"&gt;in&lt;/span&gt; process_rows\n    output_format.dump_rows(result, streams.get_original_stdout(), raw=raw)\n  File &lt;span class=\"hljs-string\"&gt;\"/home/user/yt/python/yt/wrapper/format.py\"&lt;/span&gt;, line 137, &lt;span class=\"hljs-keyword\"&gt;in&lt;/span&gt; dump_rows\n    self._dump_rows(rows, stream)\n  File &lt;span class=\"hljs-string\"&gt;\"/home/user/yt/python/yt/wrapper/format.py\"&lt;/span&gt;, line 251, &lt;span class=\"hljs-keyword\"&gt;in&lt;/span&gt; _dump_rows\n    &lt;span class=\"hljs-keyword\"&gt;for&lt;/span&gt; row &lt;span class=\"hljs-keyword\"&gt;in&lt;/span&gt; rows:\n  File &lt;span class=\"hljs-string\"&gt;\"/home/user/yt/python/yt/wrapper/py_runner_helpers.py\"&lt;/span&gt;, line 89, &lt;span class=\"hljs-keyword\"&gt;in&lt;/span&gt; process_frozen_dict\n    &lt;span class=\"hljs-keyword\"&gt;for&lt;/span&gt; row &lt;span class=\"hljs-keyword\"&gt;in&lt;/span&gt; rows:\n  File &lt;span class=\"hljs-string\"&gt;\"/home/user/yt/python/yt/wrapper/py_runner_helpers.py\"&lt;/span&gt;, line 49, &lt;span class=\"hljs-keyword\"&gt;in&lt;/span&gt; generator\n    result = func(*args)\n  File &lt;span class=\"hljs-string\"&gt;\"&amp;lt;stdin&amp;gt;\"&lt;/span&gt;, line 2, &lt;span class=\"hljs-keyword\"&gt;in&lt;/span&gt; mapper\nRuntimeError: fail\n\n    origin          hostname &lt;span class=\"hljs-keyword\"&gt;in&lt;/span&gt; 2016-07-22T12:00:35.427161Z\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"99\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-99\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-99\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-99.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;/li&gt;\n&lt;/ol&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"en/user-guide/problems/jobtool.md","sourcePath":"en/user-guide/problems/jobtool.md"},"headings":[{"title":"Job's input data","href":"en/user-guide/problems/jobtool.html#jobs-input-data","level":2},{"title":"Example","href":"en/user-guide/problems/jobtool.html#example","level":2}],"title":"Debugging jobs locally"},"router":{"pathname":"en/user-guide/problems/jobtool","depth":4,"base":"../../../"},"lang":"en","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/en/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-a29ea7877730322f2ce693378d06d02ac2b374cd-en","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
