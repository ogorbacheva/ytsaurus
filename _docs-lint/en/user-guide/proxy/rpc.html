            {"data":{"leading":false,"html":"&lt;p&gt;This section contains examples of working with YT via RPC proxy for different programming languages: &lt;a href=\"en/user-guide/proxy/rpc.html#c_plus_plus\"&gt;C++&lt;/a&gt;, &lt;a href=\"en/user-guide/proxy/rpc.html#java\"&gt;Java&lt;/a&gt;, and &lt;a href=\"en/user-guide/proxy/rpc.html#python\"&gt;Python&lt;/a&gt;.&lt;/p&gt;\n&lt;h2 id=\"c_plus_plus\"&gt;&lt;a href=\"en/user-guide/proxy/rpc.html#c_plus_plus\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;С++&lt;/span&gt;&lt;/a&gt;С++&lt;/h2&gt;\n&lt;p&gt;Example on &lt;a href=\"https://github.com/ytsaurus/ytsaurus/blob/main/yt/examples/rpc_proxy_sample/main.cpp\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Github&lt;/a&gt;&lt;/p&gt;\n&lt;p&gt;The example implements a program in which you can work with dynamic tables in interactive mode.&lt;/p&gt;\n&lt;p&gt;Call format:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;~/ytbuild/bin/rpc_proxy_sample --config config.yson --user &amp;lt;user&amp;gt; --token $(&lt;span class=\"hljs-built_in\"&gt;cat&lt;/span&gt; ~/.yt/token) 2&amp;gt; /dev/null\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"15\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-15\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-15\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-15.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Working with Cypress:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;list //sys\nget //sys\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"19\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-19\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-19\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-19.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Reading data using a query language (SelectRows):&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs sql\"&gt;&lt;span class=\"hljs-keyword\"&gt;select&lt;/span&gt; &lt;span class=\"hljs-type\"&gt;timestamp&lt;/span&gt;, host, rack, utc_time, data &lt;span class=\"hljs-keyword\"&gt;FROM&lt;/span&gt; [&lt;span class=\"hljs-operator\"&gt;/&lt;/span&gt;&lt;span class=\"hljs-operator\"&gt;/&lt;/span&gt;home&lt;span class=\"hljs-operator\"&gt;/&lt;/span&gt;dev&lt;span class=\"hljs-operator\"&gt;/&lt;/span&gt;autorestart_nodes_copy] LIMIT &lt;span class=\"hljs-number\"&gt;10&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"23\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-23\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-23\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-23.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Querying rows by key (LookupRows):&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;ulookup //home/dev/autorestart_nodes_copy timestamp;host;rack;utc_time;data &amp;lt;&lt;span class=\"hljs-built_in\"&gt;id&lt;/span&gt;=0&amp;gt;1486113922563016;&amp;lt;&lt;span class=\"hljs-built_in\"&gt;id&lt;/span&gt;=1&amp;gt;&lt;span class=\"hljs-string\"&gt;\"s04-sas.cluster-name\"&lt;/span&gt;;&amp;lt;&lt;span class=\"hljs-built_in\"&gt;id&lt;/span&gt;=2&amp;gt;&lt;span class=\"hljs-string\"&gt;\"SAS2.4.3-13\"&lt;/span&gt; &amp;lt;&lt;span class=\"hljs-built_in\"&gt;id&lt;/span&gt;=0&amp;gt;1486113924172063;&amp;lt;&lt;span class=\"hljs-built_in\"&gt;id&lt;/span&gt;=1&amp;gt;&lt;span class=\"hljs-string\"&gt;\"s04-sas.cluster-name\"&lt;/span&gt;;&amp;lt;&lt;span class=\"hljs-built_in\"&gt;id&lt;/span&gt;=2&amp;gt;&lt;span class=\"hljs-string\"&gt;\"SAS2.4.3-13\"&lt;/span&gt; &amp;lt;&lt;span class=\"hljs-built_in\"&gt;id&lt;/span&gt;=0&amp;gt;1486113992045484;&amp;lt;&lt;span class=\"hljs-built_in\"&gt;id&lt;/span&gt;=1&amp;gt;&lt;span class=\"hljs-string\"&gt;\"s04-sas.cluster-name\"&lt;/span&gt;;&amp;lt;&lt;span class=\"hljs-built_in\"&gt;id&lt;/span&gt;=2&amp;gt;&lt;span class=\"hljs-string\"&gt;\"SAS2.4.3-13\"&lt;/span&gt; &amp;lt;&lt;span class=\"hljs-built_in\"&gt;id&lt;/span&gt;=0&amp;gt;1486113992591731;&amp;lt;&lt;span class=\"hljs-built_in\"&gt;id&lt;/span&gt;=1&amp;gt;&lt;span class=\"hljs-string\"&gt;\"s04-sas.cluster-name\"&lt;/span&gt;;&amp;lt;&lt;span class=\"hljs-built_in\"&gt;id&lt;/span&gt;=2&amp;gt;&lt;span class=\"hljs-string\"&gt;\"SAS2.4.3-13\"&lt;/span&gt;  &amp;lt;&lt;span class=\"hljs-built_in\"&gt;id&lt;/span&gt;=0&amp;gt;1486113997734536;&amp;lt;&lt;span class=\"hljs-built_in\"&gt;id&lt;/span&gt;=1&amp;gt;&lt;span class=\"hljs-string\"&gt;\"n4137-sas.cluster-name\"&lt;/span&gt;;&amp;lt;&lt;span class=\"hljs-built_in\"&gt;id&lt;/span&gt;=2&amp;gt;&lt;span class=\"hljs-string\"&gt;\"SAS2.4.3-13\"&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"27\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-27\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-27\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-27.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Inserting rows (aka WriteRows):&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;upsert //home/dev/autorestart_nodes_copy timestamp;host;rack;utc_time;data &amp;lt;&lt;span class=\"hljs-built_in\"&gt;id&lt;/span&gt;=0&amp;gt;123;&amp;lt;&lt;span class=\"hljs-built_in\"&gt;id&lt;/span&gt;=1&amp;gt;&lt;span class=\"hljs-string\"&gt;\"host123\"&lt;/span&gt;;&amp;lt;&lt;span class=\"hljs-built_in\"&gt;id&lt;/span&gt;=2&amp;gt;&lt;span class=\"hljs-string\"&gt;\"rack123\"&lt;/span&gt;;&amp;lt;&lt;span class=\"hljs-built_in\"&gt;id&lt;/span&gt;=3&amp;gt;&lt;span class=\"hljs-string\"&gt;\"utc_time1\"&lt;/span&gt;;&amp;lt;&lt;span class=\"hljs-built_in\"&gt;id&lt;/span&gt;=4&amp;gt;&lt;span class=\"hljs-string\"&gt;\"data1\"&lt;/span&gt; &amp;lt;&lt;span class=\"hljs-built_in\"&gt;id&lt;/span&gt;=0&amp;gt;567;&amp;lt;&lt;span class=\"hljs-built_in\"&gt;id&lt;/span&gt;=1&amp;gt;&lt;span class=\"hljs-string\"&gt;\"host567\"&lt;/span&gt;;&amp;lt;&lt;span class=\"hljs-built_in\"&gt;id&lt;/span&gt;=2&amp;gt;&lt;span class=\"hljs-string\"&gt;\"rack567\"&lt;/span&gt;;&amp;lt;&lt;span class=\"hljs-built_in\"&gt;id&lt;/span&gt;=3&amp;gt;&lt;span class=\"hljs-string\"&gt;\"utc_time2\"&lt;/span&gt;;&amp;lt;&lt;span class=\"hljs-built_in\"&gt;id&lt;/span&gt;=4&amp;gt;&lt;span class=\"hljs-string\"&gt;\"data2\"&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"31\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-31\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-31\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-31.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Deleting rows (DeleteRows):&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;delete //home/dev/autorestart_nodes_copy timestamp;host;rack &amp;lt;&lt;span class=\"hljs-built_in\"&gt;id&lt;/span&gt;=0&amp;gt;123;&amp;lt;&lt;span class=\"hljs-built_in\"&gt;id&lt;/span&gt;=1&amp;gt;&lt;span class=\"hljs-string\"&gt;\"host123\"&lt;/span&gt;;&amp;lt;&lt;span class=\"hljs-built_in\"&gt;id&lt;/span&gt;=2&amp;gt;&lt;span class=\"hljs-string\"&gt;\"rack123\"&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"35\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-35\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-35\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-35.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Example of working with transactions:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs c++\"&gt;&lt;span class=\"hljs-keyword\"&gt;if&lt;/span&gt; (&lt;span class=\"hljs-built_in\"&gt;ValidateSignature&lt;/span&gt;(&lt;span class=\"hljs-string\"&gt;\"delete\"&lt;/span&gt;, {&lt;span class=\"hljs-string\"&gt;\"path\"&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;\"columns\"&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;\"...\"&lt;/span&gt;}, tokens)) {\n    &lt;span class=\"hljs-keyword\"&gt;auto&lt;/span&gt; path = tokens[&lt;span class=\"hljs-number\"&gt;1&lt;/span&gt;];\n    &lt;span class=\"hljs-function\"&gt;TPrepareRows &lt;span class=\"hljs-title\"&gt;prepareRows&lt;/span&gt;&lt;span class=\"hljs-params\"&gt;(tokens)&lt;/span&gt;&lt;/span&gt;;\n\n    &lt;span class=\"hljs-keyword\"&gt;auto&lt;/span&gt; tx = Client_-&amp;gt;&lt;span class=\"hljs-built_in\"&gt;StartTransaction&lt;/span&gt;(NTransactionClient::ETransactionType::Tablet).&lt;span class=\"hljs-built_in\"&gt;Get&lt;/span&gt;();\n    &lt;span class=\"hljs-keyword\"&gt;if&lt;/span&gt; (!&lt;span class=\"hljs-built_in\"&gt;ValidateResult&lt;/span&gt;(tx)) &lt;span class=\"hljs-keyword\"&gt;return&lt;/span&gt;;\n\n    tx.&lt;span class=\"hljs-built_in\"&gt;Value&lt;/span&gt;()-&amp;gt;&lt;span class=\"hljs-built_in\"&gt;DeleteRows&lt;/span&gt;(path, prepareRows.NameTable, prepareRows.Rows);\n    &lt;span class=\"hljs-keyword\"&gt;auto&lt;/span&gt; result = tx.&lt;span class=\"hljs-built_in\"&gt;Value&lt;/span&gt;()-&amp;gt;&lt;span class=\"hljs-built_in\"&gt;Commit&lt;/span&gt;().&lt;span class=\"hljs-built_in\"&gt;Get&lt;/span&gt;();\n    &lt;span class=\"hljs-keyword\"&gt;if&lt;/span&gt; (!&lt;span class=\"hljs-built_in\"&gt;ValidateResult&lt;/span&gt;(result)) &lt;span class=\"hljs-keyword\"&gt;return&lt;/span&gt;;\n\n    Cout &amp;lt;&amp;lt; &lt;span class=\"hljs-string\"&gt;\"Committed\"&lt;/span&gt; &amp;lt;&amp;lt; Endl;\n}\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"39\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-39\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-39\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-39.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"java\"&gt;&lt;a href=\"en/user-guide/proxy/rpc.html#java\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Java&lt;/span&gt;&lt;/a&gt;Java&lt;/h2&gt;\n&lt;p&gt;The source code of the presented examples can be found on &lt;a href=\"https://github.com/ytsaurus/ytsaurus/tree/main/yt/java/ytsaurus-client/src/test/java/tech/ytsaurus/client\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;GitHub&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;Creating a client:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs java\"&gt;   &lt;span class=\"hljs-keyword\"&gt;public&lt;/span&gt; &lt;span class=\"hljs-keyword\"&gt;static&lt;/span&gt; YtClient &lt;span class=\"hljs-title function_\"&gt;createYtClient&lt;/span&gt;&lt;span class=\"hljs-params\"&gt;(BusConnector connector, String user, String token)&lt;/span&gt;\n    {\n        &lt;span class=\"hljs-keyword\"&gt;return&lt;/span&gt; &lt;span class=\"hljs-keyword\"&gt;new&lt;/span&gt; &lt;span class=\"hljs-title class_\"&gt;YtClient&lt;/span&gt;(connector, &lt;span class=\"hljs-string\"&gt;\"cluster-name\"&lt;/span&gt;, RpcCredentials(user, token));\n    }\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"49\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-49\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-49\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-49.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Implementing a Select query:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs java\"&gt;&lt;span class=\"hljs-keyword\"&gt;package&lt;/span&gt; ru.yandex.yt.ytclient.examples;\n\n&lt;span class=\"hljs-keyword\"&gt;import&lt;/span&gt; org.slf4j.Logger;\n&lt;span class=\"hljs-keyword\"&gt;import&lt;/span&gt; org.slf4j.LoggerFactory;\n\n&lt;span class=\"hljs-keyword\"&gt;import&lt;/span&gt; ru.yandex.yt.ytclient.tables.ColumnSchema;\n&lt;span class=\"hljs-keyword\"&gt;import&lt;/span&gt; ru.yandex.yt.ytclient.wire.UnversionedRow;\n&lt;span class=\"hljs-keyword\"&gt;import&lt;/span&gt; ru.yandex.yt.ytclient.wire.UnversionedRowset;\n&lt;span class=\"hljs-keyword\"&gt;import&lt;/span&gt; ru.yandex.yt.ytclient.wire.UnversionedValue;\n&lt;span class=\"hljs-keyword\"&gt;import&lt;/span&gt; ru.yandex.yt.ytclient.ytree.YTreeMapNode;\n\n&lt;span class=\"hljs-keyword\"&gt;public&lt;/span&gt; &lt;span class=\"hljs-keyword\"&gt;class&lt;/span&gt; &lt;span class=\"hljs-title class_\"&gt;SelectRowsExample&lt;/span&gt; {\n    &lt;span class=\"hljs-keyword\"&gt;private&lt;/span&gt; &lt;span class=\"hljs-keyword\"&gt;static&lt;/span&gt; &lt;span class=\"hljs-keyword\"&gt;final&lt;/span&gt; &lt;span class=\"hljs-type\"&gt;Logger&lt;/span&gt; &lt;span class=\"hljs-variable\"&gt;logger&lt;/span&gt; &lt;span class=\"hljs-operator\"&gt;=&lt;/span&gt; LoggerFactory.getLogger(SelectRowsExample.class);\n\n    &lt;span class=\"hljs-keyword\"&gt;public&lt;/span&gt; &lt;span class=\"hljs-keyword\"&gt;static&lt;/span&gt; &lt;span class=\"hljs-keyword\"&gt;void&lt;/span&gt; &lt;span class=\"hljs-title function_\"&gt;main&lt;/span&gt;&lt;span class=\"hljs-params\"&gt;(String[] args)&lt;/span&gt; {\n        ExamplesUtil.runExampleWithBalancing(client -&amp;gt; {\n            &lt;span class=\"hljs-type\"&gt;long&lt;/span&gt; &lt;span class=\"hljs-variable\"&gt;t0&lt;/span&gt; &lt;span class=\"hljs-operator\"&gt;=&lt;/span&gt; System.nanoTime();\n            &lt;span class=\"hljs-type\"&gt;UnversionedRowset&lt;/span&gt; &lt;span class=\"hljs-variable\"&gt;rowset&lt;/span&gt; &lt;span class=\"hljs-operator\"&gt;=&lt;/span&gt; client.selectRows(\n                    &lt;span class=\"hljs-string\"&gt;\"timestamp, host, rack, utc_time, data FROM [//home/dev/autorestart_nodes_copy] LIMIT 10\"&lt;/span&gt;)\n                    .join();\n            &lt;span class=\"hljs-type\"&gt;long&lt;/span&gt; &lt;span class=\"hljs-variable\"&gt;t1&lt;/span&gt; &lt;span class=\"hljs-operator\"&gt;=&lt;/span&gt; System.nanoTime();\n            logger.info(&lt;span class=\"hljs-string\"&gt;\"Request time: {}\"&lt;/span&gt;, (t1 - t0) / &lt;span class=\"hljs-number\"&gt;1000000.0&lt;/span&gt;);\n            logger.info(&lt;span class=\"hljs-string\"&gt;\"Result schema:\"&lt;/span&gt;);\n            &lt;span class=\"hljs-keyword\"&gt;for&lt;/span&gt; (ColumnSchema column : rowset.getSchema().getColumns()) {\n                logger.info(&lt;span class=\"hljs-string\"&gt;\"    {}\"&lt;/span&gt;, column.getName());\n            }\n            &lt;span class=\"hljs-keyword\"&gt;for&lt;/span&gt; (UnversionedRow row : rowset.getRows()) {\n                logger.info(&lt;span class=\"hljs-string\"&gt;\"Row:\"&lt;/span&gt;);\n                &lt;span class=\"hljs-keyword\"&gt;for&lt;/span&gt; (UnversionedValue value : row.getValues()) {\n                    logger.info(&lt;span class=\"hljs-string\"&gt;\"    value: {}\"&lt;/span&gt;, value);\n                }\n            }\n            &lt;span class=\"hljs-keyword\"&gt;for&lt;/span&gt; (YTreeMapNode row : rowset.getYTreeRows()) {\n                logger.info(&lt;span class=\"hljs-string\"&gt;\"Row: {}\"&lt;/span&gt;, row);\n            }\n        });\n    }\n}\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"53\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-53\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-53\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-53.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Working with Cypress:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs java\"&gt;&lt;span class=\"hljs-keyword\"&gt;package&lt;/span&gt; ru.yandex.yt.ytclient.examples;\n\n&lt;span class=\"hljs-keyword\"&gt;import&lt;/span&gt; org.slf4j.Logger;\n&lt;span class=\"hljs-keyword\"&gt;import&lt;/span&gt; org.slf4j.LoggerFactory;\n\n&lt;span class=\"hljs-keyword\"&gt;public&lt;/span&gt; &lt;span class=\"hljs-keyword\"&gt;class&lt;/span&gt; &lt;span class=\"hljs-title class_\"&gt;GetNodeExample&lt;/span&gt; {\n    &lt;span class=\"hljs-keyword\"&gt;private&lt;/span&gt; &lt;span class=\"hljs-keyword\"&gt;static&lt;/span&gt; &lt;span class=\"hljs-keyword\"&gt;final&lt;/span&gt; &lt;span class=\"hljs-type\"&gt;Logger&lt;/span&gt; &lt;span class=\"hljs-variable\"&gt;logger&lt;/span&gt; &lt;span class=\"hljs-operator\"&gt;=&lt;/span&gt; LoggerFactory.getLogger(GetNodeExample.class);\n\n    &lt;span class=\"hljs-keyword\"&gt;public&lt;/span&gt; &lt;span class=\"hljs-keyword\"&gt;static&lt;/span&gt; &lt;span class=\"hljs-keyword\"&gt;void&lt;/span&gt; &lt;span class=\"hljs-title function_\"&gt;main&lt;/span&gt;&lt;span class=\"hljs-params\"&gt;(String[] args)&lt;/span&gt; {\n        ExamplesUtil.runExample(client -&amp;gt; {\n            logger.info(&lt;span class=\"hljs-string\"&gt;\"Table dynamic: {}\"&lt;/span&gt;, client.getNode(&lt;span class=\"hljs-string\"&gt;\"//home/dev/autorestart_nodes_copy/@dynamic\"&lt;/span&gt;).join());\n            logger.info(&lt;span class=\"hljs-string\"&gt;\"Table schema: {}\"&lt;/span&gt;, client.getNode(&lt;span class=\"hljs-string\"&gt;\"//home/dev/autorestart_nodes_copy/@schema\"&lt;/span&gt;).join());\n        });\n    }\n}\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"57\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-57\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-57\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-57.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Working with Cypress:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs java\"&gt;&lt;span class=\"hljs-keyword\"&gt;package&lt;/span&gt; ru.yandex.yt.ytclient.examples;\n\n&lt;span class=\"hljs-keyword\"&gt;import&lt;/span&gt; java.util.Random;\n\n&lt;span class=\"hljs-keyword\"&gt;import&lt;/span&gt; joptsimple.OptionParser;\n&lt;span class=\"hljs-keyword\"&gt;import&lt;/span&gt; joptsimple.OptionSet;\n&lt;span class=\"hljs-keyword\"&gt;import&lt;/span&gt; joptsimple.OptionSpec;\n\n&lt;span class=\"hljs-keyword\"&gt;import&lt;/span&gt; ru.yandex.yt.rpcproxy.ETransactionType;\n&lt;span class=\"hljs-keyword\"&gt;import&lt;/span&gt; ru.yandex.yt.ytclient.misc.YtGuid;\n&lt;span class=\"hljs-keyword\"&gt;import&lt;/span&gt; ru.yandex.yt.ytclient.proxy.ApiServiceTransaction;\n&lt;span class=\"hljs-keyword\"&gt;import&lt;/span&gt; ru.yandex.yt.ytclient.proxy.ApiServiceTransactionOptions;\n&lt;span class=\"hljs-keyword\"&gt;import&lt;/span&gt; ru.yandex.yt.ytclient.proxy.request.ObjectType;\n\n&lt;span class=\"hljs-keyword\"&gt;public&lt;/span&gt; &lt;span class=\"hljs-keyword\"&gt;class&lt;/span&gt; &lt;span class=\"hljs-title class_\"&gt;CypressExample&lt;/span&gt; {\n\n    &lt;span class=\"hljs-keyword\"&gt;public&lt;/span&gt; &lt;span class=\"hljs-keyword\"&gt;static&lt;/span&gt; &lt;span class=\"hljs-keyword\"&gt;void&lt;/span&gt; &lt;span class=\"hljs-title function_\"&gt;main&lt;/span&gt;&lt;span class=\"hljs-params\"&gt;(String[] args)&lt;/span&gt; {\n        &lt;span class=\"hljs-keyword\"&gt;try&lt;/span&gt; {\n            &lt;span class=\"hljs-type\"&gt;OptionParser&lt;/span&gt; &lt;span class=\"hljs-variable\"&gt;parser&lt;/span&gt; &lt;span class=\"hljs-operator\"&gt;=&lt;/span&gt; &lt;span class=\"hljs-keyword\"&gt;new&lt;/span&gt; &lt;span class=\"hljs-title class_\"&gt;OptionParser&lt;/span&gt;();\n\n            OptionSpec&amp;lt;String&amp;gt; proxyOpt = parser.accepts(&lt;span class=\"hljs-string\"&gt;\"proxy\"&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;\"proxy (see //sys/rpc_proxies)\"&lt;/span&gt;)\n                    .withRequiredArg().ofType(String.class);\n\n            &lt;span class=\"hljs-type\"&gt;OptionSet&lt;/span&gt; &lt;span class=\"hljs-variable\"&gt;option&lt;/span&gt; &lt;span class=\"hljs-operator\"&gt;=&lt;/span&gt; parser.parse(args);\n\n            String [] hosts = &lt;span class=\"hljs-literal\"&gt;null&lt;/span&gt;;\n\n            &lt;span class=\"hljs-keyword\"&gt;if&lt;/span&gt; (option.hasArgument(proxyOpt)) {\n                &lt;span class=\"hljs-type\"&gt;String&lt;/span&gt; &lt;span class=\"hljs-variable\"&gt;line&lt;/span&gt; &lt;span class=\"hljs-operator\"&gt;=&lt;/span&gt; option.valueOf(proxyOpt);\n                hosts = line.split(&lt;span class=\"hljs-string\"&gt;\",\"&lt;/span&gt;);\n            } &lt;span class=\"hljs-keyword\"&gt;else&lt;/span&gt; {\n                parser.printHelpOn(System.out);\n                System.exit(&lt;span class=\"hljs-number\"&gt;1&lt;/span&gt;);\n            }\n\n            &lt;span class=\"hljs-type\"&gt;Random&lt;/span&gt; &lt;span class=\"hljs-variable\"&gt;rnd&lt;/span&gt; &lt;span class=\"hljs-operator\"&gt;=&lt;/span&gt; &lt;span class=\"hljs-keyword\"&gt;new&lt;/span&gt; &lt;span class=\"hljs-title class_\"&gt;Random&lt;/span&gt;();\n            &lt;span class=\"hljs-type\"&gt;String&lt;/span&gt; &lt;span class=\"hljs-variable\"&gt;host&lt;/span&gt; &lt;span class=\"hljs-operator\"&gt;=&lt;/span&gt; hosts[rnd.nextInt(hosts.length)];\n\n            ExamplesUtil.runExample(client -&amp;gt; {\n                &lt;span class=\"hljs-keyword\"&gt;try&lt;/span&gt; {\n                    &lt;span class=\"hljs-type\"&gt;ApiServiceTransactionOptions&lt;/span&gt; &lt;span class=\"hljs-variable\"&gt;transactionOptions&lt;/span&gt; &lt;span class=\"hljs-operator\"&gt;=&lt;/span&gt;\n                            &lt;span class=\"hljs-keyword\"&gt;new&lt;/span&gt; &lt;span class=\"hljs-title class_\"&gt;ApiServiceTransactionOptions&lt;/span&gt;(ETransactionType.MASTER);\n\n                    &lt;span class=\"hljs-type\"&gt;String&lt;/span&gt; &lt;span class=\"hljs-variable\"&gt;node&lt;/span&gt; &lt;span class=\"hljs-operator\"&gt;=&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;\"//tmp/test-node-cypress-example\"&lt;/span&gt;;\n                    &lt;span class=\"hljs-type\"&gt;ApiServiceTransaction&lt;/span&gt; &lt;span class=\"hljs-variable\"&gt;t&lt;/span&gt; &lt;span class=\"hljs-operator\"&gt;=&lt;/span&gt; client.startTransaction(transactionOptions).get();\n\n\n                    t.existsNode(node).thenAccept(result -&amp;gt; {\n                        &lt;span class=\"hljs-keyword\"&gt;try&lt;/span&gt; {\n                            &lt;span class=\"hljs-keyword\"&gt;if&lt;/span&gt; (result) {\n                                t.removeNode(node);\n                            }\n                        } &lt;span class=\"hljs-keyword\"&gt;catch&lt;/span&gt; (Throwable e) {\n                            &lt;span class=\"hljs-keyword\"&gt;throw&lt;/span&gt; &lt;span class=\"hljs-keyword\"&gt;new&lt;/span&gt; &lt;span class=\"hljs-title class_\"&gt;RuntimeException&lt;/span&gt;(e);\n                        }\n                    }).get();\n\n                    &lt;span class=\"hljs-type\"&gt;YtGuid&lt;/span&gt; &lt;span class=\"hljs-variable\"&gt;guid&lt;/span&gt; &lt;span class=\"hljs-operator\"&gt;=&lt;/span&gt; t.createNode(node, ObjectType.Table).get();\n                    &lt;span class=\"hljs-comment\"&gt;/*\n                    Map&amp;lt;String, YTreeNode&amp;gt; data = new HashMap&amp;lt;String, YTreeNode&amp;gt;();\n                    data.put(\"k1\", new YTreeInt64Node(10, new HashMap&amp;lt;&amp;gt;()));\n                    data.put(\"k2\", new YTreeInt64Node(31337, new HashMap&amp;lt;&amp;gt;()));\n                    data.put(\"str\", new YTreeStringNode(\"stroka\"));\n                    t.setNode(node, new YTreeMapNode(data)).get();\n                    */&lt;/span&gt;\n                    t.commit();\n\n                    &lt;span class=\"hljs-type\"&gt;ApiServiceTransaction&lt;/span&gt; &lt;span class=\"hljs-variable\"&gt;t2&lt;/span&gt; &lt;span class=\"hljs-operator\"&gt;=&lt;/span&gt; client.startTransaction(transactionOptions).get();\n                    t2.linkNode(node, node + &lt;span class=\"hljs-string\"&gt;\"-link\"&lt;/span&gt;);\n                    t2.moveNode(node, node + &lt;span class=\"hljs-string\"&gt;\"-moved\"&lt;/span&gt;);\n                    t2.commit();\n\n                    client.removeNode(node + &lt;span class=\"hljs-string\"&gt;\"-link\"&lt;/span&gt;);\n\n                } &lt;span class=\"hljs-keyword\"&gt;catch&lt;/span&gt; (Throwable e) {\n                    System.out.println(e);\n                    e.printStackTrace();\n                    System.exit(-&lt;span class=\"hljs-number\"&gt;1&lt;/span&gt;);\n                }\n            }, ExamplesUtil.getUser(), ExamplesUtil.getToken(), host);\n\n            System.exit(&lt;span class=\"hljs-number\"&gt;0&lt;/span&gt;); ia Python, you need to install a bindings package, the pypi-package is called ytsaurus-rpc-driver. After that, you need to specify rpc as the backend.&lt;/p&gt;\n&lt;p&gt;{}&lt;/p&gt;\n&lt;p&gt;Working with dynamic tables:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs python\"&gt;&lt;span class=\"hljs-keyword\"&gt;import&lt;/span&gt; yt.wrapper &lt;span class=\"hljs-keyword\"&gt;as&lt;/span&gt; yt\n\n&lt;span class=\"hljs-keyword\"&gt;def&lt;/span&gt; &lt;span class=\"hljs-title function_\"&gt;main&lt;/span&gt;():\n    client = yt.YtClient(&lt;span class=\"hljs-string\"&gt;\"cluster-name\"&lt;/span&gt;, config={&lt;span class=\"hljs-string\"&gt;\"backend\"&lt;/span&gt;: &lt;span class=\"hljs-string\"&gt;\"rpc\"&lt;/span&gt;})\n    schema = [\n        {&lt;span class=\"hljs-string\"&gt;\"name\"&lt;/span&gt;: &lt;span class=\"hljs-string\"&gt;\"x\"&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;\"type\"&lt;/span&gt;: &lt;span class=\"hljs-string\"&gt;\"int64\"&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;\"sort_order\"&lt;/span&gt;: &lt;span class=\"hljs-string\"&gt;\"ascending\"&lt;/span&gt;},\n        {&lt;span class=\"hljs-string\"&gt;\"name\"&lt;/span&gt;: &lt;span class=\"hljs-string\"&gt;\"y\"&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;\"type\"&lt;/span&gt;: &lt;span class=\"hljs-string\"&gt;\"int64\"&lt;/span&gt;},\n        {&lt;span class=\"hljs-string\"&gt;\"name\"&lt;/span&gt;: &lt;span class=\"hljs-string\"&gt;\"z\"&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;\"type\"&lt;/span&gt;: &lt;span class=\"hljs-string\"&gt;\"int64\"&lt;/span&gt;}\n    ]\n\n    table = &lt;span class=\"hljs-string\"&gt;\"//home/ignat/dynamic_table\"&lt;/span&gt;\n    client.create(&lt;span class=\"hljs-string\"&gt;\"table\"&lt;/span&gt;, table, attributes={&lt;span class=\"hljs-string\"&gt;\"schema\"&lt;/span&gt;: schema, &lt;span class=\"hljs-string\"&gt;\"dynamic\"&lt;/span&gt;: &lt;span class=\"hljs-literal\"&gt;True&lt;/span&gt;})\n    client.mount_table(table, sync=&lt;span class=\"hljs-literal\"&gt;True&lt;/span&gt;)\n    client.insert_rows(table, [{&lt;span class=\"hljs-string\"&gt;\"x\"&lt;/span&gt;: &lt;span class=\"hljs-number\"&gt;0&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;\"y\"&lt;/span&gt;: &lt;span class=\"hljs-number\"&gt;99&lt;/span&gt;}])\n\n    &lt;span class=\"hljs-keyword\"&gt;for&lt;/span&gt; &lt;span class=\"hljs-built_in\"&gt;iter&lt;/span&gt; &lt;span class=\"hljs-keyword\"&gt;in&lt;/span&gt; xrange(&lt;span class=\"hljs-number\"&gt;5&lt;/span&gt;):\n        &lt;span class=\"hljs-keyword\"&gt;with&lt;/span&gt; client.Transaction(&lt;span class=\"hljs-built_in\"&gt;type&lt;/span&gt;=&lt;span class=\"hljs-string\"&gt;\"tablet\"&lt;/span&gt;):\n            rows = &lt;span class=\"hljs-built_in\"&gt;list&lt;/span&gt;(client.lookup_rows(table, [{&lt;span class=\"hljs-string\"&gt;\"x\"&lt;/span&gt;: &lt;span class=\"hljs-number\"&gt;0&lt;/span&gt;}]))\n            &lt;span class=\"hljs-keyword\"&gt;if&lt;/span&gt; &lt;span class=\"hljs-built_in\"&gt;len&lt;/span&gt;(rows) == &lt;span class=\"hljs-number\"&gt;1&lt;/span&gt; &lt;span class=\"hljs-keyword\"&gt;and&lt;/span&gt; rows[&lt;span class=\"hljs-number\"&gt;0&lt;/span&gt;][&lt;span class=\"hljs-string\"&gt;\"y\"&lt;/span&gt;] &amp;lt;= &lt;span class=\"hljs-number\"&gt;100&lt;/span&gt;:\n                rows[&lt;span class=\"hljs-number\"&gt;0&lt;/span&gt;][&lt;span class=\"hljs-string\"&gt;\"y\"&lt;/span&gt;] += &lt;span class=\"hljs-number\"&gt;1&lt;/span&gt;\n                client.insert_rows(table, rows)\n\n    &lt;span class=\"hljs-built_in\"&gt;print&lt;/span&gt; &lt;span class=\"hljs-built_in\"&gt;list&lt;/span&gt;(client.select_rows(&lt;span class=\"hljs-string\"&gt;\"* from [{}]\"&lt;/span&gt;.&lt;span class=\"hljs-built_in\"&gt;format&lt;/span&gt;(table)))\n\n&lt;span class=\"hljs-keyword\"&gt;if&lt;/span&gt; __name__ == &lt;span class=\"hljs-string\"&gt;\"__main__\"&lt;/span&gt;:\n    main()\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"82\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-82\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-82\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-82.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;In order for the client to use proxies with a certain role (such as &lt;code&gt;my_role&lt;/code&gt;), you need to specify the &lt;code&gt;proxy_role&lt;/code&gt; option in the config:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs python\"&gt;client = yt.YtClient(&lt;span class=\"hljs-string\"&gt;\"cluster-name\"&lt;/span&gt;, config={&lt;span class=\"hljs-string\"&gt;\"backend\"&lt;/span&gt;: &lt;span class=\"hljs-string\"&gt;\"rpc\"&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;\"driver_config\"&lt;/span&gt;: {&lt;span class=\"hljs-string\"&gt;\"proxy_role\"&lt;/span&gt;: &lt;span class=\"hljs-string\"&gt;\"my_role\"&lt;/span&gt;}})\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"86\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-86\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-86\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-86.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;We also recommend enabling debug logs of the client library. Such logs will help a lot when problems arise. Besides a usual method, you can explicitly set up logging via the &lt;code&gt;YT_LOG_LEVEL=debug&lt;/code&gt; environment variable in the rpc proxy client. To do this, pass the logging config via the &lt;code&gt;driver_logging_config&lt;/code&gt; parameter:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs python\"&gt;logging_config = {\n    &lt;span class=\"hljs-string\"&gt;'rules'&lt;/span&gt;: [{&lt;span class=\"hljs-string\"&gt;'min_level'&lt;/span&gt;: &lt;span class=\"hljs-string\"&gt;'debug'&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;'writers'&lt;/span&gt;: [&lt;span class=\"hljs-string\"&gt;'file'&lt;/span&gt;]}],\n    &lt;span class=\"hljs-string\"&gt;'writers'&lt;/span&gt;: {&lt;span class=\"hljs-string\"&gt;'file'&lt;/span&gt;: {&lt;span class=\"hljs-string\"&gt;'file_name'&lt;/span&gt;: logging_file_name, &lt;span class=\"hljs-string\"&gt;'type'&lt;/span&gt;: &lt;span class=\"hljs-string\"&gt;'file'&lt;/span&gt;}}\n}\nclient = yt.YtClient(&lt;span class=\"hljs-string\"&gt;\"cluster-name\"&lt;/span&gt;, config={&lt;span class=\"hljs-string\"&gt;\"backend\"&lt;/span&gt;: &lt;span class=\"hljs-string\"&gt;\"rpc\"&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;\"driver_logging_config\"&lt;/span&gt;: logging_config})\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"90\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-90\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-90\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-90.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"en/user-guide/proxy/rpc.md","sourcePath":"en/user-guide/proxy/rpc.md"},"headings":[{"title":"С++","href":"en/user-guide/proxy/rpc.html#c_plus_plus","level":2},{"title":"Java","href":"en/user-guide/proxy/rpc.html#java","level":2},{"title":"Python","href":"en/user-guide/proxy/rpc.html#python","level":2}],"title":"RPC proxy"},"router":{"pathname":"en/user-guide/proxy/rpc","depth":4,"base":"../../../"},"lang":"en","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/en/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-a29ea7877730322f2ce693378d06d02ac2b374cd-en","searchApiKey":"f039bc42de5c29003db67eb703353c1d","qu
