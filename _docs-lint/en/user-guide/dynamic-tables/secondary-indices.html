        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;In database theory, a secondary index is a data structure that allows for faster table sampling by non-key columns. An indexed tuple of non-key columns is called a &lt;em&gt;secondary key&lt;/em&gt;.&lt;/p&gt;\n&lt;p&gt;In YTsaurus, these structures are implemented for sorted dynamic tables as separate tables, hereafter referred to as index tables, and special objects linking the indexed table to the index one. In YTsaurus terminology, these objects are called secondary indexes. They do not have their own paths in Cypress, are immutable, and exist as long as both the indexed and index tables exist.&lt;/p&gt;\n&lt;p&gt;Secondary indexes are also supported for replicated tables.&lt;/p&gt;\n&lt;h2 id=\"usage\"&gt;&lt;a href=\"en/user-guide/dynamic-tables/secondary-indices.html#usage\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Usage&lt;/span&gt;&lt;/a&gt;Usage&lt;/h2&gt;\n&lt;p&gt;By default, indexing is performed by a tuple of one or more non-key table columns, and there is a bijective correspondence between table rows — this behavior is set by the &lt;code&gt;kind=full_sync&lt;/code&gt; secondary index attribute.&lt;/p&gt;\n&lt;p&gt;The index table schema determines which data can be sampled faster with the use of the index. For efficient read range selection, the secondary key must be a prefix of the index table's key. Fast access to data in an indexed table is achieved by storing its full key (called a &lt;em&gt;primary&lt;/em&gt; key) in the index table. Since rows of sorted dynamic tables must have unique keys, the index table key must contain the primary key, representing a concatenation of the secondary and primary keys (there is an &lt;a href=\"user-guide/dynamic-tables/secondary-indices#unique\"&gt;exception&lt;/a&gt; to this rule).&lt;/p&gt;\n&lt;p&gt;An index table may contain one or more non-key columns of the indexed table as its own non-key columns. It may also contain no significant non-key values, but in this case you will have to add to the index table schema a dummy column &lt;code&gt;$empty&lt;/code&gt; of the &lt;code&gt;int64&lt;/code&gt; type, which will always have a null value.&lt;/p&gt;\n&lt;p&gt;Example of creating tables and a linking secondary index:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;yt create table //path/to/table --attributes &lt;span class=\"hljs-string\"&gt;'{dynamic=true; schema=[{name=key; type=int64; sort_order=ascending}; {name=value; type=string}]}'&lt;/span&gt;\nyt create table //path/to/index_table --attributes &lt;span class=\"hljs-string\"&gt;'{dynamic=true; schema=[{name=value; type=string; sort_order=ascending}; {name=key; type=int64; sort_order=ascending}; {name=\"$empty\"; type=int64}]}'&lt;/span&gt;\nyt create secondary_index --attributes &lt;span class=\"hljs-string\"&gt;'{table_path=\"//path/to/table\"; index_table_path=\"//path/to/index/table\"; kind=full_sync; table_to_index_correspondence=bijective}'&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"24\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-24\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-24\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-24.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;The &lt;code&gt;table_to_index_correspondence&lt;/code&gt; mutable attribute specifies the relationship YTsaurus should assume between the rows of the indexed and index tables. It does NOT describe the actual relationship between table rows and can be changed manually by the user. Possible values for this attribute include &lt;code&gt;bijective&lt;/code&gt;, &lt;code&gt;injective&lt;/code&gt;, &lt;code&gt;invalid&lt;/code&gt;, and &lt;code&gt;unknown&lt;/code&gt;. Using an index with an &lt;code&gt;invalid&lt;/code&gt; relationship is prohibited and will result in an error. &lt;code&gt;injective&lt;/code&gt; indicates the presence of index table rows that do not correspond to any rows in the indexed table. For example, this can occur when creating tables without downtime. &lt;code&gt;bijective&lt;/code&gt; indicates that the rows of the tables fully match.  Both the &lt;code&gt;bijective&lt;/code&gt; and &lt;code&gt;injective&lt;/code&gt; relationships represent healthy table states. For information about their differences, read below. You may see the &lt;code&gt;unknown&lt;/code&gt; relationship in indexes created by older YTsaurus versions.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Note&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Note that the column names and types in the tables are exactly the same. If the index table contains columns that are not in the indexed table, or their types do not match, a secondary index creation error occurs (except for the dummy column &lt;code&gt;$empty&lt;/code&gt;, which is not required in the indexed table).&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;A secondary index can be created only if both tables are unmounted. Once the secondary index is created and the tables are mounted, &lt;em&gt;further&lt;/em&gt; writes to the indexed table are automatically displayed in the index table (learn more about building an index table on top of the existing data &lt;a href=\"user-guide/dynamic-tables/secondary-indices#building\"&gt;here&lt;/a&gt;). You can also execute efficient select queries with filtering by secondary key using the &lt;code&gt;WITH INDEX&lt;/code&gt; keyword. A query with an index runs efficiently if the predicate can be used to &lt;a href=\"user-guide/dynamic-tables/dyn-query-language#input_data_cut\"&gt;infer&lt;/a&gt; relevant read ranges from the index table.&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;yt select-rows &lt;span class=\"hljs-string\"&gt;\"key, value FROM [//path/to/table] WITH INDEX [//path/to/index/table] AS IndexTable where value BETWEEN 0 and 10\"&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"41\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-41\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-41\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-41.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;When executing a query with this syntax, the system first reads the rows matching the &lt;code&gt;where value BETWEEN 0 and 10&lt;/code&gt; predicate from the index table and then performs an inner join with the indexed table rows by common columns for indexes with an &lt;code&gt;injective&lt;/code&gt; relation or by primary key for &lt;code&gt;bijective&lt;/code&gt; indexes. Such a query is equivalent to one of the following:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;yt select-rows &lt;span class=\"hljs-string\"&gt;\"key, value FROM [//path/to/injective/index/table] AS IndexTable JOIN [//path/to/table] ON (IndexTable.key, IndexTable.value) = (key, value) WHERE IndexTable.value BETWEEN 0 and 10\"&lt;/span&gt;\nyt select-rows &lt;span class=\"hljs-string\"&gt;\"key, value FROM [//path/to/bijective/index/table] AS IndexTable JOIN [//path/to/table] ON IndexTable.key = key WHERE IndexTable.value BETWEEN 0 and 10\"&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"45\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-45\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-45\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-45.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;A current list of secondary indexes connected to the table is specified in the &lt;code&gt;secondary_indices&lt;/code&gt; table attribute. A secondary index for which this particular table is an index one is specified in the &lt;code&gt;index_to&lt;/code&gt; attribute.&lt;/p&gt;\n&lt;p&gt;You can also exclude some rows from the index, create an index over a column with a list, and create a special index that enforces uniqueness of the secondary keys in the table.&lt;/p&gt;\n&lt;h3 id=\"predicate\"&gt;&lt;a href=\"en/user-guide/dynamic-tables/secondary-indices.html#predicate\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Partial indexing&lt;/span&gt;&lt;/a&gt;Partial indexing&lt;/h3&gt;\n&lt;p&gt;An index table may contain not all rows, but only those that satisfy a certain predicate. This predicate is set by the &lt;code&gt;predicate&lt;/code&gt; secondary index attribute. It must be a valid boolean expression over the indexed table schema (the predicate can use columns that don't exist in the index table). The &lt;code&gt;predicate&lt;/code&gt; attribute is compatible with any of the secondary index types.&lt;/p&gt;\n&lt;p&gt;This can be helpful if the queries the index is useful for are related only to a particular isolated portion of the data. For example, the table schema is &lt;code&gt;[{name=id; sort_order=ascending; type=uint64}; {name=name; type=string}; {name=age; type=int64}; {name=loyalty; type=boolean}; ...]&lt;/code&gt;, and in queries you perform sampling by age only for the rows with a non-null &lt;code&gt;loyalty&lt;/code&gt; value. In this case, a secondary index with the &lt;code&gt;not is_null(loyalty)&lt;/code&gt; predicate and an index table with the schema &lt;code&gt;[{name=age; type=int64; sort_order=ascending}; {name=id; sort_order=ascending; type=uint64}; {name=$empty, type=int64}]&lt;/code&gt; is an optimal solution: the rows with &lt;code&gt;loyalty=#&lt;/code&gt; will not appear in the index table.&lt;/p&gt;\n&lt;h3 id=\"unfolding\"&gt;&lt;a href=\"en/user-guide/dynamic-tables/secondary-indices.html#unfolding\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Index over a list&lt;/span&gt;&lt;/a&gt;Index over a list&lt;/h3&gt;\n&lt;p&gt;A &lt;code&gt;kind=unfolding&lt;/code&gt; index unfolds rows by a column with a list of elementary type values. With this index, you can perform sampling of rows where the indexed list contains specific values. For example, the row &lt;code&gt;{id=0; child_ids=[1, 4, 7]}&lt;/code&gt; will correspond to the rows &lt;code&gt;[{child_ids=1; id=0}; {child_ids=4; id=0}; {child_ids=7; id=0}]&lt;/code&gt; in the index table. When creating such an index, specify the &lt;code&gt;unfolded_column&lt;/code&gt; attribute, which represents the name of a column of type &lt;code&gt;T&lt;/code&gt; in the index table and a column of type &lt;code&gt;List&amp;lt;T&amp;gt;&lt;/code&gt; or &lt;code&gt;Optional&amp;lt;List&amp;lt;T&amp;gt;&amp;gt;&lt;/code&gt; in the indexed table. In select queries, you can set a filter on the indexed value using the &lt;code&gt;list_contains&lt;/code&gt; function. Example: &lt;code&gt;id FROM [//path/to/table] WITH INDEX [//path/to/index/table] AS IndexTable where list_contains(child_ids, 1)&lt;/code&gt;.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Note&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;When multiple allowable \"child_ids\" values are specified in the predicate, such as &lt;code&gt;list_contains(child_ids, 1) or list_contains(child_ids, 4)&lt;/code&gt;, the select query may return multiple rows corresponding to the same primary key in the indexed table if both values are contained in the indexed list. In order for uniqueness to be restored, result must be grouped by the table’s primary key.&lt;/p&gt;\n&lt;p&gt;A &lt;code&gt;list_contains(child_ids, 1) OR list_contains(child_ids, 2) OR ...&lt;/code&gt; query cannot contain a large number of conditions because of the limitation on the syntax tree depth in all query expressions. To mitigate this limitation, you can write the predicate in the following form: &lt;code&gt;child_ids IN (1, 2, ...)&lt;/code&gt;. In this case, the system will interpret the reference to the \"child_ids\" column as a reference to a column in the index table.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;For example, let the rows in a table with the schema &lt;code&gt;[{name=id; type=int64; sort_order=ascending}; {name=book_name; type=string}; {name=genres; type_v3={type_name=list; item=string}}; ...]&lt;/code&gt; describe books. To perform quick sampling by genre, you can use the &lt;code&gt;unfolding&lt;/code&gt; secondary index over the index table with the schema &lt;code&gt;[{name=genres; sort_order=ascending; type=string};{name=id; type=int64; sort_order=ascending}; {name=book_name; type=string}]&lt;/code&gt; — the &lt;code&gt;book_name&lt;/code&gt; column in the index table schema will enable you to use the index table without joining it to the indexed one for queries where only the &lt;code&gt;genres&lt;/code&gt;, &lt;code&gt;book_name&lt;/code&gt;, and &lt;code&gt;id&lt;/code&gt; columns are needed, further reducing the number of reads and speeding up query execution.&lt;/p&gt;\n&lt;h3 id=\"unique\"&gt;&lt;a href=\"en/user-guide/dynamic-tables/secondary-indices.html#unique\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Unique index&lt;/span&gt;&lt;/a&gt;Unique index&lt;/h3&gt;\n&lt;p&gt;A &lt;code&gt;kind=unique&lt;/code&gt; index maintains the uniqueness of the secondary key in the indexed table. A key in an index table schema for a secondary index of this kind is the secondary key, and non-key values are the primary key. Should user attempt a write which would result in two rows with the same secondary key being present in the indexed table, the &lt;code&gt;UniqueIndexConflict&lt;/code&gt; error will occur. Should two transactions with row writes that have different primary keys and identical secondary keys conflict, one of them will be aborted with the &lt;code&gt;TransactionLockConflict&lt;/code&gt; error.&lt;/p&gt;\n&lt;h3 id=\"sharding\"&gt;&lt;a href=\"en/user-guide/dynamic-tables/secondary-indices.html#sharding\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Secondary index sharding&lt;/span&gt;&lt;/a&gt;Secondary index sharding&lt;/h3&gt;\n&lt;p&gt;A popular solution for data sharding is using &lt;a href=\"user-guide/dynamic-tables/resharding#expression\"&gt;computed key columns&lt;/a&gt;, which are independent between the index table and the indexed one — such columns can have the same or different names, types, and expressions so that sharding can be controlled independently. Please note that, just as with regular tables, using a computed column in an index table will make queries with a range by indexed column inefficient.&lt;/p&gt;\n&lt;h3 id=\"copy-move\"&gt;&lt;a href=\"en/user-guide/dynamic-tables/secondary-indices.html#copy-move\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Copying and moving&lt;/span&gt;&lt;/a&gt;Copying and moving&lt;/h3&gt;\n&lt;p&gt;In the current version of YTsaurus, you cannot copy or move an index or indexed table while maintaining a secondary index that links them. Attempting to do this will result in an error. In this case, the correct procedure is to unmount the tables, delete the secondary indexes, perform the desired operations in Cypress, recreate the secondary indexes with the same attributes, then re-mount the tables. Alternatively, you can specify the &lt;code&gt;allow_secondary_index_abandonment=%true&lt;/code&gt; parameter for your operations. In this case, all affected secondary indexes are deleted automatically.&lt;/p&gt;\n&lt;h2 id=\"limitations\"&gt;&lt;a href=\"en/user-guide/dynamic-tables/secondary-indices.html#limitations\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Limitations&lt;/span&gt;&lt;/a&gt;Limitations&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;\n&lt;p&gt;Since a select query using an index performs a table join, reads must be performed within a transaction to obtain a globally consistent slice (by default, select queries are executed with SyncLastCommittedTimestamp; in this mode, the system generally cannot guarantee consistency between two data structures).&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;Indexing by aggregate columns and writing to an indexed table with a &lt;code&gt;shared write&lt;/code&gt; lock are prohibited.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;Insertions to an indexed table via a &lt;a href=\"user-guide/dynamic-tables/bulk-insert\"&gt;map-reduce operation&lt;/a&gt; are not displayed in the index table.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;Changing the schema of a table with a secondary index has its specifics as well. When adding a key column, it must first be added to the index tables, and only then to the indexed table. When adding a non-key column, the opposite is true (or it may be omitted from index tables).&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;All secondary key columns, as well as columns used in the predicate, must have the same &lt;code&gt;lock&lt;/code&gt; &lt;a href=\"user-guide/dynamic-tables/transactions#conflicts\"&gt;group&lt;/a&gt; in the indexed table.&lt;/p&gt;\n&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h3 id=\"limitations-imposed-on-replicated-tables\"&gt;&lt;a href=\"en/user-guide/dynamic-tables/secondary-indices.html#limitations-imposed-on-replicated-tables\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Limitations imposed on replicated tables&lt;/span&gt;&lt;/a&gt;Limitations imposed on replicated tables&lt;/h3&gt;\n&lt;p&gt;Consistent reads from replicated tables when using secondary indexes are possible only if the index and indexed tables have an overlapping set of clusters with synchronous replicas. Before creating a secondary index, make sure that the indexed table and all index tables are combined into a single &lt;a href=\"user-guide/dynamic-tables/replicated-dynamic-tables#replication_collocation\"&gt;collocation&lt;/a&gt;.&lt;/p&gt;\n&lt;h2 id=\"performance\"&gt;&lt;a href=\"en/user-guide/dynamic-tables/secondary-indices.html#performance\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Performance&lt;/span&gt;&lt;/a&gt;Performance&lt;/h2&gt;\n&lt;p&gt;One disadvantage of using secondary indexes is the slowing down of writes to the indexed table. Writing to the indexed table will also entail transparent reads from it and transparent writes to all index tables for the user, and in case of unique indexes, transparent reads from the index table as well. These reads are performed at the end of the transaction. As a consequence, the write latency is increased by the read latency.&lt;/p&gt;\n&lt;h2 id=\"building\"&gt;&lt;a href=\"en/user-guide/dynamic-tables/secondary-indices.html#building\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Building an index&lt;/span&gt;&lt;/a&gt;Building an index&lt;/h2&gt;\n&lt;p&gt;There is a &lt;a href=\"https://github.com/ytsaurus/ytsaurus/tree/main/yt/yt/scripts/dynamic_tables/build_secondary_index\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;script&lt;/a&gt; that helps correctly create a secondary index over the existing data. It enables you to build a secondary index with minimal downtime required to take a snapshot of the indexed table and remount it (unless you are building a unique index; to maintain strict uniqueness, no writes must be made to the table during the entire building process). After the script acquires the necessary lock, it mounts the indexed table, which can then be used for reading and writing. Once the script finishes running, the index table can be used for queries. The user must ensure that no queries are made with the use of the index until it is fully built.&lt;/p&gt;\n&lt;p&gt;The script supports replicated tables, but the downtime will be a bit longer: you will also have to wait for the replicas to synchronize. Its use stipulates that the indexed and index tables already exist.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Note&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;After a secondary index is built using this script, the index table may contain extra rows that do not correspond to any entries in the indexed table (&lt;code&gt;table_to_index_correspondence=injective&lt;/code&gt;). This may be caused by background compaction and does not affect correctness when using the secondary index in select queries, because these rows will be omitted when joining the tables. Building a strictly bijective (&lt;code&gt;table_to_index_correspondence=bijective&lt;/code&gt;) index is possible only with a full downtime for both tables. There is a dedicated flag in the script for this mode.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"en/user-guide/dynamic-tables/secondary-indices.md","sourcePath":"en/user-guide/dynamic-tables/secondary-indices.md"},"headings":[{"title":"Usage","href":"en/user-guide/dynamic-tables/secondary-indices.html#usage","level":2,"items":[{"title":"Partial indexing","href":"en/user-guide/dynamic-tables/secondary-indices.html#predicate","level":3},{"title":"Index over a list","href":"en/user-guide/dynamic-tables/secondary-indices.html#unfolding","level":3},{"title":"Unique index","href":"en/user-guide/dynamic-tables/secondary-indices.html#unique","level":3},{"title":"Secondary index sharding","href":"en/user-guide/dynamic-tables/secondary-indices.html#sharding","level":3},{"title":"Copying and moving","href":"en/user-guide/dynamic-tables/secondary-indices.html#copy-move","level":3}]},{"title":"Limitations","href":"en/user-guide/dynamic-tables/secondary-indices.html#limitations","level":2,"items":[{"title":"Limitations imposed on replicated tables","href":"en/user-guide/dynamic-tables/secondary-indices.html#limitations-imposed-on-replicated-tables","level":3}]},{"title":"Performance","href":"en/user-guide/dynamic-tables/secondary-indices.html#performance","level":2},{"title":"Building an index","href":"en/user-guide/dynamic-tables/secondary-indices.html#building","level":2}],"title":"Secondary indexes"},"router":{"pathname":"en/user-guide/dynamic-tables/secondary-indices","depth":4,"base":"../../../"},"lang":"en","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/en/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-a29ea7877730322f2ce693378d06d02ac2b374cd-en","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
        </script>
