        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;h2 id=\"mount_table\"&gt;&lt;a href=\"en/user-guide/dynamic-tables/operations.html#mount_table\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Mounting&lt;/span&gt;&lt;/a&gt;Mounting&lt;/h2&gt;\n&lt;p&gt;When reading or writing to a table, the client uses the metadata cache to understand which tablets are affected. In order to be able to execute queries, the relevant tablets must be mounted.&lt;/p&gt;\n&lt;p&gt;Once created, the tablet is not mounted and is in the &lt;code&gt;unmounted&lt;/code&gt; state. To mount the tablet, use the &lt;code&gt;mount-table&lt;/code&gt; command. The state of the tablets engaged will change from &lt;code&gt;unmounted&lt;/code&gt; to &lt;code&gt;mounting&lt;/code&gt; and then to &lt;code&gt;mounted&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;When mounting a tablet, YTsaurus selects the tablet cell that will serve this tablet. You can specify such a cell in the arguments of the &lt;code&gt;mount-table&lt;/code&gt; command or allow the system to do it. In the current implementation, the system selects a random functional cell, but future versions may improve the algorithm and balance it more accurately taking the load into account.&lt;/p&gt;\n&lt;p&gt;You can unmount a tablet using the &lt;code&gt;unmount-table&lt;/code&gt; command. The tablet will change its state to &lt;code&gt;unmounting&lt;/code&gt; and then to &lt;code&gt;unmounted&lt;/code&gt;. An unmounted tablet cannot handle write or read queries. To reshard tablets, you must first unmount them.&lt;/p&gt;\n&lt;p&gt;To unmount a tablet:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Wait until all write transactions are complete and do not allow any new ones.&lt;/li&gt;\n&lt;li&gt;Wait for all data from dynamic_store memory to be written to chunk_store chunks.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Unmounting may take some time.&lt;/p&gt;\n&lt;p&gt;You can perform forced unmounting (the &lt;code&gt;force&lt;/code&gt; option), which works instantly but may result in data loss and lags of some two-phase commits.&lt;/p&gt;\n&lt;h2 id=\"freeze\"&gt;&lt;a href=\"en/user-guide/dynamic-tables/operations.html#freeze\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Freezing&lt;/span&gt;&lt;/a&gt;Freezing&lt;/h2&gt;\n&lt;p&gt;In addition to the &lt;code&gt;mount_table&lt;/code&gt; and &lt;code&gt;unmount_table&lt;/code&gt; commands, YTsaurus has close analogs: the &lt;code&gt;freeze_table&lt;/code&gt; and &lt;code&gt;unfreeze_table&lt;/code&gt; commands.&lt;/p&gt;\n&lt;p&gt;The &lt;code&gt;freeze_table&lt;/code&gt; command converts the table tablets — all or part of them — into a special &lt;code&gt;frozen&lt;/code&gt; state. You can read data from these tablets, but you cannot write to them.&lt;/p&gt;\n&lt;p&gt;The &lt;code&gt;unfreeze_table&lt;/code&gt; command returns \"frozen\" tablets to their normal &lt;code&gt;mounted&lt;/code&gt; state.&lt;/p&gt;\n&lt;p&gt;Transition from &lt;code&gt;mounted&lt;/code&gt; to &lt;code&gt;frozen&lt;/code&gt;, in addition to locking writes, also causes all data accumulated in memory to be written as chunks to the disk. This process is not instantaneous and may take minutes. While the data is being written to the disk, the state of the tablet will be &lt;code&gt;freezing&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Freezing a dynamic table is useful for making a copy of it, while the table remains readable.&lt;/p&gt;\n&lt;h2 id=\"copy\"&gt;&lt;a href=\"en/user-guide/dynamic-tables/operations.html#copy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Copying dynamic tables&lt;/span&gt;&lt;/a&gt;Copying dynamic tables&lt;/h2&gt;\n&lt;p&gt;If all tablets of the dynamic table are unmounted or frozen, the table can be copied as an ordinary static table using the &lt;code&gt;copy&lt;/code&gt; command. The copy of the table will use the same set of chunks as the original one. As the state of these tables starts changing, the number of common chunks will start decreasing in the process of compaction. The disk space consumed by these tables will be equal to the sum of their volumes.&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"en/user-guide/dynamic-tables/operations.md","sourcePath":"en/user-guide/dynamic-tables/operations.md"},"headings":[{"title":"Mounting","href":"en/user-guide/dynamic-tables/operations.html#mount_table","level":2},{"title":"Freezing","href":"en/user-guide/dynamic-tables/operations.html#freeze","level":2},{"title":"Copying dynamic tables","href":"en/user-guide/dynamic-tables/operations.html#copy","level":2}],"title":"Operations with dynamic tables"},"router":{"pathname":"en/user-guide/dynamic-tables/operations","depth":4,"base":"../../../"},"lang":"en","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/en/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-a29ea7877730322f2ce693378d06d02ac2b374cd-en","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
        </script>
