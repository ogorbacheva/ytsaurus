        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;h2 id=\"tablets\"&gt;&lt;a href=\"en/user-guide/dynamic-tables/concepts.html#tablets\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Tablets&lt;/span&gt;&lt;/a&gt;Tablets&lt;/h2&gt;\n&lt;p&gt;For each table, the key space is divided by a set of boundary keys into non-overlapping ranges — tablets. Table tablets are listed in the &lt;code&gt;tablets&lt;/code&gt; attribute. Each tablet is described by the &lt;code&gt;TabletInfo&lt;/code&gt; structure:&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Name&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Type&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Description&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Mandatory&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;tablet_id&lt;/td&gt;\n&lt;td&gt;Guid&lt;/td&gt;\n&lt;td&gt;Tablet ID&lt;/td&gt;\n&lt;td&gt;Yes&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;statistics&lt;/td&gt;\n&lt;td&gt;TabletStatistics&lt;/td&gt;\n&lt;td&gt;Tablet statistics&lt;/td&gt;\n&lt;td&gt;Yes&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;state&lt;/td&gt;\n&lt;td&gt;String&lt;/td&gt;\n&lt;td&gt;State (mounted/unmounted/frozen/mounting/unmounting/freezing/unfreezing/frozen_mounting)&lt;/td&gt;\n&lt;td&gt;Yes&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;pivot_key&lt;/td&gt;\n&lt;td&gt;List&lt;/td&gt;\n&lt;td&gt;Boundary key where the tablet starts (for sorted tables only)&lt;/td&gt;\n&lt;td&gt;Yes&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;cell_id&lt;/td&gt;\n&lt;td&gt;Guid&lt;/td&gt;\n&lt;td&gt;ID of the cell to which the tablet is mounted&lt;/td&gt;\n&lt;td&gt;No&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Example of tablet statistics&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs json\"&gt;&lt;span class=\"hljs-punctuation\"&gt;{&lt;/span&gt;\n    &lt;span class=\"hljs-string\"&gt;\"chunk_count\"&lt;/span&gt; = &lt;span class=\"hljs-number\"&gt;1&lt;/span&gt;;\n    &lt;span class=\"hljs-string\"&gt;\"compressed_data_size\"&lt;/span&gt; = &lt;span class=\"hljs-number\"&gt;324&lt;/span&gt;;\n    &lt;span class=\"hljs-string\"&gt;\"disk_space\"&lt;/span&gt; = &lt;span class=\"hljs-number\"&gt;2502&lt;/span&gt;;\n    &lt;span class=\"hljs-string\"&gt;\"disk_space_per_medium\"&lt;/span&gt; = &lt;span class=\"hljs-punctuation\"&gt;{&lt;/span&gt;\n        &lt;span class=\"hljs-string\"&gt;\"default\"&lt;/span&gt; = &lt;span class=\"hljs-number\"&gt;2502&lt;/span&gt;;\n    &lt;span class=\"hljs-punctuation\"&gt;}&lt;/span&gt;;\n    &lt;span class=\"hljs-string\"&gt;\"dynamic_memory_pool_size\"&lt;/span&gt; = &lt;span class=\"hljs-number\"&gt;0&lt;/span&gt;;\n    &lt;span class=\"hljs-string\"&gt;\"hunk_compressed_data_size\"&lt;/span&gt; = &lt;span class=\"hljs-number\"&gt;0&lt;/span&gt;;\n    &lt;span class=\"hljs-string\"&gt;\"hunk_uncompressed_data_size\"&lt;/span&gt; = &lt;span class=\"hljs-number\"&gt;0&lt;/span&gt;;\n    &lt;span class=\"hljs-string\"&gt;\"memory_size\"&lt;/span&gt; = &lt;span class=\"hljs-number\"&gt;0&lt;/span&gt;;\n    &lt;span class=\"hljs-string\"&gt;\"overlapping_store_count\"&lt;/span&gt; = &lt;span class=\"hljs-number\"&gt;1&lt;/span&gt;;\n    &lt;span class=\"hljs-string\"&gt;\"partition_count\"&lt;/span&gt; = &lt;span class=\"hljs-number\"&gt;1&lt;/span&gt;;\n    &lt;span class=\"hljs-string\"&gt;\"preload_completed_store_count\"&lt;/span&gt; = &lt;span class=\"hljs-number\"&gt;0&lt;/span&gt;;\n    &lt;span class=\"hljs-string\"&gt;\"preload_failed_store_count\"&lt;/span&gt; = &lt;span class=\"hljs-number\"&gt;0&lt;/span&gt;;\n    &lt;span class=\"hljs-string\"&gt;\"preload_pending_store_count\"&lt;/span&gt; = &lt;span class=\"hljs-number\"&gt;0&lt;/span&gt;;\n    &lt;span class=\"hljs-string\"&gt;\"store_count\"&lt;/span&gt; = &lt;span class=\"hljs-number\"&gt;1&lt;/span&gt;;\n    &lt;span class=\"hljs-string\"&gt;\"tablet_count\"&lt;/span&gt; = &lt;span class=\"hljs-number\"&gt;1&lt;/span&gt;;\n    &lt;span class=\"hljs-string\"&gt;\"tablet_count_per_memory_mode\"&lt;/span&gt; = &lt;span class=\"hljs-punctuation\"&gt;{&lt;/span&gt;\n        &lt;span class=\"hljs-string\"&gt;\"none\"&lt;/span&gt; = &lt;span class=\"hljs-number\"&gt;1&lt;/span&gt;;\n        &lt;span class=\"hljs-string\"&gt;\"compressed\"&lt;/span&gt; = &lt;span class=\"hljs-number\"&gt;0&lt;/span&gt;;\n        &lt;span class=\"hljs-string\"&gt;\"uncompressed\"&lt;/span&gt; = &lt;span class=\"hljs-number\"&gt;0&lt;/span&gt;;\n    &lt;span class=\"hljs-punctuation\"&gt;}&lt;/span&gt;;\n    &lt;span class=\"hljs-string\"&gt;\"uncompressed_data_size\"&lt;/span&gt; = &lt;span class=\"hljs-number\"&gt;538&lt;/span&gt;;\n    &lt;span class=\"hljs-string\"&gt;\"unmerged_row_count\"&lt;/span&gt; = &lt;span class=\"hljs-number\"&gt;2&lt;/span&gt;;\n&lt;span class=\"hljs-punctuation\"&gt;}&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"101\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-101\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-101\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-101.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;Each tablet logically consists of a set of sorted data chunks and a special memory area called &lt;code&gt;dynamic store&lt;/code&gt;. Chunks are stored in a replicated way in a blob repository ^[storage of large amounts of unstructured data] and overlap in key ranges.  When data is written, it goes into the &lt;code&gt;dynamic store&lt;/code&gt; and is stored there. When the data reaches the amounts specified in the configuration, it is written to the disk as a chunk. When the number of chunks within a tablet becomes large enough, some of them are combined — compaction is performed. At this moment, old and irrelevant data may be deleted. For more information, see &lt;a href=\"user-guide/dynamic-tables/compaction.html\"&gt;Compaction&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;A list of all tablets of all dynamic system tables is available at &lt;code&gt;//sys/tablets&lt;/code&gt;.&lt;/p&gt;\n&lt;h2 id=\"keys\"&gt;&lt;a href=\"en/user-guide/dynamic-tables/concepts.html#keys\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Boundary keys&lt;/span&gt;&lt;/a&gt;Boundary keys&lt;/h2&gt;\n&lt;p&gt;To change a table tablet set, use the &lt;code&gt;reshard_table&lt;/code&gt; command. When changing the number of tablets of sorted dynamic tables, boundary keys must be specified. Tablet boundary keys are random sequences of values, not necessarily of the same length as the key columns.&lt;/p&gt;\n&lt;p&gt;One of the options is to take a hash of some subsequent key components in order to distribute the data evenly across the key space. Then the boundary keys can be sequences of length 1, consisting of numbers that evenly divide the entire interval of hash function values.&lt;/p&gt;\n&lt;p&gt;The boundary key of the first table tablet always equals the empty sequence — effective minus infinity — and cannot be changed.&lt;/p&gt;\n&lt;h2 id=\"partitions\"&gt;&lt;a href=\"en/user-guide/dynamic-tables/concepts.html#partitions\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Partitions&lt;/span&gt;&lt;/a&gt;Partitions&lt;/h2&gt;\n&lt;p&gt;Tables in dynamic tables are divided into partitions to ensure parallel processing of queries within the cluster node. A typical partition size is several hundred megabytes. If the chunks become larger than the partition size, a background process is started that forces the chunks to be split into smaller chunks.&lt;/p&gt;\n&lt;h2 id=\"tablet_cells\"&gt;&lt;a href=\"en/user-guide/dynamic-tables/concepts.html#tablet_cells\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Tablet cells&lt;/span&gt;&lt;/a&gt;Tablet cells&lt;/h2&gt;\n&lt;p&gt;Tablets are maintained by entities called tablet cells. Each cell is a complex automaton whose state is replicated by the &lt;code&gt;Hydra&lt;/code&gt; subsystem. Each cluster node has so-called tablet slots — virtual positions into which cells can fall.&lt;/p&gt;\n&lt;p&gt;Cells in the cluster are created by the administrator during initial setup. The total number of cells must be close to the total number of tablet slots on the cluster nodes, but with a certain margin to account for the possibility of a certain number of cluster nodes failing.&lt;/p&gt;\n&lt;p&gt;Each tablet cell belongs to a certain bundle. The name of the bundle in which the cell is created is specified in the &lt;code&gt;tablet_cell_bundle&lt;/code&gt; attribute of a specific table or one of the parent directories. By default, tablet cells are created in the &lt;code&gt;default&lt;/code&gt; bundle.&lt;/p&gt;\n&lt;p&gt;A list of all cells is available at &lt;code&gt;//sys/tablet_cells&lt;/code&gt;. Each cell maintains changelogs (mutation logs) and sometimes records state snapshots. The logs go into the &lt;code&gt;//sys/tablet_cells/&amp;lt;cell_id&amp;gt;/changelogs&lt;/code&gt; directory and the snapshots go into the &lt;code&gt;//sys/tablet_cells/&amp;lt;cell_id&amp;gt;/snapshots&lt;/code&gt; directory as files.&lt;/p&gt;\n&lt;p&gt;The master server automatically selects a specific cluster node and an available tablet slot on that node to serve the tablet cell. If the cluster node serving the cell fails, after some time the master server will select a free slot on another node and start the cell on that node.&lt;/p&gt;\n&lt;p&gt;Tablet cells have the attributes indicated in the table:&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Name&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Type&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Description&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;id&lt;/td&gt;\n&lt;td&gt;Guid&lt;/td&gt;\n&lt;td&gt;Cell ID.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;peers&lt;/td&gt;\n&lt;td&gt;Dict&lt;/td&gt;\n&lt;td&gt;Dict containing the name of the cluster node serving the cell and the status of the cell.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;tablet_cell_bundle&lt;/td&gt;\n&lt;td&gt;String&lt;/td&gt;\n&lt;td&gt;Name of the tablet cell bundle to which the cell belongs.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;status&lt;/td&gt;\n&lt;td&gt;Dict&lt;/td&gt;\n&lt;td&gt;Cell state, decommission flag.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;total_statistics&lt;/td&gt;\n&lt;td&gt;Dict&lt;/td&gt;\n&lt;td&gt;Various tablet cell statistics.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Cell state example&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs json\"&gt;&lt;span class=\"hljs-punctuation\"&gt;{&lt;/span&gt;\n    &lt;span class=\"hljs-string\"&gt;\"health\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"good\"&lt;/span&gt;;\n    &lt;span class=\"hljs-string\"&gt;\"decommissioned\"&lt;/span&gt; = %&lt;span class=\"hljs-literal\"&gt;&lt;span class=\"hljs-keyword\"&gt;false&lt;/span&gt;&lt;/span&gt;;\n&lt;span class=\"hljs-punctuation\"&gt;}&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"226\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-226\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-226\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-226.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"tablet_cell_bundles\"&gt;&lt;a href=\"en/user-guide/dynamic-tables/concepts.html#tablet_cell_bundles\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Tablet cell bundles&lt;/span&gt;&lt;/a&gt;Tablet cell bundles&lt;/h2&gt;\n&lt;p&gt;Cells are usually created in groups with the same settings. Bundles are needed to combine cells on the basis of common settings. In the current implementation, bundles are the only reliable way to isolate the load, provided that the bundles are properly distributed across the cluster nodes.&lt;/p&gt;\n&lt;p&gt;Bundles are identified by string names. The list of bundles in the system is available at &lt;code&gt;//sys/tablet_cell_bundles&lt;/code&gt;. In the system, there is always a built-in and non-removable bundle with the &lt;code&gt;default&lt;/code&gt; name. Bundle settings are specified in the &lt;code&gt;options&lt;/code&gt; attribute when it is created and can also be changed later. Changing the settings in the &lt;code&gt;options&lt;/code&gt; attribute requires unmounting all the bundle tables and recreating all the cells.&lt;/p&gt;\n&lt;p&gt;Each table, including a static one, has the &lt;code&gt;tablet_cell_bundle&lt;/code&gt; attribute where the name of the bundle to which cells this table will be mounted is stored. For more information about mounting, see &lt;a href=\"user-guide/dynamic-tables/operations.html#mount_table\"&gt;Table mounting&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;Each bundle has the &lt;code&gt;node_tag_filter&lt;/code&gt; attribute which is used to select the cluster nodes for tablet cells in the given bundle. The filter is a logical expression with the operators: &lt;code&gt;&amp;amp;&lt;/code&gt; — logical \"and\", &lt;code&gt;|&lt;/code&gt; — logical \"or\", &lt;code&gt;!&lt;/code&gt; — logical \"no\" and round brackets. For example, &lt;code&gt;foo | (bar &amp;amp; !baz)&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;The variables in the expression are the possible tag values. If the cluster node has the specified tag, the variable in the formula takes the &lt;code&gt;true&lt;/code&gt; value; if not, it takes the &lt;code&gt;false&lt;/code&gt; value. Tablet cells will only fall onto those cluster nodes for which the entire expression takes the &lt;code&gt;true&lt;/code&gt; value.&lt;/p&gt;\n&lt;p&gt;Tablet cell bundles have the attributes indicated in the table:&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Name&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Type&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Description&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;name&lt;/td&gt;\n&lt;td&gt;String&lt;/td&gt;\n&lt;td&gt;Bundle name.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;options&lt;/td&gt;\n&lt;td&gt;TabletCellOptions&lt;/td&gt;\n&lt;td&gt;Settings of all tablets of this bundle.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;tablet_cell_count&lt;/td&gt;\n&lt;td&gt;Int&lt;/td&gt;\n&lt;td&gt;Number of cells in a bundle.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;tablet_cell_ids&lt;i class=\"yfm yfm-term_title\" term-key=\":*\" role=\"button\" aria-describedby=\":*_element\" tabindex=\"0\" id=\"aamy924y\"&gt;*&lt;/i&gt;&lt;/td&gt;\n&lt;td&gt;Guid&lt;/td&gt;\n&lt;td&gt;IDs of cells in a bundle.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;The state of the bundle, the state of the tablet cells, and the list of cluster nodes included in the bundle are displayed on the Tablet cells tab.&lt;/p&gt;\n&lt;dfn class=\"yfm yfm-term_dfn\" id=\":*_element\" role=\"dialog\"&gt;&lt;p&gt;The parameter appears in the answer several times.&lt;/p&gt;\n&lt;/dfn&gt;","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"en/user-guide/dynamic-tables/concepts.md","sourcePath":"en/user-guide/dynamic-tables/concepts.md"},"headings":[{"title":"Tablets","href":"en/user-guide/dynamic-tables/concepts.html#tablets","level":2},{"title":"Boundary keys","href":"en/user-guide/dynamic-tables/concepts.html#keys","level":2},{"title":"Partitions","href":"en/user-guide/dynamic-tables/concepts.html#partitions","level":2},{"title":"Tablet cells","href":"en/user-guide/dynamic-tables/concepts.html#tablet_cells","level":2},{"title":"Tablet cell bundles","href":"en/user-guide/dynamic-tables/concepts.html#tablet_cell_bundles","level":2}],"title":"Concepts"},"router":{"pathname":"en/user-guide/dynamic-tables/concepts","depth":4,"base":"../../../"},"lang":"en","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/en/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-a29ea7877730322f2ce693378d06d02ac2b374cd-en","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
        </script>
