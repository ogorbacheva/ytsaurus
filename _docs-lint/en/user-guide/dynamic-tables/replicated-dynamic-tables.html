        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;h2 id=\"common\"&gt;&lt;a href=\"en/user-guide/dynamic-tables/replicated-dynamic-tables.html#common\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;General information&lt;/span&gt;&lt;/a&gt;General information&lt;/h2&gt;\n&lt;p&gt;Replicated dynamic tables are a type of tables in YTsaurus that does not store a full set of written data, but is a replication queue. As the data is successfully written to replicas, it is gradually deleted from the replicated dynamic table.&lt;/p&gt;\n&lt;p&gt;Copies (replicas) of a replicated table can be located both on the same cluster as the source table (intra-cluster replication) and on other clusters often located in different DCs (inter-cluster replication). Replication between dynamic tables enables you to have multiple copies of the same table in independent clusters and organize automatic data replication between them.&lt;/p&gt;\n&lt;p&gt;Using replicated dynamic tables enables you to:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Survive DC level failures, both read and write.&lt;/li&gt;\n&lt;li&gt;Increase fault tolerance of the user service by isolating table replicas.&lt;/li&gt;\n&lt;li&gt;Update YTsaurus clusters with less or no downtime for the user.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Both &lt;a href=\"user-guide/dynamic-tables/overview.html\"&gt;sorted&lt;/a&gt; and &lt;a href=\"user-guide/dynamic-tables/ordered-dynamic-tables.html\"&gt;ordered&lt;/a&gt; dynamic tables can be replicated. Replicas can be &lt;strong&gt;synchronous&lt;/strong&gt; and &lt;strong&gt;asynchronous&lt;/strong&gt;. A successful write transaction commit ensures that the data is in synchronous replication and in the replication queue. Data will be written to asynchronous replicas in the background. For more information, see &lt;a href=\"en/user-guide/dynamic-tables/replicated-dynamic-tables.html#replication\"&gt;Replication&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;Each replicated dynamic table can have replicas of both types. Data consistency when writing to a replicated dynamic table is the same as when using an unreplicated dynamic table (sorted or ordered, respectively).&lt;/p&gt;\n&lt;p&gt;Replication requires one &lt;strong&gt;meta cluster&lt;/strong&gt; and one or more &lt;strong&gt;replica clusters&lt;/strong&gt;. Setting up replication consists of several steps:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;Creating a special &lt;code&gt;replicated_table&lt;/code&gt; object on the meta cluster. This object stores information about replicas and replication status.&lt;/li&gt;\n&lt;li&gt;Create one dynamic table (sorted or ordered depending on the task) on each of the replica clusters.&lt;/li&gt;\n&lt;li&gt;Setting up replicas on the meta cluster and enabling replication.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;Once the above steps are complete, data can be written to or deleted from the replicated table on the meta cluster using the &lt;code&gt;insert-rows&lt;/code&gt; and &lt;code&gt;delete-rows&lt;/code&gt; commands. The changes will get into the replica clusters.&lt;/p&gt;\n&lt;p&gt;A replicated dynamic table has a &lt;em&gt;schema&lt;/em&gt; and &lt;em&gt;tablets&lt;/em&gt; defined by the boundary keys. The schema of the replicated table must be no wider than that of the replicas (differences are possible during migration of all replicas to a wider schema).&lt;/p&gt;\n&lt;p&gt;Transactions apply to a write to a replicated dynamic table: the actual writing of rows into it occurs when a write transaction is committed. This transaction must be performed exactly on the meta cluster. Other dynamic (not necessarily replicated) meta cluster tables can still be used within such a transaction.&lt;/p&gt;\n&lt;h2 id=\"write\"&gt;&lt;a href=\"en/user-guide/dynamic-tables/replicated-dynamic-tables.html#write\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Writing data&lt;/span&gt;&lt;/a&gt;Writing data&lt;/h2&gt;\n&lt;p&gt;Writing from the client to the replicated dynamic table results in a distributed commit. As part of the commit, rows are added to the replication queue on the meta cluster. The client also writes changes to each synchronous replica (if any) as part of this transaction. The data flows from the client to the meta cluster, as well as to each cluster with a synchronous replica directly, i.e. the flows from the client are multiplied (at least doubled with one synchronous replica). This distributed transaction is coordinated by the meta cluster. If data cannot be written to at least one synchronous replica, the client will get an error.&lt;/p&gt;\n&lt;p&gt;Writing to a replicated dynamic table with at least one synchronous replica semantically does not differ from writing to a regular dynamic table. You can write to a replicated dynamic table even if there are no synchronous replicas.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Note&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;When writing to a replicated dynamic table without synchronous replicas, the system is unable to check for conflicts between transactions, so semantically such a write differs from a regular one.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;A successful write to a replicated dynamic table with only asynchronous replicas means that the changes are accepted by the system and are guaranteed (as quickly as possible) to be delivered to the replicas. The asynchronous replicas themselves are always lagging behind the source table.&lt;/p&gt;\n&lt;p&gt;To allow a client to write to a replicated dynamic table that has no synchronous replica, the write commands (&lt;code&gt;insert-rows&lt;/code&gt;, &lt;code&gt;delete-rows&lt;/code&gt;) have a special &lt;code&gt;require_sync_replica&lt;/code&gt; flag (the default value is &lt;code&gt;true&lt;/code&gt;). Setting this flag to &lt;code&gt;false&lt;/code&gt; enables a write to a replicated dynamic table without a synchronous replica.&lt;/p&gt;\n&lt;p&gt;If data cannot be written to the asynchronous replica, it will be accumulated in the replicated table. Once the connection with the replica is re-established, all unreplicated data will be written to the replica.&lt;/p&gt;\n&lt;h2 id=\"read\"&gt;&lt;a href=\"en/user-guide/dynamic-tables/replicated-dynamic-tables.html#read\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Reading data&lt;/span&gt;&lt;/a&gt;Reading data&lt;/h2&gt;\n&lt;p&gt;The main task of a replicated dynamic table is to write user data to the replication queue as quickly as possible. As was mentioned above, a replicated dynamic table does not store a full set of data. Therefore, the YTsaurus system seeks to reduce the read load from the replicated dynamic table and will redirect all read queries to the synchronous replica if there is one (defined by a subquery to the meta cluster). Such reading is guaranteed to be semantically indistinguishable from reading from a regular dynamic table.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Attention!&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;The ability to read from a replicated dynamic table causes the additional overhead costs of interacting with the meta cluster. This feature cannot be used in a situation when low latency or high RPS is required.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Attention!&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;With asynchronous replicas only, the ability to read from the replicated dynamic table remains, but is undesirable as it creates additional load on the replicated dynamic table. Reading should be performed from replicas.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Reading from a replicated dynamic table can be performed using the &lt;code&gt;select-rows&lt;/code&gt; and &lt;code&gt;lookup-rows&lt;/code&gt; commands. When using &lt;code&gt;select-rows&lt;/code&gt;, several meta cluster tables can participate in a single query. If at least one of the tables in a query is replicated, all other tables must also be replicated, and there must be a single cluster on which there are synchronous replicas of all the specified tables. In other words, inter-cluster queries are not supported.&lt;/p&gt;\n&lt;h2 id=\"replication\"&gt;&lt;a href=\"en/user-guide/dynamic-tables/replicated-dynamic-tables.html#replication\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Replication&lt;/span&gt;&lt;/a&gt;Replication&lt;/h2&gt;\n&lt;p&gt;The asynchronous replication process works according to the push schema. There is a replicator for each tablet of the replicated dynamic table and each replica there, which reads fresh changes from the replication queue and sends the data to the asynchronous replicas. The sending process is a distributed (between clusters) transaction, in which data is written to the replica table and data portion replication is recorded in the replicated dynamic table metadata.&lt;/p&gt;\n&lt;h3 id=\"guarantees\"&gt;&lt;a href=\"en/user-guide/dynamic-tables/replicated-dynamic-tables.html#guarantees\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Guarantees&lt;/span&gt;&lt;/a&gt;Guarantees&lt;/h3&gt;\n&lt;p&gt;For asynchronous replicas, replication transactions (delivering data to replicas) are in no way coordinated with write transactions to the replicated table. Changes in a single write transaction to a replicated table can be broken down into multiple replication transactions. Guarantees:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;There are no guarantees of atomicity for the replica reader - they may catch the replica in an intermediate state when only part of the transaction changes have been applied to it.&lt;/li&gt;\n&lt;li&gt;Exactly-once semantics is guaranteed (each write to the replicated table will be delivered to all replicas exactly once).&lt;/li&gt;\n&lt;li&gt;The correct order of change delivery to the replica tables is guaranteed — all transactions in the tablet of the replicated table are ordered relative to the commit timestamp. This is the order in which the changes are sent to the replicas.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;In case of synchronous mode, the replicator is not involved in the appearance of data in the replica. Instead, a client writing to a replicated table within the same transaction writes (automatically, implicitly) to the synchronous replica table as well. In this sense, the way the data gets into the synchronous replica is not much different from an ordinary table write. In particular, for a synchronous replica, the consistency of its state is guaranteed at exactly the same level as for a regular dynamic table. However, it is important to realize that what is written is only true if the replica remains synchronous at all times. When replication mode switches to asynchronous, the data starts getting into the table with a lag, and when communicating directly with the replica, there is not much chance for the client to realize that such a switch occurred.&lt;/p&gt;\n&lt;p&gt;The replica tables can be accessed directly through the clusters where these replicas are physically located. The replica tables are special. When replicated, the replica tables contain data with the timestamp generated on the meta cluster. You cannot write data to replica tables directly (bypassing the meta cluster), the system makes every effort to prohibit such writing (such writing can be performed by setting &lt;code&gt;upstream_replica_id&lt;/code&gt; to zero. The risks of this action are described below). You can read data from replica tables. This is a welcome use case when the replica tables serve a realtime service hosted in the same DC, which gives data to an external user.&lt;/p&gt;\n&lt;p&gt;Limitations on the consistency of the data that can be read:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;If the replica is synchronous, reading without specifying a timestamp will give the most recent state (specifically, there is no snapshot isolation at the level of individual values of individual rows: different rows and different columns of the same row may correspond to different points in time; visibility of data from all committed transactions is guaranteed).&lt;/li&gt;\n&lt;li&gt;Reading from a replica with a timestamp is possible, but we recommend getting the timestamp from the meta cluster, because this timestamp is actually invalid for the replica cluster (because it came from the meta cluster).&lt;/li&gt;\n&lt;li&gt;For asynchronous replicas, a lag is always possible (and it exists), so any reading will return lagged data; consistency is not guaranteed in replication (a transaction in the replicated table can atomically change &lt;code&gt;A&lt;/code&gt; and &lt;code&gt;B&lt;/code&gt; keys, read the new value for &lt;code&gt;A&lt;/code&gt; from the replica one, and the old value for &lt;code&gt;B&lt;/code&gt; after that).&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h3 id=\"replicas\"&gt;&lt;a href=\"en/user-guide/dynamic-tables/replicated-dynamic-tables.html#replicas\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Replicas&lt;/span&gt;&lt;/a&gt;Replicas&lt;/h3&gt;\n&lt;p&gt;Each replicated table is associated with a set of replicas (&lt;code&gt;table_replica&lt;/code&gt; objects) created as follows:&lt;/p&gt;\n&lt;p&gt;Creating a replica:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;yt create replicated_table //tmp/replicated --attr &lt;span class=\"hljs-string\"&gt;'{dynamic=%true; schema=[{name=k;type=string;sort_order=ascending};{name=v;type=string}]}'&lt;/span&gt;\n\nyt create table_replica --attr &lt;span class=\"hljs-string\"&gt;'{table_path=\"//tmp/replicated\"; cluster_name=\"replica_cluster\";replica_path=\"//tmp/replica\"}'&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"185\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-185\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-185\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-185.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;This set of commands creates a replicated table on the meta cluster &lt;code&gt;//tmp/replicated&lt;/code&gt; and configures an (asynchronous) replica for it on the &lt;code&gt;replica_cluster&lt;/code&gt; cluster at &lt;code&gt;//tmp/replica&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;The specified commands &lt;strong&gt;do not create&lt;/strong&gt; the table itself &lt;code&gt;//tmp/replica&lt;/code&gt; on the replica cluster, but only configure the replica for &lt;code&gt;//tmp/replicated&lt;/code&gt;. Replica tables must be created individually.&lt;/p&gt;\n&lt;p&gt;Note that after a replica is created, it is by default in a &lt;strong&gt;disabled state&lt;/strong&gt; (&lt;code&gt;state = \"disabled\"&lt;/code&gt;), in which replication is disabled. To run a replica, use the &lt;code&gt;alter-table-replica --enable&lt;/code&gt; command. For more information, read &lt;a href=\"en/user-guide/dynamic-tables/replicated-dynamic-tables.html#replica-state\"&gt;below&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;Each created replica (like any master server object) has an ID. The following commands can be used to view replica information:&lt;/p&gt;\n&lt;p&gt;Viewing a replica:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;yt get //tmp/replicated/@replicas\nyt get &lt;span class=\"hljs-string\"&gt;'#replica-id/@'&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"201\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-201\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-201\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-201.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;You can delete a replica like other objects using the &lt;code&gt;remove&lt;/code&gt; command:&lt;/p&gt;\n&lt;p&gt;Deleting a replica:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;yt remove &lt;span class=\"hljs-string\"&gt;'#replica-id'&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"208\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-208\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-208\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-208.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h4 id=\"add-new-replica\"&gt;&lt;a href=\"en/user-guide/dynamic-tables/replicated-dynamic-tables.html#add-new-replica\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Adding a replica to an existing replicated table&lt;/span&gt;&lt;/a&gt;Adding a replica to an existing replicated table&lt;/h4&gt;\n&lt;p&gt;If you want to add a replica with fully coping the data of an existing replica, use the replica copy tool.&lt;/p&gt;\n&lt;p&gt;If you want to add a new replica or you already have a replica table that stores the required data state, use one of the two attributes (&lt;code&gt;start_replication_timestamp&lt;/code&gt; or &lt;code&gt;start_replication_row_indexes&lt;/code&gt;) when creating a &lt;code&gt;table_replica&lt;/code&gt; object. With &lt;code&gt;start_replication_timestamp&lt;/code&gt;, all changes that have a commit ts strictly greater than the specified value (in the sense of the metacluster timestamp) will be replicated. If you need to initiate replication from an arbitrary moment of time, the most convenient way is to specify a timestamp obtained by calling generate-timestamp for the metacluster. With &lt;code&gt;start_replication_row_indexes&lt;/code&gt;, you need to specify the row index (and do so for each tablet of the replicated table) from where you want data to replicate. You can obtain relevant row indexes from the get-tablet-infos query.&lt;/p&gt;\n&lt;h3 id=\"creating-replica-tables\"&gt;&lt;a href=\"en/user-guide/dynamic-tables/replicated-dynamic-tables.html#creating-replica-tables\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Creating replica tables&lt;/span&gt;&lt;/a&gt;Creating replica tables&lt;/h3&gt;\n&lt;p&gt;A replica table is a regular (dynamic) table on the target cluster. But when creating it, you must specify the &lt;code&gt;upstream_replica_id&lt;/code&gt; attribute and the ID of the replica object on the meta cluster. Specifying &lt;code&gt;upstream_replica_id&lt;/code&gt; allows the replicator to write from the metacluster to the replica cluster and prohibits direct writing to the replica table (which would bypass the replicator). Specifying this ID protects against configuration errors when the same table appears as a replica for multiple replicated tables.&lt;/p&gt;\n&lt;p&gt;Creating a replica table:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;yt create table //tmp/replica --attr &lt;span class=\"hljs-string\"&gt;'{dynamic=%true; upstream_replica_id=replica-id;schema=[{name=k;type=string;sort_order=ascending};{name=v;type=string}]}'&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"227\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-227\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-227\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-227.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;The &lt;code&gt;upstream_replica_id&lt;/code&gt; table attribute can be changed after the table is created using the &lt;code&gt;alter-table&lt;/code&gt; command. All table tablets must be unmounted.&lt;/p&gt;\n&lt;h3 id=\"replica-state\"&gt;&lt;a href=\"en/user-guide/dynamic-tables/replicated-dynamic-tables.html#replica-state\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Replica settings&lt;/span&gt;&lt;/a&gt;Replica settings&lt;/h3&gt;\n&lt;p&gt;Immediately after a replica is created, it is in a &lt;code&gt;disabled&lt;/code&gt; state (the &lt;code&gt;state&lt;/code&gt; attribute). No replication is performed in this state. To enable a replica, use the &lt;code&gt;alter-table-replica&lt;/code&gt; command:&lt;/p&gt;\n&lt;p&gt;Enabling a replica:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;yt alter-table-replica replica-id --&lt;span class=\"hljs-built_in\"&gt;enable&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"240\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-240\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-240\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-240.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;The replica will switch to &lt;code&gt;enabling&lt;/code&gt; state and after it is successfully enabled, it will switch to &lt;code&gt;enabled&lt;/code&gt; state.&lt;/p&gt;\n&lt;p&gt;The replica can be disabled, thereby interrupting replication. To disable a replica, use the same &lt;code&gt;alter-table-replica&lt;/code&gt; command. Disabling is also asynchronous, the replica will switch to &lt;code&gt;disabling&lt;/code&gt; and then to &lt;code&gt;disabled&lt;/code&gt; state:&lt;/p&gt;\n&lt;p&gt;Disabling a replica:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;yt alter-table-replica replica-id --&lt;span class=\"hljs-built_in\"&gt;disable&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"250\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-250\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-250\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-250.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"manual-synchronization\"&gt;&lt;a href=\"en/user-guide/dynamic-tables/replicated-dynamic-tables.html#manual-synchronization\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Manual synchronization&lt;/span&gt;&lt;/a&gt;Manual synchronization&lt;/h3&gt;\n&lt;p&gt;In some cases it is sufficient to have only asynchronous replicas (they provide the maximum possible write speed to the replicated table, since all actions are performed in the background), but still be able to explicitly wait for replication to finish in any replica. The &lt;code&gt;get-in-sync-replicas&lt;/code&gt; command is used for that. For it to work, you need to specify a timestamp and the system will find all replicas that are guaranteed to be reached by all changes with a timestamp no greater than the specified one. For example, you can generate the current timestamp and then wait in the cycle for the specified replica to be in the list returned by the command. This replica can then be queried and timestamped. This will guarantee read consistency.&lt;/p&gt;\n&lt;h3 id=\"replication-modes\"&gt;&lt;a href=\"en/user-guide/dynamic-tables/replicated-dynamic-tables.html#replication-modes\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Replication modes&lt;/span&gt;&lt;/a&gt;Replication modes&lt;/h3&gt;\n&lt;p&gt;By default, replicas are created in asynchronous mode. The user can specify a synchronous mode at creation (via the &lt;code&gt;mode&lt;/code&gt; attribute) and change the mode on the fly (using the &lt;code&gt;alter_table_replica&lt;/code&gt; command). This switch can result in write downtime: if a replica is switched from asynchronous to synchronous state, queue tail replication must be fully complete before the client can write to that replica. Therefore, it is not a good idea to consider a replica with a large lag to be synchronous (the replicated table cannot be written to until the lag disappears).&lt;/p&gt;\n&lt;p&gt;Asynchronous replication is possible without saving the start &lt;code&gt;timestamps&lt;/code&gt;. To use this mode, create a replica with the &lt;code&gt;{\"mode\": \"async\", \"preserve_timestamps\": \"false\"}&lt;/code&gt; attributes, and the replica table must be created without specifying the &lt;code&gt;upstream_replica_id&lt;/code&gt; attribute. This feature can be useful in a number of cases:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;You want to replicate data from multiple sources into one replica table.&lt;/li&gt;\n&lt;li&gt;You want to manually change data in the replica table (patch, insert new data), bypassing the replication mechanism.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;h3 id=\"automatic-switching-of-the-synchronous-replica\"&gt;&lt;a href=\"en/user-guide/dynamic-tables/replicated-dynamic-tables.html#automatic-switching-of-the-synchronous-replica\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Automatic switching of the synchronous replica&lt;/span&gt;&lt;/a&gt;Automatic switching of the &lt;strong&gt;synchronous&lt;/strong&gt; replica&lt;/h3&gt;\n&lt;p&gt;If the cluster on which the synchronous replica is located is unavailable, writing to the replicated dynamic table is stopped. To continue writing, the synchronous replica must be switched to another cluster. The YTsaurus system can automatically switch a synchronous replica. To activate this feature, either create a replicated dynamic table with the &lt;code&gt;replicated_table_options={enable_replicated_table_tracker=%true}&lt;/code&gt; attribute or add the specified attribute later using the &lt;code&gt;yt set&lt;/code&gt; call. The YTsaurus system will then monitor the table replicas and switch the synchronous replica to another cluster if necessary.&lt;/p&gt;\n&lt;p&gt;There are two settings to specify the number of synchronous replicas: &lt;code&gt;min_sync_replica_count&lt;/code&gt; and &lt;code&gt;max_sync_replica_count&lt;/code&gt;. The automated system switches available replicas to synchronous mode, ensuring that there are no more than &lt;code&gt;max_sync_replica_count&lt;/code&gt; synchronous replicas. The automated system also monitors that the number of synchronous replicas does not fall below &lt;code&gt;min_sync_replica_count&lt;/code&gt;.&lt;br /&gt;\nIf &lt;code&gt;min_sync_replica_count&lt;/code&gt; and &lt;code&gt;max_sync_replica_count&lt;/code&gt; are not specified, then both fields are equal to 1 by default. If only &lt;code&gt;min_sync_replica_count&lt;/code&gt; is not specified, it will be equal to &lt;code&gt;max_sync_replica_count&lt;/code&gt;. If only &lt;code&gt;max_sync_replica_count&lt;/code&gt; is not specified, it will be equal to the total number of replicas. Thus, by default, the automated system supports exactly one synchronous replica.&lt;/p&gt;\n&lt;p&gt;There is a mode when the YTsaurus system stops monitoring any table replica, but continues monitoring the remaining replicas. To enable this mode for a replica (&lt;code&gt;table_replica&lt;/code&gt;), use the &lt;code&gt;yt set&lt;/code&gt; call and set the &lt;code&gt;enable_replicated_table_tracker=%false&lt;/code&gt; attribute.&lt;/p&gt;\n&lt;p&gt;You can view the current mode for the replica table using the &lt;code&gt;replicated_table_tracker_enabled&lt;/code&gt; attribute of the meta cluster replica object:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;$ yt --proxy meta-cluster get //home/some_meta_table/@replicas\n\n&lt;span class=\"hljs-string\"&gt;\"table-replica-id\"&lt;/span&gt; = {\n     &lt;span class=\"hljs-string\"&gt;\"cluster_name\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"some_name\"&lt;/span&gt;;\n     &lt;span class=\"hljs-string\"&gt;\"replica_path\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"//home/some_table\"&lt;/span&gt;;\n     &lt;span class=\"hljs-string\"&gt;\"state\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"enabled\"&lt;/span&gt;;\n     &lt;span class=\"hljs-string\"&gt;\"mode\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"async\"&lt;/span&gt;;\n     &lt;span class=\"hljs-string\"&gt;\"replicated_table_tracker_enabled\"&lt;/span&gt; = %&lt;span class=\"hljs-literal\"&gt;false&lt;/span&gt;;\n };\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"293\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-293\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-293\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-293.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h4 id=\"replication_collocation\"&gt;&lt;a href=\"en/user-guide/dynamic-tables/replicated-dynamic-tables.html#replication_collocation\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Concurrent switching of synchronous table group replicas&lt;/span&gt;&lt;/a&gt;Concurrent switching of synchronous table group replicas&lt;/h4&gt;\n&lt;p&gt;You can combine replicated tables into groups (collocations) so that the system monitors that synchronous replicas of these tables are on the same clusters.&lt;br /&gt;\nTo do this, create a &lt;code&gt;table_collocation&lt;/code&gt; object that stores a list of collocated replicated tables.&lt;/p&gt;\n&lt;p&gt;Working with replicated table collocations:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;&lt;span class=\"hljs-comment\"&gt;# Create a collocation with a list of tables.&lt;/span&gt;\nyt create table_collocation --attributes &lt;span class=\"hljs-string\"&gt;'{collocation_type=replication; table_paths=[\"//tmp/replicated_table_1\"; \"//tmp/replicated_table_2\"]}'&lt;/span&gt;\n\n&lt;span class=\"hljs-comment\"&gt;# Find out the list of tables in a collocation.&lt;/span&gt;\nyt get &lt;span class=\"hljs-string\"&gt;\"#collocation-id/@table_ids\"&lt;/span&gt;\nyt get &lt;span class=\"hljs-string\"&gt;\"#collocation-id/@table_paths\"&lt;/span&gt;\n\n&lt;span class=\"hljs-comment\"&gt;# Find out the ID of the collocation to which the table belongs.&lt;/span&gt;\nyt get //tmp/replicated_table_1/@replication_collocation_id\n\n&lt;span class=\"hljs-comment\"&gt;# Find out the list of all tables in the collocation to which the table belongs.&lt;/span&gt;\nyt get //tmp/replicated_table_1/@replication_collocation_table_paths\n\n&lt;span class=\"hljs-comment\"&gt;# Add a table to the collocation.&lt;/span&gt;\nyt &lt;span class=\"hljs-built_in\"&gt;set&lt;/span&gt; //tmp/replicated_table_3/@replication_collocation_id collocation-id\n\n&lt;span class=\"hljs-comment\"&gt;# Delete a table from the collocation.&lt;/span&gt;\nyt remove //tmp/replicated_table_3/@replication_collocation_id\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"303\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-303\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-303\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-303.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h4 id=\"specifying-preferred-clusters-for-synchronous-replicas\"&gt;&lt;a href=\"en/user-guide/dynamic-tables/replicated-dynamic-tables.html#specifying-preferred-clusters-for-synchronous-replicas\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Specifying preferred clusters for synchronous replicas&lt;/span&gt;&lt;/a&gt;Specifying preferred clusters for synchronous replicas&lt;/h4&gt;\n&lt;p&gt;When a replicated table on different clusters has multiple replicas that can become synchronous, you can specify which of them should be given preference in case of automatic switching. To do this, the following attribute must be set on the replicated table:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;yt &lt;span class=\"hljs-built_in\"&gt;set&lt;/span&gt; //tmp/replicated_table/@replicated_table_options/preferred_sync_replica_clusters &lt;span class=\"hljs-string\"&gt;'[\"cluster-name\"]'&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"310\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-310\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-310\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-310.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;This attribute respects &lt;a href=\"en/user-guide/dynamic-tables/replicated-dynamic-tables.html#replication_collocation\"&gt;collocations&lt;/a&gt; of replicated tables, but for it to work correctly, the attribute must be set &lt;strong&gt;to all tables&lt;/strong&gt; of the collocation.&lt;/p&gt;\n&lt;h3 id=\"limiting-replication-speed\"&gt;&lt;a href=\"en/user-guide/dynamic-tables/replicated-dynamic-tables.html#limiting-replication-speed\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Limiting replication speed&lt;/span&gt;&lt;/a&gt;Limiting replication speed&lt;/h3&gt;\n&lt;p&gt;Asynchronous replication can lead to a substantial load on the network connecting the data centers as well as on the replica table cluster, so we recommend setting up limits for write-intensive tables. The system supports two types of settings. In most scenarios, we recommend using relative throttling.&lt;/p&gt;\n&lt;h4 id=\"relative-replication-throttling\"&gt;&lt;a href=\"en/user-guide/dynamic-tables/replicated-dynamic-tables.html#relative-replication-throttling\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Relative replication throttling&lt;/span&gt;&lt;/a&gt;Relative replication throttling&lt;/h4&gt;\n&lt;p&gt;Relative throttling can be configured via the &lt;code&gt;mount_config/relative_replication_throttler&lt;/code&gt; attribute. This attribute is a dict that can contain the following values.&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Name&lt;/th&gt;\n&lt;th&gt;Type&lt;/th&gt;\n&lt;th&gt;Description&lt;/th&gt;\n&lt;th&gt;Default value&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;enable&lt;/td&gt;\n&lt;td&gt;bool&lt;/td&gt;\n&lt;td&gt;Throttling flag&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;%false&lt;/code&gt; (may depend on the cluster)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;ratio&lt;/td&gt;\n&lt;td&gt;double&lt;/td&gt;\n&lt;td&gt;Ratio of the replication speed to the write speed&lt;/td&gt;\n&lt;td&gt;2&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Relative throttling limits the speed of asynchronous replication relative to the write speed. For example, if there's a data set that took an hour to write, and the asynchronous replica was unavailable during that time, then with ratio = 3 that data will be replicated in 20 minutes once the replica becomes available.&lt;/p&gt;\n&lt;p&gt;If the write speed is constant, the default value (ratio = 2) ensures that the catch-up time is roughly the same as the lag time. In this case, it is assumed that the replica cluster has sufficient resources to handle a doubled load for the duration of the catch-up period. By decreasing the ratio value, you can reduce the required resource guarantees at the cost of increasing the replica catch-up time.&lt;/p&gt;\n&lt;p&gt;Setup example:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;yt set //tmp/replicated_table/@mount_config/relative_replication_throttler '{ratio=1.5}'\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"383\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-383\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-383\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-383.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h4 id=\"absolute-replication-throttling\"&gt;&lt;a href=\"en/user-guide/dynamic-tables/replicated-dynamic-tables.html#absolute-replication-throttling\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Absolute replication throttling&lt;/span&gt;&lt;/a&gt;Absolute replication throttling&lt;/h4&gt;\n&lt;p&gt;This type of throttling can be configured via the &lt;code&gt;mount_config/replication_throttler&lt;/code&gt; attribute, which can accept two values:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;limit: The limit for the average bandwidth value in bytes/sec.&lt;/li&gt;\n&lt;li&gt;period: The time interval in ms during which the average bandwidth value is measured.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;For example, the following command sets a replication limit of one megabyte per second:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;yt &lt;span class=\"hljs-built_in\"&gt;set&lt;/span&gt; //tmp/replicated_table/@mount_config/replication_throttler &lt;span class=\"hljs-string\"&gt;'{period=1000;limit=1000000}'&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"405\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-405\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-405\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-405.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Note&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;The limit you set does not apply to the entire table, but to each table tablet individually.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"maintaining-the-tablet-index-during-ordered-table-replication\"&gt;&lt;a href=\"en/user-guide/dynamic-tables/replicated-dynamic-tables.html#maintaining-the-tablet-index-during-ordered-table-replication\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Maintaining the tablet index during ordered table replication&lt;/span&gt;&lt;/a&gt;Maintaining the tablet index during ordered table replication&lt;/h3&gt;\n&lt;p&gt;By default, asynchronous replication of an ordered dynamic table writes rows to an arbitrary replica tablet. If you need to maintain the tablet index (this is important if you want the same tablet row to appear under the same index across different replicas), set the &lt;code&gt;preserve_tablet_index&lt;/code&gt; attribute of the ordered dynamic table itself to &lt;code&gt;%true&lt;/code&gt;. When using this attribute, you need to manually track that the replicated table and the replica tables have the exact same number of tablets.&lt;/p&gt;\n&lt;h2 id=\"alter_schema\"&gt;&lt;a href=\"en/user-guide/dynamic-tables/replicated-dynamic-tables.html#alter_schema\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Changing schemas&lt;/span&gt;&lt;/a&gt;Changing schemas&lt;/h2&gt;\n&lt;p&gt;To perform a compatible schema change to both a replica table and the replicated table, run the &lt;code&gt;alter-table&lt;/code&gt; command. This command must be called for each table individually. Ensure that the table is unmounted before executing the command.&lt;/p&gt;\n&lt;p&gt;The replica table schemas do not have to match the replicated table schema, but must be no narrower than the replicated table schema for replication to work correctly. You need to start the schema change with the replicas and then move on to the replicated table.&lt;/p&gt;\n&lt;h2 id=\"downtimes\"&gt;&lt;a href=\"en/user-guide/dynamic-tables/replicated-dynamic-tables.html#downtimes\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Resistance to downtimes and updates&lt;/span&gt;&lt;/a&gt;Resistance to downtimes and updates&lt;/h2&gt;\n&lt;p&gt;Each replica cluster exists independently. When a replica cluster is disabled, there is no way to read data from it. Replicas can be updated independently.&lt;/p&gt;\n&lt;p&gt;The replica table schemas do not have to match the replicated table schema, but must be no narrower than the replicated table schema for replication to work correctly. You need to start the schema change with the replicas and then move on to the replicated table.&lt;/p&gt;\n&lt;p&gt;In order to write data to a replicated table, two conditions must be met, and are sufficient:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;The meta cluster is available.&lt;/li&gt;\n&lt;li&gt;All synchronous replicas of the replicated table are available. It is assumed that the meta cluster is geo-distributed, updated infrequently and with a short downtime during which the table cannot be written to (but can still be read directly from replicas). If a replicated table has no synchronous replicas, it can be written to whenever the meta cluster is available. If a table has a synchronous replica, it needs to be kept available (which can be helped by automated synchronous replica switching).&lt;/li&gt;\n&lt;/ol&gt;\n&lt;h2 id=\"attributes\"&gt;&lt;a href=\"en/user-guide/dynamic-tables/replicated-dynamic-tables.html#attributes\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Attributes&lt;/span&gt;&lt;/a&gt;Attributes&lt;/h2&gt;\n&lt;p&gt;All replicated tables are tables and they have a corresponding set of attributes. Any replicated table is additionally characterized by these parameters:&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Name&lt;/th&gt;\n&lt;th&gt;Type&lt;/th&gt;\n&lt;th&gt;Description&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;replicas&lt;/td&gt;\n&lt;td&gt;Guid-&amp;gt;ReplicaInfo&lt;/td&gt;\n&lt;td&gt;Description of replicas (keys are the replica IDs, and values are some of their important attributes)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;replicated_table_options&lt;/td&gt;\n&lt;td&gt;ReplicatedTableOptions&lt;/td&gt;\n&lt;td&gt;Automated replica switching settings&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;preserve_tablet_index&lt;/td&gt;\n&lt;td&gt;bool&lt;/td&gt;\n&lt;td&gt;Whether to save the tablet index during replication of ordered dynamic tables. The default value is &lt;code&gt;%false&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;&lt;code&gt;ReplicatedTableOptions&lt;/code&gt; here have the following form:&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Name&lt;/th&gt;\n&lt;th&gt;Type&lt;/th&gt;\n&lt;th&gt;Description&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;enable_replicated_table_tracker&lt;/td&gt;\n&lt;td&gt;bool&lt;/td&gt;\n&lt;td&gt;Whether automated synchronous replica switching is enabled. The default value is &lt;code&gt;%false&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;max_sync_replica_count&lt;/td&gt;\n&lt;td&gt;integer&lt;/td&gt;\n&lt;td&gt;Maximum and preferred number of synchronous replicas to be supported by the automated system&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;min_sync_replica_count&lt;/td&gt;\n&lt;td&gt;integer&lt;/td&gt;\n&lt;td&gt;Minimum number of synchronous replicas to be supported by the automated system&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;preferred_sync_replica_clusters&lt;/td&gt;\n&lt;td&gt;list&lt;/td&gt;\n&lt;td&gt;List of preferred clusters for synchronous replicas&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Each replica is described by the &lt;code&gt;ReplicaInfo&lt;/code&gt; dict with the following form:&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Name&lt;/th&gt;\n&lt;th&gt;Type&lt;/th&gt;\n&lt;th&gt;Description&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;cluster_name&lt;/td&gt;\n&lt;td&gt;string&lt;/td&gt;\n&lt;td&gt;Replica cluster name&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;replica_path&lt;/td&gt;\n&lt;td&gt;string&lt;/td&gt;\n&lt;td&gt;The path to the replica table on the replica cluster&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;state&lt;/td&gt;\n&lt;td&gt;TableReplicaState&lt;/td&gt;\n&lt;td&gt;Replica state&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;mode&lt;/td&gt;\n&lt;td&gt;TableReplicaMode&lt;/td&gt;\n&lt;td&gt;Replica mode: &lt;code&gt;async&lt;/code&gt; or &lt;code&gt;sync&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;replication_lag_time&lt;/td&gt;\n&lt;td&gt;Duration&lt;/td&gt;\n&lt;td&gt;Replica lag estimate&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;errors&lt;/td&gt;\n&lt;td&gt;Error&lt;i class=\"yfm yfm-term_title\" term-key=\":*\" role=\"button\" aria-describedby=\":*_element\" tabindex=\"0\" id=\"u7oyz03i\"&gt;*&lt;/i&gt;&lt;/td&gt;\n&lt;td&gt;List of replication errors for this replica&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;preserve_timestamps&lt;/td&gt;\n&lt;td&gt;bool&lt;/td&gt;\n&lt;td&gt;Save start &lt;code&gt;timestamps&lt;/code&gt;? The default value is &lt;code&gt;true&lt;/code&gt;. Makes sense only for asynchronous replicas&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;atomicity&lt;/td&gt;\n&lt;td&gt;EAtomicity&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;full&lt;/code&gt; or &lt;code&gt;none&lt;/code&gt;. Makes sense only for asynchronous replicas&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;The &lt;code&gt;replication_lag_time&lt;/code&gt; gives a rough estimate of the replication lag (to within tens of seconds).&lt;/p&gt;\n&lt;p&gt;The replica object itself, in addition to the listed attributes (as well as those inherent in all objects), also has a number of additional attributes (all of which can be found out by running a query of the &lt;code&gt;yt get '#replica-id/@'&lt;/code&gt; type):&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Name&lt;/th&gt;\n&lt;th&gt;Type&lt;/th&gt;\n&lt;th&gt;Description&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;mode&lt;/td&gt;\n&lt;td&gt;ReplicaMode&lt;/td&gt;\n&lt;td&gt;Replica mode: &lt;code&gt;sync&lt;/code&gt; or &lt;code&gt;async&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;start_replication_timestamp&lt;/td&gt;\n&lt;td&gt;Timestamp&lt;/td&gt;\n&lt;td&gt;Starting timestamp for the replica&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;table_path&lt;/td&gt;\n&lt;td&gt;string&lt;/td&gt;\n&lt;td&gt;Path to the replicated table on the meta cluster&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;tablets&lt;/td&gt;\n&lt;td&gt;TabletReplicaInfo&lt;i class=\"yfm yfm-term_title\" term-key=\":*\" role=\"button\" aria-describedby=\":*_element\" tabindex=\"0\" id=\"fzffi8ga\"&gt;*&lt;/i&gt;&lt;/td&gt;\n&lt;td&gt;Description of tablet states. The position in the list corresponds to the tablet index in the table itself&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;enable_replicated_table_tracker&lt;/td&gt;\n&lt;td&gt;bool&lt;/td&gt;\n&lt;td&gt;Enables automated synchronous replica switching (see above). The default value is &lt;code&gt;%true&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;The &lt;code&gt;TabletReplicaInfo&lt;/code&gt; structure has the following form:&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Name&lt;/th&gt;\n&lt;th&gt;Type&lt;/th&gt;\n&lt;th&gt;Description&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;tablet_id&lt;/td&gt;\n&lt;td&gt;Guid&lt;/td&gt;\n&lt;td&gt;Tablet ID&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;state&lt;/td&gt;\n&lt;td&gt;TableReplicaState&lt;/td&gt;\n&lt;td&gt;State of this tablet replica&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;current_replication_row_index&lt;/td&gt;\n&lt;td&gt;integer&lt;/td&gt;\n&lt;td&gt;Replication boundary in the queue by write index (writes with index &amp;gt;= the specified index are subject to replication)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;current_replication_timestamp&lt;/td&gt;\n&lt;td&gt;Timestamp&lt;/td&gt;\n&lt;td&gt;Replication boundary in the queue by timestamp (writes with timestamp &amp;gt; the specified timestamp are subject to replication)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;replication_lag_time&lt;/td&gt;\n&lt;td&gt;Duration&lt;/td&gt;\n&lt;td&gt;Replica lag estimate for this tablet&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;flushed_row_count&lt;/td&gt;\n&lt;td&gt;integer&lt;/td&gt;\n&lt;td&gt;The number of this tablet's rows written to the disk. If the replicated table is frozen, you can compare this value against &lt;code&gt;current_replication_row_index&lt;/code&gt; to keep track of the replication&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;trimmed_row_count`&lt;/td&gt;\n&lt;td&gt;integer&lt;/td&gt;\n&lt;td&gt;The number of initial rows in this tablet that have been successfully replicated and whose chunks were deleted (log truncation)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;replication_error&lt;/td&gt;\n&lt;td&gt;Error&lt;/td&gt;\n&lt;td&gt;Describes a replication error. If there is no error, this tag is also missing&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;The &lt;code&gt;current_replication_row_index&lt;/code&gt; and &lt;code&gt;current_replication_timestamp&lt;/code&gt; parameters increase monotonically as the replicator runs, marking the successfully replicated writes.&lt;/p&gt;\n&lt;h2 id=\"queue_check\"&gt;&lt;a href=\"en/user-guide/dynamic-tables/replicated-dynamic-tables.html#queue_check\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Checking a replication queue&lt;/span&gt;&lt;/a&gt;Checking a replication queue&lt;/h2&gt;\n&lt;p&gt;A replication queue check is useful for re-creating a replicated table without losing changes. The procedure is as follows:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;Run the &lt;code&gt;freeze-table&lt;/code&gt; command for the replicated table.&lt;/li&gt;\n&lt;li&gt;Wait (by querying the &lt;code&gt;tablet_state&lt;/code&gt; table attribute) for all tablets to go into &lt;code&gt;frozen&lt;/code&gt; state.&lt;/li&gt;\n&lt;li&gt;Get information about the state of the tablets of the table of interest by making a &lt;code&gt;get #replica-id/@tablets&lt;/code&gt; query. Each response list item describes the replication state for a specified tablet of the replicated table to the specified replica. For each tablet, view the &lt;code&gt;flushed_row_count&lt;/code&gt; and &lt;code&gt;current_replication_row_index&lt;/code&gt; values and wait until they are the same.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;h2 id=\"examples\"&gt;&lt;a href=\"en/user-guide/dynamic-tables/replicated-dynamic-tables.html#examples\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Use cases&lt;/span&gt;&lt;/a&gt;Use cases&lt;/h2&gt;\n&lt;h3 id=\"creating,-setting-up-replicas\"&gt;&lt;a href=\"en/user-guide/dynamic-tables/replicated-dynamic-tables.html#creating,-setting-up-replicas\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Creating, setting up replicas&lt;/span&gt;&lt;/a&gt;Creating, setting up replicas&lt;/h3&gt;\n&lt;p&gt;The examples work from version ytsaurus-client &amp;gt;= 0.8.19. .&lt;/p&gt;\n&lt;p&gt;Examples of using replicated tables:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;&lt;span class=\"hljs-built_in\"&gt;export&lt;/span&gt; YT_PROXY=cluster-name\n\n&lt;span class=\"hljs-comment\"&gt;# Creating a replicated table.&lt;/span&gt;\nyt create replicated_table //tmp/replicated --attr &lt;span class=\"hljs-string\"&gt;'{\n  dynamic=%true;\n  schema=[{name=k;type=int64;sort_order=ascending};{name=v;type=int64}]\n}'&lt;/span&gt;\n730e-68d3e-3ff01a9-325bbdcd\n\n&lt;span class=\"hljs-comment\"&gt;# Creating a replica associated with first-replica-cluster.&lt;/span&gt;\nyt create table_replica --attr &lt;span class=\"hljs-string\"&gt;'{\n  table_path=\"//tmp/replicated\";\n  cluster_name=\"first-replica-cluster\";\n  replica_path=\"//tmp/replica\"\n}'&lt;/span&gt;\n730e-7bcd8-3ff02c5-fd0b36ee\n\n&lt;span class=\"hljs-comment\"&gt;# Creating a second replica on second-replica-cluster.&lt;/span&gt;\nyt create table_replica --attr &lt;span class=\"hljs-string\"&gt;'{\n  table_path=\"//tmp/replicated\";\n  cluster_name=\"second-replica-cluster\";\n  replica_path=\"//tmp/replica\"\n}'&lt;/span&gt;\n730e-8611b-3ff02c5-f647333f\n\n&lt;span class=\"hljs-comment\"&gt;# Creating a replica table on first-replica-cluster.&lt;/span&gt;\nYT_PROXY=first-replica-cluster yt create table //tmp/replica --attr &lt;span class=\"hljs-string\"&gt;'{\n  dynamic=%true;\n  upstream_replica_id=\"730e-7bcd8-3ff02c5-fd0b36ee\";\n  schema=[{name=k;type=int64;sort_order=ascending};{name=v;type=int64}]\n}'&lt;/span&gt;\n6cd9-66770-3ee0191-980d9f6\n\n&lt;span class=\"hljs-comment\"&gt;# Creating a replica table on second-replica-cluster.&lt;/span&gt;\nYT_PROXY=second-replica-cluster yt create table //tmp/replica --attr &lt;span class=\"hljs-string\"&gt;'{\n  dynamic=%true;\n  upstream_replica_id=\"730e-8611b-3ff02c5-f647333f\";\n  schema=[{name=k;type=int64;sort_order=ascending};{name=v;type=int64}]\n}'&lt;/span&gt;\n78b6-1dacd9-3f40191-2057d1df\n\n&lt;span class=\"hljs-comment\"&gt;# Mounting a replica table and the replicated table.&lt;/span&gt;\nyt mount-table //tmp/replicated\nYT_PROXY=first-replica-cluster yt mount-table //tmp/replica\nYT_PROXY=second-replica-cluster yt mount-table //tmp/replica\n\n&lt;span class=\"hljs-comment\"&gt;# Writing data to the replicated table.&lt;/span&gt;\n&lt;span class=\"hljs-built_in\"&gt;echo&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;'{k=1;v=100}'&lt;/span&gt; | yt insert-rows //tmp/replicated --format yson\nTable //tmp/replicated has no synchronous replicas\n\n&lt;span class=\"hljs-comment\"&gt;# Setting the no-require-sync-replica flag to force a write.&lt;/span&gt;\n&lt;span class=\"hljs-built_in\"&gt;echo&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;'{k=1;v=100}'&lt;/span&gt; | yt insert-rows //tmp/replicated --format yson --no-require-sync-replica\n\n&lt;span class=\"hljs-comment\"&gt;# Write was successful, but there is no data in the replica.&lt;/span&gt;\nYT_PROXY=first-replica-cluster yt select-rows &lt;span class=\"hljs-string\"&gt;'* from [//tmp/replica]'&lt;/span&gt; --format yson\n\n&lt;span class=\"hljs-comment\"&gt;# Viewing replica state.&lt;/span&gt;\nyt get &lt;span class=\"hljs-string\"&gt;'#730e-7bcd8-3ff02c5-fd0b36ee/@state'&lt;/span&gt;\n&lt;span class=\"hljs-string\"&gt;\"disabled\"&lt;/span&gt;\n\n&lt;span class=\"hljs-comment\"&gt;# Replica was not enabled. Enabling a replica.&lt;/span&gt;\nyt alter-table-replica 730e-8611b-3ff02c5-f647333f --&lt;span class=\"hljs-built_in\"&gt;enable&lt;/span&gt;\nyt alter-table-replica 730e-7bcd8-3ff02c5-fd0b36ee --&lt;span class=\"hljs-built_in\"&gt;enable&lt;/span&gt;\n\n&lt;span class=\"hljs-comment\"&gt;# Checking replication progress.&lt;/span&gt;\nYT_PROXY=first-replica-cluster yt select-rows &lt;span class=\"hljs-string\"&gt;'* from [//tmp/replica]'&lt;/span&gt; --format json\n{&lt;span class=\"hljs-string\"&gt;\"k\"&lt;/span&gt;:1,&lt;span class=\"hljs-string\"&gt;\"v\"&lt;/span&gt;:100}\n\n&lt;span class=\"hljs-comment\"&gt;# Attempting to read data directly from the replicated table.&lt;/span&gt;\nyt select-rows &lt;span class=\"hljs-string\"&gt;'* from [//tmp/replicated]'&lt;/span&gt; --format json\nNo in-sync replicas found &lt;span class=\"hljs-keyword\"&gt;for&lt;/span&gt; table //tmp/replicated\n\n&lt;span class=\"hljs-comment\"&gt;# Reading is not possible without synchronous replicas.&lt;/span&gt;\n&lt;span class=\"hljs-comment\"&gt;# Disabling the second replica and rewriting.&lt;/span&gt;\nyt alter-table-replica 730e-8611b-3ff02c5-f647333f --&lt;span class=\"hljs-built_in\"&gt;disable&lt;/span&gt;\n&lt;span class=\"hljs-built_in\"&gt;echo&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;'{k=2;v=200}'&lt;/span&gt; | yt insert-rows //tmp/replicated --format yson --no-require-sync-replica\n\n&lt;span class=\"hljs-comment\"&gt;# Reading from replicas&lt;/span&gt;\nYT_PROXY=first-replica-cluster yt select-rows &lt;span class=\"hljs-string\"&gt;'* from [//tmp/replica]'&lt;/span&gt; --format json\n{&lt;span class=\"hljs-string\"&gt;\"k\"&lt;/span&gt;:1,&lt;span class=\"hljs-string\"&gt;\"v\"&lt;/span&gt;:100}\n{&lt;span class=\"hljs-string\"&gt;\"k\"&lt;/span&gt;:2,&lt;span class=\"hljs-string\"&gt;\"v\"&lt;/span&gt;:200}\n\nYT_PROXY=second-replica-cluster yt select-rows &lt;span class=\"hljs-string\"&gt;'* from [//tmp/replica]'&lt;/span&gt; --format json\n{&lt;span class=\"hljs-string\"&gt;\"k\"&lt;/span&gt;:1,&lt;span class=\"hljs-string\"&gt;\"v\"&lt;/span&gt;:100}\n\n&lt;span class=\"hljs-comment\"&gt;# You can see that first-replica-cluster received the data, but second-replica-cluster did not.&lt;/span&gt;\n&lt;span class=\"hljs-comment\"&gt;# Failed replication can be noticed by a growing lag.&lt;/span&gt;\nyt get &lt;span class=\"hljs-string\"&gt;'#730e-8611b-3ff02c5-f647333f/@replication_lag_time'&lt;/span&gt;\n141000\n\n&lt;span class=\"hljs-comment\"&gt;# Changing the replication type on first-replica-cluster and enabling the replica.&lt;/span&gt;\nyt alter-table-replica 730e-8611b-3ff02c5-f647333f --&lt;span class=\"hljs-built_in\"&gt;enable&lt;/span&gt; --mode &lt;span class=\"hljs-built_in\"&gt;sync&lt;/span&gt;\n\n&lt;span class=\"hljs-comment\"&gt;# Reading data from first-replica-cluster and checking if the data has appeared.&lt;/span&gt;\nYT_PROXY=first-replica-cluster yt select-rows &lt;span class=\"hljs-string\"&gt;'* from [//tmp/replica]'&lt;/span&gt; --format json\n{&lt;span class=\"hljs-string\"&gt;\"k\"&lt;/span&gt;:1,&lt;span class=\"hljs-string\"&gt;\"v\"&lt;/span&gt;:100}\n{&lt;span class=\"hljs-string\"&gt;\"k\"&lt;/span&gt;:2,&lt;span class=\"hljs-string\"&gt;\"v\"&lt;/span&gt;:200}\n\n&lt;span class=\"hljs-comment\"&gt;# Having a synchronous replica allows us to read directly from the replicated table.&lt;/span&gt;\nyt select-rows &lt;span class=\"hljs-string\"&gt;'* from [//tmp/replicated]'&lt;/span&gt; --format json\n{&lt;span class=\"hljs-string\"&gt;\"k\"&lt;/span&gt;:1,&lt;span class=\"hljs-string\"&gt;\"v\"&lt;/span&gt;:100}\n{&lt;span class=\"hljs-string\"&gt;\"k\"&lt;/span&gt;:2,&lt;span class=\"hljs-string\"&gt;\"v\"&lt;/span&gt;:200}\n\n&lt;span class=\"hljs-comment\"&gt;# Deleting the first row, this time in synchronous mode.&lt;/span&gt;\n&lt;span class=\"hljs-built_in\"&gt;echo&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;'{k=1}'&lt;/span&gt; | yt delete-rows //tmp/replicated --format yson\n\n&lt;span class=\"hljs-comment\"&gt;# Checking the command execution status.&lt;/span&gt;\nYT_PROXY=first-replica-cluster yt select-rows &lt;span class=\"hljs-string\"&gt;'* from [//tmp/replica]'&lt;/span&gt; --format json\n{&lt;span class=\"hljs-string\"&gt;\"k\"&lt;/span&gt;:2,&lt;span class=\"hljs-string\"&gt;\"v\"&lt;/span&gt;:200}\n\nYT_PROXY=second-replica-cluster yt select-rows &lt;span class=\"hljs-string\"&gt;'* from [//tmp/replica]'&lt;/span&gt; --format json\n{&lt;span class=\"hljs-string\"&gt;\"k\"&lt;/span&gt;:2,&lt;span class=\"hljs-string\"&gt;\"v\"&lt;/span&gt;:200}\n\n&lt;span class=\"hljs-comment\"&gt;# Disabling writes to the replicated table.&lt;/span&gt;\nyt freeze-table //tmp/replicated\n\n&lt;span class=\"hljs-comment\"&gt;# Checking if the tablet is frozen (if all the data has been written to the disk).&lt;/span&gt;\nyt get //tmp/replicated/@tablet_state\n&lt;span class=\"hljs-string\"&gt;\"frozen\"&lt;/span&gt;\n\n&lt;span class=\"hljs-comment\"&gt;# Checking that all rows were successfully replicated in each of the replicas.&lt;/span&gt;\n&lt;span class=\"hljs-comment\"&gt;# To do this, view the flushed_row_count and replicated_row_index attributes.&lt;/span&gt;\nyt get &lt;span class=\"hljs-string\"&gt;'#730e-7bcd8-3ff02c5-fd0b36ee/@tablets'&lt;/span&gt;\n[\n    {\n        &lt;span class=\"hljs-string\"&gt;\"flushed_row_count\"&lt;/span&gt; = 5;\n        &lt;span class=\"hljs-string\"&gt;\"tablet_id\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"730e-68d3e-3ff02be-ee882e4a\"&lt;/span&gt;;\n        &lt;span class=\"hljs-string\"&gt;\"trimmed_row_count\"&lt;/span&gt; = 2;\n        &lt;span class=\"hljs-string\"&gt;\"replication_lag_time\"&lt;/span&gt; = 0;\n        &lt;span class=\"hljs-string\"&gt;\"current_replication_timestamp\"&lt;/span&gt; = 1610012496066773010u;\n        &lt;span class=\"hljs-string\"&gt;\"current_replication_row_index\"&lt;/span&gt; = 5;\n        &lt;span class=\"hljs-string\"&gt;\"state\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"enabled\"&lt;/span&gt;;\n    };\n]\n\nyt get &lt;span class=\"hljs-string\"&gt;'#730e-8611b-3ff02c5-f647333f/@tablets'&lt;/span&gt;\n[\n    {\n        &lt;span class=\"hljs-string\"&gt;\"flushed_row_count\"&lt;/span&gt; = 5;\n        &lt;span class=\"hljs-string\"&gt;\"tablet_id\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"730e-68d3e-3ff02be-ee882e4a\"&lt;/span&gt;;\n        &lt;span class=\"hljs-string\"&gt;\"trimmed_row_count\"&lt;/span&gt; = 2;\n        &lt;span class=\"hljs-string\"&gt;\"replication_lag_time\"&lt;/span&gt; = 0;\n        &lt;span class=\"hljs-string\"&gt;\"current_replication_timestamp\"&lt;/span&gt; = 1610012496066773010u;\n        &lt;span class=\"hljs-string\"&gt;\"current_replication_row_index\"&lt;/span&gt; = 5;\n        &lt;span class=\"hljs-string\"&gt;\"state\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"enabled\"&lt;/span&gt;;\n    };\n]\n\n&lt;span class=\"hljs-comment\"&gt;# You can see that the flushed_row_count and current_replication_row_index values are the same, which means that both replicas have been fully replicated.&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"907\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-907\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-907\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-907.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;dfn class=\"yfm yfm-term_dfn\" id=\":*_element\" role=\"dialog\"&gt;&lt;p&gt;The parameter appears in the answer several times.&lt;/p&gt;\n&lt;/dfn&gt;","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"en/user-guide/dynamic-tables/replicated-dynamic-tables.md","sourcePath":"en/user-guide/dynamic-tables/replicated-dynamic-tables.md"},"headings":[{"title":"General information","href":"en/user-guide/dynamic-tables/replicated-dynamic-tables.html#common","level":2},{"title":"Writing data","href":"en/user-guide/dynamic-tables/replicated-dynamic-tables.html#write","level":2},{"title":"Reading data","href":"en/user-guide/dynamic-tables/replicated-dynamic-tables.html#read","level":2},{"title":"Replication","href":"en/user-guide/dynamic-tables/replicated-dynamic-tables.html#replication","level":2,"items":[{"title":"Guarantees","href":"en/user-guide/dynamic-tables/replicated-dynamic-tables.html#guarantees","level":3},{"title":"Replicas","href":"en/user-guide/dynamic-tables/replicated-dynamic-tables.html#replicas","level":3,"items":[{"title":"Adding a replica to an existing replicated table","href":"en/user-guide/dynamic-tables/replicated-dynamic-tables.html#add-new-replica","level":4}]},{"title":"Creating replica tables","href":"en/user-guide/dynamic-tables/replicated-dynamic-tables.html#creating-replica-tables","level":3},{"title":"Replica settings","href":"en/user-guide/dynamic-tables/replicated-dynamic-tables.html#replica-state","level":3},{"title":"Manual synchronization","href":"en/user-guide/dynamic-tables/replicated-dynamic-tables.html#manual-synchronization","level":3},{"title":"Replication modes","href":"en/user-guide/dynamic-tables/replicated-dynamic-tables.html#replication-modes","level":3},{"title":"Automatic switching of the synchronous replica","href":"en/user-guide/dynamic-tables/replicated-dynamic-tables.html#automatic-switching-of-the-synchronous-replica","level":3,"items":[{"title":"Concurrent switching of synchronous table group replicas","href":"en/user-guide/dynamic-tables/replicated-dynamic-tables.html#replication_collocation","level":4},{"title":"Specifying preferred clusters for synchronous replicas","href":"en/user-guide/dynamic-tables/replicated-dynamic-tables.html#specifying-preferred-clusters-for-synchronous-replicas","level":4}]},{"title":"Limiting replication speed","href":"en/user-guide/dynamic-tables/replicated-dynamic-tables.html#limiting-replication-speed","level":3,"items":[{"title":"Relative replication throttling","href":"en/user-guide/dynamic-tables/replicated-dynamic-tables.html#relative-replication-throttling","level":4},{"title":"Absolute replication throttling","href":"en/user-guide/dynamic-tables/replicated-dynamic-tables.html#absolute-replication-throttling","level":4}]},{"title":"Maintaining the tablet index during ordered table replication","href":"en/user-guide/dynamic-tables/replicated-dynamic-tables.html#maintaining-the-tablet-index-during-ordered-table-replication","level":3}]},{"title":"Changing schemas","href":"en/user-guide/dynamic-tables/replicated-dynamic-tables.html#alter_schema","level":2},{"title":"Resistance to downtimes and updates","href":"en/user-guide/dynamic-tables/replicated-dynamic-tables.html#downtimes","level":2},{"title":"Attributes","href":"en/user-guide/dynamic-tables/replicated-dynamic-tables.html#attributes","level":2},{"title":"Checking a replication queue","href":"en/user-guide/dynamic-tables/replicated-dynamic-tables.html#queue_check","level":2},{"title":"Use cases","href":"en/user-guide/dynamic-tables/replicated-dynamic-tables.html#examples","level":2,"items":[{"title":"Creating, setting up replicas","href":"en/user-guide/dynamic-tables/replicated-dynamic-tables.html#creating,-setting-up-replicas","level":3}]}],"title":"Replicated tables"},"router":{"pathname":"en/user-guide/dynamic-tables/replicated-dynamic-tables","depth":4,"base":"../../../"},"lang":"en","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/en/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-a29ea7877730322f2ce693378d06d02ac2b374cd-en","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
