        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;YTsaurus enables you to specify &lt;a href=\"user-guide/dynamic-tables/sorted-dynamic-tables.html\"&gt;sorted dynamic tables&lt;/a&gt; as output tables of map-reduce operations (the so-called bulk insert).&lt;/p&gt;\n&lt;p&gt;Application:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Data delivery to tables.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;DELETE WHERE&lt;/code&gt; client implementation.&lt;/li&gt;\n&lt;li&gt;Background process of cleaning up rows with a non-trivial TTL.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"features\"&gt;&lt;a href=\"en/user-guide/dynamic-tables/bulk-insert.html#features\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Features&lt;/span&gt;&lt;/a&gt;Features&lt;/h2&gt;\n&lt;p&gt;Operations that contain dynamic output tables have a number of features.&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;The operation cannot be run under a user transaction.&lt;/li&gt;\n&lt;li&gt;Only sorted dynamic tables can be output.&lt;/li&gt;\n&lt;li&gt;A dynamic table can be written to either in \"append\" or \"overwrite\" mode. This is regulated by the &lt;code&gt;&amp;lt;append=%true&amp;gt;&lt;/code&gt; attribute on the path. Unlike sorted static tables, adding data to a dynamic table takes a shared lock on it, so multiple operations can write to the table at the same time. Note that writing in \"append\" mode is actually upsert, not append (data does not have to be written to the end of the table).&lt;/li&gt;\n&lt;li&gt;You can only write to a mounted or frozen dynamic table. Writing to a frozen table is strongly discouraged, because compaction does not work in frozen tables. Without it, reading quickly becomes inefficient, and writing is &lt;a href=\"en/user-guide/dynamic-tables/bulk-insert.html#compaction\"&gt;blocked&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;Only sorted data with &lt;code&gt;unique_keys=%true&lt;/code&gt; can be written to a dynamic table. If user jobs do not have this feature, use an intermediate static table, which can then be sorted into a dynamic one using the sort operation.&lt;/li&gt;\n&lt;li&gt;An operation transaction is not like classic tablet transactions. In particular, you can write to the output table using &lt;code&gt;insert_rows&lt;/code&gt; while the operation is running, and if the operation affects the same rows, they will be overwritten.&lt;/li&gt;\n&lt;li&gt;Data can be written from the operation in extended format that enables you to delete rows and specify \"aggregate\" mode.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"trasactional_model\"&gt;&lt;a href=\"en/user-guide/dynamic-tables/bulk-insert.html#trasactional_model\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Transactional model&lt;/span&gt;&lt;/a&gt;Transactional model&lt;/h2&gt;\n&lt;p&gt;As with ordinary operations, the bulk insert commit is atomic: the changes will either fall into all output tables or none.&lt;/p&gt;\n&lt;p&gt;While the operation is being committed, all dynamic tables in which the insertion takes place are locked. The lock applies to any writes, as well as reads with a timestamp greater than the lock start time and SyncLastCommittedTimestamp. Reads with AsyncLastCommittedTimestamp will not be locked. If the operation commit is completed successfully, the table is unlocked and the data appears in it. The timestamp of all inserted rows is equal to the timestamp of the operation commit. In particular, the timestamp of the inserted rows in all affected tables will be the same.&lt;/p&gt;\n&lt;p&gt;Bulk insert only conflicts with those tablet transactions that affect the moment of commit (locking). If a tablet transaction started before locking, it will not be able to commit afterwards. There will either (most likely) be an abort, or the operation commit will wait for the transaction commit.&lt;/p&gt;\n&lt;p&gt;Several bulk insert operations with &lt;code&gt;&amp;lt;append=%true&amp;gt;&lt;/code&gt; can run and even be committed in parallel. There are no row-by-row locks: the system enables different operations to edit the same row.&lt;/p&gt;\n&lt;h2 id=\"deletions-and-extended-write-format\"&gt;&lt;a href=\"en/user-guide/dynamic-tables/bulk-insert.html#deletions-and-extended-write-format\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Deletions and extended write format&lt;/span&gt;&lt;/a&gt;Deletions and extended write format&lt;/h2&gt;\n&lt;p&gt;The extended format enables you to delete rows from the table, set \"aggregate\" (&lt;code&gt;aggregate&lt;/code&gt; in insert_rows) and \"overwrite\" mode (&lt;code&gt;update&lt;/code&gt; in insert_rows). To use it, you need to specify the &lt;code&gt;schema_modification=unversioned_update&lt;/code&gt; attribute on the path to the output table and write from the operation in the special schema:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Key columns remain unchanged.&lt;/li&gt;\n&lt;li&gt;A mandatory column with the &lt;code&gt;$change_type&lt;/code&gt; name is added, indicating whether the row is a write or a deletion.&lt;/li&gt;\n&lt;li&gt;Each non-key column with the name &lt;code&gt;name&lt;/code&gt; is replaced by two columns: &lt;code&gt;$value:name&lt;/code&gt; and &lt;code&gt;$flags:name&lt;/code&gt;. The first one will contain the value and the second one will manage \"aggregate\" and \"overwrite\" modes.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;You can take the service column names from the &lt;a href=\"https://github.com/ytsaurus/ytsaurus/blob/879946a82c766da78612ab4fe3637f7ea4da8292/yt/yt/client/tablet_client/public.h#L152\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;api&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;&lt;code&gt;$change_type&lt;/code&gt; accepts values from the &lt;a href=\"https://github.com/ytsaurus/ytsaurus/blob/879946a82c766da78612ab4fe3637f7ea4da8292/yt/yt/client/api/public.h#L53\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;ERowModificationType&lt;/a&gt; enum. Only &lt;code&gt;Write&lt;/code&gt; and &lt;code&gt;Delete&lt;/code&gt; values are allowed.&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th style=\"text-align:left\"&gt;Name&lt;/th&gt;\n&lt;th style=\"text-align:left\"&gt;Value&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td style=\"text-align:left\"&gt;&lt;code&gt;ERowModificationType::Write&lt;/code&gt;&lt;/td&gt;\n&lt;td style=\"text-align:left\"&gt;0&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td style=\"text-align:left\"&gt;&lt;code&gt;ERowModificationType::Delete&lt;/code&gt;&lt;/td&gt;\n&lt;td style=\"text-align:left\"&gt;1&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;The value flags accept the bit mask of values of the &lt;a href=\"https://github.com/ytsaurus/ytsaurus/blob/879946a82c766da78612ab4fe3637f7ea4da8292/yt/yt/client/tablet_client/public.h#L142\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;EUnversionedUpdateDataFlags&lt;/a&gt; enum. The &lt;code&gt;missing | aggregate&lt;/code&gt; combination makes no sense, but it is acceptable. If no flags are specified for a column, they are considered equal to 0.&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th style=\"text-align:left\"&gt;Name&lt;/th&gt;\n&lt;th style=\"text-align:left\"&gt;Value&lt;/th&gt;\n&lt;th style=\"text-align:left\"&gt;Clarification&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td style=\"text-align:left\"&gt;&lt;code&gt;EUnversionedUpdateDataFlags::Missing&lt;/code&gt;&lt;/td&gt;\n&lt;td style=\"text-align:left\"&gt;1&lt;/td&gt;\n&lt;td style=\"text-align:left\"&gt;If the bit is set, the value will be ignored, otherwise it will be overwritten (if there is no value, Null will be written to the table).&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td style=\"text-align:left\"&gt;&lt;code&gt;EUnversionedUpdateDataFlags::Aggregate&lt;/code&gt;&lt;/td&gt;\n&lt;td style=\"text-align:left\"&gt;2&lt;/td&gt;\n&lt;td style=\"text-align:left\"&gt;If the bit is set, aggregate will be applied, otherwise the value will be updated.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Let's assume that we have a table with the &lt;em&gt;user_name&lt;/em&gt; key column (string), the &lt;em&gt;age&lt;/em&gt; column (uint64), and the &lt;em&gt;balance&lt;/em&gt; aggregate column (int64). The extended schema will then look like this:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;{name=\"user_name\"; type=string; sort_order=ascending}\n{name=\"$change_type\"; type=uint64; required=%true}\n{name=\"$value:age\"; type=uint64}\n{name=\"$flags:age\"; type=uint64}\n{name=\"$value:balance\"; type=int64}\n{name=\"$flags:balance\"; type=uint64}\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"185\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-185\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-185\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-185.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Then to delete the string, you need the following write&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;{\n  \"user_name\"=\"vasya\";\n  \"$change_type\"=1; // delete\n}\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"189\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-189\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-189\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-189.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;And to update the balance (and maintain the age), you need the following write&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;{\n  \"user_name\"=\"vasya\";\n  \"$change_type\"=0; // write\n  \"$flags:age\"=1; // missing\n  \"$value:balance\"=100500;\n  \"$flags:balance\"=2; // aggregate\n}\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"193\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-193\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-193\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-193.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;&lt;/p&gt;\n&lt;p&gt;In extended format, you can also create intermediate static tables which will then be inserted into dynamic tables using sort or merge, but this is very situational.&lt;/p&gt;\n&lt;h3 id=\"delete-where-via-input-query\"&gt;&lt;a href=\"en/user-guide/dynamic-tables/bulk-insert.html#delete-where-via-input-query\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;DELETE WHERE via input query&lt;/span&gt;&lt;/a&gt;DELETE WHERE via input query&lt;/h3&gt;\n&lt;p&gt;With bulk insert, you can effectively delete multiple rows from a table by condition using &lt;a href=\"user-guide/dynamic-tables/dyn-query-language\"&gt;input query&lt;/a&gt;. An SQL-like query language can be used to filter the rows supplied to the input of an operation. The same syntax as in select-rows is used. For example, you can delete all rows with an even key from a table this way.&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs python\"&gt;input_query = &lt;span class=\"hljs-string\"&gt;\"1u as [$change_type], key1, key2 where key1 % 2 = 0\"&lt;/span&gt;\nyt.run_merge(\n    table,\n    yt.TablePath(\n        table,\n        append=&lt;span class=\"hljs-literal\"&gt;True&lt;/span&gt;,\n        attributes={&lt;span class=\"hljs-string\"&gt;\"schema_modification\"&lt;/span&gt;: &lt;span class=\"hljs-string\"&gt;\"unversioned_update\"&lt;/span&gt;}),\n    mode=&lt;span class=\"hljs-string\"&gt;\"ordered\"&lt;/span&gt;,\n    spec={&lt;span class=\"hljs-string\"&gt;\"input_query\"&lt;/span&gt;: input_query})\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"206\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-206\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-206\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-206.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;The operation will read all rows from the table, leave those matching the condition, convert them into a deletion format, and write them back to the table.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Warning&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;As with delete_rows, deletion does not delete rows from the table, but writes tombstones that will later be compacted. If you delete much data from a table, queries can start slowing down in a random way, because for every useful row you have to read a lot of deleted rows.&lt;/p&gt;\n&lt;p&gt;For regular deletions, in most scenarios compaction will run automatically, but in some cases you may need to configure the table.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"additional_fields\"&gt;&lt;a href=\"en/user-guide/dynamic-tables/bulk-insert.html#additional_fields\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Additional fields in the specification&lt;/span&gt;&lt;/a&gt;Additional fields in the specification&lt;/h2&gt;\n&lt;p&gt;The operation specification may contain the same fields as usual, with a few exceptions.&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;To specify the &lt;a href=\"user-guide/storage/io-configuration#table_writer\"&gt;table writer&lt;/a&gt; config, use the &lt;code&gt;dynamic_table_writer&lt;/code&gt; option indicated in the same place as the ordinary &lt;code&gt;table_writer&lt;/code&gt; (in &lt;code&gt;*_job_io&lt;/code&gt;). Chunks and blocks of dynamic tables must be smaller than chunks of static tables. The default value is &lt;code&gt;{desired_chunk_size=100MB; block_size=256KB}&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"compaction\"&gt;&lt;a href=\"en/user-guide/dynamic-tables/bulk-insert.html#compaction\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Compaction features&lt;/span&gt;&lt;/a&gt;Compaction features&lt;/h2&gt;\n&lt;p&gt;&lt;em&gt;This section describes the implementation details. If you want to use bulk insert for large amounts of data, we recommend reading it.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;Sorted dynamic tables resemble an &lt;a href=\"https://ru.wikipedia.org/wiki/LSM-%D0%B4%D0%B5%D1%80%D0%B5%D0%B2%D0%BE\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;LSM tree&lt;/a&gt;. The used data structure works efficiently with a steady, albeit quite large, stream of writes. Written data is compacted in background mode and stacked in chunks in a predictable manner.&lt;/p&gt;\n&lt;p&gt;When inserted from an operation, many new chunks are added to the table, at least one per job. These chunks are not aligned to the table structure, but \"piled up\" in an unpredictable manner. After a few operations, access to the data will become inefficient, so it must be repaired.&lt;/p&gt;\n&lt;p&gt;There are two issues with compaction. First, resources are needed. A single node can compact at the speed of about 100 Mb/s, with not only fresh data but also old data being processed. Therefore, if there is only one node in the bundle, bulk insert for tens of gigabytes per minute is unlikely to work, because the structure will not have time to recover.&lt;/p&gt;\n&lt;p&gt;Second, compaction heuristics are not perfect. If there are a lot of very small chunks in the table, the algorithm will become less efficient. The same happens if there is a very large chunk with a wide range of keys in the table. In the worst case, the table will get stuck and can only be repaired manually.&lt;/p&gt;\n&lt;p&gt;Bulk insert can lead to a number of unusual scenarios. We have prepared the proper heuristics for many of them, but we have hardly taken everything into account. Therefore, a test run on real volumes is an important next step.&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"en/user-guide/dynamic-tables/bulk-insert.md","sourcePath":"en/user-guide/dynamic-tables/bulk-insert.md"},"headings":[{"title":"Features","href":"en/user-guide/dynamic-tables/bulk-insert.html#features","level":2},{"title":"Transactional model","href":"en/user-guide/dynamic-tables/bulk-insert.html#trasactional_model","level":2},{"title":"Deletions and extended write format","href":"en/user-guide/dynamic-tables/bulk-insert.html#deletions-and-extended-write-format","level":2,"items":[{"title":"DELETE WHERE via input query","href":"en/user-guide/dynamic-tables/bulk-insert.html#delete-where-via-input-query","level":3}]},{"title":"Additional fields in the specification","href":"en/user-guide/dynamic-tables/bulk-insert.html#additional_fields","level":2},{"title":"Compaction features","href":"en/user-guide/dynamic-tables/bulk-insert.html#compaction","level":2}],"title":"Inserting from operations into dynamic tables"},"router":{"pathname":"en/user-guide/dynamic-tables/bulk-insert","depth":4,"base":"../../../"},"lang":"en","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/en/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-a29ea7877730322f2ce693378d06d02ac2b374cd-en","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
