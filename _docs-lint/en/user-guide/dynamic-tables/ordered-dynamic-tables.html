        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;This section reviews the structure of ordered dynamic tables and describes the operations that can be performed on them.&lt;/p&gt;\n&lt;h2 id=\"model\"&gt;&lt;a href=\"en/user-guide/dynamic-tables/ordered-dynamic-tables.html#model\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Data model&lt;/span&gt;&lt;/a&gt;Data model&lt;/h2&gt;\n&lt;p&gt;Ordered dynamic tables are a table type in YTsaurus that is a simple ordered sequence of rows. Each row of an ordered table consists of columns and is subordinate to the table schema specified in the process of creation. There are no key columns in such tables.&lt;/p&gt;\n&lt;p&gt;Ordered dynamic tables support adding new rows to the end within a transaction, as well as reading rows by their indexes without transaction isolation.&lt;/p&gt;\n&lt;p&gt;The closest analog of ordered dynamic tables is &lt;a href=\"https://kafka.apache.org\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Apache Kafka&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;As with &lt;a href=\"user-guide/dynamic-tables/sorted-dynamic-tables.html\"&gt;sorted dynamic tables&lt;/a&gt;, the key space of an ordered dynamic table is divided into &lt;a href=\"user-guide/dynamic-tables/overview.html#tablets\"&gt;tablets&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;Dividing data into tablets is random. Each tablet contains an ordered sequence of table rows. When the rows are written to the tablet, they get to the end of this sequence. That way, orderliness is only guaranteed within the tablet.&lt;/p&gt;\n&lt;p&gt;An ordered dynamic table initially consists of one tablet. Multiple tablets can be changed using the &lt;code&gt;reshard_table&lt;/code&gt; command. It enables you to change the structure for a set of consecutive tablets. When &lt;a href=\"en/user-guide/dynamic-tables/ordered-dynamic-tables.html#reshard\"&gt;resharding&lt;/a&gt; an ordered dynamic table, you need to specify a new number of tablets for replacing the original ones. Specifying &lt;code&gt;pivot_keys&lt;/code&gt; is not required. Existing data is redistributed between the new tablets in an unspecified way.&lt;/p&gt;\n&lt;h2 id=\"methods\"&gt;&lt;a href=\"en/user-guide/dynamic-tables/ordered-dynamic-tables.html#methods\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Supported operations&lt;/span&gt;&lt;/a&gt;Supported operations&lt;/h2&gt;\n&lt;h3 id=\"creating\"&gt;&lt;a href=\"en/user-guide/dynamic-tables/ordered-dynamic-tables.html#creating\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Creating&lt;/span&gt;&lt;/a&gt;Creating&lt;/h3&gt;\n&lt;p&gt;To create an ordered dynamic table, run the &lt;code&gt;create table&lt;/code&gt; command and specify the schema and &lt;code&gt;dynamic=True&lt;/code&gt; setting in the attributes. The schema must match the schema of the ordered table: there must be no key columns among its columns.&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;yt create table //path/to/table --attributes \\\n&lt;span class=\"hljs-string\"&gt;'{dynamic=%true;schema=[{name=first_name;type=string};{name=last_name;type=string}]}'&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"33\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-33\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-33\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-33.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;When creating a table, you can specify the starting row index for each tablet. For example, this is useful when recreating a queue if consumers rely on &lt;code&gt;row_index&lt;/code&gt; values. To do this, use the &lt;code&gt;trimmed_row_counts&lt;/code&gt; attribute. When passing this attribute, you also need to specify &lt;code&gt;tablet_count&lt;/code&gt;, which must match the length of the &lt;code&gt;trimmed_row_counts&lt;/code&gt; list.&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;yt create table //path/to/table --attributes \\\n&lt;span class=\"hljs-string\"&gt;'{dynamic=%true;schema=[{name=first_name;type=string};{name=last_name;type=string}]}; \\\ntablet_count=5; \\\ntrimmed_row_counts=[10;20;30;40;50]}'&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"37\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-37\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-37\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-37.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"writing-rows\"&gt;&lt;a href=\"en/user-guide/dynamic-tables/ordered-dynamic-tables.html#writing-rows\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Writing rows&lt;/span&gt;&lt;/a&gt;Writing rows&lt;/h3&gt;\n&lt;p&gt;The &lt;code&gt;insert_rows&lt;/code&gt; command is used to write to an ordered dynamic table. By default, data is written to a random mounted tablet. To manage data distribution manually, use a special &lt;code&gt;$tablet_index&lt;/code&gt; system column of the &lt;code&gt;int64&lt;/code&gt; type in the rows to be written. The values in this column must be numbers from 0 to N − 1 where N is the number of tablets in the table. The relevant rows will be written strictly to the specified tablet. Rows for which there is no such annotation will be written to a random mounted tablet.&lt;/p&gt;\n&lt;p&gt;The write within a transaction is transactional: if the transaction succeeds, the rows appear in the relevant tables; if not, they do not. You can handle both sorted and ordered tables in a single transaction.&lt;/p&gt;\n&lt;h3 id=\"reading-rows\"&gt;&lt;a href=\"en/user-guide/dynamic-tables/ordered-dynamic-tables.html#reading-rows\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Reading rows&lt;/span&gt;&lt;/a&gt;Reading rows&lt;/h3&gt;\n&lt;p&gt;You can read data from ordered tables using an &lt;a href=\"user-guide/dynamic-tables/dyn-query-language.html\"&gt;SQL-like query language&lt;/a&gt; and the &lt;code&gt;select_rows&lt;/code&gt; command. Each ordered dynamic table appears as a sorted one with system key columns &lt;code&gt;($tablet_index, $row_index)&lt;/code&gt; (both of the &lt;code&gt;int64&lt;/code&gt; type) and all data columns specified in the table schema.&lt;/p&gt;\n&lt;p&gt;For example, this is what a query that reads a range of rows from a fixed tablet of an ordered table looks like:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs sql\"&gt;&lt;span class=\"hljs-operator\"&gt;*&lt;/span&gt; &lt;span class=\"hljs-keyword\"&gt;from&lt;/span&gt; [&lt;span class=\"hljs-operator\"&gt;/&lt;/span&gt;&lt;span class=\"hljs-operator\"&gt;/&lt;/span&gt;path&lt;span class=\"hljs-operator\"&gt;/&lt;/span&gt;&lt;span class=\"hljs-keyword\"&gt;to&lt;/span&gt;&lt;span class=\"hljs-operator\"&gt;/&lt;/span&gt;&lt;span class=\"hljs-keyword\"&gt;table&lt;/span&gt;] &lt;span class=\"hljs-keyword\"&gt;where&lt;/span&gt; [$tablet_index] &lt;span class=\"hljs-operator\"&gt;=&lt;/span&gt; &lt;span class=\"hljs-number\"&gt;10&lt;/span&gt; &lt;span class=\"hljs-keyword\"&gt;and&lt;/span&gt; [$row_index] &lt;span class=\"hljs-keyword\"&gt;between&lt;/span&gt; &lt;span class=\"hljs-number\"&gt;100&lt;/span&gt; &lt;span class=\"hljs-keyword\"&gt;and&lt;/span&gt; &lt;span class=\"hljs-number\"&gt;200&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"56\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-56\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-56\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-56.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"changing-a-table-schema-and-type\"&gt;&lt;a href=\"en/user-guide/dynamic-tables/ordered-dynamic-tables.html#changing-a-table-schema-and-type\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Changing a table schema and type&lt;/span&gt;&lt;/a&gt;Changing a table schema and type&lt;/h3&gt;\n&lt;p&gt;You can change the schema of an existing dynamic table using the &lt;code&gt;alter-table&lt;/code&gt; command. For the command to be successful, the table must be &lt;a href=\"user-guide/dynamic-tables/overview.html#mount_table\"&gt;unmounted&lt;/a&gt; and the new schema must be compatible with the old one. There are no changes to the data written to the disk, because the old data is suitable for the new schema.&lt;/p&gt;\n&lt;p&gt;Use &lt;code&gt;alter-table&lt;/code&gt; to convert an ordered dynamic table into a static table and vice versa. For more information, see &lt;a href=\"user-guide/dynamic-tables/mapreduce.html#convert_table\"&gt;MapReduce for dynamic tables&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"trim\"&gt;&lt;a href=\"en/user-guide/dynamic-tables/ordered-dynamic-tables.html#trim\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Trim&lt;/span&gt;&lt;/a&gt;Trim&lt;/h3&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Attention!&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Using reshard together with trim is prohibited because this can lead to unpredictable results.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;In general, data cannot be deleted from an ordered dynamic table. But there is an exception: you can delete the starting row segment in each tablet . To do this, use the &lt;code&gt;trim_rows&lt;/code&gt; command. The table path and tablet number are transmitted to it as arguments, as well as the &lt;code&gt;trimmed_row_count&lt;/code&gt; argument showing how many rows in the table will be deleted after the command is executed. The row numbering is retained. For example, when first called with &lt;code&gt;trimmed_row_count = 10&lt;/code&gt;, rows with numbers from 0 to 9 inclusive will be deleted. Then, when called with &lt;code&gt;trimmed_row_count = 30&lt;/code&gt; — rows from 10 to 29 inclusive, etc., &lt;code&gt;trimmed_row_count&lt;/code&gt; does not have a relative sense, but an absolute one and indicates not the number of rows that will be additionally deleted in case of the next call, but which initial rows will be deleted after the call.&lt;/p&gt;\n&lt;p&gt;The &lt;code&gt;trim_rows&lt;/code&gt; command is executed outside of transactions. Once it is complete, the deleted data can no longer be read by the &lt;code&gt;select_rows&lt;/code&gt; command. As soon as it appears that so many rows were deleted in the tablet that they form an entire initial chunk, the cluster node serving the tablet sends a signal to the master server and the given chunk is deleted as a whole. This is the moment when disk space is freed up.&lt;/p&gt;\n&lt;p&gt;You can find out the number of deleted rows in any tablet from its &lt;code&gt;trimmed_row_count&lt;/code&gt; attribute. This parameter is updated asynchronously, i.e. some time may elapse between &lt;code&gt;trim_rows&lt;/code&gt; execution and its change.&lt;/p&gt;\n&lt;p&gt;When a tablet is unmounted and then re-mounted, the number of initial deleted rows is retained, ensuring that the numbering is unchanged.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Warning&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;When you convert a dynamic table into a static table using the &lt;code&gt;alter_table&lt;/code&gt; command, information about which rows were deleted is lost. The order of rows in the table is lost as well. The order of rows within the chunks remains unchanged, but this order is hardly reliable. Indeed, some initial rows of some chunks may be marked as deleted in a dynamic table, and this information cannot be retained when the table is converted into a static table. As a result, when converting a dynamic table into a static one, some of the previously deleted rows may re-appear.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"reshard\"&gt;&lt;a href=\"en/user-guide/dynamic-tables/ordered-dynamic-tables.html#reshard\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Resharding&lt;/span&gt;&lt;/a&gt;Resharding&lt;/h3&gt;\n&lt;p&gt;If the number of tablets increases during sharding, the existing tablets are not changed and new tablets are created empty. If the number of tablets needs to be reduced during resharding, the tablets at the end of the range are merged with the last of the resulting list of tablets that is not in the range.&lt;/p&gt;\n&lt;p&gt;The system tries to maintain the invariant “what is deleted is no longer available”. During resharding, the system appends the chunks from the deleted tablets to the end of the last retained tablet; this complicates resharding if the tablets you're deleting contain previously deleted rows. For resharding to complete successfully, the deleted rows must form a chunk prefix in the tablets to be deleted.&lt;/p&gt;\n&lt;p&gt;In real world scenarios, this limitation is difficult to observe, so if a tablet you want deleted contains deleted rows, you may as well consider it impossible to perform a resharding where the number of tablets will be reduced. To bypass this limitation, you can use two &lt;code&gt;alter_table&lt;/code&gt; calls, first making the table static and then dynamic. But do remember that some of the deleted rows re-appear in the table when you use this method.&lt;/p&gt;\n&lt;p&gt;If resharding causes the number of tablets to increase, you can specify the starting row index for each created tablet. To do this, pass the &lt;code&gt;trimmed_row_counts&lt;/code&gt; list as a command argument. Its length must match the number of created tablets: &lt;code&gt;tablet_count - (last_tablet_index - first_tablet_index + 1)&lt;/code&gt;.&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;yt reshard-table //path/to/table --tablet-count 5 --first-tablet-index 1 --last-tablet-index 3 --trimmed-row-counts 10 20\n&lt;span class=\"hljs-comment\"&gt;# Resulting offsets, assuming table had 5 tablets:&lt;/span&gt;\n&lt;span class=\"hljs-comment\"&gt;# (old tablet #0) (old tablet #1) (old tablet #2) (old tablet #3) 10 20 (old tablet #4)&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"116\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-116\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-116\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-116.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"remove_old_data\"&gt;&lt;a href=\"en/user-guide/dynamic-tables/ordered-dynamic-tables.html#remove_old_data\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Automatic deletion of old rows (TTL)&lt;/span&gt;&lt;/a&gt;Automatic deletion of old rows (TTL)&lt;/h3&gt;\n&lt;p&gt;The same old data deletion settings apply to ordered tables as to sorted tables. For more information, see &lt;a href=\"user-guide/dynamic-tables/sorted-dynamic-tables.html#remove_old_data\"&gt;Deleting old data&lt;/a&gt;. The significant difference is that a row always has only one version in ordered tables. The cleanup settings can then be interpreted as follows:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;If &lt;code&gt;min_data_versions &amp;gt; 0&lt;/code&gt; (the default value is 1), no automatic deletion occurs.&lt;/li&gt;\n&lt;li&gt;YTsaurus does not delete rows written less than &lt;code&gt;min_data_ttl&lt;/code&gt; before the current moment.&lt;/li&gt;\n&lt;li&gt;If &lt;code&gt;max_data_versions = 0&lt;/code&gt;, you can delete rows written later than &lt;code&gt;min_data_ttl&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;If &lt;code&gt;max_data_versions &amp;gt; 0&lt;/code&gt;, you can delete rows written later than &lt;code&gt;max_data_ttl&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Note&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Automatic deletion (trimming) applies to the entire chunk. As long as there are rows in the chunk that cannot be deleted, all rows from the chunk will be available.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"max_data_weight\"&gt;&lt;a href=\"en/user-guide/dynamic-tables/ordered-dynamic-tables.html#max_data_weight\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Data size limit&lt;/span&gt;&lt;/a&gt;Data size limit&lt;/h3&gt;\n&lt;p&gt;You can limit the amount of data in an ordered table by setting the maximum allowed tablet size. To do this, specify a limit in bytes in the table's &lt;code&gt;@mount_config/max_ordered_tablet_data_weight&lt;/code&gt; attribute.&lt;/p&gt;\n&lt;h2 id=\"dollartimestamp-column\"&gt;&lt;a href=\"en/user-guide/dynamic-tables/ordered-dynamic-tables.html#dollartimestamp-column\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;$timestamp column&lt;/span&gt;&lt;/a&gt;$timestamp column&lt;/h2&gt;\n&lt;p&gt;A special &lt;code&gt;$timestamp&lt;/code&gt; system column of the &lt;code&gt;uint64&lt;/code&gt; type can be specified in the ordered dynamic table schema. The value in this column is automatically generated by the system during writes and is equal to the commit timestamp for the transaction in which the rows were added to the table.&lt;/p&gt;\n&lt;h2 id=\"cumulative_data_weight_column\"&gt;&lt;a href=\"en/user-guide/dynamic-tables/ordered-dynamic-tables.html#cumulative_data_weight_column\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;$cumulative_data_weight column&lt;/span&gt;&lt;/a&gt;$cumulative_data_weight column&lt;/h2&gt;\n&lt;p&gt;A special &lt;code&gt;$cumulative_data_weight&lt;/code&gt; system column of the &lt;code&gt;uint64&lt;/code&gt; type can be specified in the ordered dynamic table schema. The value in this column is generated automatically when you write. It is equal to the total logical weight in bytes of rows in the tablet, counting from the initial row with index zero to the current one, inclusive. The weight of the &lt;code&gt;$cumulative_data_weight&lt;/code&gt; column itself is also counted in this value.&lt;/p&gt;\n&lt;p&gt;When you add this column to the schema of an existing table (via unmounting and the &lt;code&gt;alter_table&lt;/code&gt; query), the initial value of &lt;code&gt;$cumulative_data_weight&lt;/code&gt; is taken from the table chunk metadata.&lt;/p&gt;\n&lt;h2 id=\"commit_ordering\"&gt;&lt;a href=\"en/user-guide/dynamic-tables/ordered-dynamic-tables.html#commit_ordering\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Change visibility, strong/weak commit ordering&lt;/span&gt;&lt;/a&gt;Change visibility, strong/weak commit ordering&lt;/h2&gt;\n&lt;p&gt;The consistency level of ordered dynamic tables is fundamentally lower than that of sorted dynamic tables: committed data may not generally be visible immediately after a commit and may not be added in the order in which the commits occurred.&lt;/p&gt;\n&lt;p&gt;When using a distributed commit that involves multiple tablet cells, data appears in the tablets of different tablet cells at different points in time. Indeed, the second phase of the protocol (commit) is performed by physically distributed participants. Moreover, the same tablet cell may participate in multiple distributed transactions, and the values of their &lt;code&gt;commit-ts&lt;/code&gt;, as well as the actual sequence in which that tablet cell performs commits, are generally not guided by any conditions. The participant can perform the commit of the &lt;code&gt;A&lt;/code&gt; transaction before the commit of the &lt;code&gt;B&lt;/code&gt; transaction even when &lt;code&gt;commit-ts(A) &amp;gt; commit-ts(B)&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;In the case of dynamic sorted tables, this implementation detail is hidden from the user by snapshot isolation: even though the data from transaction &lt;code&gt;A&lt;/code&gt; has already been added to the table, it can only be read by requesting a &lt;code&gt;ts&lt;/code&gt; that is greater than or equal to &lt;code&gt;commit-ts(A)&lt;/code&gt;. In addition, the row locking system ensures that such inversion will not occur on the same key when the &lt;code&gt;[start-ts,commit-ts]&lt;/code&gt; intervals for transactions overlap.&lt;/p&gt;\n&lt;p&gt;The situation is different for ordered dynamic tables: they usually do not store commit timestamps, except in the case of the &lt;code&gt;$timestamp&lt;/code&gt; field, and do not support snapshot isolation. Therefore, the order in which writes will be appended to the end of the ordered dynamic table has nothing to do with the order of commit timestamps.&lt;/p&gt;\n&lt;p&gt;When an ordered dynamic table is involved in a two-phase commit, confirmation of a successful commit from the coordinator does not mean that all participants have also performed a commit and that data has indeed been appended to the end of the table (a two-phase commit is a commit that affects more than one tablet cell: for example, this includes all commits in which an ordered dynamic table is a synchronous replica). An attempt to find the committed rows immediately after a successful two-phase commit may fail, as these rows will become visible only some time later.&lt;/p&gt;\n&lt;p&gt;You can obtain certain monotony guarantees for added rows. A table has a &lt;code&gt;commit_ordering&lt;/code&gt; system attribute that manages the order of adding rows to it:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;weak&lt;/code&gt;: The default mode. The rows get into the ordered table immediately at the time of the commit of the participant, which is late relative to the coordinator, and the order relative to commit timestamps is not guaranteed.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;strong&lt;/code&gt;: It is guaranteed that the rows get into the table in the order of commit timestamps.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;In &lt;code&gt;strong&lt;/code&gt; mode, the table is ordered by the &lt;code&gt;$timestamp&lt;/code&gt; field, provided it exists. Note that this does not make it a key field.&lt;/p&gt;\n&lt;p&gt;In &lt;code&gt;strong&lt;/code&gt; mode, each tablet cell tracks a special &lt;code&gt;barrier-ts&lt;/code&gt; value. This value constantly and monotonically increases, and no transaction can get a &lt;code&gt;commit-ts&lt;/code&gt; that is smaller than the &lt;code&gt;barrier-ts&lt;/code&gt;. When &lt;code&gt;barrier-ts&lt;/code&gt; exceeds the &lt;code&gt;commit-ts&lt;/code&gt; of a transaction, the rows written by this transaction to an ordered dynamic table in &lt;code&gt;strong&lt;/code&gt; mode do not appear in the table immediately at the time of the commit. Thus, the system serializes all transactions by &lt;code&gt;commit-ts&lt;/code&gt;, but only those for which &lt;code&gt;commit-ts &amp;lt; barrier-ts&lt;/code&gt;. For transactions with &lt;code&gt;commit-ts &amp;gt; barrier-ts&lt;/code&gt;, the system can define a relative order, but cannot guarantee that there will not be a new transaction in the future that violates the established order.&lt;/p&gt;\n&lt;p&gt;For static tables, there is also a &lt;code&gt;commit_ordering&lt;/code&gt; attribute, but it is always &lt;code&gt;weak&lt;/code&gt;.&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"en/user-guide/dynamic-tables/ordered-dynamic-tables.md","sourcePath":"en/user-guide/dynamic-tables/ordered-dynamic-tables.md"},"headings":[{"title":"Data model","href":"en/user-guide/dynamic-tables/ordered-dynamic-tables.html#model","level":2},{"title":"Supported operations","href":"en/user-guide/dynamic-tables/ordered-dynamic-tables.html#methods","level":2,"items":[{"title":"Creating","href":"en/user-guide/dynamic-tables/ordered-dynamic-tables.html#creating","level":3},{"title":"Writing rows","href":"en/user-guide/dynamic-tables/ordered-dynamic-tables.html#writing-rows","level":3},{"title":"Reading rows","href":"en/user-guide/dynamic-tables/ordered-dynamic-tables.html#reading-rows","level":3},{"title":"Changing a table schema and type","href":"en/user-guide/dynamic-tables/ordered-dynamic-tables.html#changing-a-table-schema-and-type","level":3},{"title":"Trim","href":"en/user-guide/dynamic-tables/ordered-dynamic-tables.html#trim","level":3},{"title":"Resharding","href":"en/user-guide/dynamic-tables/ordered-dynamic-tables.html#reshard","level":3},{"title":"Automatic deletion of old rows (TTL)","href":"en/user-guide/dynamic-tables/ordered-dynamic-tables.html#remove_old_data","level":3},{"title":"Data size limit","href":"en/user-guide/dynamic-tables/ordered-dynamic-tables.html#max_data_weight","level":3}]},{"title":"$timestamp column","href":"en/user-guide/dynamic-tables/ordered-dynamic-tables.html#dollartimestamp-column","level":2},{"title":"$cumulative_data_weight column","href":"en/user-guide/dynamic-tables/ordered-dynamic-tables.html#cumulative_data_weight_column","level":2},{"title":"Change visibility, strong/weak commit ordering","href":"en/user-guide/dynamic-tables/ordered-dynamic-tables.html#commit_ordering","level":2}],"title":"Ordered dynamic tables"},"router":{"pathname":"en/user-guide/dynamic-tables/ordered-dynamic-tables","depth":4,"base":"../../../"},"lang":"en","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/en/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-a29ea7877730322f2ce693378d06d02ac2b374cd-en","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
