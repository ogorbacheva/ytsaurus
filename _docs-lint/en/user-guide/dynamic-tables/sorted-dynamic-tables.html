        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;This section describes the structure of sorted dynamic tables and the actions that can be performed with these tables.&lt;/p&gt;\n&lt;h2 id=\"model\"&gt;&lt;a href=\"en/user-guide/dynamic-tables/sorted-dynamic-tables.html#model\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Data model&lt;/span&gt;&lt;/a&gt;Data model&lt;/h2&gt;\n&lt;p&gt;Each sorted dynamic table is a set of rows ordered by key. As with static tables, the key can be composite: it can consist of several columns. Unlike static tables, the key in a sorted dynamic table is unique.&lt;/p&gt;\n&lt;p&gt;Sorted dynamic tables must be strictly schematic: all column names and types must be specified in the schema in advance.&lt;/p&gt;\n&lt;h2 id=\"methods\"&gt;&lt;a href=\"en/user-guide/dynamic-tables/sorted-dynamic-tables.html#methods\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Supported operations&lt;/span&gt;&lt;/a&gt;Supported operations&lt;/h2&gt;\n&lt;h3 id=\"creating\"&gt;&lt;a href=\"en/user-guide/dynamic-tables/sorted-dynamic-tables.html#creating\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Creating&lt;/span&gt;&lt;/a&gt;Creating&lt;/h3&gt;\n&lt;p&gt;To create a sorted dynamic table, run the &lt;code&gt;create table&lt;/code&gt; command and specify the schema and &lt;code&gt;dynamic=True&lt;/code&gt; setting in the attributes. The schema must correspond to the schema of the sorted table.&lt;/p&gt;\n&lt;p&gt;CLI&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;yt create table //path/to/table --attributes \\\n&lt;span class=\"hljs-string\"&gt;'{dynamic=%true;schema=[{name=key;type=string;sort_order=ascending}; {name=value;type=string}]}'&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"24\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-24\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-24\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-24.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Attention!&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;You must specify at least one key column in the table schema. If this is not done, the table will be successfully created, but it will &lt;a href=\"user-guide/dynamic-tables/ordered-dynamic-tables.html\"&gt;ordered&lt;/a&gt; rather than sorted. Most types of select queries will work for the table. But all such queries will come down to a full scan of the data.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"changing-a-table-schema-and-type\"&gt;&lt;a href=\"en/user-guide/dynamic-tables/sorted-dynamic-tables.html#changing-a-table-schema-and-type\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Changing a table schema and type&lt;/span&gt;&lt;/a&gt;Changing a table schema and type&lt;/h3&gt;\n&lt;p&gt;You can change the schema of an existing dynamic table using the &lt;code&gt;alter-table&lt;/code&gt; command. For the command to be successful, the table must be &lt;a href=\"user-guide/dynamic-tables/overview.html#mount_table\"&gt;unmounted&lt;/a&gt;, and the new schema must be compatible with the old one. There are no changes to the data written to the disk, because the old data is suitable for the new schema.&lt;/p&gt;\n&lt;p&gt;Use &lt;code&gt;alter-table&lt;/code&gt; to convert a static table into a dynamic table. For more information, see &lt;a href=\"user-guide/dynamic-tables/mapreduce.html#convert_table\"&gt;MapReduce for dynamic tables&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"reading-rows\"&gt;&lt;a href=\"en/user-guide/dynamic-tables/sorted-dynamic-tables.html#reading-rows\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Reading rows&lt;/span&gt;&lt;/a&gt;Reading rows&lt;/h3&gt;\n&lt;p&gt;The client can read rows by a given key using the &lt;code&gt;lookup&lt;/code&gt; method. To do this, you need to specify the table name, a timestamp defining the slice of data to be read (&lt;code&gt;&amp;lt;= t&lt;/code&gt;), and the names of the columns that interest you. This is a point query: it requires all key components to be specified. There is a type of API call that allows multiple rows to be read in a single query by different keys.&lt;/p&gt;\n&lt;p&gt;Reads within an atomic transaction will use the transaction start timestamp. You can also indicate a specific numeric value, such as an approximation of the physical moment in time, as well as one of two special values:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;sync_last_committed&lt;/code&gt;: Read the latest version guaranteed to contain all modifications of already committed transactions.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;async_last_committed&lt;/code&gt;: Read the latest version if possible, but returning data with an unspecified, small delay (typically tens of milliseconds) is allowed.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;The &lt;code&gt;async_last_committed&lt;/code&gt; label can be used when read consistency is not required. This mode may work faster when there is competition between reads and two-phase commits. With a two-phase commit, the table rows are locked in a special way until the second stage starts for the transaction and the commit label is selected. Readers wanting the most recent data have to wait for the first phase to end, because before then it is not known whether the transaction will be successful.&lt;/p&gt;\n&lt;p&gt;The &lt;code&gt;sync_last_committed&lt;/code&gt; and &lt;code&gt;async_last_committed&lt;/code&gt; labels do not guarantee a consistent data slice. The data seen by the query reader can correspond to different points in time, either at the level of entire rows or at the level of individual row columns. A specific timestamp must be indicated for consistent reading across the entire table or for a set of tables.&lt;/p&gt;\n&lt;p&gt;For a table with non-atomic changes, &lt;code&gt;sync_last_committed&lt;/code&gt; and &lt;code&gt;async_last_committed&lt;/code&gt; modes are equivalent, since no two-phase commit occurs.&lt;/p&gt;\n&lt;h3 id=\"running-a-script\"&gt;&lt;a href=\"en/user-guide/dynamic-tables/sorted-dynamic-tables.html#running-a-script\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Running a script&lt;/span&gt;&lt;/a&gt;Running a script&lt;/h3&gt;\n&lt;p&gt;The system understands an &lt;a href=\"user-guide/dynamic-tables/dyn-query-language.html\"&gt;SQL-like dialect&lt;/a&gt;, which can be used to select and aggregate volumes of data in millions of rows in real time. As with the row read operation by key, a timestamp can be specified in the query, relative to which the query must be executed.&lt;/p&gt;\n&lt;p&gt;Since the data in the system is actually sorted by a set of key columns, the system uses this property to reduce the amount of reading at runtime. Specifically, the user's query is analyzed and &lt;code&gt;key ranges&lt;/code&gt;, ranges in key space whose combination covers the entire search area, are inferred from it. This enables you to execute &lt;code&gt;range scan&lt;/code&gt; with a single select query. For more information, see &lt;a href=\"user-guide/dynamic-tables/dyn-query-language.html\"&gt;Query language&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;When building the query, remember that if the system fails to infer non-trivial &lt;code&gt;key ranges&lt;/code&gt;, &lt;code&gt;full scan&lt;/code&gt; of the data will occur. &lt;code&gt;Full scan&lt;/code&gt; occurs, for example, if you specify &lt;code&gt;key1, key2&lt;/code&gt; as key columns and set filtering only by &lt;code&gt;key2&lt;/code&gt;.&lt;/p&gt;\n&lt;h3 id=\"insert_rows\"&gt;&lt;a href=\"en/user-guide/dynamic-tables/sorted-dynamic-tables.html#insert_rows\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Writing rows&lt;/span&gt;&lt;/a&gt;Writing rows&lt;/h3&gt;\n&lt;p&gt;The client can write using the &lt;code&gt;insert_rows&lt;/code&gt; method within the active transaction. To do this, the rows to be written must be reported. All key fields must be present in each such row. Some of the data fields from those specified in the schema may be missing.&lt;/p&gt;\n&lt;p&gt;Semantically, if a row with the specified key is not in the table, it appears. If there is already a row with this key, some of the columns are overwritten.&lt;/p&gt;\n&lt;p&gt;There are 2 modes when some of the fields are specified:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;overwrite&lt;/code&gt; (default): All unspecified fields update their values to &lt;code&gt;null&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;update&lt;/code&gt;: Enabled by the &lt;code&gt;update == true&lt;/code&gt; option. The previous value will then be retained. In this mode, all columns marked with the &lt;code&gt;required&lt;/code&gt; attribute must be transmitted.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Note&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;When reading and executing an SQL query, the data is visible only when the transaction starts. Changes written within the same transaction are not available for reading.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"deleting-rows\"&gt;&lt;a href=\"en/user-guide/dynamic-tables/sorted-dynamic-tables.html#deleting-rows\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Deleting rows&lt;/span&gt;&lt;/a&gt;Deleting rows&lt;/h3&gt;\n&lt;p&gt;Within the transaction, the client can delete a row or a set of rows by reporting the appropriate keys.&lt;/p&gt;\n&lt;p&gt;Semantically, if a row with the specified key was in the table, it will be deleted. If there was no row, then no changes will occur.&lt;/p&gt;\n&lt;p&gt;As with most MVCC systems, deletion in YTsaurus comes down to writing a row without data, but with a special &lt;code&gt;tombstone&lt;/code&gt; marker that signals deletion. This means that freeing up disk space from deleted rows does not happen immediately, but in a delayed manner. Deleting rows also does not instantly increase reading speed. On the contrary, it causes a slowdown, because during read operations data is merged.&lt;/p&gt;\n&lt;h3 id=\"locking-rows\"&gt;&lt;a href=\"en/user-guide/dynamic-tables/sorted-dynamic-tables.html#locking-rows\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Locking rows&lt;/span&gt;&lt;/a&gt;Locking rows&lt;/h3&gt;\n&lt;p&gt;The client can lock rows within a transaction. Locking guarantees that the row will not be changed in other transactions during the current transaction. A single row can be locked from multiple transactions. You can specify individual &lt;code&gt;lock&lt;/code&gt; column groups to be locked and a &lt;code&gt;weak&lt;/code&gt; or &lt;code&gt;strong&lt;/code&gt; lock mode.&lt;/p&gt;\n&lt;h3 id=\"remove_old_data\"&gt;&lt;a href=\"en/user-guide/dynamic-tables/sorted-dynamic-tables.html#remove_old_data\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Deleting old data (TTL)&lt;/span&gt;&lt;/a&gt;Deleting old data (TTL)&lt;/h3&gt;\n&lt;p&gt;In the process of combining the tablet chunks, some of the data may be identified as obsolete and deleted.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Note&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Deleting rows in a transaction actually only writes a special marker, but does not free up memory.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Values of the &lt;code&gt;min_data_versions&lt;/code&gt;, &lt;code&gt;max_data_versions&lt;/code&gt;, &lt;code&gt;min_data_ttl&lt;/code&gt;, and &lt;code&gt;max_data_ttl&lt;/code&gt; attributes indicate whether data can be deleted. The value can be deleted if two conditions are met at the same time:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;There is no prohibition to delete this value.&lt;/li&gt;\n&lt;li&gt;There is at least one permission to delete this value.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;To understand which values have permissions and prohibitions and what types they are, you can mentally sort all the values in this table row and column : (&lt;code&gt;t1, v1&lt;/code&gt;), (&lt;code&gt;t2, v2&lt;/code&gt;), ..., (&lt;code&gt;tn, vn&lt;/code&gt;) where &lt;code&gt;ti&lt;/code&gt; are timestamps and &lt;code&gt;vi&lt;/code&gt; are values themselves. Timestamps are considered ordered in descending order. In addition, the table row delete command generates a special value for all its columns: semantically, it does not equal &lt;code&gt;null&lt;/code&gt;, because once &lt;code&gt;null&lt;/code&gt; is written to the rows, they cannot be deleted. Then the deletion rules are as follows:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;The first &lt;code&gt;min_data_versions&lt;/code&gt; values cannot be deleted for version number reasons.&lt;/li&gt;\n&lt;li&gt;Values written less than &lt;code&gt;min_data_ttl&lt;/code&gt; before the current moment cannot be deleted for time reasons.&lt;/li&gt;\n&lt;li&gt;Values following the first &lt;code&gt;max_data_versions&lt;/code&gt; can be deleted for version number reasons.&lt;/li&gt;\n&lt;li&gt;Values written earlier than &lt;code&gt;max_data_ttl&lt;/code&gt; from the current moment can be deleted for time reasons.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Default settings:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;min_data_versions = 1;&lt;/li&gt;\n&lt;li&gt;max_data_versions = 1;&lt;/li&gt;\n&lt;li&gt;min_data_ttl = 1800000 (30 min);&lt;/li&gt;\n&lt;li&gt;max_data_ttl = 1800000 (30 min).&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;With default settings, at least one value (the last one) is always stored, along with all values written in the last 30 minutes. The time during which a transaction can remain consistent is limited: the system does not allow prolonged transactions.&lt;/p&gt;\n&lt;p&gt;By using the listed parameters, flexible storage policies can be built. For example, &lt;code&gt;min_data_versions = 0&lt;/code&gt;, &lt;code&gt;max_data_versions = 1&lt;/code&gt;, &lt;code&gt;min_data_ttl = 0&lt;/code&gt;, and &lt;code&gt;max_data_ttl = 86400000 (1 day)&lt;/code&gt; allow any data older than one day to be deleted, saving only one version from the last day.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Note&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;The specified parameters enable the system to delete data, but do not force it to. Combining chunks and deleting data is a background operation.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;If you need to force data cleaning, use the &lt;code&gt;forced_compaction_revision&lt;/code&gt; attribute:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;yt &lt;span class=\"hljs-built_in\"&gt;set&lt;/span&gt; //table/@forced_compaction_revision 1; yt remount-table //table\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"238\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-238\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-238\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-238.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;The given set of commands starts the compaction of all data written up to this moment. In this way, both redundant duplicate versions and logically deleted data will be deleted. This operation creates an immediate load on the cluster, which depends on the volume of multi-version data, so this operation is considered an administrative intervention.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Attention!&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;The &lt;code&gt;forced_compaction_revision&lt;/code&gt; setting causes a heavy load on the cluster. We do not recommend using this attribute without a specific need and understanding of the consequences.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Another popular scenario involves adding fresh writes to a table by keys that are (on average) ascending, while simultaneously deleting old data by keys that are also, on average, ascending. In this case, the table is appended with partitions containing logically deleted data that is marked by tombstones. These partitions will not be compressed as long as the number of chunks in them is small. The size of the table on the disk keeps increasing, even though the amount of undeleted data in the table remains constant. A possible solution is to specify the &lt;code&gt;auto_compaction_period&lt;/code&gt; parameter, which sets the periodicity at which partitions are forced to compact.&lt;/p&gt;\n&lt;h4 id=\"row-level-ttl\"&gt;&lt;a href=\"en/user-guide/dynamic-tables/sorted-dynamic-tables.html#row-level-ttl\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Row-level TTL&lt;/span&gt;&lt;/a&gt;Row-level TTL&lt;/h4&gt;\n&lt;p&gt;The primary use case for row-level &lt;code&gt;TTL&lt;/code&gt; is when you need to store rows from the same table for different amounts of time depending on the data they contain. The task of determining the storage duration of each row lies with the user.&lt;/p&gt;\n&lt;p&gt;To enable row-level &lt;code&gt;TTL&lt;/code&gt;, add an optional &lt;code&gt;uint64&lt;/code&gt; column named &lt;code&gt;$ttl&lt;/code&gt; to your table. This is a system column, which is why it has such designation. However, the task of updating this column with valid and current values still lies with the user. Writes to the table must include a valid value in milliseconds.&lt;/p&gt;\n&lt;p&gt;Requirements for values written to the &lt;code&gt;$ttl&lt;/code&gt; column:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;min_data_ttl &amp;lt;= ttl&lt;/code&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;How the &lt;code&gt;min_data_versions&lt;/code&gt;, &lt;code&gt;max_data_versions&lt;/code&gt;, &lt;code&gt;min_data_ttl&lt;/code&gt;, and &lt;code&gt;max_data_ttl&lt;/code&gt; attributes impact the &lt;code&gt;$ttl&lt;/code&gt; column:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;If &lt;code&gt;min_data_versions &amp;gt; 0&lt;/code&gt;, rows aren't deleted based on their values from the &lt;code&gt;$ttl&lt;/code&gt; column.&lt;/li&gt;\n&lt;li&gt;Rows with non-empty &lt;code&gt;$ttl&lt;/code&gt; column values aren't deleted after exceeding &lt;code&gt;max_data_ttl&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;When deleting data, the &lt;code&gt;$ttl&lt;/code&gt; value for the corresponding key is derived from the most recent entry in this column, if possible. This doesn't apply if some data is outside the chunks being merged. The deletion rules are similar to those listed in the previous section, with the addition of one rule:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Values written earlier than &lt;code&gt;ttl&lt;/code&gt; before the current point in time can't be deleted for time-related reasons.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;How to manage row-level &lt;code&gt;$ttl&lt;/code&gt;:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;To correctly delete a value from the &lt;code&gt;$ttl&lt;/code&gt; column, delete the entire row for the corresponding key, then insert it again without specifying a value in the &lt;code&gt;$ttl&lt;/code&gt; column.&lt;/li&gt;\n&lt;li&gt;Each insert must include a &lt;code&gt;$ttl&lt;/code&gt; value for the corresponding key. Furthermore, the value must always be the same, with the exception of the scenarios described below. Otherwise, we can't guarantee the desired behavior.&lt;/li&gt;\n&lt;li&gt;To extend the Time to Live of data for a given key, write the entire row with the updated &lt;code&gt;$ttl&lt;/code&gt; column value to the table.&lt;/li&gt;\n&lt;li&gt;To reduce the Time to Live of data for a given key, delete the data for that key, then insert it again, specifying your new value in the &lt;code&gt;$ttl&lt;/code&gt; column.&lt;/li&gt;\n&lt;li&gt;You can only specify &lt;code&gt;$ttl&lt;/code&gt; for previously written keys by deleting the row and inserting the new value in the &lt;code&gt;$ttl&lt;/code&gt; column.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"aggr_columns\"&gt;&lt;a href=\"en/user-guide/dynamic-tables/sorted-dynamic-tables.html#aggr_columns\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Aggregation columns&lt;/span&gt;&lt;/a&gt;Aggregation columns&lt;/h2&gt;\n&lt;p&gt;If the data scenario involves the constant addition of deltas to values already written in the table, use aggregation columns. In the schema, specify the &lt;code&gt;aggregate=sum&lt;/code&gt; attribute or another aggregate function for the column. You can then make a write to such a column with additive semantics to the value already written in the table.&lt;/p&gt;\n&lt;p&gt;No old value is read, only the delta is written to the table. The actual summing up occurs when reading. The values in the tables are stored together with a timestamp. When reading from an aggregation column, values corresponding to the same key and the same column, but with different timestamps, are summed up. To perform optimization, the old data in the aggregation column is summed up at the compaction stage, and only one value corresponding to their sum remains in the table.&lt;/p&gt;\n&lt;p&gt;Supported aggregate functions are: &lt;code&gt;sum&lt;/code&gt;, &lt;code&gt;min&lt;/code&gt;, &lt;code&gt;max&lt;/code&gt;, &lt;code&gt;first&lt;/code&gt; and &lt;code&gt;xdelta&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;The default setting is to overwrite what is in the table. To write a delta, specify the &lt;code&gt;aggregate=true&lt;/code&gt; option in the write command.&lt;/p&gt;\n&lt;h2 id=\"lookup_cache\"&gt;&lt;a href=\"en/user-guide/dynamic-tables/sorted-dynamic-tables.html#lookup_cache\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Row-by-row cache&lt;/span&gt;&lt;/a&gt;Row-by-row cache&lt;/h2&gt;\n&lt;p&gt;For point reads of rows (reading specific rows by their full keys) from a dynamic table, there's a lookup rows API call.&lt;/p&gt;\n&lt;p&gt;In a basic scenario, the table is stored on a disk (HDD, SSD, NVMe). Data read from disk or compressed by a codec (LZ, gzip, zstd) is measured in blocks. When reading blocks from disk, the data is cached at multiple levels: at the OS level and at the level of the YTsaurus node process. In the YTsaurus node process, blocks are cached in both compressed and uncompressed form.&lt;/p&gt;\n&lt;p&gt;In general, if the caches do not contain a block with a given key, the block is read from disk, transferred over the network, uncompressed, and then read according to the format of the table chunks (unversioned/versioned, scan/lookup). These operations may take a fair bit of time. Furthermore, this creates additional load on the disk, network, and CPU.&lt;/p&gt;\n&lt;p&gt;Usually, point reads only read a fairly small fraction of the data contained in a block (less than 1%). So if there are no blocks with your lookup keys, a large chunk of work in the cache of uncompressed blocks will go to waste.&lt;/p&gt;\n&lt;p&gt;In latency-critical scenarios involving reads by full keys from a dynamic table, the only option used to be to load the entire data into memory in uncompressed form (table attribute &lt;code&gt;@in_memory_mode=uncompressed&lt;/code&gt;). The downside of this approach is that it requires a lot of RAM when working with large tables.&lt;/p&gt;\n&lt;p&gt;A fairly common scenario involves working with a table that contains a certain limited amount of frequently read data. In other words, the probability of reads by any given key at any given time is not equal for all keys. If your table contains such a working set with hot data, you can use a lookup cache.&lt;/p&gt;\n&lt;p&gt;A lookup cache is an LRU cache that stores individual rows from the table. You could theoretically cache individual rows using a separate tool. For instance, memcached: you send a request to memcached, and if the data is not present in the cache, read it from YTsaurus, then add it to the cache.&lt;/p&gt;\n&lt;p&gt;The problem is that the table data can change at any time: a table row that is stored in the cache may at any given point of time be modified or deleted by a currently running transaction. For this reason, to ensure data consistency and isolation during reads, the cache must be synchronized with any data modifications in the table. And that is why the cache is integrated with YTsaurus.&lt;/p&gt;\n&lt;p&gt;To use the cache, make sure you do the following:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Request a quota for the &lt;code&gt;lookup_rows_cache&lt;/code&gt; memory category (similar to the &lt;code&gt;tablet_static&lt;/code&gt; quota for in-memory tables).&lt;/li&gt;\n&lt;li&gt;Set the &lt;code&gt;@lookup_cache_rows_ratio&lt;/code&gt; attribute for the tables. This attribute specifies the fraction of rows to be cached for each tablet. You can start at fractions of a percent (0.0005) and gradually increase the value all the way up to a few percent (0.03).&lt;/li&gt;\n&lt;li&gt;Set the &lt;code&gt;@enable_lookup_cache_by_default&lt;/code&gt; attribute for the table to &lt;code&gt;%true&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;Run the remount-table command.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Once this is done, all lookup queries to the table will be processed using the cache.&lt;/p&gt;\n&lt;p&gt;If you do not want to use the cache for some queries, you can specify the &lt;code&gt;use_lookup_cache&lt;/code&gt; option in the lookup rows query itself. This can be particularly useful if there's a background process that periodically modifies data across the entire table (performs a lookup followed by an insert). Using the cache for these lookups could otherwise cause data to be flushed from it. On the other hand, if this process only updates a small fraction of the table data, using the cache could be useful for all lookup queries, as this would speed up the execution of the periodic process.&lt;/p&gt;\n&lt;p&gt;By default, the &lt;code&gt;use_lookup_cache&lt;/code&gt; option is set to &lt;code&gt;null&lt;/code&gt;. If &lt;code&gt;use_lookup_cache&lt;/code&gt; is &lt;code&gt;null&lt;/code&gt;, the cache's usage is determined by the table's &lt;code&gt;@enable_lookup_cache_by_default&lt;/code&gt; attribute value (cache size must also be configured). If the passed &lt;code&gt;use_lookup_cache&lt;/code&gt; value is &lt;code&gt;true&lt;/code&gt; or &lt;code&gt;false&lt;/code&gt;, the cache's usage for the lookup query is determined by this option instead.&lt;/p&gt;\n&lt;p&gt;The &lt;code&gt;@lookup_cache_rows_per_tablet&lt;/code&gt; table attribute is deprecated, so we do not recommend using it. The problem with this attribute is that different tablets can contain different amounts of data. The cache's operation may not be efficient with fixed tablet sizes. Furthermore, a fixed cache size can often become suboptimal as sharding settings change and the table grows in size.&lt;/p&gt;\n&lt;p&gt;If you are using hunks, it may be beneficial to enable the lookup cache and set the &lt;code&gt;@in_memory_mode=uncompressed&lt;/code&gt; mode for the table. In this case, the in-memory data contains references to hunks. The amount of this data is typically not very large. The lookup cache allows storing hunks and reducing the frequency of disk reads and network consumption.&lt;/p&gt;\n&lt;h3 id=\"diagnostic-metrics-for-lookup-cache-performance\"&gt;&lt;a href=\"en/user-guide/dynamic-tables/sorted-dynamic-tables.html#diagnostic-metrics-for-lookup-cache-performance\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Diagnostic metrics for lookup cache performance&lt;/span&gt;&lt;/a&gt;Diagnostic metrics for lookup cache performance&lt;/h3&gt;\n&lt;p&gt;When the cache operates efficiently, the frequency of block reads from disk or from the block cache should gradually decrease.&lt;/p&gt;\n&lt;p&gt;Common lookup metrics include:&lt;/p&gt;\n&lt;p&gt;Metrics for disk reads and network transfers:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;yt.tablet_node.lookup.chunk_reader_statistics.data_bytes_read_from_disk.rate&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;yt.tablet_node.lookup.chunk_reader_statistics.data_bytes_read_from_cache.rate&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;yt.tablet_node.lookup.chunk_reader_statistics.data_bytes_transmitted.rate&lt;/code&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;If hunks are used:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;yt.tablet_node.lookup.hunks.chunk_reader_statistics.data_bytes_read_from_disk.rate&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;yt.tablet_node.lookup.hunks.chunk_reader_statistics.data_bytes_transmitted.rate&lt;/code&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Response time metric for lookup rows queries on a tablet node:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;yt.tablet_node.lookup.duration&lt;/code&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Lookup cache–specific metrics:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;yt.tablet_node.lookup.cache_hits.rate&lt;/code&gt;: Number of cache hits per second.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;yt.tablet_node.lookup.cache_misses.rate&lt;/code&gt;: Number of cache misses per second.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;yt.tablet_node.lookup.cache_inserts.rate&lt;/code&gt;: Number of cache inserts per second. This value may be different from \"cache_misses\" if the keys aren't anywhere in the table, or if the cache runs out of memory (&lt;code&gt;lookup_rows_cache&lt;/code&gt; memory categories). For the number of queried keys that are absent from the table, use the metric \"yt.tablet_node.lookup.missing_row_count.rate\". If the table is not loaded into memory, any attempts to read missing keys always result in queries to the disk. To prevent this, enable the key xor filter.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;yt.tablet_node.lookup.cache_outdated.rate&lt;/code&gt;: Number of keys per second that present in the cache but are outdated because the cache ran out of memory and could not update them in time. Once the cache reaches its memory quota (\"lookup_rows_cache\" memory category), it can no longer update existing rows. In this case, the old value remains cached but can no longer be read.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;As the cache is processed, the system performs garbage collection. The following metrics allow tracking the actual amount of memory being used.&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;yt.tablet_node.row_cache.slab_allocator.lookup.alive_items&lt;/code&gt;: Number of current allocations.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;yt.tablet_node.row_cache.slab_allocator.lookup.allocated_items.rate&lt;/code&gt;: Number of allocations per second.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;yt.tablet_node.row_cache.slab_allocator.lookup.freed_items.rate&lt;/code&gt;: Number of deallocations per second.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;yt.tablet_node.row_cache.slab_allocator.lookup.arena_size&lt;/code&gt;: Sizes of arenas (sets of allocations of the same size) in bytes.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;These metrics have a \"rank\" tag, which represents the allocation size in bytes: 16, 32, 48, 64, 96, 128, 192, 256, 384, 512, 768, 1022, 1536, 2048, 3072, 4096, 6144, 8192, 12288, 16384, 22576, 32768, large. \"Large\" is used for allocation sizes that are greater than 32768 bytes.&lt;/p&gt;\n&lt;h2 id=\"key_filter\"&gt;&lt;a href=\"en/user-guide/dynamic-tables/sorted-dynamic-tables.html#key_filter\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Filtering out non-existent keys&lt;/span&gt;&lt;/a&gt;Filtering out non-existent keys&lt;/h2&gt;\n&lt;p&gt;Often, tables have a load pattern where reads by non-existent keys make up a significant portion of all queries. To quickly identify that a key is absent from the table, dynamic tables implement a key filtering mechanism. This is achieved using a &lt;a href=\"https://arxiv.org/abs/1912.08258\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;xor filter&lt;/a&gt;, which functions similarly to the Bloom filter.&lt;/p&gt;\n&lt;p&gt;This filter can be useful in two scenarios:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;The lookup key is not present in the table.&lt;/li&gt;\n&lt;li&gt;The lookup key is rarely written to. In this case, we read all chunks within the partition, even though we already know that most of them don't have the key that we need.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Filtering is supported for lookup queries as well as for select queries that include a key prefix condition.&lt;/p&gt;\n&lt;h3 id=\"enabling-the-filter\"&gt;&lt;a href=\"en/user-guide/dynamic-tables/sorted-dynamic-tables.html#enabling-the-filter\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Enabling the filter&lt;/span&gt;&lt;/a&gt;Enabling the filter&lt;/h3&gt;\n&lt;p&gt;To enable filtering:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Allocate memory for the key filter block cache within the bundle (recommended value is 500 MB). You can do this yourself by navigating to the Edit Bundle -&amp;gt; Resources menu. For bundles that are still using the legacy resource model, use the &lt;a href=\"admin-guide/cluster-operations#ytdyncfgen\"&gt;dynamic node config&lt;/a&gt; to set the \"data_node/block_cache/xor_filter/capacity\" field value. This action is available to the cluster administrator.&lt;/li&gt;\n&lt;li&gt;Enable saving filters during write operations. To do this, set the &lt;code&gt;@chunk_writer/key_filter/enable = %true&lt;/code&gt; attribute for the table. If the table does not have the &lt;code&gt;@chunk_writer&lt;/code&gt; attribute, set it to &lt;code&gt;{key_filter={enable=%true}}&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;If you need filtering for select queries, use the &lt;code&gt;@chunk_writer/key_filter_prefix&lt;/code&gt; attribute to enable writes and specify the \"prefix_lengths\" parameter for this attribute.&lt;/li&gt;\n&lt;li&gt;Set &lt;code&gt;@mount_config/enable_key_filter_for_lookup = %true&lt;/code&gt;. This option enables filtering for both lookup and select queries.&lt;/li&gt;\n&lt;li&gt;Perform the remount-table command on the table.&lt;/li&gt;\n&lt;li&gt;To add the filter for all existing chunks, you can use &lt;a href=\"user-guide/dynamic-tables/compaction#forced_compaction\"&gt;forced compaction&lt;/a&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h3 id=\"filter-parameters\"&gt;&lt;a href=\"en/user-guide/dynamic-tables/sorted-dynamic-tables.html#filter-parameters\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Filter parameters&lt;/span&gt;&lt;/a&gt;Filter parameters&lt;/h3&gt;\n&lt;p&gt;Filter write parameters are specified in &lt;code&gt;@chunk_writer/key_filter&lt;/code&gt; for lookup queries and in &lt;code&gt;@chunk_writer/key_filter_prefix&lt;/code&gt; for select queries:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;enable: Whether a filter should be created for the chunk's blocks.&lt;/li&gt;\n&lt;li&gt;false_positive_rate: Percentage of incorrect filter responses (the filter did not filter out a key that was, in fact, missing). The default value is 1 / 256. The higher the precision, the more space the filter will take up.&lt;/li&gt;\n&lt;li&gt;bits_per_key: Number of bits that a single key takes up in the filter.&lt;/li&gt;\n&lt;li&gt;prefix_lengths: List of key prefix lengths for which the filter should be created. This parameter is only valid for &lt;code&gt;@chunk_writer/key_filter_prefix&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;You cannot set both \"false_positive_rate\" and \"bits_per_key\" at the same time. If \"false_positive_rate\" is set, the \"bits_per_key\" value is derived from it. We recommend using the \"false_positive_rate\" parameter.&lt;/p&gt;\n&lt;h3 id=\"diagnostic-metrics-for-filter-performance\"&gt;&lt;a href=\"en/user-guide/dynamic-tables/sorted-dynamic-tables.html#diagnostic-metrics-for-filter-performance\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Diagnostic metrics for filter performance&lt;/span&gt;&lt;/a&gt;Diagnostic metrics for filter performance&lt;/h3&gt;\n&lt;p&gt;When the filter is running efficiently, the number of block reads from disk or from the block cache should decrease.&lt;/p&gt;\n&lt;p&gt;To make monitoring the filter's performance easier, use the ready-made Key Filter (table-based) and Bundle UI Key Filter (bundle-based, available in the bundle interface) dashboards.&lt;/p&gt;\n&lt;h4 id=\"common-metrics\"&gt;&lt;a href=\"en/user-guide/dynamic-tables/sorted-dynamic-tables.html#common-metrics\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Common metrics&lt;/span&gt;&lt;/a&gt;Common metrics&lt;/h4&gt;\n&lt;p&gt;To determine whether you should enable filtering, it is useful to calculate the ratio of the total number of chunks where the key was looked up to the number of successfully read keys. We recommend that you consider enabling the filter if this ratio is greater than 3:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;yt.tablet_node.lookup.unmerged_missing_row_count.rate / yt.tablet_node.lookup.row_count.rate&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h4 id=\"metrics-for-lookup-operations\"&gt;&lt;a href=\"en/user-guide/dynamic-tables/sorted-dynamic-tables.html#metrics-for-lookup-operations\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Metrics for lookup operations&lt;/span&gt;&lt;/a&gt;Metrics for lookup operations&lt;/h4&gt;\n&lt;p&gt;Metrics for disk or cache reads:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;yt.tablet_node.lookup.chunk_reader_statistics.data_bytes_read_from_cache.rate: Number of bytes read by lookup queries from the block cache.&lt;/li&gt;\n&lt;li&gt;yt.tablet_node.lookup.chunk_reader_statistics.data_bytes_read_from_disk.rate: Number of bytes read by lookup queries from disk.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Filter-specific metrics:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;yt.tablet_node.lookup.key_filter.input_key_count.rate: Number of keys that the filter received as input.&lt;/li&gt;\n&lt;li&gt;yt.tablet_node.lookup.key_filter.filtered_out_key_count.rate: Number of keys filtered out by the filter.&lt;/li&gt;\n&lt;li&gt;yt.tablet_node.lookup.key_filter.false_positive_key_count.rate: Number of keys that were not filtered out by the filter, even though they did not actually exist.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h4 id=\"metrics-for-select-operations\"&gt;&lt;a href=\"en/user-guide/dynamic-tables/sorted-dynamic-tables.html#metrics-for-select-operations\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Metrics for select operations&lt;/span&gt;&lt;/a&gt;Metrics for select operations&lt;/h4&gt;\n&lt;p&gt;Metrics for disk or cache reads:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;yt.tablet_node.select.chunk_reader_statistics.data_bytes_read_from_cache.rate: Number of bytes read by select queries from the block cache.&lt;/li&gt;\n&lt;li&gt;yt.tablet_node.select.chunk_reader_statistics.data_bytes_read_from_disk.rate: Number of bytes read by select queries from disk.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Filter-specific metrics:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;yt.tablet_node.select.range_filter.input_range_count.rate: Number of ranges that the filter received as input.&lt;/li&gt;\n&lt;li&gt;yt.tablet_node.select.range_filter.filtered_out_range_count.rate: Number of ranges filtered out by the filter.&lt;/li&gt;\n&lt;li&gt;yt.tablet_node.select.range_filter.false_positive_range_count.rate: Number of ranges that were not filtered out by the filter, even though they did not actually exist.&lt;/li&gt;\n&lt;/ul&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"en/user-guide/dynamic-tables/sorted-dynamic-tables.md","sourcePath":"en/user-guide/dynamic-tables/sorted-dynamic-tables.md"},"headings":[{"title":"Data model","href":"en/user-guide/dynamic-tables/sorted-dynamic-tables.html#model","level":2},{"title":"Supported operations","href":"en/user-guide/dynamic-tables/sorted-dynamic-tables.html#methods","level":2,"items":[{"title":"Creating","href":"en/user-guide/dynamic-tables/sorted-dynamic-tables.html#creating","level":3},{"title":"Changing a table schema and type","href":"en/user-guide/dynamic-tables/sorted-dynamic-tables.html#changing-a-table-schema-and-type","level":3},{"title":"Reading rows","href":"en/user-guide/dynamic-tables/sorted-dynamic-tables.html#reading-rows","level":3},{"title":"Running a script","href":"en/user-guide/dynamic-tables/sorted-dynamic-tables.html#running-a-script","level":3},{"title":"Writing rows","href":"en/user-guide/dynamic-tables/sorted-dynamic-tables.html#insert_rows","level":3},{"title":"Deleting rows","href":"en/user-guide/dynamic-tables/sorted-dynamic-tables.html#deleting-rows","level":3},{"title":"Locking rows","href":"en/user-guide/dynamic-tables/sorted-dynamic-tables.html#locking-rows","level":3},{"title":"Deleting old data (TTL)","href":"en/user-guide/dynamic-tables/sorted-dynamic-tables.html#remove_old_data","level":3,"items":[{"title":"Row-level TTL","href":"en/user-guide/dynamic-tables/sorted-dynamic-tables.html#row-level-ttl","level":4}]}]},{"title":"Aggregation columns","href":"en/user-guide/dynamic-tables/sorted-dynamic-tables.html#aggr_columns","level":2},{"title":"Row-by-row cache","href":"en/user-guide/dynamic-tables/sorted-dynamic-tables.html#lookup_cache","level":2,"items":[{"title":"Diagnostic metrics for lookup cache performance","href":"en/user-guide/dynamic-tables/sorted-dynamic-tables.html#diagnostic-metrics-for-lookup-cache-performance","level":3}]},{"title":"Filtering out non-existent keys","href":"en/user-guide/dynamic-tables/sorted-dynamic-tables.html#key_filter","level":2,"items":[{"title":"Enabling the filter","href":"en/user-guide/dynamic-tables/sorted-dynamic-tables.html#enabling-the-filter","level":3},{"title":"Filter parameters","href":"en/user-guide/dynamic-tables/sorted-dynamic-tables.html#filter-parameters","level":3},{"title":"Diagnostic metrics for filter performance","href":"en/user-guide/dynamic-tables/sorted-dynamic-tables.html#diagnostic-metrics-for-filter-performance","level":3,"items":[{"title":"Common metrics","href":"en/user-guide/dynamic-tables/sorted-dynamic-tables.html#common-metrics","level":4},{"title":"Metrics for lookup operations","href":"en/user-guide/dynamic-tables/sorted-dynamic-tables.html#metrics-for-lookup-operations","level":4},{"title":"Metrics for select operations","href":"en/user-guide/dynamic-tables/sorted-dynamic-tables.html#metrics-for-select-operations","level":4}]}]}],"title":"Sorted dynamic tables"},"router":{"pathname":"en/user-guide/dynamic-tables/sorted-dynamic-tables","depth":4,"base":"../../../"},"lang":"en","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/en/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-a29ea7877730322f2ce693378d06d02ac2b374cd-en","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
