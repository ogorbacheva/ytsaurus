        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;This section describes an SQL language dialect that enables you to read and transform data on the system side.&lt;/p&gt;\n&lt;h2 id=\"overview\"&gt;&lt;a href=\"en/user-guide/dynamic-tables/dyn-query-language.html#overview\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Overview&lt;/span&gt;&lt;/a&gt;Overview&lt;/h2&gt;\n&lt;p&gt;This feature is supported only for dynamic tables.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Note&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;An SQL language dialect is not a full-fledged implementation of the SQL language. This query language should be considered an extended data-reading operation, allowing some of the data processing work to be done on the server side.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Attention!&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;The feature is not a replacement of MapReduce operations. The query execution engine has no scheduler, and specifying a heavy query with full scan can lead to cluster degradation. The YTsaurus service team is working to improve the reliability of processing large queries, but there are no plans to develop the described SQL language dialect as a replacement for MapReduce.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"examples\"&gt;&lt;a href=\"en/user-guide/dynamic-tables/dyn-query-language.html#examples\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Examples&lt;/span&gt;&lt;/a&gt;Examples&lt;/h2&gt;\n&lt;p&gt;Reading from the table:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;yt select-rows &lt;span class=\"hljs-string\"&gt;\"* FROM [//mytable] LIMIT 10\"&lt;/span&gt; --format json\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"35\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-35\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-35\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-35.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Counting the number of rows:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;yt select-rows &lt;span class=\"hljs-string\"&gt;\"SUM(1) FROM [//mytable] GROUP BY 1\"&lt;/span&gt; --format json\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"39\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-39\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-39\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-39.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Queries with grouping:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;yt select-rows &lt;span class=\"hljs-string\"&gt;\"day, MIN(price), MAX(price) FROM [//mytable] WHERE is_ok = 1 GROUP BY timestamp / 86400 AS day\"&lt;/span&gt; --format json\nyt select-rows &lt;span class=\"hljs-string\"&gt;\"item_id FROM [//mytable] WHERE (user_id, order_id) IN ((1, 1), (1, 2), (10, 10), (10, 11))\"&lt;/span&gt; --format json\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"43\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-43\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-43\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-43.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"query-syntax\"&gt;&lt;a href=\"en/user-guide/dynamic-tables/dyn-query-language.html#query-syntax\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Query syntax&lt;/span&gt;&lt;/a&gt;Query syntax&lt;/h2&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs sql\"&gt;&lt;span class=\"hljs-operator\"&gt;*&lt;/span&gt; &lt;span class=\"hljs-operator\"&gt;|&lt;/span&gt; &lt;span class=\"hljs-operator\"&gt;&amp;lt;&lt;/span&gt;&lt;span class=\"hljs-keyword\"&gt;select&lt;/span&gt;&lt;span class=\"hljs-operator\"&gt;-&lt;/span&gt;expr&lt;span class=\"hljs-number\"&gt;-1&lt;/span&gt;&lt;span class=\"hljs-operator\"&gt;&amp;gt;&lt;/span&gt; [&lt;span class=\"hljs-keyword\"&gt;AS&lt;/span&gt; &lt;span class=\"hljs-operator\"&gt;&amp;lt;&lt;/span&gt;&lt;span class=\"hljs-keyword\"&gt;select&lt;/span&gt;&lt;span class=\"hljs-operator\"&gt;-&lt;/span&gt;alias&lt;span class=\"hljs-number\"&gt;-1&lt;/span&gt;&lt;span class=\"hljs-operator\"&gt;&amp;gt;&lt;/span&gt;], &lt;span class=\"hljs-operator\"&gt;&amp;lt;&lt;/span&gt;&lt;span class=\"hljs-keyword\"&gt;select&lt;/span&gt;&lt;span class=\"hljs-operator\"&gt;-&lt;/span&gt;expr&lt;span class=\"hljs-number\"&gt;-2&lt;/span&gt;&lt;span class=\"hljs-operator\"&gt;&amp;gt;&lt;/span&gt; [&lt;span class=\"hljs-keyword\"&gt;AS&lt;/span&gt; &lt;span class=\"hljs-operator\"&gt;&amp;lt;&lt;/span&gt;&lt;span class=\"hljs-keyword\"&gt;select&lt;/span&gt;&lt;span class=\"hljs-operator\"&gt;-&lt;/span&gt;alias&lt;span class=\"hljs-number\"&gt;-2&lt;/span&gt;&lt;span class=\"hljs-operator\"&gt;&amp;gt;&lt;/span&gt;], ...\n&lt;span class=\"hljs-keyword\"&gt;FROM&lt;/span&gt; [&lt;span class=\"hljs-operator\"&gt;/&lt;/span&gt;&lt;span class=\"hljs-operator\"&gt;/&lt;/span&gt;path&lt;span class=\"hljs-operator\"&gt;/&lt;/span&gt;&lt;span class=\"hljs-keyword\"&gt;to&lt;/span&gt;&lt;span class=\"hljs-operator\"&gt;/&lt;/span&gt;&lt;span class=\"hljs-keyword\"&gt;table&lt;/span&gt;] [&lt;span class=\"hljs-keyword\"&gt;WITH&lt;/span&gt; INDEX [&lt;span class=\"hljs-operator\"&gt;/&lt;/span&gt;&lt;span class=\"hljs-operator\"&gt;/&lt;/span&gt;path&lt;span class=\"hljs-operator\"&gt;/&lt;/span&gt;&lt;span class=\"hljs-keyword\"&gt;to&lt;/span&gt;&lt;span class=\"hljs-operator\"&gt;/&lt;/span&gt;index&lt;span class=\"hljs-operator\"&gt;/&lt;/span&gt;&lt;span class=\"hljs-keyword\"&gt;table&lt;/span&gt;] [&lt;span class=\"hljs-keyword\"&gt;AS&lt;/span&gt;] &lt;span class=\"hljs-operator\"&gt;&amp;lt;&lt;/span&gt;index&lt;span class=\"hljs-operator\"&gt;-&lt;/span&gt;alias&lt;span class=\"hljs-operator\"&gt;&amp;gt;&lt;/span&gt;] [&lt;span class=\"hljs-keyword\"&gt;JOIN&lt;/span&gt; [&lt;span class=\"hljs-operator\"&gt;/&lt;/span&gt;&lt;span class=\"hljs-operator\"&gt;/&lt;/span&gt;path&lt;span class=\"hljs-operator\"&gt;/&lt;/span&gt;&lt;span class=\"hljs-keyword\"&gt;to&lt;/span&gt;&lt;span class=\"hljs-operator\"&gt;/&lt;/span&gt;rhs1] &lt;span class=\"hljs-keyword\"&gt;USING&lt;/span&gt; &lt;span class=\"hljs-operator\"&gt;&amp;lt;&lt;/span&gt;&lt;span class=\"hljs-keyword\"&gt;column&lt;/span&gt;&lt;span class=\"hljs-number\"&gt;-1&lt;/span&gt;&lt;span class=\"hljs-operator\"&gt;&amp;gt;&lt;/span&gt;, &lt;span class=\"hljs-operator\"&gt;&amp;lt;&lt;/span&gt;&lt;span class=\"hljs-keyword\"&gt;column&lt;/span&gt;&lt;span class=\"hljs-number\"&gt;-2&lt;/span&gt;&lt;span class=\"hljs-operator\"&gt;&amp;gt;&lt;/span&gt;, ...]\n[&lt;span class=\"hljs-keyword\"&gt;WHERE&lt;/span&gt; &lt;span class=\"hljs-operator\"&gt;&amp;lt;&lt;/span&gt;predicate&lt;span class=\"hljs-operator\"&gt;-&lt;/span&gt;expr&lt;span class=\"hljs-operator\"&gt;&amp;gt;&lt;/span&gt;]\n[&lt;span class=\"hljs-keyword\"&gt;GROUP&lt;/span&gt; &lt;span class=\"hljs-keyword\"&gt;BY&lt;/span&gt; &lt;span class=\"hljs-operator\"&gt;&amp;lt;&lt;/span&gt;&lt;span class=\"hljs-keyword\"&gt;group&lt;/span&gt;&lt;span class=\"hljs-operator\"&gt;-&lt;/span&gt;&lt;span class=\"hljs-keyword\"&gt;by&lt;/span&gt;&lt;span class=\"hljs-operator\"&gt;-&lt;/span&gt;expr&lt;span class=\"hljs-number\"&gt;-1&lt;/span&gt;&lt;span class=\"hljs-operator\"&gt;&amp;gt;&lt;/span&gt; [&lt;span class=\"hljs-keyword\"&gt;AS&lt;/span&gt; &lt;span class=\"hljs-operator\"&gt;&amp;lt;&lt;/span&gt;&lt;span class=\"hljs-keyword\"&gt;group&lt;/span&gt;&lt;span class=\"hljs-operator\"&gt;-&lt;/span&gt;&lt;span class=\"hljs-keyword\"&gt;by&lt;/span&gt;&lt;span class=\"hljs-operator\"&gt;-&lt;/span&gt;alias&lt;span class=\"hljs-number\"&gt;-1&lt;/span&gt;&lt;span class=\"hljs-operator\"&gt;&amp;gt;&lt;/span&gt;], &lt;span class=\"hljs-operator\"&gt;&amp;lt;&lt;/span&gt;&lt;span class=\"hljs-keyword\"&gt;group&lt;/span&gt;&lt;span class=\"hljs-operator\"&gt;-&lt;/span&gt;&lt;span class=\"hljs-keyword\"&gt;by&lt;/span&gt;&lt;span class=\"hljs-operator\"&gt;-&lt;/span&gt;expr&lt;span class=\"hljs-number\"&gt;-2&lt;/span&gt;&lt;span class=\"hljs-operator\"&gt;&amp;gt;&lt;/span&gt; [&lt;span class=\"hljs-keyword\"&gt;AS&lt;/span&gt; &lt;span class=\"hljs-operator\"&gt;&amp;lt;&lt;/span&gt;&lt;span class=\"hljs-keyword\"&gt;group&lt;/span&gt;&lt;span class=\"hljs-operator\"&gt;-&lt;/span&gt;&lt;span class=\"hljs-keyword\"&gt;by&lt;/span&gt;&lt;span class=\"hljs-operator\"&gt;-&lt;/span&gt;alias&lt;span class=\"hljs-number\"&gt;-2&lt;/span&gt;], ... [&lt;span class=\"hljs-keyword\"&gt;WITH&lt;/span&gt; TOTALS &lt;span class=\"hljs-keyword\"&gt;HAVING&lt;/span&gt; &lt;span class=\"hljs-operator\"&gt;&amp;lt;&lt;/span&gt;&lt;span class=\"hljs-keyword\"&gt;having&lt;/span&gt;&lt;span class=\"hljs-operator\"&gt;-&lt;/span&gt;expr&lt;span class=\"hljs-operator\"&gt;&amp;gt;&lt;/span&gt; &lt;span class=\"hljs-operator\"&gt;|&lt;/span&gt; &lt;span class=\"hljs-keyword\"&gt;HAVING&lt;/span&gt; &lt;span class=\"hljs-operator\"&gt;&amp;lt;&lt;/span&gt;&lt;span class=\"hljs-keyword\"&gt;having&lt;/span&gt;&lt;span class=\"hljs-operator\"&gt;-&lt;/span&gt;expr&lt;span class=\"hljs-operator\"&gt;&amp;gt;&lt;/span&gt; &lt;span class=\"hljs-keyword\"&gt;WITH&lt;/span&gt; TOTALS &lt;span class=\"hljs-operator\"&gt;|&lt;/span&gt; &lt;span class=\"hljs-keyword\"&gt;WITH&lt;/span&gt; TOTALS &lt;span class=\"hljs-operator\"&gt;|&lt;/span&gt; &lt;span class=\"hljs-keyword\"&gt;HAVING&lt;/span&gt; &lt;span class=\"hljs-operator\"&gt;&amp;lt;&lt;/span&gt;&lt;span class=\"hljs-keyword\"&gt;having&lt;/span&gt;&lt;span class=\"hljs-operator\"&gt;-&lt;/span&gt;expr&lt;span class=\"hljs-operator\"&gt;&amp;gt;&lt;/span&gt;]]\n[&lt;span class=\"hljs-keyword\"&gt;ORDER&lt;/span&gt; &lt;span class=\"hljs-keyword\"&gt;BY&lt;/span&gt; &lt;span class=\"hljs-operator\"&gt;&amp;lt;&lt;/span&gt;&lt;span class=\"hljs-keyword\"&gt;order&lt;/span&gt;&lt;span class=\"hljs-operator\"&gt;-&lt;/span&gt;&lt;span class=\"hljs-keyword\"&gt;by&lt;/span&gt;&lt;span class=\"hljs-operator\"&gt;-&lt;/span&gt;expr&lt;span class=\"hljs-number\"&gt;-1&lt;/span&gt;&lt;span class=\"hljs-operator\"&gt;&amp;gt;&lt;/span&gt; [&lt;span class=\"hljs-keyword\"&gt;ASC&lt;/span&gt;&lt;span class=\"hljs-operator\"&gt;|&lt;/span&gt;&lt;span class=\"hljs-keyword\"&gt;DESC&lt;/span&gt;], &lt;span class=\"hljs-operator\"&gt;&amp;lt;&lt;/span&gt;&lt;span class=\"hljs-keyword\"&gt;order&lt;/span&gt;&lt;span class=\"hljs-operator\"&gt;-&lt;/span&gt;&lt;span class=\"hljs-keyword\"&gt;by&lt;/span&gt;&lt;span class=\"hljs-operator\"&gt;-&lt;/span&gt;expr&lt;span class=\"hljs-number\"&gt;-2&lt;/span&gt;&lt;span class=\"hljs-operator\"&gt;&amp;gt;&lt;/span&gt; [&lt;span class=\"hljs-keyword\"&gt;ASC&lt;/span&gt;&lt;span class=\"hljs-operator\"&gt;|&lt;/span&gt;&lt;span class=\"hljs-keyword\"&gt;DESC&lt;/span&gt;], ...]\n[&lt;span class=\"hljs-keyword\"&gt;OFFSET&lt;/span&gt; &lt;span class=\"hljs-operator\"&gt;&amp;lt;&lt;/span&gt;n&lt;span class=\"hljs-operator\"&gt;&amp;gt;&lt;/span&gt;]\n[LIMIT &lt;span class=\"hljs-operator\"&gt;&amp;lt;&lt;/span&gt;m&lt;span class=\"hljs-operator\"&gt;&amp;gt;&lt;/span&gt;]\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"47\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-47\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-47\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-47.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;In general, the row order in the query output is not defined; however such guarantees are provided for &lt;a href=\"en/user-guide/dynamic-tables/dyn-query-language.html#order_by\"&gt;ORDER BY&lt;/a&gt; and &lt;a href=\"en/user-guide/dynamic-tables/dyn-query-language.html#limit\"&gt;LIMIT&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"select\"&gt;&lt;a href=\"en/user-guide/dynamic-tables/dyn-query-language.html#select\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;SELECT section&lt;/span&gt;&lt;/a&gt;SELECT section&lt;/h3&gt;\n&lt;p&gt;SELECT syntax:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs sql\"&gt;&lt;span class=\"hljs-operator\"&gt;*&lt;/span&gt; &lt;span class=\"hljs-operator\"&gt;|&lt;/span&gt; &lt;span class=\"hljs-operator\"&gt;&amp;lt;&lt;/span&gt;&lt;span class=\"hljs-keyword\"&gt;select&lt;/span&gt;&lt;span class=\"hljs-operator\"&gt;-&lt;/span&gt;expr&lt;span class=\"hljs-number\"&gt;-1&lt;/span&gt;&lt;span class=\"hljs-operator\"&gt;&amp;gt;&lt;/span&gt; [&lt;span class=\"hljs-keyword\"&gt;AS&lt;/span&gt; &lt;span class=\"hljs-operator\"&gt;&amp;lt;&lt;/span&gt;&lt;span class=\"hljs-keyword\"&gt;select&lt;/span&gt;&lt;span class=\"hljs-operator\"&gt;-&lt;/span&gt;alias&lt;span class=\"hljs-number\"&gt;-1&lt;/span&gt;&lt;span class=\"hljs-operator\"&gt;&amp;gt;&lt;/span&gt;], &lt;span class=\"hljs-operator\"&gt;&amp;lt;&lt;/span&gt;&lt;span class=\"hljs-keyword\"&gt;select&lt;/span&gt;&lt;span class=\"hljs-operator\"&gt;-&lt;/span&gt;expr&lt;span class=\"hljs-number\"&gt;-2&lt;/span&gt;&lt;span class=\"hljs-operator\"&gt;&amp;gt;&lt;/span&gt; [&lt;span class=\"hljs-keyword\"&gt;AS&lt;/span&gt; &lt;span class=\"hljs-operator\"&gt;&amp;lt;&lt;/span&gt;&lt;span class=\"hljs-keyword\"&gt;select&lt;/span&gt;&lt;span class=\"hljs-operator\"&gt;-&lt;/span&gt;alias&lt;span class=\"hljs-number\"&gt;-2&lt;/span&gt;&lt;span class=\"hljs-operator\"&gt;&amp;gt;&lt;/span&gt;], ...\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"57\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-57\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-57\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-57.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Defines the query output columns. If there's an asterisk (&lt;code&gt;*&lt;/code&gt;), all input columns of the main table will be used as output columns. Alternatively, you can specify random expressions for the calculation. For queries without grouping, all columns of the source tables can be in the expression. In case of queries with grouping, only the key columns used for grouping or aggregates can be in the expression.&lt;/p&gt;\n&lt;h3 id=\"from_join\"&gt;&lt;a href=\"en/user-guide/dynamic-tables/dyn-query-language.html#from_join\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;FROM section ... JOIN&lt;/span&gt;&lt;/a&gt;FROM section ... JOIN&lt;/h3&gt;\n&lt;p&gt;FROM syntax ... JOIN:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs sql\"&gt;&lt;span class=\"hljs-keyword\"&gt;FROM&lt;/span&gt; [&lt;span class=\"hljs-operator\"&gt;/&lt;/span&gt;&lt;span class=\"hljs-operator\"&gt;/&lt;/span&gt;path&lt;span class=\"hljs-operator\"&gt;/&lt;/span&gt;&lt;span class=\"hljs-keyword\"&gt;to&lt;/span&gt;&lt;span class=\"hljs-operator\"&gt;/&lt;/span&gt;&lt;span class=\"hljs-keyword\"&gt;table&lt;/span&gt;] [[&lt;span class=\"hljs-keyword\"&gt;AS&lt;/span&gt;] &lt;span class=\"hljs-operator\"&gt;&amp;lt;&lt;/span&gt;&lt;span class=\"hljs-keyword\"&gt;table&lt;/span&gt;&lt;span class=\"hljs-operator\"&gt;-&lt;/span&gt;alias&lt;span class=\"hljs-operator\"&gt;&amp;gt;&lt;/span&gt;] [&lt;span class=\"hljs-keyword\"&gt;WITH&lt;/span&gt; INDEX [&lt;span class=\"hljs-operator\"&gt;/&lt;/span&gt;&lt;span class=\"hljs-operator\"&gt;/&lt;/span&gt;path&lt;span class=\"hljs-operator\"&gt;/&lt;/span&gt;&lt;span class=\"hljs-keyword\"&gt;to&lt;/span&gt;&lt;span class=\"hljs-operator\"&gt;/&lt;/span&gt;index&lt;span class=\"hljs-operator\"&gt;/&lt;/span&gt;&lt;span class=\"hljs-keyword\"&gt;table&lt;/span&gt;] [&lt;span class=\"hljs-keyword\"&gt;AS&lt;/span&gt;] &lt;span class=\"hljs-operator\"&gt;&amp;lt;&lt;/span&gt;index&lt;span class=\"hljs-operator\"&gt;-&lt;/span&gt;alias&lt;span class=\"hljs-operator\"&gt;&amp;gt;&lt;/span&gt;] [[&lt;span class=\"hljs-keyword\"&gt;LEFT&lt;/span&gt;] &lt;span class=\"hljs-keyword\"&gt;JOIN&lt;/span&gt; [&lt;span class=\"hljs-operator\"&gt;/&lt;/span&gt;&lt;span class=\"hljs-operator\"&gt;/&lt;/span&gt;path&lt;span class=\"hljs-operator\"&gt;/&lt;/span&gt;&lt;span class=\"hljs-keyword\"&gt;to&lt;/span&gt;&lt;span class=\"hljs-operator\"&gt;/&lt;/span&gt;dict&lt;span class=\"hljs-number\"&gt;-1&lt;/span&gt;] [[&lt;span class=\"hljs-keyword\"&gt;AS&lt;/span&gt;] &lt;span class=\"hljs-operator\"&gt;&amp;lt;&lt;/span&gt;&lt;span class=\"hljs-keyword\"&gt;table&lt;/span&gt;&lt;span class=\"hljs-operator\"&gt;-&lt;/span&gt;alias&lt;span class=\"hljs-operator\"&gt;&amp;gt;&lt;/span&gt;] (&lt;span class=\"hljs-keyword\"&gt;ON&lt;/span&gt; &lt;span class=\"hljs-operator\"&gt;&amp;lt;&lt;/span&gt;expression&lt;span class=\"hljs-operator\"&gt;&amp;gt;&lt;/span&gt; &lt;span class=\"hljs-operator\"&gt;=&lt;/span&gt; &lt;span class=\"hljs-operator\"&gt;&amp;lt;&lt;/span&gt;&lt;span class=\"hljs-keyword\"&gt;foreign&lt;/span&gt;&lt;span class=\"hljs-operator\"&gt;-&lt;/span&gt;expression&lt;span class=\"hljs-operator\"&gt;&amp;gt;&lt;/span&gt; &lt;span class=\"hljs-operator\"&gt;|&lt;/span&gt; &lt;span class=\"hljs-keyword\"&gt;USING&lt;/span&gt; &lt;span class=\"hljs-operator\"&gt;&amp;lt;&lt;/span&gt;&lt;span class=\"hljs-keyword\"&gt;column&lt;/span&gt;&lt;span class=\"hljs-number\"&gt;-1&lt;/span&gt;&lt;span class=\"hljs-operator\"&gt;&amp;gt;&lt;/span&gt;, &lt;span class=\"hljs-operator\"&gt;&amp;lt;&lt;/span&gt;&lt;span class=\"hljs-keyword\"&gt;column&lt;/span&gt;&lt;span class=\"hljs-number\"&gt;-2&lt;/span&gt;&lt;span class=\"hljs-operator\"&gt;&amp;gt;&lt;/span&gt;, ...) [&lt;span class=\"hljs-keyword\"&gt;AND&lt;/span&gt; &lt;span class=\"hljs-operator\"&gt;&amp;lt;&lt;/span&gt;predicate&lt;span class=\"hljs-operator\"&gt;&amp;gt;&lt;/span&gt;]] ...\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"67\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-67\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-67\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-67.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Defines the query data sources. The table immediately following FROM is considered the primary table and is used when coordinating query execution (provided the query does not contain the WITH INDEX keyword). It is also allowable to specify auxiliary reference tables in the JOIN section. The reference tables are connected to the main table if the specified key matches exactly. Without specifying the LEFT keyword, INNER JOIN will be executed. You can additionally specify an expression for reference table filtering which will be executed when reading data before join with the main table is executed.&lt;/p&gt;\n&lt;p&gt;When the query contains the WITH INDEX keyword, the index table will be used for coordination, and the index table following FROM will be connected to it by common columns. See also &lt;a href=\"user-guide/dynamic-tables/secondary-indices\"&gt;secondary indexes&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;To combine tables across multiple columns, a tuple must be written in the ON condition.&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs sql\"&gt;&lt;span class=\"hljs-keyword\"&gt;FROM&lt;/span&gt; [&lt;span class=\"hljs-operator\"&gt;/&lt;/span&gt;&lt;span class=\"hljs-operator\"&gt;/&lt;/span&gt;x] &lt;span class=\"hljs-keyword\"&gt;AS&lt;/span&gt; x &lt;span class=\"hljs-keyword\"&gt;JOIN&lt;/span&gt; [&lt;span class=\"hljs-operator\"&gt;/&lt;/span&gt;&lt;span class=\"hljs-operator\"&gt;/&lt;/span&gt;y] &lt;span class=\"hljs-keyword\"&gt;AS&lt;/span&gt; y &lt;span class=\"hljs-keyword\"&gt;ON&lt;/span&gt; (x.a, x.b) &lt;span class=\"hljs-operator\"&gt;=&lt;/span&gt; (y.a, y.b)\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"77\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-77\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-77\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-77.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;It is allowed to write expressions in the JOIN condition:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs sql\"&gt;&lt;span class=\"hljs-keyword\"&gt;ON&lt;/span&gt; (if(is_null(x.a), &lt;span class=\"hljs-number\"&gt;0&lt;/span&gt;, x.a), x.b) &lt;span class=\"hljs-operator\"&gt;=&lt;/span&gt; (y.a, y.b)\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"81\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-81\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-81\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-81.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;For more information about JOINS, their features, and limitations, see the &lt;a href=\"en/user-guide/dynamic-tables/dyn-query-language.html#joins\"&gt;JOINS&lt;/a&gt; section.&lt;/p&gt;\n&lt;h3 id=\"where\"&gt;&lt;a href=\"en/user-guide/dynamic-tables/dyn-query-language.html#where\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;WHERE section&lt;/span&gt;&lt;/a&gt;WHERE section&lt;/h3&gt;\n&lt;p&gt;WHERE syntax:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs sql\"&gt;&lt;span class=\"hljs-keyword\"&gt;WHERE&lt;/span&gt; &lt;span class=\"hljs-operator\"&gt;&amp;lt;&lt;/span&gt;predicate&lt;span class=\"hljs-operator\"&gt;-&lt;/span&gt;expr&lt;span class=\"hljs-operator\"&gt;&amp;gt;&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"91\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-91\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-91\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-91.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Defines the primary data filter.&lt;/p&gt;\n&lt;h3 id=\"group_by\"&gt;&lt;a href=\"en/user-guide/dynamic-tables/dyn-query-language.html#group_by\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;GROUP BY section&lt;/span&gt;&lt;/a&gt;GROUP BY section&lt;/h3&gt;\n&lt;p&gt;GROUP BY syntax:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs sql\"&gt;&lt;span class=\"hljs-keyword\"&gt;GROUP&lt;/span&gt; &lt;span class=\"hljs-keyword\"&gt;BY&lt;/span&gt; &lt;span class=\"hljs-operator\"&gt;&amp;lt;&lt;/span&gt;&lt;span class=\"hljs-keyword\"&gt;group&lt;/span&gt;&lt;span class=\"hljs-operator\"&gt;-&lt;/span&gt;&lt;span class=\"hljs-keyword\"&gt;by&lt;/span&gt;&lt;span class=\"hljs-operator\"&gt;-&lt;/span&gt;expr&lt;span class=\"hljs-number\"&gt;-1&lt;/span&gt;&lt;span class=\"hljs-operator\"&gt;&amp;gt;&lt;/span&gt; [&lt;span class=\"hljs-keyword\"&gt;AS&lt;/span&gt; &lt;span class=\"hljs-operator\"&gt;&amp;lt;&lt;/span&gt;&lt;span class=\"hljs-keyword\"&gt;group&lt;/span&gt;&lt;span class=\"hljs-operator\"&gt;-&lt;/span&gt;&lt;span class=\"hljs-keyword\"&gt;by&lt;/span&gt;&lt;span class=\"hljs-operator\"&gt;-&lt;/span&gt;alias&lt;span class=\"hljs-number\"&gt;-1&lt;/span&gt;&lt;span class=\"hljs-operator\"&gt;&amp;gt;&lt;/span&gt;], &lt;span class=\"hljs-operator\"&gt;&amp;lt;&lt;/span&gt;&lt;span class=\"hljs-keyword\"&gt;group&lt;/span&gt;&lt;span class=\"hljs-operator\"&gt;-&lt;/span&gt;&lt;span class=\"hljs-keyword\"&gt;by&lt;/span&gt;&lt;span class=\"hljs-operator\"&gt;-&lt;/span&gt;expr&lt;span class=\"hljs-number\"&gt;-2&lt;/span&gt;&lt;span class=\"hljs-operator\"&gt;&amp;gt;&lt;/span&gt; [&lt;span class=\"hljs-keyword\"&gt;AS&lt;/span&gt; &lt;span class=\"hljs-operator\"&gt;&amp;lt;&lt;/span&gt;&lt;span class=\"hljs-keyword\"&gt;group&lt;/span&gt;&lt;span class=\"hljs-operator\"&gt;-&lt;/span&gt;&lt;span class=\"hljs-keyword\"&gt;by&lt;/span&gt;&lt;span class=\"hljs-operator\"&gt;-&lt;/span&gt;alias&lt;span class=\"hljs-number\"&gt;-2&lt;/span&gt;], ...\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"101\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-101\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-101\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-101.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Defines data grouping by key.&lt;/p&gt;\n&lt;h3 id=\"having\"&gt;&lt;a href=\"en/user-guide/dynamic-tables/dyn-query-language.html#having\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;HAVING section&lt;/span&gt;&lt;/a&gt;HAVING section&lt;/h3&gt;\n&lt;p&gt;HAVING syntax:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs sql\"&gt;&lt;span class=\"hljs-keyword\"&gt;HAVING&lt;/span&gt; &lt;span class=\"hljs-operator\"&gt;&amp;lt;&lt;/span&gt;predicate&lt;span class=\"hljs-operator\"&gt;-&lt;/span&gt;expr&lt;span class=\"hljs-operator\"&gt;&amp;gt;&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"111\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-111\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-111\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-111.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Defines the filtering condition after grouping.&lt;/p&gt;\n&lt;h3 id=\"with_totals\"&gt;&lt;a href=\"en/user-guide/dynamic-tables/dyn-query-language.html#with_totals\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;WITH TOTALS modifier&lt;/span&gt;&lt;/a&gt;WITH TOTALS modifier&lt;/h3&gt;\n&lt;p&gt;Used in conjunction with grouping and adds an extra row to the result, with &lt;code&gt;NULL&lt;/code&gt; values in the grouping keys and total aggregates by grouped data in the values. The row added by the summary aggregate is not processed in ORDER BY ... LIMIT. When the HAVING section is used, the final aggregates can be counted both before and after filtering. The order in which the rows with the resulting aggregates are arranged in the resulting row set is unspecified. The added row can be either the first or the last one. It can be distinguished by a &lt;code&gt;NULL&lt;/code&gt; key.&lt;/p&gt;\n&lt;p&gt;WITH TOTALS syntax:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs sql\"&gt;&lt;span class=\"hljs-keyword\"&gt;GROUP&lt;/span&gt; &lt;span class=\"hljs-keyword\"&gt;BY&lt;/span&gt; ... &lt;span class=\"hljs-keyword\"&gt;WITH&lt;/span&gt; TOTALS\n&lt;span class=\"hljs-keyword\"&gt;GROUP&lt;/span&gt; &lt;span class=\"hljs-keyword\"&gt;BY&lt;/span&gt; ... &lt;span class=\"hljs-keyword\"&gt;WITH&lt;/span&gt; TOTALS &lt;span class=\"hljs-keyword\"&gt;HAVING&lt;/span&gt; ...\n&lt;span class=\"hljs-keyword\"&gt;GROUP&lt;/span&gt; &lt;span class=\"hljs-keyword\"&gt;BY&lt;/span&gt; ... &lt;span class=\"hljs-keyword\"&gt;HAVING&lt;/span&gt; ... &lt;span class=\"hljs-keyword\"&gt;WITH&lt;/span&gt; TOTALS\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"124\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-124\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-124\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-124.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"order_by\"&gt;&lt;a href=\"en/user-guide/dynamic-tables/dyn-query-language.html#order_by\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;ORDER BY section&lt;/span&gt;&lt;/a&gt;ORDER BY section&lt;/h3&gt;\n&lt;p&gt;ORDER BY syntax:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs sql\"&gt;&lt;span class=\"hljs-keyword\"&gt;ORDER&lt;/span&gt; &lt;span class=\"hljs-keyword\"&gt;BY&lt;/span&gt; &lt;span class=\"hljs-operator\"&gt;&amp;lt;&lt;/span&gt;&lt;span class=\"hljs-keyword\"&gt;order&lt;/span&gt;&lt;span class=\"hljs-operator\"&gt;-&lt;/span&gt;&lt;span class=\"hljs-keyword\"&gt;by&lt;/span&gt;&lt;span class=\"hljs-operator\"&gt;-&lt;/span&gt;expr&lt;span class=\"hljs-number\"&gt;-1&lt;/span&gt;&lt;span class=\"hljs-operator\"&gt;&amp;gt;&lt;/span&gt; [&lt;span class=\"hljs-keyword\"&gt;ASC&lt;/span&gt;&lt;span class=\"hljs-operator\"&gt;|&lt;/span&gt;&lt;span class=\"hljs-keyword\"&gt;DESC&lt;/span&gt;], &lt;span class=\"hljs-operator\"&gt;&amp;lt;&lt;/span&gt;&lt;span class=\"hljs-keyword\"&gt;order&lt;/span&gt;&lt;span class=\"hljs-operator\"&gt;-&lt;/span&gt;&lt;span class=\"hljs-keyword\"&gt;by&lt;/span&gt;&lt;span class=\"hljs-operator\"&gt;-&lt;/span&gt;expr&lt;span class=\"hljs-number\"&gt;-2&lt;/span&gt;&lt;span class=\"hljs-operator\"&gt;&amp;gt;&lt;/span&gt; [&lt;span class=\"hljs-keyword\"&gt;ASC&lt;/span&gt;&lt;span class=\"hljs-operator\"&gt;|&lt;/span&gt;&lt;span class=\"hljs-keyword\"&gt;DESC&lt;/span&gt;], ...\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"131\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-131\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-131\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-131.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Defines the ordering of the output row set by the specified expressions. The default sorting order is ascending (ASC). The DESC keyword is specified for descending sorting. Sorting is applied after grouping, so only the key grouping columns or the counted aggregates can be in the expressions. The sorting is partial, i.e. only N smallest rows are returned as a result (the N parameter is specified in the LIMIT section).&lt;/p&gt;\n&lt;h3 id=\"offset\"&gt;&lt;a href=\"en/user-guide/dynamic-tables/dyn-query-language.html#offset\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;OFFSET section&lt;/span&gt;&lt;/a&gt;OFFSET section&lt;/h3&gt;\n&lt;p&gt;OFFSET syntax:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs sql\"&gt;&lt;span class=\"hljs-keyword\"&gt;OFFSET&lt;/span&gt; &lt;span class=\"hljs-operator\"&gt;&amp;lt;&lt;/span&gt;n&lt;span class=\"hljs-operator\"&gt;&amp;gt;&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"141\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-141\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-141\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-141.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Specifies the number of skipped rows from the output set of rows.&lt;/p&gt;\n&lt;p&gt;There can be no effective implementation of OFFSET in the query language under the current data storage schema. The OFFSET N LIMIT M query will read N + M rows. To implement this effectively, there must be an index from the row number to the key.&lt;br /&gt;\nThe proper way to perform paginated output is to make LIMIT queries, but instead of using OFFSET, remember the last key values (\"last_key = (key_column1, key_column2, ...)\") of the current query result and send the next query with the condition \"where (key_column1, key_column2, ...) &amp;gt; last_key\".&lt;/p&gt;\n&lt;h3 id=\"limit\"&gt;&lt;a href=\"en/user-guide/dynamic-tables/dyn-query-language.html#limit\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;LIMIT section&lt;/span&gt;&lt;/a&gt;LIMIT section&lt;/h3&gt;\n&lt;p&gt;LIMIT syntax&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs sql\"&gt;LIMIT &lt;span class=\"hljs-operator\"&gt;&amp;lt;&lt;/span&gt;m&lt;span class=\"hljs-operator\"&gt;&amp;gt;&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"154\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-154\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-154\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-154.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Defines the size of the output row set. If there is an ORDER BY section, it sets a limit on the size of the heap. Otherwise, it sets a limit on the order and amount of scanned data. If the query has a LIMIT section, the data is scanned sequentially by the primary key until the target size is reached. In this case, the order of output rows is defined unambiguously.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Note&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;When using grouping with a limit (without ORDER BY), the data will be read in the order of the primary table key.&lt;/p&gt;\n&lt;p&gt;If there are no aggregate columns, the query will end once the required set of grouped rows is accumulated. If there are aggregate columns, extra grouping will be performed for the keys accumulated in the number specified in LIMIT.&lt;/p&gt;\n&lt;p&gt;When using LIMIT without ORDER BY, please note that LIMIT will be applied to the previous operator. For example, if you use GROUP BY ... WITH TOTALS and LIMIT, then the final aggregates will be calculated from the data that fits within the limit. Data above the limit will not even be read. If ORDER BY is added, LIMIT will affect it and GROUP BY will process all read data. Respectively, TOTALS will be calculated from the larger data set.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"queries-with-pagination\"&gt;&lt;a href=\"en/user-guide/dynamic-tables/dyn-query-language.html#queries-with-pagination\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Queries with pagination&lt;/span&gt;&lt;/a&gt;Queries with pagination&lt;/h4&gt;\n&lt;p&gt;If you need to sequentially read a bigger part of the table, use pagination. Do not use queries with an ascending &lt;code&gt;OFFSET&lt;/code&gt; for pagination — this results in a quadratic table scan algorithm.&lt;/p&gt;\n&lt;p&gt;Queries with pagination should look like this:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs sql\"&gt;&lt;span class=\"hljs-keyword\"&gt;select&lt;/span&gt; k0, k1, k2\n&lt;span class=\"hljs-keyword\"&gt;from&lt;/span&gt; `&lt;span class=\"hljs-operator\"&gt;/&lt;/span&gt;&lt;span class=\"hljs-operator\"&gt;/&lt;/span&gt;t`\n&lt;span class=\"hljs-keyword\"&gt;where&lt;/span&gt; (k0, k1, k2) &lt;span class=\"hljs-operator\"&gt;&amp;gt;=&lt;/span&gt; (&lt;span class=\"hljs-number\"&gt;1&lt;/span&gt;, &lt;span class=\"hljs-number\"&gt;2&lt;/span&gt;, &lt;span class=\"hljs-number\"&gt;3&lt;/span&gt;)\n&lt;span class=\"hljs-keyword\"&gt;order&lt;/span&gt; &lt;span class=\"hljs-keyword\"&gt;by&lt;/span&gt; k0, k1, k2\nlimit &lt;span class=\"hljs-number\"&gt;10000&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"183\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-183\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-183\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-183.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Here, &lt;code&gt;k0, k1, k2&lt;/code&gt; is the primary table key.&lt;br /&gt;\nThe tuple &lt;code&gt;(1, 2, 3)&lt;/code&gt; is used as a cursor, and you need to update its value.&lt;br /&gt;\nUse &lt;code&gt;LIMIT&lt;/code&gt; to adjust the read volume.&lt;/p&gt;\n&lt;h2 id=\"expression_syntax\"&gt;&lt;a href=\"en/user-guide/dynamic-tables/dyn-query-language.html#expression_syntax\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Expression syntax&lt;/span&gt;&lt;/a&gt;Expression syntax&lt;/h2&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs sql\"&gt;&lt;span class=\"hljs-operator\"&gt;&amp;lt;&lt;/span&gt;literal&lt;span class=\"hljs-operator\"&gt;&amp;gt;&lt;/span&gt;\n&lt;span class=\"hljs-operator\"&gt;&amp;lt;&lt;/span&gt;identifier&lt;span class=\"hljs-operator\"&gt;&amp;gt;&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"190\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-190\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-190\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-190.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Arithmetic operators:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs sql\"&gt;&lt;span class=\"hljs-operator\"&gt;&amp;lt;&lt;/span&gt;expr&lt;span class=\"hljs-operator\"&gt;&amp;gt;&lt;/span&gt; &lt;span class=\"hljs-operator\"&gt;+&lt;/span&gt; &lt;span class=\"hljs-operator\"&gt;&amp;lt;&lt;/span&gt;expr&lt;span class=\"hljs-operator\"&gt;&amp;gt;&lt;/span&gt;\n&lt;span class=\"hljs-operator\"&gt;&amp;lt;&lt;/span&gt;expr&lt;span class=\"hljs-operator\"&gt;&amp;gt;&lt;/span&gt; &lt;span class=\"hljs-operator\"&gt;-&lt;/span&gt; &lt;span class=\"hljs-operator\"&gt;&amp;lt;&lt;/span&gt;expr&lt;span class=\"hljs-operator\"&gt;&amp;gt;&lt;/span&gt;\n&lt;span class=\"hljs-operator\"&gt;&amp;lt;&lt;/span&gt;expr&lt;span class=\"hljs-operator\"&gt;&amp;gt;&lt;/span&gt; &lt;span class=\"hljs-operator\"&gt;*&lt;/span&gt; &lt;span class=\"hljs-operator\"&gt;&amp;lt;&lt;/span&gt;expr&lt;span class=\"hljs-operator\"&gt;&amp;gt;&lt;/span&gt;\n&lt;span class=\"hljs-operator\"&gt;&amp;lt;&lt;/span&gt;expr&lt;span class=\"hljs-operator\"&gt;&amp;gt;&lt;/span&gt; &lt;span class=\"hljs-operator\"&gt;/&lt;/span&gt; &lt;span class=\"hljs-operator\"&gt;&amp;lt;&lt;/span&gt;expr&lt;span class=\"hljs-operator\"&gt;&amp;gt;&lt;/span&gt;\n&lt;span class=\"hljs-operator\"&gt;&amp;lt;&lt;/span&gt;expr&lt;span class=\"hljs-operator\"&gt;&amp;gt;&lt;/span&gt; &lt;span class=\"hljs-operator\"&gt;%&lt;/span&gt; &lt;span class=\"hljs-operator\"&gt;&amp;lt;&lt;/span&gt;expr&lt;span class=\"hljs-operator\"&gt;&amp;gt;&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"194\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-194\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-194\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-194.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Bitwise operators:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs sql\"&gt;&lt;span class=\"hljs-operator\"&gt;&amp;lt;&lt;/span&gt;expr&lt;span class=\"hljs-operator\"&gt;&amp;gt;&lt;/span&gt; &lt;span class=\"hljs-operator\"&gt;|&lt;/span&gt; &lt;span class=\"hljs-operator\"&gt;&amp;lt;&lt;/span&gt;expr&lt;span class=\"hljs-operator\"&gt;&amp;gt;&lt;/span&gt;\n&lt;span class=\"hljs-operator\"&gt;&amp;lt;&lt;/span&gt;expr&lt;span class=\"hljs-operator\"&gt;&amp;gt;&lt;/span&gt; &lt;span class=\"hljs-operator\"&gt;&amp;amp;&lt;/span&gt; &lt;span class=\"hljs-operator\"&gt;&amp;lt;&lt;/span&gt;expr&lt;span class=\"hljs-operator\"&gt;&amp;gt;&lt;/span&gt;\n&lt;span class=\"hljs-operator\"&gt;&amp;lt;&lt;/span&gt;expr&lt;span class=\"hljs-operator\"&gt;&amp;gt;&lt;/span&gt; &lt;span class=\"hljs-operator\"&gt;&amp;gt;&amp;gt;&lt;/span&gt; &lt;span class=\"hljs-operator\"&gt;&amp;lt;&lt;/span&gt;expr&lt;span class=\"hljs-operator\"&gt;&amp;gt;&lt;/span&gt;\n&lt;span class=\"hljs-operator\"&gt;&amp;lt;&lt;/span&gt;expr&lt;span class=\"hljs-operator\"&gt;&amp;gt;&lt;/span&gt; &lt;span class=\"hljs-operator\"&gt;&amp;lt;&amp;lt;&lt;/span&gt; &lt;span class=\"hljs-operator\"&gt;&amp;lt;&lt;/span&gt;expr&lt;span class=\"hljs-operator\"&gt;&amp;gt;&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"198\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-198\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-198\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-198.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Logical operators:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs sql\"&gt;&lt;span class=\"hljs-operator\"&gt;&amp;lt;&lt;/span&gt;expr&lt;span class=\"hljs-operator\"&gt;&amp;gt;&lt;/span&gt; &lt;span class=\"hljs-keyword\"&gt;AND&lt;/span&gt; &lt;span class=\"hljs-operator\"&gt;&amp;lt;&lt;/span&gt;expr&lt;span class=\"hljs-operator\"&gt;&amp;gt;&lt;/span&gt;\n&lt;span class=\"hljs-operator\"&gt;&amp;lt;&lt;/span&gt;expr&lt;span class=\"hljs-operator\"&gt;&amp;gt;&lt;/span&gt; &lt;span class=\"hljs-keyword\"&gt;OR&lt;/span&gt; &lt;span class=\"hljs-operator\"&gt;&amp;lt;&lt;/span&gt;expr&lt;span class=\"hljs-operator\"&gt;&amp;gt;&lt;/span&gt;\n&lt;span class=\"hljs-keyword\"&gt;NOT&lt;/span&gt; &lt;span class=\"hljs-operator\"&gt;&amp;lt;&lt;/span&gt;expr&lt;span class=\"hljs-operator\"&gt;&amp;gt;&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"202\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-202\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-202\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-202.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Comparison operators:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs sql\"&gt;&lt;span class=\"hljs-operator\"&gt;&amp;lt;&lt;/span&gt;expr&lt;span class=\"hljs-operator\"&gt;&amp;gt;&lt;/span&gt; &lt;span class=\"hljs-operator\"&gt;=&lt;/span&gt; &lt;span class=\"hljs-operator\"&gt;&amp;lt;&lt;/span&gt;expr&lt;span class=\"hljs-operator\"&gt;&amp;gt;&lt;/span&gt;\n&lt;span class=\"hljs-operator\"&gt;&amp;lt;&lt;/span&gt;expr&lt;span class=\"hljs-operator\"&gt;&amp;gt;&lt;/span&gt; &lt;span class=\"hljs-operator\"&gt;!=&lt;/span&gt; &lt;span class=\"hljs-operator\"&gt;&amp;lt;&lt;/span&gt;expr&lt;span class=\"hljs-operator\"&gt;&amp;gt;&lt;/span&gt;\n&lt;span class=\"hljs-operator\"&gt;&amp;lt;&lt;/span&gt;expr&lt;span class=\"hljs-operator\"&gt;&amp;gt;&lt;/span&gt; &lt;span class=\"hljs-operator\"&gt;&amp;lt;&lt;/span&gt; &lt;span class=\"hljs-operator\"&gt;&amp;lt;&lt;/span&gt;expr&lt;span class=\"hljs-operator\"&gt;&amp;gt;&lt;/span&gt;\n&lt;span class=\"hljs-operator\"&gt;&amp;lt;&lt;/span&gt;expr&lt;span class=\"hljs-operator\"&gt;&amp;gt;&lt;/span&gt; &lt;span class=\"hljs-operator\"&gt;&amp;lt;=&lt;/span&gt; &lt;span class=\"hljs-operator\"&gt;&amp;lt;&lt;/span&gt;expr&lt;span class=\"hljs-operator\"&gt;&amp;gt;&lt;/span&gt;\n&lt;span class=\"hljs-operator\"&gt;&amp;lt;&lt;/span&gt;expr&lt;span class=\"hljs-operator\"&gt;&amp;gt;&lt;/span&gt; &lt;span class=\"hljs-operator\"&gt;&amp;gt;&lt;/span&gt; &lt;span class=\"hljs-operator\"&gt;&amp;lt;&lt;/span&gt;expr&lt;span class=\"hljs-operator\"&gt;&amp;gt;&lt;/span&gt;\n&lt;span class=\"hljs-operator\"&gt;&amp;lt;&lt;/span&gt;expr&lt;span class=\"hljs-operator\"&gt;&amp;gt;&lt;/span&gt; &lt;span class=\"hljs-operator\"&gt;&amp;gt;=&lt;/span&gt; &lt;span class=\"hljs-operator\"&gt;&amp;lt;&lt;/span&gt;expr&lt;span class=\"hljs-operator\"&gt;&amp;gt;&lt;/span&gt;\n&lt;span class=\"hljs-operator\"&gt;&amp;lt;&lt;/span&gt;expr&lt;span class=\"hljs-operator\"&gt;&amp;gt;&lt;/span&gt; &lt;span class=\"hljs-keyword\"&gt;BETWEEN&lt;/span&gt; &lt;span class=\"hljs-operator\"&gt;&amp;lt;&lt;/span&gt;literal&lt;span class=\"hljs-operator\"&gt;&amp;gt;&lt;/span&gt; &lt;span class=\"hljs-keyword\"&gt;AND&lt;/span&gt; &lt;span class=\"hljs-operator\"&gt;&amp;lt;&lt;/span&gt;literal&lt;span class=\"hljs-operator\"&gt;&amp;gt;&lt;/span&gt;\n&lt;span class=\"hljs-operator\"&gt;&amp;lt;&lt;/span&gt;expr&lt;span class=\"hljs-operator\"&gt;&amp;gt;&lt;/span&gt; &lt;span class=\"hljs-keyword\"&gt;BETWEEN&lt;/span&gt; (&lt;span class=\"hljs-operator\"&gt;&amp;lt;&lt;/span&gt;literal&lt;span class=\"hljs-operator\"&gt;&amp;gt;&lt;/span&gt; &lt;span class=\"hljs-keyword\"&gt;AND&lt;/span&gt; &lt;span class=\"hljs-operator\"&gt;&amp;lt;&lt;/span&gt;literal&lt;span class=\"hljs-operator\"&gt;&amp;gt;&lt;/span&gt;, ...)\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"206\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-206\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-206\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-206.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;IN operator:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs sql\"&gt;&lt;span class=\"hljs-operator\"&gt;&amp;lt;&lt;/span&gt;expr&lt;span class=\"hljs-operator\"&gt;&amp;gt;&lt;/span&gt; &lt;span class=\"hljs-keyword\"&gt;IN&lt;/span&gt; (&lt;span class=\"hljs-operator\"&gt;&amp;lt;&lt;/span&gt;literal&lt;span class=\"hljs-operator\"&gt;&amp;gt;&lt;/span&gt;, ...)\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"210\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-210\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-210\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-210.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Functions:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs sql\"&gt;FN(&lt;span class=\"hljs-operator\"&gt;&amp;lt;&lt;/span&gt;expr&lt;span class=\"hljs-operator\"&gt;&amp;gt;&lt;/span&gt;, ...)\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"214\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-214\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-214\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-214.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Priorities:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;code&gt;unary + - ~&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;binary * / %&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;binary + -&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;binary &amp;gt;&amp;gt; &amp;lt;&amp;lt;&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;binary &amp;amp;&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;binary |&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;binary &amp;lt; &amp;lt;= &amp;gt; &amp;gt;= IN BETWEEN&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;binary =&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;unary NOT&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;binary AND&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;binary OR&lt;/code&gt;&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;Each expression has its type: &lt;code&gt;int64&lt;/code&gt;, &lt;code&gt;uint64&lt;/code&gt;, &lt;code&gt;boolean&lt;/code&gt;, &lt;code&gt;double&lt;/code&gt;, &lt;code&gt;string&lt;/code&gt;, or &lt;code&gt;any&lt;/code&gt;. The typification of expressions is strict. If a typification error occurs, query execution stops and an error is returned to the user.&lt;/p&gt;\n&lt;p&gt;Arithmetic operators take numeric types (&lt;code&gt;int64&lt;/code&gt;, &lt;code&gt;uint64&lt;/code&gt;, &lt;code&gt;double&lt;/code&gt;) as input and return a value of the same type.&lt;/p&gt;\n&lt;p&gt;Logical operators take and return values of the &lt;code&gt;boolean&lt;/code&gt; type.&lt;/p&gt;\n&lt;p&gt;Comparison operators, IN and BETWEEN operators take values of the same type as input and return values of the &lt;code&gt;boolean&lt;/code&gt; type. They also allow the use of tuples.&lt;/p&gt;\n&lt;p&gt;Tuple usage example:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs sql\"&gt;(a, b) &lt;span class=\"hljs-operator\"&gt;&amp;gt;=&lt;/span&gt; (valA, valB)\n(a, b) &lt;span class=\"hljs-keyword\"&gt;IN&lt;/span&gt; ((valA0, valB0), (valA1, valB1), ...)\n(a, b) &lt;span class=\"hljs-keyword\"&gt;BETWEEN&lt;/span&gt; ((&lt;span class=\"hljs-number\"&gt;16202224&lt;/span&gt;, &lt;span class=\"hljs-number\"&gt;1&lt;/span&gt;) &lt;span class=\"hljs-keyword\"&gt;AND&lt;/span&gt; (&lt;span class=\"hljs-number\"&gt;16202224&lt;/span&gt;, &lt;span class=\"hljs-number\"&gt;3&lt;/span&gt;), (&lt;span class=\"hljs-number\"&gt;2011740432&lt;/span&gt;, &lt;span class=\"hljs-number\"&gt;6&lt;/span&gt;) &lt;span class=\"hljs-keyword\"&gt;AND&lt;/span&gt; (&lt;span class=\"hljs-number\"&gt;2011740432&lt;/span&gt;), (&lt;span class=\"hljs-number\"&gt;591141536&lt;/span&gt;) &lt;span class=\"hljs-keyword\"&gt;AND&lt;/span&gt; (&lt;span class=\"hljs-number\"&gt;591141536&lt;/span&gt;, &lt;span class=\"hljs-number\"&gt;2&lt;/span&gt;), ...)\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"290\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-290\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-290\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-290.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Functions in expressions can be of two types: scalar applied to a tuple of values and aggregate applied to a group of input data corresponding to a single key. Scalar functions can be used in any expression. Aggregation functions can only be used in the SELECT section if there is a GROUP BY section.&lt;/p&gt;\n&lt;h3 id=\"identifiers\"&gt;&lt;a href=\"en/user-guide/dynamic-tables/dyn-query-language.html#identifiers\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;IDs&lt;/span&gt;&lt;/a&gt;IDs&lt;/h3&gt;\n&lt;p&gt;Column names containing special characters must be wrapped in square brackets.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Examples&lt;/strong&gt;: &lt;code&gt;t.[a.b], t.[c-1], t.[[d]] from [//path] as t&lt;/code&gt; where &lt;code&gt;a.b&lt;/code&gt;, &lt;code&gt;c-1&lt;/code&gt;, and &lt;code&gt;[d]&lt;/code&gt; are column names.&lt;br /&gt;\nIn the resulting schema, the square brackets in the column names will be omitted wherever possible.&lt;br /&gt;\nFor the &lt;code&gt;[my.column-1], [my+column-2] from ...&lt;/code&gt; query, the schema will be &lt;code&gt;\"my.column-1\", \"my+column-2\"&lt;/code&gt;.&lt;br /&gt;\nIf expressions without an alias (&lt;code&gt;AS name&lt;/code&gt;) are specified in the query, and the columns contain special characters, square brackets will be added.&lt;br /&gt;\nFor the &lt;code&gt;[my.column-1] + x, [my+column-2] from ...&lt;/code&gt; query, the schema will be &lt;code&gt;\"[my.column-1] + x\", \"my+column-2\"&lt;/code&gt;.&lt;/p&gt;\n&lt;h3 id=\"synonyms\"&gt;&lt;a href=\"en/user-guide/dynamic-tables/dyn-query-language.html#synonyms\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Synonyms&lt;/span&gt;&lt;/a&gt;Synonyms&lt;/h3&gt;\n&lt;p&gt;Expressions can be named using the AS keyword. Synonym support is implemented similarly to &lt;a href=\"https://clickhouse.yandex\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;ClickHouse&lt;/a&gt;. Unlike standard SQL, synonyms can be declared not only at the top level of expressions: &lt;code&gt;((1 as x) + x) as y&lt;/code&gt;. In addition, synonyms can be used in all query sections. &lt;strong&gt;For example&lt;/strong&gt;: &lt;code&gt;a from [...] group by x % 2 as a&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;This behavior is compatible with standard SQL as long as no synonyms are used that overlap the column names of the source tables.&lt;/p&gt;\n&lt;p&gt;The table shows an example of using synonyms for a table with the &lt;code&gt;UpdateTime&lt;/code&gt; column.&lt;/p&gt;\n&lt;p&gt;Synonym usage example:&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Expression&lt;/th&gt;\n&lt;th&gt;YTsaurus&lt;/th&gt;\n&lt;th&gt;In standard SQL&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;UpdateTime / 1000 as UpdateTime, UpdateTime as b&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;As a result, UpdateTime = b&lt;/td&gt;\n&lt;td&gt;As a result, UpdateTime != b&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;UpdateTime / 3600 % 24 as Hour from ... group by Hour&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Grouping will be by &lt;code&gt;UpdateTime / 3600 % 24&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Grouping will be by &lt;code&gt;UpdateTime / 3600 % 24&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;UpdateTime / 3600 % 24 as Hour where Hour = ...&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Filtering will be by &lt;code&gt;UpdateTime / 3600 % 24&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Filtering will be by &lt;code&gt;UpdateTime / 3600 % 24&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;UpdateTime / 1000 as UpdateTime where in (...)&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Filtering will be by &lt;code&gt;UpdateTime / 1000&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Filtering will be by the &lt;code&gt;UpdateTime&lt;/code&gt; source field&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;UpdateTime / 1000 as UpdateTime from ... group by UpdateTime&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Grouping will be by &lt;code&gt;UpdateTime / 1000&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Grouping will be by the &lt;code&gt;UpdateTime&lt;/code&gt; source field&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;UpdateTime from ... group by UpdateTime / 1000 as UpdateTime&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Grouping will be by &lt;code&gt;UpdateTime / 1000&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;AS is not supported within group by&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;max(UpdateTime) as UpdateTime where UpdateTime between ...&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;There will be an error because where cannot use an aggregate&lt;/td&gt;\n&lt;td&gt;Filtering will be by the &lt;code&gt;UpdateTime&lt;/code&gt; source field&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;h3 id=\"literals\"&gt;&lt;a href=\"en/user-guide/dynamic-tables/dyn-query-language.html#literals\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Literals&lt;/span&gt;&lt;/a&gt;Literals&lt;/h3&gt;\n&lt;p&gt;Expressions may contain literals that encode typified values.&lt;/p&gt;\n&lt;p&gt;To set numbers with a sign, decimal numbers are used (for example, &lt;code&gt;100,500&lt;/code&gt; or &lt;code&gt;42&lt;/code&gt;). To set numbers without a sign, decimal numbers with the &lt;code&gt;u&lt;/code&gt; suffix are used (for example, &lt;code&gt;100,500u&lt;/code&gt;, &lt;code&gt;42u&lt;/code&gt;).&lt;/p&gt;\n&lt;p&gt;Floating point numbers use a C-like decimal notation (for example, &lt;code&gt;3.1415926&lt;/code&gt;) with an integer and fractional part separator.&lt;/p&gt;\n&lt;p&gt;C-like string literals (like &lt;code&gt;\"hello\"&lt;/code&gt; or &lt;code&gt;\"world\"&lt;/code&gt;) are used to specify strings.&lt;/p&gt;\n&lt;h3 id=\"scalar-functions\"&gt;&lt;a href=\"en/user-guide/dynamic-tables/dyn-query-language.html#scalar-functions\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Scalar functions&lt;/span&gt;&lt;/a&gt;Scalar functions&lt;/h3&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Note&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Some functions are polymorphic: they can take values of several types. The signatures of such functions are described either using type variables (denoted by capital letters: &lt;code&gt;A&lt;/code&gt;, &lt;code&gt;B&lt;/code&gt;, ...), or using an explicit enumeration of taken types (denoted: &lt;code&gt;int64 | uint64&lt;/code&gt;).&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"general-functions\"&gt;&lt;a href=\"en/user-guide/dynamic-tables/dyn-query-language.html#general-functions\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;General functions&lt;/span&gt;&lt;/a&gt;General functions&lt;/h4&gt;\n&lt;p&gt;&lt;code&gt;if(cond, then, else) :: boolean -&amp;gt; A -&amp;gt; A -&amp;gt; A&lt;/code&gt;&lt;br /&gt;\nConditional operator. If the &lt;code&gt;cond&lt;/code&gt; expression is true, the function result is the &lt;code&gt;then&lt;/code&gt; value. Otherwise, it is &lt;code&gt;else&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;&lt;code&gt;is_null(x) :: A -&amp;gt; boolean&lt;/code&gt;&lt;br /&gt;\nChecks whether the specified value is &lt;code&gt;NULL&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;&lt;code&gt;is_finite(x) :: double -&amp;gt; boolean&lt;/code&gt;&lt;br /&gt;\nChecks whether the specified value is a finite floating point number (i.e. it isn't infinite or &lt;code&gt;NaN&lt;/code&gt;).&lt;/p&gt;\n&lt;p&gt;&lt;code&gt;is_nan(x) :: double -&amp;gt; boolean&lt;/code&gt;&lt;br /&gt;\nChecks whether the specified value is &lt;code&gt;NaN&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;&lt;code&gt;transform(a, (a1, a2, ...), (b1, b2, ...)) :: A -&amp;gt; List[A] -&amp;gt; List[B] -&amp;gt; B&lt;/code&gt;&lt;br /&gt;\n&lt;code&gt;transform[a2), ((a11, a12), ...), (v1, ...](a1,) :: Tuple -&amp;gt; List[Tuple] -&amp;gt; List[B] -&amp;gt; B&lt;/code&gt;&lt;br /&gt;\nConvert a value (or tuple) according to an explicit display of some elements on other elements.&lt;br /&gt;\nIf there is no corresponding value, &lt;code&gt;NULL&lt;/code&gt; is returned.&lt;br /&gt;\nThe complexity is constant.&lt;/p&gt;\n&lt;p&gt;&lt;code&gt;greatest(a1, a2, ...) :: A* -&amp;gt; A&lt;/code&gt;&lt;br /&gt;\nReturns the argument with the greatest value.&lt;/p&gt;\n&lt;h4 id=\"working-with-strings\"&gt;&lt;a href=\"en/user-guide/dynamic-tables/dyn-query-language.html#working-with-strings\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Working with strings&lt;/span&gt;&lt;/a&gt;Working with strings&lt;/h4&gt;\n&lt;p&gt;&lt;code&gt;length(s) :: string -&amp;gt; int64&lt;/code&gt;&lt;br /&gt;\nReturns the &lt;code&gt;s&lt;/code&gt; string length in bytes.&lt;/p&gt;\n&lt;p&gt;&lt;code&gt;is_substr(s, t) :: string -&amp;gt; string -&amp;gt; boolean&lt;/code&gt;&lt;br /&gt;\nChecks whether the &lt;code&gt;s&lt;/code&gt; string is the &lt;code&gt;t&lt;/code&gt; substring.&lt;/p&gt;\n&lt;p&gt;&lt;code&gt;is_prefix(p, t) :: string -&amp;gt; string -&amp;gt; boolean&lt;/code&gt;&lt;br /&gt;\nChecks whether the &lt;code&gt;p&lt;/code&gt; string is the &lt;code&gt;t&lt;/code&gt; prefix.&lt;/p&gt;\n&lt;p&gt;&lt;code&gt;lower(s) :: string -&amp;gt; string&lt;/code&gt;&lt;br /&gt;\nConverts the &lt;code&gt;s&lt;/code&gt; string to the lower case.&lt;/p&gt;\n&lt;p&gt;&lt;code&gt;concat(lhs, rhs) :: string -&amp;gt; string -&amp;gt; string&lt;/code&gt;&lt;br /&gt;\nConcatenates two strings.&lt;/p&gt;\n&lt;h4 id=\"accessing-containers\"&gt;&lt;a href=\"en/user-guide/dynamic-tables/dyn-query-language.html#accessing-containers\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Accessing containers&lt;/span&gt;&lt;/a&gt;Accessing containers&lt;/h4&gt;\n&lt;p&gt;If a table column has the &lt;code&gt;Composite&lt;/code&gt; data type, you can use the following syntax to access that column's fields:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;To access &lt;code&gt;struct&lt;/code&gt; fields, use a dot.&lt;/li&gt;\n&lt;li&gt;To access &lt;code&gt;tuple&lt;/code&gt; fields, use a dot. Indexing is &lt;strong&gt;zero-based&lt;/strong&gt;.&lt;/li&gt;\n&lt;li&gt;To access &lt;code&gt;dict&lt;/code&gt; fields, use square brackets.&lt;/li&gt;\n&lt;li&gt;To access &lt;code&gt;list&lt;/code&gt; fields, use square brackets. Indexing is &lt;strong&gt;zero-based&lt;/strong&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;The correctness of accessing struct and tuple fields is checked &lt;strong&gt;before starting&lt;/strong&gt; the query's execution. The correctness of accessing map and list fields is checked &lt;strong&gt;during&lt;/strong&gt; the query's execution.&lt;/p&gt;\n&lt;p&gt;To enable this syntax, make sure to set &lt;code&gt;syntax_version=2&lt;/code&gt; in the query parameters. Starting with this version of the syntax, strings are escaped with &lt;code&gt;backticks&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;To access containers, you need to specify the full column name, including the table alias.&lt;/p&gt;\n&lt;p&gt;Usage examples:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs sql\"&gt;t.struct.member,\nt.tuple&lt;span class=\"hljs-number\"&gt;.0&lt;/span&gt;,\nt.dict[\"key\"],\nt.list[&lt;span class=\"hljs-nu
