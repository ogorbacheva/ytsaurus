mber\"&gt;1&lt;/span&gt;&lt;span class=\"hljs-operator\"&gt;+&lt;/span&gt;&lt;span class=\"hljs-number\"&gt;1&lt;/span&gt;]\n&lt;span class=\"hljs-keyword\"&gt;from&lt;/span&gt; `&lt;span class=\"hljs-operator\"&gt;/&lt;/span&gt;&lt;span class=\"hljs-operator\"&gt;/&lt;/span&gt;tmp&lt;span class=\"hljs-operator\"&gt;/&lt;/span&gt;test` &lt;span class=\"hljs-keyword\"&gt;as&lt;/span&gt; t;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"519\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-519\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-519\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-519.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;$ yt create table &lt;span class=\"hljs-string\"&gt;'//tmp/test'&lt;/span&gt; --attributes &lt;span class=\"hljs-string\"&gt;'{dynamic=true; schema=&amp;lt;\"unique_keys\"=%true;\"strict\"=%true;&amp;gt;[{name=a;sort_order=ascending;type=int64;};{name=b;type_v3={type_name=struct;members=[{name=c;type={type_name=list;item=int64}}]}}]}'&lt;/span&gt;\n$ yt mount-table --path &lt;span class=\"hljs-string\"&gt;'//tmp/test'&lt;/span&gt;\n$ &lt;span class=\"hljs-built_in\"&gt;echo&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;'{a=0;b={c=[]}}'&lt;/span&gt; | yt insert-rows --table &lt;span class=\"hljs-string\"&gt;'//tmp/test'&lt;/span&gt; --format yson\n$ &lt;span class=\"hljs-built_in\"&gt;echo&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;'{a=1;b={c=[1;2;3]}}'&lt;/span&gt; | yt insert-rows --table &lt;span class=\"hljs-string\"&gt;'//tmp/test'&lt;/span&gt; --format yson\n$ &lt;span class=\"hljs-built_in\"&gt;echo&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;'{a=2;b={c=[4]}}'&lt;/span&gt; | yt insert-rows --table &lt;span class=\"hljs-string\"&gt;'//tmp/test'&lt;/span&gt; --format yson\n\n$ yt select-rows &lt;span class=\"hljs-string\"&gt;'t.b.c from `//tmp/test` as t'&lt;/span&gt; --syntax-version 2 --format json\n{&lt;span class=\"hljs-string\"&gt;\"t.b.c\"&lt;/span&gt;:[]}\n{&lt;span class=\"hljs-string\"&gt;\"t.b.c\"&lt;/span&gt;:[1,2,3]}\n{&lt;span class=\"hljs-string\"&gt;\"t.b.c\"&lt;/span&gt;:[4]}\n\n$ yt select-rows &lt;span class=\"hljs-string\"&gt;'t.b.c[0] from `//tmp/test` as t'&lt;/span&gt; --syntax-version 2 --format json\n{&lt;span class=\"hljs-string\"&gt;\"t.b.c[0]\"&lt;/span&gt;:null}\n{&lt;span class=\"hljs-string\"&gt;\"t.b.c[0]\"&lt;/span&gt;:1}\n{&lt;span class=\"hljs-string\"&gt;\"t.b.c[0]\"&lt;/span&gt;:4}\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"520\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-520\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-520\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-520.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h4 id=\"working-with-yson\"&gt;&lt;a href=\"en/user-guide/dynamic-tables/dyn-query-language.html#working-with-yson\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Working with YSON&lt;/span&gt;&lt;/a&gt;Working with &lt;a href=\"user-guide/storage/formats.html#yson\"&gt;YSON&lt;/a&gt;&lt;/h4&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Attention!&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;A fixed key order in dictionaries is not guaranteed, so comparisons and groupings may not behave as expected.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h5 id=\"extracting-data\"&gt;&lt;a href=\"en/user-guide/dynamic-tables/dyn-query-language.html#extracting-data\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Extracting data&lt;/span&gt;&lt;/a&gt;Extracting data&lt;/h5&gt;\n&lt;p&gt;The query language provides a set of functions for extracting data:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;try_get_int64&lt;/code&gt;, &lt;code&gt;get_int64&lt;/code&gt;, &lt;code&gt;try_get_uint64&lt;/code&gt;, &lt;code&gt;get_uint64&lt;/code&gt;, &lt;code&gt;try_get_double&lt;/code&gt;, &lt;code&gt;get_double&lt;/code&gt;, &lt;code&gt;try_get_boolean&lt;/code&gt;, &lt;code&gt;get_boolean&lt;/code&gt;, &lt;code&gt;try_get_string&lt;/code&gt;, &lt;code&gt;get_string&lt;/code&gt;, &lt;code&gt;try_get_any&lt;/code&gt;, &lt;code&gt;get_any&lt;/code&gt;&lt;br /&gt;\nThese functions take two arguments, &lt;code&gt;(yson, path)&lt;/code&gt;, where:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;yson&lt;/code&gt; is a value of the &lt;code&gt;any&lt;/code&gt; type that contains YSON.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;path&lt;/code&gt; is a string representing the path to the desired field in &lt;a href=\"user-guide/storage/ypath.html\"&gt;YPATH&lt;/a&gt; format.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;The version with the &lt;code&gt;try_&lt;/code&gt; prefix returns &lt;code&gt;NULL&lt;/code&gt; if there is no field of the desired type at the specified path. The version without &lt;code&gt;try_&lt;/code&gt; returns an error if the field is missing.&lt;/p&gt;\n&lt;p&gt;Example: For the table row &lt;code&gt;{column=&amp;lt;attr=4&amp;gt;{key3=2;k={k2=&amp;lt;b=7&amp;gt;3;k3=10};lst=&amp;lt;a=[1;{a=3};{b=7u}]&amp;gt;[0;1;&amp;lt;a={b=4}&amp;gt;2]}}&lt;/code&gt; &lt;code&gt;try_get_uint64(column, \"/lst/@a/2/b\")&lt;/code&gt; returns &lt;code&gt;7u&lt;/code&gt;.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;list_contains(list, value) :: any -&amp;gt; (string | int64 | uint64 | boolean) -&amp;gt; boolean&lt;/code&gt;&lt;br /&gt;\nSearches for &lt;code&gt;value&lt;/code&gt; in the &lt;code&gt;list&lt;/code&gt; YSON list of the &lt;code&gt;any&lt;/code&gt; type. The searched &lt;code&gt;value&lt;/code&gt; must have a scalar type. The list does not have to be homogeneous, meaning that it can contain values of different types. The comparison is type-sensitive.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;list_has_intersection(list, list) :: any -&amp;gt; any -&amp;gt; boolean&lt;/code&gt;&lt;br /&gt;\nTakes two YSON lists as input and returns &lt;code&gt;true&lt;/code&gt; if they contain at least one common element.&lt;br /&gt;\nThe lists must be homogeneous.&lt;br /&gt;\nThis function is supported on clusters version 24.2 or higher.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;any_to_yson_string(yson) :: any -&amp;gt; string&lt;/code&gt;&lt;br /&gt;\nConverts a value of the &lt;code&gt;any&lt;/code&gt; type into a string containing its text &lt;a href=\"user-guide/storage/yson.html\"&gt;YSON&lt;/a&gt; representation.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;yson_length(yson) :: any -&amp;gt; int64&lt;/code&gt;&lt;br /&gt;\nCalculates the number of elements in a list or map.&lt;/p&gt;\n&lt;/li&gt;\n&lt;/ol&gt;\n&lt;h5 id=\"generating-yson\"&gt;&lt;a href=\"en/user-guide/dynamic-tables/dyn-query-language.html#generating-yson\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Generating YSON&lt;/span&gt;&lt;/a&gt;Generating YSON&lt;/h5&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;code&gt;make_entity()&lt;/code&gt;. Example: &lt;code&gt;make_entity() -&amp;gt; #&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;make_map(args...)&lt;/code&gt;. Example: &lt;code&gt;make_map(\"a\", 1, \"b\", 2) -&amp;gt; {a=1;b=2}&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;make_list(args...)&lt;/code&gt;. Example: &lt;code&gt;make_list(\"a\", 1, 2, 3) -&amp;gt; [a;1;2;3]&lt;/code&gt;&lt;/li&gt;\n&lt;/ol&gt;\n&lt;h4 id=\"working-with-regular-expressions\"&gt;&lt;a href=\"en/user-guide/dynamic-tables/dyn-query-language.html#working-with-regular-expressions\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Working with regular expressions&lt;/span&gt;&lt;/a&gt;Working with regular expressions&lt;/h4&gt;\n&lt;p&gt;The &lt;a href=\"https://github.com/google/re2\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Google RE2&lt;/a&gt; library is used to work with regular expressions. The library operates in UTF-8 mode. The syntax of regular expressions is described on a separate &lt;a href=\"https://github.com/google/re2/wiki/Syntax\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;page&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;&lt;code&gt;regex_full_match(p, s) :: string -&amp;gt; string -&amp;gt; boolean&lt;/code&gt;&lt;br /&gt;\nChecks that the &lt;code&gt;s&lt;/code&gt; string matches the &lt;code&gt;p&lt;/code&gt; regular expression.&lt;/p&gt;\n&lt;p&gt;&lt;code&gt;regex_partial_match(p, s) :: string -&amp;gt; string -&amp;gt; boolean&lt;/code&gt;&lt;br /&gt;\nChecks that the &lt;code&gt;s&lt;/code&gt; string contains a substring that matches the &lt;code&gt;p&lt;/code&gt; regular expression.&lt;/p&gt;\n&lt;p&gt;&lt;code&gt;regex_replace_first(p, s, r) :: string -&amp;gt; string -&amp;gt; string -&amp;gt; string&lt;/code&gt;&lt;br /&gt;\nReplaces the first occurrence of the &lt;code&gt;p&lt;/code&gt; regular expression in the &lt;code&gt;s&lt;/code&gt; string with the &lt;code&gt;r&lt;/code&gt; string.&lt;/p&gt;\n&lt;p&gt;&lt;code&gt;regex_replace_all(p, s, r) :: string -&amp;gt; string -&amp;gt; string -&amp;gt; string&lt;/code&gt;&lt;br /&gt;\nReplaces all occurrences of the &lt;code&gt;p&lt;/code&gt; regular expression in the &lt;code&gt;s&lt;/code&gt; string with the &lt;code&gt;r&lt;/code&gt; string.&lt;/p&gt;\n&lt;p&gt;&lt;code&gt;regex_extract(p, s, r) :: string -&amp;gt; string -&amp;gt; string -&amp;gt; string&lt;/code&gt;&lt;br /&gt;\nEnables the substrings that match the &lt;code&gt;s&lt;/code&gt; regular expression to be extracted from the &lt;code&gt;s&lt;/code&gt; string and replaced &lt;code&gt;r&lt;/code&gt;.&lt;br /&gt;\nFor example, the result of the &lt;code&gt;regex_extract(\"([a-z]*)@(.*)\", \"email foo@bar.com\", \"\\\\1 at \\\\2\")&lt;/code&gt; expression will be &lt;code&gt;foo at bar.com&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;&lt;code&gt;regex_escape(p) :: string -&amp;gt; string&lt;/code&gt;&lt;br /&gt;\nShields special characters of the regular expression language in the &lt;code&gt;p&lt;/code&gt; string.&lt;/p&gt;\n&lt;h5 id=\"like-operator\"&gt;&lt;a href=\"en/user-guide/dynamic-tables/dyn-query-language.html#like-operator\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;LIKE operator&lt;/span&gt;&lt;/a&gt;LIKE operator&lt;/h5&gt;\n&lt;p&gt;The operator can be used as follows:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs sql\"&gt;&lt;span class=\"hljs-operator\"&gt;&amp;lt;&lt;/span&gt;string&lt;span class=\"hljs-operator\"&gt;&amp;gt;&lt;/span&gt; [&lt;span class=\"hljs-keyword\"&gt;not&lt;/span&gt;] &lt;span class=\"hljs-keyword\"&gt;like&lt;/span&gt; &lt;span class=\"hljs-operator\"&gt;&amp;lt;&lt;/span&gt;&lt;span class=\"hljs-keyword\"&gt;pattern&lt;/span&gt;&lt;span class=\"hljs-operator\"&gt;&amp;gt;&lt;/span&gt; [&lt;span class=\"hljs-keyword\"&gt;escape&lt;/span&gt; &lt;span class=\"hljs-operator\"&gt;&amp;lt;&lt;/span&gt;&lt;span class=\"hljs-keyword\"&gt;escape&lt;/span&gt;&lt;span class=\"hljs-operator\"&gt;-&lt;/span&gt;symbol&lt;span class=\"hljs-operator\"&gt;&amp;gt;&lt;/span&gt;]\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"635\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-635\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-635\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-635.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;The operator checks that the &lt;code&gt;string&lt;/code&gt; string matches the &lt;code&gt;pattern&lt;/code&gt; template.&lt;br /&gt;\nThe underscore (&lt;code&gt;_&lt;/code&gt;) in the template matches any character.&lt;br /&gt;\nThe percent sign (&lt;code&gt;%&lt;/code&gt;) matches any sequence of characters (including an empty sequence).&lt;br /&gt;\nTo literally use &lt;code&gt;_&lt;/code&gt; or &lt;code&gt;%&lt;/code&gt; in the template, you need to escape them using &lt;code&gt;escape-symbol&lt;/code&gt; (&lt;code&gt;\\&lt;/code&gt; by default).&lt;/p&gt;\n&lt;p&gt;If there is filtering by the primary key's string prefix in the query, &lt;code&gt;is_prefix&lt;/code&gt; should be used to make the range output work.&lt;/p&gt;\n&lt;p&gt;The &lt;code&gt;ilike&lt;/code&gt; construction is used for case-insensitive search: &lt;code&gt;'Abc' ilike 'abc'&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;In &lt;code&gt;rlike&lt;/code&gt; and &lt;code&gt;regex&lt;/code&gt; constructions, the &lt;code&gt;pattern&lt;/code&gt; template is set in &lt;a href=\"https://github.com/google/re2/wiki/Syntax\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;re2 syntax&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;Example:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs sql\"&gt;&lt;span class=\"hljs-string\"&gt;'abcdef'&lt;/span&gt; &lt;span class=\"hljs-keyword\"&gt;like&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;'a_c_%f'&lt;/span&gt;\n&lt;span class=\"hljs-string\"&gt;'q'&lt;/span&gt; &lt;span class=\"hljs-keyword\"&gt;not&lt;/span&gt; &lt;span class=\"hljs-keyword\"&gt;like&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;'x_'&lt;/span&gt; &lt;span class=\"hljs-keyword\"&gt;escape&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;'x'&lt;/span&gt;\n&lt;span class=\"hljs-string\"&gt;'Abc'&lt;/span&gt; ilike &lt;span class=\"hljs-string\"&gt;'abc'&lt;/span&gt;\n&lt;span class=\"hljs-string\"&gt;'a b'&lt;/span&gt; rlike &lt;span class=\"hljs-string\"&gt;'\\\\w+ b'&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"651\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-651\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-651\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-651.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h4 id=\"working-with-dates\"&gt;&lt;a href=\"en/user-guide/dynamic-tables/dyn-query-language.html#working-with-dates\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Working with dates&lt;/span&gt;&lt;/a&gt;Working with dates&lt;/h4&gt;\n&lt;p&gt;UTC timezone is used when rounding&lt;/p&gt;\n&lt;p&gt;&lt;code&gt;timestamp_floor_year(t) :: int64 -&amp;gt; int64&lt;/code&gt;&lt;br /&gt;\nGet the timestamp of the year (as of 0:00 on January 1) for the specified timestamp.&lt;/p&gt;\n&lt;p&gt;&lt;code&gt;timestamp_floor_month(t) :: int64 -&amp;gt; int64&lt;/code&gt;&lt;br /&gt;\nGet the timestamp of the month (as of 0:00 on the first day of the month) for the specified timestamp.&lt;/p&gt;\n&lt;p&gt;&lt;code&gt;timestamp_floor_week(t) :: int64 -&amp;gt; int64&lt;/code&gt;&lt;br /&gt;\nGet the timestamp of the week (as of 0:00 on Monday) for the specified timestamp.&lt;/p&gt;\n&lt;p&gt;&lt;code&gt;timestamp_floor_day(t) :: int64 -&amp;gt; int64&lt;/code&gt;&lt;br /&gt;\nGet the timestamp of the day (as of 0:00 at the start of the day) for the specified timestamp.&lt;/p&gt;\n&lt;p&gt;&lt;code&gt;timestamp_floor_hour(t) :: int64 -&amp;gt; int64&lt;/code&gt;&lt;br /&gt;\nGet the timestamp of the hour (0 min 0 sec at the start of the hour) for the specified timestamp.&lt;/p&gt;\n&lt;p&gt;&lt;code&gt;format_timestamp(t, format) :: int64 -&amp;gt; string -&amp;gt; string&lt;/code&gt;&lt;br /&gt;\nFormats the time specified in the timestamp according to the provided format string. Uses the same convention as &lt;code&gt;std::strftime&lt;/code&gt;.&lt;/p&gt;\n&lt;h4 id=\"hashing\"&gt;&lt;a href=\"en/user-guide/dynamic-tables/dyn-query-language.html#hashing\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Hashing&lt;/span&gt;&lt;/a&gt;Hashing&lt;/h4&gt;\n&lt;p&gt;&lt;code&gt;farm_hash(a1, a2, ...) :: (int64 | uint64 | boolean | string)* -&amp;gt; uint64&lt;/code&gt;&lt;br /&gt;\nCalculates &lt;a href=\"https://code.google.com/p/farmhash/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;FarmHash&lt;/a&gt; from the specified set of arguments.&lt;/p&gt;\n&lt;h4 id=\"converting-types\"&gt;&lt;a href=\"en/user-guide/dynamic-tables/dyn-query-language.html#converting-types\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Converting types&lt;/span&gt;&lt;/a&gt;Converting types&lt;/h4&gt;\n&lt;p&gt;&lt;code&gt;int64(x) :: any | int64 | uint64 | double -&amp;gt; int64&lt;/code&gt;&lt;br /&gt;\n&lt;code&gt;uint64(x) :: any | int64 | uint64 | double -&amp;gt; uint64&lt;/code&gt;&lt;br /&gt;\n&lt;code&gt;double(x) :: any | int64 | uint64 | double -&amp;gt; double&lt;/code&gt;&lt;br /&gt;\n&lt;code&gt;boolean(x) :: any -&amp;gt; boolean&lt;/code&gt;&lt;br /&gt;\n&lt;code&gt;string(x) :: any -&amp;gt; string&lt;/code&gt;&lt;br /&gt;\nConverts the &lt;code&gt;x&lt;/code&gt; numeric argument to the target type. Rounding and overflow rules are standard and C-like. Starting with version 25.2, attempting to convert a floating-point number into an integer type will throw an error if that number is outside the valid range of that integer type.&lt;/p&gt;\n&lt;p&gt;To convert a numeric type into a string, use this function:&lt;br /&gt;\n&lt;code&gt;numeric_to_string :: int64 | uint64 | double -&amp;gt; string&lt;/code&gt;&lt;/p&gt;\n&lt;p&gt;To convert a string into a number:&lt;br /&gt;\n&lt;code&gt;parse_int64 :: string -&amp;gt; int64&lt;/code&gt;&lt;br /&gt;\n&lt;code&gt;parse_uint64 :: string -&amp;gt; uint64&lt;/code&gt;&lt;br /&gt;\n&lt;code&gt;parse_double :: string -&amp;gt; double&lt;/code&gt;&lt;/p&gt;\n&lt;p&gt;Any type can be cast to &lt;code&gt;any&lt;/code&gt;:&lt;br /&gt;\n&lt;code&gt;to_any :: int64 | uint64 | double | boolean | string | any -&amp;gt; any&lt;/code&gt;&lt;/p&gt;\n&lt;p&gt;&lt;code&gt;yson_string_to_any :: string -&amp;gt; any&lt;/code&gt;&lt;br /&gt;\nParses, validates, and converts a string value into a value of the &lt;code&gt;any&lt;/code&gt; type.&lt;/p&gt;\n&lt;h4 id=\"null-value\"&gt;&lt;a href=\"en/user-guide/dynamic-tables/dyn-query-language.html#null-value\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;NULL value&lt;/span&gt;&lt;/a&gt;NULL value&lt;/h4&gt;\n&lt;p&gt;In most operators, using &lt;code&gt;NULL&lt;/code&gt; values in operands results in a &lt;code&gt;NULL&lt;/code&gt; value. Comparison operators have a different behavior. The result in them is always &lt;code&gt;boolean&lt;/code&gt;. This is to ensure that the behavior of comparison operations is the same both when ordering data in the table by key and when calculating expressions within a query. The need to compare with &lt;code&gt;NULL&lt;/code&gt; is due to the desire to make the order relation on the keys complete. &lt;code&gt;NULL&lt;/code&gt; is considered less than the other values.&lt;/p&gt;\n&lt;h3 id=\"aggregation_functions\"&gt;&lt;a href=\"en/user-guide/dynamic-tables/dyn-query-language.html#aggregation_functions\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Aggregation functions&lt;/span&gt;&lt;/a&gt;Aggregation functions&lt;/h3&gt;\n&lt;p&gt;The following aggregation functions are supported in the query language:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;sum(expr) :: A -&amp;gt; A&lt;/code&gt;: Calculates the sum.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;min/max(expr) :: A -&amp;gt; A&lt;/code&gt;: Calculates the minimum or maximum.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;avg(expr) :: int64 -&amp;gt; double&lt;/code&gt;: Calculates the average.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;cardinality(expr) :: int64 | uint64 | double | boolean | string -&amp;gt; uint64&lt;/code&gt;: Calculates the number of different elements using the &lt;a href=\"https://en.wikipedia.org/wiki/HyperLogLog\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;HyperLogLog&lt;/a&gt; algorithm.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;argmin/argmax(arg, expr) :: A -&amp;gt; int64 | uint64 | double | string | boolean -&amp;gt; A&lt;/code&gt;: Calculates the argument value at which the expression reaches the corresponding extreme value.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;first(expr) :: A -&amp;gt; A&lt;/code&gt;: Returns the first value of the group. During a sequential scan (when sorting by primary key), the function calculates the value of the first row in the group. If all aggregate functions in the query are &lt;code&gt;first&lt;/code&gt;, the engine stops the sequential scan as soon as it reaches the &lt;code&gt;LIMIT&lt;/code&gt; on unique group keys. For queries without a sequential scan, &lt;code&gt;first&lt;/code&gt; returns the value of any matching row.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"query_execution\"&gt;&lt;a href=\"en/user-guide/dynamic-tables/dyn-query-language.html#query_execution\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Executing a query&lt;/span&gt;&lt;/a&gt;Executing a query&lt;/h2&gt;\n&lt;p&gt;&lt;img src=\"images/query_execution.png\" alt=\"\" /&gt;&lt;/p&gt;\n&lt;p&gt;The query is executed on the cluster in a distributed way. The query execution process is conventionally divided into two phases: coordination and execution. During coordination, multiple cluster nodes are defined to execute the query, and during execution, the data is processed directly. A typical scenario involves a user-defined query being decomposed into multiple &lt;em&gt;execution fragments&lt;/em&gt; that are processed by cluster nodes. The final result is generated on the client by merging intermediate results received from cluster nodes.&lt;/p&gt;\n&lt;p&gt;There is an &lt;a href=\"en/user-guide/dynamic-tables/dyn-query-language.html#explain_query\"&gt;&lt;code&gt;explain_query&lt;/code&gt;&lt;/a&gt; command to display information about the query plan.&lt;/p&gt;\n&lt;h3 id=\"coordination\"&gt;&lt;a href=\"en/user-guide/dynamic-tables/dyn-query-language.html#coordination\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Coordination&lt;/span&gt;&lt;/a&gt;Coordination&lt;/h3&gt;\n&lt;p&gt;The process of splitting a query into multiple parallel execution fragments in order to distribute the load is called &lt;em&gt;coordination&lt;/em&gt;. Query coordination occurs both on the client and on the cluster nodes. The coordination process itself consists of the following steps:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;Defining the ranges of the source data.&lt;/li&gt;\n&lt;li&gt;Splitting the query to process parts of the input data independently.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;The input data for the query and its splitting options are determined by the structure of the main table specified in the query and the filtering predicate. Execution of queries on top of &lt;strong&gt;&lt;a href=\"user-guide/dynamic-tables/overview.html\"&gt;dynamic&lt;/a&gt;&lt;/strong&gt; (sorted and ordered) tables is currently supported.&lt;/p&gt;\n&lt;p&gt;When working with sorted dynamic tables, the data splitting is two-level: the table is initially split into &lt;em&gt;tablets&lt;/em&gt; and the query is sent to the machines serving the selected tablets, and then on each machine the tablet is further split into partitions to ensure concurrent execution within each machine. For more information about tablets, see &lt;a href=\"user-guide/dynamic-tables/overview.html\"&gt;Dynamic tables&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;In the process of coordination, the cluster nodes that contain the data needed to execute the query are selected. The initial query is split into execution fragments and sent to the selected nodes. On each node, query execution can be additionally paralleled if a large enough amount of data is affected. Concurrency of query execution on a single node is limited by the &lt;code&gt;max_subqueries&lt;/code&gt; query parameter and the number of threads allocated to query execution in the cluster node configuration.&lt;/p&gt;\n&lt;p&gt;When the query is split for parallel execution, the calculation of predicates (&lt;code&gt;WHERE&lt;/code&gt;), groupings (&lt;code&gt;GROUP BY&lt;/code&gt;), and sortings (&lt;code&gt;ORDER BY&lt;/code&gt;) shifts to occur as close as possible to the data read operation. Only a minimal number of essential operators remain on the coordinator. For example, if the splitting of the input data results in exactly one part, then the entire filtering and grouping will be performed by the subordinate node and the coordinator will do nothing with the data.&lt;/p&gt;\n&lt;h3 id=\"input_data_cut\"&gt;&lt;a href=\"en/user-guide/dynamic-tables/dyn-query-language.html#input_data_cut\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Cutting off input data&lt;/span&gt;&lt;/a&gt;Cutting off input data&lt;/h3&gt;\n&lt;p&gt;During coordination, the (&lt;code&gt;WHERE&lt;/code&gt;) filtering predicate is analyzed. Based on a set of key table columns and predicate conditions, the data read ranges are output.&lt;br /&gt;\nRange output can account for logical connectives (&lt;code&gt;AND&lt;/code&gt;, &lt;code&gt;OR&lt;/code&gt;, &lt;code&gt;NOT&lt;/code&gt;), comparison operators, &lt;code&gt;IN&lt;/code&gt; operator, &lt;code&gt;BETWEEN&lt;/code&gt; operator, and &lt;code&gt;is_prefix&lt;/code&gt; function. Once the ranges are output, some of the conditions from the predicate can be discarded if the conditions appear to always be true on the data read from the ranges.&lt;/p&gt;\n&lt;p&gt;The output ranges are a set of lower and upper read limits. The read limit is the prefix of the main table key.&lt;/p&gt;\n&lt;p&gt;If there are no computed columns in the table schema, the ranges are output as follows. The key columns are considered in their order in the schema as long as there are upper-level conditions in the predicate (connected by the &lt;code&gt;AND&lt;/code&gt;, &lt;code&gt;OR&lt;/code&gt;, and &lt;code&gt;NOT&lt;/code&gt; logical operators) that limit the values of these columns. Column conditions can be point (&lt;code&gt;=&lt;/code&gt; operator, &lt;code&gt;IN&lt;/code&gt; operator) and range ( &lt;code&gt;!=&lt;/code&gt;, &lt;code&gt;&amp;lt;&lt;/code&gt;, &lt;code&gt;&amp;lt;=&lt;/code&gt;, &lt;code&gt;&amp;gt;&lt;/code&gt;, &lt;code&gt;&amp;gt;=&lt;/code&gt;, &lt;code&gt;is_prefix&lt;/code&gt;). The resulting range is built as long as the point conditions are met and ends at the first range condition.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Examples:&lt;/strong&gt;&lt;/p&gt;\n&lt;p&gt;Let the table have key columns: &lt;code&gt;a, b, c&lt;/code&gt;.&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;For the &lt;code&gt;a = 1 and b in (3, 4)&lt;/code&gt; predicate, the following ranges will be output:\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;[[1, 3] .. [1, 3]], [[1, 4] .. [1, 4]]\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"809\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-809\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-809\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-809.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;/li&gt;\n&lt;li&gt;For the &lt;code&gt;a = 1 and b between 20 and 30 and c between 40 and 60&lt;/code&gt; predicate, the following range will be output:\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;[[1, 20] .. [1, 30]]\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"815\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-815\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-815\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-815.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;/li&gt;\n&lt;li&gt;For the &lt;code&gt;a = 1 and b = 2 and c between 40 and 60&lt;/code&gt; predicate, the following range will be output:\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;[[1, 2, 40] .. [1, 2, 60]]\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"821\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-821\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-821\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-821.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;/li&gt;\n&lt;li&gt;For the &lt;code&gt;a in (1, 2, 3) and b in (5, 6) and c between 40 and 60&lt;/code&gt; predicate, the following ranges will be output:\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;[[1, 5, 40] .. [1, 5, 60]], [[1, 6, 40] .. [1, 6, 60]], [[2, 5, 40] .. [2, 5, 60]], [[2, 6, 40] .. [2, 6, 60]], [[3, 5, 40] .. [3, 5, 60]], [[3, 6, 40] .. [3, 6, 60]]\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"827\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-827\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-827\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-827.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;/li&gt;\n&lt;li&gt;For the &lt;code&gt;a = 1 and b = 2 and c between 40 and 60 or a between 10 and 20&lt;/code&gt; predicate, the following ranges will be output:\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;[[1, 2, 40] .. [1, 2, 60]], [[10] .. [20]]\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"833\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-833\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-833\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-833.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;An important feature of the output ranges is that the lower and upper limits have a &lt;em&gt;common prefix&lt;/em&gt; and differ only by the last component.&lt;/p&gt;\n&lt;p&gt;If there are computed columns in the table schema, the ranges are first output without the computed columns and then are either supplemented with computed columns or trimmed to the first computed column that cannot be computed. For each range, the computed column can be computed when placing in the expression only the columns belonging to the common prefix of the lower and upper limit.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Examples:&lt;/strong&gt;&lt;/p&gt;\n&lt;p&gt;Let the table have key columns: &lt;code&gt;h = hash(a, b), a, b, c&lt;/code&gt;.&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;\n&lt;p&gt;For the &lt;code&gt;a = 1 and b in (3, 4)&lt;/code&gt; predicate, the following ranges will be output:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;[[hash(1, 3), 1, 3] .. [hash(1, 3), 1, 3]], [[hash(1, 4), 1, 4] .. [hash(1, 4), 1, 4]]\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"853\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-853\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-853\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-853.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;For the &lt;code&gt;a = in (1, 2)&lt;/code&gt; predicate, the range cannot be output, because the computed column depends not only on the &lt;code&gt;a&lt;/code&gt; column, but also on the &lt;code&gt;b&lt;/code&gt; column.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;Special consideration is given to the case when the computed column is an expression taken by the module: &lt;code&gt;h = hash(a, b) % 3, a, b, c&lt;/code&gt;. In that case, there is no need to compute the column value, because the set of values is already limited by the module. When the ranges are output, all possible values of the computed column with the expression taken by the module are considered. For the &lt;code&gt;a = in (1, 2)&lt;/code&gt; predicate, the following ranges will be output:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;[[0, 1] .. [0, 1]], [[0, 2] .. [0, 2]], [[1, 1] .. [1, 1]], [[1, 2] .. [1, 2]], [[2, 1] .. [2, 1]], [[2, 2] .. [2, 2]]\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"864\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-864\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-864\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-864.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;For the &lt;code&gt;a between 10 and 20&lt;/code&gt; predicate:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;[[0, 10] .. [0, 20]], [[1, 10] .. [1, 20]], [[2, 10] .. [2, 20]]\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"870\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-870\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-870\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-870.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;The number of output ranges is limited by the &lt;code&gt;range_expansion_limit&lt;/code&gt; option.&lt;/p&gt;\n&lt;p&gt;For efficient query execution, it is important to use the information from the primary table key as much as possible in order to cut off as much data as possible when coordinating the query.&lt;/p&gt;\n&lt;p&gt;If the ranges could not be output, the table is read as a whole. Such reading is called &lt;em&gt;full scan&lt;/em&gt;. A rather large table (triple digit gigabytes) cannot be read within the time limit (by default, &lt;code&gt;query_timeout&lt;/code&gt; is one minute) allocated for query execution. To prohibit &lt;em&gt;full scan&lt;/em&gt;, you can set the &lt;code&gt;allow_full_scan&lt;/code&gt; query option to &lt;code&gt;false&lt;/code&gt;.&lt;/p&gt;\n&lt;h3 id=\"joins\"&gt;&lt;a href=\"en/user-guide/dynamic-tables/dyn-query-language.html#joins\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;JOINS&lt;/span&gt;&lt;/a&gt;JOINS&lt;/h3&gt;\n&lt;p&gt;You can also specify additional reference tables in the query to compute the final response or for additional filtering. &lt;strong&gt;Only lookup joins&lt;/strong&gt; are currently supported, i.e. a JOIN execution schema where the master data handler explicitly queries the additional table by key.&lt;/p&gt;\n&lt;p&gt;In the query itself, this means that the condition for JOIN must contain such a set of key columns of the reference table that the ranges for reading the data can be derived from the limit on these columns. If JOIN cannot be executed using the reference table index, the \"Foreign table key is not used in the join clause\" error will be returned. To disable such behavior, use the &lt;code&gt;allow_join_without_index&lt;/code&gt; parameter.&lt;/p&gt;\n&lt;p&gt;In general, JOIN is executed as follows. On each cluster node, the data is read from the main table shard, accumulated in memory, and multiple JOIN keys for the reference table are computed. This is followed by a query to the reference table with the read ranges and optional predicate obtained based on the JOIN keys. Then JOIN is executed in memory, and execution continues as usual.&lt;/p&gt;\n&lt;p&gt;When using multiple JOINs in a query, it would take a lot of time to execute them consecutively. Individual JOINs are therefore grouped into sets that can be executed concurrently. So when a JOIN group is executed while reading data from the main table, a set of JOIN keys is built for each reference in the group. Next, queries to read data from references are sent concurrently, and, once the data is received, JOIN is executed, forming the resulting rows. The complete resulting set of rows is not materialized in memory, but as JOIN is executed, the rows are passed to the next operator (for example, grouping).&lt;/p&gt;\n&lt;p&gt;JOIN is executed in a special way when the master table and the reference table share a common key prefix to within a JOIN condition. In that case, the ranges for reading the reference table are already known before reading the main table during the coordination phase of the query. Therefore, the query to read the reference table is sent immediately after coordination.&lt;/p&gt;\n&lt;h2 id=\"query_debug\"&gt;&lt;a href=\"en/user-guide/dynamic-tables/dyn-query-language.html#query_debug\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Debugging a query&lt;/span&gt;&lt;/a&gt;Debugging a query&lt;/h2&gt;\n&lt;h3 id=\"execution_stat\"&gt;&lt;a href=\"en/user-guide/dynamic-tables/dyn-query-language.html#execution_stat\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Execution statistics&lt;/span&gt;&lt;/a&gt;Execution statistics&lt;/h3&gt;\n&lt;p&gt;You can specify the &lt;code&gt;--print-statistics&lt;/code&gt; option in the CLI. The statistics will be output as follows:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;{\n  \"incomplete_output\" = %false;\n  \"async_time\" = 20458u;\n  \"memory_usage\" = 0u;\n  \"inner_statistics\" = [\n    {\n      \"incomplete_output\" = %false;\n      \"async_time\" = 12098u;\n      \"memory_usage\" = 0u;\n      \"inner_statistics\" = [\n        {\n          \"incomplete_output\" = %false;\n          \"async_time\" = 4547u;\n          \"memory_usage\" = 0u;\n          \"sync_time\" = 23u;\n          \"codegen_time\" = 8u;\n          \"rows_read\" = 2164;\n          \"execute_time\" = 0u;\n          \"read_time\" = 13u;\n          \"incomplete_input\" = %false;\n          \"write_time\" = 0u;\n          \"rows_written\" = 2164;\n          \"data_weight_read\" = 77352;\n        };\n        ...\n      ];\n      \"codegen_time\" = 5u;\n      \"sync_time\" = 13u;\n      \"rows_read\" = 26908;\n      \"execute_time\" = 5u;\n      \"read_time\" = 0u;\n      \"incomplete_input\" = %false;\n      \"write_time\" = 0u;\n      \"rows_written\" = 26908;\n      \"data_weight_read\" = 1176824;\n    };\n    ...\n  ];\n  \"codegen_time\" = 11u;\n  \"sync_time\" = 64u;\n  \"rows_read\" = 188520;\n  \"execute_time\" = 16u;\n  \"read_time\" = 27u;\n  \"incomplete_input\" = %false;\n  \"write_time\" = 8u;\n  \"rows_written\" = 188520;\n  \"data_weight_read\" = 8245048;\n}\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"909\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-909\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-909\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-909.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;The statistics have a hierarchical structure and correspond to the query execution structure.&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;\n&lt;p&gt;The first level is aggregation on the coordinator (http or rpc proxy).&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;The second level is aggregation on nodes.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;The third level is node-level execution of a part of the subquery to the thread pool.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;rows_read&lt;/code&gt;: Number of rows read.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;data_weight_read&lt;/code&gt;: The amount of read data in bytes in uncompressed form.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;codegen_time&lt;/code&gt;: Code generation time. After the first code generation, the query template (query without literals) is cached.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;execute_time&lt;/code&gt;: Query execution time excluding read time (decoding data from the chunk format).&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;rows_read&lt;/code&gt;: Number of rows read.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;read_time&lt;/code&gt;: Synchronous read time.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;wait_on_ready_event_time&lt;/code&gt;: Reader data waiting time.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;async_time&lt;/code&gt;: Total waiting time. If it differs significantly from \"wait_on_ready_event_time\", this means that the query is waiting for the CPU to allocate time in the fair share scheduler.&lt;/p&gt;\n&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h3 id=\"explain_query\"&gt;&lt;a href=\"en/user-guide/dynamic-tables/dyn-query-language.html#explain_query\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;The explain-query command&lt;/span&gt;&lt;/a&gt;The explain-query command&lt;/h3&gt;\n&lt;p&gt;You can debug a query using the \"explain\" command. The command outputs the result in a structured form.&lt;br /&gt;\nExample:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;{\n    \"udf_registry_path\" = \"//sys/udfs\";\n    \"query\" = {\n        \"where_expression\" = \"((((oh.ff_status = ?) AND (o.fake_order_type = ?)) AND (NOT is_null(o.external_id))) AND (NOT is_null(oh.order_update_time))) AND (oh.id &amp;gt; ?)\";\n        \"is_ordered_scan\" = %false;\n        \"joins\" = [\n            [\n                {\n                    \"lookup_type\" = \"source ranges\";\n                    \"common_key_prefix\" = 0u;\n                    \"foreign_key_prefix\" = 1u;\n                };\n            ];\n        ];\n        \"common_prefix_with_primary_key\" = ...;\n        \"key_trie\" = \"(key0, { (0#0:0#&amp;lt;Max&amp;gt;] })\";\n        \"ranges\" = ...;\n    };\n    \"subqueries\" = {\n        // Part of the query to be executed on the nodes.\n    };\n    \"top_query\" = {\n        // Part of the query to be executed on the proxy.\n    };\n}\n\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"976\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-976\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-976\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-976.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;where_expression&lt;/code&gt;: Syntactic representation of the \"where\" condition from which read ranges are derived (&lt;code&gt;ranges&lt;/code&gt;).&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;is_ordered_scan&lt;/code&gt;: Defines whether the order of the table rows will be retained when reading the data. This mode may be needed when implementing pagination. If you need to read the entire set of rows that meet the WHERE condition (no LIMIT), it is faster to read concurrently without preserving the order of rows in the table.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;joins&lt;/code&gt;: Contains a list of join groups. Join within a group is executed concurrently for multiple tables.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;lookup_type&lt;/code&gt;: The way of specifying read ranges when executing join. Possible options: source ranges, prefix ranges, and IN clause. The source ranges mode is the most optimal one. In prefix ranges mode, join keys are copied. This occurs if the join condition contains expressions or table fields that are not a secondary table key prefix. In IN clause mode, join is executed as a subquery with an IN expression. This mode is used if the read ranges of the secondary table cannot be derived from the join condition. If there is an additional AND condition in join, an attempt is made to output the read ranges using both the join condition and the additional AND condition.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;common_key_prefix&lt;/code&gt;: The size of the common key prefix of the primary table and the secondary table.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;foreign_key_prefix&lt;/code&gt; The size of the secondary table's key prefix that is derived from the join condition.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;common_prefix_with_primary_key&lt;/code&gt;: The size of the table's primary key prefix contained in the grouping condition. This enables you not to make a common hash table for all keys (grouping keys with different prefixes cannot match). When using group by and order by concurrently, a non-zero common prefix with the primary key enables order by + limit computation to be transferred to the nodes and reduces the amount of data transferred to the proxy (coordinator).&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;ranges&lt;/code&gt;: A list of table read ranges obtained from the \"where\" condition.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;key_trie&lt;/code&gt;: An intermediate representation of the key column limits generated from the \"where\" condition. The read ranges (&lt;code&gt;ranges&lt;/code&gt;) are then derived from the key trie.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;top_query&lt;/code&gt;, &lt;code&gt;subqueries&lt;/code&gt;: Parts of the query running on different cluster nodes. To learn more, see &lt;a href=\"en/user-guide/dynamic-tables/dyn-query-language.html#query_execution\"&gt;Executing a query&lt;/a&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"extensions-and-settings\"&gt;&lt;a href=\"en/user-guide/dynamic-tables/dyn-query-language.html#extensions-and-settings\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Extensions and settings&lt;/span&gt;&lt;/a&gt;Extensions and settings&lt;/h2&gt;\n&lt;h3 id=\"query-complexity-limits-options\"&gt;&lt;a href=\"en/user-guide/dynamic-tables/dyn-query-language.html#query-complexity-limits-options\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Query complexity limits (Options)&lt;/span&gt;&lt;/a&gt;Query complexity limits (Options)&lt;/h3&gt;\n&lt;p&gt;Option in the driver configuration:&lt;br /&gt;\n&lt;code&gt;query_timeout&lt;/code&gt;&lt;/p&gt;\n&lt;p&gt;Options of individual queries:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;input_row_limit&lt;/code&gt;: The limit on the number of rows that are read on one cluster node in one thread.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;output_row_limit&lt;/code&gt;: The limit on the number of rows that are output on one cluster node in one thread. This value also limits the number of rows in grouping on one cluster node.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;range_expansion_limit&lt;/code&gt;: The maximum number of ranges that will be output from the WHERE condition.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;fail_on_incomplete_result&lt;/code&gt;: Defines the behavior in case of exceeding &lt;code&gt;input_row_limit&lt;/code&gt; or &lt;code&gt;output_row_limit&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;memory_limit_per_node&lt;/code&gt;: The limit on the amount of memory available to a query on one cluster node.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h3 id=\"named-parameters\"&gt;&lt;a href=\"en/user-guide/dynamic-tables/dyn-query-language.html#named-parameters\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Named parameters&lt;/span&gt;&lt;/a&gt;Named parameters&lt;/h3&gt;\n&lt;p&gt;You can use parameter placeholders in the query. Example:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs sql\"&gt;a &lt;span class=\"hljs-keyword\"&gt;from&lt;/span&gt; `&lt;span class=\"hljs-operator\"&gt;/&lt;/span&gt;&lt;span class=\"hljs-operator\"&gt;/&lt;/span&gt;t` &lt;span class=\"hljs-keyword\"&gt;where&lt;/span&gt; b &lt;span class=\"hljs-operator\"&gt;=&lt;/span&gt; {&lt;span class=\"hljs-keyword\"&gt;first&lt;/span&gt;} &lt;span class=\"hljs-keyword\"&gt;and&lt;/span&gt; (c, d) &lt;span class=\"hljs-operator\"&gt;&amp;gt;&lt;/span&gt; {&lt;span class=\"hljs-keyword\"&gt;second&lt;/span&gt;}\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"1074\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-1074\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-1074\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1074.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;The &lt;code&gt;first&lt;/code&gt; and &lt;code&gt;second&lt;/code&gt; parameters are set using a YSON map that can be specified in the &lt;code&gt;placeholder_values&lt;/code&gt; query parameter:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs python\"&gt;client.select_rows(\n  &lt;span class=\"hljs-string\"&gt;\"a from `//t` where b = {first} and (c, d) &amp;gt; {second}\"&lt;/span&gt;,\n  placeholder_values={&lt;span class=\"hljs-string\"&gt;'first'&lt;/span&gt;: &lt;span class=\"hljs-number\"&gt;1&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;'second'&lt;/span&gt;: [&lt;span class=\"hljs-number\"&gt;2&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;'b'&lt;/span&gt;]},\n)\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"1078\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-1078\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-1078\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1078.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"distributing-resources-between-queries\"&gt;&lt;a href=\"en/user-guide/dynamic-tables/dyn-query-language.html#distributing-resources-between-queries\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Distributing resources between queries&lt;/span&gt;&lt;/a&gt;Distributing resources between queries&lt;/h3&gt;\n&lt;p&gt;Queries are executed using a fair share CPU scheduler. Query scheduling is handled independently for each node. By default, an equal amount of CPU resources is allocated to all queries that are executed on the same node. This ensures that a node executing multiple heavy queries can perform a light query in a short and predictable amount of time. However, this does not protect you from scenarios where a cluster node gets overloaded with queries. In this case, the execution speed decreases proportionally to the number of concurrently executed queries. For example, a system user might initiate a large number of queries that will consume the bulk of the CPU. To address this scenario, the system supports a two-level fair share mechanism: besides distributing CPU resources between individual queries, it allows you to group queries together and distribute resources between these groups. You can group queries (for example, by user) by specifying a compute pool in the &lt;code&gt;execution_pool&lt;/code&gt; query parameter. Queries that share the same &lt;code&gt;execution_pool&lt;/code&gt; are grouped together. Each group is allocated its own share of resources. A group's resources are allocated between all individual queries within that group.&lt;br /&gt;\nBy default, each pool is assigned a weight of 1. To assign a different weight value, create a node with the pool's name in the &lt;code&gt;//sys/ql_pools&lt;/code&gt; directory, add the &lt;code&gt;@weight&lt;/code&gt; attribute for this node, and specify the &lt;code&gt;use&lt;/code&gt; permission for the group (user) in the ACL.&lt;br /&gt;\nBy default, queries are executed in the &lt;code&gt;default&lt;/code&gt; pool.&lt;/p&gt;\n\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"en/user-guide/dynamic-tables/dyn-query-language.md","sourcePath":"en/user-guide/dynamic-tables/dyn-query-language.md"},"headings":[{"title":"Overview","href":"en/user-guide/dynamic-tables/dyn-query-language.html#overview","level":2},{"title":"Examples","href":"en/user-guide/dynamic-tables/dyn-query-language.html#examples","level":2},{"title":"Query syntax","href":"en/user-guide/dynamic-tables/dyn-query-language.html#query-syntax","level":2,"items":[{"title":"SELECT section","href":"en/user-guide/dynamic-tables/dyn-query-language.html#select","level":3},{"title":"FROM section ... JOIN","href":"en/user-guide/dynamic-tables/dyn-query-language.html#from_join","level":3},{"title":"WHERE section","href":"en/user-guide/dynamic-tables/dyn-query-language.html#where","level":3},{"title":"GROUP BY section","href":"en/user-guide/dynamic-tables/dyn-query-language.html#group_by","level":3},{"title":"HAVING section","href":"en/user-guide/dynamic-tables/dyn-query-language.html#having","level":3},{"title":"WITH TOTALS modifier","href":"en/user-guide/dynamic-tables/dyn-query-language.html#with_totals","level":3},{"title":"ORDER BY section","href":"en
