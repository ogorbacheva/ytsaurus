        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;This section contains information about chunks — parts of a table or file that store data.&lt;/p&gt;\n&lt;h2 id=\"common\"&gt;&lt;a href=\"en/user-guide/storage/chunks.html#common\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;General information&lt;/span&gt;&lt;/a&gt;General information&lt;/h2&gt;\n&lt;p&gt;Data stored in &lt;a href=\"user-guide/storage/static-tables.html\"&gt;tables&lt;/a&gt;, &lt;a href=\"user-guide/storage/files.html\"&gt;files&lt;/a&gt;, and logs is split into parts that are called chunks. A chunk stores a continuous range of data.&lt;br /&gt;\nSpecifically, each chunk of the table contains a range of its rows.&lt;br /&gt;\nA chunk is an unmodifiable entity: once a chunk is created, the data in it cannot be changed.&lt;/p&gt;\n&lt;p&gt;The chunk data is physically stored on the cluster nodes. YTsaurus master servers monitor the location of the chunks and keep them in &lt;a href=\"user-guide/storage/replication.html\"&gt;replicated&lt;/a&gt; state.&lt;/p&gt;\n&lt;p&gt;YTsaurus master servers store only metadata. However, metadata has a significant size, so in order to limit the memory consumption by the master servers, the number of chunks available to the account is &lt;a href=\"user-guide/storage/quotas.html\"&gt;quoted&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"chunk-size\"&gt;&lt;a href=\"en/user-guide/storage/chunks.html#chunk-size\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Chunk size&lt;/span&gt;&lt;/a&gt;Chunk size&lt;/h3&gt;\n&lt;p&gt;Chunks are not monolithic, they consist of blocks so that you can read and write chunks in parts.&lt;br /&gt;\nBy default, static table blocks are 16 megabytes and dynamic table blocks are 256 kilobytes.&lt;/p&gt;\n&lt;p&gt;You can change the block size in the &lt;a href=\"user-guide/storage/io-configuration.html\"&gt;&lt;code&gt;table_writer&lt;/code&gt;&lt;/a&gt; settings, the &lt;code&gt;block_size&lt;/code&gt; attribute.&lt;/p&gt;\n&lt;p&gt;A chunk usually occupies hundreds of megabytes or several gigabytes on a cluster node.&lt;br /&gt;\nThe size of the chunks to be created can be configured via the &lt;a href=\"user-guide/storage/io-configuration.html\"&gt;&lt;code&gt;table_writer&lt;/code&gt;&lt;/a&gt; section, the &lt;code&gt;desired_chunk_size&lt;/code&gt; attribute.&lt;/p&gt;\n&lt;p&gt;We do not recommend making chunks too small. This leads to an increase in their number, which consumes the master server memory. Small chunks also slow down reading: the number of requests to the master and the disk that need to be made to read all the data increases.&lt;/p&gt;\n&lt;h3 id=\"reading\"&gt;&lt;a href=\"en/user-guide/storage/chunks.html#reading\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Reading data&lt;/span&gt;&lt;/a&gt;Reading data&lt;/h3&gt;\n&lt;p&gt;When the client calls the procedure for reading data from a static table, the following steps are performed on the proxy server:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;Getting a list of chunks that make up the table from the master server.&lt;/li&gt;\n&lt;li&gt;Getting a list of cluster nodes where chunk replicas are located from the master server.&lt;/li&gt;\n&lt;li&gt;Downloading data from cluster nodes and transmitting it to the client.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;h3 id=\"writing\"&gt;&lt;a href=\"en/user-guide/storage/chunks.html#writing\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Writing data&lt;/span&gt;&lt;/a&gt;Writing data&lt;/h3&gt;\n&lt;p&gt;Writing is performed in a similar way:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;Splitting the input data stream into parts.&lt;/li&gt;\n&lt;li&gt;Designing each part in the form of a chunk.&lt;/li&gt;\n&lt;li&gt;Transferring data to cluster nodes and binding it to a table.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;h2 id=\"optimize_for\"&gt;&lt;a href=\"en/user-guide/storage/chunks.html#optimize_for\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Chunk format&lt;/span&gt;&lt;/a&gt;Chunk format&lt;/h2&gt;\n&lt;p&gt;There are two chunk formats in YTsaurus: row-by-row and column-by-column.&lt;br /&gt;\nThe chunk format is determined by the &lt;code&gt;optimize_for&lt;/code&gt; parameter. For row-by-row format, &lt;code&gt;optimize_for&lt;/code&gt; has the &lt;code&gt;lookup&lt;/code&gt; value, for column-by-column format — the &lt;code&gt;scan&lt;/code&gt; value.&lt;/p&gt;\n&lt;h3 id=\"lines\"&gt;&lt;a href=\"en/user-guide/storage/chunks.html#lines\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Row-by-row format: optimize_for=lookup&lt;/span&gt;&lt;/a&gt;Row-by-row format: optimize_for=lookup&lt;/h3&gt;\n&lt;p&gt;In row-by-row format, each row is stored entirely in one block.&lt;br /&gt;\nThe row-by-row format is suitable for &lt;a href=\"user-guide/dynamic-tables/overview.html\"&gt;dynamic tables&lt;/a&gt; from which data is selected by key.&lt;/p&gt;\n&lt;h3 id=\"columns\"&gt;&lt;a href=\"en/user-guide/storage/chunks.html#columns\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Column-by-column format: optimize_for=scan&lt;/span&gt;&lt;/a&gt;Column-by-column format: optimize_for=scan&lt;/h3&gt;\n&lt;p&gt;The column-by-column format does not store information about the type next to each value and uses lightweight column compression techniques.&lt;br /&gt;\nBy default, the data of each column specified in the schema gets into a separate sequence of blocks within a chunk. This speeds up the reading of a small number of columns.&lt;/p&gt;\n&lt;p&gt;If you need to read one row or a small range of rows by key, you have to make as many disk accesses as there are columns in the table. To minimize disk accesses, you can use the &lt;code&gt;group&lt;/code&gt; attribute in the description of columns in the schema, which will allow you to store related data in one block. For more information, see the &lt;a href=\"user-guide/storage/static-schema.html\"&gt;Data schema&lt;/a&gt; section.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Note&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Using a column-by-column format without a schema makes no sense.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"format-example\"&gt;&lt;a href=\"en/user-guide/storage/chunks.html#format-example\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Example of specifying a format&lt;/span&gt;&lt;/a&gt;Example of specifying a format&lt;/h3&gt;\n&lt;p&gt;CLI&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;yt &lt;span class=\"hljs-built_in\"&gt;set&lt;/span&gt; //tmp/table/@optimize_for scan\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"113\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-113\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-113\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-113.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Setting the attribute affects only future chunks and does not convert tables (similar to setting the &lt;code&gt;@erasure_codec&lt;/code&gt; and &lt;code&gt;@compression_codec&lt;/code&gt; attributes).&lt;/p&gt;\n&lt;p&gt;To convert already written data into a new format, perform the Merge operation:&lt;/p&gt;\n&lt;p&gt;CLI&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;yt merge --mode ordered --src //tmp/table --dst //tmp/table --spec &lt;span class=\"hljs-string\"&gt;'{force_transform = %true}'&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"123\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-123\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-123\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-123.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;For &lt;strong&gt;dynamic tables&lt;/strong&gt;, this is solved by forced compaction. Before using it, make sure to read the article on &lt;a href=\"user-guide/dynamic-tables/compaction.html#forced_compaction\"&gt;Background compaction&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;Example of running the operation via the CLI:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;yt &lt;span class=\"hljs-built_in\"&gt;set&lt;/span&gt; //tmp/table/@forced_compaction_revision 1\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"130\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-130\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-130\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-130.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;In addition, for columnar &lt;strong&gt;dynamic tables&lt;/strong&gt;, note the &lt;code&gt;group&lt;/code&gt; attribute in the column schema. If your use case involves frequent lookups of table rows without column filtering, it is a good idea to set the same group for all columns. For more information about groups, see the documentation page on &lt;a href=\"user-guide/storage/static-schema.html#schema_overview\"&gt;table schemas&lt;/a&gt;.&lt;/p&gt;\n&lt;h2 id=\"attributes\"&gt;&lt;a href=\"en/user-guide/storage/chunks.html#attributes\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Chunk owners&lt;/span&gt;&lt;/a&gt;Chunk owners&lt;/h2&gt;\n&lt;p&gt;Cypress nodes consisting of chunks — tables, files, and logs — are called chunk owners.&lt;br /&gt;\nA set of chunks belonging to the chunk owners is organized as a tree-like data structure. The leaves in this structure are chunks, and the intermediate nodes are chunk lists (&lt;code&gt;chunk_list&lt;/code&gt;).&lt;/p&gt;\n&lt;p&gt;Besides the attributes inherent to all Cypress nodes, chunk owners have the following additional attributes:&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Name&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Type&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Description&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Mandatory&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;chunk_list_id&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;Guid&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Root chunk list ID.&lt;/td&gt;\n&lt;td&gt;Yes&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;chunk_ids&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;array&amp;lt;Guid&amp;gt;&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;List of IDs of all chunks.&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;chunk_count&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;int&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Number of chunks.&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;compression_statistics&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;CompressionStatistics&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Statistics on data sizes and the types of &lt;a href=\"user-guide/storage/compression.html\"&gt;compression codecs&lt;/a&gt; used.&lt;/td&gt;\n&lt;td&gt;Yes&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;erasure_statistics&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;ErasureStatistics&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Statistics on the types of used &lt;a href=\"user-guide/storage/replication.html\"&gt;erasure codecs&lt;/a&gt; and data sizes.&lt;/td&gt;\n&lt;td&gt;Yes&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;optimize_for_statistics&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;OptimizeForStatistics&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Statistics on the types of used &lt;a href=\"en/user-guide/storage/chunks.html#optimize_for\"&gt;chunk types&lt;/a&gt; (&lt;code&gt;optimize_for&lt;/code&gt;).&lt;/td&gt;\n&lt;td&gt;Yes&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;multicell_statistics&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;MulticellStatistics&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Statistics on the distribution of chunks on master servers.&lt;/td&gt;\n&lt;td&gt;Yes&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;uncompressed_data_size&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;int&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Total uncompressed data volume of all chunks (not including replication and erasure coding).&lt;/td&gt;\n&lt;td&gt;Yes&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;compressed_data_size&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;int&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Total compressed data volume of all chunks (not including replication and erasure coding).&lt;/td&gt;\n&lt;td&gt;Yes&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;compression_ratio&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;double&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Compression ratio, the ratio of compressed volume to uncompressed volume.&lt;/td&gt;\n&lt;td&gt;Yes&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;update_mode&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;string&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;The way to change data under a transaction: &lt;code&gt;none&lt;/code&gt;, &lt;code&gt;append&lt;/code&gt;, or &lt;code&gt;overwrite&lt;/code&gt;. For nodes outside a transaction, it is &lt;code&gt;none&lt;/code&gt;.&lt;/td&gt;\n&lt;td&gt;Yes&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;replication_factor&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;integer&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"user-guide/storage/replication.html\"&gt;Replication&lt;/a&gt; factor (equals 1 for erasure coding).&lt;/td&gt;\n&lt;td&gt;Yes&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;compression_codec&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;string&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"user-guide/storage/compression.html\"&gt;Compression codec&lt;/a&gt; name.&lt;/td&gt;\n&lt;td&gt;Yes&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;erasure_codec&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;string&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"user-guide/storage/replication.html\"&gt;Erasure codec&lt;/a&gt; name.&lt;/td&gt;\n&lt;td&gt;Yes&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;vital&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;bool&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Whether the chunks of this node are &lt;a href=\"en/user-guide/storage/chunks.html#vitality\"&gt;vital&lt;/a&gt;&lt;/td&gt;\n&lt;td&gt;No&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;media&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;Media&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Replication factors and other &lt;a href=\"user-guide/storage/media.html\"&gt;medium&lt;/a&gt; settings.&lt;/td&gt;\n&lt;td&gt;Yes&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;primary_medium&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;string&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"user-guide/storage/media.html#primary\"&gt;Primary medium&lt;/a&gt;.&lt;/td&gt;\n&lt;td&gt;Yes&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;h2 id=\"vitality\"&gt;&lt;a href=\"en/user-guide/storage/chunks.html#vitality\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Data vitality&lt;/span&gt;&lt;/a&gt;Data vitality&lt;/h2&gt;\n&lt;p&gt;The YTsaurus system divides chunks into two types: vital and non-vital. By default, data in the system is vital (the &lt;code&gt;vital&lt;/code&gt; attribute is &lt;code&gt;true&lt;/code&gt;) and its loss is a serious incident. Data loss can occur due to failure of cluster nodes.&lt;/p&gt;\n&lt;p&gt;Non-vital data is data whose loss is not critical. YTsaurus cluster settings are such that inaccessibility of non-vital chunks does not trigger monitorings and exploitation intervention. Typical examples of non-vital data are intermediate results of operations: the scheduler will notice losses and perform recomputation. For non-vital data, the &lt;code&gt;vital&lt;/code&gt; attribute is &lt;code&gt;false&lt;/code&gt;.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Note&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;The system does not consider chunks written without erasure coding and having a single replication factor to be vital.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Data may be lost when cluster nodes fail. To avoid this, three copies of data are stored in YTsaurus by default.&lt;br /&gt;\nHowever, if multiple hosts fail, the system may lose access to all copies. If computations were interrupted when vital data was lost, restart them.&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"en/user-guide/storage/chunks.md","sourcePath":"en/user-guide/storage/chunks.md"},"headings":[{"title":"General information","href":"en/user-guide/storage/chunks.html#common","level":2,"items":[{"title":"Chunk size","href":"en/user-guide/storage/chunks.html#chunk-size","level":3},{"title":"Reading data","href":"en/user-guide/storage/chunks.html#reading","level":3},{"title":"Writing data","href":"en/user-guide/storage/chunks.html#writing","level":3}]},{"title":"Chunk format","href":"en/user-guide/storage/chunks.html#optimize_for","level":2,"items":[{"title":"Row-by-row format: optimize_for=lookup","href":"en/user-guide/storage/chunks.html#lines","level":3},{"title":"Column-by-column format: optimize_for=scan","href":"en/user-guide/storage/chunks.html#columns","level":3},{"title":"Example of specifying a format","href":"en/user-guide/storage/chunks.html#format-example","level":3}]},{"title":"Chunk owners","href":"en/user-guide/storage/chunks.html#attributes","level":2},{"title":"Data vitality","href":"en/user-guide/storage/chunks.html#vitality","level":2}],"title":"Chunks"},"router":{"pathname":"en/user-guide/storage/chunks","depth":4,"base":"../../../"},"lang":"en","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/en/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-a29ea7877730322f2ce693378d06d02ac2b374cd-en","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
        </script>
