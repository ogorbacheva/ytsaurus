        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;This section describes Cypress, the meta information tree. Cypress contains various system information as well as indications of where user data is stored. This section includes three subsections describing a &lt;a href=\"en/user-guide/storage/cypress.html#description\"&gt;general tree view&lt;/a&gt;, &lt;a href=\"en/user-guide/storage/cypress.html#attributes\"&gt;Cypress node attributes&lt;/a&gt;, and &lt;a href=\"en/user-guide/storage/cypress.html#TTL\"&gt;TTL for Cypress nodes&lt;/a&gt;.&lt;/p&gt;\n&lt;h2 id=\"description\"&gt;&lt;a href=\"en/user-guide/storage/cypress.html#description\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;General tree view&lt;/span&gt;&lt;/a&gt;General tree view&lt;/h2&gt;\n&lt;p&gt;To a user, Cypress looks like a Linux &lt;a href=\"https://en.wikipedia.org/wiki/File_system\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;file system&lt;/a&gt; tree but with a number of significant differences. First, every tree node has an associated &lt;a href=\"user-guide/storage/attributes.html\"&gt;collection of attributes&lt;/a&gt;, including some user-defined ones. Second, the tree is &lt;a href=\"user-guide/storage/transactions.html\"&gt;transactional&lt;/a&gt;. Third, files and directories, as well as &lt;a href=\"user-guide/storage/objects.html\"&gt;other objects&lt;/a&gt;, can serve as Cypress nodes. Like a file system, Cypress supports an &lt;a href=\"user-guide/storage/access-control.html\"&gt;access control system&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;Cypress is rooted at &lt;code&gt;/&lt;/code&gt; which has &lt;strong&gt;map_node&lt;/strong&gt; type (that is, it's a directory). Cypress nodes are addressed using &lt;a href=\"user-guide/storage/ypath.html\"&gt;YPath&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;Example paths: &lt;code&gt;//tmp&lt;/code&gt; is the temporary directory, &lt;code&gt;//tmp/@&lt;/code&gt; is a pointer to the directory attributes, &lt;code&gt;//tmp/table/@type&lt;/code&gt; is the path to the &lt;code&gt;type&lt;/code&gt; attribute of the &lt;code&gt;//tmp/table&lt;/code&gt; node.&lt;/p&gt;\n&lt;p&gt;Using YPath, you can represent Cypress as follows:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;/\n  /home\n    /user1\n      /table\n        /@id\n        /@chunk_ids\n        /@type\n        ...\n      ...\n    /user2\n    ...\n  /tmp\n  /sys\n    /chunks\n      ...\n    ...\n  ...\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"18\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-18\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-18\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-18.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;You can manipulate Cypress via a &lt;a href=\"api/cli/cli.html\"&gt;CLI&lt;/a&gt;.&lt;/p&gt;\n&lt;h2 id=\"attributes\"&gt;&lt;a href=\"en/user-guide/storage/cypress.html#attributes\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Cypress node attributes&lt;/span&gt;&lt;/a&gt;Cypress node attributes&lt;/h2&gt;\n&lt;p&gt;In addition to attributes common to all objects, Cypress nodes have additional attributes listed in the table:&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Attribute&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Type&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Value&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;parent_id&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;string&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Parent node ID (none for the root)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;locks&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;array&amp;lt;Lock&amp;gt;&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"user-guide/storage/transactions.html\"&gt;List of locks&lt;/a&gt; taken out on a node&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;lock_mode&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;LockMode&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Current node &lt;a href=\"user-guide/storage/transactions.html\"&gt;lock mode&lt;/a&gt; (transaction-dependent)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;path&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;string&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Node absolute path&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;key&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;string&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Key to access this node in its parent folder (if the node is so nested)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;creation_time&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;DateTime&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Node &lt;a href=\"en/user-guide/storage/cypress.html#time_attributes\"&gt;create&lt;/a&gt; time&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;modification_time&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;DateTime&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Node &lt;a href=\"en/user-guide/storage/cypress.html#time_attributes\"&gt;most recent modification&lt;/a&gt; time&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;access_time&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;DateTime&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Node &lt;a href=\"en/user-guide/storage/cypress.html#time_attributes\"&gt;most recent access&lt;/a&gt; time&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;expiration_time&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;DateTime&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Time &lt;a href=\"en/user-guide/storage/cypress.html#TTL\"&gt;automatically to delete&lt;/a&gt; a node. Optional attribute&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;expiration_timeout&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;DateTime&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;A timeout for the &lt;a href=\"en/user-guide/storage/cypress.html#TTL\"&gt;automatic deletion&lt;/a&gt; of a node if it has not been accessed. Optional attribute&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;access_counter&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;integer&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Number of times a node has been accessed since being created&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;revision&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;integer&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Node &lt;a href=\"en/user-guide/storage/cypress.html#time_attributes\"&gt;revision&lt;/a&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;resource_usage&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;ClusterResources&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Cluster resources appropriated by a node&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;recursive_resource_usage&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;ClusterResources&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Cluster resources appropriated by a node and its entire subtree&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;account&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;string&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Account used to keep track of the resources being used by a specific node&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;annotation&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;string&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Human-readable &lt;a href=\"user-guide/storage/annotations.html\"&gt;summary description&lt;/a&gt; of an object&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Each node has its own attributes responsible for access control. Therefore, its attributes include &lt;code&gt;inherit_acl&lt;/code&gt;, &lt;code&gt;acl&lt;/code&gt;, and &lt;code&gt;owner&lt;/code&gt;. For more information, see &lt;a href=\"user-guide/storage/access-control.html\"&gt;Access control system&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"time_attributes\"&gt;&lt;a href=\"en/user-guide/storage/cypress.html#time_attributes\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Time attributes&lt;/span&gt;&lt;/a&gt;Time attributes&lt;/h3&gt;\n&lt;p&gt;The &lt;code&gt;creation_time&lt;/code&gt; attribute stores the node create time. The &lt;code&gt;modification_time&lt;/code&gt; attribute stores the time of the last update of the node and node attribute. &lt;code&gt;modification_time&lt;/code&gt; does not track child node updates, that is, &lt;code&gt;modification_time&lt;/code&gt; for &lt;code&gt;map_node&lt;/code&gt; does not change if there are changes somewhere deep in the tree.&lt;/p&gt;\n&lt;p&gt;When a node is created and every time a node is modified, the system updates its &lt;code&gt;revision&lt;/code&gt; attribute. It stores a non-negative integer. The revision number is guaranteed to increase in a strictly monotonous manner over time. You can use revisions to verify that a node has not updated. &lt;code&gt;revision&lt;/code&gt; updates together with &lt;code&gt;modification_time&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;The &lt;code&gt;access_time&lt;/code&gt; attribute stores the most recent node access time. Attribute access does not count. In addition, to improve performance, the system does not update this attribute for every access transaction but rather accumulates such transactions and updates &lt;code&gt;access_time&lt;/code&gt; approximately once per second.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Attention&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;In rare cases, an attribute may have been accessed without an &lt;code&gt;access_time&lt;/code&gt; update because of a master server fault.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Attention&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;The &lt;code&gt;modification_time&lt;/code&gt; and &lt;code&gt;access_time&lt;/code&gt; attributes for dynamic tables currently do not carry any useful information. Their updates (or lack thereof) are independent of user-initiated read and write operations. This behavior may change in the future.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Most commands used for reads and writes include the &lt;code&gt;suppress_access_tracking&lt;/code&gt; and the &lt;code&gt;suppress_modification_tracking&lt;/code&gt; options that disable &lt;code&gt;access_time&lt;/code&gt;, &lt;code&gt;modification_time&lt;/code&gt;, and &lt;code&gt;revision&lt;/code&gt; updates, respectively. for reading and writing. In particular, the web interface uses &lt;code&gt;suppress_access_tracking&lt;/code&gt;, so viewing the contents via the web UI doesn't trigger &lt;code&gt;access_time&lt;/code&gt; updates.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Note&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;In the event that a transaction creates or modifies a node, the above attributes are set once during updates within the transaction. Thus, a node may become visible in parent transactions much later than its &lt;code&gt;creation_time&lt;/code&gt;: only after a commit of the relevant transaction.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"TTL\"&gt;&lt;a href=\"en/user-guide/storage/cypress.html#TTL\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Cypress node TTL&lt;/span&gt;&lt;/a&gt;Cypress node TTL&lt;/h2&gt;\n&lt;p&gt;Cypress can delete nodes automatically at a specified moment in time or if nodes are not accessed for a certain length of time. This feature is controlled by the &lt;code&gt;expiration_time&lt;/code&gt; and the &lt;code&gt;expiration_timeout&lt;/code&gt; attributes. By default, these attributes are not there, so the system will not delete a node automatically. For TTL to function, you need:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;to set &lt;code&gt;expiration_time&lt;/code&gt; to a moment in time when the node is to be deleted. If it is a composite node, this will also delete its entire subtree.&lt;/li&gt;\n&lt;li&gt;to set &lt;code&gt;expiration_timeout&lt;/code&gt; to a time interval during which there have to be no attempts to access the node (and its entire subtree if it is a composite node) for it to be deleted.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Attention&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;You cannot restore data deleted using this mechanism. Use it with caution.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;The moment in time has to be either an isoformat string or an integer denoting the number of milliseconds since the epoch. These two methods are equivalent:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;yt &lt;span class=\"hljs-built_in\"&gt;set&lt;/span&gt; //home/project/path/table/@expiration_time &lt;span class=\"hljs-string\"&gt;'\"2020-05-16 15:12:34.591+03:00\"'&lt;/span&gt;\nyt &lt;span class=\"hljs-built_in\"&gt;set&lt;/span&gt; //home/project/path/table/@expiration_time &lt;span class=\"hljs-string\"&gt;'1589631154591'&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"300\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-300\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-300\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-300.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;A time interval is specified in milliseconds:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;&lt;span class=\"hljs-comment\"&gt;# Delete a node if \"left alone\" for a week.&lt;/span&gt;\nyt &lt;span class=\"hljs-built_in\"&gt;set&lt;/span&gt; //home/project/path/table/@expiration_timeout 604800000\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"304\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-304\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-304\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-304.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Attention&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Exercise extreme caution when setting &lt;code&gt;expiration_timeout&lt;/code&gt; for directories. A directory's time to live is extended only by direct access to that directory, not to any of its subtrees. For example, reading a table inside a directory with a set &lt;code&gt;expiration_timeout&lt;/code&gt; &lt;em&gt;does not extend&lt;/em&gt; this directory's TTL.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;You can modify these attributes within transactions; however, only their committed values will take effect.&lt;/p&gt;\n&lt;p&gt;To be able to set these attributes for a node, you need to have the &lt;a href=\"user-guide/storage/access-control.html\"&gt;right&lt;/a&gt; to &lt;code&gt;write&lt;/code&gt; to the node itself same as for many other attributes as well as the &lt;code&gt;remove&lt;/code&gt; privilege to the node and its entire subtree because a delete is being requested in effect, albeit a deferred one. The &lt;code&gt;write&lt;/code&gt; privilege is sufficient to delete these attributes.&lt;/p&gt;\n&lt;p&gt;The system provides no guarantee that the delete will occur exactly at the time requested. In real life, the delete occurs within single seconds of the specified moment in time.&lt;/p&gt;\n&lt;p&gt;A node is not automatically deleted if at the specified moment in time it is subject to locks other than &lt;code&gt;snapshot&lt;/code&gt;. The system will delete the node when all locks are released. You can use this property to artificially extend a node's time to live.&lt;/p&gt;\n&lt;p&gt;When you copy and move a node, &lt;code&gt;expiration_time&lt;/code&gt; and &lt;code&gt;expiration_timeout&lt;/code&gt; are reset by default, so the copy will not automatically delete. Commands include the &lt;code&gt;preserve-expiration-time&lt;/code&gt; and the &lt;code&gt;preserve-expiration-timeout&lt;/code&gt; options that enable you to change their behavior.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Attention&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;A number of API calls that create temporary tables set such tables' &lt;code&gt;expiration_time&lt;/code&gt;/&lt;code&gt;expiration_timeout&lt;/code&gt; to purge them automatically. You must keep that in mind and not store important data in such tables.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Deletion may occur earlier if the node is located in a subtree with a smaller &lt;code&gt;expiration_time&lt;/code&gt;/&lt;code&gt;expiration_timeout&lt;/code&gt; value at the root. To get the actual deletion time of a node, use the &lt;code&gt;effective_expiration&lt;/code&gt; attribute:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;$ yt get //home/project/path/table/@effective_expiration\n{\n  &lt;span class=\"hljs-string\"&gt;\"time\"&lt;/span&gt;: {&lt;span class=\"hljs-string\"&gt;\"value\"&lt;/span&gt;: 42, &lt;span class=\"hljs-string\"&gt;\"path\"&lt;/span&gt;: //testator/path}\n  &lt;span class=\"hljs-string\"&gt;\"timeout\"&lt;/span&gt;: {&lt;span class=\"hljs-string\"&gt;\"value\"&lt;/span&gt;: 42, &lt;span class=\"hljs-string\"&gt;\"path\"&lt;/span&gt;: //testator/path}\n}\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"343\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-343\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-343\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-343.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;If the path from the root to the node doesn't contain &lt;code&gt;expiration_time&lt;/code&gt; or another relevant attribute, a YSON entity is written to the &lt;code&gt;“time”&lt;/code&gt; field instead.&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"en/user-guide/storage/cypress.md","sourcePath":"en/user-guide/storage/cypress.md"},"headings":[{"title":"General tree view","href":"en/user-guide/storage/cypress.html#description","level":2},{"title":"Cypress node attributes","href":"en/user-guide/storage/cypress.html#attributes","level":2,"items":[{"title":"Time attributes","href":"en/user-guide/storage/cypress.html#time_attributes","level":3}]},{"title":"Cypress node TTL","href":"en/user-guide/storage/cypress.html#TTL","level":2}],"title":"Metadata tree"},"router":{"pathname":"en/user-guide/storage/cypress","depth":4,"base":"../../../"},"lang":"en","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/en/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-a29ea7877730322f2ce693378d06d02ac2b374cd-en","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
