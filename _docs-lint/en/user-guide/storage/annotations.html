        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;This section describes the annotations of tables, directories, and other &lt;a href=\"user-guide/storage/cypress.html\"&gt;Cypress&lt;/a&gt; nodes.&lt;/p&gt;\n&lt;h2 id=\"rationale\"&gt;&lt;a href=\"en/user-guide/storage/annotations.html#rationale\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Purpose of annotations&lt;/span&gt;&lt;/a&gt;Purpose of annotations&lt;/h2&gt;\n&lt;p&gt;Annotations are a way to provide a table, directory, or any other Cypress node with a short description.&lt;/p&gt;\n&lt;p&gt;Formally, such a description can be random text up to 1 KB, consisting of non-control ASCII characters, but we recommend sticking to Markdown format.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Note&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Annotations are stored in the memory of the YTsaurus master servers. We recommend limiting the content of the annotations to one or two sentences and links to more detailed documentation.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"annotation_attribute\"&gt;&lt;a href=\"en/user-guide/storage/annotations.html#annotation_attribute\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;The annotation attribute&lt;/span&gt;&lt;/a&gt;The annotation attribute&lt;/h2&gt;\n&lt;p&gt;All Cypress nodes have the &lt;code&gt;annotation&lt;/code&gt; attribute with the &lt;a href=\"user-guide/storage/yson.html\"&gt;YSON string&lt;/a&gt; value. You can set the value, as for the other attributes:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;yt &lt;span class=\"hljs-built_in\"&gt;set&lt;/span&gt; //home/project/path/table/@annotation &lt;span class=\"hljs-string\"&gt;'\"This table contains valuable data.\"'&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"28\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-28\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-28\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-28.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Removal is performed in the usual way:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;yt remove //home/project/path/table/@annotation\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"32\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-32\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-32\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-32.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Note&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;The &lt;code&gt;annotation&lt;/code&gt; attribute is always present, but it is &lt;code&gt;null&lt;/code&gt; by default. Removal resets the attribute to &lt;code&gt;null&lt;/code&gt;, but formally it still exists.&lt;/p&gt;\n&lt;p&gt;Thus, checking the existence of the &lt;code&gt;annotation&lt;/code&gt; attribute always returns a positive result and is therefore useless.  Instead, check that the attribute is &lt;code&gt;null&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;This behavior peculiarity is related to inheritance.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"inheritance\"&gt;&lt;a href=\"en/user-guide/storage/annotations.html#inheritance\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Inheritance&lt;/span&gt;&lt;/a&gt;Inheritance&lt;/h2&gt;\n&lt;p&gt;The annotation can accompany both a table and an entire subtree. To add a subtree annotation, set it to the appropriate directory. Any node recursively contained in it that does not have its own annotation will then display it in its &lt;code&gt;annotation&lt;/code&gt; attribute.&lt;/p&gt;\n&lt;p&gt;In other words, the &lt;code&gt;annotation&lt;/code&gt; attribute is inherited: it always displays the nearest non-zero annotation of the ancestor. The search starts with the node.&lt;/p&gt;\n&lt;p&gt;To understand which ancestor the displayed annotation belongs to, use the &lt;code&gt;annotation_path&lt;/code&gt; attribute. It is read-only and contains the full path to the corresponding ancestor or to the node if it is annotated.&lt;/p&gt;\n&lt;h2 id=\"web_interface\"&gt;&lt;a href=\"en/user-guide/storage/annotations.html#web_interface\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Support in the web interface&lt;/span&gt;&lt;/a&gt;Support in the web interface&lt;/h2&gt;\n&lt;p&gt;The web interface supports annotations and accepts the Markdown format — the &lt;a href=\"https://ydocs.tech/en/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;YFM&lt;/a&gt; dialect supported by the &lt;a href=\"https://www.npmjs.com/package/@doc-tools/transform\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;@doc-tools/transform&lt;/a&gt; package.&lt;br /&gt;\nAnnotations are displayed in the &lt;strong&gt;Navigation&lt;/strong&gt; section, on the &lt;strong&gt;Annotation&lt;/strong&gt; tab of the selected node. To edit an annotation, click &lt;strong&gt;Edit metadata&lt;/strong&gt; and go to the &lt;strong&gt;Description&lt;/strong&gt; tab.&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"en/user-guide/storage/annotations.md","sourcePath":"en/user-guide/storage/annotations.md"},"headings":[{"title":"Purpose of annotations","href":"en/user-guide/storage/annotations.html#rationale","level":2},{"title":"The annotation attribute","href":"en/user-guide/storage/annotations.html#annotation_attribute","level":2},{"title":"Inheritance","href":"en/user-guide/storage/annotations.html#inheritance","level":2},{"title":"Support in the web interface","href":"en/user-guide/storage/annotations.html#web_interface","level":2}],"title":"Annotations"},"router":{"pathname":"en/user-guide/storage/annotations","depth":4,"base":"../../../"},"lang":"en","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/en/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-a29ea7877730322f2ce693378d06d02ac2b374cd-en","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
