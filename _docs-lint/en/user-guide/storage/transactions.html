        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;This section describes transactions as applied to &lt;a href=\"user-guide/storage/cypress.html\"&gt;Cypress&lt;/a&gt;, and &lt;a href=\"user-guide/storage/static-tables.html\"&gt;static tables&lt;/a&gt;, &lt;a href=\"en/user-guide/storage/transactions.html#locks\"&gt;locks&lt;/a&gt;, and &lt;a href=\"en/user-guide/storage/transactions.html#versioning\"&gt;versioning&lt;/a&gt; of Cypress objects.&lt;br /&gt;\nThe transactional model of dynamic tables is described in the &lt;a href=\"user-guide/dynamic-tables/transactions.html\"&gt;Multiversioning and transaction processing of dynamic tables&lt;/a&gt; section.&lt;/p&gt;\n&lt;h2 id=\"transactions\"&gt;&lt;a href=\"en/user-guide/storage/transactions.html#transactions\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;General information&lt;/span&gt;&lt;/a&gt;General information&lt;/h2&gt;\n&lt;p&gt;The YTsaurus system supports transactions, but differs in a number of ways from the classic &lt;a href=\"https://en.wikipedia.org/wiki/Online_transaction_processing\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;transaction processing model&lt;/a&gt;:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Transactions can last minutes or hours.&lt;/li&gt;\n&lt;li&gt;Isolation is configurable.&lt;/li&gt;\n&lt;li&gt;There are no foreign table keys.&lt;/li&gt;\n&lt;li&gt;Transactions can affect other Cypress nodes in addition to tables.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;YTsaurus ensures the following properties of the transaction processing system:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;strong&gt;Atomicity&lt;/strong&gt;. YTsaurus guarantees that the transaction will not be partially committed in the system. Either all or none of its sub-operations will be executed. Changing the data of a single Cypress node within a single command (for example, the set command) is atomic.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Consistency&lt;/strong&gt;. Changes introduced by committing a transaction maintain data consistency in Cypress nodes and static tables.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Isolation&lt;/strong&gt;. Unlike traditional transaction processing systems, YTsaurus enables you to choose isolation on a per-transaction basis. YTsaurus behavior corresponds to the &lt;a href=\"https://en.wikipedia.org/wiki/Isolation_(database_systems)\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Read committed&lt;/a&gt; isolation level when interacting with Cypress and &lt;a href=\"https://en.wikipedia.org/wiki/Isolation_(database_systems)\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Serializable&lt;/a&gt; when interacting with static tables within transactions.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Durability&lt;/strong&gt;. YTsaurus guarantees the safety of changes after the transaction is committed. A single server hardware failure, power outage, or system shutdown cannot cause a loss of made changes. Transactions in the system can survive a system shutdown and continue running after the system is restored.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;When you perform most actions in the system, you can specify which transaction those actions should be performed under. If a transaction is not explicitly specified, basic actions involving Cypress nodes, such as creating a new node or reading and writing a node's attributes, are performed atomically. However, more complex actions require the transaction to be initiated explicitly. One such example is reading a table: without a transaction and a snapshot lock on the table, there are no guarantees that data will not be deleted while you are working with it. However, if the data physically exists and can be read with a single query, that query returns a consistent state of the table.&lt;/p&gt;\n&lt;p&gt;Transactions are objects of the &lt;code&gt;transaction&lt;/code&gt; type. A list of all system transactions can be found in Cypress at &lt;code&gt;//sys/transactions&lt;/code&gt;.&lt;br /&gt;\nA transaction can have another transaction as a parent. Transactions form a tree whose roots are transactions without parents, also called topmost transactions. A list of all topmost transactions is available at &lt;code&gt;//sys/topmost_transactions&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Transactions are divided into &lt;strong&gt;master transactions&lt;/strong&gt; and &lt;strong&gt;tablet transactions&lt;/strong&gt;. Master transactions enable you to perform operations on the master meta-information. Tablet transactions enable you only to write data to dynamic tables.&lt;/p&gt;\n&lt;h2 id=\"master_transactions\"&gt;&lt;a href=\"en/user-guide/storage/transactions.html#master_transactions\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Master transactions&lt;/span&gt;&lt;/a&gt;Master transactions&lt;/h2&gt;\n&lt;p&gt;Transactional processing within master servers applies to versionable &lt;a href=\"user-guide/storage/objects.html\"&gt;objects&lt;/a&gt;. Examples of such objects are files, tables, and folders.&lt;/p&gt;\n&lt;h3 id=\"create\"&gt;&lt;a href=\"en/user-guide/storage/transactions.html#create\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Creating a transaction&lt;/span&gt;&lt;/a&gt;Creating a transaction&lt;/h3&gt;\n&lt;p&gt;To create a transaction, run the &lt;code&gt;start_tx&lt;/code&gt; command.&lt;br /&gt;\nYou can specify the parent transaction in the &lt;code&gt;parent_id&lt;/code&gt; option and define the transaction's time to live (TTL) in the &lt;code&gt;timeout&lt;/code&gt; option.&lt;br /&gt;\nBy default, the upper TTL limit for a transaction within the system is one hour. If you specify a &lt;code&gt;timeout&lt;/code&gt; of more than one hour, it will be equal to the limit.&lt;br /&gt;\nTime to live starts from the moment of the &lt;code&gt;start_tx&lt;/code&gt; call or from the last &lt;a href=\"en/user-guide/storage/transactions.html#ping\"&gt;&lt;code&gt;ping_tx&lt;/code&gt;&lt;/a&gt; call.&lt;/p&gt;\n&lt;h3 id=\"ping\"&gt;&lt;a href=\"en/user-guide/storage/transactions.html#ping\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Extending a transaction's TTL&lt;/span&gt;&lt;/a&gt;Extending a transaction's TTL&lt;/h3&gt;\n&lt;p&gt;To extend a transaction's TTL, run the &lt;code&gt;ping_tx&lt;/code&gt; command.&lt;br /&gt;\nEach execution extends the transaction's TTL by a time interval equal to &lt;code&gt;timeout&lt;/code&gt;. If the time since transaction creation or the last execution of the &lt;code&gt;ping_tx&lt;/code&gt; command exceeds &lt;code&gt;timeout&lt;/code&gt;, the transaction will be aborted.&lt;/p&gt;\n&lt;h3 id=\"commit\"&gt;&lt;a href=\"en/user-guide/storage/transactions.html#commit\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Completing a transaction&lt;/span&gt;&lt;/a&gt;Completing a transaction&lt;/h3&gt;\n&lt;p&gt;You can abort a transaction using the &lt;code&gt;abort_tx&lt;/code&gt; or successfully complete it using the &lt;code&gt;commit_tx&lt;/code&gt; command.&lt;/p&gt;\n&lt;p&gt;Aborting a transaction also aborts all its nested transactions.&lt;br /&gt;\nTo successfully complete a transaction that includes nested transactions, you must first run the &lt;code&gt;commit_tx&lt;/code&gt; command on all nested transactions. Attempting to run &lt;code&gt;commit_tx&lt;/code&gt; on the parent transaction first will result in an error.&lt;br /&gt;\nIn all other cases, completing a transaction cannot cause an error.&lt;/p&gt;\n&lt;p&gt;YTsaurus uses &lt;a href=\"en/user-guide/storage/transactions.html#locks\"&gt;pessimistic locks&lt;/a&gt;, so possible conflicts are detected as they occur — when locks are acquired and objects are created within transactions rather than when a transaction is completed.&lt;/p&gt;\n&lt;h3 id=\"attributes\"&gt;&lt;a href=\"en/user-guide/storage/transactions.html#attributes\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Transaction attributes&lt;/span&gt;&lt;/a&gt;Transaction attributes&lt;/h3&gt;\n&lt;p&gt;In addition to the attributes &lt;a href=\"user-guide/storage/objects.html#attributes\"&gt;inherent to all objects&lt;/a&gt;, transactions have the following attributes:&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Attribute&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Type&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Description&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Mandatory&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;timeout&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;integer&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Transaction timeout in ms. May be omitted for some system transactions.&lt;/td&gt;\n&lt;td&gt;No&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;title&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;string&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Text description string. This attribute is filled in automatically for all system transactions and for user transactions only if the user specifies it themselves when creating a transaction.&lt;/td&gt;\n&lt;td&gt;No&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;last_ping_time&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;DateTime&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Time when the transaction's TTL was last extended. May be missing for some system transactions.&lt;/td&gt;\n&lt;td&gt;No&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;parent_id&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;Guid&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Parent transaction ID.&lt;/td&gt;\n&lt;td&gt;Yes&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;start_time&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;DateTime&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Transaction creation time.&lt;/td&gt;\n&lt;td&gt;Yes&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;nested_transaction_ids&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;array&amp;lt;Guid&amp;gt;&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;A list of nested transaction IDs.&lt;/td&gt;\n&lt;td&gt;Yes&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;staged_object_ids&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;array&amp;lt;Guid&amp;gt;&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;A list of IDs of objects that the transaction temporarily owns.&lt;/td&gt;\n&lt;td&gt;Yes&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;branched_node_ids&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;array&amp;lt;Guid&amp;gt;&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;A list of branched Cypress node IDs.&lt;/td&gt;\n&lt;td&gt;Yes&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;locked_node_ids&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;array&amp;lt;Guid&amp;gt;&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;A list of locked Cypress node IDs.&lt;/td&gt;\n&lt;td&gt;Yes&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;lock_ids&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;array&amp;lt;Guid&amp;gt;&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;A list of IDs of locks created in the transaction.&lt;/td&gt;\n&lt;td&gt;Yes&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;resource_usage&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;ResourceUsageMap&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;An attribute that shows the use of resources in a given transaction for each affected account.&lt;/td&gt;\n&lt;td&gt;Yes&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Note&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Transactions created by the system always have the filled in &lt;code&gt;title&lt;/code&gt; attribute. It contains a description of the process that created the transaction.&lt;br /&gt;\nUsers are also encouraged to use this attribute to describe the purpose of the transaction.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"locks\"&gt;&lt;a href=\"en/user-guide/storage/transactions.html#locks\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Locks&lt;/span&gt;&lt;/a&gt;Locks&lt;/h2&gt;\n&lt;p&gt;Versioning of Cypress nodes is related to the concept of locks. By acquiring a lock on the node, the transaction expresses its intention to work with the node in &lt;a href=\"en/user-guide/storage/transactions.html#locking_mode\"&gt;locking mode&lt;/a&gt;. If the transaction manages to acquire a lock, it is guaranteed that:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;It is allowed to work with this node in the specified manner.&lt;/li&gt;\n&lt;li&gt;The node for this transaction is branched.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Note&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Note that acquiring a lock on a node creates a branched version of that node. Furthermore, the node may already have existing branches.&lt;/p&gt;\n&lt;p&gt;The presence of a lock on a node always means that the node has a branched version. However, the opposite is not always true: in certain scenarios, a node may be branched but not locked. An attempt to work with such a node will always result in acquiring a lock on it. Branching and acquiring a lock are related, but different things.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;A lock is a full-fledged object that has its own ID. A list of all locks in the system is available at &lt;code&gt;//sys/locks&lt;/code&gt;. We recommend using an address of the &lt;code&gt;#lock-id&lt;/code&gt; form to access a specific lock.&lt;/p&gt;\n&lt;p&gt;A list of locks acquired by a transaction is displayed in its &lt;code&gt;lock_ids&lt;/code&gt; attribute.&lt;/p&gt;\n&lt;h3 id=\"locking_mode\"&gt;&lt;a href=\"en/user-guide/storage/transactions.html#locking_mode\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Locking modes&lt;/span&gt;&lt;/a&gt;Locking modes&lt;/h3&gt;\n&lt;p&gt;The available locking modes are: &lt;code&gt;snapshot&lt;/code&gt;, &lt;code&gt;exclusive&lt;/code&gt;, and &lt;code&gt;shared&lt;/code&gt;.&lt;br /&gt;\nA locking mode defines the list of allowed transaction actions, as well as the ability to acquire other locks:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;snapshot&lt;/code&gt;: The transaction can read but not modify the node. The lock is used to obtain a read-only copy of a Cypress node state in the context of the transaction and freeze the state of that node.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Note&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;A snapshot lock is acquired only on the node itself, but not on the path to it in Cypress. If you continue accessing the node using its path, you can get a new node placed on the same path.&lt;br /&gt;\nTo ensure access to the snapshot version of a node, use the node's &lt;code&gt;id&lt;/code&gt;, which is returned by the &lt;code&gt;lock&lt;/code&gt; &lt;a href=\"api/commands.html#lock\"&gt;command&lt;/a&gt;.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;exclusive&lt;/code&gt;: The transaction can modify the node state. Other transactions cannot change the node.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;shared&lt;/code&gt;: The transaction can modify a certain part of the node state. Other transactions can still change other parts of this node.&lt;/p&gt;\n&lt;p&gt;There are three standard scenarios for using this lock:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Concurrently appending data to a table or file from multiple transactions. In this case, you can only append data, but not overwrite it.&lt;/li&gt;\n&lt;li&gt;Concurrently creating several differently named subfolders within the same folder from multiple transactions. For example, transaction T1 can be started and create (or delete) the &lt;code&gt;//tmp/a&lt;/code&gt; node and transaction T2 can be started and create (or delete) the &lt;code&gt;//tmp/b&lt;/code&gt; node. Each of them will acquire a separate &lt;code&gt;shared&lt;/code&gt; lock on &lt;code&gt;//tmp&lt;/code&gt;. To detect conflicts, each lock has the &lt;code&gt;child_key&lt;/code&gt; attribute indicating which key (subfolder) is locked by it.&lt;/li&gt;\n&lt;li&gt;Concurrently creating several differently named attributes within the same node from multiple transactions. For example, transaction T1 can be started and set (change, delete) the &lt;code&gt;//tmp/@a&lt;/code&gt; attribute and transaction T2 can be started and set (change, delete) the &lt;code&gt;//tmp/@b&lt;/code&gt; attribute. To detect conflicts, each lock has the &lt;code&gt;attribute_key&lt;/code&gt; attribute indicating which key (attribute name) is locked by it.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;/ul&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Note&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Transactions can be nested. \"Other transactions\" refers to transactions that are unrelated to this transaction, meaning that they do not share a common ancestor with it. In particular, nested transactions can result in more than one &lt;code&gt;exclusive&lt;/code&gt; lock on a node.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"implicit_locks\"&gt;&lt;a href=\"en/user-guide/storage/transactions.html#implicit_locks\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Implicit locks&lt;/span&gt;&lt;/a&gt;Implicit locks&lt;/h3&gt;\n&lt;p&gt;A transaction can acquire locks either explicitly using the &lt;code&gt;lock&lt;/code&gt; command or implicitly. Implicit acquisition of locks can occur in case of certain interactions with Cypress nodes, for example:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Creating a node is accompanied by an acquisition of an &lt;code&gt;exclusive&lt;/code&gt; lock.&lt;/li&gt;\n&lt;li&gt;Writing to a table or file results in acquiring a &lt;code&gt;shared&lt;/code&gt; lock if you are adding data to a table and an &lt;code&gt;exclusive&lt;/code&gt; lock if you are overwriting it.&lt;/li&gt;\n&lt;li&gt;Creating a new entry in the folder, as well as changing or deleting an existing entry is accompanied by an acquisition of a &lt;code&gt;shared&lt;/code&gt; lock with the corresponding &lt;code&gt;child_key&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;Creating a new node attribute, as well as changing or deleting an existing attribute is accompanied by an acquisition of a &lt;code&gt;shared&lt;/code&gt; lock with the corresponding &lt;code&gt;attribute_key&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h3 id=\"locks_compatibility\"&gt;&lt;a href=\"en/user-guide/storage/transactions.html#locks_compatibility\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Lock compatibility&lt;/span&gt;&lt;/a&gt;Lock compatibility&lt;/h3&gt;\n&lt;p&gt;Some lock combinations can be acquired concurrently. The formal rules are as follows:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;A &lt;code&gt;snapshot&lt;/code&gt; lock can always be acquired. If this transaction has already acquired a &lt;code&gt;snapshot&lt;/code&gt; lock, an attempt to acquire the lock again is completed without errors and has no effect.&lt;/li&gt;\n&lt;li&gt;A &lt;code&gt;shared&lt;/code&gt; or &lt;code&gt;exclusive&lt;/code&gt; lock cannot be acquired if the transaction or any of its ancestors has already acquired a &lt;code&gt;snapshot&lt;/code&gt; lock.&lt;/li&gt;\n&lt;li&gt;A &lt;code&gt;shared&lt;/code&gt; or &lt;code&gt;exclusive&lt;/code&gt; lock cannot be acquired if another transaction that is not an ancestor of the given one has already acquired an &lt;code&gt;exclusive&lt;/code&gt; lock.&lt;/li&gt;\n&lt;li&gt;An &lt;code&gt;exclusive&lt;/code&gt; lock cannot be acquired if another transaction that is not an ancestor of the given one has already acquired a &lt;code&gt;shared&lt;/code&gt; lock.&lt;/li&gt;\n&lt;li&gt;A &lt;code&gt;shared&lt;/code&gt; lock with the specified &lt;code&gt;child_key&lt;/code&gt; cannot be acquired if another transaction that is not an ancestor of the given one has already acquired a &lt;code&gt;shared&lt;/code&gt; lock with the same &lt;code&gt;child_key&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;A &lt;code&gt;shared&lt;/code&gt; lock with the specified &lt;code&gt;attribute_key&lt;/code&gt; cannot be acquired if another transaction that is not an ancestor of the given one has already acquired a &lt;code&gt;shared&lt;/code&gt; lock with the same &lt;code&gt;attribute_key&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;A &lt;code&gt;shared&lt;/code&gt; lock without &lt;code&gt;child_key&lt;/code&gt; and &lt;code&gt;attribute_key&lt;/code&gt; can be acquired despite any other &lt;code&gt;shared&lt;/code&gt; locks.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h3 id=\"lock_operations\"&gt;&lt;a href=\"en/user-guide/storage/transactions.html#lock_operations\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Lock operations&lt;/span&gt;&lt;/a&gt;Lock operations&lt;/h3&gt;\n&lt;p&gt;There are two commands to work with locks: &lt;code&gt;lock&lt;/code&gt; and &lt;code&gt;unlock&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;The &lt;code&gt;lock&lt;/code&gt; command enables you to acquire a lock on a Cypress node in a specified transaction.&lt;/p&gt;\n&lt;p&gt;The &lt;code&gt;unlock&lt;/code&gt; command does the opposite: it removes all explicit locks from the node for a given transaction, both those already acquired and those still in the &lt;a href=\"en/user-guide/storage/transactions.html#locking_queue\"&gt;lock queue&lt;/a&gt;.&lt;br /&gt;\nThe lock can only be removed if the locked branched version of the node contains no changes compared to the original. Consequently, an explicit &lt;code&gt;snapshot&lt;/code&gt; lock can always be removed. Otherwise the command will end with an error.&lt;/p&gt;\n&lt;p&gt;Locks are automatically removed at the end of the transaction, whether successful or unsuccessful. Therefore, there is usually no need to remove them manually.&lt;br /&gt;\nWe recommend using the &lt;code&gt;unlock&lt;/code&gt; command only when you need to acquire and release locks without completing the transaction. Such transactions are usually designed to manage the synchronization of third-party services.&lt;/p&gt;\n&lt;h3 id=\"locking_queue\"&gt;&lt;a href=\"en/user-guide/storage/transactions.html#locking_queue\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Lock queue&lt;/span&gt;&lt;/a&gt;Lock queue&lt;/h3&gt;\n&lt;p&gt;Each Cypress node can have its own lock queue.&lt;/p&gt;\n&lt;p&gt;By default, the &lt;code&gt;lock&lt;/code&gt; command tries to acquire a lock and returns an error if the node is already locked. If you specify the &lt;code&gt;waitable&lt;/code&gt; parameter equal to &lt;code&gt;true&lt;/code&gt; in the &lt;code&gt;lock&lt;/code&gt; command, the lock will be queued.&lt;br /&gt;\nTo find out whether a lock is in the queue, request the &lt;code&gt;state&lt;/code&gt; attribute. If the lock is in the queue, it will be &lt;code&gt;pending&lt;/code&gt;, if not, it will be &lt;code&gt;acquired&lt;/code&gt;.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Attention&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;For a lock to be actually acquired, for example exclusively, its state must become &lt;code&gt;acquired&lt;/code&gt;.&lt;br /&gt;\nTo acquire a lock:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Call the &lt;code&gt;lock&lt;/code&gt; command.&lt;/li&gt;\n&lt;li&gt;Monitor the &lt;code&gt;state&lt;/code&gt; in the cycle until it takes on the &lt;code&gt;acquired&lt;/code&gt; value.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"lock_attributes\"&gt;&lt;a href=\"en/user-guide/storage/transactions.html#lock_attributes\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Lock attributes&lt;/span&gt;&lt;/a&gt;Lock attributes&lt;/h3&gt;\n&lt;p&gt;In addition to the attributes inherent to all objects, locks have the following attributes:&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Attribute&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Type&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Description&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;state&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;string&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Lock state: &lt;code&gt;pending&lt;/code&gt; or &lt;code&gt;acquired&lt;/code&gt;.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;transaction_id&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;Guid&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;ID of the transaction that took the lock.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;mode&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;string&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Locking mode: &lt;code&gt;shared&lt;/code&gt;, &lt;code&gt;exclusive&lt;/code&gt;, or &lt;code&gt;snapshot&lt;/code&gt;.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;child_key&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;string&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;The key on which the lock is acquired. For the &lt;code&gt;shared&lt;/code&gt; type only.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;attribute_key&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;string&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;The name of the attribute on which the lock is acquired (for the &lt;code&gt;shared&lt;/code&gt; type only)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;h2 id=\"versioning\"&gt;&lt;a href=\"en/user-guide/storage/transactions.html#versioning\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Versioning&lt;/span&gt;&lt;/a&gt;Versioning&lt;/h2&gt;\n&lt;p&gt;Changing the node state by a transaction is the following three-phase process:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;\n&lt;p&gt;Transaction &lt;code&gt;T&lt;/code&gt; acquires the lock on node &lt;code&gt;N&lt;/code&gt;. Version &lt;code&gt;N:T&lt;/code&gt; appears for node &lt;code&gt;N&lt;/code&gt; and it is formed as follows:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;For a &lt;code&gt;snapshot&lt;/code&gt; lock, it branches off from version &lt;code&gt;N:T'&lt;/code&gt; where &lt;code&gt;T'&lt;/code&gt; is the closest ancestor of &lt;code&gt;T&lt;/code&gt; that branched off &lt;code&gt;N&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;For &lt;code&gt;shared&lt;/code&gt; and &lt;code&gt;exclusive&lt;/code&gt; locks, &lt;code&gt;N:T''&lt;/code&gt; branches off from &lt;code&gt;N:T'&lt;/code&gt; where &lt;code&gt;T''&lt;/code&gt; is the child of &lt;code&gt;T'&lt;/code&gt; ; &lt;code&gt;N:T'''&lt;/code&gt; branches off from &lt;code&gt;N:T''&lt;/code&gt; where &lt;code&gt;T'''&lt;/code&gt; is the child of &lt;code&gt;T''&lt;/code&gt; and so on up to &lt;code&gt;N:T&lt;/code&gt;. In other words, a chain of branched node versions is created for each transaction from &lt;code&gt;T'&lt;/code&gt; to &lt;code&gt;T&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;If there is no such &lt;code&gt;T'&lt;/code&gt;, the real version of &lt;code&gt;N&lt;/code&gt; is used. It does not matter for this description whether the lock was acquired explicitly or implicitly.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;Transaction &lt;code&gt;T&lt;/code&gt; works with node &lt;code&gt;N&lt;/code&gt;, with the actual changes accumulated in its version &lt;code&gt;N:T&lt;/code&gt;.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;Transaction &lt;code&gt;T&lt;/code&gt; completes successfully and the changes it made to &lt;code&gt;N:T&lt;/code&gt;, if any, get merged into the version from which version &lt;code&gt;N:T&lt;/code&gt; was branched. Thus, these changes become visible to the parent transaction or to all if transaction &lt;code&gt;T&lt;/code&gt; was a topmost transaction.&lt;/p&gt;\n&lt;/li&gt;\n&lt;/ol&gt;\n&lt;h2 id=\"using-transactions-in-operations\"&gt;&lt;a href=\"en/user-guide/storage/transactions.html#using-transactions-in-operations\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Using transactions in operations&lt;/span&gt;&lt;/a&gt;Using transactions in operations&lt;/h2&gt;\n&lt;p&gt;When starting operations, the scheduler creates a set of transactions to provide some atomicity of data processing in the operation. To learn more about how this works, see &lt;a href=\"user-guide/data-processing/operations/overview.html#transactions\"&gt;Transactions in data processing&lt;/a&gt;.&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"en/user-guide/storage/transactions.md","sourcePath":"en/user-guide/storage/transactions.md"},"headings":[{"title":"General information","href":"en/user-guide/storage/transactions.html#transactions","level":2},{"title":"Master transactions","href":"en/user-guide/storage/transactions.html#master_transactions","level":2,"items":[{"title":"Creating a transaction","href":"en/user-guide/storage/transactions.html#create","level":3},{"title":"Extending a transaction's TTL","href":"en/user-guide/storage/transactions.html#ping","level":3},{"title":"Completing a transaction","href":"en/user-guide/storage/transactions.html#commit","level":3},{"title":"Transaction attributes","href":"en/user-guide/storage/transactions.html#attributes","level":3}]},{"title":"Locks","href":"en/user-guide/storage/transactions.html#locks","level":2,"items":[{"title":"Locking modes","href":"en/user-guide/storage/transactions.html#locking_mode","level":3},{"title":"Implicit locks","href":"en/user-guide/storage/transactions.html#implicit_locks","level":3},{"title":"Lock compatibility","href":"en/user-guide/storage/transactions.html#locks_compatibility","level":3},{"title":"Lock operations","href":"en/user-guide/storage/transactions.html#lock_operations","level":3},{"title":"Lock queue","href":"en/user-guide/storage/transactions.html#locking_queue","level":3},{"title":"Lock attributes","href":"en/user-guide/storage/transactions.html#lock_attributes","level":3}]},{"title":"Versioning","href":"en/user-guide/storage/transactions.html#versioning","level":2},{"title":"Using transactions in operations","href":"en/user-guide/storage/transactions.html#using-transactions-in-operations","level":2}],"title":"Transactions"},"router":{"pathname":"en/user-guide/storage/transactions","depth":4,"base":"../../../"},"lang":"en","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/en/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-a29ea7877730322f2ce693378d06d02ac2b374cd-en","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
