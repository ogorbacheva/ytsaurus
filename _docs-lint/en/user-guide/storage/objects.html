        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;This section describes the main &lt;a href=\"user-guide/storage/objects.html#object_types\"&gt;object types&lt;/a&gt; in the YTsaurus system. A table with the key &lt;a href=\"user-guide/storage/objects.html#attributes\"&gt;attributes of each object&lt;/a&gt; is given and the concept of an &lt;a href=\"user-guide/storage/objects.html#object_ids\"&gt;object ID&lt;/a&gt; is described.&lt;/p&gt;\n&lt;h2 id=\"object_types\"&gt;&lt;a href=\"en/user-guide/storage/objects.html#object_types\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Object types&lt;/span&gt;&lt;/a&gt;Object types&lt;/h2&gt;\n&lt;p&gt;The main object types in YTsaurus are:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"user-guide/storage/objects.html#files\"&gt;Files&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"user-guide/storage/objects.html#tables\"&gt;Tables&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"user-guide/storage/objects.html#links\"&gt;Links&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"user-guide/storage/objects.html#yson_doc\"&gt;YSON documents&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"user-guide/storage/objects.html#primitive_types\"&gt;Primitive types&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"en/user-guide/storage/objects.html#internal_objects\"&gt;Internal objects&lt;/a&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;The description of objects takes up most of the meta-information which is stored in replicated form in the memory of the &lt;a href=\"user-guide/storage/cypress.html\"&gt;Cypress&lt;/a&gt; master servers. Cypress contains various system information as well as indications of where user data is stored.&lt;/p&gt;\n&lt;p&gt;For any Cypress node, there may be several versions, because the state of the node may look different in the context of each &lt;a href=\"user-guide/storage/transactions.html\"&gt;transaction&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"files\"&gt;&lt;a href=\"en/user-guide/storage/objects.html#files\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Files&lt;/span&gt;&lt;/a&gt;Files&lt;/h3&gt;\n&lt;p&gt;These are Cypress nodes of the &lt;strong&gt;file&lt;/strong&gt; type designed to store large binary data in the system.&lt;br /&gt;\nFiles consist of multiple chunks and &lt;a href=\"user-guide/storage/chunks.html#attributes\"&gt;are chunk owners&lt;/a&gt;.&lt;br /&gt;\nChunks are organized as a special tree-like data structure in which leaves are chunks and intermediate nodes are chunklists.&lt;/p&gt;\n&lt;p&gt;For more information, see &lt;a href=\"user-guide/storage/files.html\"&gt;Files&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"tables\"&gt;&lt;a href=\"en/user-guide/storage/objects.html#tables\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Tables&lt;/span&gt;&lt;/a&gt;Tables&lt;/h3&gt;\n&lt;p&gt;These are nodes of the &lt;strong&gt;table&lt;/strong&gt; type designed to store large user data. There are two types of tables: &lt;a href=\"user-guide/storage/static-tables.html\"&gt;static&lt;/a&gt; and &lt;a href=\"user-guide/dynamic-tables/overview.html\"&gt;dynamic&lt;/a&gt;. Logically, a table is a sequence of rows. Each row consists of columns.&lt;br /&gt;\nColumn values are typified and can contain random structured data supported by the &lt;a href=\"user-guide/storage/yson.html\"&gt;YSON&lt;/a&gt; language.&lt;/p&gt;\n&lt;h3 id=\"links\"&gt;&lt;a href=\"en/user-guide/storage/objects.html#links\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Links&lt;/span&gt;&lt;/a&gt;Links&lt;/h3&gt;\n&lt;p&gt;Links are nodes of the &lt;strong&gt;link&lt;/strong&gt; type that refer to other objects along the path specified when the object is created.&lt;br /&gt;\nAll accesses to the node links are automatically redirected to the target object.&lt;br /&gt;\nFor more information, see &lt;a href=\"user-guide/storage/links.html\"&gt;Links&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"yson_doc\"&gt;&lt;a href=\"en/user-guide/storage/objects.html#yson_doc\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;YSON documents&lt;/span&gt;&lt;/a&gt;YSON documents&lt;/h3&gt;\n&lt;p&gt;A YSON document is a Cypress node of the &lt;strong&gt;document&lt;/strong&gt; type designed to store random YSON structures.&lt;/p&gt;\n&lt;p&gt;Requests and modifications within the document are supported. Addressing within the document is performed using the &lt;a href=\"user-guide/storage/ypath.html\"&gt;YPath&lt;/a&gt; language.&lt;/p&gt;\n&lt;p&gt;For more information, see &lt;a href=\"user-guide/storage/yson-docs.html\"&gt;YSON documents&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;For more information about the YSON format, see &lt;a href=\"user-guide/storage/yson.html\"&gt;YSON.&lt;/a&gt;&lt;/p&gt;\n&lt;h3 id=\"primitive_types\"&gt;&lt;a href=\"en/user-guide/storage/objects.html#primitive_types\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Primitive types&lt;/span&gt;&lt;/a&gt;Primitive types&lt;/h3&gt;\n&lt;p&gt;A Cypress node can contain a value of the primitive type: string, number, dict, list. The table contains a description of the primitive types of Cypress nodes.&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Type name&lt;/th&gt;\n&lt;th&gt;Description&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;string_node&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;A Cypress node containing a string&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;int64_node&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;A Cypress node containing a signed integer&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;uint64_node&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;A Cypress node containing an unsigned integer&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;double_node&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;A Cypress node containing a real number&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;map_node&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Dict in Cypress (keys are strings, values are other nodes). By analogy with a file system, this is a folder&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;list_node&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;strong&gt;Deprecated, consider using documents instead.&lt;/strong&gt; An ordered list in Cypress (values are other nodes)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;boolean_node&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;A Cypress node containing a Boolean value&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;h3 id=\"internal_objects\"&gt;&lt;a href=\"en/user-guide/storage/objects.html#internal_objects\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Internal objects&lt;/span&gt;&lt;/a&gt;Internal objects&lt;/h3&gt;\n&lt;p&gt;In addition to the objects listed above, there are internal objects: transactions, chunks, accounts, users, and groups. Such objects are not subject to versioning.&lt;br /&gt;\nThe internal objects listed in the table:&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Object name&lt;/th&gt;\n&lt;th&gt;Description&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;transaction&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"user-guide/storage/transactions.html\"&gt;Transaction&lt;/a&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;chunk&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Chunk&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;chunk_list&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Chunklist&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;erasure_chunk&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Erasure-chunk&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;account&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Account&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;user&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;User&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;group&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Group&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;h2 id=\"object_ids\"&gt;&lt;a href=\"en/user-guide/storage/objects.html#object_ids\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Object IDs&lt;/span&gt;&lt;/a&gt;Object IDs&lt;/h2&gt;\n&lt;p&gt;Each object has a unique &lt;strong&gt;ID&lt;/strong&gt; that is a 128-bit number whose format coincides with the GUID. This number can be represented as four 32-bit numbers: &lt;code&gt;a-b-c-d&lt;/code&gt;. Usually when an ID is typed, components &lt;code&gt;a&lt;/code&gt;, &lt;code&gt;b&lt;/code&gt;, &lt;code&gt;c&lt;/code&gt;, and &lt;code&gt;d&lt;/code&gt; are written in hexadecimal form. Each of these components has its own meaning and is described in the table.&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th style=\"text-align:center\"&gt;Component&lt;/th&gt;\n&lt;th&gt;Purpose&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td style=\"text-align:center\"&gt;&lt;code&gt;a&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;The number of the Hydra epoch in which the object was created&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td style=\"text-align:center\"&gt;&lt;code&gt;b&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;The mutation number within the epoch in which the object was created&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td style=\"text-align:center\"&gt;&lt;code&gt;c[16..31]&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;The master group ID (cell id) is a unique 16-bit number that unambiguously identifies the cluster. This ID can be found in the cluster web interface opposite the master servers&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td style=\"text-align:center\"&gt;&lt;code&gt;c[0..15]&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Object type&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td style=\"text-align:center\"&gt;&lt;code&gt;d&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Hash is a pseudo-unique random number selected at the time of object creation.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Thus, the object ID depends on the cluster on which the object was created, as well as on the point in time (in terms of mutation numbers) when the object was created. More than one object can be created within a single mutation. They will differ in hash value. This difference is guaranteed by the hash generation mechanism. ID example: &lt;code&gt;28bb5-75b04b-3fe012f-8b4eda94&lt;/code&gt;.&lt;/p&gt;\n&lt;h2 id=\"attributes\"&gt;&lt;a href=\"en/user-guide/storage/objects.html#attributes\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Object attributes&lt;/span&gt;&lt;/a&gt;Object attributes&lt;/h2&gt;\n&lt;p&gt;All system objects have the attributes listed in the table:&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th style=\"text-align:left\"&gt;&lt;strong&gt;Attribute&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Type&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Value&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td style=\"text-align:left\"&gt;&lt;code&gt;id&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;string&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Object ID&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td style=\"text-align:left\"&gt;&lt;code&gt;type&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;string&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Object type&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td style=\"text-align:left\"&gt;&lt;code&gt;ref_counter&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;integer&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;The number of &lt;a href=\"user-guide/storage/objects.html#ref_counter\"&gt;strong links&lt;/a&gt; to the object&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td style=\"text-align:left\"&gt;&lt;code&gt;supported_permissions&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;array&amp;lt;string&amp;gt;&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;List of supported access permissions&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td style=\"text-align:left\"&gt;&lt;code&gt;effective_acl&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;Acl&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Effective object ACL&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Some system objects have additional attributes: &lt;code&gt;inherit_acl&lt;/code&gt;, &lt;code&gt;acl&lt;/code&gt;, and &lt;code&gt;owner&lt;/code&gt;. They affect access to this object. These attributes are called an &lt;strong&gt;access control descriptor&lt;/strong&gt; (ACD). For more information about the ACD, see &lt;a href=\"user-guide/storage/access-control.html\"&gt;Managing access&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"ref_counter\"&gt;&lt;a href=\"en/user-guide/storage/objects.html#ref_counter\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Reference counters&lt;/span&gt;&lt;/a&gt;Reference counters&lt;/h3&gt;\n&lt;p&gt;&lt;strong&gt;Reference counters&lt;/strong&gt; are used to track the lifetime of an object. An object lives in the system as long as there are &lt;strong&gt;strong links&lt;/strong&gt; to it. The number of strong links can be found in the ref_counter attribute. As soon as this number reaches zero, the object turns into a &lt;strong&gt;zombie&lt;/strong&gt; and is subject to removal. It is not removed instantly: there is a special &lt;strong&gt;removal queue&lt;/strong&gt; (GC queue) from which zombies are taken in portions of a controlled size and destroyed. The size is set by the internal configuration parameters of the system. Once the object has become a zombie, you can no longer access it, even by explicitly building a path by ID.&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"en/user-guide/storage/objects.md","sourcePath":"en/user-guide/storage/objects.md"},"headings":[{"title":"Object types","href":"en/user-guide/storage/objects.html#object_types","level":2,"items":[{"title":"Files","href":"en/user-guide/storage/objects.html#files","level":3},{"title":"Tables","href":"en/user-guide/storage/objects.html#tables","level":3},{"title":"Links","href":"en/user-guide/storage/objects.html#links","level":3},{"title":"YSON documents","href":"en/user-guide/storage/objects.html#yson_doc","level":3},{"title":"Primitive types","href":"en/user-guide/storage/objects.html#primitive_types","level":3},{"title":"Internal objects","href":"en/user-guide/storage/objects.html#internal_objects","level":3}]},{"title":"Object IDs","href":"en/user-guide/storage/objects.html#object_ids","level":2},{"title":"Object attributes","href":"en/user-guide/storage/objects.html#attributes","level":2,"items":[{"title":"Reference counters","href":"en/user-guide/storage/objects.html#ref_counter","level":3}]}],"title":"Objects"},"router":{"pathname":"en/user-guide/storage/objects","depth":4,"base":"../../../"},"lang":"en","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/en/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-a29ea7877730322f2ce693378d06d02ac2b374cd-en","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
        </script>
