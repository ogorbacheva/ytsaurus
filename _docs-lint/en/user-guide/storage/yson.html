        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;This section contains information about YSON, a JSON-like data format.&lt;/p&gt;\n&lt;p&gt;The main differences between YSON and JSON are:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;Support for binary representation of scalar types (numbers, strings, and boolean types).&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"en/user-guide/storage/yson.html#attributes\"&gt;Attributes&lt;/a&gt;: Attributes are an arbitrary dict which can be set additionally on a literal of any type, including scalar ones.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;Besides that, there are syntactic differences:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;A semicolon is used as a separator instead of a comma.&lt;/li&gt;\n&lt;li&gt;In dicts, a key is not separated from a value by a colon, but by an equal sign: &lt;code&gt;=&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;String literals do not always have to be enclosed in quotes, but only if there is a parsing ambiguity.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;The following set of &lt;strong&gt;scalar&lt;/strong&gt; types is available:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;a href=\"en/user-guide/storage/yson.html#string\"&gt;Strings&lt;/a&gt; (&lt;code&gt;string&lt;/code&gt;).&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"en/user-guide/storage/yson.html#int\"&gt;Signed&lt;/a&gt; and &lt;a href=\"en/user-guide/storage/yson.html#uint\"&gt;unsigned&lt;/a&gt; 64-bit integers (&lt;code&gt;int64&lt;/code&gt; and &lt;code&gt;uint64&lt;/code&gt; ).&lt;/li&gt;\n&lt;li&gt;Double-precision &lt;a href=\"en/user-guide/storage/yson.html#double\"&gt;floating-point numbers&lt;/a&gt; (&lt;code&gt;double&lt;/code&gt;).&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"en/user-guide/storage/yson.html#boolean\"&gt;Boolean&lt;/a&gt; (logical) type (&lt;code&gt;boolean&lt;/code&gt;).&lt;/li&gt;\n&lt;li&gt;A &lt;a href=\"en/user-guide/storage/yson.html#entity\"&gt;special entity type&lt;/a&gt; with only one value, a literal &lt;code&gt;#&lt;/code&gt;.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;Scalar types usually have both textual and binary representation.&lt;/p&gt;\n&lt;p&gt;There are two &lt;strong&gt;composite&lt;/strong&gt; types:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;a href=\"en/user-guide/storage/yson.html#list\"&gt;List&lt;/a&gt; (&lt;code&gt;list&lt;/code&gt;).&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"en/user-guide/storage/yson.html#map\"&gt;Dict&lt;/a&gt; (&lt;code&gt;map&lt;/code&gt;).&lt;/li&gt;\n&lt;/ol&gt;\n&lt;h2 id=\"scalar_types\"&gt;&lt;a href=\"en/user-guide/storage/yson.html#scalar_types\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Scalar types&lt;/span&gt;&lt;/a&gt;Scalar types&lt;/h2&gt;\n&lt;h3 id=\"string\"&gt;&lt;a href=\"en/user-guide/storage/yson.html#string\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Strings&lt;/span&gt;&lt;/a&gt;Strings&lt;/h3&gt;\n&lt;p&gt;There are three types of string tokens:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;strong&gt;Identifiers&lt;/strong&gt; are strings that match the regular expression &lt;code&gt; [A-Za-z_][A-Za-z0-9_.\\-]*&lt;/code&gt;. It describes the set of possible C identifiers, extended with the &lt;code&gt;-&lt;/code&gt; and &lt;code&gt;.&lt;/code&gt; characters. An identifier specifies a string with identical content and is used primarily for brevity (no need to use quotes).&lt;/p&gt;\n&lt;p&gt;Examples:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;abc123&lt;/code&gt;;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;_&lt;/code&gt;;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;a-b&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;strong&gt;Text strings&lt;/strong&gt;: &lt;a href=\"https://en.wikipedia.org/wiki/Escape_sequences_in_C\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;C-escaped&lt;/a&gt; strings in double quotes.&lt;/p&gt;\n&lt;p&gt;Examples&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;\"abc123\"&lt;/code&gt;;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;\"\"&lt;/code&gt;;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;\"quotation-mark: \\\", backslash: \\\\, tab: \\t, unicode: \\xEA\"&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;strong&gt;Binary strings&lt;/strong&gt;: &lt;code&gt;\\x01 + length (protobuf sint32 wire format) + data (&amp;lt;length&amp;gt; bytes)&lt;/code&gt;.&lt;/p&gt;\n&lt;/li&gt;\n&lt;/ol&gt;\n&lt;h3 id=\"int\"&gt;&lt;a href=\"en/user-guide/storage/yson.html#int\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Signed 64-bit integers ()&lt;/span&gt;&lt;/a&gt;Signed 64-bit integers (&lt;code&gt;int64&lt;/code&gt;)&lt;/h3&gt;\n&lt;p&gt;Two methods of writing:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;strong&gt;Text&lt;/strong&gt; (&lt;code&gt;0&lt;/code&gt;, &lt;code&gt;123&lt;/code&gt;, &lt;code&gt;-123&lt;/code&gt;, &lt;code&gt;+123&lt;/code&gt;).&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Binary&lt;/strong&gt;: &lt;code&gt;\\x02 + value (protobuf sint64 wire format)&lt;/code&gt;.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;h3 id=\"uint\"&gt;&lt;a href=\"en/user-guide/storage/yson.html#uint\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Unsigned 64-bit integers ()&lt;/span&gt;&lt;/a&gt;Unsigned 64-bit integers (&lt;code&gt;uint64&lt;/code&gt;)&lt;/h3&gt;\n&lt;p&gt;Two methods of writing:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;strong&gt;Text&lt;/strong&gt; (&lt;code&gt;10000000000000&lt;/code&gt;, &lt;code&gt;123u&lt;/code&gt;).&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Binary&lt;/strong&gt;: &lt;code&gt;\\x06 + value (protobuf uint64 wire format)&lt;/code&gt;.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;h3 id=\"double\"&gt;&lt;a href=\"en/user-guide/storage/yson.html#double\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Floating-point numbers ()&lt;/span&gt;&lt;/a&gt;Floating-point numbers (&lt;code&gt;double&lt;/code&gt;)&lt;/h3&gt;\n&lt;p&gt;Two methods of writing:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;strong&gt;Text&lt;/strong&gt;: &lt;code&gt;0.0&lt;/code&gt;, &lt;code&gt;-1.0&lt;/code&gt;, &lt;code&gt;1e-9&lt;/code&gt;, &lt;code&gt;1.5E+9&lt;/code&gt;, &lt;code&gt;32E1&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Binary&lt;/strong&gt;: &lt;code&gt;\\x03 + protobuf double wire format&lt;/code&gt;.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Attention!&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Textual representation of floating-point numbers involves rounding. The result value may become different after a round of serialization and parsing. To store an accurate value, use binary representation.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"boolean\"&gt;&lt;a href=\"en/user-guide/storage/yson.html#boolean\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Boolean literals ()&lt;/span&gt;&lt;/a&gt;Boolean literals (&lt;code&gt;boolean&lt;/code&gt;)&lt;/h3&gt;\n&lt;p&gt;Two methods of writing:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;strong&gt;Text&lt;/strong&gt; (&lt;code&gt;%false&lt;/code&gt;, &lt;code&gt;%true&lt;/code&gt;).&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Binary&lt;/strong&gt; (&lt;code&gt;\\x04&lt;/code&gt;, &lt;code&gt;\\x05&lt;/code&gt;).&lt;/li&gt;\n&lt;/ol&gt;\n&lt;h3 id=\"entity\"&gt;&lt;a href=\"en/user-guide/storage/yson.html#entity\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Entity ()&lt;/span&gt;&lt;/a&gt;Entity (&lt;code&gt;entity&lt;/code&gt;)&lt;/h3&gt;\n&lt;p&gt;Entity is an atomic scalar value with no content of its own. There are various scenarios in which this type can be useful. For example, entity often means null. In addition, when a &lt;code&gt;get&lt;/code&gt; request is made to a &lt;a href=\"user-guide/storage/cypress.html\"&gt;Cypress&lt;/a&gt; subtree, &lt;a href=\"user-guide/storage/objects.html#files\"&gt;files&lt;/a&gt; and &lt;a href=\"user-guide/storage/objects.html#tables\"&gt;tables&lt;/a&gt; are returned as entities (actual data is stored in the &lt;a href=\"user-guide/storage/yson.html#attributes\"&gt;attributes&lt;/a&gt; of that node).&lt;/p&gt;\n&lt;p&gt;Lexically, entity is encoded by the &lt;code&gt;#&lt;/code&gt; symbol.&lt;/p&gt;\n&lt;h3 id=\"special_literals\"&gt;&lt;a href=\"en/user-guide/storage/yson.html#special_literals\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Special literals&lt;/span&gt;&lt;/a&gt;Special literals&lt;/h3&gt;\n&lt;p&gt;Special tokens:&lt;br /&gt;\n&lt;code&gt;;&lt;/code&gt;, &lt;code&gt;=&lt;/code&gt;, &lt;code&gt;#&lt;/code&gt;, &lt;code&gt;[&lt;/code&gt;, &lt;code&gt;]&lt;/code&gt;, &lt;code&gt;{&lt;/code&gt;, &lt;code&gt;}&lt;/code&gt;, &lt;code&gt;&amp;lt;&lt;/code&gt;, &lt;code&gt;&amp;gt;&lt;/code&gt;, &lt;code&gt;)&lt;/code&gt;, &lt;code&gt;/&lt;/code&gt;, &lt;code&gt;@&lt;/code&gt;, &lt;code&gt;!&lt;/code&gt;, &lt;code&gt;+&lt;/code&gt;, &lt;code&gt;^&lt;/code&gt;, &lt;code&gt;:&lt;/code&gt;, &lt;code&gt;,&lt;/code&gt;, &lt;code&gt;~&lt;/code&gt;.&lt;br /&gt;\nNot all of these symbols are used in YSON, some are used in &lt;a href=\"user-guide/storage/ypath.html\"&gt;YPath&lt;/a&gt;.&lt;/p&gt;\n&lt;h2 id=\"composite_types\"&gt;&lt;a href=\"en/user-guide/storage/yson.html#composite_types\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Composite types&lt;/span&gt;&lt;/a&gt;Composite types&lt;/h2&gt;\n&lt;h3 id=\"list\"&gt;&lt;a href=\"en/user-guide/storage/yson.html#list\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;List ()&lt;/span&gt;&lt;/a&gt;List (&lt;code&gt;list&lt;/code&gt;)&lt;/h3&gt;\n&lt;p&gt;Set as follows: &lt;code&gt;[value; ...; value]&lt;/code&gt; where &lt;code&gt;value&lt;/code&gt; is a literal of some scalar or composite type.&lt;/p&gt;\n&lt;p&gt;Example: &lt;code&gt;[1; \"hello\"; {a=1; b=2}]&lt;/code&gt;.&lt;/p&gt;\n&lt;h3 id=\"map\"&gt;&lt;a href=\"en/user-guide/storage/yson.html#map\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Dict ()&lt;/span&gt;&lt;/a&gt;Dict (&lt;code&gt;map&lt;/code&gt;)&lt;/h3&gt;\n&lt;p&gt;Set as follows: &lt;code&gt;{key = value; ...; key = value}&lt;/code&gt;. Here &lt;code&gt;*key*&lt;/code&gt; is a string literal and &lt;code&gt;value&lt;/code&gt; is a literals of some scalar or composite type.&lt;/p&gt;\n&lt;p&gt;Example: &lt;code&gt;{a = \"hello\"; \"38 parrots\" = [38]}&lt;/code&gt;.&lt;/p&gt;\n&lt;h3 id=\"attributes\"&gt;&lt;a href=\"en/user-guide/storage/yson.html#attributes\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Attributes&lt;/span&gt;&lt;/a&gt;Attributes&lt;/h3&gt;\n&lt;p&gt;It is possible to set attributes on any literal in YSON, in the following format: &lt;code&gt;&amp;lt;key = value; ...; key = value&amp;gt; value&lt;/code&gt;. Inside angle brackets, syntax is similar to the dict. For example, &lt;code&gt;&amp;lt;a = 10; b = [7,7,8]&amp;gt;\"some-string\"&lt;/code&gt; or &lt;code&gt;&amp;lt;\"44\" = 44&amp;gt;44&lt;/code&gt;. But most often attributes can be found on literals like &lt;code&gt;entity&lt;/code&gt;, for example, &lt;code&gt;&amp;lt;id=\"aaad6921-b5704588-17990259-7b88bad3\"&amp;gt;#&lt;/code&gt;.&lt;/p&gt;\n&lt;h2 id=\"working_from_code\"&gt;&lt;a href=\"en/user-guide/storage/yson.html#working_from_code\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Working with YSON from code&lt;/span&gt;&lt;/a&gt;Working with YSON from code&lt;/h2&gt;\n&lt;p&gt;Users usually do not have to work directly with YSON. When using one of the official YTsaurus clients, YSON structures will be expressed as follows:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;strong&gt;C++&lt;/strong&gt;:&lt;a href=\"https://github.com/ytsaurus/ytsaurus/blob/main/library/cpp/yson/node/node.h\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;&lt;code&gt;TNode&lt;/code&gt;&lt;/a&gt; is a class that provides dynamic DOM-like representation of a YSON document.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Python&lt;/strong&gt;: &lt;a href=\"https://github.com/ytsaurus/ytsaurus/blob/main/yt/python/yt/yson/yson_types.py\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;&lt;code&gt;YsonType&lt;/code&gt;&lt;/a&gt;: YSON types mimic Python types. You can get YSON attributes of object &lt;code&gt;x&lt;/code&gt; like this: &lt;code&gt;x.attributes&lt;/code&gt;, this is a Python dict.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Java&lt;/strong&gt;: &lt;a href=\"https://github.com/ytsaurus/ytsaurus/blob/main/yt/java/yson-tree/src/main/java/tech/ytsaurus/ysontree/YTreeNode.java\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;&lt;code&gt;YTreeNode&lt;/code&gt;&lt;/a&gt; is an interface that provides dynamic DOM-like representation of a YSON document.&lt;/li&gt;\n&lt;/ol&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"en/user-guide/storage/yson.md","sourcePath":"en/user-guide/storage/yson.md"},"headings":[{"title":"Scalar types","href":"en/user-guide/storage/yson.html#scalar_types","level":2,"items":[{"title":"Strings","href":"en/user-guide/storage/yson.html#string","level":3},{"title":"Signed 64-bit integers (int64)","href":"en/user-guide/storage/yson.html#int","level":3},{"title":"Unsigned 64-bit integers (uint64)","href":"en/user-guide/storage/yson.html#uint","level":3},{"title":"Floating-point numbers (double)","href":"en/user-guide/storage/yson.html#double","level":3},{"title":"Boolean literals (boolean)","href":"en/user-guide/storage/yson.html#boolean","level":3},{"title":"Entity (entity)","href":"en/user-guide/storage/yson.html#entity","level":3},{"title":"Special literals","href":"en/user-guide/storage/yson.html#special_literals","level":3}]},{"title":"Composite types","href":"en/user-guide/storage/yson.html#composite_types","level":2,"items":[{"title":"List (list)","href":"en/user-guide/storage/yson.html#list","level":3},{"title":"Dict (map)","href":"en/user-guide/storage/yson.html#map","level":3},{"title":"Attributes","href":"en/user-guide/storage/yson.html#attributes","level":3}]},{"title":"Working with YSON from code","href":"en/user-guide/storage/yson.html#working_from_code","level":2}],"title":"YSON"},"router":{"pathname":"en/user-guide/storage/yson","depth":4,"base":"../../../"},"lang":"en","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/en/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-a29ea7877730322f2ce693378d06d02ac2b374cd-en","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
        </script>
